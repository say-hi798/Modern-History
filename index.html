<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自考《中国近现代史纲要》题库 · 03708</title>
<style>
  :root{
    --bg:#f5efe3; --card:#fffdf7; --ink:#2b2320; --sub:#6f6257;
    --line:#e3d8c4; --red:#9a2d1f; --red2:#c0392b; --gold:#b7791f;
    --green:#2e7d4f; --blue:#2b5f8a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    line-height:1.7; font-size:15px;
  }
  h1,h2,h3,.serif{font-family:"Songti SC","STSong","SimSun",serif;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 16px 80px;}

  /* ===== Header ===== */
  header{
    background:linear-gradient(135deg,#7c2318,#9a2d1f 55%,#b7791f);
    color:#fdf6ea; padding:20px 0 0; box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .hd-inner{max-width:1000px; margin:0 auto; padding:0 16px;}
  .logo{font-size:26px; font-weight:700; letter-spacing:2px;}
  .logo small{display:block; font-size:12px; font-weight:400; opacity:.85; letter-spacing:1px; margin-top:2px;}
  nav{display:flex; gap:4px; margin-top:16px; flex-wrap:wrap;}
  nav button{
    background:transparent; border:none; color:#f8ecd9; padding:10px 16px;
    font-size:14px; cursor:pointer; border-radius:8px 8px 0 0; transition:.15s;
  }
  nav button:hover{background:rgba(255,255,255,.12);}
  nav button.active{background:var(--bg); color:var(--red); font-weight:700;}

  /* ===== Cards ===== */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:22px 24px; margin:18px 0; box-shadow:0 2px 6px rgba(60,40,10,.06);
  }
  .card h2{color:var(--red); font-size:22px; margin-bottom:12px;}
  .card h3{font-size:17px; margin:6px 0;}
  .sub{color:var(--sub); font-size:13px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
  .stat{
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--red);
    border-radius:10px; padding:14px 16px;
  }
  .stat b{font-size:24px; color:var(--red); display:block; line-height:1.2;}
  .stat span{font-size:12px; color:var(--sub);}

  .btn{
    display:inline-block; background:var(--red); color:#fff; border:none; cursor:pointer;
    padding:10px 22px; border-radius:8px; font-size:15px; transition:.15s;
  }
  .btn:hover{background:#7c2318;}
  .btn.ghost{background:#fff; color:var(--red); border:1px solid var(--red);}
  .btn.ghost:hover{background:#fbeee8;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.green{background:var(--green);} .btn.green:hover{background:#22633d;}

  /* ===== Chapter list ===== */
  .ch-item{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; margin:12px 0; cursor:pointer; transition:.15s;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .ch-item:hover{border-color:var(--red); box-shadow:0 3px 10px rgba(154,45,31,.12);}
  .ch-item .t{font-size:16px; font-weight:700;}
  .ch-item .t small{display:block; font-weight:400; color:var(--sub); font-size:12px; margin-top:2px;}
  .badge{
    display:inline-block; background:#f6e3dc; color:var(--red); font-size:12px;
    border-radius:20px; padding:2px 10px; white-space:nowrap;
  }
  .badge.real{background:#fdf0dc; color:var(--gold); border:1px solid #ecd9ae;}
  .badge.gray{background:#eee7db; color:var(--sub);}

  details.kp{border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin:8px 0; background:#fdfaf2;}
  details.kp summary{cursor:pointer; font-weight:700; color:var(--red);}
  details.kp ul{margin:10px 0 4px 20px;}
  details.note{border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin:10px 0; background:#fcf8ee;}
  details.note>summary{cursor:pointer; font-weight:700; color:var(--red); font-size:15.5px; padding:2px 0;}
  ol.kplist{list-style:none; counter-reset:item; margin:12px 0 4px 6px;}
  ol.kplist li{counter-increment:item; position:relative; padding:5px 6px 5px 30px; margin:4px 0; line-height:1.75; font-size:14.5px; border-bottom:1px dashed #efe7d4;}
  ol.kplist li:last-child{border-bottom:none;}
  ol.kplist li::before{content:counter(item); position:absolute; left:0; top:7px; width:19px; height:19px; background:var(--red); color:#fff; border-radius:50%; font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:700;}

  /* ===== 背诵笔记 · 知识点精编 ===== */
  .lv{display:inline-block; font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:20px; white-space:nowrap;}
  .lv-star{background:#fbeee8; color:var(--red);}
  .lv-hot{background:#fdf0dc; color:var(--gold); border:1px solid #ecd9ae;}
  .lv-warn{background:#eef4fa; color:var(--blue);}
  .lv-info{background:#eee7db; color:var(--sub);}
  .lv-legend{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px;}
  .kp-card{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:10px 0; background:#fffdf9;}
  .kp-top{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .kp-def{font-weight:700; font-size:15px; line-height:1.6;}
  .kp-keys{margin:9px 0 0 18px; font-size:14px;}
  .kp-keys li{margin:3px 0; line-height:1.7;}
  .kp-err,.kp-hook,.kp-add{margin-top:8px; padding:7px 10px; border-radius:0 6px 6px 0; font-size:13.5px; line-height:1.7;}
  .kp-err{background:#fbeee8; border-left:3px solid var(--red2);}
  .kp-hook{background:#eef4fa; border-left:3px solid var(--blue);}
  .kp-add{background:#f4f0e6; border-left:3px dashed var(--sub);}
  .kp-err b,.kp-hook b,.kp-add b{display:block; margin-bottom:2px;}
  .kp-err b{color:var(--red2);} .kp-hook b{color:var(--blue);}
  .must{margin-top:12px; padding:10px 12px; border:1px dashed var(--red); border-radius:8px; background:#fdf7ef;}
  .must>b{color:var(--red); font-size:14px;}
  .must ol{margin:6px 0 0 20px; font-size:13.5px; line-height:1.7;}
  @media print{
    header,nav,.timer,.foot,.btn,textarea{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:100%; padding:0;}
    .ch-item{border:none; padding:10px 0 2px; page-break-after:avoid;}
    details.kp{border:none; background:#fff; padding:4px 0;}
    details.kp summary{list-style:none;}
    details.note{border:none; background:#fff; padding:4px 0;}
    details.note>summary{list-style:none;}
    ol.kplist li{page-break-inside:avoid;}
  }

  /* ===== Question ===== */
  .q-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin:14px 0;}
  .q-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .q-tag{font-size:12px; padding:2px 10px; border-radius:20px;}
  .q-tag.single{background:#e8eef4; color:var(--blue);}
  .q-tag.short{background:#eef4e8; color:var(--green);}
  .q-tag.essay{background:#f6f0e3; color:var(--gold);}
  .q-title{font-size:16px; font-weight:600;}
  .q-title .idx{color:var(--red); font-weight:800; margin-right:6px;}
  .q-pts{margin-top:6px; font-size:12px; color:var(--sub);}
  .q-pts .point{background:#f2ecdf; border-radius:4px; padding:1px 6px; margin-right:4px;}

  .opt{
    display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line);
    border-radius:9px; padding:10px 14px; margin:8px 0; cursor:pointer; font-size:14.5px; transition:.12s;
  }
  .opt:hover{border-color:var(--gold); background:#fdf8ec;}
  .opt .k{font-weight:700; color:var(--red); margin-right:6px;}
  .opt.right{border-color:var(--green); background:#e9f4ec;}
  .opt.right .k{color:var(--green);}
  .opt.wrong{border-color:var(--red2); background:#fbe9e5;}
  .opt.dim{opacity:.5;}

  .explain{margin-top:10px; padding:10px 14px; border-left:3px solid var(--gold); background:#fbf6ea; border-radius:0 8px 8px 0; font-size:13.5px; display:none;}
  .explain.show{display:block;}

  textarea{
    width:100%; min-height:96px; border:1.5px solid var(--line); border-radius:9px;
    padding:10px 12px; font-size:14.5px; font-family:inherit; resize:vertical; background:#fff;
  }
  textarea:focus{outline:none; border-color:var(--red);}
  .score-line{margin-top:10px; font-size:14px;}
  .score-line b{color:var(--red);}
  .refans{margin-top:10px; padding:12px 14px; background:#eef4fa; border-radius:9px; font-size:13.5px; display:none;}
  .refans.show{display:block;}
  .refans h4{color:var(--blue); margin-bottom:4px;}

  .bar{height:8px; background:#eee5d3; border-radius:5px; overflow:hidden; margin-top:8px;}
  .bar i{display:block; height:100%; background:var(--red); border-radius:5px; transition:width .3s;}

  /* ===== Exam ===== */
  .timer{
    position:sticky; top:0; z-index:20; background:var(--red); color:#fff;
    text-align:center; padding:8px; font-size:18px; font-weight:700; letter-spacing:2px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .result-big{text-align:center; padding:30px;}
  .result-big .score{font-size:64px; color:var(--red); font-weight:800; font-family:"Songti SC",serif;}
  .result-big .pass{color:var(--green);}
  .result-big .fail{color:var(--red2);}

  table.rec{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.rec th,table.rec td{border:1px solid var(--line); padding:8px 10px; text-align:left;}
  table.rec th{background:#f4ecdd;}

  .foot{margin-top:30px; color:var(--sub); font-size:12px; text-align:center;}
  .modal-mask{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100;}
  .modal-mask.show{display:flex;}
  .modal{background:#fffdf7; border-radius:14px; padding:28px; max-width:420px; width:92%; text-align:center;}
  .notice{background:#fdf3d7; border:1px solid #ecd9ae; color:#7a5a14; padding:10px 14px; border-radius:9px; margin:10px 0; font-size:13px;}

  /* ===== 手机端适配 ===== */
  button,.opt,.ch-item,summary{-webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  @media (max-width:720px){
    body{font-size:14px;}
    .wrap{padding:0 10px calc(70px + env(safe-area-inset-bottom));}
    header{padding-top:calc(20px + env(safe-area-inset-top));}
    .hd-inner{padding:0 10px;}
    .logo{font-size:20px; letter-spacing:1px;}
    nav{gap:3px; margin-top:10px; flex-wrap:wrap;}
    nav button{padding:7px 7px; font-size:12.5px;}
    .card{padding:16px 14px; margin:12px 0; border-radius:10px;}
    .card h2{font-size:19px;}
    .grid{grid-template-columns:repeat(2,1fr); gap:10px;}
    .q-card{padding:15px 13px; margin:12px 0; border-radius:10px;}
    .q-title{font-size:15px;}
    .ch-item{padding:14px 12px; border-radius:10px; flex-wrap:wrap;}
    .ch-item .t{font-size:15px;}
    .stat{padding:12px 13px;}
    .stat b{font-size:20px;}
    .opt{padding:10px 11px; font-size:14px;}
    .btn{padding:9px 16px; font-size:14px;}
    details.kp,details.note{padding:10px 12px;}
    .kp-card{padding:11px 11px; margin:9px 0;}
    .kp-def{font-size:14.5px;}
    .kp-keys{font-size:13.5px; margin-left:16px;}
    .kp-err,.kp-hook,.kp-add{font-size:13px;}
    .must ol{font-size:13px;}
    ol.kplist li{font-size:14px;}
    textarea{font-size:16px;}
    .timer{font-size:16px; padding:7px;}
    .result-big{padding:20px 8px;}
    .result-big .score{font-size:46px;}
    table.rec{font-size:12px; white-space:nowrap;}
    table.rec th,table.rec td{padding:6px 5px;}
    .modal{padding:20px 16px; width:96%;}
    .foot{padding:0 10px;}
    .sub{font-size:12.5px;}
  }
  @media (hover:none){
    .opt:hover{border-color:var(--line); background:#fff;}
    .btn:hover{background:var(--red);}
    .btn.ghost:hover{background:#fff;}
    .ch-item:hover{border-color:var(--line); box-shadow:none;}
    nav button:hover{background:transparent;}
  }
</style>

    "清政府实行闭关锁国政策，对外贸易仅限广州一口，由十三行垄断经营。",
    "同时期欧美资本主义迅速发展，英国率先完成工业革命，急于扩大海外市场和原料产地。",
    "为扭转对华贸易逆差，英国向中国大量走私鸦片，造成白银外流、银贵钱贱，直接引发禁烟运动。"
  ]},
  {h:"1.2 列强的军事侵略与不平等条约", items:[
    "1840年6月，英国发动鸦片战争；1842年8月，清政府被迫签订中国近代史上第一个不平等条约《南京条约》。",
    "《南京条约》规定割让香港岛、赔款2100万银元、开放广州、厦门、福州、宁波、上海五口通商、协定关税。",
    "1843年英国强迫签订《虎门条约》等，取得领事裁判权、片面最惠国待遇；1844年美、法分别强迫签订《望厦条约》《黄埔条约》。",
    "1856—1860年，英法发动第二次鸦片战争，1858年签订《天津条约》，1860年签订《北京条约》，英法联军火烧圆明园。",
    "第二次鸦片战争期间，沙俄通过《瑷珲条约》《北京条约》等割占中国东北、西北领土共150多万平方公里。",
    "1883—1885年中法战争，中国军民取得镇南关大捷，但清政府妥协求和，签订《中法新约》，中国「不败而败」。",
    "1894—1895年甲午中日战争，1895年4月签订《马关条约》，割让台湾全岛及附属岛屿、澎湖列岛，赔款2亿两白银，允许日本在通商口岸设厂。",
    "1900年，英、美、德、法、俄、日、意、奥八国联军发动侵华战争，攻占北京；1901年9月签订《辛丑条约》。",
    "《辛丑条约》规定赔款4.5亿两白银（本息合计约9.8亿两），外国军队驻扎北京及使馆区，清政府成为「洋人的朝廷」。"
  ]},
  {h:"1.3 资本-帝国主义对中国的政治控制与经济掠夺", items:[
    "列强通过不平等条约取得领事裁判权，严重破坏中国的司法主权。",
    "列强长期把持中国海关（如赫德任海关总税务司近半个世纪），控制中国的财政经济命脉。",
    "列强在中国通商口岸设立租界（如上海租界），形成「国中之国」。",
    "列强控制中国的通商口岸、内河航运和铁路修筑权，倾销商品、掠夺原料。",
    "甲午战争后，列强对华资本输出急剧扩大，开设银行、兴办工厂、开采矿山，垄断中国经济命脉。",
    "甲午战争后，列强掀起瓜分中国的狂潮：划分势力范围、强占租借地，如德国强占胶州湾、俄国强租旅大、英国强租威海卫与新界、法国强租广州湾。",
    "1899年，美国提出「门户开放」政策，要求各国在华机会均等，同时承认各国势力范围。"
  ]},
  {h:"1.4 近代中国社会的半殖民地半封建性质", items:[
    "外国资本-帝国主义的侵略，是近代中国贫穷落后的总根源。",
    "鸦片战争后，中国由独立的封建社会逐步沦为半殖民地半封建社会，这是近代中国最基本的国情。",
    "半殖民地是指国家主权部分丧失、形式上仍保持独立；半封建是指封建自然经济逐步解体，但封建制度仍占统治地位，同时资本主义有所发展。",
    "《南京条约》签订使中国开始沦为半殖民地半封建社会，《马关条约》签订使半殖民地化程度大大加深，《辛丑条约》签订后中国完全沦为半殖民地半封建社会。",
    "帝国主义既勾结封建势力压迫中国人民，又阻碍中国资本主义的发展，是近代中国一切灾难的总根源。"
  ]},
  {h:"1.5 两对主要矛盾与两大历史任务", items:[
    "近代中国社会的主要矛盾是帝国主义与中华民族的矛盾、封建主义与人民大众的矛盾，其中帝国主义与中华民族的矛盾是最主要的矛盾。",
    "近代以来中华民族面临的两大历史任务：一是求得民族独立和人民解放；二是实现国家繁荣富强和人民共同富裕。",
    "两大历史任务既相互区别又相互联系，求得民族独立和人民解放是前提，实现国家繁荣富强和人民共同富裕是目的。",
    "近代中国半殖民地半封建的社会性质，决定了近代中国的两大历史任务。"
  ]},
  {h:"1.6 人民群众的反侵略斗争", items:[
    "1841年5月，广州三元里人民奋起抗击英国侵略军，是近代中国史上中国人民第一次大规模的反侵略武装斗争。",
    "第二次鸦片战争期间，广州、天津等地人民自发抗击英法联军，打击了侵略者的气焰。",
    "爱国官兵英勇抗敌：关天培战死虎门、陈化成战死吴淞、左宝贵战死平壤、邓世昌在黄海海战中壮烈殉国。",
    "中法战争期间，冯子材率军取得镇南关大捷。",
    "1895年《马关条约》签订后，台湾人民在刘永福、徐骧等领导下开展反割台武装斗争。",
    "1900年前后，义和团运动以农民为主体开展反帝斗争，粉碎了帝国主义瓜分中国的图谋。"
  ]},
  {h:"1.7 反侵略战争失败的原因", items:[
    "近代中国人民反侵略战争屡遭失败，根本原因是社会制度的腐败，即清王朝封建统治的腐朽。",
    "社会制度腐败的主要表现：统治者腐败无能、压制民众反抗、军事上妥协退让。",
    "经济技术落后是反侵略战争失败的又一重要原因，中国的武器装备、军事技术等远逊于侵略者。",
    "社会制度腐败是根本原因，经济技术落后是重要原因，社会制度腐败导致经济技术落后，经济技术落后又加剧了反侵略斗争的失败。"
  ]},
  {h:"1.8 民族意识的觉醒", items:[
    "林则徐是近代中国「开眼看世界的第一人」，主持编译《四洲志》。",
    "魏源在林则徐《四洲志》基础上编成《海国图志》，提出「师夷长技以制夷」的思想。",
    "19世纪七八十年代，早期维新思想家郑观应著《盛世危言》，主张学习西方、实行君主立宪。",
    "严复翻译《天演论》，以「物竞天择、适者生存」的进化论思想警醒国人，号召救亡图存。",
    "1894年孙中山创立兴中会，提出「振兴中华」的口号，标志着民族意识的新觉醒。",
    "甲午战争后，民族意识普遍觉醒，救亡图存成为时代主旋律。"
  ]},
  {h:"1.9 全章题目要点速记", items:[
    "1841年5月，广州三元里人民自发抗击英国侵略军，是近代史上中国人民第一次大规模的反侵略武装斗争。",
    "第一次鸦片战争发生于1840—1842年，1842年8月签订《南京条约》，中国开始沦为半殖民地半封建社会，1840年成为中国近代史的起点。",
    "鸦片战争前中国处于封建社会，主要矛盾是地主阶级与农民阶级的矛盾；资本主义萌芽受封建制度束缚，发展缓慢。",
    "中国封建社会的基本特点是：自然经济占主导地位，高度中央集权的封建君主专制，儒家思想占统治地位，族权与政权相结合的封建宗法等级制度。",
    "中国封建社会政治上实行高度中央集权的封建君主专制制度，皇帝拥有至高无上的权力。",
    "中国封建社会在文化上以儒家思想占统治地位，并与佛、道思想相互渗透。",
    "中国封建社会结构上形成族权和政权相结合的封建宗法等级制度，其核心是宗族家长制。",
    "鸦片战争前夕，清王朝已由盛转衰，处于衰世，政治腐败、军备废弛、财政拮据、社会危机四伏。",
    "1843年，英国强迫清政府签订《五口通商章程》和《虎门条约》，攫取领事裁判权等特权。",
    "1860年《北京条约》规定，将九龙半岛南部即九龙司地方一区割让给英国。",
    "《马关条约》的主要内容：割让台湾全岛及所有附属各岛屿和澎湖列岛，赔偿军费2亿两白银，开放沙市、重庆、苏州、杭州为通商口岸，允许日本在通商口岸开设工厂。",
    "甲午战争前列强对华经济侵略以商品输出为主，战后转为以资本输出为主，允许日本在华设厂即其重要标志。",
    "《辛丑条约》规定清政府赔款4.5亿两白银，本息合计约9.8亿两，拆毁大沽炮台，外国军队可驻扎北京至山海关铁路沿线要地。",
    "《辛丑条约》划定北京东交民巷为使馆区，各国可以驻兵，中国人不得居住。",
    "从19世纪60年代起，英国人赫德长期把持中国海关，中国海关行政权被外国攫取。",
    "列强对中国进行文化渗透的主要手段是宗教渗透、创办学校、发行书报，传播殖民思想，奴化中国民众。",
    "《南京条约》中的协定关税条款，使中国开始丧失关税自主权。",
    "鸦片战争及《南京条约》的签订，是中国开始沦为半殖民地半封建社会的标志；半殖民地即形式上有独立之名，实际上政治经济受帝国主义控制。",
    "在近代中国社会，资本—帝国主义侵略势力成为支配中国的决定性力量。",
    "中国封建势力与帝国主义相互勾结，成为帝国主义统治和奴役中国的社会支柱。",
    "近代中国民族资本主义有所发展，但始终没有成为中国社会经济的主要形式。",
    "近代中国经济政治发展极不平衡，广大人民贫困和不自由的程度是世界所少见的。",
    "19世纪70年代，左宗棠率军西征，1878年基本收复新疆（伊犁除外），1884年清政府在新疆建省。",
    "1895年威海卫之战北洋海军战败，提督丁汝昌拒绝投降，自杀殉国。",
    "义和团运动于1898年前后兴起于山东、直隶一带，1900年发展到京津地区。",
    "1900年八国联军侵华时，清军将领聂士成在天津保卫战中英勇抗击侵略军，壮烈殉国。",
    "资本—帝国主义始终没有能够灭亡中国，一个重要原因是中国人民的英勇反抗。",
    "近代中国反侵略战争失败的根本原因是社会制度腐败，重要原因是经济技术落后。",
    "林则徐、魏源是近代中国开眼看世界的第一批人，林则徐主持编译《四洲志》，魏源编成《海国图志》。",
    "严复翻译《天演论》，以「物竞天择、适者生存」的进化论警醒国人，用意在于宣传变法图强。",
    "1894年孙中山在《上李鸿章书》中提出「人尽其才，地尽其利，物尽其用，货畅其流」的富强主张。",
    "近代中国半殖民地半封建社会的基本特点之一是：帝国主义侵略势力成为支配中国的决定性力量，封建势力与之勾结，成为其统治中国的社会支柱。",
    "近代中国半殖民地半封建社会的基本特点还包括：自然经济遭破坏而封建地主土地所有制仍保持，民族资本主义有所发展但非主要形式，经济政治发展极不平衡，人民贫困不自由程度世界所少见。",
    "近代中国社会的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，其中帝国主义和中华民族的矛盾是最主要的矛盾。",
    "两对主要矛盾相互交织：帝国主义勾结封建势力共同压榨中国人民，封建势力是帝国主义统治中国的工具和支柱；不同时期两对矛盾各有突出。"
  ]}
 ]},

{ch:2, no:"第二章", title:"对国家出路的早期探索", period:"上编 · 1840—1919",
 parts:[
  {h:"2.1 太平天国农民战争的兴起与经过", items:[
    "1851年1月，洪秀全在广西桂平县金田村发动起义，建号太平天国，史称金田起义。",
    "1851年9月，太平军攻克永安后封王建制，初步建立革命政权。",
    "1853年3月，太平军攻克南京并定为都城，改名天京，正式建立与清政府对峙的农民政权。",
    "太平天国定都天京后发动北伐与西征，1856年上半年在军事上达到全盛。",
    "1856年9月发生天京事变，杨秀清被杀、韦昌辉被处死、石达开率部出走，太平天国由盛转衰。",
    "1864年6月洪秀全病逝，7月天京陷落，历时14年（1851—1864）的太平天国农民战争失败。",
    "太平天国势力扩展到18个省，沉重打击了清王朝的封建统治和外国侵略势力。"
  ]},
  {h:"2.2 《天朝田亩制度》与《资政新篇》", items:[
    "1853年冬，太平天国颁布《天朝田亩制度》，以解决农民土地问题为中心，是太平天国的纲领性文件。",
    "《天朝田亩制度》规定「凡天下田，天下人同耕」，按人口平均分配土地，描绘了「无处不均匀，无人不饱暖」的理想社会。",
    "《天朝田亩制度》从根本上否定了封建地主土地所有制，具有历史进步性。",
    "《天朝田亩制度》体现绝对平均主义思想，违背社会发展规律，只是一种无法实现的空想。",
    "1859年，洪仁玕提出《资政新篇》，是近代中国第一个比较系统的带有资本主义色彩的社会改革方案。",
    "《资政新篇》主张发展近代工矿、交通、邮政、金融事业，兴办学校医院，主张同外国平等交往、学习西方先进技术。",
    "《资政新篇》未触及封建土地制度，缺乏实现的阶级基础和社会条件，因而未能付诸实施。"
  ]},
  {h:"2.3 太平天国失败的原因与教训", items:[
    "太平天国失败的根本原因在于农民阶级的局限性：缺乏科学理论指导，提不出正确的革命纲领。",
    "太平天国领导集团进城后贪图享乐、争权夺利，内部腐败削弱了自身力量。",
    "太平天国没有正确对待西方侵略者，一度把外国侵略者视为「洋兄弟」，缺乏反帝的自觉认识。",
    "太平天国在军事上出现战略失误，如孤军北伐、缺乏后方支援等。",
    "太平天国运动是中国旧式农民战争的最高峰，动摇了清王朝的统治基础。",
    "太平天国运动的教训：单纯的农民战争不能完成反帝反封建的历史任务，农民阶级不能领导中国民主革命取得胜利。"
  ]},
  {h:"2.4 洋务运动的兴起", items:[
    "洋务运动兴起于19世纪60年代，是清政府在内忧外患（太平天国运动和第二次鸦片战争）形势下兴起的「自救」运动。",
    "洋务派中央以恭亲王奕䜣为代表，地方以曾国藩、李鸿章、左宗棠、张之洞等为代表。",
    "洋务派主张「中学为体，西学为用」，即在不触动封建制度的前提下学习西方的军事和科学技术。",
    "洋务运动以「自强」「求富」为口号，前期以「自强」为主兴办军用工业，后期以「求富」为主兴办民用企业。"
  ]},
  {h:"2.5 洋务运动的主要内容", items:[
    "兴办近代军用工业：1861年曾国藩创办安庆内军械所，1865年李鸿章在上海创办江南制造总局，1866年左宗棠创办福州船政局。",
    "兴办近代民用企业：以官督商办为主，如1872年李鸿章创办的上海轮船招商局，以及开平矿务局、汉阳铁厂等。",
    "创办新式学堂：1862年设立京师同文馆（第一所官办新式学堂），还创办福州船政学堂、天津北洋水师学堂等。",
    "向国外派遣留学生：1872年起清政府先后派遣四批幼童赴美国留学。",
    "筹建近代海军：先后建立南洋、北洋、福建三支海军，1888年李鸿章建成的北洋海军（北洋水师）实力最强。",
    "1894—1895年甲午战争惨败，北洋海军全军覆没，标志着洋务运动的失败。"
  ]},
  {h:"2.6 洋务运动的历史作用与失败原因", items:[
    "洋务运动客观上促进了中国早期工业和民族资本主义的产生与发展，是中国近代化的开端。",
    "洋务运动传播了西方近代科学技术知识，培养了一批科技、军事和翻译人才。",
    "洋务运动冲击了重农抑商、鄙视工艺等传统观念，促进了社会风气的变化。",
    "洋务运动失败的根本原因在于其封建性：企图在不改变封建制度的前提下实现「自强」，违背了历史发展规律。",
    "洋务企业具有浓厚的封建性（衙门式管理）、依赖性（依赖外国、受制于人）和腐朽性（管理腐败、效率低下）。",
    "甲午战败证明，仅靠学习西方技术的「中体西用」道路救不了中国，洋务运动不能使中国富强。"
  ]},
  {h:"2.7 戊戌维新运动的兴起", items:[
    "1895年5月，康有为联合在京应试的一千三百多名举人上书光绪帝，反对签订《马关条约》，史称「公车上书」，揭开了维新运动的序幕。",
    "维新派代表人物有康有为、梁启超、谭嗣同、严复等，其中康有为是维新运动的领袖。",
    "康有为著《新学伪经考》《孔子改制考》，以「托古改制」为维新变法提供理论依据。",
    "维新派组织强学会（1895年）、保国会（1898年）等政治团体，创办《时务报》（梁启超主笔）、《国闻报》（严复创办）等报刊宣传变法。",
    "严复翻译《天演论》，宣传进化论思想，为维新运动提供了思想武器。",
    "维新派与守旧派围绕要不要变法、要不要兴民权设议院、要不要废八股改科举兴西学展开论战，这是资产阶级思想与封建主义思想的第一次正面交锋。"
  ]},
  {h:"2.8 百日维新", items:[
    "1898年6月11日，光绪帝颁布「明定国是」诏书，宣布变法，史称戊戌变法或百日维新。",
    "变法涉及政治（改革行政机构、裁撤冗员、准许官民上书言事）、经济（鼓励发展农工商业、设立铁路矿务总局）、军事（裁减绿营、编练新军）、文教（废除八股、改试策论、设立京师大学堂）等方面。",
    "1898年9月21日，慈禧太后发动戊戌政变，囚禁光绪帝，镇压维新派，变法前后历时103天而失败。",
    "戊戌政变后，谭嗣同、康广仁、林旭、杨深秀、杨锐、刘光第六人被杀害，史称「戊戌六君子」。",
    "京师大学堂是戊戌变法中保留下来的唯一成果，后成为北京大学的前身。",
    "戊戌变法是自上而下的资产阶级性质的政治改良运动，也是一次爱国救亡运动。"
  ]},
  {h:"2.9 戊戌维新运动的意义与教训", items:[
    "戊戌维新运动是一次爱国救亡运动，以救亡图存为己任，激发了人们的爱国热情和民族意识。",
    "戊戌维新运动是一场资产阶级性质的政治改良运动，主张兴民权、设议院、实行君主立宪，冲击了封建专制制度。",
    "戊戌维新运动是一场思想启蒙运动，传播了资产阶级新文化新思想，促进了中国人民的思想解放。",
    "戊戌维新运动促进了近代教育、出版、新闻等事业的发展。",
    "维新派幻想依靠没有实权的皇帝和帝国主义支持，脱离人民群众，不敢否定封建主义，暴露出资产阶级的软弱性和妥协性，这是其失败的根本原因。",
    "戊戌维新失败的教训：资产阶级改良主义道路在半殖民地半封建的中国行不通，要救中国必须用革命的手段。"
  ]},
  {h:"2.10 全章题目要点速记", items:[
    "谭嗣同撰写《仁学》，猛烈抨击封建纲常礼教，宣传变法维新思想。",
    "太平天国失败的根本原因在于农民阶级的阶级局限性：农民不是新的生产力和生产关系的代表，缺乏先进阶级即无产阶级的领导，提不出科学的革命纲领。",
    "太平天国的教训是：单纯的农民战争不可能完成反帝反封建的任务，中国革命的胜利必须有先进阶级和先进政党的领导。",
    "太平天国农民战争沉重打击了封建统治阶级，强烈撼动了清政府的统治根基，是中国旧式农民战争的最高峰。",
    "太平天国批判孔子及儒家经典，一定程度上削弱了封建统治的精神支柱，有力打击了外国侵略势力，鼓舞了亚洲各国人民的民族解放运动。",
    "1861年，清政府设立总理各国事务衙门，综理洋务及外交事务。",
    "19世纪末，梁启超在《变法通议》中系统宣传变法维新的主张，指出变法是历史发展的必然。",
    "冯桂芬在《校邠庐抗议》中最先完整表述了「中学为体，西学为用」的洋务指导思想。",
    "洋务运动时期，清政府派遣了第一批赴美留学生，开中国近代派遣留学生之先河。",
    "天京事变后，太平天国后期主要依靠陈玉成、李秀成支撑军事局面。",
    "《天朝田亩制度》设计了「有田同耕，有饭同食」的绝对平均主义理想社会。",
    "1861年安庆保卫战失败、安庆失陷，天京失去屏障，太平天国陷入更加困难的境地。",
    "太平天国起义之初实行圣库制度，一切财物归公、按需分配，体现了平均主义的社会理想。",
    "洋务运动兴起的直接目的是挽救清政府的统治危机，是在内忧外患形势下开展的自救运动。",
    "1895年2月，北洋海军在威海卫全军覆没，标志着洋务运动的破产。",
    "洋务运动时期创办天津水师学堂等新式学堂，专门培养海军与造船人才。",
    "洋务运动的性质是封建地主阶级在不触动封建制度前提下学习西方技术的自救运动。",
    "洋务运动失败的根本原因是封建制度的束缚；它与戊戌维新运动失败的共同原因，是都没有触动封建制度的根基。",
    "「中学为体，西学为用」中的「体」指中国的封建制度及其纲常名教，即在不动摇封建制度的前提下学习西方。",
    "洋务运动后期以「求富」为口号，主要兴办民用工业，如轮船招商局、开平矿务局等。",
    "康有为著《新学伪经考》《孔子改制考》，借经学宣传变法维新思想。",
    "1895年康有为、梁启超在北京创办《万国公报》，后改名《中外纪闻》，宣传变法。",
    "1898年戊戌政变后，慈禧太后将光绪帝囚禁于中南海瀛台，重新临朝训政。",
    "1895年《马关条约》签订的消息传到北京，康有为联合在京应试举人上书光绪帝，史称公车上书，冲破了士人不得干政的禁令，拉开了维新变法运动的序幕。",
    "戊戌维新运动最突出的历史贡献，是宣传了资产阶级新思想，起到了思想启蒙的作用。",
    "太平天国、洋务运动、戊戌维新运动发生的共同时代背景，是中国逐渐沦为半殖民地半封建社会。",
    "太平天国后期，外国侵略者组建洋枪队等武装，与清政府联合绞杀太平军。",
    "镇压太平天国农民战争的主要清军是曾国藩的湘军和李鸿章的淮军。",
    "洋务派创办军事工业的主要目的，既在于镇压农民起义，也在于加强国防力量。",
    "太平天国、洋务运动、戊戌维新运动失败的共同原因是：农民阶级的阶级局限性、洋务派只学技术而不触动封建制度、维新派资产阶级的软弱性，三者都不彻底，都未提出并坚持彻底的反帝反封建纲领。",
    "历史启示：农民阶级、地主阶级洋务派和资产阶级维新派都不能领导中国革命取得胜利，中国近代民族民主革命的胜利必须有先进阶级及其政党的领导。"
  ]}
 ]},

{ch:3, no:"第三章", title:"辛亥革命", period:"上编 · 1840—1919",
 parts:[
  {h:"3.1 辛亥革命的历史背景", items:[
    "《辛丑条约》签订后，清政府完全成为帝国主义统治中国的工具，民族危机和社会危机空前加深。",
    "1901年起清政府推行「新政」，1906年宣布「预备仿行立宪」，1908年颁布《钦定宪法大纲》，但都是为了维护封建统治，并未挽救危机。",
    "20世纪初，中国民族资本主义初步发展，民族资产阶级力量不断壮大，为资产阶级革命准备了阶级基础。",
    "1905年，清政府下令废除科举制度，各地兴办新式学堂，客观上有利于革命思想的传播。",
    "辛亥革命前夜，全国各地抗捐抗税、抢米风潮等群众自发斗争此起彼伏，清朝统治基础严重动摇。"
  ]},
  {h:"3.2 兴中会与中国同盟会", items:[
    "1894年11月，孙中山在檀香山创立兴中会，提出「振兴中华」的口号，是近代中国第一个资产阶级革命团体。",
    "1895年10月，兴中会策划广州起义未果，孙中山流亡海外，继续宣传革命。",
    "20世纪初，章太炎著《驳康有为论革命书》，邹容著《革命军》，陈天华著《警世钟》《猛回头》，宣传民主革命思想。",
    "1904年，黄兴、宋教仁等在长沙成立华兴会，蔡元培、陶成章等在上海成立光复会。",
    "1905年8月20日，孙中山联合兴中会、华兴会、光复会等在日本东京成立中国同盟会，孙中山被推举为总理。",
    "同盟会以「驱除鞑虏，恢复中华，创立民国，平均地权」为纲领，是近代中国第一个全国性的资产阶级革命政党。",
    "1905年11月，同盟会机关报《民报》在东京创刊，孙中山在发刊词中将同盟会纲领概括为三民主义。"
  ]},
  {h:"3.3 三民主义学说", items:[
    "三民主义即民族主义、民权主义、民生主义，是孙中山的资产阶级民主革命纲领。",
    "民族主义即「驱除鞑虏，恢复中华」，以革命手段推翻清王朝统治，反对民族压迫。",
    "民权主义即「创立民国」，推翻封建君主专制制度，建立资产阶级共和国。",
    "民生主义即「平均地权」，核定地价、涨价归公，试图解决土地问题、防止贫富悬殊。",
    "三民主义是比较完整的资产阶级民主革命纲领，反映了中国人民要求民族独立和民主权利的共同愿望。",
    "三民主义的局限性：没有明确提出反对帝国主义的口号，没有彻底的土地革命纲领，反映了民族资产阶级的软弱性和妥协性。"
  ]},
  {h:"3.4 革命派与改良派的论战", items:[
    "1905—1907年，以《民报》为代表的革命派与以《新民丛报》为代表的改良派（保皇派）展开大论战。",
    "论战的主要内容：要不要以革命手段推翻清王朝，要不要推翻帝制、实行共和，要不要进行社会革命（平均地权）。",
    "论战的焦点是「要不要以革命手段推翻清王朝」。",
    "论战划清了革命与改良的界限，使民主革命思想深入人心，为辛亥革命作了思想舆论准备。",
    "论战也暴露了革命派在反帝和土地问题上的理论局限。"
  ]},
  {h:"3.5 革命党人的武装起义", items:[
    "1906年12月，同盟会会员刘道一等发动萍浏醴起义，是同盟会成立后发动的第一次武装起义。",
    "1907年，孙中山在广东、广西发动潮州黄冈、惠州七女湖、钦廉防城、镇南关等一系列起义，均告失败。",
    "1911年4月27日，黄兴等发动广州起义（黄花岗起义），起义失败后牺牲者合葬于黄花岗，史称「黄花岗七十二烈士」。",
    "1907年，光复会会员徐锡麟发动安庆起义失败牺牲，秋瑾在绍兴英勇就义。",
    "革命党人还多次开展暗杀清廷要员的行动，如1910年汪精卫等谋刺摄政王载沣。",
    "各次武装起义虽然失败，但打击了清朝统治，扩大了革命影响，为武昌起义准备了条件。"
  ]},
  {h:"3.6 武昌起义与全国响应", items:[
    "1911年5月起，四川等省爆发反对清政府「铁路国有」政策的保路运动，清政府调湖北新军入川镇压，武昌兵力空虚。",
    "1911年10月10日，武昌新军中的革命团体文学社、共进会发动起义，占领武昌，史称武昌起义。",
    "武昌起义后，湖南、陕西等省纷纷响应，到1911年11月，全国十多个省宣布脱离清政府独立，清朝统治土崩瓦解。",
    "1911年12月29日，各省都督府代表会议选举孙中山为中华民国临时大总统。",
    "1912年1月1日，孙中山在南京宣誓就职，中华民国临时政府成立，改用公历、以中华民国纪元。"
  ]},
  {h:"3.7 中华民国的建立与《临时约法》", items:[
    "1912年1月1日，中华民国南京临时政府成立，孙中山任临时大总统，这是中国历史上第一个资产阶级共和国政府。",
    "南京临时政府颁布了一系列有利于发展资本主义经济、文化教育的政策法令，是资产阶级共和国性质的革命政权。",
    "1912年2月12日，清帝溥仪宣布退位，结束了中国两千多年的封建君主专制制度。",
    "1912年3月，孙中山颁布《中华民国临时约法》，这是中国历史上第一部具有资产阶级共和国宪法性质的法典性文件。",
    "《临时约法》规定中华民国主权属于国民全体，确立行政、立法、司法三权分立的政治体制。",
    "1912年4月1日，孙中山被迫辞去临时大总统职务，袁世凯在北京就任临时大总统，辛亥革命的果实被袁世凯窃取，政权落入北洋军阀手中。"
  ]},
  {h:"3.8 辛亥革命的历史意义", items:[
    "辛亥革命推翻了清王朝的统治，结束了统治中国两千多年的封建君主专制制度，建立了资产阶级共和国。",
    "辛亥革命使民主共和观念深入人心，促进了中国人民的思想解放。",
    "辛亥革命促进了民族资本主义经济的发展，南京临时政府颁布奖励实业等法令。",
    "辛亥革命打击了帝国主义在华的侵略势力，推动了亚洲各国民族解放运动的高涨。",
    "辛亥革命是近代中国比较完全意义上的资产阶级民主革命，是二十世纪中国的第一次历史性巨变。",
    "辛亥革命没有改变中国半殖民地半封建的社会性质，没有完成反帝反封建的历史任务。"
  ]},
  {h:"3.9 辛亥革命失败的原因与教训", items:[
    "辛亥革命的胜利果实被袁世凯窃取，革命没有改变半殖民地半封建社会的性质，没有完成反帝反封建的历史任务，因而是失败的。",
    "辛亥革命失败的客观原因：中外反动势力勾结，反革命力量强大，帝国主义支持袁世凯。",
    "辛亥革命失败的根本原因：资产阶级的软弱性和妥协性。",
    "革命派没有提出彻底的反帝反封建纲领，没有明确反对帝国主义，也没有彻底解决农民土地问题。",
    "革命派没有发动和依靠广大人民群众，特别是没有发动广大农民。",
    "革命派没有建立坚强有力的革命政党作为核心，同盟会组织涣散、内部意见分歧。",
    "辛亥革命的教训：资产阶级共和国方案在半殖民地半封建的中国行不通，民族资产阶级不能领导中国民主革命取得胜利。"
  ]},
  {h:"3.10 捍卫共和制度的斗争", items:[
    "1913年3月，袁世凯派人刺杀国民党代理理事长宋教仁（「宋案」），并武力镇压革命党人，暴露其专制野心。",
    "1913年7月，孙中山、黄兴等发动「二次革命」武力讨袁，因力量悬殊很快失败，袁世凯势力进一步扩张。",
    "1915年12月，袁世凯公然宣布恢复帝制，改国号为中华帝国，年号「洪宪」，激起全国反对。",
    "1915年12月，蔡锷等在云南发动护国运动（护国战争），各省响应，袁世凯被迫于1916年3月取消帝制，6月在众叛亲离中死去。",
    "1917年7月，张勋拥戴溥仪复辟，仅12天即被段祺瑞讨伐平息，段祺瑞掌权后拒绝恢复《临时约法》和国会。",
    "1917年9月，孙中山在广州发动护法运动，因西南军阀排挤而失败，1918年5月孙中山辞职，护法运动失败。",
    "护法运动的失败说明旧民主主义革命已经走到尽头，中国民族资产阶级不能领导中国革命取得胜利。"
  ]},
  {h:"3.11 全章题目要点速记", items:[
    "1904—1905年，俄国和日本为争夺中国东北，在中国领土上发动日俄战争，清政府竟宣布「局外中立」。",
    "辛亥革命时期，资产阶级革命派的骨干力量是一批资产阶级、小资产阶级的知识分子，他们随着新式学堂的兴办和留学生的派遣而逐渐形成。",
    "1907年12月，孙中山亲自领导广西镇南关起义，起义军一度攻占镇南关炮台，最终失败。",
    "1908年，同盟会在云南发动河口起义，这是孙中山领导的西南边境系列起义之一。",
    "1907年，光复会成员徐锡麟在安庆、秋瑾在绍兴筹划起义，事败牺牲，史称浙皖起义。",
    "1905年11月，孙中山在《民报》发刊词中把同盟会纲领概括为民族主义、民权主义、民生主义。",
    "革命派与改良派论战中，改良派的主要代表人物是康有为、梁启超，他们鼓吹保皇、反对革命。",
    "1905—1907年论战中，革命派以《民报》为阵地，改良派以《新民丛报》为阵地。",
    "论战中改良派反对以革命手段推翻清政府，主张保留清政府、实行君主立宪。",
    "陈天华著《警世钟》和《猛回头》，以通俗文字宣传反帝反封建的革命思想。",
    "1904年，孙中山发表《中国问题的真解决》，指出必须用革命手段推翻清王朝统治。",
    "武昌起义前夕，文学社和共进会在湖北新军中发展革命力量，为起义准备了条件。",
    "武昌起义后成立湖北军政府，推举原清军协统黎元洪为都督。",
    "武昌起义后各省纷纷响应，到1911年底，宣布脱离清政府独立的省份已有十几个。",
    "中华民国临时政府规定以五色旗为国旗，象征汉、满、蒙、回、藏五族共和。",
    "《中华民国临时约法》为限制袁世凯专权，规定实行责任内阁制。",
    "《中华民国临时约法》以法律形式肯定了资产阶级民主共和制度，具有进步意义。",
    "1914年，孙中山在日本东京成立中华革命党，坚持武装讨袁斗争。",
    "袁世凯复辟帝制激起全国反对，护国运动兴起后被迫于1916年3月取消帝制。",
    "1917年7月，张勋拥清废帝溥仪复辟，段祺瑞组织讨逆军进京讨伐，复辟仅十二天即失败。",
    "1917年，孙中山举起拥护《临时约法》、恢复国会的旗帜，发动护法运动。",
    "第一次护法运动失败的主要原因是西南军阀的排挤和破坏，1918年孙中山被迫辞职离粤。",
    "1922年陈炯明叛乱导致第二次护法运动失败，孙中山深刻认识到依靠军阀的革命道路走不通。",
    "辛亥革命后，中国政治最突出的局面是军阀割据和混战，中国陷入北洋军阀统治的黑暗时期。",
    "袁世凯死后，北洋军阀分裂为直系、皖系、奉系三大派系，割据混战。",
    "第一次世界大战期间，列强忙于战争、暂时放松对中国的侵略，中国民族资本主义获得进一步发展。",
    "1894年孙中山上书李鸿章遭到冷遇，遂赴檀香山创立兴中会，走上革命道路。",
    "中国同盟会的成立，使全国性的资产阶级民主革命有了统一的领导核心。",
    "武昌起义后各省宣布独立，担任都督的许多是旧官僚和立宪派，反映了革命的妥协性。"
  ]}
 ]},

{ch:4, no:"第四章", title:"开天辟地的大事变", period:"中编 · 1919—1949",
 parts:[
  {h:"4.1 新文化运动的兴起", items:[
    "1915年9月，陈独秀在上海创办《青年杂志》（后改名《新青年》），新文化运动由此兴起。",
    "1917年，蔡元培出任北京大学校长，聘请陈独秀为文科学长，《新青年》编辑部随之迁到北京，北京大学成为新文化运动的主要阵地。",
    "新文化运动的基本口号是民主与科学，即「德先生」与「赛先生」。",
    "新文化运动提倡民主，反对专制；提倡科学，反对迷信盲从。",
    "新文化运动提倡新道德，反对旧道德；提倡新文学，反对旧文学。",
    "1917年，胡适发表《文学改良刍议》，主张以白话文取代文言文，倡导文学改良。",
    "1918年，鲁迅发表《狂人日记》，这是新文学运动中第一篇白话小说。",
    "新文化运动是一场伟大的思想解放运动，为马克思主义在中国的传播创造了有利条件。"
  ]},
  {h:"4.2 五四运动：中国新民主主义革命的开端", items:[
    "五四运动的直接导火线是1919年巴黎和会上中国外交的失败，列强竟将德国在山东的权益转让给日本。",
    "1919年5月4日，北京十几所学校的学生3000余人齐集天安门前，举行示威游行，五四运动爆发。",
    "学生游行提出「外争主权、内除国贼」「废除二十一条」「拒绝在和约上签字」等口号，要求惩办曹汝霖、章宗祥、陆宗舆等亲日派官僚。",
    "6月3日以后，五四运动发展到新阶段：运动的中心由北京转移到上海，运动的主力由学生转变为工人。",
    "1919年6月5日，上海工人举行罢工，中国工人阶级开始以独立的姿态登上政治舞台。",
    "五四运动具有彻底反帝反封建的革命性、追求救国强国真理的进步性、各族各界群众积极参与的广泛性。",
    "五四运动促进了马克思主义在中国的传播及其与中国工人运动的结合，是中国新民主主义革命的开端。"
  ]},
  {h:"4.3 马克思主义在中国的传播", items:[
    "1918年，李大钊先后发表《法俄革命之比较观》《庶民的胜利》《布尔什维主义的胜利》等文章，率先在中国举起马克思主义旗帜。",
    "1919年，李大钊发表《我的马克思主义观》，系统介绍了马克思主义的唯物史观、政治经济学和科学社会主义的基本原理。",
    "五四运动以后，马克思主义的传播成为新文化运动的主流，各地纷纷出现研究、宣传马克思主义的社团和刊物。",
    "在马克思主义传播过程中，马克思主义者先后同资产阶级改良主义、基尔特社会主义和无政府主义进行了三次论战。",
    "三次论战扩大了马克思主义的影响，促进了马克思主义的传播，为中国共产党的成立奠定了思想基础。",
    "以李大钊、陈独秀为代表的一批先进知识分子成为传播马克思主义的中坚力量，毛泽东、蔡和森、邓中夏等先进青年也逐步确立了对马克思主义的信仰。"
  ]},
  {h:"4.4 中国共产党早期组织的建立", items:[
    "1920年8月，陈独秀等人在上海成立了中国第一个共产党早期组织，陈独秀任书记。",
    "1920年11月，上海共产党早期组织创办《共产党》月刊，宣传马克思主义和建党思想。",
    "1920年10月，李大钊在北京成立共产党早期组织，北京成为北方宣传马克思主义的中心。",
    "随后，武汉、长沙、广州、济南以及旅日、旅法的先进分子也相继建立了共产党早期组织。",
    "各地共产党早期组织深入工人群众，创办工人夜校，组织工会，促进了马克思主义与工人运动的结合。",
    "各地共产党早期组织的建立和活动，为正式成立全国统一的中国共产党准备了条件。"
  ]},
  {h:"4.5 中共一大与中国共产党的诞生", items:[
    "1921年7月23日，中国共产党第一次全国代表大会在上海法租界望志路106号举行。",
    "由于会场遭到暗探注意和外国巡捕搜查，中共一大最后一天的会议转移到浙江嘉兴南湖的游船上举行。",
    "出席中共一大的代表13人，代表全国50多名党员，共产国际代表马林和尼科尔斯基列席了会议。",
    "中共一大确定党的名称为「中国共产党」，通过了党的第一个纲领和第一个决议。",
    "中共一大确定党成立后的中心任务是组织工人阶级、领导工人运动。",
    "中共一大选举产生中央局作为中央领导机构，陈独秀为中央局书记。",
    "中国共产党的成立是中华民族发展史上开天辟地的大事变，自从有了中国共产党，中国革命的面貌就焕然一新了。"
  ]},
  {h:"4.6 中共二大与民主革命纲领", items:[
    "1922年7月，中国共产党第二次全国代表大会在上海举行。",
    "中共二大第一次明确提出了反帝反封建的民主革命纲领。",
    "中共二大确定的最高纲领是实现社会主义、共产主义。",
    "中共二大确定的最低纲领（民主革命纲领）是：打倒军阀，推翻国际帝国主义的压迫，统一中国为真正的民主共和国。",
    "中共二大提出联合全国一切革命党派，联合资产阶级民主派，组织民主的联合战线。"
  ]},
  {h:"4.7 第一次工人运动高潮", items:[
    "1921年8月，中国共产党在上海成立中国劳动组合书记部，作为领导工人运动的公开机关。",
    "1922年1月，香港海员大罢工爆发，成为第一次工人运动高潮的起点。",
    "1922年9月，在毛泽东、李立三、刘少奇等领导下，安源路矿工人举行大罢工，取得完全胜利。",
    "1923年2月7日，京汉铁路工人举行总同盟罢工，遭到军阀吴佩孚的血腥镇压，酿成「二七惨案」。",
    "京汉铁路大罢工失败后，第一次工人运动高潮转入低潮。",
    "第一次工人运动高潮的教训表明，工人阶级单凭自身的力量孤军奋战，不可能战胜强大的敌人。"
  ]},
  {h:"4.8 第一次国共合作的形成", items:[
    "1923年6月，中共三大在广州举行，决定共产党员以个人身份加入国民党，实现国共合作。",
    "1924年1月，中国国民党第一次全国代表大会在广州举行，标志着第一次国共合作的正式形成。",
    "国民党一大的成功召开，标志着以国共合作为基础的革命统一战线正式建立。",
    "1924年，黄埔军校建立，蒋介石任校长，周恩来任政治部主任，培养了大批军事政治人才。",
    "1925年1月，中共四大在上海举行，明确提出无产阶级在民主革命中的领导权问题和工农联盟问题。"
  ]},
  {h:"4.9 新三民主义与国民革命高潮", items:[
    "国民党一大确立了「联俄、联共、扶助农工」的三大革命政策。",
    "孙中山在国民党一大上重新解释三民主义，把旧三民主义发展为新三民主义。",
    "新三民主义的民族主义主张对外反对帝国主义，对内实行各民族一律平等。",
    "新三民主义的民权主义主张普遍平等的民权，民生主义提出「平均地权」和「节制资本」。",
    "新三民主义同中国共产党在民主革命阶段的纲领基本一致，成为国共合作的政治基础。",
    "1925年5月30日，上海发生五卅惨案，五卅运动爆发，形成全国规模的反帝怒潮。",
    "1925年6月，省港大罢工爆发，坚持了16个月之久，给帝国主义以沉重打击。"
  ]},
  {h:"4.10 北伐战争与国民革命的失败", items:[
    "1926年7月，国民革命军在广州誓师，北伐战争正式开始。",
    "北伐战争的主要对象是吴佩孚、孙传芳、张作霖三派军阀。",
    "叶挺独立团在北伐中英勇善战、屡建战功，被誉为「铁军」。",
    "随着北伐战争的胜利进军，国民政府由广州迁往武汉。",
    "1927年4月12日，蒋介石在上海发动「四一二」反革命政变，大肆捕杀共产党员和革命群众。",
    "1927年7月15日，汪精卫在武汉召开「分共」会议，正式同共产党决裂，即「七一五」反革命政变，第一次国共合作全面破裂。",
    "国民革命失败的客观原因，是帝国主义和封建势力等反革命力量过于强大，蒋介石、汪精卫集团又相继背叛革命。",
    "国民革命失败的主观原因，是中国共产党中央领导机关在大革命后期犯了以陈独秀为代表的右倾机会主义错误，自动放弃了革命领导权。",
    "国民革命失败的教训表明，中国共产党要领导人民取得革命胜利，必须坚持无产阶级在民主革命中的领导权，必须掌握革命的武装力量。"
  ]},
  {h:"4.11 全章题目要点速记", items:[
    "1922年1月香港海员罢工，是中国工人运动第一次高潮的起点。",
    "1915年9月陈独秀在上海创办《青年杂志》（后改名《新青年》），标志着新文化运动的兴起。",
    "五四运动前的新文化运动以《新青年》杂志和北京大学为主要阵地。",
    "北伐战争的主要对象是吴佩孚、孙传芳、张作霖三个军阀集团，冯玉祥不在其中。",
    "1920年8月，陈独秀等在上海建立中国第一个共产党早期组织——上海共产主义小组。",
    "1920年3月，在李大钊指导下，邓中夏等在北京大学成立马克思学说研究会，学习宣传马克思主义。",
    "1920年11月成立的上海机器工会，是中国共产党早期组织领导下建立的第一个产业工会。",
    "1920年8月，陈望道翻译的《共产党宣言》第一个中文全译本在上海出版。",
    "1921年9月，沈定一等在浙江萧山衙前村组织成立中国第一个农民协会——衙前农民协会。",
    "中国早期信仰马克思主义的人物有三类：新文化运动的精神领袖李大钊、陈独秀；五四运动中的左翼骨干毛泽东、蔡和森、周恩来等；原同盟会会员董必武、吴玉章、林伯渠等。",
    "中国共产党成立，标志着中国革命有了坚强的领导核心，使中国工人阶级有了自己的司令部，中国人民的斗争有了可信赖的组织者和领导者。",
    "中国共产党成立使中国革命有了马克思列宁主义的科学指导思想，沟通了中国革命与世界革命的联系，使中国革命有了新的前途，面目焕然一新。",
    "新文化运动前期，斗争锋芒主要指向以孔子为代表的儒家传统道德，提出「打倒孔家店」。",
    "新文化运动前期提倡民主与科学、新道德和新文学，并不提倡君主立宪。",
    "五四运动中青年学生最先奋起反抗，起了先锋作用，工人阶级在后期成为运动主力。",
    "五四运动迫使北洋政府罢免卖国贼、释放被捕学生并拒签和约，但并未收回山东主权。",
    "中共一大确定党成立后的中心工作是领导和组织工人运动，随后成立了中国劳动组合书记部。",
    "中共一大最后一天会议转移到浙江嘉兴南湖游船上举行，直接原因是会场遭到法国巡捕搜查。",
    "上海共产党早期组织创办《劳动界》等刊物，向工人群众宣传马克思主义。",
    "1923年2月，京汉铁路总工会在郑州成立，随即遭到军阀吴佩孚的破坏。",
    "新三民主义的民生主义提出平均地权、节制资本，并主张耕者有其田。",
    "新三民主义与中国共产党的民主革命纲领在若干基本原则方面基本一致，因而成为第一次国共合作的政治基础。",
    "黄埔军校把政治教育提到与军事训练同等重要的地位，实行政治教育与军事训练并重，这是它与以往军校最显著的不同。",
    "1925年5月，上海日商纱厂资本家枪杀工人顾正红，成为五卅运动爆发的直接导火线。",
    "1926年3月，蒋介石制造中山舰事件，打击共产党和国民党左派，是国民党右派阴谋叛变革命的重要信号。",
    "1926年5月，蒋介石提出整理党务案，旨在限制共产党、篡夺国民党党权。",
    "北伐战争中叶挺独立团英勇善战，其所在的第四军被誉为「铁军」。",
    "1927年1月，汉口、九江人民收回英租界，这是中国人民反帝斗争的重大胜利。",
    "国民革命失败的主观原因，是陈独秀右倾机会主义错误，放弃了无产阶级对革命的领导权。",
    "国民革命基本上推翻了北洋军阀的统治，但并未完成反帝反封建的任务。",
    "五四运动以前的新文化运动没有马克思主义指导，未能同群众运动相结合，方法上存在绝对化偏向。",
    "五四运动后期，上海人民举行工人罢工、学生罢课、商人罢市的「三罢」斗争。",
    "1919年，毛泽东在长沙创办《湘江评论》，宣传反帝反封建的新思想。",
    "中国共产党成立于俄国十月革命胜利、第二国际修正主义破产之后，接受的马克思列宁主义是完整的科学世界观，没有受到社会改良主义的影响。"
  ]}
 ]},

{ch:5, no:"第五章", title:"中国革命的新道路", period:"中编 · 1919—1949",
 parts:[
  {h:"5.1 国民党在全国统治的建立", items:[
    "1927年4月18日，蒋介石在南京建立国民政府，与保持国共合作的武汉国民政府相对立。",
    "1928年2月，国民党二届四中全会改组国民政府，蒋介石任国民党中央政治会议主席和军事委员会主席，独揽党政军大权。",
    "1928年6月，奉系军阀首领张作霖在沈阳皇姑屯被日本关东军炸死，史称「皇姑屯事件」。",
    "1928年12月29日，张学良通电宣布东北易帜，服从南京国民政府，国民党在形式上统一了全国。",
    "1928年10月，国民党中央常务委员会通过《训政纲领》，实行「训政」，确立国民党一党专政的体制。",
    "国民党政府实行一党专政的军事独裁统治，代表大地主大资产阶级的利益，对革命人民进行残酷镇压。"
  ]},
  {h:"5.2 中间党派及其政治主张", items:[
    "大革命失败后，代表民族资产阶级和上层小资产阶级利益的中间党派相继成立，主要有中国国民党临时行动委员会、中国民权保障同盟等。",
    "1930年8月，邓演达等在上海成立中国国民党临时行动委员会，又称「第三党」，主张推翻蒋介石统治、进行「平民革命」。",
    "1932年12月，宋庆龄、蔡元培等在上海发起成立中国民权保障同盟，宋庆龄任主席，开展营救政治犯、争取民主权利的活动。",
    "中间党派主张改良主义，幻想在国共两党之间走「第三条道路」，既同蒋介石集团有矛盾，又不赞成中国共产党领导的革命。",
    "中间党派的抗日民主活动，为以后民主党派同中国共产党的合作奠定了一定的基础。"
  ]},
  {h:"5.3 南昌起义与八七会议", items:[
    "1927年8月1日，周恩来、贺龙、叶挺、朱德、刘伯承等领导中国共产党掌握和影响下的国民革命军2万余人在南昌起义。",
    "南昌起义打响了武装反抗国民党反动统治的第一枪，是中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端。",
    "1927年8月7日，中共中央在汉口秘密召开紧急会议，即八七会议。",
    "八七会议确定实行土地革命和武装反抗国民党反动统治的总方针，并把发动农民举行秋收起义作为当前最主要的任务。",
    "毛泽东在八七会议上提出「须知政权是由枪杆子中取得的」的著名论断。",
    "八七会议选出了以瞿秋白为首的新的中央临时政治局。"
  ]},
  {h:"5.4 秋收起义与三湾改编", items:[
    "1927年9月9日，毛泽东领导的湘赣边界秋收起义爆发。",
    "秋收起义公开打出了「工农革命军」的旗帜，不再沿用国民革命军的番号。",
    "1927年9月29日，毛泽东率秋收起义部队到达江西永新县三湾村，对部队进行改编，即三湾改编。",
    "三湾改编将党的支部建在连上，从组织上确立了党对军队的绝对领导。",
    "三湾改编在部队中实行民主制度，连以上建立士兵委员会，官兵平等，废除旧军队的雇佣关系和打骂制度。",
    "三湾改编是建设共产党领导的新型人民军队的重要开端。"
  ]},
  {h:"5.5 井冈山革命根据地的创建", items:[
    "1927年10月，毛泽东率领秋收起义部队到达井冈山地区，创建井冈山农村革命根据地。",
    "井冈山革命根据地是中国共产党创建的第一个农村革命根据地。",
    "1928年4月，朱德、陈毅率南昌起义余部和湘南农军到达井冈山，与毛泽东领导的部队会师，合编为工农革命军第四军（后改称工农红军第四军），朱德任军长，毛泽东任党代表。",
    "1928年12月，彭德怀、滕代远率红五军到达井冈山，与红四军会师。",
    "1928年10月和11月，毛泽东先后撰写《中国的红色政权为什么能够存在？》《井冈山的斗争》，论述了红色政权存在和发展的原因与条件。",
    "井冈山农村革命根据地的创建，点燃了「工农武装割据」的星星之火，为开辟农村包围城市的革命道路提供了宝贵经验。"
  ]},
  {h:"5.6 农村包围城市、武装夺取政权道路的开辟", items:[
    "1930年1月，毛泽东发表《星星之火，可以燎原》，批评了「红旗到底打得多久」的悲观情绪，实际上提出了以农村为中心的思想。",
    "1930年5月，毛泽东撰写《反对本本主义》，提出「没有调查，没有发言权」，初步阐述了实事求是、群众路线、独立自主的思想。",
    "在井冈山斗争和反「围剿」作战中，红军逐步形成了「敌进我退、敌驻我扰、敌疲我打、敌退我追」的游击战争十六字诀。",
    "到1930年，全国红军发展到约7万人，先后建立大小十几块农村革命根据地。",
    "农村包围城市、武装夺取政权革命道路的开辟，是中国共产党人把马克思主义基本原理同中国革命具体实际相结合的伟大创造。",
    "农村包围城市、武装夺取政权革命道路的理论，是中国共产党在探索中形成的重要理论成果，为夺取中国革命胜利指明了方向。"
  ]},
  {h:"5.7 土地革命与土地革命路线", items:[
    "1928年12月，毛泽东在井冈山主持制定《井冈山土地法》，这是中国共产党历史上第一个土地法。",
    "1929年4月，毛泽东在兴国县主持制定《兴国土地法》，将「没收一切土地」改为「没收一切公共土地及地主阶级的土地」，保护了中农利益。",
    "到1931年，中国共产党在实践中逐步形成了一条正确的土地革命路线：依靠贫农、雇农，联合中农，限制富农，保护中小工商业者，消灭地主阶级，变封建半封建的土地所有制为农民的土地所有制。",
    "1931年11月，中华苏维埃第一次全国代表大会在江西瑞金召开，宣告中华苏维埃共和国临时中央政府成立，毛泽东任主席。",
    "中华苏维埃临时中央政府是中国共产党领导的工农民主专政的政权，实行工农兵代表大会制度。",
    "土地革命的深入开展，使广大农民在政治上翻身、经济上分得土地，踊跃参军参战，有力地支援了红军和根据地建设。"
  ]},
  {h:"5.8 「左」倾错误的危害", items:[
    "土地革命战争时期，中国共产党内先后三次出现「左」倾错误，其中危害最大的是王明「左」倾教条主义错误。",
    "第一次是1927年11月至1928年4月，以瞿秋白为代表的「左」倾盲动错误。",
    "第二次是1930年6月至9月，以李立三为代表的「左」倾冒险错误。",
    "第三次是1931年1月至1935年1月，以王明为代表的「左」倾教条主义错误。",
    "王明「左」倾教条主义错误使革命根据地和红军损失百分之九十，党在白区的力量几乎损失百分之百。",
    "王明「左」倾错误导致中央苏区第五次反「围剿」失败，1934年10月中央红军被迫实行战略转移，开始长征。"
  ]},
  {h:"5.9 遵义会议：生死攸关的转折点", items:[
    "1934年10月，中央红军8万多人从江西瑞金、于都等地出发，开始长征。",
    "1935年1月15日至17日，中共中央政治局在贵州遵义召开扩大会议，即遵义会议。",
    "遵义会议集中解决了当时具有决定意义的军事问题和组织问题。",
    "遵义会议批评了博古、李德在军事指挥上的错误，实际上确立了毛泽东在党中央和红军的领导地位。",
    "遵义会议在极其危急的情况下挽救了党、挽救了红军、挽救了中国革命，是中国共产党历史上一个生死攸关的转折点。",
    "遵义会议是中国共产党第一次独立自主地运用马克思列宁主义基本原理解决自己的路线、方针和政策问题的会议，标志着中国共产党在政治上开始走向成熟。"
  ]},
  {h:"5.10 红军长征的胜利与长征精神", items:[
    "1935年6月，中央红军同红四方面军在四川懋功（今小金）地区会师。",
    "中共中央政治局召开两河口会议，确定北上方针，并同张国焘的分裂主义进行了坚决斗争。",
    "1935年10月，中央红军到达陕北吴起镇，同红十五军团会师。",
    "1936年10月，红二、红四方面军先后同红一方面军在甘肃会宁、静宁将台堡会师，红军长征胜利结束。",
    "长征的胜利，宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败，实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折。",
    "长征精神就是把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利的精神；为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神；坚持独立自主、实事求是，一切从实际出发的精神；顾全大局、严守纪律、紧密团结的精神；紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗的精神。",
    "长征的胜利表明，中国共产党及其领导的人民军队是不可战胜的，伟大的长征精神是激励中国人民不断前进的精神力量。"
  ]},
  {h:"5.11 全章题目要点速记", items:[
    "1927年4月12日，蒋介石在上海发动「四一二」反革命政变，大肆捕杀共产党员和革命群众。",
    "1927年9月，南京国民政府与武汉国民政府合并，史称「宁汉合流」，国民党各派暂时统一于南京国民政府。",
    "国民党在全国统治确立后，中国社会的半殖民地半封建性质并没有改变，社会主要矛盾也没有改变。",
    "以蒋介石、宋子文、孔祥熙和陈果夫、陈立夫为代表的官僚资本，是依靠国家政权、通过发行公债、增加捐税、垄断金融等手段聚敛财富形成的。",
    "在帝国主义和官僚资本的双重压迫下，国民党统治时期的民族资本主义工业发展艰难，陷于困境、日益萎缩。",
    "1925年12月，中国青年党成立，以「求中华民族之解放」为宗旨，主张国家主义、反对共产主义。",
    "1927年12月11日，张太雷、叶挺、叶剑英等领导广州起义，起义军曾一度占领广州大部分地区。",
    "秋收起义受挫后，毛泽东于1927年9月在文家市主持召开前委会议，决定放弃攻打长沙，转向敌人统治力量薄弱的农村进军。",
    "三湾改编废除旧军队的雇佣制，在军队内部实行民主制度，实行官兵平等、民主管理。",
    "井冈山革命根据地位于湖南、江西两省交界的罗霄山脉中段，是1927年10月毛泽东率秋收起义部队创建的。",
    "井冈山革命根据地的创建，点燃了「工农武装割据」的星星之火，为党领导的其他各地武装起义树立了榜样。",
    "井冈山根据地从实践上开辟了在敌我力量悬殊情况下党深入农村、保存和发展革命力量的正确道路，代表了大革命失败后中国革命发展的正确方向。",
    "「工农武装割据」就是在党的领导下，以武装斗争为主要形式、以土地革命为中心内容、以农村根据地为战略阵地，三者密切结合。",
    "中国是半殖民地半封建国家，帝国主义及其走狗长期占据中心城市，敌人在城市的力量异常强大，革命力量难以立足。",
    "广大农村是敌人统治的薄弱环节，农民是中国革命的主力军，农村的自然经济为坚持革命提供了物质条件。",
    "党在农村建立根据地，开展土地革命和武装斗争，积蓄和发展革命力量，最终夺取全国政权，这是走农村包围城市道路的必然选择。",
    "1928年春，毛泽东在井冈山为红军制定「三大纪律」：行动听指挥、不拿工人农民一点东西、打土豪要归公。",
    "红军是战斗队又是工作队、生产队，担负打仗消灭敌人、打土豪筹款子、做群众工作三大任务。",
    "中国红色政权能够存在和发展的根本原因在于，中国是帝国主义间接统治的半殖民地国家，经济政治发展极不平衡，军阀割据混战。",
    "红色政权存在和发展的主观条件是：全国革命形势继续发展，有相当力量的正式红军存在，共产党组织有力量和政策正确。",
    "1929年1月，毛泽东、朱德率红四军主力进军赣南、闽西，开辟赣南闽西根据地，后发展为中央革命根据地。",
    "中央革命根据地是土地革命战争时期中国共产党领导的面积最大、人口最多的革命根据地。",
    "1929年12月，红四军党的第九次代表大会在福建上杭古田召开，即古田会议，确立了思想建党、政治建军的原则。",
    "1930年6月至9月，李立三「左」倾冒险主义在党内占统治地位，主张集中力量进攻中心城市。",
    "王明「左」倾错误在中央苏区推行「地主不分田、富农分坏田」等过「左」土地政策，扩大了打击面。",
    "王明「左」倾教条主义在革命道路上坚持城市中心论，照搬共产国际指示和苏联经验，在组织上实行宗派主义、惩办主义。",
    "王明「左」倾教条主义在军事上表现为第五次反「围剿」中先是冒险进攻、后又消极防御，导致反「围剿」失败。",
    "王明「左」倾错误的严重危害是使中央红军被迫长征，党在白区的组织几乎损失殆尽，给中国革命造成严重危害。",
    "第五次反「围剿」中，博古、李德先是冒险进攻，后又消极防御，使红军损失惨重，被迫实行战略转移。",
    "1930年5月爆发的中原大战，是蒋介石与阎锡山、冯玉祥、李宗仁等军阀集团之间的战争，以蒋介石获胜告终。",
    "1934年10月，中央红军八万余人从中央革命根据地出发，开始举世闻名的长征。",
    "遵义会议后，张闻天代替博古在中共中央负总责。",
    "遵义会议后成立由毛泽东、周恩来、王稼祥组成的三人军事指挥小组，负责全军的军事指挥。",
    "1935年5月，毛泽东指挥红军四渡赤水，声东击西，打乱了敌人的追剿计划。",
    "1935年5月，中央红军巧渡金沙江，跳出了数十万敌军的围追堵截圈子。",
    "1935年5月，红军强渡大渡河后，以昼夜兼程二百四十里的速度飞夺泸定桥，粉碎了敌人围歼红军的计划。",
    "1935年6月，中央红军翻越长征途中第一座终年积雪的大雪山夹金山。",
    "1935年9月，红军攻克通往陕甘革命根据地的最后一个天险腊子口，打通了北上的道路。",
    "1936年7月，红二、六军团与红四方面军在甘孜会师，合编为红二方面军。",
    "中央红军长征历时一年，行程约二万五千里，纵横十余省，创造了人间奇迹。",
    "长征的胜利粉碎了国民党反动派「围剿」红军、扼杀中国革命的企图，使中国革命转危为安。",
    "长征把中国革命的大本营放到了西北，为迎接抗日救亡运动的新高潮准备了条件。",
    "长征保存并锤炼了中国革命的骨干力量，沿途播撒了革命的火种。",
    "长征铸就了伟大的长征精神，成为激励党和人民继续前进的精神动力。",
    "伟大长征精神包括坚定理想信念、不怕牺牲、独立自主、顾全大局、严守纪律、患难与共、艰苦奋斗等，贪图安逸、追求享乐与之格格不入。"
  ]}
 ]},

{ch:6, no:"第六章", title:"中华民族的抗日战争", period:"中编 · 1919—1949",
 parts:[
  {h:"6.1 日本发动侵华战争与局部抗战", items:[
    "1931年9月18日，日本关东军制造九一八事变，武装侵占中国东北，中国人民的局部抗战由此开始。",
    "1932年3月，日本扶植清朝末代皇帝溥仪在长春建立伪「满洲国」，对东北实行殖民统治。",
    "1932年1月28日，日军进攻上海，制造一·二八事变，国民党第十九路军奋起抵抗，史称淞沪抗战。",
    "1933年，日军向长城一线进犯，中国守军奋起抵抗，爆发长城抗战。",
    "1935年，日本通过《何梅协定》等迫使国民党中央势力退出华北，并制造华北事变。",
    "1935年，日本策动华北五省「自治运动」，企图将华北从中国分裂出去，中日民族矛盾上升为主要矛盾。",
    "1935年12月9日，北平学生发起一二·九运动，掀起全国抗日救亡运动的新高潮。",
    "东北抗日联军等武装在极端艰苦的条件下坚持游击战争，杨靖宇、赵尚志是其中的杰出代表。"
  ]},
  {h:"6.2 瓦窑堡会议与西安事变", items:[
    "1935年8月，中共驻共产国际代表团发表《为抗日救国告全体同胞书》（八一宣言），呼吁停止内战、一致抗日。",
    "1935年12月，中共中央在陕北瓦窑堡召开政治局扩大会议，确定建立抗日民族统一战线的方针。",
    "瓦窑堡会议批判了党内「左」倾关门主义错误，制定了抗日民族统一战线的策略总方针。",
    "1936年5月5日，中国共产党发表《停战议和一致抗日通电》，将「反蒋抗日」改为「逼蒋抗日」的方针。",
    "1936年12月12日，张学良、杨虎城在西安扣留蒋介石，发动西安事变，逼蒋抗日。",
    "中国共产党从全民族利益出发，确定和平解决西安事变的方针，派周恩来等到西安参加谈判。",
    "西安事变的和平解决成为时局转换的枢纽，标志着十年内战基本结束、抗日民族统一战线初步形成。",
    "1937年2月，国民党召开五届三中全会，实际上承认了共产党的合法地位，国共合作抗日局面初步形成。"
  ]},
  {h:"6.3 七七事变与全民族抗战的爆发", items:[
    "1937年7月7日，日军炮轰宛平城和卢沟桥，制造七七事变（卢沟桥事变），全国性抗战由此爆发。",
    "1937年8月13日，日军大举进攻上海，制造八一三事变，淞沪会战爆发。",
    "1937年8月，红军主力改编为国民革命军第八路军，朱德任总指挥、彭德怀任副总指挥。",
    "1937年10月，南方八省红军和游击队改编为国民革命军新编第四军，叶挺任军长。",
    "1937年9月22日，国民党中央通讯社发表《中共中央为公布国共合作宣言》，23日蒋介石发表承认中共合法地位的谈话。",
    "国共合作宣言的发表和蒋介石谈话的发表，标志着以国共两党合作为基础的抗日民族统一战线正式形成。",
    "全国性抗战爆发后，中国形成正面战场与敌后战场相互配合、两个战场并存的战略格局。"
  ]},
  {h:"6.4 国民党的正面战场", items:[
    "1937年8月至11月的淞沪会战，是抗日战争初期规模最大的一次战役，粉碎了日军「三个月灭亡中国」的狂妄计划。",
    "1937年9月至11月的忻口会战，国共两党军队密切配合作战，是华北战场上规模最大的一次战役。",
    "1938年3月，第五战区司令长官李宗仁指挥台儿庄战役，歼灭日军一万余人，取得大捷。",
    "台儿庄大捷是全面抗战爆发后中国军队在正面战场取得的第一次重大胜利。",
    "1938年6月至10月的武汉会战，是战略防御阶段规模最大的一次战役，此后抗战转入战略相持阶段。",
    "抗战进入相持阶段后，国民党实行「消极抗日、积极反共」方针，多次制造反共磨擦。",
    "1940年5月的枣宜会战中，第三十三集团军总司令张自忠壮烈殉国。",
    "正面战场广大爱国将士英勇奋战，但由于国民党实行片面抗战路线和战略指挥失误，正面战场多次失利。"
  ]},
  {h:"6.5 中国共产党是抗日战争的中流砥柱", items:[
    "1937年8月，中共中央在陕北洛川召开政治局扩大会议，制定全面抗战路线，通过《抗日救国十大纲领》。",
    "洛川会议决定在敌后放手发动独立自主的游击战争，开辟敌后战场、建立敌后抗日根据地。",
    "1937年9月，八路军第一一五师在平型关伏击日军，取得平型关大捷，是全国抗战开始后中国军队取得的第一次大胜利。",
    "1937年11月太原失陷后，以共产党为主体的敌后游击战争在华北等地广泛展开。",
    "敌后战场的开辟，使日军陷入正面战场和敌后战场两面夹击的困境。",
    "中国共产党先后建立晋察冀、晋冀鲁豫、陕甘宁等抗日根据地，其中晋察冀是第一个敌后抗日根据地。",
    "1940年8月至12月，八路军在彭德怀指挥下发动百团大战，参战部队一百余个团，沉重打击了日军。",
    "中国共产党在根据地实行减租减息、发展生产等政策，为抗战胜利奠定了物质基础。"
  ]},
  {h:"6.6 《论持久战》与持久战方针", items:[
    "1938年5月，毛泽东发表《论持久战》，系统阐述了抗日战争是持久战、最后胜利属于中国的思想。",
    "《论持久战》批判了「亡国论」和「速胜论」两种错误论调。",
    "毛泽东指出，中日双方存在敌强我弱、敌小我大、敌退步我进步、敌寡助我多助四个基本特点。",
    "《论持久战》科学预见到抗战将经过战略防御、战略相持、战略反攻三个阶段。",
    "毛泽东强调，战略相持阶段是整个战争的枢纽，中国抗战的主要任务是积蓄力量、准备反攻。",
    "《论持久战》强调兵民是胜利之本，必须坚持人民战争和全面抗战路线。",
    "《论持久战》的发表为全国抗战指明了方向，坚定了全国人民抗战必胜的信心。"
  ]},
  {h:"6.7 抗日民族统一战线的巩固与发展", items:[
    "中国共产党在统一战线中坚持独立自主原则，正确处理民族斗争与阶级斗争的关系。",
    "抗日民族统一战线中实行「发展进步势力、争取中间势力、孤立顽固势力」的策略总方针。",
    "在敌后根据地政权建设中实行「三三制」，即共产党员、非党左派进步分子、中间分子各占三分之一。",
    "1941年1月，国民党顽固派制造皖南事变，新四军军部及所属部队九千余人遭袭击，军长叶挺被扣。",
    "皖南事变后，中国共产党坚持有理、有利、有节的斗争方针，打退了国民党第二次反共高潮。",
    "中国共产党在抗日根据地实行减租减息的土地政策，团结各阶层人民共同抗日。",
    "面对严重经济困难，中国共产党领导敌后军民开展大生产运动，提出「自己动手、丰衣足食」的口号。"
  ]},
  {h:"6.8 延安整风运动与中共七大", items:[
    "1942年，中国共产党在全党开展整风运动，内容是反对主观主义、宗派主义和党八股。",
    "整风运动以反对主观主义为主要任务，确立了实事求是的思想路线。",
    "延安整风运动是一场普遍的马克思主义教育运动，为抗战胜利奠定了思想基础。",
    "1945年4月，中共七大在延安召开，毛泽东作《论联合政府》的政治报告。",
    "中共七大确定了「放手发动群众，壮大人民力量，在我党的领导下，打败日本侵略者，解放全国人民」的政治路线。",
    "中共七大确立毛泽东思想为党的指导思想并写入党章。",
    "中共七大总结出党的三大优良作风：理论联系实际、密切联系群众、批评与自我批评。",
    "中共七大是团结的大会、胜利的大会，为抗战胜利和革命在全国的胜利奠定了政治和思想基础。"
  ]},
  {h:"6.9 抗日战争的胜利", items:[
    "1945年8月15日，日本天皇宣布无条件投降。",
    "1945年9月2日，日本在停泊于东京湾的美舰密苏里号上签署投降书，中国抗日战争胜利结束。",
    "1945年9月9日，中国战区日军投降签字仪式在南京举行。",
    "1945年10月25日，中国政府在台湾举行受降仪式，台湾及澎湖列岛回归祖国。",
    "中国人民抗日战争是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放战争。",
    "中国人民抗日战争是世界反法西斯战争的重要组成部分，中国战场是东方主战场。",
    "中国人民抗日战争历时14年（自1931年九一八事变算起），其中全面抗战历时8年（自1937年七七事变算起）。"
  ]},
  {h:"6.10 抗日战争胜利的历史意义与基本经验", items:[
    "抗日战争的胜利，彻底粉碎了日本军国主义殖民奴役中国的图谋，捍卫了国家主权和领土完整。",
    "抗日战争的胜利，促进了中华民族的觉醒，是中华民族走向复兴的历史转折点。",
    "中国战场长期牵制和打击了日本陆军主力，为世界反法西斯战争作出了重大贡献。",
    "抗战胜利后，中国成为联合国安理会常任理事国，国际地位显著提高。",
    "以爱国主义为核心的伟大民族精神，是中国人民抗日战争胜利的决定因素。",
    "中国共产党的中流砥柱作用，是中国人民抗日战争胜利的根本保证。",
    "坚持抗日民族统一战线、坚持人民战争、坚持自力更生艰苦奋斗，是抗战胜利的重要法宝。",
    "抗日战争的胜利再次证明：落后就要挨打，自强才能自立。"
  ]},
  {h:"6.11 全章题目要点速记", items:[
    "1931年9月18日夜，日本关东军炸毁沈阳北郊柳条湖附近南满铁路路轨，反诬中国军队所为，炮轰东北军驻地北大营，制造九一八事变。",
    "九一八事变后第三天，中共中央发表《中国共产党为日本帝国主义强暴占领东三省事件宣言》，号召全国人民奋起抗日。",
    "1933年5月，冯玉祥在张家口成立察哈尔抗日同盟军，开展抗日武装斗争。",
    "1933年11月，国民党第十九路军将领蔡廷锴、蒋光鼐在福建发动抗日反蒋的「福建事变」。",
    "1935年，日本通过《何梅协定》迫使国民党中央军和宪兵撤出河北，中国在河北、察哈尔两省的主权大部丧失。",
    "1935年11月，日本策动「华北五省自治运动」，扶植汉奸殷汝耕成立「冀东防共自治政府」。",
    "一二九运动提出「反对华北自治」「打倒日本帝国主义」「停止内战，一致对外」等口号，而「和平、民主、团结」是1945年抗战胜利后中共中央提出的口号。",
    "1936年2月，北平学生在中共领导下成立中华民族解放先锋队，深入工农开展抗日救亡宣传。",
    "瓦窑堡会议后，毛泽东作《论反对日本帝国主义的策略》的报告，系统阐明党的抗日民族统一战线策略。",
    "1937年7月7日夜，日军以一名士兵在演习中失踪为借口，要求进入宛平城搜查遭拒后炮轰宛平城，制造卢沟桥事变。",
    "1937年卢沟桥事变爆发，标志着日本全面侵华战争开始，中国进入全民族抗战的新阶段。",
    "1937年12月，日军占领南京后进行长达六周的大屠杀，遇难同胞达30万人以上。",
    "1937年淞沪会战中，谢晋元率「八百壮士」孤军据守四行仓库，被誉为抗战英雄。",
    "1937年10月忻口会战中，国民党第九军军长郝梦龄亲临前线指挥，壮烈殉国。",
    "1937年9月，林彪指挥八路军第一一五师取得平型关大捷，打破了「日军不可战胜」的神话。",
    "1937年8月，中共中央洛川会议确定红军实行独立自主的山地游击战争的战略方针和作战原则，配合正面战场作战。",
    "国民党片面抗战路线的实质是单纯依靠政府和军队抗战，不敢放手发动和依靠人民群众。",
    "1937年11月太原失守后，聂荣臻率部创建晋察冀抗日根据地，这是全民族抗战开始后党开辟的第一个敌后抗日根据地。",
    "《论持久战》依据敌强我弱、敌小我大、敌退步我进步、敌寡助我多助四个特点，得出抗日战争必然是持久战的结论。",
    "日本失道寡助、中国得道多助，中国又有共产党及其领导的人民军队和抗日根据地，因此抗战的最后胜利属于中国。",
    "抗战进入相持阶段后，日本对国民党政府采取以政治诱降为主、军事打击为辅的方针，并扶植汪精卫伪政权。",
    "1940年3月，汪精卫在南京成立伪国民政府，充当日本帝国主义统治中国的工具。",
    "日本侵略者在沦陷区推行「以战养战」，即利用占领区的人力物力财力支持其侵略战争。",
    "1940年8月至12月，八路军发动百团大战，以破袭日军交通线、摧毁敌伪据点为主要目标，是华北规模最大的进攻战役。",
    "1941年1月皖南事变后，中共中央重建新四军军部，任命陈毅为代军长、刘少奇为政治委员，坚持华中敌后抗战。",
    "1942年5月，八路军副参谋长左权在山西辽县反「扫荡」作战中壮烈牺牲。",
    "1939年7月，中共提出「坚持抗战、反对投降；坚持团结、反对分裂；坚持进步、反对倒退」三大政治口号。",
    "1938年7月，国民党政府成立国民参政会，作为各党派团结抗日的咨询机关，中共参政员出席参加。",
    "1941年12月至1942年1月，中国军队取得第三次长沙会战大捷，这是太平洋战争爆发后盟军方面取得的首次胜利。",
    "1944年，日军发动豫湘桂战役以打通大陆交通线，国民党军队大溃败，丢失大片国土，暴露了其统治的腐败无能。",
    "1942年，中国远征军开赴缅甸作战，保卫滇缅公路、配合盟军，为世界反法西斯战争作出重要贡献。",
    "1943年11月，中美英三国首脑举行开罗会议并发表《开罗宣言》，规定日本窃取的中国领土如东北、台湾、澎湖列岛必须归还中国。",
    "1945年7月26日，中美英三国发表《波茨坦公告》，促令日本无条件投降，苏联后来也加入。",
    "1945年8月8日，苏联对日宣战并出兵中国东北；8月9日毛泽东发表《对日寇的最后一战》，抗战进入战略反攻阶段。",
    "1941年3月，中国民主政团同盟在重庆成立，后改称中国民主同盟。",
    "1945年4月至6月，包括解放区代表董必武在内的中国代表团出席旧金山联合国制宪会议，中国成为联合国创始会员国之一。",
    "延安整风运动的内容是：反对主观主义以整顿学风，反对宗派主义以整顿党风，反对党八股以整顿文风，其中反对主观主义是最主要的任务。",
    "延安整风运动采取「惩前毖后，治病救人」的方针，基本方法是批评和自我批评。",
    "延安整风运动是一场深刻的马克思主义思想教育运动和思想解放运动，确立了实事求是的思想路线，为夺取抗战胜利和新民主主义革命胜利奠定了思想基础。",
    "1942年5月，毛泽东在延安文艺座谈会上讲话，提出文艺为人民大众、首先为工农兵服务的方向。",
    "1945年10月25日，中国战区台湾省受降典礼在台北举行，台湾重归中国版图，这一天后来被定为「台湾光复节」。",
    "9月3日是中国人民抗日战争胜利纪念日，以纪念1945年9月2日日本签署投降书、抗日战争取得胜利。"
  ]}
 ]},

{ch:7, no:"第七章", title:"为创建新中国而奋斗", period:"中编 · 1919—1949",
 parts:[
  {h:"7.1 抗战胜利后的形势与重庆谈判", items:[
    "抗日战争胜利后，中国面临三种建国方案：国民党的大地主大资产阶级专政、中间派主张的资产阶级共和国方案、共产党的人民民主专政方案。",
    "1945年8月25日，中共中央发表《对目前时局的宣言》，提出「和平、民主、团结」三大口号。",
    "1945年8月28日，毛泽东偕周恩来、王若飞赴重庆与国民党进行和平谈判。",
    "1945年10月10日，国共双方签署《政府与中共代表会谈纪要》，即《双十协定》。",
    "《双十协定》确认和平建国的基本方针，但在军队和解放区政权问题上未达成协议。"
  ]},
  {h:"7.2 政治协商会议与国民党的内战准备", items:[
    "1946年1月10日，政治协商会议（旧政协）在重庆召开，通过了有利于和平民主的协议。",
    "1946年2月10日，国民党制造「校场口惨案」，破坏政协协议的贯彻实施。",
    "1946年6月26日，国民党军大举围攻中原解放区，全面内战由此爆发。",
    "1946年11月，国民党召开一党包办的「国民大会」，通过《中华民国宪法》，遭到中国共产党和各民主党派的抵制。",
    "1947年10月27日，国民党政府宣布中国民主同盟为「非法团体」，民盟总部被迫解散。",
    "国民党政府坚持独裁内战卖国方针，勾结美国，出卖国家主权，激起全国人民的反对。"
  ]},
  {h:"7.3 全面内战的爆发与人民解放军的战略进攻", items:[
    "1946年8月，毛泽东在同美国记者安娜·路易斯·斯特朗的谈话中提出「一切反动派都是纸老虎」的著名论断。",
    "1946年11月4日，国民党政府与美国签订《中美友好通商航海条约》，出卖中国主权。",
    "从1946年6月到1947年6月，人民解放军处于战略防御阶段，先后粉碎了国民党军的全面进攻和重点进攻。",
    "1947年3月，国民党军重点进攻陕甘宁解放区和山东解放区，中共中央主动撤离延安，转战陕北。",
    "1947年6月30日，刘伯承、邓小平率晋冀鲁豫野战军主力强渡黄河，千里跃进大别山，揭开人民解放军战略进攻的序幕。",
    "1948年12月30日，毛泽东发表《将革命进行到底》的新年献词，号召将革命进行到底。"
  ]},
  {h:"7.4 第二条战线与国统区人民民主运动", items:[
    "1945年12月1日，国民党军警镇压昆明学生的反内战运动，制造一二·一惨案。",
    "1946年12月底，北平学生抗议美军暴行，掀起全国性的「抗暴运动」。",
    "1947年5月20日，南京、上海等地学生举行「反饥饿、反内战、反迫害」运动，遭国民党镇压，酿成五二〇惨案。",
    "国统区以学生运动为先导的人民民主运动，形成了配合人民解放战争的第二条战线。",
    "1947年2月28日，台湾人民发动反抗国民党统治的二二八起义。",
    "第二条战线使国民党政府陷于全民包围之中，加速了国民党统治的崩溃。"
  ]},
  {h:"7.5 土地改革与《中国土地法大纲》", items:[
    "1946年5月4日，中共中央发出《关于清算、减租及土地问题的指示》（五四指示），将减租减息政策改变为没收地主土地分配给农民。",
    "1947年10月，中共中央公布《中国土地法大纲》，规定废除封建性及半封建性剥削的土地制度，实行耕者有其田。",
    "《中国土地法大纲》是解放战争时期中国共产党领导土地改革的总纲领。",
    "土地改革消灭了封建剥削制度，激发了广大农民的革命和生产积极性。",
    "翻身农民踊跃参军支前，为解放战争提供了源源不断的人力物力支援。",
    "1947年12月，毛泽东在《目前形势和我们的任务》中提出新民主主义革命的三大经济纲领。",
    "新民主主义革命三大经济纲领：没收封建阶级的土地归农民所有，没收官僚资本归新民主主义国家所有，保护民族工商业。"
  ]},
  {h:"7.6 三大战役与渡江战役", items:[
    "1948年9月至11月，人民解放军发起辽沈战役，解放东北全境，歼敌四十七万余人。",
    "辽沈战役中，东北野战军采取「关门打狗」方针，首先攻克锦州，封闭国民党军于东北。",
    "1948年11月至1949年1月，华东、中原野战军发起淮海战役，以徐州为中心，歼敌五十五万余人。",
    "淮海战役由邓小平、刘伯承、陈毅、粟裕、谭震林组成总前委统一指挥。",
    "1948年11月至1949年1月，东北野战军与华北军区部队发起平津战役，基本解放华北全境。",
    "平津战役中，傅作义率部接受和平改编，北平和平解放。",
    "三大战役共歼灭国民党军队一百五十四万余人，国民党赖以维持统治的主要军事力量基本被摧毁。",
    "1949年4月，国共双方在北平举行和平谈判，国民党政府拒绝在《国内和平协定》上签字，和谈破裂。",
    "1949年4月21日，毛泽东、朱德发布《向全国进军的命令》，人民解放军发起渡江战役，突破国民党长江防线。",
    "1949年4月23日，人民解放军占领南京，宣告国民党反动统治的覆灭。"
  ]},
  {h:"7.7 七届二中全会与「两个务必」", items:[
    "1949年3月，中共七届二中全会在河北西柏坡召开。",
    "七届二中全会确定党的工作重心由乡村转移到城市，以恢复和发展生产为城市工作的中心任务。",
    "毛泽东在七届二中全会上提出「两个务必」：务必使同志们继续保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续保持艰苦奋斗的作风。",
    "七届二中全会规定了革命胜利后党在政治、经济、外交等方面的基本政策。",
    "七届二中全会指出，中国要由农业国转变为工业国，由新民主主义社会转变为社会主义社会。",
    "1949年6月30日，毛泽东发表《论人民民主专政》，系统阐述了人民民主专政的理论。",
    "《论人民民主专政》指出，新中国实行工人阶级领导的、以工农联盟为基础的人民民主专政。"
  ]},
  {h:"7.8 《共同纲领》与中华人民共和国的成立", items:[
    "1949年9月21日，中国人民政治协商会议第一届全体会议在北平召开，代行全国人民代表大会职权。",
    "政协会议通过《中国人民政治协商会议共同纲领》，它是新中国的施政纲领，起着临时宪法的作用。",
    "《共同纲领》规定，中华人民共和国为新民主主义即人民民主主义的国家，实行工人阶级领导的、以工农联盟为基础的、团结各民主阶级和国内各民族的人民民主专政。",
    "《共同纲领》规定国家的政权机关实行民主集中制。",
    "政协会议决定国都定于北平并改名北京，采用公元纪年，以《义勇军进行曲》为代国歌，五星红旗为国旗。",
    "1949年10月1日，毛泽东在天安门广场庄严宣告中华人民共和国中央人民政府成立，举行开国大典。",
    "中华人民共和国的成立，标志着新民主主义革命取得基本胜利，中国历史从此进入新纪元。"
  ]},
  {h:"7.9 新民主主义革命胜利的历史意义与基本经验", items:[
    "中国新民主主义革命的胜利，结束了帝国主义、封建主义和官僚资本主义在中国的统治。",
    "新民主主义革命的胜利，是马克思列宁主义、毛泽东思想的胜利。",
    "统一战线、武装斗争、党的建设，是中国革命战胜敌人的三大法宝。",
    "新民主主义革命的胜利，改变了世界政治力量的对比，增强了世界和平进步力量。",
    "中国人民革命的胜利，是继俄国十月革命和世界反法西斯战争胜利之后世界历史中最重大的事件之一。",
    "中国新民主主义革命的基本经验：坚持中国共产党的领导，坚持人民军队的武装斗争，坚持革命的统一战线。"
  ]},
  {h:"7.10 全章题目要点速记", items:[
    "1946年6月23日，上海人民团体联合会请愿团在南京下关车站遭国民党特务殴打，马叙伦等受伤，史称下关惨案。",
    "1946年1月，国民党特务捣毁政协会议陪都各界协进会演讲会场，制造沧白堂事件，破坏政协协议的实施。",
    "1946年1月10日，国共双方签订《停战协定》，规定双方军队停止一切战斗行动；同日政治协商会议在重庆开幕。",
    "1946年1月，政治协商会议（旧政协）通过《和平建国纲领》等五项协议，确认和平建国方针，有利于人民民主，但很快被国民党撕毁。",
    "1945年9月19日，中共中央确定「向北发展，向南防御」的战略方针，调兵抢占东北这一战略要地。",
    "重庆谈判中，国共双方斗争的焦点是解放区政权和人民军队问题，两党未能达成协议。",
    "1945年9月至10月，刘伯承、邓小平指挥晋冀鲁豫野战军进行上党战役，粉碎了国民党军对解放区的进攻。",
    "1946年6月底，李先念等率中原军区部队胜利突围，完成战略转移，中原突围揭开了解放战争的序幕。",
    "全面内战爆发后，中国共产党提出以自卫战争粉碎国民党军军事进攻的方针，坚持集中优势兵力、各个歼灭敌人。",
    "1947年3月，国民党军集中兵力重点进攻陕北和山东两个解放区。",
    "西北野战军在彭德怀指挥下，取得青化砭、羊马河、蟠龙三战三捷，稳定了陕北战局。",
    "1947年5月，华东野战军在孟良崮战役中全歼国民党王牌军整编第七十四师，粉碎其对山东解放区的重点进攻。",
    "1947年5月20日，国民党当局镇压学生「反饥饿、反内战、反迫害」游行，制造五二〇惨案，国统区第二条战线逐渐形成。",
    "1947年6月底，刘伯承、邓小平率晋冀鲁豫野战军主力千里跃进大别山，揭开人民解放军战略进攻的序幕。",
    "1947年6月至9月，陈赓、谢富治兵团挺进豫西，陈毅、粟裕大军挺进豫皖苏，与刘邓大军成品字形展开。",
    "1947年10月10日，《中国人民解放军总部宣言》正式提出「打倒蒋介石，解放全中国」的口号。",
    "1948年4月，毛泽东在《在晋绥干部会议上的讲话》中完整地提出新民主主义革命总路线。",
    "1948年4月30日，中共中央发布「五一口号」，号召各民主党派、人民团体召开新政治协商会议、成立民主联合政府。",
    "1947年11月，台湾民主自治同盟在香港成立，是解放战争时期成立的民主党派。",
    "1948年，毛泽东完整提出土地改革总路线：依靠贫农，团结中农，有步骤地、有分别地消灭封建剥削制度，发展农业生产。",
    "《中国土地法大纲》规定废除封建性及半封建性剥削的土地制度，按乡村全部人口平均分配土地，实行耕者有其田。",
    "解放区土地改革使亿万农民在政治上、经济上获得解放，翻身农民踊跃参军支前，为解放战争胜利奠定了深厚的群众基础。",
    "国统区经济危机最突出的表现是财政赤字巨大、恶性通货膨胀、物价飞涨，法币急剧贬值。",
    "1948年9月，华东野战军攻克济南，济南战役切断了国民党军南北联系，为战略决战创造了条件。",
    "1948年9月至11月，辽沈战役歼灭国民党军47万余人，解放东北全境，人民解放军在数量上第一次超过国民党军队。",
    "辽沈、淮海、平津三大战役历时四个月零十九天，共歼灭国民党军154万余人，基本上消灭了国民党军队的主力。",
    "1949年4月21日，人民解放军第二、第三野战军在西起湖口、东至江阴的千里战线上发起渡江战役。",
    "《论人民民主专政》指出，人民民主专政的基础是工人阶级、农民阶级和城市小资产阶级的联盟，主要是工人和农民的联盟。",
    "1949年9月，政协第一届全体会议通过《共同纲领》，确定了新中国的国家政权性质和基本政策，起了临时宪法的作用。",
    "《共同纲领》规定，中华人民共和国的政权机关实行民主集中制的人民代表大会制度。",
    "中国人民政治协商会议是中国人民民主统一战线的组织形式，新中国成立初期代行全国人民代表大会的职权。",
    "1949年10月1日，开国大典在北京天安门广场隆重举行，毛泽东庄严宣告中华人民共和国中央人民政府成立。",
    "毛泽东在七届二中全会上提出「两个务必」，其背景是革命即将取得全国胜利、党即将成为掌握全国政权的执政党。"
  ]}
 ]},

{ch:8, no:"第八章", title:"社会主义基本制度的全面确立", period:"下编 · 1949—至今",
 parts:[
  {h:"8.1 新中国的成立与《共同纲领》", items:[
    "1949年10月1日，中华人民共和国成立，标志着新民主主义社会在全国范围的建立。",
    "1949年9月21日，中国人民政治协商会议第一届全体会议在北京召开，通过了《中国人民政治协商会议共同纲领》。",
    "《共同纲领》在当时起着临时宪法的作用，规定了新中国的国体、政体等基本制度。",
    "《共同纲领》规定国体为工人阶级领导的、以工农联盟为基础的人民民主专政。",
    "《共同纲领》规定政体为人民代表大会制度，国家政权机关实行民主集中制。",
    "会议选举毛泽东为中央人民政府主席，决定定都北平并改名为北京，采用公元纪年，以《义勇军进行曲》为代国歌。",
    "1949年10月1日，开国大典在北京天安门广场隆重举行，毛泽东庄严宣告中华人民共和国中央人民政府成立。"
  ]},
  {h:"8.2 新中国成立的历史意义与新民主主义社会", items:[
    "新中国的成立，标志着中国新民主主义革命取得基本胜利，中国人民从此站起来了。",
    "新中国的成立，实现了民族独立和人民解放，结束了帝国主义、封建主义和官僚资本主义在中国的统治。",
    "新民主主义社会是一个过渡性质的社会，它属于社会主义体系，是中国从新民主主义向社会主义转变的中间环节。",
    "新民主主义社会的经济中存在着五种经济成分：国营经济、合作社经济、个体经济、私人资本主义经济和国家资本主义经济。",
    "在新民主主义社会的经济结构中，社会主义性质的国营经济居于领导地位，掌握着国家的经济命脉。",
    "土地改革完成后，新民主主义社会的主要矛盾是工人阶级与资产阶级的矛盾、社会主义道路与资本主义道路的矛盾。",
    "新中国成立初期，党的主要任务是继续完成民主革命的遗留任务，恢复国民经济，巩固人民民主专政。"
  ]},
  {h:"8.3 土地改革", items:[
    "1950年6月，中央人民政府颁布《中华人民共和国土地改革法》，新解放区土地改革全面展开。",
    "土地改革的基本目的是废除封建土地所有制，实行农民的土地所有制，解放农村生产力。",
    "新解放区的土地改革从1950年冬开始，到1952年底基本完成。",
    "土地改革中，全国约3亿多无地少地的农民无偿获得了约7亿亩土地和大量生产资料。",
    "土地改革的完成，消灭了封建剥削制度，巩固了工农联盟和人民民主专政，为农业社会主义改造创造了条件。"
  ]},
  {h:"8.4 抗美援朝", items:[
    "1950年6月，朝鲜战争爆发，美国武装干涉朝鲜内政，并把战火烧到中国东北边境。",
    "1950年10月，中共中央根据朝鲜政府的请求和国家安全的需要，作出抗美援朝、保家卫国的战略决策。",
    "中国人民志愿军在司令员兼政治委员彭德怀的率领下，于1950年10月19日跨过鸭绿江，开赴朝鲜战场。",
    "经过三年浴血奋战，1953年7月，朝鲜停战协定签订，抗美援朝战争取得伟大胜利。",
    "抗美援朝的胜利，打破了美国军队不可战胜的神话，极大地提高了新中国的国际地位。",
    "抗美援朝战争的胜利，为国家经济建设和社会改革赢得了相对稳定的和平环境。"
  ]},
  {h:"8.5 「三反」「五反」运动", items:[
    "1951年底至1952年，中共中央在党政机关工作人员中开展「三反」运动。",
    "「三反」运动的内容是反贪污、反浪费、反官僚主义。",
    "「三反」运动中揭露出的问题，推动了在私营工商业者中开展「五反」运动。",
    "「五反」运动的内容是反行贿、反偷税漏税、反盗骗国家财产、反偷工减料、反盗窃国家经济情报。",
    "「三反」「五反」运动打击了不法资本家的违法活动，教育和挽救了一批干部，巩固了人民民主专政和国营经济的领导地位。"
  ]},
  {h:"8.6 过渡时期总路线与「一化三改」", items:[
    "到1952年底，国民经济恢复任务胜利完成，工农业生产达到并超过历史最高水平。",
    "1953年，中共中央正式提出党在过渡时期的总路线。",
    "过渡时期总路线的内容是：要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、对手工业和对资本主义工商业的社会主义改造。",
    "过渡时期总路线被概括为「一化三改」，「一化」即社会主义工业化，「三改」即对农业、手工业和资本主义工商业的社会主义改造。",
    "过渡时期总路线于1954年载入《中华人民共和国宪法》。",
    "过渡时期总路线反映了中国由新民主主义向社会主义过渡的历史必然性，是照耀各项工作的灯塔。"
  ]},
  {h:"8.7 第一个五年计划与社会主义工业化", items:[
    "发展国民经济的第一个五年计划从1953年开始实施，到1957年底超额完成。",
    "「一五」计划的基本任务是集中主要力量发展重工业，为国家工业化奠定初步基础。",
    "「一五」期间，以「156项」重点工程为中心的工业建设全面展开。",
    "1956年，长春第一汽车制造厂建成投产，生产出我国第一批「解放」牌载重汽车。",
    "1957年，武汉长江大桥建成通车，天堑变通途。",
    "「一五」计划期间，我国建立起飞机制造业、汽车制造业、新式机床制造业等重工业部门，初步改变了工业落后的面貌。"
  ]},
  {h:"8.8 对农业、手工业的社会主义改造", items:[
    "农业的社会主义改造坚持自愿互利、典型示范、国家帮助的原则。",
    "农业合作化运动经历了由互助组、初级农业生产合作社到高级农业生产合作社的发展过程。",
    "1955年夏季以后，农业合作化运动掀起高潮，进入以高级社为中心的阶段。",
    "到1956年底，全国96.3%的农户加入了农业生产合作社，农业社会主义改造基本完成。",
    "手工业的社会主义改造采取积极领导、稳步前进的方针，经历了由供销小组、供销合作社到生产合作社的发展过程。",
    "到1956年底，全国91.7%的手工业者加入了手工业合作社，手工业社会主义改造基本完成。",
    "农业和手工业合作化运动的完成，促进了农业生产和手工业的发展，为社会主义经济制度的建立奠定了基础。"
  ]},
  {h:"8.9 对资本主义工商业的社会主义改造", items:[
    "对资本主义工商业的社会主义改造，采取和平赎买的政策，这是中国共产党的一大创举。",
    "对资本主义工商业的改造，通过国家资本主义的途径逐步实现。",
    "国家资本主义的初级形式有加工订货、统购包销、经销代销等，高级形式是公私合营。",
    "公私合营经历了个别企业公私合营到全行业公私合营的发展过程。",
    "1956年，全行业公私合营掀起高潮，资本主义工商业的社会主义改造基本完成。",
    "国家对公私合营企业实行定息制度，按年息五厘付给资本家定息，至1966年停止支付。",
    "对资本主义工商业的和平赎买，减少了改造的阻力，团结了民族资产阶级，促进了国民经济的恢复和发展。"
  ]},
  {h:"8.10 1954年宪法与社会主义基本制度的确立", items:[
    "1954年9月，第一届全国人民代表大会第一次会议在北京召开。",
    "会议通过了《中华人民共和国宪法》，这是我国第一部社会主义类型的宪法。",
    "1954年宪法以《共同纲领》为基础，又是它的发展，确立了人民代表大会制度这一根本政治制度。",
    "会议选举毛泽东为中华人民共和国主席，刘少奇为全国人大常委会委员长，任命周恩来为国务院总理。",
    "到1956年底，随着对生产资料私有制社会主义改造的基本完成，社会主义基本制度在中国全面确立。",
    "社会主义基本制度的确立，是中国历史上最深刻最伟大的社会变革。",
    "社会主义基本制度的确立，为当代中国一切发展进步奠定了根本政治前提和制度基础。"
  ]},
  {h:"8.11 全章题目要点速记", items:[
    "1950年6月，中共七届三中全会确定当时全党和全国人民的中心任务是争取国家财政经济状况的基本好转。",
    "毛泽东在七届三中全会上作《为争取国家财政经济状况的基本好转而斗争》的书面报告。",
    "1950年颁布的《中华人民共和国土地改革法》废除地主阶级封建剥削的土地所有制，实行农民的土地所有制。",
    "第一个五年计划于1953年至1957年实施，建设的重点是集中主要力量优先发展重工业，为国家工业化奠定初步基础。",
    "1951年5月，中央人民政府与西藏地方政府签订《关于和平解放西藏办法的协议》（十七条协议），西藏和平解放。",
    "1951年10月，人民解放军进驻拉萨，西藏和平解放，祖国大陆实现统一。",
    "新中国成立后立即没收官僚资本，在此基础上建立社会主义性质的国营经济，掌握了国家经济命脉。",
    "新中国成立初期实行「另起炉灶」「打扫干净屋子再请客」「一边倒」三大外交方针，奠定了新中国外交的基本格局。",
    "抗美援朝是抗击美国侵略者的正义战争，打出了新中国的国威和人民军队的军威，创造了以弱胜强的范例。",
    "抗美援朝支援了朝鲜人民、保卫了国家安全，使新中国国际威望空前提高，为经济建设和社会改革赢得相对稳定的和平环境。",
    "到1953年春，全国新解放区土地改革基本完成，三亿多农民分到土地，地主阶级作为阶级被消灭。",
    "新中国成立初期，工矿企业的民主改革废除了封建把头制度，确立了工人的主人翁地位，巩固了人民政权。",
    "1952年10月，中国人民志愿军取得上甘岭战役胜利，创造了依托坑道坚守防御的范例。",
    "1953年7月27日，《朝鲜停战协定》在板门店签订，抗美援朝战争胜利结束。",
    "「三反」运动中，刘青山、张子善因贪污国家资财被依法判处死刑，教育了广大干部。",
    "「三反」运动教育了广大干部，纯洁了干部队伍，加强了执政党建设。",
    "党在过渡时期总路线的实质是逐步改变生产资料的私有制，建立社会主义经济基础。",
    "「一五」期间，鞍山钢铁公司的大型轧钢厂、无缝钢管厂等建成投产，鞍钢是钢铁工业的重点建设基地。",
    "1955年，毛泽东发表《关于农业合作化问题》，推动农业合作化高潮的到来。",
    "农业社会主义改造把农民的个体所有制改造为社会主义集体所有制，实现共同富裕。",
    "个别企业公私合营阶段，企业利润按「四马分肥」分配，分给国家、企业、职工和资方。",
    "对资本主义工商业的和平赎买，是国家付出一定代价、有偿地把资本家的生产资料收归国有，如付给定息。",
    "1956年社会主义改造基本完成，社会主义基本制度确立，我国进入社会主义初级阶段。",
    "社会主义改造的完成，消灭了在中国延续几千年的剥削制度，剥削阶级作为阶级也基本被消灭。",
    "社会主义改造完成后，全民所有制和集体所有制等社会主义公有制经济在国民经济中占绝对优势。",
    "1953年12月，周恩来在接见印度代表团时首次提出和平共处五项原则。",
    "1954年6月，周恩来访问印度和缅甸，同两国总理共同倡导和平共处五项原则，成为处理国际关系的准则。",
    "1955年4月，周恩来在万隆会议上提出「求同存异」的方针，推动会议取得圆满成功。",
    "1947年5月，内蒙古自治区成立，是我国建立最早的省级民族自治区。",
    "新中国成立初期，陈云任中央财政经济委员会主任，领导「银元之战」「米棉之战」稳定了物价、统一了全国财经工作。",
    "1950年土地改革的总路线是依靠贫农、雇农，团结中农，中立富农，有步骤地消灭封建剥削制度。",
    "1950年10月，中共中央发出指示，在全国开展镇压反革命运动，巩固新生的人民政权。",
    "1956年社会主义改造基本完成，社会主义基本制度在中国全面确立，实现了中国历史上最深刻最伟大的社会变革。",
    "社会主义基本制度的确立，为当代中国一切发展进步奠定了根本政治前提和制度基础。"
  ]}
 ]},
{ch:9, no:"第九章", title:"社会主义建设在探索中曲折发展", period:"下编 · 1949—至今",
 parts:[
  {h:"9.1 《论十大关系》", items:[
    "1956年4月，毛泽东在中央政治局扩大会议上发表《论十大关系》的讲话。",
    "《论十大关系》以苏联的经验教训为鉴戒，初步总结了我国社会主义建设的经验。",
    "讲话提出调动一切积极因素，为社会主义事业服务的基本方针。",
    "讲话论述了重工业和轻工业、农业的关系，沿海工业和内地工业的关系，经济建设和国防建设的关系等十大关系。",
    "《论十大关系》的发表，标志着中国共产党探索中国自己的社会主义建设道路的开始。"
  ]},
  {h:"9.2 中共八大", items:[
    "1956年9月15日至27日，中国共产党第八次全国代表大会在北京召开。",
    "八大正确分析了社会主义改造基本完成以后国内形势和主要矛盾的变化。",
    "八大指出国内的主要矛盾是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。",
    "八大提出党和人民当前的主要任务是集中力量发展社会生产力，把我国尽快地从落后的农业国变为先进的工业国。",
    "八大坚持了既反保守又反冒进、在综合平衡中稳步前进的经济建设方针。",
    "八大着重提出了执政党的建设问题，强调要坚持民主集中制和集体领导制度，反对个人崇拜。",
    "八大的路线是正确的，为社会主义事业的发展和党的建设指明了方向，但许多正确的意见没有能够在实践中坚持下去。"
  ]},
  {h:"9.3 《关于正确处理人民内部矛盾的问题》", items:[
    "1957年2月，毛泽东在最高国务会议上发表《关于正确处理人民内部矛盾的问题》的讲话。",
    "讲话提出必须区分社会主义社会两类不同性质的矛盾：敌我矛盾和人民内部矛盾。",
    "讲话指出解决人民内部矛盾要用民主的方法、说服教育的方法，实行「团结—批评—团结」的方针。",
    "讲话提出正确处理人民内部矛盾是国家政治生活的主题。",
    "讲话还重申了发展科学文化事业的「百花齐放、百家争鸣」方针。"
  ]},
  {h:"9.4 整风运动与反右派斗争", items:[
    "1957年4月，中共中央发出开展整风运动的指示，以反对官僚主义、宗派主义和主观主义为主要内容。",
    "整风运动采取开门整风的形式，发动广大群众和党外人士向党提出批评建议。",
    "在整风运动中，极少数资产阶级右派分子乘机向党和新生的社会主义制度发动进攻。",
    "1957年6月开始的反对资产阶级右派的斗争是必要的，但被严重扩大化，把一批知识分子、爱国人士和党内干部错划为「右派分子」，造成了不幸的后果。"
  ]},
  {h:"9.5 「大跃进」运动", items:[
    "1958年5月，中共八大二次会议通过「鼓足干劲、力争上游、多快好省地建设社会主义」的总路线。",
    "总路线反映了人民群众迫切要求改变我国经济文化落后状况的普遍愿望，但忽视了客观经济规律。",
    "「大跃进」运动从1958年开始，片面追求工农业生产和建设的高速度，不断大幅度提高计划指标。",
    "工业上以钢为纲，1958年8月北戴河会议提出钢产量比1957年翻一番、达到1070万吨的脱离实际的指标。",
    "农业生产上大放「高产卫星」，虚报产量，浮夸风严重泛滥。",
    "「大跃进」运动造成国民经济主要比例关系严重失调，使社会主义建设遭受严重挫折。"
  ]},
  {h:"9.6 人民公社化运动", items:[
    "1958年8月，中共中央在北戴河召开政治局扩大会议，作出在农村普遍建立人民公社的决议。",
    "人民公社的基本特点是「一大二公」，实行政社合一。",
    "人民公社化运动中大搞「一平二调」，刮起「共产风」，实行平均主义分配，严重损害了农民利益。",
    "人民公社化运动严重脱离当时农村生产力的发展水平，挫伤了广大农民的生产积极性。",
    "「大跃进」和人民公社化运动，是党在探索中国自己的社会主义建设道路过程中的一次严重失误。"
  ]},
  {h:"9.7 国民经济的调整", items:[
    "1961年1月，中共八届九中全会正式决定对国民经济实行「调整、巩固、充实、提高」的八字方针。",
    "八字方针的中心是调整，主要是调整国民经济各部门的比例关系，大力加强农业，压缩基本建设规模。",
    "1962年1月，中共中央召开扩大的中央工作会议（即七千人大会），初步总结了「大跃进」以来的经验教训。",
    "七千人大会发扬民主，开展批评和自我批评，强调恢复和坚持民主集中制，统一了全党认识。",
    "到1965年，国民经济调整的任务基本完成，国民经济得到恢复和发展。",
    "1964年底至1965年初，第三届全国人民代表大会第一次会议召开，周恩来在政府工作报告中提出实现「四个现代化」的宏伟目标。"
  ]},
  {h:"9.8 「文化大革命」的严重失误", items:[
    "「文化大革命」历时十年，从1966年5月发动，到1976年10月粉碎「四人帮」而结束。",
    "1966年5月，中央政治局扩大会议通过《五一六通知》，标志着「文化大革命」的全面发动。",
    "1966年8月，中共八届十一中全会通过《关于无产阶级文化大革命的决定》（即《十六条》）。",
    "1967年1月，上海「一月革命」夺权风暴后，全国掀起夺权高潮，武斗不止，形成全面内乱。",
    "1969年4月，中共九大全面肯定「文化大革命」，使「文化大革命」的错误理论和实践合法化。",
    "1971年9月，林彪反革命集团阴谋发动武装政变被粉碎，林彪等人叛逃，在蒙古温都尔汗机毁身亡，即「九一三事件」。",
    "1976年10月，中央政治局执行党和人民的意志，粉碎江青反革命集团（即「四人帮」），「文化大革命」结束。",
    "「文化大革命」不是任何意义上的革命和社会进步，它使党、国家和各族人民遭到新中国成立以来最严重的挫折和损失。"
  ]},
  {h:"9.9 社会主义建设的主要成就", items:[
    "尽管遭受「文化大革命」等严重挫折，我国社会主义建设仍然取得了一批重要成就。",
    "1964年10月，我国自行研制的第一颗原子弹爆炸成功。",
    "1967年6月，我国第一颗氢弹爆炸成功。",
    "1970年4月，我国第一颗人造地球卫星「东方红一号」发射成功。",
    "1971年10月，第26届联合国大会通过决议，恢复中华人民共和国在联合国的一切合法权利。",
    "1972年2月，美国总统尼克松访华，中美两国发表《上海公报》，中美关系开始走向正常化。",
    "20世纪60年代，大庆油田建成投产，我国实现石油基本自给，甩掉了「贫油国」的帽子。",
    "三线建设取得重大成就，建成攀枝花钢铁基地、成昆铁路等一大批项目，改善了我国的工业布局。"
  ]},
  {h:"9.10 探索中积累的经验教训", items:[
    "探索中的经验教训说明，必须把马克思主义基本原理同中国具体实际相结合，走自己的路。",
    "必须始终坚持以经济建设为中心，把发展社会生产力作为根本任务，防止「以阶级斗争为纲」的错误。",
    "必须一切从实际出发，实事求是，按客观经济规律办事，反对急于求成和盲目冒进。",
    "必须坚持党的民主集中制和集体领导制度，反对个人崇拜，健全社会主义民主和法制。",
    "探索中形成的关于社会主义建设的一系列正确理论和政策思想，是党和人民的宝贵精神财富。",
    "社会主义建设中铸就的「两弹一星」精神、大庆精神等，是激励中国人民前进的宝贵精神财富。"
  ]},
  {h:"9.11 全章题目要点速记", items:[
    "1956年，陈云在中共八大上提出「三个主体、三个补充」的构想，在坚持计划经济的前提下允许一定范围的市场调节。",
    "「大跃进」和人民公社化运动中出现高指标、瞎指挥、浮夸风和「共产风」等「左」倾错误，分配上搞平均主义而非按劳分配。",
    "1971年10月，第26届联合国大会通过决议，恢复中华人民共和国在联合国的一切合法权利，这是中国外交的重大胜利。",
    "全面建成小康社会是党的十八大以来新时代取得的成就，不属于1956—1976年社会主义建设探索时期的成就。",
    "1964年底，周恩来在三届全国人大一次会议的政府工作报告中提出，把我国建设成为具有现代工业、现代农业、现代国防和现代科学技术的社会主义强国。",
    "1960年大庆油田开始大规模开发，实现石油基本自给，结束了中国石油依赖进口的历史，甩掉了「贫油国」帽子。",
    "1972年9月，日本首相田中角荣访华，中日两国发表联合声明，实现邦交正常化。",
    "1972年尼克松访华发表《上海公报》，1979年1月1日中美两国正式建立外交关系。",
    "焦裕禄任河南兰考县委书记期间，身患肝癌仍带领群众治理内涝、风沙、盐碱「三害」，被誉为「县委书记的榜样」。",
    "1967年2月，谭震林、陈毅、叶剑英等老一辈革命家批评「文化大革命」的错误做法，被诬称为「二月逆流」。",
    "1957年6月，中共中央决定开展全国规模的反右派斗争，这场斗争是必要的，但被严重扩大化。",
    "1959年庐山会议后期，毛泽东错误地发动对彭德怀的批判，使「左」倾错误进一步扩大。",
    "1956年4月毛泽东作《论十大关系》报告，论述重工业和轻工业、农业等十个方面的关系，基本方针是调动一切积极因素为社会主义事业服务。",
    "1956年9月中共八大选举毛泽东为中央委员会主席，邓小平为中央委员会总书记。",
    "中共八大指出，社会主义改造基本完成后，工人阶级同资产阶级的矛盾已经不是我国社会的主要矛盾。",
    "毛泽东指出，敌我矛盾用专政的方法解决，人民内部矛盾用民主的、说服教育的方法解决。",
    "毛泽东指出，社会主义社会的基本矛盾仍然是生产关系和生产力、上层建筑和经济基础之间的矛盾。",
    "「大跃进」以全民大炼钢铁为中心，片面追求钢产量高指标，造成人力物力的严重浪费。",
    "1958年8月，中共中央在北戴河召开政治局扩大会议，通过《关于在农村建立人民公社问题的决议》。",
    "人民公社的基本特点是「一大二公」、政社合一，即规模大、公有化程度高，政权组织与经济组织合为一体。",
    "1958年11月，毛泽东主持召开第一次郑州会议，开始纠正已经觉察到的「左」的错误。",
    "1960年冬，中共中央决定对国民经济实行「调整、巩固、充实、提高」的八字方针，1961年1月八届九中全会正式通过。",
    "1959年至1961年，由于「大跃进」和自然灾害等原因，我国国民经济发生严重困难，即三年困难时期。",
    "1976年4月，人民群众在天安门广场悼念周恩来、反对「四人帮」的群众运动被称为「四五运动」。",
    "1975年邓小平主持中央日常工作，对各条战线进行全面整顿，使形势明显好转。",
    "1968年南京长江大桥建成通车，是社会主义建设探索时期的重要建设成就。",
    "1973年，袁隆平成功培育出籼型杂交水稻，为解决中国的粮食问题作出重大贡献。",
    "1965年，我国在世界上首次人工合成结晶牛胰岛素，是生命科学领域的重大突破。",
    "1964年，中国与法国正式建立外交关系，实现了同西方大国建交的重要突破。",
    "20世纪60年代，我国工业战线开展工业学大庆、农业战线开展农业学大寨运动，树立了生产建设典型。",
    "社会主义建设的根本立足点是从中国的国情出发，走自己的路，把马克思主义基本原理同中国具体实际相结合。",
    "「大跃进」和人民公社化运动的主要教训是：变革生产关系必须适应生产力发展水平，不能急于求成。",
    "「文化大革命」的教训表明，必须发展社会主义民主、健全社会主义法制，坚持民主集中制和集体领导。",
    "对1956—1976年社会主义建设探索的总体评价是：取得了巨大成就，但也经历了严重曲折。",
    "国民经济调整时期，人民公社实行三级所有、队为基础，基本核算单位下放到生产队。",
    "1959年4月，第二届全国人民代表大会第一次会议选举刘少奇为中华人民共和国主席。",
    "1970年8月，中共九届二中全会上，林彪集团抢班夺权的阴谋被毛泽东识破。",
    "《论十大关系》初步总结了我国社会主义建设经验，提出探索适合中国国情的社会主义建设道路的任务，是探索中国自己的建设道路的良好开端。"
  ]}
 ]},
{ch:10, no:"第十章", title:"中国特色社会主义的开创与接续发展", period:"下编 · 1949—至今",
 parts:[
  {h:"10.1 历史性伟大转折：真理标准问题大讨论", items:[
    "1978年5月11日，《光明日报》发表《实践是检验真理的唯一标准》一文，引发全国范围的真理标准问题大讨论。",
    "真理标准问题大讨论冲破了「两个凡是」的束缚，重新确立了实践是检验真理的唯一标准这一马克思主义基本原理。",
    "真理标准问题大讨论是一场深刻的思想解放运动，为中共十一届三中全会实现伟大历史转折奠定了思想基础。",
    "邓小平支持和推动了真理标准问题大讨论，指出实事求是是毛泽东思想的出发点、根本点。",
    "1978年12月，邓小平在中央工作会议闭幕会上发表《解放思想，实事求是，团结一致向前看》的重要讲话，实际上成为中共十一届三中全会的主题报告。",
  ]},
  {h:"10.2 中共十一届三中全会：伟大的历史转折", items:[
    "1978年12月18日至22日，中共十一届三中全会在北京召开。",
    "全会批判了「两个凡是」的错误方针，高度评价了关于真理标准问题的讨论。",
    "全会果断停止使用「以阶级斗争为纲」的口号，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策。",
    "全会提出健全社会主义民主、加强社会主义法制的任务，审查和解决了党的历史上一批重大冤假错案。",
    "中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折，开启了改革开放和社会主义现代化建设的新时期。",
  ]},
  {h:"10.3 农村改革与家庭联产承包责任制", items:[
    "我国的改革首先从农村开始，安徽、四川等省率先实行包产到户、包干到户的家庭联产承包责任制。",
    "家庭联产承包责任制坚持土地等基本生产资料集体所有，把土地的经营权、使用权交给农民，实行多劳多得。",
    "家庭联产承包责任制调动了农民的生产积极性，解放和发展了农村生产力，促进了农业生产的迅速发展。",
    "到1983年初，全国农村实行包产到户、包干到户的生产队达到93%以上，家庭联产承包责任制在全国普遍推广。",
    "1982年至1986年，中共中央连续五年发出中央一号文件，对农村改革和农业发展作出部署，肯定并推广了家庭联产承包责任制。",
  ]},
  {h:"10.4 经济特区与对外开放格局", items:[
    "1979年7月，中共中央、国务院决定在广东、福建两省实行特殊政策和灵活措施，试办出口特区，后改称经济特区。",
    "1980年，中共中央正式决定在深圳、珠海、汕头、厦门设立经济特区，实行特殊的经济政策和管理体制。",
    "经济特区发挥对外开放窗口和经济体制改革试验场的作用，成为我国对外开放的排头兵。",
    "1984年，中共中央、国务院决定进一步开放大连、天津、上海、广州等14个沿海港口城市。",
    "1985年，中共中央决定开辟长江三角洲、珠江三角洲、闽南三角地区等沿海经济开放区。",
    "1988年4月，七届全国人大一次会议批准设立海南省，海南成为我国最大的经济特区。",
    "我国逐步形成了「经济特区—沿海开放城市—沿海经济开放区—内地」的多层次、有重点、点面结合的对外开放格局。",
  ]},
  {h:"10.5 改革开放的全面展开与社会主义初级阶段理论", items:[
    "1982年9月，中共十二大召开，邓小平在开幕词中提出「建设有中国特色的社会主义」的科学命题。",
    "1984年10月，中共十二届三中全会通过《关于经济体制改革的决定》，提出社会主义经济是公有制基础上的有计划的商品经济，经济体制改革的重点由农村转向城市。",
    "1987年10月，中共十三大系统阐述了社会主义初级阶段理论，明确指出我国正处于并将长期处于社会主义初级阶段。",
    "中共十三大概括了党在社会主义初级阶段的基本路线，即「一个中心、两个基本点」：以经济建设为中心，坚持四项基本原则，坚持改革开放。",
    "四项基本原则是立国之本，即坚持社会主义道路、坚持人民民主专政、坚持中国共产党的领导、坚持马克思列宁主义毛泽东思想。",
  ]},
  {h:"10.6 「三步走」发展战略与邓小平南方谈话", items:[
    "中共十三大提出「三步走」发展战略：第一步，到1990年实现国民生产总值比1980年翻一番，解决人民的温饱问题。",
    "「三步走」战略第二步：到20世纪末，使国民生产总值再增长一倍，人民生活达到小康水平。",
    "「三步走」战略第三步：到21世纪中叶，人均国民生产总值达到中等发达国家水平，人民生活比较富裕，基本实现现代化。",
    "1992年初，邓小平先后视察武昌、深圳、珠海、上海等地并发表重要讲话，即南方谈话。",
    "南方谈话指出：计划多一点还是市场多一点，不是社会主义与资本主义的本质区别，计划和市场都是经济手段，强调「发展才是硬道理」。",
    "南方谈话提出判断改革开放和各项工作是非得失的「三个有利于」标准，即是否有利于发展社会主义社会的生产力、是否有利于增强社会主义国家的综合国力、是否有利于提高人民的生活水平。",
    "南方谈话科学总结了中共十一届三中全会以来的基本实践和基本经验，把改革开放和现代化建设推进到新的阶段。",
  ]},
  {h:"10.7 社会主义市场经济体制的确立", items:[
    "1992年10月，中共十四大明确提出，我国经济体制改革的目标是建立社会主义市场经济体制。",
    "1993年11月，中共十四届三中全会通过《关于建立社会主义市场经济体制若干问题的决定》，勾画了社会主义市场经济体制的基本框架。",
    "以公有制为主体、多种所有制经济共同发展，是我国社会主义初级阶段的基本经济制度。",
    "社会主义市场经济体制使市场在资源配置中发挥基础性作用，同时注重加强和改善国家对经济的宏观调控。",
    "1997年9月，中共十五大召开，将邓小平理论确立为党的指导思想并写入党章。",
  ]},
  {h:"10.8 「一国两制」与香港、澳门回归", items:[
    "邓小平提出了「一国两制」的科学构想，即在中华人民共和国内，国家主体实行社会主义制度，香港、澳门、台湾保持原有的资本主义制度长期不变。",
    "1984年12月，中英两国政府正式签署《关于香港问题的联合声明》，确认中国政府于1997年7月1日对香港恢复行使主权。",
    "1987年4月，中葡两国政府正式签署《关于澳门问题的联合声明》，确认中国政府于1999年12月20日对澳门恢复行使主权。",
    "1997年7月1日，香港回归祖国，中华人民共和国香港特别行政区成立。",
    "1999年12月20日，澳门回归祖国，中华人民共和国澳门特别行政区成立。",
    "香港、澳门的回归，标志着中国人民洗雪了百年国耻，是祖国和平统一大业进程中的重要里程碑。",
  ]},
  {h:"10.9 加入世界贸易组织", items:[
    "2001年12月11日，中国正式加入世界贸易组织，标志着我国对外开放进入新的阶段。",
    "加入世界贸易组织，使我国能够在更大范围、更广领域、更高层次上参与国际经济技术合作与竞争。",
    "加入世界贸易组织为我国的经济发展注入了新的活力，也带来了新的挑战，推动我国加快经济结构调整和体制机制改革。",
    "中国加入世界贸易组织，是中国共产党和中国政府顺应经济全球化趋势作出的重大战略决策。",
    "加入世界贸易组织后，我国认真履行承诺，逐步降低关税、开放市场，与世界各国的经贸联系日益紧密。",
  ]},
  {h:"10.10 「三个代表」重要思想、科学发展观与全面建设小康社会", items:[
    "2000年2月，江泽民在广东考察时提出「三个代表」重要思想。",
    "「三个代表」重要思想，即中国共产党必须始终代表中国先进生产力的发展要求，代表中国先进文化的前进方向，代表中国最广大人民的根本利益。",
    "2002年11月，中共十六大把「三个代表」重要思想确立为党必须长期坚持的指导思想并写入党章。",
    "中共十六大提出全面建设小康社会的奋斗目标，即在本世纪头二十年，集中力量全面建设惠及十几亿人口的更高水平的小康社会。",
    "2003年10月，中共十六届三中全会提出科学发展观，强调坚持以人为本，树立全面、协调、可持续的发展观。",
    "2007年10月，中共十七大把科学发展观写入党章，并提出了全面建设小康社会奋斗目标的新要求。",
  ]},
  {h:"10.11 全章题目要点速记", items:[
    "1978年底，安徽凤阳县小岗村农民率先实行包产到户，拉开了农村改革的序幕。",
    "「一国两制」科学构想最初是为解决台湾问题而提出，后来首先运用于解决香港、澳门问题。",
    "1990年4月，中共中央、国务院作出开发开放上海浦东的决策，浦东成为20世纪90年代改革开放的重点。",
    "2005年3月，十届全国人大三次会议通过《反分裂国家法》，以法律形式维护国家主权和领土完整。",
    "1977年2月，「两个凡是」方针提出，即凡是毛主席作出的决策都坚决维护，凡是毛主席的指示都始终不渝地遵循。",
    "真理标准问题大讨论的实质是党的思想路线问题，重新确立了解放思想、实事求是的思想路线。",
