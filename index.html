{id:"c3q162",ch:3,t:"j",real:true,src:"2013年10月真题",fs:6,q:"1905—1907年资产阶级革命派和改良派论战的意义是什么？",
kw:["革命与改良的界限","三民主义思想","革命力量的壮大","思想基础"],
ref:"1905年至1907年，资产阶级革命派与改良派展开大论战，以革命派的胜利告终，具有重要意义：①论战划清了革命与改良的界限，使人们认识到实行民主革命的必要性，从而参加到革命的行列；②论战使资产阶级民主思想和三民主义思想得到更加广泛深入的传播，促进了革命力量的壮大；③论战的胜利为推翻清朝统治的革命斗争奠定了思想基础，推动了辛亥革命的发生。",p:["革命论战"]},
{id:"c4q156",ch:4,t:"j",real:true,src:"2013年10月真题",fs:6,q:"北伐战争直接打击的目标和战略方针是什么？",
kw:["北洋军阀","集中兵力","两湖","孙传芳","张作霖"],
ref:"北伐战争直接打击的目标是帝国主义支持的北洋军阀。北伐军在以加伦为首的苏联军事顾问建议下，制定了集中兵力、各个歼敌的战略方针：①首先以主力进军两湖，消灭吴佩孚；②然后引兵东向，消灭孙传芳；③最后北上解决张作霖。按照这一方针，北伐军先在两湖战场取得决定性胜利，继而进军东南，在较短时间内各个击破敌人，推动了国民革命的高涨。",p:["北伐战争"]},
{id:"c6q162",ch:6,t:"j",real:true,src:"2013年10月真题",fs:6,q:"中国人民抗日战争胜利的主要原因是什么？",
kw:["中流砥柱","全面抗战路线","决定性因素","反法西斯力量"],
ref:"中国人民抗日战争胜利的主要原因有：①中国共产党在全民族抗战中发挥了中流砥柱的作用，提出全面抗战路线和持久战方针，开辟敌后战场；②中国人民巨大的民族觉醒、空前的民族团结和英勇的民族抗争，是抗战胜利的决定性因素；③抗战胜利同世界所有爱好和平和正义的国家和人民、国际组织以及各种反法西斯力量的同情和支持分不开。",p:["抗战胜利"]},
{id:"c8q155",ch:8,t:"j",real:true,src:"2013年10月真题",fs:6,q:"《中国人民政治协商会议共同纲领》中规定的新中国经济工作方针是什么？",
kw:["公私兼顾","劳资两利","城乡互助","内外交流","分工合作"],
ref:"《共同纲领》规定：以公私兼顾、劳资两利、城乡互助、内外交流的政策，达到发展生产、繁荣经济之目的。国家应调剂国营经济、个体经济、私人资本主义经济等，使各种社会经济成分在国营经济领导之下，分工合作，各得其所，以促进整个社会经济的发展。这一方针兼顾公私、劳资、城乡、内外各方面利益，有利于恢复和发展国民经济。",p:["《共同纲领》"]},
{id:"c8q156",ch:8,t:"j",real:true,src:"2013年10月真题",fs:6,q:"1952年我国开展的「五反」运动的内容是什么？",
kw:["反行贿","反偷税漏税","反盗窃国家资财","反偷工减料","反盗窃国家经济情报"],
ref:"1952年1月，中共中央决定在城市私营工商业者中开展「五反」运动，其内容是：反行贿、反偷税漏税、反盗窃国家资财、反偷工减料、反盗窃国家经济情报。运动历时半年，打击了不法资本家的「五毒」行为，在工商业者中普遍进行了一次守法经营教育，推动了在私营企业中建立工人监督和民主改革。这一运动同党政机关开展的「三反」运动相配合，为资本主义工商业的社会主义改造创造了条件。",p:["三反五反"]},
{id:"c1q160",ch:1,t:"l",real:true,src:"2013年10月真题",fs:10,q:"怎样认识近代中国半殖民地半封建社会的特点？",
kw:["半殖民地半封建社会","财政和经济命脉","社会基础和统治支柱","土地所有制","发展极不平衡","极端贫困化"],
ref:"以1840年鸦片战争为标志，中国由封建社会逐步演变为半殖民地半封建社会。其特点主要是：①资本—帝国主义不但逐步操纵了中国的财政和经济命脉，而且逐步控制了中国的政治，日益成为支配中国的决定性力量；②中国的封建势力同外国侵略势力相勾结，成为外国列强压迫、奴役中国人民的社会基础和统治支柱；③自然经济的基础虽然遭到破坏，但封建剥削制度的根基即封建地主的土地所有制依然在广大地区内保持着，成为中国走向现代化和民主化的严重障碍；④中国资本主义有所发展，但没有成为中国社会经济的主体，在帝国主义和封建主义压迫下发展缓慢、力量软弱；⑤由于外国列强的争斗和间接统治，加上地域广大和地方割据势力存在，各地区经济、政治和文化发展极不平衡；⑥人民毫无政治权利，生活极端贫困化。",p:["社会性质"]},
{id:"c10q169",ch:10,t:"l",real:true,src:"2013年10月真题",fs:10,q:"为什么说中共十一届三中全会是新中国成立以来具有深远历史意义的伟大转折？",
kw:["伟大转折","两个凡是","真理标准问题","思想路线","拨乱反正","改革开放"],
ref:"中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折。①全会冲破长期「左」的错误的严重束缚，彻底否定「两个凡是」的错误方针，高度评价关于真理标准问题的讨论，否定「以阶级斗争为纲」的指导思想，作出把工作重点转移到社会主义现代化建设上来和实行改革开放的战略决策，重新确立了马克思主义的思想路线、政治路线和组织路线；②全会恢复党的民主集中制传统，审查解决历史上遗留的一批重大问题和重要领导人的功过是非问题，决定加强民主、健全法制，成立中央纪律检查委员会；③全会结束了粉碎「四人帮」后两年在徘徊中前进的局面，开始了思想、政治、组织等领域的全面拨乱反正，形成以邓小平为核心的中央领导集体，揭开了社会主义改革开放的序幕，中国进入改革开放和社会主义现代化建设的历史新时期。",p:["十一届三中全会"]},
{id:"c1q161",ch:1,t:"l",real:true,src:"2014年4月真题",fs:10,q:"试述中国半殖民地半封建社会的主要矛盾及其相互关系。",
kw:["帝国主义与中华民族","封建主义与人民大众","最主要的矛盾","民族矛盾","阶级矛盾","相互制约"],
ref:"（1）两对主要矛盾的内容。在半殖民地半封建社会的中国，帝国主义与中华民族的矛盾、封建主义与人民大众的矛盾，是近代中国社会的两对主要矛盾。其中，帝国主义与中华民族的矛盾是各种矛盾中最主要的矛盾。（2）两对矛盾的相互交织。这两对主要矛盾相互交织在一起，贯穿于半殖民地半封建社会的始终，对中国社会的发展变化起着决定性作用。（3）两对矛盾的地位变化。当帝国主义向中国发动侵略战争时，民族矛盾上升为主要矛盾，国内阶级矛盾暂时退居次要地位，中国社会各阶级能够暂时联合起来共同对敌；当帝国主义采取较温和的侵略方式，而国内反动统治阶级加重对人民的压迫时，阶级矛盾就上升为主要矛盾。（4）两对矛盾的相互影响。民族矛盾的发展会激化国内的阶级矛盾，阶级矛盾的解决又有利于民族矛盾的解决，二者相互制约、相互影响。（5）认识两对矛盾的意义。正确认识和处理这两对主要矛盾及其关系，是认清近代中国社会性质、确定革命任务和革命策略的基本依据。",p:["主要矛盾"]},
{id:"c2q150",ch:2,t:"s",real:true,src:"2014年4月真题",q:"中国近代史上第一个具有资本主义色彩的改革方案是",o:["《海国图志》","《救亡决论》","《资政新篇》","《盛世危言》"],a:"C",x:"太平天国后期洪仁玕提出《资政新篇》，是带有鲜明资本主义色彩的改革与建设方案，但未涉及农民和土地问题。",p:["太平天国"]},

{id:"c2q152",ch:2,t:"s",real:true,src:"2014年4月真题",q:"洋务派兴办洋务事业的指导思想是",o:["师夷长技以制夷","中学为体，西学为用","物竞天择，适者生存","变法维新，救亡图存"],a:"B",x:"洋务运动以「中学为体，西学为用」为指导，即在维护封建制度的前提下学习西方近代技术，以维持清朝统治。",p:["洋务运动"]},
{id:"c3q163",ch:3,t:"s",real:true,src:"2014年4月真题",q:"1894年，孙中山在檀香山建立的资产阶级革命组织是",o:["兴中会","华兴会","光复会","岳王会"],a:"A",x:"1894年孙中山在檀香山建立中国第一个资产阶级革命组织兴中会，1895年在香港成立总部，以推翻清政府为宗旨。",p:["革命组织"]},
{id:"c3q164",ch:3,t:"s",real:true,src:"2014年4月真题",q:"1905年，中国同盟会成立后的机关报是",o:["《时务报》","《国闻报》","《新民丛报》","《民报》"],a:"D",x:"1905年8月中国同盟会在东京成立，以「驱除鞑虏，恢复中华，创立民国，平均地权」为纲领，机关报为《民报》。",p:["革命组织"]},
{id:"c3q165",ch:3,t:"s",real:true,src:"2014年4月真题",q:"1911年夏，湖北、湖南、广东和四川爆发的民众斗争运动是",o:["拒俄运动","拒法运动","保路运动","立宪运动"],a:"C",x:"1911年清政府宣布铁路干线收归国有并出卖路权，湘鄂粤川四省掀起保路运动，四川尤为激烈，成为武昌起义的导火索。",p:["辛亥革命"]},
{id:"c3q166",ch:3,t:"j",real:true,src:"2014年4月真题",fs:6,q:"辛亥革命失败后，以孙中山为首的资产阶级革命派为反对北洋军阀的统治，发动了哪些主要斗争？",
kw:["二次革命","护国运动","护法运动","讨袁","临时约法"],
ref:"（1）发动二次革命。1913年宋教仁被刺后，孙中山领导革命党人在江西、江苏等地举兵讨袁，因力量悬殊而失败。（2）发动护国运动。袁世凯复辟帝制后，孙中山发表《讨袁宣言》，革命党人联络西南军阀和各省民众起兵反袁，迫使袁世凯取消帝制并很快死去。（3）发动护法运动。1917年段祺瑞拒绝恢复《临时约法》和国会，孙中山南下广州组织护法军政府，举起护法旗帜，后因军阀排挤而失败。这些斗争打击了北洋军阀的统治，但未能改变半殖民地半封建的社会性质。",p:["二次革命","护国运动","护法运动"]},
{id:"c4q157",ch:4,t:"s",real:true,src:"2014年4月真题",q:"1915年9月在上海创办《青年》杂志的是",o:["胡适","鲁迅","陈独秀","李大钊"],a:"C",x:"1915年9月陈独秀在上海创办《青年》杂志，次年改名为《新青年》，标志着新文化运动的兴起。",p:["新文化运动"]},
{id:"c4q158",ch:4,t:"s",real:true,src:"2014年4月真题",q:"中国新民主主义革命开端的标志是",o:["护法运动","新文化运动","五四运动","五卅运动"],a:"C",x:"五四运动是一次彻底反帝反封建的革命运动，促进了马克思主义同工人运动的结合，是中国新民主主义革命的开端。",p:["五四运动"]},
{id:"c4q159",ch:4,t:"s",real:true,src:"2014年4月真题",q:"受俄国十月革命影响，在中国率先举起马克思主义旗帜的是",o:["陈独秀","陈望道","毛泽东","李大钊"],a:"D",x:"十月革命后李大钊率先由民主主义者转变为共产主义者，发表《庶民的胜利》等文章，在中国最先举起马克思主义旗帜。",p:["马克思主义传播"]},
{id:"c4q160",ch:4,t:"s",real:true,src:"2014年4月真题",q:"1920年3月，在北京大学成立的学习和宣传马克思主义的社团是",o:["新民学会","觉悟社","马克思学说研究会","互助社"],a:"C",x:"1920年3月在李大钊指导下，邓中夏、高君宇等在北京大学成立马克思学说研究会，学习和宣传马克思主义。",p:["马克思主义传播"]},
{id:"c4q161",ch:4,t:"s",real:true,src:"2014年4月真题",q:"1920年8月，陈独秀领导建立的中国共产党早期组织是",o:["上海共产主义小组","北京共产主义小组","武汉共产主义小组","广州共产主义小组"],a:"A",x:"1920年8月陈独秀在上海建立共产主义小组并任书记，这是中国第一个地方共产党组织。",p:["中国共产党诞生"]},
{id:"c4q162",ch:4,t:"s",real:true,src:"2014年4月真题",q:"中国共产党领导的工人运动第一个高潮的起点是",o:["香港海员罢工","安源路矿工人罢工","京汉铁路工人罢工","省港工人罢工"],a:"A",x:"1922年1月香港海员罢工坚持五十六天并迫使港英当局增加工资，是中国工人阶级第一次直接同帝国主义势力的有组织较量。",p:["工人运动"]},
{id:"c5q161",ch:5,t:"s",real:true,src:"2014年4月真题",q:"国民党四大家族官僚资本的性质是",o:["私人垄断资本主义","封建的买办的国家垄断资本主义","私人资本主义","国家资本主义"],a:"B",x:"国民党统治建立后，官僚资本同国家政权、外国帝国主义和本国地主阶级结合，成为买办的封建的国家垄断资本。",p:["国民党统治"]},
{id:"c5q162",ch:5,t:"s",real:true,src:"2014年4月真题",q:"1927年，中共八七会议确定的总方针是",o:["推翻北洋军阀黑暗统治","开辟农村革命根据地","开展土地革命和武装斗争","建立工农民主统一战线"],a:"C",x:"1927年8月7日中共中央在汉口召开八七会议，清算陈独秀右倾机会主义错误，确定了土地革命和武装斗争的总方针。",p:["八七会议"]},
{id:"c5q163",ch:5,t:"s",real:true,src:"2014年4月真题",q:"1930年5月，毛泽东撰写的关于坚持辩证唯物主义思想路线的著作是",o:["《中国的红色政权为什么能够存在？》","《井冈山的斗争》","《星星之火，可以燎原》","《反对本本主义》"],a:"D",x:"1930年5月毛泽东撰写《反对本本主义》，阐明坚持辩证唯物主义思想路线的重要性，强调中国革命要靠中国同志了解中国情况。",p:["农村包围城市"]},
{id:"c5q164",ch:5,t:"s",real:true,src:"2014年4月真题",q:"1930年到1931年，在红一方面军三次反「围剿」斗争胜利的基础上形成了",o:["鄂豫皖革命根据地","左右江革命根据地","湘鄂西革命根据地","中央革命根据地"],a:"D",x:"红一方面军连续粉碎国民党军三次「围剿」，形成拥有二十一座县城、二百五十万人口的中央革命根据地。",p:["农村根据地"]},
{id:"c5q165",ch:5,t:"j",real:true,src:"2014年4月真题",fs:6,q:"简述遵义会议的历史意义。",
kw:["遵义会议","军事和组织问题","毛泽东的领导地位","生死攸关","独立自主"],
ref:"（1）解决了当时最紧迫的军事和组织问题。1935年1月遵义会议集中批评了第五次反「围剿」中的军事错误，结束了王明「左」倾机会主义在党中央的统治。（2）确立了毛泽东的领导地位。会议事实上确立了以毛泽东为代表的马克思主义正确路线在党中央的领导地位，开始形成以毛泽东为核心的党的第一代中央领导集体。（3）挽救了党和红军。会议在极其危急的关头挽救了党、挽救了红军、挽救了中国革命，成为党的历史上一个生死攸关的转折点。（4）标志着党在政治上走向成熟。遵义会议独立自主地解决自己的路线、方针和政策问题，表明中国共产党已经能够把马克思主义基本原理同中国革命具体实际结合起来。",p:["遵义会议"]},
{id:"c6q163",ch:6,t:"s",real:true,src:"2014年4月真题",q:"1941年，在缅北对日作战中以身殉国的中国远征军将领是",o:["佟麟阁","谢晋元","张自忠","戴安澜"],a:"D",x:"中国远征军将领戴安澜率部入缅作战，在缅北同古保卫战中重创日军，后以身殉国，被誉为民族英雄。",p:["正面战场"]},
{id:"c6q164",ch:6,t:"s",real:true,src:"2014年4月真题",q:"中国共产党制定《抗日救国十大纲领》的会议是",o:["瓦窑堡会议","洛川会议","中共六届五中全会","中共六届六中全会"],a:"B",x:"1937年8月中共中央在陕北洛川召开政治局扩大会议，通过《抗日救国十大纲领》，提出全面抗战路线。",p:["全面抗战路线"]},
{id:"c6q165",ch:6,t:"s",real:true,src:"2014年4月真题",q:"抗日战争全面爆发后，中国军队取得第一次重大胜利的战役是",o:["平型关战役","雁门关战役","阳明堡战役","台儿庄战役"],a:"A",x:"1937年9月八路军第一一五师在平型关伏击日军，歼敌千余人，是全国抗战开始后中国军队的第一次重大胜利。",p:["敌后战场"]},
{id:"c6q166",ch:6,t:"j",real:true,src:"2014年4月真题",fs:6,q:"简述中国抗日战争胜利的基本经验。",
kw:["大团结","力量源泉","爱国主义","中流砥柱","持久战","世界反法西斯"],
ref:"（1）全国人民的大团结是抗战胜利的力量源泉。在抗日民族统一战线旗帜下，各民族、各阶层、各党派和海外侨胞团结一致，汇成战胜日本侵略者的强大力量。（2）以爱国主义为核心的伟大民族精神是团结奋进的精神动力。中华儿女不畏强暴、血战到底，凝聚起救亡图存的强大精神力量。（3）中国共产党是全民族抗战的中流砥柱。党提出全面抗战路线和持久战战略方针，开辟敌后战场，成为夺取胜利的关键。（4）世界反法西斯力量的同情和支持是重要条件。中国人民的抗战得到各国人民和反法西斯国家的支援，中国战场与世界反法西斯战争相互配合。",p:["抗战胜利","中共中流砥柱"]},
{id:"c7q146",ch:7,t:"s",real:true,src:"2014年4月真题",q:"1945年8月，中国共产党在《对目前时局的宣言》中明确提出的口号是",o:["和平、民主、团结","向北发展，向南防御","打倒蒋介石，解放全中国","将革命进行到底"],a:"A",x:"1945年8月25日中共中央发表《对目前时局的宣言》，提出「和平、民主、团结」的口号，主张建立独立自由与富强的新中国。",p:["重庆谈判"]},
{id:"c7q147",ch:7,t:"s",real:true,src:"2014年4月真题",q:"1946年6月，国民党军队挑起全面内战的起点是",o:["大举围攻中原解放区","大举围攻东北解放区","重点进攻陕甘宁边区","重点进攻山东解放区"],a:"A",x:"1946年6月26日国民党军大举围攻中原解放区，挑起全国性内战，全面内战由此爆发。",p:["全面内战"]},
{id:"c7q148",ch:7,t:"s",real:true,src:"2014年4月真题",q:"1947年，在国统区爆发的大规模爱国学生运动是",o:["一二·九运动","一二·一运动","抗暴运动","「反饥饿、反内战、反迫害」运动"],a:"D",x:"1947年五二〇惨案后，国统区学生运动发展为「反饥饿、反内战、反迫害」运动，标志着第二条战线正式形成。",p:["第二条战线"]},
{id:"c8q157",ch:8,t:"j",real:true,src:"2014年4月真题",fs:6,q:"简述中国共产党提出的过渡时期总路线。",
kw:["1953年","社会主义工业化","农业","手工业","资本主义工商业","一化三改"],
ref:"（1）提出的时间。1953年，中国共产党正式提出过渡时期总路线，并逐步付诸实施。（2）总路线的完整表述。要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、手工业和资本主义工商业的社会主义改造。（3）总路线的实质。以社会主义工业化为主体，以三大改造为两翼，即「一化三改」，目的是把生产资料私有制改造为社会主义公有制，确立社会主义基本制度。（4）实施的意义。总路线反映了中国由新民主主义向社会主义过渡的客观要求，为有计划地进行经济建设和社会主义改造指明了方向。",p:["过渡时期总路线"]},
{id:"c9q156",ch:9,t:"l",real:true,src:"2014年4月真题",fs:10,q:"试述中共八大提出的我国经济建设、政治建设和执政党建设的指导方针。",
kw:["主要矛盾","综合平衡","长期共存","实事求是","群众路线","个人崇拜"],
ref:"（1）经济建设的指导方针。中共八大指出，社会主义改造基本完成后，国内主要矛盾已经是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。大会提出既反保守又反冒进、在综合平衡中稳步前进的经济建设方针，要求正确处理重工业同农业、轻工业的关系，正确处理积累和消费的关系。（2）政治建设的指导方针。大会提出进一步扩大社会主义民主、健全社会主义法制，坚持共产党同民主党派长期共存、互相监督的方针，坚持民主集中制，发扬党内民主和人民民主，加强党同人民群众的联系。（3）执政党建设的指导方针。大会强调坚持实事求是的思想路线，反对主观主义；坚持群众路线，反对官僚主义；坚持党的团结统一，反对宗派主义；健全党内民主生活，加强对党组织和党员的监督，反对个人崇拜。（4）历史意义。中共八大制定的方针为社会主义建设指明了方向，是党探索中国社会主义建设道路的重要成果。",p:["中共八大"]},
{id:"c10q170",ch:10,t:"j",real:true,src:"2014年4月真题",fs:6,q:"简述《关于建国以来党的若干历史问题的决议》对毛泽东历史地位的评价。",
kw:["十一届六中全会","伟大的马克思主义者","无产阶级革命家","功绩是第一位的","错误是第二位的","毛泽东思想"],
ref:"（1）决议的通过。1981年6月，中共十一届六中全会通过《关于建国以来党的若干历史问题的决议》，对新中国成立以来的历史作出科学评价。（2）肯定毛泽东的历史功绩。决议指出，毛泽东是伟大的马克思主义者，是伟大的无产阶级革命家、战略家和理论家，他为党和人民的事业奋斗了终生，建立了不朽的历史功勋。（3）指出晚年的错误。决议同时指出，毛泽东在晚年犯了严重错误，特别是在「文化大革命」中犯有错误，但就其一生来看，功绩是第一位的，错误是第二位的。（4）评价的意义。这一评价实事求是地维护了毛泽东的历史地位，肯定了毛泽东思想作为党长期坚持的指导思想的科学价值，统一了全党思想。",p:["拨乱反正"]},

{id:"c2q156",ch:2,t:"j",real:true,src:"2012年10月真题",fs:6,q:"太平天国农民战争失败的主要原因。",
kw:["阶级局限性","先进阶级的领导","没有科学理论的指导","中外反动势力联合镇压"],
ref:"①根本原因：农民阶级不是新的生产力和生产关系的代表，带有小生产者所固有的阶级局限性，既不能提出完整、正确的政治纲领和社会改革方案，也无法长期保持领导集团的团结，无法制止统治集团内部腐化现象的滋生，缺乏先进阶级的领导。②太平天国的失败还在于没有科学理论的指导，缺乏对封建统治阶级和外国侵略者本质的理性认识，提不出正确的斗争策略。③中外反动势力联合镇压，太平天国难以抗御清军与外国侵略者的合力绞杀。",p:["太平天国","失败原因"]},
{id:"c6q169",ch:6,t:"j",real:true,src:"2012年10月真题",fs:6,q:"毛泽东在《论持久战》中对抗日战争历史进程的阐述。",
kw:["战略防御","战略相持","战略反攻","最关键的阶段","转弱为强"],
ref:"①抗日战争将经过战略防御、战略相持、战略反攻三个阶段。②其中，战略相持阶段是中国抗日战争取得最后胜利的最关键的阶段，也是时间最长、最为艰苦的阶段。③只要坚持持久抗战、坚持抗日民族统一战线，中国将在这个阶段中获得转弱为强的力量。④毛泽东指出，抗日战争是持久战，最后胜利属于中国，既反对「亡国论」，也反对「速胜论」。",p:["《论持久战》"]},
{id:"c8q160",ch:8,t:"j",real:true,src:"2012年10月真题",fs:6,q:"新中国对资本主义工商业采取和平赎买政策的特点。",
kw:["有偿","逐步","工作安排","选举权","政治安排","和平赎买"],
ref:"①有偿地而不是无偿地，逐步地而不是突然地改变资产阶级的所有制，主要经过加工订货、统购包销、公私合营等形式完成改造。②在改造他们的同时，给予他们必要的工作安排，保证其生活来源，减少社会震动。③不剥夺资产阶级的选举权，并且对于他们中间积极拥护社会主义改造而在这个改造事业中有所贡献的代表人物给以恰当的政治安排。④把对企业的改造与对人的改造结合起来，在和平赎买中团结、教育民族资产阶级。",p:["资本主义工商业改造"]},
{id:"c9q159",ch:9,t:"j",real:true,src:"2012年10月真题",fs:6,q:"中共八大对我国社会主义改造基本完成后国内主要矛盾和主要任务的阐述。",
kw:["先进的工业国","落后的农业国","经济文化迅速发展的需要","集中力量","稳步前进"],
ref:"①1956年9月中共八大指出，我们国内的主要矛盾，已经是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，已经是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。②党和全国人民的当前的主要任务，是集中力量来解决这个矛盾，把我国尽快地从落后的农业国变为先进的工业国。③大会还强调要坚持既反保守又反冒进、在综合平衡中稳步前进的经济建设方针。",p:["中共八大"]},
{id:"c3q167",ch:3,t:"l",real:true,src:"2012年10月真题",fs:10,q:"试述辛亥革命的历史意义。",
kw:["推翻了清王朝","封建君主专制制度","民主共和","思想解放运动","社会风俗","亚洲各国"],
ref:"①辛亥革命推翻了清王朝在中国的统治，沉重打击了中外反动势力在中国的统治，宣告了封建君主专制制度的结束和民国的建立。②辛亥革命建立了中华民国，颁布《中华民国临时约法》，成立了资产阶级共和国性质的革命政权，使民主共和的观念深入人心。③辛亥革命也是一场思想解放运动，促进了民主、自由、平等等现代观念的传播，推动了社会思想观念的更新。④辛亥革命促使社会经济、思想习惯和社会风俗等方面发生了新的变化，如剪辫、易服、改称谓等，社会风气为之一新。⑤辛亥革命打击了帝国主义在华势力，为亚洲各国人民的革命斗争提供了范例，推动了亚洲各国民族解放运动的高涨。",p:["辛亥革命"]},
{id:"c7q149",ch:7,t:"l",real:true,src:"2012年10月真题",fs:10,q:"试述中国革命统一战线中的两个联盟及其相互关系。",
kw:["劳动者的联盟","劳动者与非劳动者的联盟","依靠第一个联盟","领导权","独立自主"],
ref:"①统一战线中存在着两个联盟：一个是劳动者的联盟，主要是工人、农民和城市小资产阶级的联盟，这是基本的、主要的联盟；一个是劳动者与非劳动者的联盟，主要是劳动者与民族资产阶级的联盟，有时还包括与一部分大资产阶级的暂时的联盟，这是辅助的、同时又是重要的联盟。②必须坚决依靠第一个联盟，争取建立和扩大第二个联盟，二者相互配合，缺一不可。③巩固和扩大统一战线的关键，是坚持工人阶级及其政党的领导权，率领同盟者向共同的敌人作坚决的斗争并取得胜利。④对被领导者给以物质福利，至少不损害其利益，同时对被领导者给以政治教育。⑤对同工人阶级争夺领导权的资产阶级采取又联合又斗争的政策，在坚持独立自主的前提下维护和巩固统一战线。",p:["革命胜利经验"]},

{id:"c4q169",ch:4,t:"j",real:true,src:"2009年10月真题",fs:6,q:"五四运动爆发的社会历史条件",
kw:["十月革命","工人阶级","新文化运动","巴黎和会"],
ref:"第一，五四运动发生在俄国十月革命所开辟的世界无产阶级社会主义革命的新时代，十月革命的胜利给中国人民带来了新的希望，对中国先进分子产生了深刻影响。第二，第一次世界大战期间，中国工人阶级和民族资产阶级的力量进一步壮大起来，工人阶级的成长为新民主主义革命准备了阶级基础。第三，新文化运动掀起的思想解放潮流，推动了马克思主义在中国的传播，为五四运动准备了群众基础和骨干力量。第四，巴黎和会上中国外交的失败，直接引发了五四运动。",p:["五四运动"]},
{id:"c5q173",ch:5,t:"j",real:true,src:"2009年10月真题",fs:6,q:"遵义会议的历史意义",
kw:["挽救","生死攸关的转折点","政治上走向成熟","毛泽东"],
ref:"第一，遵义会议在极其危急的情况下，挽救了中国共产党、中国工农红军和中国革命，使党中央和红军得以转危为安。第二，会议开始确立以毛泽东为代表的马克思主义正确路线在中共中央的领导地位，开始形成以毛泽东为核心的新的中央领导集体。第三，遵义会议成为中国共产党历史上一个生死攸关的转折点，标志着中国共产党在政治上走向成熟，为夺取长征胜利和开创中国革命新局面奠定了基础。",p:["遵义会议"]},
{id:"c6q172",ch:6,t:"j",real:true,src:"2009年10月真题",fs:6,q:"中国人民抗日战争胜利的主要原因",
kw:["中流砥柱","民族觉醒","反法西斯力量"],
ref:"第一，中国共产党在全民族抗战中发挥了中流砥柱的作用，倡导并坚持抗日民族统一战线，提出全面抗战路线和持久战战略方针，开辟敌后战场。第二，中国人民巨大的民族觉醒、空前的民族团结和英勇的民族抗争，是抗日战争取得胜利的决定性因素。第三，中国人民抗日战争得到世界上所有爱好和平与正义的国家和人民、国际组织以及各种反法西斯力量的同情和支持。",p:["抗战胜利"]},
{id:"c7q154",ch:7,t:"j",real:true,src:"2009年10月真题",fs:6,q:"巩固和扩大中国新民主主义革命统一战线的主要条件",
kw:["两个联盟","工人阶级及其政党的领导权","又联合又斗争","物质福利"],
ref:"第一，建立广泛的统一战线，是坚持和发展革命的政治基础。第二，统一战线中存在着两个联盟：一个是劳动者的联盟，主要是工人、农民和城市小资产阶级的联盟，这是基本的、主要的；一个是劳动者与非劳动者的联盟，主要是劳动者与民族资产阶级的联盟，有时还包括与一部分大资产阶级的暂时的联盟，这是辅助的，同时又是重要的。必须坚决依靠第一个联盟，争取建立和扩大第二个联盟。第三，巩固和扩大统一战线的关键，是坚持工人阶级及其政党的领导权，率领同盟者向共同的敌人作坚决的斗争并取得胜利；对被领导者给以物质福利，至少不损害其利益，同时对被领导者给以政治教育；对同工人阶级争夺领导权的资产阶级采取又联合又斗争的政策。",p:["革命胜利经验"]},
{id:"c8q165",ch:8,t:"j",real:true,src:"2009年10月真题",fs:6,q:"我国农业社会主义改造经历的几种经济组织形式及其性质",
kw:["互助组","初级农业生产合作社","高级农业生产合作社","社会主义的萌芽性质"],
ref:"我国农业社会主义改造采取了由低级到高级逐步过渡的步骤，经历了三种经济组织形式。第一是互助组，它由农民在自愿互利基础上组成，具有社会主义的萌芽性质。第二是初级农业生产合作社，实行土地入股、统一经营，具有半社会主义的性质。第三是高级农业生产合作社，土地和其他主要生产资料归集体所有，具有社会主义的性质。这种逐步过渡的办法，使农民比较自然地接受了社会主义改造，避免了生产上的损失。",p:["农业改造"]},
{id:"c1q162",ch:1,t:"l",real:true,src:"2009年10月真题",fs:10,q:"近代以来中华民族面临的两大历史任务及其相互关系",
kw:["民族独立和人民解放","国家繁荣富强和人民共同富裕","生产关系","生产力","前提条件"],
ref:"近代以来中华民族面对的两大历史任务：一是求得民族独立和人民解放，二是实现国家繁荣富强和人民共同富裕。两大历史任务相互区别。前者要改变中华民族遭受压迫、人民受剥削的地位和状况，从根本上推翻中国半殖民地半封建社会的统治秩序，解决生产关系的问题；后者要改变近代中国经济、文化和社会落后的地位和状况，解决生产力的问题。两大历史任务又相互联系。只有完成第一大任务，才能为第二大任务的完成创造条件；争取民族独立和人民解放，是实现国家繁荣富强和人民共同富裕的前提条件。只有实现民族独立和人民解放，才能废除列强同中国签订的一切不平等条约，才能推翻封建专制制度，改变买办的和封建的生产关系，解放生产力，开辟走向现代化的道路。另一方面，争取民族独立和人民解放的最终目的是使中国走向现代化，实现国家繁荣富强和人民共同富裕，使中华民族自立于世界民族之林。",p:["历史任务"]},
{id:"c10q175",ch:10,t:"l",real:true,src:"2009年10月真题",fs:10,q:"中共中央于1981年发表的《关于建国以来党的若干历史问题的决议》的主要内容及意义",
kw:["关于建国以来党的若干历史问题的决议","十一届六中全会","历史地位","拨乱反正"],
ref:"第一，从1979年11月起，在邓小平主持下，中共中央着手起草《关于建国以来党的若干历史问题的决议》。经过一年半时间的讨论和修改，1981年6月，中共十一届六中全会通过了这个决议。全会还同意华国锋辞去中共中央主席、中央军委主席职务，选举胡耀邦为中共中央主席、邓小平为中央军委主席。第二，决议科学地评价了毛泽东和毛泽东思想的历史地位，指出毛泽东同志是伟大的马克思主义者，是伟大的无产阶级革命家、战略家和理论家，他的功绩是第一位的，错误是第二位的。他为中国共产党和中国人民解放军的创立和发展，为中国各族人民解放事业的胜利，为中华人民共和国的缔造和中国社会主义事业的发展，建立了永远不可磨灭的功勋。第三，决议的通过，标志着指导思想上拨乱反正的胜利完成，表明中国共产党是在政治上、理论上成熟的坚强的马克思主义政党。中国共产党能够在「文化大革命」结束后不长的时间里作出这样一个经得起历史检验的决议，体现出以邓小平为核心的中共中央领导集体的成熟和远见，体现出党在反省错误、纠正错误的过程中总结新经验、探索新道路的能力。",p:["拨乱反正"]},

/* ===== 选择题选项乱序 =====
   以题目 id 为种子确定性打乱：同一题每次打开顺序一致，
   历史练习/错题记录里的字母仍对应同一选项。
   含「以上……」类汇总选项的题保持原序，避免语义错乱。 */
(function shuffleChoices(){
  const seedOf = id => { let h = 2166136261; for (let i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  QS.forEach(q => {
    if (q.t !== "s" || !Array.isArray(q.o) || q.o.length !== 4) return;
    if (q.o.some(o => /^(以上|上述|全选)|都正确|均正确|全部正确/.test(o))) return;
    const n = q.o.length, idx = [...Array(n).keys()];
    let s = seedOf(q.id) || 1;
    const rnd = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    const oldPos = q.a.charCodeAt(0) - 65;
    q.o = idx.map(i => q.o[i]);
    q.a = String.fromCharCode(65 + idx.indexOf(oldPos));
  });
})();

/* ---------- 工具 ---------- */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function norm(s){ return (s||"").toLowerCase().replace(/[\s，。、；：""''（）()【】《》「」,.?!；：—\-—]/g,""); }
function gradeSubj(text, q){
  const t = norm(text); let hits = 0; const hitKws=[];
  for(const kw of q.kw){ if(t.includes(norm(kw))){ hits++; hitKws.push(kw);} }
  const ratio = q.kw.length ? hits/q.kw.length : 0;
  return { score: Math.round(q.fs*ratio*2)/2, hits, total:q.kw.length, hitKws };
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderPracticeList(){
  let qs = qOfCh(state.practiceCh);
  if(state.filterPoint) qs = qs.filter(q=>q.p.includes(state.filterPoint));
  const ps = practiceState();
  let doneSingle=0, okSingle=0, doneSubj=0, subjScore=0;
  qs.forEach(q=>{
    if(q.t==="s"){ if(ps[q.id]!==undefined){ doneSingle++; if(ps[q.id]===q.a) okSingle++; } }
    else { if(ps[q.id]!==undefined){ doneSubj++; subjScore += ps[q.id].score; } }
  });
  const total = qs.reduce((s,q)=>s+(q.t==="s"?2:(q.t==="j"?6:10)),0);
  let earned = okSingle*2 + subjScore;
  $("#pracStat").innerHTML = `
    <div class="bar"><i style="width:${qs.length?Math.round((doneSingle+doneSubj)/qs.length*100):0}%"></i></div>
    <div class="sub" style="margin-top:6px">已完成 ${doneSingle+doneSubj}/${qs.length} 题 · 客观题 ${okSingle}/${doneSingle} 正确 · 主观题已得 ${subjScore} 分 · 当前得分 <b style="color:var(--red)">${earned}/${total}</b></div>`;

  $("#pracList").innerHTML = qs.map((q,i)=>{
    if(q.t==="s") return singleCard(q, i+1, ps[q.id]);
    return subjCard(q, i+1, ps[q.id], false);
  }).join("");
  // 绑定单选与批改事件
  $$("#pracList .opt").forEach(el=>el.addEventListener("click",()=>{
    const qid = el.dataset.qid, ans = el.dataset.v;
    const ps = practiceState(); ps[qid] = ans; setPracticeState(ps);
    renderPracticeList();
  }));
  $$("#pracList .grade-btn").forEach(el=>el.addEventListener("click",()=>{
    const qid = el.dataset.qid;
    const txt = $("#ta_"+qid).value;
    if(!txt.trim()){ el.textContent="请先输入答案"; return; }
    const q = QS.find(x=>x.id===qid);
    const g = gradeSubj(txt, q);
    const ps = practiceState();
    ps[qid] = {score:g.score, txt, hits:g.hits};
    setPracticeState(ps);
    if(g.score < q.fs/2) addWrong(qid, {txt, score:g.score, fs:q.fs});
    renderPracticeList();
  }));
}
function bindPractice(){ renderPracticeList(); }
function resetPractice(){
  if(!confirm("确定清空本章全部作答记录？")) return;
  store.set("cjh_prac_" + state.practiceCh, {});
  renderPracticeList();
}

/* ================= 选择题专项 ================= */
const SINGLE_PAGE = 20;

/* 清除单道题的作答（章节练习 / 选择题 / 简答题 / 真题专区共用） */
function clearQAns(qid){
  const q = QS.find(x=>x.id===qid);
  if(!q) return;
  const ps = pracOf(q.ch);
  delete ps[qid];
  store.set("cjh_prac_" + q.ch, ps);
  const rs = realState();
  if(rs[qid]!==undefined){ delete rs[qid]; store.set("cjh_real", rs); }
  const w = wrongBook();
  if(w[qid]){ delete w[qid]; store.set("cjh_wrong", w); }
  const wd = store.get("cjh_wrongdo", {});
  if(wd[qid]!==undefined){ delete wd[qid]; store.set("cjh_wrongdo", wd); }
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

function vSingles(){
  const all = QS.filter(q=>q.t==="s");

function renderSingleList(){
  const all = QS.filter(q=>q.t==="s");
  const list = state.singleCh ? all.filter(q=>q.ch===state.singleCh) : all;
  const pages = Math.max(1, Math.ceil(list.length/SINGLE_PAGE));
  let pg = state.singlePage || 1;
  if(pg > pages) pg = pages;
  if(pg < 1) pg = 1;
  state.singlePage = pg;
  const slice = list.slice((pg-1)*SINGLE_PAGE, pg*SINGLE_PAGE);
  let done=0, ok=0;
  list.forEach(q=>{ const r = pracOf(q.ch)[q.id]; if(r!==undefined){ done++; if(r===q.a) ok++; } });
  $("#singleStat").innerHTML = `
    <div class="bar"><i style="width:${list.length?Math.round(done/list.length*100):0}%"></i></div>
    <div class="sub" style="margin-top:6px">已完成 ${done}/${list.length} 题 · 正确 ${ok} 题${done?`（正确率 ${Math.round(ok/done*100)}%）`:""} · 当前第 ${pg}/${pages} 页</div>`;
  $("#singleList").innerHTML = slice.map((q,i)=>singleCard(q, (pg-1)*SINGLE_PAGE+i+1, pracOf(q.ch)[q.id])).join("");
  $$("#singleList .opt").forEach(el=>el.addEventListener("click",()=>{
    const qid = el.dataset.qid, ans = el.dataset.v;
    const q = QS.find(x=>x.id===qid);
    const ps = pracOf(q.ch);
    ps[qid] = ans;
    store.set("cjh_prac_" + q.ch, ps);
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }));
  const pbtn = (label, p, dis) => `<button class="btn ghost" style="font-size:13px; padding:6px 14px" ${dis?"disabled":""} onclick="state.singlePage=${p};render();window.scrollTo(0,0)">${label}</button>`;
  $("#singlePager").innerHTML = `<div style="display:flex; justify-content:center; align-items:center; gap:10px; margin:16px 0 6px; flex-wrap:wrap">
    ${pbtn("上一页", pg-1, pg<=1)}
    <span class="badge">第 ${pg} / ${pages} 页</span>
    ${pbtn("下一页", pg+1, pg>=pages)}
  </div>`;
}
function resetSingles(){
  if(!confirm("确定清空当前范围的选择题作答记录？")) return;
  const list = state.singleCh ? QS.filter(q=>q.t==="s" && q.ch===state.singleCh) : QS.filter(q=>q.t==="s");
  list.forEach(q=>{
    const ps = pracOf(q.ch);
    delete ps[q.id];
    store.set("cjh_prac_" + q.ch, ps);
  });
  render();
}

    const txt = $("#ta_"+qid).value;
    if(!txt.trim()){ el.textContent="请先输入答案"; return; }
    const q = QS.find(x=>x.id===qid);

    const ps = pracOf(q.ch);
    ps[qid] = {score:g.score, txt, hits:g.hits};
    store.set("cjh_prac_" + q.ch, ps);
    if(g.score < q.fs/2) addWrong(qid, {txt, score:g.score, fs:q.fs});
    render();
  }));
}
function resetShorts(){
  if(!confirm("确定清空当前范围的简答题作答记录？")) return;

/* ================= 通用题目卡片 ================= */
function qHead(q, idx, extra){
  const tagMap = {s:["单选 · 2分","single"], j:["简答 · 6分","short"], l:["论述 · 10分","essay"]};
  const [tag,cls] = tagMap[q.t];
  return `<div class="q-head">
    <div><span class="q-tag ${cls}">${tag}</span>
    ${q.real?`<span class="badge real" style="margin-left:6px">真题 · ${q.src.replace("真题","")}</span>`:""}</div>
    ${extra||""}
  </div>
  <div class="q-title"><span class="idx">${idx}.</span>${q.q}</div>
  <div class="q-pts">${q.p.map(p=>`<span class="point">${p}</span>`).join("")}</div>`;
}

function singleCard(q, idx, chosen, allowClear){
  const letters=["A","B","C","D"];
  const isAnswered = chosen!==undefined;
  const clsOf = L => isAnswered ? (L===q.a ? " right" : (L===chosen ? " wrong" : " dim")) : "";
  const badge = isAnswered ? `<span class="badge" style="background:${chosen===q.a?"#e9f4ec;color:var(--green)":"#fbe9e5;color:var(--red2)"}">${chosen===q.a?"回答正确":"回答错误"}</span>` : "";
  const extra = isAnswered ? `<div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap">${badge}${allowClear!==false?`<button class="btn ghost" style="font-size:12px; padding:4px 10px" onclick="clearQAns('${q.id}')">清除本题</button>`:""}</div>` : "";
  return `<div class="q-card" data-qid="${q.id}">
    ${qHead(q, idx, extra)}
    ${q.o.map((o,i)=>{
      const L=letters[i];
      const mark = isAnswered && L===chosen ? (L===q.a?"（正确）":"（错误）") : "";
      return `<button class="opt${clsOf(L)}" data-qid="${q.id}" data-v="${L}"><span class="k">${L}.</span>${o}${mark}</button>`;
    }).join("")}
    <div class="explain ${isAnswered?'show':''}"><b style="color:var(--gold)">答案：${q.a}　解析：</b>${q.x}</div>
  </div>`;
}

function subjCard(q, idx, done, showFull, allowClear){
  const g = done ? (typeof done==="object"? {score:done.score, hits:null}:null) : null;
  const extra = done && allowClear!==false ? `<button class="btn ghost" style="font-size:12px; padding:4px 10px" onclick="clearQAns('${q.id}')">清除本题</button>` : "";
  return `<div class="q-card" data-qid="${q.id}">
    ${qHead(q, idx, extra)}
    <textarea id="ta_${q.id}" placeholder="请输入你的答案要点…" ${done?`disabled`:`style="min-height:120px"`}>${done&&typeof done==="object"?esc(done.txt):""}</textarea>
    ${done&&typeof done==="object"?`
      <div class="score-line">自动批改得分：<b>${done.score} / ${q.fs}</b>（参考答案要点关键词命中 ${done.hits??"-"} 项）</div>
      <div class="refans show">
        <h4>参考答案</h4><div style="white-space:pre-line">${esc(q.ref)}</div>
      </div>
    `:`
      <button class="btn grade-btn" data-qid="${q.id}" style="margin-top:10px; font-size:14px; padding:7px 18px">提交批改</button>
      <div class="notice" style="margin-top:8px">批改方式：按参考答案要点关键词匹配自动评分（满分 ${q.fs} 分），供估分参考，请结合参考答案自查。</div>
    `}
  </div>`;
}

/* ================= 真题专区 ================= */
function realState(){ return store.get("cjh_real", {}); }
function realKey(src){
  const m = /(\d{4})年(\d{1,2})月/.exec(src || "");
  return m ? parseInt(m[1],10)*12 + parseInt(m[2],10) : 0;
}
function realPapers(){
  const g = {};
  realQ().forEach(q=>{ (g[q.src] = g[q.src] || []).push(q); });
  return Object.keys(g).map(src=>({src, qs: g[src]})).sort((a,b)=> realKey(b.src) - realKey(a.src));
}
function paperScore(qs, st){
  let got=0, total=0, done=0;
  qs.forEach(q=>{
    total += (q.t==="s" ? 2 : q.fs);
    const r = st[q.id];
    if(r!==undefined){
      done++;
      if(q.t==="s"){ if(r===q.a) got += 2; }
      else if(r && r.score!==undefined) got += r.score;
    }
  });
  return {got, total, done};
}
function vReal(){
  const papers = realPapers();
  if(state.realPaper){
    const p = papers.find(x=>x.src===state.realPaper);
    if(!p){ state.realPaper = null; return vReal(); }
    const s = paperScore(p.qs, realState());
    const label = p.src.replace(/真题$/, "");
    const nS = p.qs.filter(q=>q.t==="s").length, nJ = p.qs.filter(q=>q.t==="j").length, nL = p.qs.filter(q=>q.t==="l").length;
    return `<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin:20px 0 6px">
      <button class="btn ghost" style="font-size:13px; padding:7px 14px" onclick="state.realPaper=null;render()">← 返回真题列表</button>
      <h2 style="color:var(--red); font-size:22px; margin:0">${label} 真题卷</h2>
    </div>
    <div class="card">
      <div class="bar"><i style="width:${p.qs.length?Math.round(s.done/p.qs.length*100):0}%"></i></div>
      <div class="sub" style="margin-top:6px">本卷 ${p.qs.length} 题（单选 ${nS} · 简答 ${nJ} · 论述 ${nL}） · 已完成 ${s.done}/${p.qs.length} · 得分 <b style="color:var(--red)">${s.got}/${s.total}</b></div>
      <div style="margin-top:10px"><button class="btn ghost" style="font-size:13px" onclick="resetRealPaper()">清空本卷作答</button></div>
    </div>
    <div id="realList"></div>`;
  }
  const st = realState();
  const total = papers.reduce((s,p)=>s+p.qs.length,0);
  return `<h2 style="color:var(--red); margin:20px 0 6px; font-size:22px">历年真题专区</h2>
  <p class="sub" style="margin-bottom:12px">按考期分卷，共 ${papers.length} 套卷、${total} 道真题（收录历年试卷中的部分题目）。点击某套卷作答：单选即时判分，主观题输入后自动批改。</p>
  ${papers.map(p=>{
    const s = paperScore(p.qs, st);
    const label = p.src.replace(/真题$/, "");
    const parts = [];
    if(p.qs.some(q=>q.t==="s")) parts.push("单选 " + p.qs.filter(q=>q.t==="s").length);
    if(p.qs.some(q=>q.t==="j")) parts.push("简答 " + p.qs.filter(q=>q.t==="j").length);
    if(p.qs.some(q=>q.t==="l")) parts.push("论述 " + p.qs.filter(q=>q.t==="l").length);
    return `<div class="ch-item" onclick="state.realPaper='${p.src}';render()">
      <div class="t">${label}<small>${parts.join(" · ")}</small></div>
      <div style="display:flex; gap:6px; flex-wrap:wrap"><span class="badge">${p.qs.length} 题</span><span class="badge gray">已完成 ${s.done}/${p.qs.length}</span></div>
    </div>`;
  }).join("")}`;
}
function renderReal(){
  const p = realPapers().find(x=>x.src===state.realPaper);
  if(!p || !$("#realList")) return;
  const ps = realState();
  const order = {s:0, j:1, l:2};
  const list = [...p.qs].sort((a,b)=> (order[a.t]-order[b.t]) || (a.ch-b.ch));
  $("#realList").innerHTML = list.map((q,i)=>{
    if(q.t==="s") return singleCard(q, i+1, ps[q.id]);
    return subjCard(q, i+1, ps[q.id], false);
  }).join("");
  $$("#realList .opt").forEach(el=>el.addEventListener("click",()=>{
    const qid = el.dataset.qid, ans = el.dataset.v;
    const ps2 = realState(); ps2[qid] = ans; store.set("cjh_real", ps2);
    const q = QS.find(x=>x.id===qid);
    if(ans !== q.a) addWrong(qid, {txt:ans, wrong:true});
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }));
  $$("#realList .grade-btn").forEach(el=>el.addEventListener("click",()=>{
    const qid = el.dataset.qid, txt = $("#ta_"+qid).value;
    if(!txt.trim()){ el.textContent = "请先输入答案"; return; }
    const q = QS.find(x=>x.id===qid), g = gradeSubj(txt, q);
    const ps2 = realState(); ps2[qid] = {score:g.score, txt, hits:g.hits}; store.set("cjh_real", ps2);
    if(g.score < q.fs/2) addWrong(qid, {txt, score:g.score, fs:q.fs});
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }));
}
function bindReal(){ renderReal(); }
function resetRealPaper(){
  if(!confirm("确定清空本卷作答记录？")) return;

}

/* ================= 模拟考试 ================= */
function startExam(){
  const paper = {
    singles: shuffle(singles()).slice(0,25),
    shorts: shuffle(shorts()).slice(0,5),
    essays: shuffle(essays()).slice(0,3)
  };
  state.examPaper = paper;
  state.examAnswers = {};
  state.examDeadline = Date.now() + 150*60*1000;
  state.view = "exam";
  render();
  if(state.examTimer) clearInterval(state.examTimer);
  state.examTimer = setInterval(()=>{
    const remain = state.examDeadline - Date.now();
    if(remain<=0){ clearInterval(state.examTimer); state.examTimer=null; alert("考试时间到，系统自动交卷！"); submitExam(); return; }
    const tm = $("#timer"); if(!tm) return;
    const h=Math.floor(remain/3600000), m=Math.floor(remain%3600000/60000), s=Math.floor(remain%60000/1000);
    tm.textContent = `剩余时间 ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }, 1000);
}
function vExam(){
  const p = state.examPaper;
  if(!p) return `<div class="card"><h2>模拟考试</h2>
    <p>按真实考试要求随机组卷：<b>25道单选（50分）</b> + <b>5道简答（30分）</b> + <b>3道论述选2（20分）</b>，时长150分钟，交卷后自动批改。</p>
    <p class="sub" style="margin:8px 0">主观题按参考答案关键词自动估分；论述题作答超过2题时，只按答题顺序前2题计分（与真实考试规则一致）。</p>

function submitExam(){
  const p = state.examPaper; if(!p) return;
  if(!confirm("确定交卷？交卷后自动批改。")) return;
  if(state.examTimer){ clearInterval(state.examTimer); state.examTimer=null; }

  let score=0, detail=[];
  // 单选
  p.singles.forEach(q=>{
    const ans = state.examAnswers[q.id];
    const ok = ans===q.a;
    if(ok) score+=2; else if(ans) addWrong(q.id,{txt:ans, wrong:true});
    detail.push({q, ans, ok});
  });
  // 简答
  p.shorts.forEach(q=>{
    const txt = ($("#ta_"+q.id)||{}).value || "";
    if(txt.trim()){
      const g = gradeSubj(txt,q);
      score+=g.score; detail.push({q, ans:txt, ok:g.score>=q.fs/2, g});
      if(g.score<q.fs/2) addWrong(q.id,{txt, score:g.score, fs:q.fs});
    } else {
      detail.push({q, ans:"", ok:false, g:null});
    }
  });
  // 论述：作答超过2题时，只按答题顺序前2题计分
  let essayCount=0;
  p.essays.forEach(q=>{
    const txt = ($("#ta_"+q.id)||{}).value || "";
    if(txt.trim() && essayCount<2){
      essayCount++;
      const g = gradeSubj(txt,q);
      score+=g.score; detail.push({q, ans:txt, ok:g.score>=q.fs/2, g});
      if(g.score<q.fs/2) addWrong(q.id,{txt, score:g.score, fs:q.fs});
    } else if(txt.trim()){
      detail.push({q, ans:txt, ok:false, g:null, overLimit:true});
    } else {
      detail.push({q, ans:"", ok:false, g:null});
    }
  });

  const pass = score>=60;
  addRecord({mode:"模拟考试", score, total:100, pass});
  state.examPaper=null;

  let d="";
  detail.forEach(it=>{
    if(it.q.t==="s"){
      d+=`<div class="q-card"><div class="q-title"><span class="idx">${it.q.q}</span></div>
      <div class="notice">你的答案：<b>${it.ans||"未作答"}</b> 正确答案：<b>${it.q.a}</b>　${it.ok?"<b style='color:var(--green)'>✓ 得2分</b>":"<b style='color:var(--red2)'>✗ 0分</b>"}</div>
      <div class="explain show"><b>解析：</b>${it.q.x}</div></div>`;
    } else {
      const over = it.overLimit ? "（作答超过2题，按规则不计分）" : "";
      d+=`<div class="q-card"><div class="q-title"><span class="idx">${it.q.q}</span></div>
      <div class="score-line">自动批改得分：<b>${it.g?it.g.score:"0"}/${it.q.fs}</b>${over}　命中关键词 ${it.g?it.g.hits:"0"}/${it.q.kw.length}</div>
      <div class="notice">你的作答：<span style="white-space:pre-line">${it.ans?esc(it.ans):"（未作答）"}</span></div>
      <div class="refans show"><h4>参考答案</h4><div style="white-space:pre-line">${esc(it.q.ref)}</div></div></div>`;
    }
  });

  app.innerHTML = `<div class="card result-big">
    <h2>考试成绩单</h2>
    <div class="score ${pass?"pass":"fail"}">${score}<span style="font-size:24px"> / 100</span></div>
    <div style="font-size:18px; margin:10px 0">${pass?"<b style='color:var(--green)'>恭喜！成绩合格</b>":"<b style='color:var(--red2)'>未合格，再接再厉</b>"}</div>
    <p class="sub">合格线 60 分 · 单选 ${detail.filter(x=>x.q.t==="s"&&x.ok).length}/25 正确 · 主观题详见下方逐题批改</p>
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px">
      <button class="btn green" onclick="state.view='exam';render()">再做一套</button>
      <button class="btn ghost" onclick="state.view='records';render()">查看记录</button>
      <button class="btn ghost" onclick="state.view='wrong';render()">错题本</button>
    </div>
  </div>${d}`;
}

/* 启动 */
render();
</script>
</body>
</html>
