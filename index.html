  {t:"乾隆朝后期清王朝由盛转衰，土地兼并与社会矛盾日益激化。",lv:"▲",keys:["康乾盛世国力强盛、疆域辽阔，但封建社会已进入末期，开始由盛转衰。","乾隆后期政治腐败、军备废弛、财政拮据、社会危机四伏。","鸦片战争前土地兼并严重、赋税繁重，地主阶级与农民阶级的矛盾是主要矛盾。"],err:"不要误以为由盛转衰始于鸦片战争；转折发生在乾隆朝后期。",hook:"对比：康乾盛世是「盛」的顶点，乾隆后期是「衰」的起点。"},
  {t:"清政府实行闭关锁国政策，对外贸易仅限广州一口。",lv:"◆",keys:["鸦片战争前对外贸易仅限广州一口。","广州一口的对外贸易由十三行垄断经营。"],err:"易混：闭关锁国不等于完全断绝对外贸易，仍留广州一口通商。",hook:"口诀「一口十三行」：只开广州一口，只准十三行经营。"},
  {t:"欧美资本主义迅速发展，英国为扭转贸易逆差大量走私鸦片。",lv:"▲",keys:["欧美资本主义迅速发展，英国率先完成工业革命。","英国急于扩大海外市场和原料产地。","英国向中国大量走私鸦片以扭转对华贸易逆差。","鸦片造成白银外流、银贵钱贱，直接引发禁烟运动。"],err:"易倒果为因：是贸易逆差推动鸦片走私，鸦片走私又引发禁烟运动。",hook:"链条记忆：工业革命→找市场→贸易逆差→走私鸦片→禁烟。"}
 ]},
 {h:"1.2 列强的军事侵略与不平等条约",pts:[
  {t:"1840年英国发动鸦片战争，1842年签订近代第一个不平等条约《南京条约》。",lv:"★",keys:["1840年6月英国发动鸦片战争，1842年8月清政府被迫签约。","割让香港岛，赔款2100万银元。","开放广州、厦门、福州、宁波、上海五口通商。","协定关税使中国开始丧失关税自主权。"],err:"易混：1840年是战争爆发，1842年才是《南京条约》签订。",hook:"口诀「割港赔款五口税」：香港岛、2100万、五口、协定关税。"},
  {t:"1843至1844年英美法相继逼签条约，攫取领事裁判权等特权。",lv:"◆",keys:["1843年英国逼签《五口通商章程》和《虎门条约》。","英国取得领事裁判权和片面最惠国待遇。","1844年美国逼签《望厦条约》，法国逼签《黄埔条约》。","1860年《北京条约》将九龙司地方一区割让给英国。"],err:"易混国别：望厦是美国、黄埔是法国，勿记反。",hook:"对比记忆：英先虎门、美后望厦、法再黄埔。"},
  {t:"1856至1860年英法发动第二次鸦片战争，沙俄趁机割占北方大片领土。",lv:"★",keys:["1856至1860年英法联军发动第二次鸦片战争，火烧圆明园。","1858年签《天津条约》，1860年签《北京条约》。","沙俄通过《瑷珲条约》《北京条约》等割占东北西北领土150多万平方公里。"],err:"易混：火烧圆明园是英法联军，不是八国联军。",hook:"对比：二鸦是英法（加沙俄渔利），八国联军是1900年。"},
  {t:"1883至1885年中法战争中国「不败而败」，签订《中法新约》。",lv:"◆",keys:["1883至1885年中法战争，中国军民取得镇南关大捷。","清政府妥协求和，签订《中法新约》，形成不败而败结局。"],err:"易错：镇南关大捷是胜仗，却仍签不平等条约，故称不败而败。",hook:"对比：战场打赢、谈判打输，记住「不败而败」四字。"},
  {t:"1894至1895年甲午战争中国战败，签订《马关条约》。",lv:"★",keys:["1895年4月签订《马关条约》。","割让台湾全岛及附属岛屿、澎湖列岛。","赔款2亿两白银，开放沙市、重庆、苏州、杭州为通商口岸。","允许日本在通商口岸开设工厂。"],err:"易混：马关条约赔2亿两，辛丑条约赔4.5亿两。",hook:"口诀「割台、二亿、开四口、可设厂」。"},
  {t:"1900年八国联军侵华，1901年《辛丑条约》使中国完全沦为半殖民地。",lv:"★",keys:["1900年英美德法俄日意奥八国联军侵华并攻占北京。","1901年9月签订《辛丑条约》。","赔款4.5亿两白银，本息合计约9.8亿两。","拆毁大沽炮台，外国军队可驻扎北京至山海关铁路沿线要地。","划东交民巷为使馆区，各国驻兵、中国人不得居住，清政府成洋人的朝廷。"],err:"易混：1900年是八国联军侵华，1901年才是《辛丑条约》。",hook:"口诀「四亿五、九亿八、使馆驻兵」。"}
 ]},
 {h:"1.3 资本-帝国主义对中国的政治控制与经济掠夺",pts:[
  {t:"列强通过不平等条约取得领事裁判权，破坏中国司法主权。",lv:"▲",keys:["领事裁判权由不平等条约取得，是列强在华特权。","该特权严重破坏中国的司法主权。"],err:"易混：领事裁判权破坏司法主权，协定关税破坏关税自主权。",hook:"对比：司法权丢在「领事裁判」，关税权丢在「协定关税」。"},
  {t:"列强把持中国海关并在通商口岸设租界，形成国中之国。",lv:"◆",keys:["英国人赫德任海关总税务司近半个世纪，长期把持中国海关。","海关行政权被外国攫取，列强控制中国财政经济命脉。","上海等地租界成为国中之国。"],err:"易混：赫德是英国人，长期把持中国海关，不是中国自主管理。",hook:"例子：赫德＋上海租界＝海关与租界两个抓手。"},
  {t:"列强控制通商口岸、内河航运与铁路修筑权，倾销商品掠夺原料。",lv:"◇",keys:["控制通商口岸、内河航运和铁路修筑权。","向中国倾销商品、掠夺原料。","甲午战争前列强以商品输出为主，战后转为以资本输出为主。"],err:"易混：甲午战前是商品输出为主，战后才是资本输出为主。",hook:"对比：战前卖商品，战后开工厂，分界线是甲午战争。"},
  {t:"甲午战争后列强对华资本输出急剧扩大，垄断中国经济命脉。",lv:"★",keys:["甲午战后列强对华资本输出急剧扩大。","开设银行、兴办工厂、开采矿山。","资本输出垄断中国经济命脉，允许日本设厂是重要标志。"],err:"易错：资本输出扩大在甲午战后，不要提前到鸦片战争后。",hook:"例子：银行、工厂、矿山，三样都是资本输出的载体。"},
  {t:"甲午战争后列强掀起瓜分中国的狂潮，划分势力范围、强占租借地。",lv:"★",keys:["列强划分势力范围、强占租借地。","德国强占胶州湾，俄国强租旅大。","英国强租威海卫与新界，法国强租广州湾。"],err:"易混租借地：德胶州湾、俄旅大、英威海卫与新界、法广州湾。",hook:"口诀「德胶俄旅、英威法广」。"},
  {t:"1899年美国提出门户开放政策，列强同时以文化渗透奴化民众。",lv:"▲",keys:["1899年美国提出门户开放，要求各国在华机会均等。","门户开放同时承认各国既得势力范围。","文化渗透手段为宗教渗透、创办学校、发行书报。","其目的在于传播殖民思想、奴化中国民众。"],err:"易混：门户开放是美国提出，不是英国；它不否定势力范围。",hook:"对比：门户开放＝利益均沾，但承认各国势力范围。"}
 ]},
 {h:"1.4 近代中国社会的半殖民地半封建性质",pts:[
  {t:"半殖民地半封建社会是近代中国最基本的国情。",lv:"★",keys:["半殖民地指国家主权部分丧失、形式上仍保持独立。","半封建指自然经济逐步解体，但封建制度仍占统治地位。","同时资本主义有所发展，社会性质已非完整封建社会。"],err:"易混：半殖民地不是完全丧失主权，半封建也不是没有资本主义。",hook:"对比：半殖民地看主权，半封建看经济结构。"},
  {t:"中国半殖民地半封建化经历开始、加深、完全沦为三个阶段。",lv:"★",keys:["《南京条约》签订使中国开始沦为半殖民地半封建社会。","《马关条约》签订使半殖民地化程度大大加深。","《辛丑条约》签订后中国完全沦为半殖民地半封建社会。"],err:"易混三阶段：南京开始、马关加深、辛丑完全沦为。",hook:"口诀「南开始、马加深、辛完全」。"},
  {t:"外国资本—帝国主义的侵略是近代中国贫穷落后的总根源。",lv:"▲",keys:["帝国主义侵略是近代中国贫穷落后的总根源。","帝国主义勾结封建势力压迫人民，又阻碍中国资本主义发展。","它是近代中国一切灾难的总根源。"],err:"易错：总根源是帝国主义侵略，不要把封建势力当成总根源。",hook:"对比：总根源对外＝帝国主义，社会支柱对内＝封建势力。"},
  {t:"半殖民地半封建社会有五个基本特点，帝国主义是决定性力量。",lv:"▲",keys:["帝国主义侵略势力成为支配中国的决定性力量。","封建势力与帝国主义勾结，成为其统治中国的社会支柱。","自然经济遭破坏，但封建地主土地所有制仍保持。","民族资本主义有所发展，但始终不是主要经济形式。","经济政治发展极不平衡，人民贫困不自由程度世界少见。"],err:"易混：民族资本主义有发展但不是主要形式，勿夸大为占主导。",hook:"口诀「帝决定、封支柱、封土在、民非主、不平衡」。"}
 ]},
 {h:"1.5 两对主要矛盾与两大历史任务",pts:[
  {t:"近代中国社会有两对主要矛盾，其中帝国主义与中华民族的矛盾最主要。",lv:"★",keys:["帝国主义与中华民族的矛盾。","封建主义与人民大众的矛盾。","帝国主义与中华民族的矛盾是最主要的矛盾。","两对矛盾相互交织，不同时期各有突出。"],err:"易混：最主要矛盾是帝国主义与中华民族，不是封建主义与人民大众。",hook:"对比：民族矛盾在前，阶级矛盾在后，前者最主要。"},
  {t:"近代中华民族面临民族独立人民解放、国家繁荣富强两大历史任务。",lv:"★",keys:["一是求得民族独立和人民解放。","二是实现国家繁荣富强和人民共同富裕。"],err:"易混：两大任务是民族独立人民解放、国家繁荣富强，勿只记一个。",hook:"口诀「独立解放打头，繁荣富强收尾」。"},
  {t:"两大历史任务相互区别又相互联系，前者是前提后者是目的。",lv:"◆",keys:["求得民族独立和人民解放是前提。","实现国家繁荣富强和人民共同富裕是目的。","半殖民地半封建的社会性质决定了两大历史任务。"],err:"易错：不要颠倒前提与目的，独立解放在前，繁荣富强在后。",hook:"对比：先争独立（前提），再求富强（目的）。"}
 ]},
 {h:"1.6 人民群众的反侵略斗争",pts:[
  {t:"1841年5月广州三元里人民抗英，是近代第一次大规模反侵略武装斗争。",lv:"★",keys:["1841年5月广州三元里人民自发抗击英国侵略军。","这是近代史上中国人民第一次大规模的反侵略武装斗争。"],err:"易混：三元里抗英在1841年，早于《南京条约》签订。",hook:"口诀「一八四一，三元里第一」。"},
  {t:"民众自发反侵略贯穿近代，义和团运动粉碎了瓜分中国的图谋。",lv:"▲",keys:["第二次鸦片战争期间广州、天津等地人民自发抗击英法联军。","1895年《马关条约》后台湾人民在刘永福、徐骧领导下反割台。","义和团1898年前后兴起于山东直隶，1900年发展到京津。","义和团以农民为主体开展反帝斗争，粉碎瓜分中国图谋。"],err:"易错：义和团兴起于1898年前后，不是1900年才兴起。",hook:"时间轴：二鸦民众抗敌→反割台→义和团。"},
  {t:"近代爱国官兵浴血抗敌，多位将领战死沙场壮烈殉国。",lv:"◆",keys:["关天培战死虎门，陈化成战死吴淞。","左宝贵战死平壤，邓世昌在黄海海战中壮烈殉国。","丁汝昌在威海卫之战中拒绝投降，自杀殉国。","聂士成在天津保卫战中英勇抗击侵略军，壮烈殉国。","冯子材率军取得镇南关大捷。"],err:"易混人物：邓世昌殉国于黄海，丁汝昌殉国于威海卫。",hook:"口诀「关陈左邓丁聂冯」，按战役顺序串人名。"},
  {t:"19世纪70年代左宗棠率军西征，1878年基本收复新疆。",lv:"▲",keys:["19世纪70年代左宗棠率军西征。","1878年基本收复新疆，伊犁除外。","1884年清政府在新疆建省。"],err:"易混：收复新疆是左宗棠，不是李鸿章；1884年建省。",hook:"时间轴：西征→1878收复→1884建省。"}
 ]},
 {h:"1.7 反侵略战争失败的原因",pts:[
  {t:"反侵略战争失败的根本原因是社会制度的腐败。",lv:"★",keys:["根本原因是清王朝封建统治的腐朽，即社会制度腐败。","统治者腐败无能、压制民众反抗、军事上妥协退让。"],err:"易错：根本原因是制度腐败，经济技术落后只是重要原因。",hook:"对比：根本＝制度，重要＝技术，主次不能倒。"},
  {t:"经济技术落后是反侵略战争失败的重要原因。",lv:"▲",keys:["经济技术落后是又一重要原因。","中国武器装备、军事技术等远逊于侵略者。","社会制度腐败导致经济技术落后。"],err:"易混：技术落后不是根本原因，勿与制度腐败对调。",hook:"对比：器不如人源于制不如人。"},
  {t:"制度腐败与技术落后相互加剧，共同导致反侵略战争失败。",lv:"◆",keys:["社会制度腐败是根本原因。","经济技术落后是重要原因。","制度腐败导致技术落后，技术落后又加剧反侵略斗争失败。"],err:"易错：两者不是并列，根本原因只有一个，即制度腐败。",hook:"链条：制度腐败→技术落后→战争失败。"},
  {t:"帝国主义始终未能灭亡中国，一个重要原因是中国人民的英勇反抗。",lv:"◇",keys:["中国人民的英勇反抗是帝国主义未能灭亡中国的重要原因。","义和团运动粉碎了帝国主义瓜分中国的图谋。"],err:"易错：不能因中国未亡国而否认其半殖民地地位。",hook:"对比：未亡国靠反抗，半殖民地靠条约。"}
 ]},
 {h:"1.8 民族意识的觉醒",pts:[
  {t:"林则徐是近代中国开眼看世界的第一人，主持编译《四洲志》。",lv:"★",keys:["林则徐被称为近代中国开眼看世界的第一人。","他主持编译《四洲志》，介绍世界情况。"],err:"易混：林则徐编译《四洲志》，魏源编成《海国图志》。",hook:"对比：林「编译」四洲志，魏「扩编」海国图志。"},
  {t:"魏源编成《海国图志》，提出师夷长技以制夷的思想。",lv:"★",keys:["魏源在林则徐《四洲志》基础上编成《海国图志》。","提出师夷长技以制夷的思想。"],err:"易混：师夷长技以制夷是魏源提出，不是林则徐。",hook:"口诀「师夷长技以制夷」：先学后制，目的在制。"},
  {t:"早期维新派主张学西方、行君主立宪，严复以进化论警醒国人。",lv:"◆",keys:["19世纪七八十年代郑观应著《盛世危言》。","郑观应主张学习西方、实行君主立宪。","严复翻译《天演论》，宣传物竞天择、适者生存。","严复以进化论号召救亡图存。"],err:"易混：《天演论》是严复译，《盛世危言》是郑观应著。",hook:"对比：郑观应谈制度，严复讲天演。"},
  {t:"1894年孙中山创立兴中会，民族意识走向新的觉醒。",lv:"▲",keys:["1894年孙中山创立兴中会。","提出振兴中华的口号。","标志着民族意识的新觉醒。","甲午战争后民族意识普遍觉醒，救亡图存成为时代主旋律。","1894年孙中山在《上李鸿章书》中提出人尽其才等四项富强主张。"],err:"易混：兴中会创立于1894年，不是1895年公车上书时。",hook:"口诀「一八九四，兴中会，振兴中华」。"}
 ]},
 {h:"1.9 全章题目要点速记",pts:[
  {t:"近代史的时间主轴由战争与条约串成，1840年是近代史起点。",lv:"◆",keys:["1840年鸦片战争成为中国近代史起点。","1842年《南京条约》标志开始沦为半殖民地半封建社会。","1860年《北京条约》割九龙司地方一区给英国。","1895年《马关条约》使半殖民地化大大加深，1901年《辛丑条约》后完全沦为。"],err:"易混：开始沦为是南京条约，大大加深是马关条约，完全沦为是辛丑条约。",hook:"口诀「起点一八四零，三级沦陷南马辛」。"},
  {t:"《马关条约》与《辛丑条约》内容最重，赔款数额极易混淆。",lv:"▲",keys:["《马关条约》割台澎、赔2亿两、开沙市重庆苏州杭州、允许设厂。","《辛丑条约》赔4.5亿两，本息合计约9.8亿两。","《辛丑条约》拆毁大沽炮台，外国军队驻北京至山海关沿线要地。","东交民巷为使馆区，各国驻兵，中国人不得居住。"],err:"易混赔款：马关2亿两，辛丑4.5亿两（本息约9.8亿两）。",hook:"对比：2亿是小数目，4.5亿本息近10亿。"},
  {t:"近代中国社会的性质与基本特点，是理解全部近代史的前提。",lv:"★",keys:["半殖民地是形式上有独立之名，实际政治经济受帝国主义控制。","帝国主义侵略势力成为支配中国的决定性力量。","封建势力与帝国主义勾结，成为其统治中国的社会支柱。","民族资本主义有所发展，但始终没有成为主要形式。","经济政治发展极不平衡，人民贫困和不自由程度世界少见。"],err:"易错：半殖民地不是殖民地，中国形式上仍保持独立。",hook:"对比：五个特点＝帝决定、封支柱、民非主、不平衡、贫困。"},
  {t:"反侵略战争失败有主次两因，帝国主义未能灭亡中国另有原因。",lv:"◇",keys:["失败的根本原因是社会制度腐败。","失败的重要原因是经济技术落后。","帝国主义始终未能灭亡中国，重要原因是中国人民的英勇反抗。"],err:"易错：根本原因与重要原因不可互换，制度在前技术在后。",hook:"对比：败在自己（制度），存也在自己（反抗）。"},
  {t:"近代觉醒人物与著作成对出现，是选择题高频组合。",lv:"▲",keys:["林则徐主持编译《四洲志》，魏源编成《海国图志》。","郑观应著《盛世危言》，主张君主立宪。","严复翻译《天演论》，意在宣传变法图强。","孙中山《上李鸿章书》提出人尽其才、地尽其利、物尽其用、货畅其流。"],err:"易混作者：四洲志属林则徐，海国图志属魏源。",hook:"口诀「林四魏海，郑盛严天」。"}
 ]}
]},
{ch:2,no:"第二章",title:"对国家出路的早期探索",period:"上编 · 1840—1919",secs:[
 {h:"2.1 太平天国农民战争的兴起与经过",pts:[
  {t:"1851年1月洪秀全在广西桂平金田村起义，建号太平天国。",lv:"★",keys:["1851年1月洪秀全在广西桂平县金田村发动起义。","建号太平天国，史称金田起义。"],err:"易混：金田起义在1851年1月，不是1853年定都时。",hook:"口诀「一八五一，金田起义」。"},
  {t:"1853年3月太平军攻克南京并改名天京，建立与清政府对峙的政权。",lv:"★",keys:["1851年9月太平军攻克永安后封王建制，初步建立革命政权。","1853年3月攻克南京，定为都城并改名天京。","正式建立与清政府对峙的农民政权。"],err:"易混：永安建制在1851年，定都天京在1853年。",hook:"时间轴：金田起义→永安建制→定都天京。"},
  {t:"定都天京后北伐西征，1856年上半年太平天国达到军事全盛。",lv:"◇",keys:["定都天京后发动北伐与西征。","1856年上半年在军事上达到全盛。","势力扩展到18个省。","沉重打击清王朝封建统治和外国侵略势力。"],err:"易错：全盛在1856年上半年，同年9月天京事变即由盛转衰。",hook:"对比：1856年上半年最盛，下半年事变转衰。"},
  {t:"1856年天京事变使太平天国由盛转衰，1864年天京陷落而失败。",lv:"◆",keys:["1856年9月发生天京事变。","杨秀清被杀、韦昌辉被处死、石达开率部出走。","太平天国由此由盛转衰。","1864年6月洪秀全病逝，7月天京陷落。","太平天国历时14年（1851—1864）而失败。"],err:"易混：天京事变在1856年，天京陷落在1864年。",hook:"口诀「杨杀韦死石出走」，事变三后果。"}
 ]},
 {h:"2.2 《天朝田亩制度》与《资政新篇》",pts:[
  {t:"1853年冬颁布《天朝田亩制度》，以解决农民土地问题为中心。",lv:"★",keys:["1853年冬颁布，是太平天国的纲领性文件。","规定凡天下田天下人同耕，有田同耕、有饭同食，按人口平均分配。","描绘无处不均匀、无人不饱暖的理想社会。"],err:"易混：天朝田亩制度1853年颁布，资政新篇1859年提出。",hook:"口诀「有田同耕、有饭同食」。"},
  {t:"《天朝田亩制度》否定封建土地所有制，但属绝对平均主义空想。",lv:"▲",keys:["从根本上否定了封建地主土地所有制，具有历史进步性。","体现绝对平均主义思想，违背社会发展规律。","只是一种无法实现的空想。"],err:"易错：进步性在否定封建土地所有制，局限在绝对平均主义。",hook:"对比：方向进步（反封建），方法空想（绝对平均）。"},
  {t:"1859年洪仁玕提出《资政新篇》，是第一个资本主义色彩改革方案。",lv:"★",keys:["1859年由洪仁玕提出。","是近代中国第一个比较系统的带有资本主义色彩的社会改革方案。","主张发展近代工矿、交通、邮政、金融事业，兴办学校医院。","主张同外国平等交往、学习西方先进技术。","未触及封建土地制度，缺乏阶级基础和社会条件，未能实施。"],err:"易错：资政新篇未触及封建土地制度，这是它未能实施的原因之一。",hook:"对比：天朝田亩管土地，资政新篇学资本主义。"}
 ]},
 {h:"2.3 太平天国失败的原因与教训",pts:[
  {t:"太平天国失败的根本原因是农民阶级的局限性。",lv:"★",keys:["缺乏科学理论指导，提不出正确的革命纲领。","农民不是新的生产力和生产关系的代表。","缺乏先进阶级即无产阶级的领导。"],err:"易错：根本原因是农民阶级局限性，不是天京事变内讧。",hook:"对比：内讧是表现，阶级局限性才是根本。"},
  {t:"领导集团腐败、对侵略者认识不清与战略失误加速了失败。",lv:"◇",keys:["领导集团进城后贪图享乐、争权夺利，内部腐败削弱自身力量。","一度把外国侵略者视为洋兄弟，缺乏反帝的自觉认识。","军事上孤军北伐、缺乏后方支援等战略失误。"],err:"易错：这些是具体原因，不是根本原因。",hook:"三条并列：腐败、认敌为友、战略失误。"},
  {t:"太平天国是中国旧式农民战争的最高峰，动摇了清王朝统治基础。",lv:"▲",keys:["是中国旧式农民战争的最高峰。","沉重打击了清王朝的封建统治。","动摇了清王朝的统治基础。"],err:"易错：最高峰不等于成功，它最终仍然失败。",hook:"对比：规模最高峰，结局仍失败。"},
  {t:"单纯农民战争不能完成反帝反封建任务，农民阶级不能领导革命胜利。",lv:"★",keys:["单纯的农民战争不能完成反帝反封建的历史任务。","农民阶级不能领导中国民主革命取得胜利。","中国革命的胜利必须有先进阶级和先进政党的领导。"],err:"易错：不是农民战争不重要，而是农民阶级不能领导革命成功。",hook:"口诀「农民能造反，不能领导」。"}
 ]},
 {h:"2.4 洋务运动的兴起",pts:[
  {t:"洋务运动是19世纪60年代清政府在内忧外患下的自救运动。",lv:"▲",keys:["兴起于19世纪60年代。","内忧外患指太平天国运动和第二次鸦片战争。","直接目的是挽救清政府的统治危机。"],err:"易混：洋务运动兴起于19世纪60年代，不是鸦片战争后立即开始。",hook:"对比：内忧＝太平天国，外患＝第二次鸦片战争。"},
  {t:"洋务派中央以奕䜣为代表，地方以曾李左张为代表。",lv:"◇",keys:["中央以恭亲王奕䜣为代表。","地方以曾国藩、李鸿章、左宗棠、张之洞等为代表。"],err:"易混：奕䜣是洋务派中央代表，不是维新派。",hook:"口诀「中央奕䜣，地方曾李左张」。"},
  {t:"洋务派以中学为体、西学为用为原则，以自强求富为口号。",lv:"★",keys:["中学为体、西学为用的体指封建制度及其纲常名教。","在不触动封建制度前提下学习西方军事和科学技术。","以自强、求富为口号。","前期以自强为主办军用工业，后期以求富为主办民用企业。"],err:"易混：体是封建制度，用是西方技术，不能颠倒。",hook:"口诀「中体西用，自强求富」。"}
 ]},
 {h:"2.5 洋务运动的主要内容",pts:[
  {t:"洋务派前期以自强为口号，兴办近代军用工业。",lv:"★",keys:["1861年曾国藩创办安庆内军械所。","1865年李鸿章在上海创办江南制造总局。","1866年左宗棠创办福州船政局。","创办军事工业既为镇压农民起义，也为加强国防力量。"],err:"易混：江南制造总局是李鸿章办，福州船政局是左宗棠办。",hook:"时间轴：1861安庆→1865江南→1866福州。"},
  {t:"洋务派后期以求富为口号，以官督商办方式兴办民用企业。",lv:"◇",keys:["民用企业以官督商办为主。","1872年李鸿章创办上海轮船招商局。","还开办开平矿务局、汉阳铁厂等。"],err:"易混：轮船招商局是民用企业，不是军用工业。",hook:"对比：军用求强，民用求富。"},
  {t:"洋务运动创办新式学堂并派遣留学生，培养近代人才。",lv:"▲",keys:["1862年设立京师同文馆，是第一所官办新式学堂。","还创办福州船政学堂、天津北洋水师学堂等。","1872年起先后派遣四批幼童赴美国留学。","派第一批赴美留学生，开中国近代派遣留学生之先河。"],err:"易混：京师同文馆1862年设立，不是戊戌变法时的京师大学堂。",hook:"对比：同文馆学外语，船政学堂学造船。"},
  {t:"洋务运动筹建三支近代海军，北洋海军实力最强。",lv:"▲",keys:["先后建立南洋、北洋、福建三支海军。","1888年李鸿章建成的北洋海军实力最强。","1894至1895年甲午战争惨败，北洋海军全军覆没。","1895年2月威海卫之战覆没，标志洋务运动破产。"],err:"易混：洋务运动破产的标志是甲午战争北洋海军覆没，不是戊戌政变。",hook:"对比：1888建成最强，1895全军覆没。"}
 ]},
 {h:"2.6 洋务运动的历史作用与失败原因",pts:[
  {t:"洋务运动客观上促进中国早期工业与民族资本主义发展，是近代化开端。",lv:"▲",keys:["客观上促进中国早期工业和民族资本主义的产生与发展。","是中国近代化的开端。","传播西方近代科学技术知识，培养科技、军事和翻译人才。","冲击重农抑商、鄙视工艺的传统观念，促进社会风气变化。"],err:"易错：作用是客观上的，不代表洋务运动成功。",hook:"对比：主观求自救，客观促近代化。"},
  {t:"洋务运动失败的根本原因在于其封建性。",lv:"★",keys:["企图在不改变封建制度的前提下实现自强。","这种设想违背了历史发展规律。","根本原因是封建制度的束缚。"],err:"易错：根本原因是封建性，不是技术不如人。",hook:"对比：只学技术不改制度，注定失败。"},
  {t:"洋务企业具有封建性、依赖性和腐朽性三大弊端。",lv:"◆",keys:["封建性表现为衙门式管理。","依赖性表现为依赖外国、受制于人。","腐朽性表现为管理腐败、效率低下。"],err:"易混：三性对应管理、依赖、效率，不要张冠李戴。",hook:"口诀「封衙、依外、腐低效」。"},
  {t:"甲午战败证明中体西用救不了中国，洋务运动不能使中国富强。",lv:"★",keys:["仅靠学习西方技术的道路救不了中国。","洋务运动不能使中国富强。","与戊戌维新失败的共同原因是都没有触动封建制度的根基。"],err:"易错：共同原因是未触动封建制度根基，不是都因技术落后。",hook:"对比：洋务只动技术，戊戌想动制度，都没动根基。"}
 ]},
 {h:"2.7 戊戌维新运动的兴起",pts:[
  {t:"1895年公车上书揭开维新运动序幕，反对签订《马关条约》。",lv:"★",keys:["1895年5月康有为联合在京应试的一千三百多名举人上书光绪帝。","反对签订《马关条约》。","史称公车上书，揭开了维新运动的序幕。","冲破了士人不得干政的禁令。"],err:"易混：公车上书在1895年，不是1898年百日维新时。",hook:"口诀「一八九五，举人上书」。"},
  {t:"维新派以康有为为领袖，梁启超、谭嗣同、严复为主要代表。",lv:"▲",keys:["代表人物有康有为、梁启超、谭嗣同、严复等。","康有为是维新运动的领袖。","康有为著《新学伪经考》《孔子改制考》，以托古改制提供理论依据。","严复翻译《天演论》，宣传进化论，为维新运动提供思想武器。","谭嗣同撰写《仁学》，猛烈抨击封建纲常礼教。"],err:"易混：《新学伪经考》是康有为著，不是梁启超。",hook:"对比：康有为托古改制，谭嗣同抨击纲常礼教。"},
  {t:"维新派组织学会、创办报刊，制造变法舆论。",lv:"◆",keys:["1895年组织强学会，1898年组织保国会。","创办《时务报》，由梁启超主笔。","创办《国闻报》，由严复创办。","1895年创办《万国公报》，后改名《中外纪闻》。","梁启超在《变法通议》中系统宣传变法维新的主张。"],err:"易混：时务报梁启超主笔，国闻报严复创办。",hook:"对比：梁主时务报，严办国闻报。"},
  {t:"维新派与守旧派的论战，是资产阶级与封建主义思想的首次正面交锋。",lv:"★",keys:["论战围绕要不要变法展开。","围绕要不要兴民权、设议院展开。","围绕要不要废八股、改科举、兴西学展开。","这是资产阶级思想与封建主义思想的第一次正面交锋。"],err:"易混：这是第一次正面交锋，不是五四时期才出现。",hook:"口诀「变不变、权不权、科举不科举」。"}
 ]},
 {h:"2.8 百日维新",pts:[
  {t:"1898年6月11日光绪帝颁布明定国是诏书，百日维新开始。",lv:"★",keys:["1898年6月11日光绪帝颁布明定国是诏书。","宣布变法，史称戊戌变法或百日维新。"],err:"易混：明定国是诏在1898年6月，戊戌政变在9月。",hook:"口诀「六月下诏，九月政变，共一百零三天」。"},
  {t:"百日维新涉及政治、经济、军事、文教四方面改革。",lv:"▲",keys:["政治上改革行政机构、裁撤冗员、准许官民上书言事。","经济上鼓励发展农工商业、设立铁路矿务总局。","军事上裁减绿营、编练新军。","文教上废除八股、改试策论、设立京师大学堂。"],err:"易混：京师大学堂是戊戌变法设立的，不是洋务运动。",hook:"四字串记：政、经、军、文。"},
  {t:"1898年9月21日慈禧发动戊戌政变，变法历时103天失败。",lv:"★",keys:["1898年9月21日慈禧太后发动戊戌政变。","囚禁光绪帝于中南海瀛台，重新临朝训政。","镇压维新派，变法前后历时103天而失败。"],err:"易混：变法103天，不是100天，也不是一整年。",hook:"口诀「一零三天，短命变法」。"},
  {t:"戊戌六君子遇害，京师大学堂是变法唯一保留的成果。",lv:"◆",keys:["谭嗣同、康广仁、林旭、杨深秀、杨锐、刘光第六人被杀。","这六人被合称为戊戌六君子。","京师大学堂是变法中保留下来的唯一成果。","京师大学堂后成为北京大学的前身。","戊戌变法是自上而下的资产阶级性质的政治改良运动。"],err:"易混：康有为、梁启超不在戊戌六君子之列。",hook:"口诀「谭康林杨杨刘」六君子。"}
 ]},
 {h:"2.9 戊戌维新运动的意义与教训",pts:[
  {t:"戊戌维新是爱国救亡、政治改良与思想启蒙三重性质的运动。",lv:"★",keys:["是爱国救亡运动，激发人们爱国热情和民族意识。","是资产阶级性质的政治改良运动，主张兴民权、设议院、君主立宪。","是思想启蒙运动，传播资产阶级新文化新思想，促进思想解放。","促进近代教育、出版、新闻等事业发展。","最突出的历史贡献是宣传资产阶级新思想，起思想启蒙作用。"],err:"易错：最突出贡献是思想启蒙，不是政治改良成功。",hook:"口诀「救亡、改良、启蒙」三合一。"},
  {t:"维新派依靠无实权皇帝、脱离群众、不敢否定封建主义而失败。",lv:"★",keys:["幻想依靠没有实权的皇帝和帝国主义支持。","维新派严重脱离人民群众。","不敢从根本上否定封建主义。","暴露出资产阶级的软弱性和妥协性。"],err:"易错：根本原因是资产阶级软弱性妥协性，不是光绪无实权本身。",hook:"对比：靠皇帝、怕群众、不敢反封建，三病齐发。"},
  {t:"戊戌维新证明资产阶级改良道路在半殖民地半封建中国行不通。",lv:"▲",keys:["资产阶级改良主义道路在半殖民地半封建的中国行不通。","要救中国必须用革命的手段。"],err:"易错：改良行不通的结论，不是说维新运动毫无意义。",hook:"对比：改良走不通，革命才有路。"}
 ]},
 {h:"2.10 全章题目要点速记",pts:[
  {t:"太平天国的后期支撑、圣库制度与中外联合绞杀是常考细节。",lv:"◆",keys:["天京事变后主要依靠陈玉成、李秀成支撑军事局面。","1861年安庆保卫战失败、安庆失陷，天京失去屏障。","起义之初实行圣库制度，一切财物归公、按需分配。","批判孔子及儒家经典，削弱封建统治的精神支柱。","外国侵略者组建洋枪队，与清政府联合绞杀；主要清军是湘军和淮军。"],err:"易混：镇压太平天国的主要清军是湘军和淮军，不是八旗兵。",hook:"对比：前期圣库平均，后期陈李苦撑。"},
  {t:"太平天国打击中外反动势力，鼓舞了亚洲民族解放运动。",lv:"◇",keys:["沉重打击封建统治阶级，强烈撼动清政府的统治根基。","是中国旧式农民战争的最高峰。","有力打击外国侵略势力。","鼓舞了亚洲各国人民的民族解放运动。"],err:"易错：太平天国打击了外国侵略势力，但它对侵略者缺乏清醒认识。",hook:"对比：对内撼根基，对外鼓亚洲。"},
  {t:"总理衙门、冯桂芬与天津水师学堂是洋务运动的常考细节。",lv:"▲",keys:["1861年清政府设立总理各国事务衙门，综理洋务及外交事务。","冯桂芬在《校邠庐抗议》中最先完整表述中学为体、西学为用。","创办天津水师学堂等新式学堂，专门培养海军与造船人才。","派遣第一批赴美留学生，开中国近代派遣留学生之先河。","性质是封建地主阶级不触动封建制度而学习西方技术的自救运动。"],err:"易混：最先完整表述中体西用是冯桂芬，不是李鸿章。",hook:"口诀「一八六一总理衙门，冯桂芬首提中体西用」。"},
  {t:"洋务运动的破产标志与失败原因，常以单选和简答出现。",lv:"▲",keys:["1895年2月北洋海军在威海卫全军覆没，标志洋务运动破产。","失败的根本原因是封建制度的束缚。","与戊戌维新失败的共同原因是都没有触动封建制度的根基。","创办军事工业既为镇压农民起义，也为加强国防力量。"],err:"易错：破产标志是甲午战败北洋覆没，不是总理衙门设立。",hook:"对比：1888成军，1895覆没，七年而终。"},
  {t:"维新派的报刊、著作与政变结局是选择题的常考细节。",lv:"◆",keys:["1895年康有为、梁启超在北京创办《万国公报》，后改名《中外纪闻》。","梁启超在《变法通议》中系统宣传变法维新的主张。","谭嗣同撰写《仁学》，猛烈抨击封建纲常礼教。","戊戌政变后慈禧将光绪帝囚禁于中南海瀛台，重新临朝训政。"],err:"易混：《仁学》作者是谭嗣同，《变法通议》作者是梁启超。",hook:"对比：谭仁学，梁通议。"},
  {t:"太平天国、洋务运动、戊戌维新三场探索的共同背景与共同失败根源。",lv:"◇",keys:["共同时代背景是中国逐渐沦为半殖民地半封建社会。","三者都不彻底，都未提出并坚持彻底的反帝反封建纲领。","农民阶级、地主阶级洋务派、资产阶级维新派都不能领导革命胜利。","中国近代民族民主革命的胜利必须有先进阶级及其政党的领导。"],err:"易错：三场运动都失败，但失败的具体原因各不相同。",hook:"对比：农民靠天，洋务靠器，维新靠皇帝，皆不成。"}
 ]}
]},
{ch:3,no:"第三章",title:"辛亥革命",period:"上编 · 1840—1919",secs:[
 {h:"3.1 辛亥革命的历史背景",pts:[
  {t:"《辛丑条约》签订后清政府成为帝国主义统治中国的工具，民族危机空前加深。",lv:"★",keys:["《辛丑条约》签订后，民族危机和社会危机空前加深。","清政府完全成为帝国主义统治中国的工具。","1904至1905年日俄战争争夺中国东北，清政府竟宣布局外中立。"],err:"误以为《辛丑条约》后清政府仍有独立主权，实则已受列强控制。",hook:"对比记忆：条约之后，朝廷成了洋人的工具。"},
  {t:"清末新政与预备立宪旨在维护封建统治，未能挽救统治危机。",lv:"★",keys:["1901年起清政府推行新政，1906年宣布预备仿行立宪。","1908年颁布《钦定宪法大纲》，仍以维护封建统治为目的。","新政与预备立宪并未挽救清政府的统治危机。"],err:"误以为清末新政是资产阶级性质改革，实为维护封建统治。",hook:"对比记忆：新政、预备立宪都是清廷自救，不是革命。"},
  {t:"20世纪初民族资本主义初步发展，民族资产阶级壮大，革命有了阶级基础。",lv:"▲",keys:["中国民族资本主义初步发展，民族资产阶级力量不断壮大。","这为资产阶级革命准备了阶级基础。","资产阶级、小资产阶级知识分子成为革命派骨干力量。","他们随新式学堂兴办和留学生派遣而逐渐形成。"],err:"误把农民阶级当作辛亥革命的阶级基础，实为民族资产阶级。",hook:"口诀：资本壮、知识分子成骨干。"},
  {t:"废科举、兴学堂与群众自发斗争，从思想和根基上动摇了清朝统治。",lv:"◇",keys:["1905年清政府下令废除科举制度，各地兴办新式学堂。","新式学堂客观上有利于革命思想的传播。","各地抗捐抗税、抢米风潮等群众自发斗争此起彼伏。","群众斗争使清朝统治基础严重动摇。"],err:"易把抢米风潮说成革命派领导，实为群众自发斗争。",hook:"口诀：科举废、学堂兴、抢米起、根基摇。"}
 ]},
 {h:"3.2 兴中会与中国同盟会",pts:[
  {t:"1894年孙中山在檀香山创立兴中会，是近代中国第一个资产阶级革命团体。",lv:"★",keys:["1894年11月，孙中山在檀香山创立兴中会，提出振兴中华的口号。","1894年孙中山上书李鸿章遭冷遇，遂赴檀香山走上革命道路。","1895年10月兴中会策划广州起义未果，孙中山流亡海外继续宣传革命。"],err:"误把兴中会当成第一个全国性资产阶级革命政党。",hook:"对比：兴中会是革命团体，同盟会才是全国性革命政党。"},
  {t:"20世纪初资产阶级革命书刊纷起，民主革命思想广泛传播。",lv:"◇",keys:["章太炎著《驳康有为论革命书》，驳斥保皇改良主张。","邹容著《革命军》，号召建立资产阶级共和国。","陈天华著《警世钟》《猛回头》，用通俗文字宣传革命。","1904年孙中山发表《中国问题的真解决》，主张以革命推翻清王朝。"],err:"易混作者与书名，如把《革命军》误记为章太炎所著。",hook:"口诀：章驳康、邹革命、陈警世、孙真解决。"},
  {t:"1904年华兴会与光复会相继成立，为同盟会建立准备了组织条件。",lv:"◇",keys:["黄兴、宋教仁等在长沙成立华兴会。","蔡元培、陶成章等在上海成立光复会。"],err:"易混地域，华兴会在长沙成立，光复会在上海成立。",hook:"对比：华兴会长沙黄宋，光复会上海蔡陶。"},
  {t:"1905年中国同盟会在东京成立，是第一个全国性资产阶级革命政党。",lv:"★",keys:["1905年8月20日，孙中山联合兴中会、华兴会、光复会等在东京成立同盟会。","孙中山被推举为总理，纲领为驱除鞑虏、恢复中华、创立民国、平均地权。","同盟会成立使全国性资产阶级民主革命有了统一的领导核心。"],err:"误记同盟会成立地点为广州或上海，实为日本东京。",hook:"口诀：一九零五东京立，十六字纲领要记牢。"},
  {t:"1905年11月《民报》创刊，孙中山在发刊词中把纲领概括为三民主义。",lv:"▲",keys:["《民报》是同盟会机关报，1905年11月在东京创刊。","发刊词把十六字纲领概括为民族、民权、民生三大主义。"],err:"误以为三民主义在同盟会成立大会上提出，实见于《民报》发刊词。",hook:"对比：八月建会，十一月发文提出三民主义。"}
 ]},
 {h:"3.3 三民主义学说",pts:[
  {t:"三民主义即民族、民权、民生三大主义，是孙中山的资产阶级民主革命纲领。",lv:"★",keys:["民族主义即驱除鞑虏、恢复中华，以革命推翻清王朝，反对民族压迫。","民权主义即创立民国，推翻君主专制，建立资产阶级共和国。","民生主义即平均地权，核定地价、涨价归公，防止贫富悬殊。"],err:"易混三民主义与同盟会十六字纲领的对应关系。",hook:"口诀：民族驱鞑虏，民权创民国，民生均地权。"},
  {t:"三民主义是比较完整的资产阶级民主革命纲领，反映人民共同愿望。",lv:"▲",keys:["反映了中国人民要求民族独立和民主权利的共同愿望。","纲领涵盖民族、民权、民生三个方面，体系比较完整。"],err:"误说三民主义已提出明确反帝口号，实际并没有。",hook:"评价口诀：比较完整，但不彻底。"},
  {t:"三民主义的局限在于没有明确反帝，也没有彻底的土地革命纲领。",lv:"◆",keys:["没有明确提出反对帝国主义的口号。","没有彻底的土地革命纲领，不能满足农民的土地要求。","局限根源是民族资产阶级的软弱性和妥协性。"],err:"易把平均地权等同于彻底的土地革命，二者并不相同。",hook:"对比：平均地权是改良方案，不是彻底土改。"}
 ]},
 {h:"3.4 革命派与改良派的论战",pts:[
  {t:"1905至1907年，革命派与改良派分别以《民报》《新民丛报》为阵地展开论战。",lv:"★",keys:["改良派即保皇派，代表人物是康有为、梁启超。","他们鼓吹保皇，反对以革命手段推翻清政府，主张君主立宪。"],err:"易把论战双方阵地记反，《民报》属于革命派。",hook:"对比：革命民报，保皇新民丛报。"},
  {t:"论战围绕要不要革命、要不要共和、要不要社会革命三个问题展开。",lv:"★",keys:["要不要以革命手段推翻清王朝，是论战的焦点。","要不要推翻帝制、实行共和。","要不要进行社会革命，即实行平均地权。"],err:"误把推翻帝制当作论战焦点，焦点实为是否以革命推翻清王朝。",hook:"口诀：一革命、二共和、三社会革命。"},
  {t:"论战划清了革命与改良的界限，为辛亥革命作了思想舆论准备。",lv:"◇",keys:["使民主革命思想深入人心，壮大了革命声势。","暴露了革命派在反帝和土地问题上的理论局限。"],err:"误以为论战消除了革命派的理论局限，实际是暴露了局限。",hook:"例子：论战赢了舆论，也露了短板。"}
 ]},
 {h:"3.5 革命党人的武装起义",pts:[
  {t:"1906年萍浏醴起义是同盟会成立后发动的第一次武装起义。",lv:"★",keys:["1906年12月，同盟会会员刘道一等发动萍浏醴起义。","萍浏醴起义是同盟会成立后发动的第一次武装起义。","起义虽败，但打击了清朝统治，扩大了革命影响。"],err:"易把萍浏醴起义误记为1905年，实为1906年12月。",hook:"口诀：零六萍浏醴，同盟第一枪。"},
  {t:"1907至1908年孙中山在西南边境连续发动多次起义，均告失败。",lv:"▲",keys:["1907年发动潮州黄冈、惠州七女湖、钦廉防城等起义。","1907年12月孙中山亲自领导镇南关起义，一度攻占镇南关炮台。","1908年同盟会在云南发动河口起义。"],err:"易混年月，镇南关起义发生在1907年12月。",hook:"口诀：西南边境一串珠，黄冈七女到镇南关。"},
  {t:"1911年广州起义失败，牺牲者葬于黄花岗，史称黄花岗七十二烈士。",lv:"★",keys:["1911年4月27日，黄兴等发动广州起义。","起义失败后牺牲者合葬于黄花岗，史称黄花岗七十二烈士。"],err:"易混年份，广州起义在1911年4月，不在10月。",hook:"对比：四月黄花岗流血，十月武昌成功。"},
  {t:"徐锡麟安庆起义与秋瑾绍兴就义合称浙皖起义，震动了清朝统治。",lv:"◇",keys:["1907年光复会会员徐锡麟发动安庆起义，失败牺牲。","秋瑾在绍兴筹划响应，事败英勇就义。","1910年汪精卫等谋刺摄政王载沣，暗杀行动亦未成功。"],err:"易混牺牲地点，徐锡麟在安庆，秋瑾在绍兴。",hook:"对比：徐安庆，秋绍兴，浙皖起义两烈士。"},
  {t:"各次武装起义虽失败，却打击了清朝统治，为武昌起义准备了条件。",lv:"◇",keys:["起义打击了清朝统治，扩大了革命影响。","积累了斗争经验，为武昌起义准备了条件。"],err:"误以为起义失败毫无意义，实为武昌起义准备了条件。",hook:"口诀：屡败屡战，铺路武昌。"}
 ]},
 {h:"3.6 武昌起义与全国响应",pts:[
  {t:"1911年保路运动使湖北新军入川，为武昌起义创造了有利时机。",lv:"★",keys:["1911年5月起，四川等省爆发反对铁路国有政策的保路运动。","清政府调湖北新军入川镇压，武昌兵力空虚。"],err:"误以为武昌起义由保路运动直接引发，它只创造了时机。",hook:"例子：兵力调走，城门洞开。"},
  {t:"1911年10月10日，文学社与共进会发动武昌起义并占领武昌。",lv:"★",keys:["起义由武昌新军中的革命团体文学社、共进会发动。","起义前夕两团体在湖北新军中发展革命力量，为起义准备条件。","起义成功后成立湖北军政府，推举原清军协统黎元洪为都督。"],err:"易把武昌起义领导者记成同盟会总部，实为文学社和共进会。",hook:"口诀：双十武昌，文学共进。"},
  {t:"武昌起义后各省纷纷响应，清朝统治土崩瓦解。",lv:"◆",keys:["湖南、陕西等省首先响应，到1911年11月十多个省宣布独立。","许多独立省份的都督由旧官僚和立宪派担任，反映革命的妥协性。"],err:"误以为各省都督都是革命党人，实际多为旧官僚和立宪派。",hook:"对比：旗帜换了，人物未换。"},
  {t:"1912年1月1日中华民国临时政府在南京成立，孙中山就任临时大总统。",lv:"▲",keys:["1911年12月29日，各省都督府代表会议选举孙中山为临时大总统。","1912年1月1日孙中山在南京宣誓就职，改用公历并以中华民国纪元。","临时政府规定以五色旗为国旗，象征汉、满、蒙、回、藏五族共和。"],err:"易混两个时间，12月29日选举，1月1日就职。",hook:"对比：年底选举，元旦就职。"}
 ]},
 {h:"3.7 中华民国的建立与《临时约法》",pts:[
  {t:"南京临时政府是中国历史上第一个资产阶级共和国政府。",lv:"★",keys:["1912年1月1日中华民国南京临时政府成立，孙中山任临时大总统。","颁布一系列有利于发展资本主义经济和文化教育的政策法令。","是资产阶级共和国性质的革命政权。"],err:"易混临时政府成立与清帝退位时间，前者为1月1日。",hook:"例子：第一个共和政府，开历史先河。"},
  {t:"1912年2月12日清帝退位，结束了两千多年的封建君主专制制度。",lv:"▲",keys:["1912年2月12日，清帝溥仪宣布退位，清王朝统治终结。","结束的是封建君主专制制度，而非整个封建制度。"],err:"易说成结束了两千多年封建制度，实际只结束君主专制制度。",hook:"对比：帝制终结，封建土地制度仍在。"},
  {t:"1912年3月颁布《中华民国临时约法》，是中国第一部具有宪法性质的法典。",lv:"★",keys:["规定中华民国主权属于国民全体。","确立行政、立法、司法三权分立的政治体制。","为限制袁世凯专权，规定实行责任内阁制。","以法律形式肯定资产阶级民主共和制度，具有进步意义。"],err:"易混颁布时间，临时约法颁布于1912年3月。",hook:"口诀：主权归民，三权分立，责任内阁。"},
  {t:"1912年4月孙中山辞职，袁世凯在北京就任，革命果实被窃取。",lv:"◇",keys:["1912年4月1日孙中山被迫辞去临时大总统职务。","袁世凯在北京就任临时大总统，革命果实被窃取，政权落入北洋军阀手中。"],err:"易把袁世凯就任地点记为南京，实为北京。",hook:"对比：南京让位，北京掌权。"}
 ]},
 {h:"3.8 辛亥革命的历史意义",pts:[
  {t:"辛亥革命推翻了清王朝，结束君主专制制度，建立了资产阶级共和国。",lv:"★",keys:["推翻了清王朝的统治。","结束了统治中国两千多年的封建君主专制制度。","建立了资产阶级共和国，是二十世纪中国的第一次历史性巨变。"],err:"易说成结束了封建制度，实为结束封建君主专制制度。",hook:"口诀：推清廷、终帝制、建共和。"},
  {t:"辛亥革命使民主共和观念深入人心，促进了中国人民的思想解放。",lv:"▲",keys:["民主共和观念广泛传播，深入人心。","促进了中国人民的思想解放，为后续革命准备了思想条件。"],err:"误以为辛亥革命完成了思想启蒙任务，思想解放才刚开始。",hook:"例子：此后谁想称帝，人人喊打。"},
  {t:"辛亥革命促进了民族资本主义发展，打击了帝国主义在华侵略势力。",lv:"▲",keys:["南京临时政府颁布奖励实业等法令，促进民族资本主义经济发展。","打击了帝国主义在华侵略势力，推动亚洲各国民族解放运动高涨。","是近代中国比较完全意义上的资产阶级民主革命。"],err:"易把辛亥革命说成彻底的反帝运动，它并未明确反帝。",hook:"口诀：兴实业、震列强、助亚洲。"},
  {t:"辛亥革命没有改变半殖民地半封建社会性质，未完成反帝反封建任务。",lv:"◆",keys:["没有改变中国半殖民地半封建的社会性质。","没有完成反帝反封建的历史任务。"],err:"易把辛亥革命的意义与局限混为一谈，二者须分开表述。",hook:"对比：成功在破，失败在立。"}
 ]},
 {h:"3.9 辛亥革命失败的原因与教训",pts:[
  {t:"辛亥革命失败的根本原因是资产阶级的软弱性和妥协性。",lv:"★",keys:["客观原因是中外反动势力勾结、反革命力量强大，帝国主义支持袁世凯。","根本原因是资产阶级的软弱性和妥协性。"],err:"易把客观原因当作根本原因，根本原因在阶级自身。",hook:"对比：外因是强敌，内因是软弱。"},
  {t:"革命派没有提出彻底的反帝反封建纲领，也没有解决农民土地问题。",lv:"★",keys:["没有提出彻底的反帝反封建纲领，没有明确反对帝国主义。","没有彻底解决农民土地问题，不能满足农民的土地要求。"],err:"易把平均地权视为已解决农民土地问题，实际并未实行。",hook:"口诀：反帝不彻底，土改不落地。"},
  {t:"革命派没有发动和依靠广大人民群众，特别是没有发动广大农民。",lv:"▲",keys:["没有发动和依靠广大人民群众，特别是没有发动广大农民。","没有建立坚强有力的革命政党作为核心，同盟会组织涣散、内部意见分歧。"],err:"易把同盟会说成坚强领导核心，实则组织涣散、意见分歧。",hook:"口诀：群众未动，政党未强。"},
  {t:"辛亥革命的教训是资产阶级共和国方案在半殖民地半封建的中国行不通。",lv:"◆",keys:["资产阶级共和国方案在半殖民地半封建的中国行不通。","民族资产阶级不能领导中国民主革命取得胜利。"],err:"误以为失败只缘力量不足，忽略了阶级局限与道路问题。",hook:"口诀：路走不通，须换新路。"}
 ]},
 {h:"3.10 捍卫共和制度的斗争",pts:[
  {t:"1913年宋教仁被刺引发二次革命，讨袁很快失败。",lv:"★",keys:["1913年3月，袁世凯派人刺杀国民党代理理事长宋教仁，即宋案。","1913年7月孙中山、黄兴发动二次革命武力讨袁，因力量悬殊很快失败。","二次革命失败后袁世凯势力进一步扩张。","1914年孙中山在日本东京成立中华革命党，坚持武装讨袁。"],err:"易混宋案年份，1913年3月而非1912年。",hook:"口诀：刺宋教仁，起二次革命。"},
  {t:"1915年袁世凯复辟帝制，护国运动兴起，帝制被迫取消。",lv:"★",keys:["1915年12月袁世凯宣布恢复帝制，改国号为中华帝国，年号洪宪。","1915年12月蔡锷等在云南发动护国运动，各省纷纷响应。","袁世凯被迫于1916年3月取消帝制，6月在众叛亲离中死去。"],err:"易混护国运动发生地，起于云南而非广东。",hook:"口诀：称帝改元洪宪，云南护国讨袁。"},
  {t:"1917年张勋拥溥仪复辟仅十二天即被段祺瑞讨平。",lv:"◇",keys:["1917年7月张勋拥戴清废帝溥仪复辟，仅十二天即告失败。","段祺瑞组织讨逆军进京讨伐，平息复辟。","段祺瑞掌权后拒绝恢复《临时约法》和国会。"],err:"易把张勋复辟与袁世凯复辟混同，时间人物皆不同。",hook:"对比：袁复辟称帝，张复辟拥清。"},
  {t:"1917年孙中山发动护法运动，因西南军阀排挤而失败。",lv:"★",keys:["1917年9月孙中山在广州发动护法运动，旗帜是拥护《临时约法》、恢复国会。","失败主要原因是西南军阀的排挤和破坏，1918年5月孙中山被迫辞职。","1922年陈炯明叛乱导致第二次护法运动失败，孙中山认识到依靠军阀的道路走不通。"],err:"易把护法失败归于敌军强大，实为西南军阀排挤破坏。",hook:"口诀：护法两度，败于军阀。"},
  {t:"护法运动失败说明旧民主主义革命已走到尽头，资产阶级不能领导革命胜利。",lv:"▲",keys:["旧民主主义革命已经走到尽头。","中国民族资产阶级不能领导中国革命取得胜利。"],err:"误以为旧民主主义革命仍有前途，护法失败说明其已到尽头。",hook:"口诀：旧路已尽，新路待开。"},
  {t:"辛亥革命后中国陷入北洋军阀割据混战，同期民族资本主义获得发展。",lv:"◇",keys:["袁世凯死后北洋军阀分裂为直系、皖系、奉系三大派系，割据混战。","军阀割据和混战是辛亥革命后中国政治最突出的局面。","第一次世界大战期间列强暂时放松对华侵略，中国民族资本主义进一步发展。"],err:"易把军阀割据当作辛亥革命前的局面，实为辛亥革命之后。",hook:"口诀：直皖奉三系，割据又混战。"}
 ]},
 {h:"3.11 全章题目要点速记",pts:[
  {t:"从兴中会到同盟会，资产阶级革命派完成了从革命团体到政党的跃升。",lv:"★",keys:["1894年孙中山在檀香山创立兴中会，是第一个资产阶级革命团体。","1905年同盟会在东京成立，是第一个全国性资产阶级革命政党。","同盟会使全国性资产阶级民主革命有了统一的领导核心。"],err:"易混两个第一，革命团体是兴中会，全国性政党是同盟会。",hook:"对比：团体兴中会，政党同盟会。"},
  {t:"革命派与改良派的报刊阵地可按阵营快速定位。",lv:"◇",keys:["同盟会机关报《民报》于1905年11月在东京创刊。","改良派以《新民丛报》为阵地，代表人物是康有为、梁启超。","孙中山在《民报》发刊词中把纲领概括为三民主义。"],err:"易混《民报》与《新民丛报》，前者革命，后者改良。",hook:"对比：一报革命，一报保皇。"},
  {t:"武昌起义的发动力量与湖北军政府人事是常考细节。",lv:"◆",keys:["文学社和共进会在湖北新军中发展革命力量，为起义准备条件。","起义后成立湖北军政府，推举原清军协统黎元洪为都督。","到1911年底宣布脱离清政府独立的省份已有十几个。","许多独立省份都督由旧官僚和立宪派担任，反映革命妥协性。"],err:"易把黎元洪误记为革命党领袖，其原为清军协统。",hook:"口诀：文学共进举义，黎氏出任都督。"},
  {t:"辛亥革命的制度成果集中于临时政府与《中华民国临时约法》。",lv:"★",keys:["临时政府规定以五色旗为国旗，象征汉、满、蒙、回、藏五族共和。","《临时约法》为限制袁世凯专权，规定实行责任内阁制。","《临时约法》以法律形式肯定资产阶级民主共和制度，具有进步意义。"],err:"易漏记责任内阁制的目的，它是为限制袁世凯专权。",hook:"口诀：五色旗、责任内阁、共和入法。"},
  {t:"民国初年政治斗争可按时间顺序串成从宋案到护法运动的线索。",lv:"▲",keys:["1914年孙中山在东京成立中华革命党，坚持武装讨袁。","1915年护国运动迫使袁世凯于1916年3月取消帝制。","1917年7月张勋复辟仅十二天即败，段祺瑞拒不恢复《临时约法》。","1917年孙中山发动护法运动，因西南军阀排挤失败；1922年陈炯明叛乱致第二次护法失败。"],err:"易把护国运动与护法运动混为一谈，前者讨袁，后者护法。",hook:"对比：护国讨袁，护法护约法。"}
 ]}
]},
{ch:4,no:"第四章",title:"开天辟地的大事变",period:"中编 · 1919—1949",secs:[
 {h:"4.1 新文化运动的兴起",pts:[
  {t:"1915年陈独秀创办《青年杂志》，标志着新文化运动的兴起。",lv:"★",keys:["1915年9月陈独秀在上海创办《青年杂志》，后改名《新青年》。","1917年蔡元培任北京大学校长，聘陈独秀为文科学长，编辑部迁到北京。","《新青年》和北京大学成为新文化运动的主要阵地。"],err:"易混创办地点与迁址，创刊在上海，1917年后重心在北京。",hook:"口诀：一五上海创刊，一七北大扎根。"},
  {t:"新文化运动以民主与科学为基本口号，即德先生与赛先生。",lv:"★",keys:["提倡民主，反对专制；提倡科学，反对迷信盲从。","提倡新道德，反对旧道德；提倡新文学，反对旧文学。","斗争锋芒指向以孔子为代表的儒家传统道德，提出打倒孔家店。","前期并不提倡君主立宪，那是改良派的主张。"],err:"易把君主立宪当作新文化运动主张，实际并不提倡。",hook:"口诀：德先生赛先生，四提倡四反对。"},
  {t:"文学革命是新文化运动的重要一翼，白话文取代文言文成为趋势。",lv:"◇",keys:["1917年胡适发表《文学改良刍议》，主张以白话文取代文言文。","1918年鲁迅发表《狂人日记》，是新文学运动中第一篇白话小说。"],err:"易混两篇作品，主张文章是《文学改良刍议》，小说是《狂人日记》。",hook:"对比：胡适提主张，鲁迅写小说。"},
  {t:"新文化运动是伟大的思想解放运动，为马克思主义传播创造了有利条件。",lv:"▲",keys:["是伟大的思想解放运动，冲决了封建思想的束缚。","为马克思主义在中国的传播创造了有利条件。","前期没有马克思主义指导，未同群众运动结合，方法上有绝对化偏向。"],err:"误以为新文化运动一开始就以马克思主义为指导，前期并非如此。",hook:"口诀：先解放，后传马。"}
 ]},
 {h:"4.2 五四运动：中国新民主主义革命的开端",pts:[
  {t:"五四运动以1919年巴黎和会中国外交失败为直接导火线。",lv:"★",keys:["巴黎和会将德国在山东的权益转让给日本，中国外交失败。","1919年5月4日北京十几所学校学生3000余人齐集天安门前游行示威。","提出外争主权、内除国贼、废除二十一条、拒绝在和约上签字等口号。","要求惩办曹汝霖、章宗祥、陆宗舆等亲日派官僚。"],err:"易把导火线记为二十一条的提出，实为巴黎和会外交失败。",hook:"口诀：和会失败，五四爆发。"},
  {t:"六月三日以后运动中心由北京转到上海，主力由学生转为工人。",lv:"★",keys:["1919年6月5日上海工人罢工，工人阶级开始以独立姿态登上政治舞台。","上海出现工人罢工、学生罢课、商人罢市的三罢斗争。","青年学生最先奋起，起先锋作用；工人阶级在后期成为运动主力。"],err:"易把五四运动全程主力都记为学生，后期主力是工人。",hook:"对比：前期学生先锋，后期工人主力。"},
  {t:"五四运动具有彻底反帝反封建的革命性、进步性和广泛性。",lv:"◇",keys:["彻底反帝反封建的革命性。","追求救国强国真理的进步性。","各族各界群众积极参与的广泛性。","迫使北洋政府罢免卖国贼、释放被捕学生并拒签和约，但并未收回山东主权。"],err:"误以为五四运动收回山东主权，实际只是拒签和约。",hook:"口诀：三性记牢，主权未收。"},
  {t:"五四运动是中国新民主主义革命的开端。",lv:"★",keys:["促进了马克思主义在中国的传播及其与中国工人运动的结合。","标志着中国新民主主义革命的开端。","1919年毛泽东在长沙创办《湘江评论》，宣传反帝反封建的新思想。"],err:"易把五四运动说成旧民主主义革命高潮，它是新民主主义革命开端。",hook:"对比：五四之前旧民主，五四之后新民主。"}
 ]},
 {h:"4.3 马克思主义在中国的传播",pts:[
  {t:"1918年李大钊率先在中国举起马克思主义旗帜。",lv:"★",keys:["1918年李大钊发表《法俄革命之比较观》《庶民的胜利》《布尔什维主义的胜利》。","1919年李大钊发表《我的马克思主义观》，系统介绍唯物史观、政治经济学和科学社会主义。","李大钊、陈独秀成为传播马克思主义的中坚力量。"],err:"易混文章年份，1918年三文并举，1919年才是《我的马克思主义观》。",hook:"口诀：一八举旗，一九系统讲。"},
  {t:"五四运动后马克思主义传播成为新文化运动的主流。",lv:"★",keys:["各地纷纷出现研究、宣传马克思主义的社团和刊物。","1920年3月李大钊指导邓中夏等在北京大学成立马克思学说研究会。","1920年8月陈望道翻译的《共产党宣言》第一个中文全译本在上海出版。"],err:"易混《共产党宣言》首个中文全译本译者，是陈望道。",hook:"对比：社团兴起，译本问世。"},
  {t:"马克思主义者同三种错误思潮展开三次论战，扩大了马克思主义影响。",lv:"▲",keys:["论战对象是资产阶级改良主义、基尔特社会主义和无政府主义。","三次论战扩大了马克思主义的影响，促进了马克思主义传播。","为中国共产党的成立奠定了思想基础。"],err:"易漏记论战对象中的无政府主义，三战对象要记全。",hook:"口诀：改良、基尔特、无政府，三战三胜。"},
  {t:"中国早期马克思主义者由三类人物构成，信仰逐步确立。",lv:"◆",keys:["新文化运动的精神领袖李大钊、陈独秀。","五四运动中的左翼骨干毛泽东、蔡和森、周恩来等。","原同盟会会员董必武、吴玉章、林伯渠等。","毛泽东、蔡和森、邓中夏等先进青年逐步确立对马克思主义的信仰。"],err:"易把三类人物混为一类，需按来源分组记忆。",hook:"口诀：领袖、骨干、老同盟。"}
 ]},
 {h:"4.4 中国共产党早期组织的建立",pts:[
  {t:"1920年8月陈独秀在上海建立中国第一个共产党早期组织。",lv:"★",keys:["1920年8月，陈独秀等在上海成立中国第一个共产党早期组织，陈独秀任书记。","1920年11月上海共产党早期组织创办《共产党》月刊，宣传马克思主义和建党思想。","上海组织还创办《劳动界》等刊物，向工人宣传马克思主义。"],err:"易混两个第一，早期组织在上海，产业工会是上海机器工会。",hook:"口诀：零年八月，申城建党小组。"},
  {t:"1920年10月李大钊在北京成立共产党早期组织，北方宣传中心形成。",lv:"★",keys:["1920年10月李大钊在北京成立共产党早期组织。","北京成为北方宣传马克思主义的中心。","随后武汉、长沙、广州、济南及旅日、旅法的先进分子也相继建立早期组织。"],err:"易混两地时间，上海在8月，北京在10月。",hook:"对比：沪八月，京十月。"},
  {t:"各地早期组织深入工人群众，促进马克思主义与工人运动结合。",lv:"▲",keys:["创办工人夜校，组织工会，向工人群众宣传马克思主义。","1920年11月成立的上海机器工会，是早期组织领导下第一个产业工会。","1921年9月沈定一等在浙江萧山衙前村成立中国第一个农民协会。"],err:"易混两个第一，产业工会是上海机器工会，农民协会在衙前村。",hook:"口诀：工会机器，农会衙前。"},
  {t:"各地共产党早期组织的建立和活动，为成立全国统一的党准备了条件。",lv:"◇",keys:["早期组织在各地传播马克思主义，培养了一批骨干。","为正式成立全国统一的中国共产党准备了条件。"],err:"误以为中共一大前党的全国组织已经成立，此前只是早期组织。",hook:"口诀：先小组，后全党。"}
 ]},
 {h:"4.5 中共一大与中国共产党的诞生",pts:[
  {t:"1921年7月23日中共一大在上海召开，宣告中国共产党正式成立。",lv:"★",keys:["会议在上海法租界望志路106号举行，最后一天转移到浙江嘉兴南湖游船上。","转移的直接原因是会场遭到暗探注意和法国巡捕搜查。","出席代表13人，代表全国50多名党员，共产国际代表马林和尼科尔斯基列席。"],err:"易混人数，出席代表13人，代表全国50多名党员。",hook:"口诀：十三代表，五十党员，南湖收尾。"},
  {t:"中共一大确定党的名称，通过第一个纲领和第一个决议。",lv:"★",keys:["确定党的名称为中国共产党。","通过党的第一个纲领和第一个决议。","确定党成立后的中心任务是组织工人阶级、领导工人运动。","选举产生中央局作为中央领导机构，陈独秀为中央局书记。"],err:"易把中央局书记误记为李大钊，一大选出的是陈独秀。",hook:"口诀：定名、定纲、定任务、定书记。"},
  {t:"中国共产党成立是开天辟地的大事变，中国革命面貌焕然一新。",lv:"★",keys:["中国革命有了坚强的领导核心，工人阶级有了自己的司令部。","中国人民的斗争有了可信赖的组织者和领导者。","有了马克思列宁主义的科学指导思想，沟通了中国革命与世界革命的联系。","使中国革命有了新的前途，面目焕然一新。"],err:"易把焕然一新理解为革命任务改变，改变的是领导力量与指导思想。",hook:"口诀：核心、司令部、新思想、新前途。"},
  {t:"中共一大后成立中国劳动组合书记部，作为领导工人运动的公开机关。",lv:"◇",keys:["1921年8月，中国共产党在上海成立中国劳动组合书记部。","它是党领导工人运动的公开机关，推动工人运动开展。"],err:"易混时间，书记部在1921年8月成立，晚于中共一大。",hook:"对比：先建党，后设工人运动机关。"}
 ]},
 {h:"4.6 中共二大与民主革命纲领",pts:[
  {t:"1922年7月中共二大在上海召开，第一次明确提出反帝反封建纲领。",lv:"★",keys:["中共二大第一次明确提出了反帝反封建的民主革命纲领。","中共二大于1922年7月在上海举行。"],err:"易把民主革命纲领的提出归于中共一大，实为二大。",hook:"对比：一大建党，二大定纲领。"},
  {t:"中共二大区分最高纲领与最低纲领，最低纲领即民主革命纲领。",lv:"★",keys:["最高纲领是实现社会主义、共产主义。","最低纲领是打倒军阀、推翻国际帝国主义的压迫、统一中国为真正的民主共和国。"],err:"易把最高纲领与最低纲领互换，最高是社会主义、共产主义。",hook:"口诀：最高共产，最低反帝反军阀。"},
  {t:"中共二大提出组织民主的联合战线，联合一切革命党派。",lv:"◇",keys:["联合全国一切革命党派，联合资产阶级民主派。","组织民主的联合战线，扩大革命阵营。"],err:"易漏记联合战线主张，只记纲领而忘策略。",hook:"口诀：先联合，后合作。"}
 ]},
 {h:"4.7 第一次工人运动高潮",pts:[
  {t:"1922年1月香港海员大罢工是第一次工人运动高潮的起点。",lv:"★",keys:["1921年8月党在上海成立中国劳动组合书记部，领导工人运动。","1922年1月香港海员大罢工爆发，成为第一次工人运动高潮的起点。","1922年9月毛泽东、李立三、刘少奇等领导安源路矿工人大罢工，取得完全胜利。"],err:"易混起点时间，1922年1月香港海员罢工，不是9月安源罢工。",hook:"口诀：海员开局，安源全胜。"},
  {t:"1923年二七惨案后，第一次工人运动高潮转入低潮。",lv:"★",keys:["1923年2月7日京汉铁路工人举行总同盟罢工，遭吴佩孚血腥镇压，酿成二七惨案。","1923年2月京汉铁路总工会在郑州成立，随即遭吴佩孚破坏。","罢工失败后第一次工人运动高潮转入低潮。"],err:"易混镇压者，京汉铁路罢工被吴佩孚镇压，而非张作霖。",hook:"口诀：二七流血，高潮转低。"},
  {t:"第一次工人运动高潮的教训是工人阶级孤军奋战难以取胜。",lv:"◇",keys:["工人阶级单凭自身力量孤军奋战，不可能战胜强大的敌人。","必须联合其他革命力量，建立革命统一战线。"],err:"易把失败归因于罢工规模小，实为孤军奋战、缺乏同盟军。",hook:"口诀：孤军难胜，须结同盟。"}
 ]},
 {h:"4.8 第一次国共合作的形成",pts:[
  {t:"1923年中共三大决定共产党员以个人身份加入国民党，实现国共合作。",lv:"★",keys:["1923年6月中共三大在广州举行。","决定共产党员以个人身份加入国民党，实现国共合作。"],err:"易把合作正式形成时间记为1923年，实为1924年1月国民党一大。",hook:"对比：三大定方针，一大定形成。"},
  {t:"1924年1月国民党一大在广州召开，第一次国共合作正式形成。",lv:"★",keys:["国民党一大的召开标志着第一次国共合作的正式形成。","以国共合作为基础的革命统一战线正式建立。"],err:"易把国民党一大地点记为上海，实为广州。",hook:"口诀：一九二四，广州握手。"},
  {t:"1924年黄埔军校建立，实行政治教育与军事训练并重。",lv:"▲",keys:["蒋介石任校长，周恩来任政治部主任。","培养了大批军事政治人才。","把政治教育提到与军事训练同等重要的地位，这是与以往军校最显著的不同。"],err:"易混军校职务，校长是蒋介石，政治部主任是周恩来。",hook:"对比：校长蒋，主任周，军政并重。"},
  {t:"1925年中共四大明确提出无产阶级领导权和工农联盟问题。",lv:"◆",keys:["1925年1月中共四大在上海举行。","明确提出无产阶级在民主革命中的领导权问题。","提出工农联盟问题，为国民革命提供理论准备。"],err:"易把领导权问题的提出归于中共三大，实为四大。",hook:"口诀：三大管合作，四大管领导权。"},
  {t:"国民党右派接连制造中山舰事件与整理党务案，阴谋篡夺领导权。",lv:"◇",keys:["1926年3月蒋介石制造中山舰事件，打击共产党和国民党左派。","中山舰事件是国民党右派阴谋叛变革命的重要信号。","1926年5月蒋介石提出整理党务案，旨在限制共产党、篡夺国民党党权。"],err:"易混两事件时间，中山舰事件在3月，整理党务案在5月。",hook:"对比：三月中山舰，五月整理案。"}
 ]},
 {h:"4.9 新三民主义与国民革命高潮",pts:[
  {t:"国民党一大确立联俄、联共、扶助农工三大革命政策。",lv:"★",keys:["孙中山在国民党一大上重新解释三民主义，把旧三民主义发展为新三民主义。","三大革命政策是联俄、联共、扶助农工。"],err:"易漏记扶助农工，只记联俄、联共两项。",hook:"口诀：联俄联共，扶助农工。"},
  {t:"新三民主义的民族、民权、民生主张均有明确的新内容。",lv:"★",keys:["民族主义主张对外反对帝国主义，对内实行各民族一律平等。","民权主义主张普遍平等的民权。","民生主义提出平均地权和节制资本，并主张耕者有其田。"],err:"易把旧三民主义的民族主义等同于新三民主义，旧者未明确反帝。",hook:"对比：旧三民不反帝，新三民明反帝。"},
  {t:"新三民主义与中共民主革命纲领基本一致，成为国共合作的政治基础。",lv:"▲",keys:["新三民主义同中国共产党在民主革命阶段的纲领基本一致。","在若干基本原则方面基本一致，因而成为第一次国共合作的政治基础。"],err:"误以为二者完全相同，实为基本一致。",hook:"口诀：基本一致，不是完全同一。"},
  {t:"五卅运动掀起全国反帝怒潮，省港大罢工坚持十六个月。",lv:"◆",keys:["1925年5月30日上海发生五卅惨案，五卅运动爆发，形成全国规模的反帝怒潮。","1925年5月上海日商纱厂资本家枪杀工人顾正红，是五卅运动的直接导火线。","1925年6月省港大罢工爆发，坚持16个月，给帝国主义以沉重打击。","1927年1月汉口、九江人民收回英租界，是反帝斗争的重大胜利。"],err:"易混五卅惨案与五卅运动的关系，惨案是运动的起点。",hook:"口诀：顾正红殉难，省港十六月。"}
 ]},
 {h:"4.10 北伐战争与国民革命的失败",pts:[
  {t:"1926年7月国民革命军在广州誓师，北伐战争正式开始。",lv:"★",keys:["北伐战争的主要对象是吴佩孚、孙传芳、张作霖三派军阀。","冯玉祥不是北伐战争的主要对象。","随着北伐胜利进军，国民政府由广州迁往武汉。"],err:"易把冯玉祥误列为北伐对象，对象只有吴、孙、张。",hook:"口诀：吴孙张三家，北伐点名打。"},
  {t:"叶挺独立团在北伐中屡建战功，其所在的第四军被誉为铁军。",lv:"◇",keys:["叶挺独立团英勇善战、屡建战功。","其所在的第四军被誉为铁军。"],err:"易把铁军称号记在独立团本身，实为其所在的第四军。",hook:"对比：团是独立团，军是铁军。"},
  {t:"1927年蒋介石、汪精卫相继叛变革命，第一次国共合作全面破裂。",lv:"★",keys:["1927年4月12日蒋介石在上海发动四一二反革命政变，大肆捕杀共产党员和革命群众。","1927年7月15日汪精卫在武汉召开分共会议，正式同共产党决裂，即七一五反革命政变。","第一次国共合作全面破裂，国民革命失败。"],err:"易混两次政变地点，四一二在上海，七一五在武汉。",hook:"口诀：四一二上海，七一五武汉。"},
  {t:"国民革命失败的主观原因是陈独秀右倾机会主义错误放弃领导权。",lv:"★",keys:["客观原因是帝国主义和封建势力等反革命力量过于强大，蒋介石、汪精卫集团相继背叛。","主观原因是中共中央领导机关在大革命后期犯了以陈独秀为代表的右倾机会主义错误。","这一错误的核心是自动放弃革命领导权。"],err:"易把客观原因当作失败主要原因，主观原因才是关键。",hook:"对比：敌强是外因，弃权是内因。"},
  {t:"国民革命失败的教训是必须坚持无产阶级领导权和掌握革命武装。",lv:"▲",keys:["必须坚持无产阶级在民主革命中的领导权。","必须掌握革命的武装力量。","国民革命基本推翻了北洋军阀的统治，但并未完成反帝反封建的任务。"],err:"误以为国民革命已完成反帝反封建任务，实际只基本推翻北洋军阀。",hook:"口诀：两必须，领导权与武装。"}
 ]},
 {h:"4.11 全章题目要点速记",pts:[
  {t:"新文化运动的阵地、口号与锋芒可一网打尽。",lv:"★",keys:["1915年9月陈独秀在上海创办《青年杂志》，后改名《新青年》。","《新青年》和北京大学是新文化运动的主要阵地。","前期斗争锋芒指向儒家传统道德，提出打倒孔家店。","前期提倡民主与科学、新道德和新文学，并不提倡君主立宪。","五四运动以前的新文化运动没有马克思主义指导，未同群众运动相结合，方法上存在绝对化偏向。"],err:"易把君主立宪当作新文化运动主张，实为改良派主张。",hook:"对比：新文化反孔，改良派主立宪。"},
  {t:"五四运动中青年学生起先锋作用，工人阶级后期成为主力。",lv:"★",keys:["青年学生最先奋起反抗，起了先锋作用。","工人阶级在后期成为运动主力，上海出现三罢斗争。","运动迫使北洋政府罢免卖国贼、释放被捕学生并拒签和约，但并未收回山东主权。"],err:"易把成果夸大为收回山东主权，实际只是拒签和约。",hook:"对比：先锋学生，主力工人。"},
  {t:"中国共产党成立在十月革命后，未受社会改良主义影响。",lv:"◇",keys:["中国共产党成立在俄国十月革命胜利、第二国际修正主义破产之后。","接受的马克思列宁主义是完整的科学世界观。","没有受到社会改良主义的影响。"],err:"易说党成立受第二国际改良主义影响，实际未受影响。",hook:"口诀：十月革命后，二国际已破。"},
  {t:"中共早期组织的多个第一可按类别串联记忆。",lv:"◆",keys:["1920年8月陈独秀等在上海建立第一个共产党早期组织。","1920年3月李大钊指导邓中夏等在北京大学成立马克思学说研究会。","1920年11月上海机器工会是早期组织领导下的第一个产业工会。","1921年9月浙江萧山衙前村成立中国第一个农民协会。"],err:"易混两个第一，产业工会在上海，农民协会在衙前村。",hook:"口诀：小组沪、工会机器、农会衙前。"},
  {t:"国共合作与国民革命进程可按事件链记牢。",lv:"▲",keys:["1924年1月国民党一大标志第一次国共合作正式形成。","1926年3月中山舰事件与5月整理党务案是右派叛变的信号。","1927年四一二、七一五政变使第一次国共合作全面破裂。","国民革命基本推翻北洋军阀统治，但未完成反帝反封建任务。"],err:"易把中山舰事件与整理党务案的时间顺序记反。",hook:"口诀：合作成、右派动、政变裂。"}
 ]}
]},
{ch:5,no:"第五章",title:"中国革命的新道路",period:"中编 · 1919—1949",secs:[
 {h:"5.1 国民党在全国统治的建立",pts:[
  {t:"1927年四一二政变后，国民党建立代表大地主大资产阶级利益的军事独裁统治。",lv:"★",keys:["1927年4月12日，蒋介石在上海发动四一二反革命政变，捕杀共产党员和革命群众。","1927年4月18日，蒋介石在南京建立国民政府，同武汉国民政府相对立。","1927年9月，南京国民政府与武汉国民政府合并，史称「宁汉合流」。"],err:"误以为四一二后国民党已统一全国；此时宁汉两个政权仍对立。",hook:"四一二、宁汉合流、东北易帜，三步走。"},
  {t:"1928年2月国民党二届四中全会改组国民政府，蒋介石开始独揽党政军大权。",lv:"◇",keys:["1928年2月，国民党二届四中全会在南京召开并改组国民政府。","蒋介石任国民党中央政治会议主席和军事委员会主席。"],err:"易误记时间为1928年10月；二届四中全会在1928年2月。",hook:"二届四中掌党军，训政纲领定体制。"},
  {t:"1928年12月东北易帜，国民党在形式上统一了全国。",lv:"★",keys:["1928年6月，奉系军阀首领张作霖在沈阳皇姑屯被日本关东军炸死。","1928年12月29日，张学良通电宣布东北易帜，服从南京国民政府。","国民党只是形式上统一全国，并未真正控制各地。"],err:"误把东北易帜当作真正统一全国；仅是形式上统一。",hook:"皇姑屯在6月，易帜在12月29日。"},
  {t:"1928年10月《训政纲领》通过，确立国民党一党专政的政治体制。",lv:"▲",keys:["1928年10月，国民党中央常务委员会通过《训政纲领》。","会议确立国民党一党专政的体制，即所谓「训政」时期。","国民党政府实行一党专政的军事独裁统治，残酷镇压革命人民。"],err:"误以为「训政」是还政于民；实为国民党一党专政。",hook:"训政即国民党代行民权，一党专政。"},
  {t:"国民党统治确立后，中国半殖民地半封建的社会性质和主要矛盾都没有改变。",lv:"◆",keys:["官僚资本以蒋介石、宋子文、孔祥熙和陈果夫、陈立夫为代表。","官僚资本依靠国家政权，通过发行公债、增加捐税、垄断金融聚敛财富。","民族资本主义工业在帝国主义和官僚资本双重压迫下发展艰难、日益萎缩。"],err:"误以为国民党统治确立后社会性质改变；实际并未改变。",hook:"蒋宋孔陈四大家族，靠政权聚财。"}
 ]},
 {h:"5.2 中间党派及其政治主张",pts:[
  {t:"大革命失败后，代表民族资产阶级和上层小资产阶级利益的中间党派相继成立。",lv:"★",keys:["主要有中国国民党临时行动委员会、中国民权保障同盟等。","主张改良主义，幻想在国共两党之间走「第三条道路」。","其抗日民主活动为以后民主党派同中共合作奠定了一定基础。"],err:"误以为中间党派拥护中共革命；它既不赞成，也与蒋介石集团有矛盾。",hook:"两头不靠，走第三条道路。"},
  {t:"1930年8月，邓演达等在上海成立中国国民党临时行动委员会，又称第三党。",lv:"▲",keys:["1930年8月由邓演达等在上海发起成立。","因居于国共两党之外，又称「第三党」。","主张推翻蒋介石统治、进行「平民革命」。"],err:"误把「第三党」当作中国民主同盟；它指中国国民党临时行动委员会。",hook:"1930、邓演达、上海、第三党。"},
  {t:"1932年12月，宋庆龄、蔡元培等在上海发起成立中国民权保障同盟。",lv:"◇",keys:["宋庆龄任主席，蔡元培等参与发起。","主要开展营救政治犯、争取民主权利的活动。"],err:"误以为它是全国性政党；它是营救政治犯、争取民主权利的组织。",hook:"1932、宋庆龄加蔡元培、救政治犯。"},
  {t:"1925年12月中国青年党成立，主张国家主义、反对共产主义。",lv:"◇",keys:["1925年12月成立，以「求中华民族之解放」为宗旨。","主张国家主义，反对共产主义。"],err:"误把中国青年党当作抗战时期的民主党派；它成立于1925年12月。",hook:"青年党：国家主义，反共。"}
 ]},
 {h:"5.3 南昌起义与八七会议",pts:[
  {t:"1927年8月1日，周恩来、贺龙、叶挺、朱德、刘伯承等领导南昌起义。",lv:"★",keys:["起义部队为中共掌握和影响的国民革命军2万余人。","起义打响了武装反抗国民党反动统治的第一枪。"],err:"误把南昌起义当作秋收起义；两者相差一个月。",hook:"八一南昌起义，第一枪。"},
  {t:"南昌起义是中共独立领导革命战争、创建人民军队和武装夺取政权的开端。",lv:"★",keys:["是中国共产党独立领导革命战争的开端。","是中国共产党创建人民军队的开端。","是武装夺取政权的开端。"],err:"误以为南昌起义已开辟农村根据地；根据地创建始于井冈山。",hook:"三个开端：独立领导、建军队、夺政权。"},
  {t:"1927年8月7日，中共中央在汉口秘密召开八七会议，确定土地革命和武装反抗的总方针。",lv:"★",keys:["会议确定实行土地革命和武装反抗国民党反动统治的总方针。","把发动农民举行秋收起义作为当前最主要的任务。","选出以瞿秋白为首的新的中央临时政治局。"],err:"误把会议地点记为武昌；八七会议在汉口秘密召开。",hook:"八七汉口：土地革命加武装反抗，当前任务是秋收起义。"},
  {t:"毛泽东在八七会议上提出「须知政权是由枪杆子中取得的」著名论断。",lv:"◆",keys:["这一论断出自八七会议，不是遵义会议。","它强调武装斗争对于夺取政权的决定作用。"],err:"误把这句话当作遵义会议提出；实为1927年八七会议。",hook:"八七会议，毛泽东要「枪杆子」。"},
  {t:"1927年12月11日，张太雷、叶挺、叶剑英等领导发动广州起义。",lv:"◇",keys:["起义军曾一度占领广州大部分地区。","它是大革命失败后党领导的又一次武装起义。"],err:"误把广州起义与南昌起义混同；广州起义在1927年12月。",hook:"南昌8月、广州12月，同年两次起义。"}
 ]},
 {h:"5.4 秋收起义与三湾改编",pts:[
  {t:"1927年9月9日，毛泽东领导的湘赣边界秋收起义爆发，公开打出工农革命军旗帜。",lv:"★",keys:["起义公开打出「工农革命军」的旗帜，不再沿用国民革命军番号。","受挫后毛泽东在文家市主持前委会议，决定放弃攻打长沙。","部队转向敌人统治力量薄弱的农村进军。"],err:"误以为起义一开始就打红军旗号；当时称「工农革命军」。",hook:"9月9日、湘赣边、工农革命军。"},
  {t:"1927年9月29日，毛泽东在江西永新三湾村对部队进行三湾改编。",lv:"★",keys:["将党的支部建在连上，从组织上确立党对军队的绝对领导。","在部队中实行民主制度，连以上建立士兵委员会。","官兵平等，废除旧军队的雇佣关系和打骂制度。"],err:"误以为支部建在营上；三湾改编是支部建在连上。",hook:"支部建在连上，士兵委员会管民主。"},
  {t:"三湾改编是建设共产党领导的新型人民军队的重要开端。",lv:"◆",keys:["改编从组织上解决了党对军队的领导问题。","为后来新型人民军队的建设提供了经验。"],err:"误把「思想建党、政治建军」当作三湾改编内容；那是古田会议。",hook:"三湾开头，古田定型。"}
 ]},
 {h:"5.5 井冈山革命根据地的创建",pts:[
  {t:"1927年10月，毛泽东率秋收起义部队到达井冈山，创建第一个农村革命根据地。",lv:"★",keys:["井冈山根据地位于湖南、江西交界的罗霄山脉中段。","它是中国共产党创建的第一个农村革命根据地。"],err:"误以为井冈山根据地建立于1928年；实为1927年10月。",hook:"1927年10月、罗霄山中段、第一个农村根据地。"},
  {t:"1928年4月朱毛会师，合编为工农革命军第四军，后改称工农红军第四军。",lv:"▲",keys:["朱德、陈毅率南昌起义余部和湘南农军到达井冈山。","朱德任军长，毛泽东任党代表。"],err:"误以为会师后成立红一方面军；当时合编为红四军。",hook:"1928年4月朱毛会师，红四军。"},
  {t:"1928年12月，彭德怀、滕代远率红五军到达井冈山，与红四军会师。",lv:"◇",keys:["红五军由彭德怀、滕代远率领。","会师进一步增强了井冈山的革命力量。"],err:"误把彭德怀部队当作红四军；它是红五军。",hook:"朱德红四军，彭德怀红五军。"},
  {t:"毛泽东在井冈山撰写两篇著作，论述红色政权存在和发展的原因与条件。",lv:"▲",keys:["1928年10月、11月先后写成《中国的红色政权为什么能够存在？》《井冈山的斗争》。","著作论述了红色政权存在和发展的原因与条件。","「工农武装割据」是武装斗争、土地革命、农村根据地三者的结合。","武装斗争为主要形式，土地革命为中心内容，农村根据地为战略阵地。"],err:"误把「工农武装割据」只等同于武装斗争；三者缺一不可。",hook:"武装斗争为形，土地革命为心，根据地为地。"},
  {t:"红色政权能够存在和发展的根本原因，是中国经济政治发展极不平衡、军阀割据混战。",lv:"★",keys:["中国是帝国主义间接统治的半殖民地国家，经济政治发展极不平衡。","主观条件是全国革命形势继续发展、有相当力量红军、党组织有力量和政策正确。"],err:"误把「有相当力量红军」当作根本原因；那只是主观条件。",hook:"根本看国情，主观看红军与党。"},
  {t:"井冈山根据地的创建点燃了「工农武装割据」的星星之火，代表中国革命的正确方向。",lv:"▲",keys:["为开辟农村包围城市的革命道路提供了宝贵经验。","从实践上开辟了敌我力量悬殊下深入农村、保存发展革命力量的道路。","代表了大革命失败后中国革命发展的正确方向。"],err:"误以为井冈山道路只是军事退却；它代表中国革命正确方向。",hook:"星星之火，走向农村包围城市。"}
 ]},
 {h:"5.6 农村包围城市、武装夺取政权道路的开辟",pts:[
  {t:"1930年1月毛泽东发表《星星之火，可以燎原》，实际上提出以农村为中心的思想。",lv:"★",keys:["文章批评了「红旗到底打得多久」的悲观情绪。","实际上提出了以农村为中心的思想。"],err:"误以为该文仍坚持城市中心论；它转向以农村为中心。",hook:"1930年1月星星之火，农村中心。"},
  {t:"1930年5月毛泽东撰写《反对本本主义》，提出「没有调查，没有发言权」。",lv:"▲",keys:["初步阐述了实事求是、群众路线、独立自主的思想。","强调从实际出发，反对照搬书本。"],err:"误把这句话当作《实践论》观点；出自《反对本本主义》。",hook:"反对本本主义：先调查，再发言。"},
  {t:"红军在井冈山斗争和反「围剿」中形成游击战争十六字诀，队伍不断壮大。",lv:"▲",keys:["十六字诀为：敌进我退、敌驻我扰、敌疲我打、敌退我追。","到1930年，全国红军发展到约7万人。","先后建立大小十几块农村革命根据地。"],err:"误把十六字诀顺序颠倒；「敌进我退」在最前。",hook:"敌进我退、敌驻我扰、敌疲我打、敌退我追。"},
  {t:"红军在井冈山斗争中形成严格纪律和三位一体的任务，古田会议确立建军原则。",lv:"▲",keys:["1928年春毛泽东制定「三大纪律」：行动听指挥、不拿工人农民一点东西、打土豪要归公。","红军是战斗队又是工作队、生产队。","担负打仗消灭敌人、打土豪筹款子、做群众工作三大任务。","1929年12月古田会议确立思想建党、政治建军的原则。"],err:"误以为红军只打仗；它同时是工作队、生产队。",hook:"战斗队、工作队、生产队。"},
  {t:"1929年1月起红军开辟赣南闽西根据地，后发展为中央革命根据地。",lv:"◆",keys:["1929年1月，毛泽东、朱德率红四军主力进军赣南、闽西。","中央革命根据地是土地革命战争时期面积最大、人口最多的根据地。"],err:"误把井冈山当作面积最大的根据地；最大的是中央根据地。",hook:"井冈山是第一个，中央根据地是最大的。"},
  {t:"农村包围城市、武装夺取政权道路的开辟，是马克思主义基本原理同中国实际相结合的伟大创造。",lv:"★",keys:["中国是半殖民地半封建国家，敌人在城市力量强大，革命力量难以立足。","广大农村是敌人统治的薄弱环节，农民是中国革命的主力军。","农村自然经济为坚持革命提供了物质条件。","走农村包围城市道路是历史必然，最终夺取全国政权。"],err:"误以为照搬俄国城市起义经验；中国走的是农村包围城市。",hook:"俄国先城市，中国先农村。"}
 ]},
 {h:"5.7 土地革命与土地革命路线",pts:[
  {t:"1928年12月，毛泽东在井冈山主持制定《井冈山土地法》，是党历史上第一个土地法。",lv:"★",keys:["《井冈山土地法》在井冈山主持制定。","它是中国共产党历史上第一个土地法。"],err:"误把《兴国土地法》当作第一部；第一部是《井冈山土地法》。",hook:"1928年12月井冈山，第一部土地法。"},
  {t:"1929年4月《兴国土地法》将「没收一切土地」改为「没收一切公共土地及地主阶级的土地」。",lv:"▲",keys:["由毛泽东在兴国县主持制定。","缩小了没收范围，保护了中农利益。"],err:"误以为两法规定相同；兴国土地法缩小没收范围。",hook:"一切土地，改为公共加地主土地。"},
  {t:"到1931年，党在实践中形成了一条正确的土地革命路线。",lv:"★",keys:["依靠贫农、雇农，联合中农，限制富农。","保护中小工商业者，消灭地主阶级。","变封建半封建的土地所有制为农民的土地所有制。"],err:"误记为「消灭富农」；路线是限制富农。",hook:"依靠贫雇、联合中农、限制富农、消灭地主。"},
  {t:"1931年11月，中华苏维埃第一次全国代表大会在瑞金召开，成立临时中央政府。",lv:"▲",keys:["大会宣告中华苏维埃共和国临时中央政府成立，毛泽东任主席。","临时中央政府是党领导的工农民主专政政权，实行工农兵代表大会制度。"],err:"误把临时中央政府成立时间记作1930年；实为1931年11月。",hook:"1931年11月、瑞金、毛泽东任主席。"},
  {t:"土地革命的深入开展，使农民在政治上翻身、经济上分得土地。",lv:"◇",keys:["农民踊跃参军参战，支援红军和根据地建设。","土地革命成为发动农民、巩固根据地的中心环节。"],err:"误以为土地革命只解决经济问题；它同时是政治动员。",hook:"分得田地，踊跃参军参战。"}
 ]},
 {h:"5.8 「左」倾错误的危害",pts:[
  {t:"土地革命战争时期党内先后三次出现「左」倾错误，危害最大的是王明教条主义。",lv:"★",keys:["三次错误依次为瞿秋白盲动、李立三冒险、王明教条主义。","王明「左」倾教条主义错误危害最大。"],err:"误以为危害最大的是李立三冒险错误；实为王明教条主义。",hook:"瞿、李、王，一次比一次「左」。"},
  {t:"1927年11月至1928年4月，以瞿秋白为代表的「左」倾盲动错误在党内出现。",lv:"◇",keys:["这是三次「左」倾错误中的第一次。","时间仅半年，随后得到纠正。"],err:"误把时间记为1928年至1929年；实为1927年11月至1928年4月。",hook:"第一次：瞿秋白，1927年11月。"},
  {t:"1930年6月至9月，以李立三为代表的「左」倾冒险错误在党内占统治地位。",lv:"▲",keys:["主张集中力量进攻中心城市。","1930年5月中原大战爆发，蒋介石与阎锡山、冯玉祥、李宗仁等混战。"],err:"误以为李立三主张农村包围城市；他坚持进攻中心城市。",hook:"李立三：1930年，打中心城市。"},
  {t:"1931年1月至1935年1月，以王明为代表的「左」倾教条主义错误统治全党。",lv:"★",keys:["在革命道路上坚持城市中心论，照搬共产国际指示和苏联经验。","在组织上实行宗派主义、惩办主义。","推行「地主不分田、富农分坏田」等过左土地政策，扩大打击面。"],err:"误以为王明错误只影响白区；根据地和红军损失百分之九十。",hook:"王明三照搬：道路、组织、军事。"},
  {t:"王明「左」倾错误使根据地和红军损失惨重，直接导致红军被迫长征。",lv:"★",keys:["革命根据地和红军损失百分之九十，党在白区力量几乎损失百分之百。","第五次反「围剿」失败，1934年10月中央红军被迫战略转移。","军事上先是冒险进攻、后又消极防御，博古、李德负有责任。"],err:"误把第五次反围剿失败归因于敌强我弱；主因是「左」倾指挥错误。",hook:"九成、全部，被迫长征。"}
 ]},
 {h:"5.9 遵义会议：生死攸关的转折点",pts:[
  {t:"1934年10月，中央红军8万多人从江西瑞金、于都等地出发，开始长征。",lv:"◇",keys:["出发地点为江西瑞金、于都等地。","中央红军八万余人，开始举世闻名的长征。"],err:"误把长征出发时间记为1935年；实为1934年10月。",hook:"1934年10月，八万人，于都出发。"},
  {t:"1935年1月15日至17日，中共中央政治局在贵州遵义召开扩大会议。",lv:"★",keys:["会议即遵义会议，集中解决军事问题和组织问题。","批评博古、李德在军事指挥上的错误。"],err:"误以为遵义会议解决了政治路线问题；只解决军事和组织问题。",hook:"遵义只解决军事和组织，不解决政治路线。"},
  {t:"遵义会议在危急关头挽救了党、红军和中国革命，是生死攸关的转折点。",lv:"★",keys:["实际上确立了毛泽东在党中央和红军的领导地位。","是党的历史上一个生死攸关的转折点。","第一次独立自主地运用马列主义基本原理解决自己的路线、方针和政策问题。","标志着中国共产党在政治上开始走向成熟。"],err:"误以为遵义会议确立毛泽东思想为指导思想；那是中共七大。",hook:"转折点遵义，指导思想七大。"},
  {t:"遵义会议后调整中央领导，张闻天负总责，成立三人军事指挥小组。",lv:"◆",keys:["张闻天代替博古在中共中央负总责。","成立毛泽东、周恩来、王稼祥三人军事指挥小组。","三人小组负责全军的军事指挥。"],err:"误以为毛泽东会后即任党中央总书记；负总责的是张闻天。",hook:"张闻天负总责，三人小组管军事。"},
  {t:"遵义会议后红军四渡赤水、巧渡金沙江、飞夺泸定桥，摆脱追堵。",lv:"◇",keys:["1935年5月四渡赤水，声东击西打乱敌人追剿计划。","巧渡金沙江，跳出数十万敌军的围追堵截。","强渡大渡河后昼夜兼程二百四十里飞夺泸定桥。","1935年6月翻越长征途中第一座大雪山夹金山。"],err:"误把四渡赤水当作金沙江之后的行动；四渡赤水在前。",hook:"四渡赤水、巧渡金沙、飞夺泸定、翻越夹金山。"}
 ]},
 {h:"5.10 红军长征的胜利与长征精神",pts:[
  {t:"1935年6月中央红军与红四方面军懋功会师后，中央确定北上方针。",lv:"◆",keys:["两军会师于四川懋功（今小金）地区。","中共中央召开两河口会议确定北上方针。","同张国焘的分裂主义进行了坚决斗争。","1935年9月攻克腊子口，打通北上道路。"],err:"误以为两河口会议确定南下方针；确定的是北上。",hook:"懋功会师、两河口定北上、腊子口。"},
  {t:"1936年10月红军三大主力会师，长征胜利结束。",lv:"★",keys:["1936年7月红二、六军团与红四方面军在甘孜会师，合编为红二方面军。","1935年10月中央红军到达陕北吴起镇，同红十五军团会师。","红二、红四方面军在甘肃会宁、静宁将台堡同红一方面军会师。"],err:"误把1935年10月当作长征完全胜利；全面胜利在1936年10月。",hook:"1935到陕北，1936才胜利。"},
  {t:"长征的胜利宣告国民党消灭党和红军的图谋彻底失败，实现革命事业从挫折走向胜利的转折。",lv:"★",keys:["使中国革命转危为安，实现从挫折走向胜利的伟大转折。","把中国革命的大本营放到西北，为迎接抗日救亡新高潮准备条件。","保存并锤炼了中国革命的骨干力量，沿途播撒革命火种。"],err:"误以为长征只是被动退却；它使中国革命转危为安。",hook:"转危为安、大本营西北、播撒火种。"},
  {t:"长征精神以坚定理想信念、不怕牺牲、独立自主、顾全大局、依靠群众为主要内容。",lv:"★",keys:["把全国人民和中华民族根本利益看得高于一切，坚定理想信念。","为救国救民不怕艰难险阻、不惜付出一切牺牲。","坚持独立自主、实事求是，顾全大局、严守纪律、紧密团结。","紧紧依靠人民群众，同群众生死相依、患难与共、艰苦奋斗。","贪图安逸、追求享乐与长征精神格格不入。"],err:"误以为长征精神只是吃苦耐劳；它首先是理想信念的胜利。",hook:"理想、牺牲、求实、团结、为民。"},
  {t:"中央红军长征历时一年，行程约二万五千里，纵横十余省。",lv:"▲",keys:["长征的胜利表明中国共产党及其领导的人民军队是不可战胜的。","伟大的长征精神是激励中国人民不断前进的精神力量。","长征粉碎了国民党「围剿」红军、扼杀中国革命的企图。"],err:"误把二万五千里当作所有红军部队的行程；主要指中央红军。",hook:"一年、二万五千里、十余省。"}
 ]},
 {h:"5.11 全章题目要点速记",pts:[
  {t:"1927年至1936年，党从国民革命失败走向长征胜利，开辟革命新道路。",lv:"★",keys:["1927年四一二、七一五政变后国民革命失败。","1927年党领导南昌起义、八七会议、秋收起义、广州起义。","1935年1月遵义会议实现生死攸关的转折。","1936年10月红军长征胜利结束。"],err:"误把1935年10月吴起镇会师当作长征终点；终点在1936年10月。",hook:"1927年起兵、1935年转折、1936年收尾。"},
  {t:"八七会议定总方针，古田会议定建军原则，遵义会议定中央领导。",lv:"◆",keys:["八七会议确定土地革命和武装反抗国民党反动统治的总方针。","古田会议确立思想建党、政治建军的原则。","遵义会议实际确立毛泽东在党中央和红军的领导地位。"],err:"误把「思想建党、政治建军」当作遵义会议内容；那是古田会议。",hook:"八七定方向，古田定建军，遵义定领导。"},
  {t:"本章多个「第一」：第一个农村根据地、第一个土地法、第一次独立自主解决路线。",lv:"◇",keys:["井冈山是第一个农村革命根据地。","《井冈山土地法》是党历史上第一个土地法。","南昌起义打响武装反抗国民党反动统治的第一枪。"],err:"误把《兴国土地法》当作第一部土地法；第一部是《井冈山土地法》。",hook:"井冈山：第一个根据地加第一个土地法。"}
 ]}
]},
{ch:6,no:"第六章",title:"中华民族的抗日战争",period:"中编 · 1919—1949",secs:[
 {h:"6.1 日本发动侵华战争与局部抗战",pts:[
  {t:"1931年9月18日，日本关东军制造九一八事变，中国人民局部抗战由此开始。",lv:"★",keys:["1931年9月18日夜，日本关东军炸毁柳条湖附近南满铁路路轨，反诬中国军队所为。","炮轰东北军驻地北大营，武装侵占中国东北。","中国人民的局部抗战由此开始。"],err:"误把九一八当作全面抗战起点；全面抗战始于1937年七七事变。",hook:"1931年九一八，局部抗战起点。"},
  {t:"九一八事变后中共发表宣言号召抗日，日本扶植溥仪建立伪满洲国。",lv:"▲",keys:["九一八后第三天，中共中央发表《中国共产党为日本帝国主义强暴占领东三省事件宣言》。","宣言号召全国人民奋起抗日。","1932年3月，日本扶植溥仪在长春建立伪「满洲国」，实行殖民统治。"],err:"误以为伪满洲国建于沈阳；设于长春。",hook:"1932年3月，长春、溥仪、伪满洲国。"},
  {t:"1932年一·二八事变爆发淞沪抗战，1933年又爆发长城抗战。",lv:"◇",keys:["1932年1月28日日军进攻上海，国民党第十九路军奋起抵抗。","此次抵抗史称淞沪抗战。","1933年日军进犯长城一线，中国守军奋起抵抗，爆发长城抗战。"],err:"误把一·二八淞沪抗战与1937年八一三淞沪会战混同。",hook:"1932年一·二八，1937年八一三。"},
  {t:"1935年华北事变后，中日民族矛盾上升为主要矛盾。",lv:"★",keys:["日本通过《何梅协定》迫使国民党中央势力退出华北，制造华北事变。","中国在河北、察哈尔两省的主权大部丧失。","日本策动华北五省「自治运动」，扶植殷汝耕成立「冀东防共自治政府」。","中日民族矛盾上升为主要矛盾。"],err:"误以为华北事变后主要矛盾仍是阶级矛盾；民族矛盾已上升。",hook:"何梅协定、华北自治、矛盾上升。"},
  {t:"1935年12月9日北平学生发起一二·九运动，掀起抗日救亡运动新高潮。",lv:"▲",keys:["提出「反对华北自治」「打倒日本帝国主义」「停止内战，一致对外」等口号。","掀起全国抗日救亡运动的新高潮。","1936年2月北平学生在中共领导下成立中华民族解放先锋队。"],err:"误把「和平、民主、团结」当作一二·九口号；那是1945年提出的。",hook:"一二·九：反自治、打日本、一致对外。"},
  {t:"东北抗联坚持游击战争，冯玉祥组建察哈尔抗日同盟军，十九路军发动福建事变。",lv:"◇",keys:["东北抗日联军在极端艰苦条件下坚持游击战争，杨靖宇、赵尚志是杰出代表。","1933年5月冯玉祥在张家口成立察哈尔抗日同盟军。","1933年11月蔡廷锴、蒋光鼐在福建发动抗日反蒋的「福建事变」。"],err:"误以为察哈尔抗日同盟军由中共组建；由冯玉祥在张家口成立。",hook:"东北抗联、察哈尔同盟军、福建事变。"}
 ]},
 {h:"6.2 瓦窑堡会议与西安事变",pts:[
  {t:"1935年8月，中共驻共产国际代表团发表《八一宣言》，呼吁停止内战、一致抗日。",lv:"◇",keys:["文件全称《为抗日救国告全体同胞书》，通称八一宣言。","宣言呼吁停止内战、一致抗日。"],err:"误以为八一宣言由中共中央在瓦窑堡发表；发表者是驻共产国际代表团。",hook:"1935年8月八一宣言：停内战、一致抗日。"},
  {t:"1935年12月瓦窑堡会议确定建立抗日民族统一战线的方针。",lv:"★",keys:["会议在陕北瓦窑堡召开，为政治局扩大会议。","批判党内「左」倾关门主义，制定统一战线的策略总方针。","会后毛泽东作《论反对日本帝国主义的策略》报告，系统阐明策略。"],err:"误以为瓦窑堡会议确定「逼蒋抗日」；它确定统一战线方针。",hook:"1935年12月瓦窑堡，统一战线方针。"},
  {t:"1936年5月5日，中共发表《停战议和一致抗日通电》，改反蒋抗日为逼蒋抗日。",lv:"▲",keys:["通电全称《停战议和一致抗日通电》。","方针由「反蒋抗日」改为「逼蒋抗日」。"],err:"误以为中共始终主张反蒋抗日；1936年5月改为逼蒋抗日。",hook:"反蒋改逼蒋，1936年5月。"},
  {t:"1936年12月12日，张学良、杨虎城在西安扣留蒋介石，发动西安事变。",lv:"★",keys:["事变的目的是逼蒋抗日。","中共从全民族利益出发，确定和平解决方针。","派周恩来等到西安参加谈判。"],err:"误以为中共主张杀蒋；中共确定和平解决方针。",hook:"双十二，张杨扣蒋，和平解决。"},
  {t:"西安事变和平解决成为时局转换的枢纽，抗日民族统一战线初步形成。",lv:"★",keys:["西安事变的和平解决成为时局转换的枢纽。","标志着十年内战基本结束、抗日民族统一战线初步形成。","1937年2月国民党五届三中全会实际承认共产党的合法地位。"],err:"误以为西安事变和平解决即统一战线正式形成；正式形成在1937年9月。",hook:"初步形成1936年12月，正式形成1937年9月。"}
 ]},
 {h:"6.3 七七事变与全民族抗战的爆发",pts:[
  {t:"1937年7月7日卢沟桥事变爆发，全国性抗战由此开始。",lv:"★",keys:["日军以一名士兵在演习中失踪为借口，要求进入宛平城搜查遭拒。","炮轰宛平城和卢沟桥，制造七七事变（卢沟桥事变）。","标志日本全面侵华战争开始，中国进入全民族抗战新阶段。"],err:"误把七七事变当作局部抗战起点；局部抗战始于1931年九一八。",hook:"1937年7月7日卢沟桥，全面抗战起点。"},
  {t:"1937年8月13日，日军大举进攻上海制造八一三事变，淞沪会战爆发。",lv:"▲",keys:["1937年8月13日，日军大举进攻上海，制造八一三事变。","淞沪会战随即爆发，成为抗战初期规模最大的战役。"],err:"误把八一三事变与1932年一·二八事变混同。",hook:"8月13日攻上海，八一三。"},
  {t:"1937年8月红军主力改编为八路军，10月南方红军和游击队改编为新四军。",lv:"★",keys:["八路军由红军主力改编，朱德任总指挥、彭德怀任副总指挥。","1937年10月，南方八省红军和游击队改编为国民革命军新编第四军。","新四军由叶挺任军长。"],err:"误把新四军改编时间记为1937年8月；实为1937年10月。",hook:"8月八路军朱德，10月新四军叶挺。"},
  {t:"1937年9月国共合作宣言和蒋介石谈话发表，抗日民族统一战线正式形成。",lv:"★",keys:["9月22日国民党中央通讯社发表《中共中央为公布国共合作宣言》。","23日蒋介石发表承认中共合法地位的谈话。","标志以国共两党合作为基础的抗日民族统一战线正式形成。"],err:"误把西安事变和平解决当作正式形成；正式形成在1937年9月。",hook:"9月22日宣言，9月23日谈话，正式形成。"}
 ]},
 {h:"6.4 国民党的正面战场",pts:[
  {t:"1937年8月至11月淞沪会战，是抗战初期规模最大的一次战役。",lv:"★",keys:["粉碎了日军「三个月灭亡中国」的狂妄计划。","谢晋元率「八百壮士」孤军据守四行仓库，被誉为抗战英雄。"],err:"误把淞沪会战当作战略防御阶段规模最大；那是武汉会战。",hook:"淞沪破三月神话，八百壮士守四行。"},
  {t:"1937年9月至11月忻口会战，是华北战场上规模最大的一次战役。",lv:"◇",keys:["国共两党军队密切配合作战。","国民党第九军军长郝梦龄亲临前线指挥，壮烈殉国。"],err:"误以为忻口会战只是国民党军队作战；国共两党军队配合。",hook:"忻口：华北最大，国共配合。"},
  {t:"1938年3月，李宗仁指挥台儿庄战役，取得全面抗战后正面战场第一次重大胜利。",lv:"★",keys:["第五战区司令长官李宗仁指挥作战。","歼灭日军一万余人，取得台儿庄大捷。","是全面抗战爆发后中国军队在正面战场取得的第一次重大胜利。"],err:"误把台儿庄大捷当作全国抗战第一次大胜利；第一次是平型关。",hook:"1938年3月李宗仁，台儿庄，歼敌万余。"},
