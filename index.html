{id:"c9q29",ch:9,t:"s",q:"毛泽东在《论十大关系》中论述的关系共有",o:["八个","九个","十个","十一个"],a:"C",x:"《论十大关系》论述了重工业和轻工业、农业等十个方面的关系。",p:["《论十大关系》"]},
{id:"c9q30",ch:9,t:"s",q:"中共八大召开的时间是",o:["1955年9月","1956年9月","1957年9月","1958年9月"],a:"B",x:"中共八大于1956年9月在北京召开，正确分析了国内主要矛盾的变化。",p:["中共八大"]},
{id:"c9q31",ch:9,t:"s",q:"中共八大确定的经济建设方针是",o:["既反保守又反冒进，在综合平衡中稳步前进","多快好省地建设社会主义","以钢为纲，全面跃进","调整、巩固、充实、提高"],a:"A",x:"八大坚持既反保守又反冒进、在综合平衡中稳步前进的经济建设方针。",p:["中共八大"]},

{id:"c9q34",ch:9,t:"s",q:"中共八大指出，社会主义改造基本完成后，国内的阶级斗争",o:["仍然是我国社会的主要矛盾","已经不是我国社会的主要矛盾","已经彻底消失","变得更加尖锐"],a:"B",x:"八大指出国内主要矛盾已不再是工人阶级同资产阶级的矛盾。",p:["中共八大"]},
{id:"c9q35",ch:9,t:"s",q:"毛泽东发表《关于正确处理人民内部矛盾的问题》是在",o:["1956年2月","1957年2月","1958年2月","1959年2月"],a:"B",x:"1957年2月毛泽东在最高国务会议上发表讲话，系统阐述正确处理人民内部矛盾问题。",p:["人民内部矛盾"]},
{id:"c9q36",ch:9,t:"s",q:"毛泽东指出，解决敌我矛盾的方法是",o:["专政的方法","民主的、说服教育的方法","团结—批评—团结","经济调节的方法"],a:"A",x:"敌我矛盾用专政的方法解决，人民内部矛盾则用民主的、说服教育的方法解决。",p:["人民内部矛盾"]},
{id:"c9q37",ch:9,t:"s",q:"毛泽东指出，社会主义社会的基本矛盾仍然是",o:["生产关系和生产力、上层建筑和经济基础之间的矛盾","资产阶级和无产阶级的矛盾","人民内部的矛盾","先进生产关系和落后生产力之间的矛盾"],a:"A",x:"毛泽东提出社会主义社会基本矛盾仍然是生产关系和生产力、上层建筑和经济基础的矛盾。",p:["人民内部矛盾"]},
{id:"c9q38",ch:9,t:"s",q:"毛泽东提出的解决人民内部矛盾的正确方法是",o:["专政的方法","团结—批评—团结","残酷斗争、无情打击","压制不同意见"],a:"B",x:"解决人民内部矛盾采取团结—批评—团结的公式，从团结愿望出发，经批评达到新团结。",p:["人民内部矛盾"]},
{id:"c9q39",ch:9,t:"s",q:"1957年整风运动反对的错误倾向是",o:["官僚主义、宗派主义和主观主义","自由主义、平均主义和享乐主义","形式主义、官僚主义和享乐主义","贪污、浪费和官僚主义"],a:"A",x:"整风运动内容是反对官僚主义、宗派主义、主观主义，以加强党的建设。",p:["整风运动"]},

{id:"c9q81",ch:9,t:"j",fs:6,q:"简述《论十大关系》的基本内容和意义。",kw:["1956","十个方面","积极因素","良好开端"],ref:"①1956年4月，毛泽东在中央政治局扩大会议上作《论十大关系》的报告，初步总结了我国社会主义建设的经验，提出了探索适合中国国情的社会主义建设道路的任务；②报告论述了重工业和轻工业、农业等十个方面的关系，确定的基本方针是调动一切积极因素为社会主义事业服务；③《论十大关系》是探索中国自己的社会主义建设道路的良好开端。",p:["《论十大关系》"]},
{id:"c9q82",ch:9,t:"j",fs:6,q:"简述《关于正确处理人民内部矛盾的问题》的主要内容。",kw:["两类不同性质的矛盾","敌我矛盾","人民内部矛盾","主题","基本矛盾"],ref:"①毛泽东指出社会主义社会存在着敌我矛盾和人民内部矛盾两类不同性质的矛盾，敌我矛盾用专政的方法解决，人民内部矛盾用民主的、说服教育的方法解决；②正确处理人民内部矛盾是国家政治生活的主题；③毛泽东还阐述了社会主义社会的基本矛盾仍然是生产关系和生产力、上层建筑和经济基础之间的矛盾。",p:["人民内部矛盾"]},
{id:"c9q83",ch:9,t:"j",fs:6,q:"简述「大跃进」和人民公社化运动的发动及其后果。",kw:["1958","总路线","人民公社","高指标","浮夸风"],ref:"①1958年5月，中共八大二次会议通过了社会主义建设总路线，会后发动了「大跃进」运动；②1958年8月，北戴河会议作出《关于在农村建立人民公社问题的决议》，人民公社化运动迅速掀起高潮；③运动中以高指标、瞎指挥、浮夸风和「共产风」为主要标志的「左」倾错误严重泛滥，破坏了国民经济。",p:["大跃进"]},
{id:"c9q84",ch:9,t:"j",fs:6,q:"简述「文化大革命」发动的原因及全面发动的标志。",kw:["阶级斗争","左","五一六通知","十六条"],ref:"①「文化大革命」的发动，是毛泽东对国内阶级斗争形势作出了错误估计，认为党和国家面临资本主义复辟的危险，加上林彪、江青等人的利用，使「左」倾错误发展到极端；②1966年5月中央政治局扩大会议通过《五一六通知》，标志着「文化大革命」的发动；③1966年8月中共八届十一中全会通过《关于无产阶级文化大革命的决定》（即「十六条」），「文化大革命」全面发动。",p:["文化大革命"]},
{id:"c9q85",ch:9,t:"j",fs:6,q:"简述「两弹一星」研制成功的历程及其意义。",kw:["原子弹","氢弹","东方红一号","国防实力"],ref:"①1964年10月我国第一颗原子弹爆炸成功；②1967年6月第一颗氢弹爆炸成功；③1970年4月第一颗人造地球卫星「东方红一号」发射成功，这些合称「两弹一星」；④「两弹一星」的成功打破了帝国主义的核垄断和核讹诈，增强了国防实力，提高了中国的国际地位。",p:["两弹一星"]},
{id:"c9q86",ch:9,t:"j",fs:6,q:"简述1957年整风运动的内容。",kw:["1957","官僚主义","宗派主义","主观主义","批评与自我批评"],ref:"①1957年4月，中共中央发出《关于整风运动的指示》，在全党开展整风运动；②整风运动的内容是反对官僚主义、宗派主义和主观主义；③整风运动采取批评与自我批评的方法，目的是加强党的建设，改进工作作风。",p:["整风运动"]},
{id:"c9q87",ch:9,t:"l",fs:10,q:"试述中共八大关于国内主要矛盾的分析及其意义。",kw:["工业国","农业国","经济文化","主要任务","良好开端"],ref:"①八大指出，社会主义改造基本完成后，国内主要矛盾是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾；②确定党和全国人民的主要任务是集中力量发展社会生产力，实现国家工业化，逐步满足人民日益增长的物质和文化需要；③八大的路线是正确的，为社会主义事业的发展和党的建设指明了方向，是探索中国自己的社会主义建设道路的良好开端。",p:["中共八大"]},
{id:"c9q88",ch:9,t:"l",fs:10,q:"试述20世纪60年代国民经济调整的背景、方针和成效。",kw:["八字方针","1961","调整","巩固","充实","提高","1965"],ref:"①背景：「大跃进」和人民公社化运动导致国民经济比例严重失调，1959—1961年国民经济发生严重困难；②方针：1961年1月中共八届九中全会正式决定对国民经济实行「调整、巩固、充实、提高」的八字方针，随即全面展开调整；③成效：经过调整，国民经济得到恢复和发展，到1965年调整任务基本完成，国民经济主要比例关系趋于协调。",p:["探索曲折"]},
{id:"c9q89",ch:9,t:"l",fs:10,q:"试述1956—1976年社会主义建设在探索中取得的经验教训。",kw:["实事求是","国情","急于求成","民主集中制","马克思主义"],ref:"①必须坚持实事求是的思想路线，把马克思主义基本原理同中国具体实际相结合，走自己的路；②必须从中国的国情出发，正确认识我国还处于社会主义初级阶段，不能急于求成、超越阶段；③必须正确认识和处理社会主义社会的阶级斗争问题，坚持以经济建设为中心，大力发展社会生产力；④必须坚持民主集中制和集体领导制度，反对个人崇拜，发展社会主义民主，健全社会主义法制；⑤这些经验教训是党和人民付出沉重代价换来的，为改革开放新时期提供了宝贵借鉴。",p:["经验教训"]},
{id:"c9q90",ch:9,t:"l",fs:10,q:"试述20世纪70年代初我国外交战线取得的重大胜利及其影响。",kw:["联合国","1971","尼克松","上海公报","田中角荣"],ref:"①1971年10月，第26届联合国大会通过决议，恢复中华人民共和国在联合国的一切合法权利，这是我国外交战线的重大胜利；②1972年2月，美国总统尼克松访华，中美双方发表《上海公报》，两国关系开始走向正常化，1979年正式建交；③1972年9月，日本首相田中角荣访华，中日实现邦交正常化；④这些成就打破了西方国家对中国的孤立封锁，提高了中国的国际地位，为后来的改革开放创造了有利的国际环境。",p:["外交成就"]},

{id:"c10q81",ch:10,t:"j",fs:6,q:"简述真理标准问题大讨论的主要内容和历史意义。",
kw:["实践是检验真理的唯一标准","解放思想","两个凡是","十一届三中全会","思想基础"],
ref:"1978年5月《光明日报》发表《实践是检验真理的唯一标准》一文，引发全国范围的大讨论。主要内容：①批判「两个凡是」的错误方针；②确立实践是检验真理的唯一标准；③重新确立解放思想、实事求是的思想路线。历史意义：冲破了「两个凡是」的束缚，促进了全国性的思想解放运动，为中共十一届三中全会实现伟大历史转折奠定了思想基础。",p:["真理标准讨论"]},
{id:"c10q82",ch:10,t:"j",fs:6,q:"简述家庭联产承包责任制的主要内容和意义。",
kw:["包产到户","包干到户","经营自主权","小岗村","农村改革"],
ref:"主要内容：以包产到户、包干到户为主要形式，在坚持土地集体所有制的前提下，把土地承包给农户经营，农户获得生产经营自主权，实行统分结合的双层经营体制。历史意义：①调动了农民生产积极性，解放和发展了农村生产力；②1978年底安徽凤阳小岗村率先实行包产到户，拉开了农村改革的序幕；③为城市经济体制改革提供了经验，推动整个改革开放进程。",p:["农村改革"]},
{id:"c10q83",ch:10,t:"j",fs:6,q:"简述我国设立经济特区的主要特点和意义。",
kw:["深圳","珠海","汕头","厦门","窗口","试验田"],
ref:"1980年我国设立深圳、珠海、汕头、厦门四个经济特区，1988年设立海南经济特区。主要特点：在对外经济活动中实行特殊政策和灵活措施，以引进外资、先进技术和管理经验为主，实行市场经济机制。历史意义：①经济特区成为我国利用外资、引进技术、学习先进管理经验的窗口；②是经济体制改革和对外开放的试验田；③推动了全国改革开放和现代化建设。",p:["经济特区"]},
{id:"c10q84",ch:10,t:"j",fs:6,q:"简述党在社会主义初级阶段基本路线的内容。",
kw:["一个中心","两个基本点","以经济建设为中心","四项基本原则","改革开放","富强民主文明"],
ref:"党在社会主义初级阶段的基本路线是：领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强、民主、文明的社会主义现代化国家而奋斗。概括起来就是「一个中心、两个基本点」。",p:["基本路线"]},
{id:"c10q85",ch:10,t:"j",fs:6,q:"简述邓小平南方谈话的主要历史背景和意义。",
kw:["1992","武昌","深圳","珠海","上海","基本路线"],
ref:"1992年1月至2月，邓小平先后视察武昌、深圳、珠海、上海等地，发表重要谈话。背景：当时国际国内出现一些对改革开放的疑虑和困惑，姓「社」姓「资」的争论束缚着人们的思想。意义：①科学回答了「什么是社会主义、怎样建设社会主义」等重大认识问题；②强调坚持党的基本路线一百年不动摇；③为中共十四大确立社会主义市场经济体制的改革目标奠定了思想基础，把改革开放和现代化建设推进到新阶段。",p:["南方谈话"]},
{id:"c10q86",ch:10,t:"j",fs:6,q:"简述中国加入世界贸易组织的重大意义。",
kw:["2001","对外开放","新阶段","世界经济","机遇","挑战"],
ref:"2001年12月11日，中国正式加入世界贸易组织。重大意义：①标志着我国对外开放进入新阶段；②为我国经济社会发展赢得良好国际环境，促进社会主义市场经济体制完善；③推动我国更广泛深入地参与经济全球化，分享世界经济发展的机遇；④同时我国也面临更加激烈的国际竞争和挑战，必须趋利避害，提高对外开放水平。",p:["对外开放"]},
{id:"c10q87",ch:10,t:"l",fs:10,q:"试述为什么说改革开放是决定当代中国命运的关键一招。",
kw:["十一届三中全会","改革开放","中国特色社会主义","解放和发展","关键一招","强国之路"],
ref:"1978年12月中共十一届三中全会作出实行改革开放的历史性决策。改革开放是党在新的历史条件下领导人民进行的新的伟大革命。①改革开放极大地解放和发展了社会生产力，使中国经济实力、科技实力、综合国力显著增强，人民生活水平大幅提高；②改革开放开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系；③改革开放使中华民族迎来了从站起来、富起来到强起来的伟大飞跃。实践证明，改革开放是决定当代中国命运的关键一招，是党和人民事业大踏步赶上时代的重要法宝；改革开放是强国之路，是实现中华民族伟大复兴的必由之路。",p:["改革开放"]},
{id:"c10q88",ch:10,t:"l",fs:10,q:"试述社会主义市场经济体制的确立过程和重大意义。",
kw:["十四大","改革目标","市场经济","有计划的商品经济","资源配置","十四届三中全会"],
ref:"确立过程：①1984年中共十二届三中全会提出社会主义经济是公有制基础上的有计划的商品经济，突破了把计划经济同商品经济对立起来的传统观念；②1992年邓小平南方谈话指出计划和市场都是经济手段，不是社会主义与资本主义的本质区别；③1992年中共十四大明确提出我国经济体制改革目标是建立社会主义市场经济体制；④1993年十四届三中全会通过《关于建立社会主义市场经济体制若干问题的决定》，勾画了社会主义市场经济体制的基本框架。重大意义：社会主义市场经济体制使市场在资源配置中发挥重要作用，同时发挥社会主义制度的优越性，极大促进了生产力发展，推动我国改革开放和现代化建设取得举世瞩目的成就。",p:["社会主义市场经济"]},
{id:"c10q89",ch:10,t:"l",fs:10,q:"试述「一国两制」构想的提出与香港、澳门回归祖国的重大意义。",
kw:["台湾问题","一个中国","社会主义制度","1997","1999","洗雪","繁荣稳定"],
ref:"「一国两制」构想最早是为解决台湾问题而提出，后首先运用于解决香港、澳门问题。基本内涵：在一个中国的前提下，国家主体坚持社会主义制度，香港、澳门、台湾保持原有的资本主义制度和生活方式长期不变。经过中英、中葡谈判，1984年签署《中英联合声明》，1987年签署《中葡联合声明》。1997年7月1日香港回归祖国，1999年12月20日澳门回归祖国，设立特别行政区，实行「港人治港」、「澳人治澳」、高度自治。重大意义：①香港、澳门回归洗雪了中华民族百年屈辱，是「一国两制」构想的成功实践；②为世界提供了解决历史遗留问题的新范例；③香港、澳门回归后保持繁荣稳定，证明「一国两制」是解决祖国统一问题的正确方针，对最终解决台湾问题具有示范意义。",p:["一国两制"]},
{id:"c10q90",ch:10,t:"l",fs:10,q:"试述社会主义初级阶段理论的形成及其意义。",
kw:["1981","初级","十三大","基本路线","基本国情","一百年不动摇"],
ref:"形成过程：①1981年中共十一届六中全会《关于建国以来党的若干历史问题的决议》首次提出「我们的社会主义制度还是处于初级的阶段」；②1986年中共十二届六中全会重申我国还处于社会主义初级阶段的科学论断；③1987年中共十三大系统阐述了社会主义初级阶段理论，并据此制定党在社会主义初级阶段的基本路线。主要意义：①科学回答了我国处于什么样的发展阶段这一基本国情问题；②是党制定和执行正确路线方针政策的根本依据；③强调社会主义初级阶段是一个相当长的历史阶段，必须坚持基本路线一百年不动摇，防止超越阶段，为改革开放和现代化建设提供了理论指导。",p:["社会主义初级阶段"]},

{id:"c11q79",ch:11,t:"s",q:"新时代坚持和发展中国特色社会主义的总任务是",o:["实现社会主义现代化和中华民族伟大复兴","全面建成小康社会","实现共同富裕","构建人类命运共同体"],a:"A",x:"八个明确的总任务是实现社会主义现代化和中华民族伟大复兴。",p:["习近平思想"]},
{id:"c11q80",ch:11,t:"s",q:"十八大以来党和国家事业取得历史性成就的根本保证是",o:["以习近平同志为核心的党中央坚强领导","国际形势有利","人口红利","自然条件优越"],a:"A",x:"十八大以来成就的根本保证，是党中央坚强领导和习近平新时代中国特色社会主义思想的指引。",p:["新时代"]},
{id:"c11q81",ch:11,t:"j",fs:6,q:"简述中国梦的基本内涵和实现途径。",
kw:["国家富强","民族振兴","人民幸福","中国道路","中国精神","中国力量"],
ref:"中国梦的基本内涵是实现国家富强、民族振兴、人民幸福。实现途径：①必须走中国道路，即中国特色社会主义道路；②必须弘扬中国精神，即以爱国主义为核心的民族精神和以改革创新为核心的时代精神；③必须凝聚中国力量，即全国各族人民大团结的力量。",p:["中国梦"]},
{id:"c11q82",ch:11,t:"j",fs:6,q:"简述习近平新时代中国特色社会主义思想的核心内容。",
kw:["八个明确","十四个坚持","基本方略","行动指南","习近平"],
ref:"习近平新时代中国特色社会主义思想的核心内容包括「八个明确」和「十四个坚持」。「八个明确」回答了新时代坚持和发展什么样的中国特色社会主义；「十四个坚持」构成新时代坚持和发展中国特色社会主义的基本方略，回答了怎样坚持和发展中国特色社会主义。习近平新时代中国特色社会主义思想是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南，必须长期坚持并不断发展。",p:["习近平思想"]},
{id:"c11q83",ch:11,t:"j",fs:6,q:"简述我国社会主要矛盾变化的主要依据。",
kw:["美好生活需要","不平衡不充分","发展","新时代","依据"],
ref:"中共十九大指出，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。主要依据：①经过长期发展，我国稳定解决了十几亿人的温饱问题，总体上实现小康，人民对美好生活的需要日益广泛；②我国社会生产力水平总体上显著提高，但发展不平衡不充分的问题突出，已经成为满足人民美好生活需要的主要制约因素；③社会主要矛盾的变化是关系全局的历史性变化，对党和国家工作提出了许多新要求，但我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，必须立足社会主义初级阶段这个最大实际，在新时代坚持和发展中国特色社会主义。",p:["社会主要矛盾"]},
{id:"c11q84",ch:11,t:"j",fs:6,q:"简述全面建成小康社会的重大意义。",
kw:["2021","第一个百年奋斗目标","历史性","民族复兴","新起点"],
ref:"2021年7月1日，在庆祝中国共产党成立100周年大会上，习近平庄严宣告：我们实现了第一个百年奋斗目标，在中华大地上全面建成了小康社会，历史性地解决了绝对贫困问题。重大意义：①标志着中华民族伟大复兴向前迈出了新的一大步；②全面建成小康社会是全面深化改革、全面依法治国、全面从严治党的阶段性成果的集中体现；③为全面建设社会主义现代化国家、实现第二个百年奋斗目标奠定了坚实基础，是迈向民族复兴的关键一步和新起点。",p:["全面小康"]},
{id:"c11q85",ch:11,t:"j",fs:6,q:"简述「两步走」战略安排的内容。",
kw:["2035","基本实现","本世纪中叶","强国","人民共同富裕"],
ref:"中共十九大提出「两步走」战略安排：第一步，从2020年到2035年，在全面建成小康社会的基础上，再奋斗十五年，基本实现社会主义现代化；第二步，从2035年到本世纪中叶，在基本实现现代化的基础上，再奋斗十五年，把我国建成富强民主文明和谐美丽的社会主义现代化强国，全体人民共同富裕基本实现。",p:["两步走"]},
{id:"c11q86",ch:11,t:"j",fs:6,q:"简述中国式现代化的中国特色。",
kw:["人口规模巨大","全体人民共同富裕","物质文明","精神文明","人与自然","和平发展"],
ref:"中国式现代化是中国共产党领导的社会主义现代化，具有五个方面的中国特色：①是人口规模巨大的现代化；②是全体人民共同富裕的现代化；③是物质文明和精神文明相协调的现代化；④是人与自然和谐共生的现代化；⑤是走和平发展道路的现代化。",p:["中国式现代化"]},
{id:"c11q87",ch:11,t:"l",fs:10,q:"试述习近平新时代中国特色社会主义思想的历史地位和指导意义。",
kw:["新时代","马克思主义中国化","行动指南","中华民族伟大复兴","飞跃"],
ref:"习近平新时代中国特色社会主义思想，是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的产物，是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化新的飞跃。历史地位：①是党和国家必须长期坚持的指导思想；②是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南。指导意义：①为新时代坚持和发展中国特色社会主义提供了根本遵循；②为全面建成社会主义现代化强国、实现第二个百年奋斗目标提供了科学指引；③为解决人类面临的共同问题贡献了中国智慧和中国方案。",p:["习近平思想"]},
{id:"c11q88",ch:11,t:"l",fs:10,q:"试述全面建成小康社会的历程与重大意义。",
kw:["十八大","脱贫攻坚","2021","全面小康","第一个百年奋斗目标","社会主义现代化国家"],
ref:"历程：①2012年中共十八大提出确保到2020年全面建成小康社会的宏伟目标；②2013年提出精准扶贫精准脱贫方略，打响脱贫攻坚战；③2017年中共十九大发出决胜全面建成小康社会、开启全面建设社会主义现代化国家新征程的号召；④经过全党全国各族人民持续奋斗，2020年底如期完成脱贫攻坚目标任务，2021年7月1日习近平宣告在中华大地上全面建成了小康社会，实现了第一个百年奋斗目标。重大意义：①全面小康是覆盖领域、覆盖人口、覆盖区域全面的小康，是中华民族发展史上的一座重要里程碑；②为全面建设社会主义现代化国家、实现第二个百年奋斗目标奠定了坚实基础；③全面建成小康社会、实现第一个百年奋斗目标，向实现中华民族伟大复兴迈出了关键一步。",p:["全面小康"]},
{id:"c11q89",ch:11,t:"l",fs:10,q:"试述中国式现代化的中国特色和本质要求。",
kw:["二十大","中国共产党领导","共同富裕","和平发展","本质要求","人类文明新形态"],
ref:"中共二十大深刻阐述了中国式现代化的中国特色和本质要求。中国特色：①是人口规模巨大的现代化；②是全体人民共同富裕的现代化；③是物质文明和精神文明相协调的现代化；④是人与自然和谐共生的现代化；⑤是走和平发展道路的现代化。本质要求：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。",p:["中国式现代化"]},
{id:"c11q90",ch:11,t:"l",fs:10,q:"试述新时代坚持和发展中国特色社会主义的总任务和「两步走」战略安排。",
kw:["总任务","现代化","中华民族伟大复兴","2035","本世纪中叶","强国"],
ref:"新时代坚持和发展中国特色社会主义的总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。第一步，从2020年到2035年，基本实现社会主义现代化；第二步，从2035年到本世纪中叶，把我国建成富强民主文明和谐美丽的社会主义现代化强国。实现这一战略安排，必须坚持党的基本理论、基本路线、基本方略，贯彻新发展理念，以中国式现代化全面推进中华民族伟大复兴，确保中华民族伟大复兴的中国梦如期实现。",p:["两步走"]},

{id:"c5q96",ch:5,t:"j",real:true,src:"2024年10月真题",fs:6,q:"中华苏维埃共和国实行的各级工农兵代表大会制度。",
kw:["工农兵代表大会制度","直接选举","乡苏维埃政府","逐级","工农群众代表","工农民主政权"],
ref:"中华苏维埃共和国实行各级工农兵代表大会制度：先由苏维埃共和国公民直接选举产生乡工农兵代表大会代表，召开乡工农兵代表大会，选举产生乡苏维埃政府组成人员；在此基础上，逐级召开区、县、省和全国工农兵代表大会，选举产生区、县、省和全国苏维埃政府。各级苏维埃政府广泛吸收工农群众代表参加政权管理，行使当家作主的权利。中华苏维埃共和国是中国历史上第一个全国性的工农民主政权，是中国共产党在局部地区执政的重要尝试。",p:["中华苏维埃"]},
{id:"c7q91",ch:7,t:"j",real:true,src:"2024年10月真题",fs:6,q:"抗日战争胜利后美国实施的扶蒋反共政策。",
kw:["扶蒋反共政策","和平谈判","诱骗中共","加强国民党力量","武力打败中共","两个前途"],
ref:"抗战胜利后，美国继续采取自中国抗战后期就已确立的扶蒋反共政策。这一政策包含两个方面：一方面，在形势对国民党不利时，力促国共两党进行和平谈判，企图以和平手段诱骗中共向国民党投降，使美国不战而控制全中国；另一方面，从各方面大力加强国民党力量，一旦和谈目的不能实现，便帮助国民党与中共决战，企图以武力打败中共，使中国成为美国的附庸。因此，无论美国采取何种手法扶蒋反共，中国共产党和中国人民都面临两个前途、两种命运决战的严峻考验。",p:["重庆谈判","全面内战"]},
{id:"c11q92",ch:11,t:"j",real:true,src:"2024年10月真题",fs:6,q:"中共十九大确定的决胜全面建成小康社会、开启全面建设社会主义现代化国家新征程的目标。",
kw:["决胜全面建成小康社会","2020年到2035年","基本实现社会主义现代化","2035年到21世纪中叶","社会主义现代化强国"],
ref:"中共十九大确定了决胜全面建成小康社会、开启全面建设社会主义现代化国家新征程的目标，分两个阶段推进：第一个阶段，从2020年到2035年，在全面建成小康社会的基础上，再奋斗十五年，基本实现社会主义现代化；第二个阶段，从2035年到21世纪中叶，在基本实现现代化的基础上，再奋斗十五年，把我国建成富强民主文明和谐美丽的社会主义现代化强国。",p:["十九大","两步走"]},

{id:"c1q102",ch:1,t:"s",real:true,src:"2024年4月真题",q:"西方列强对近代中国的侵略，首先和主要的是",o:["经济掠夺","军事侵略","政治控制","文化渗透"],a:"B",x:"资本帝国主义列强对中国的侵略，首先和主要的是进行军事侵略，迫使中国政府签订不平等条约。",p:["侵略中国"]},

{id:"c1q104",ch:1,t:"s",real:true,src:"2024年4月真题",q:"1840年至1919年，中国人民反侵略斗争失败的最根本原因是",o:["思想文化保守","社会制度腐败","经济技术落后","军事装备落后"],a:"B",x:"反侵略斗争失败的原因一是社会制度腐败，二是经济技术落后，前者是最根本的原因。",p:["反侵略失败原因"]},

{id:"c3q97",ch:3,t:"s",real:true,src:"2024年4月真题",q:"1905年至1907年，资产阶级革命派与改良派论战的焦点是",o:["要不要兴民权和设议院","要不要推翻帝制，实行共和","要不要以革命手段推翻清政府","要不要进行社会革命"],a:"C",x:"论战围绕三方面展开，其中要不要以革命手段推翻清政府是这次论战的焦点。",p:["革命论战"]},
{id:"c3q98",ch:3,t:"s",real:true,src:"2024年4月真题",q:"1911年4月，资产阶级革命派在黄兴带领下发动的武装起义是",o:["黄花岗起义","镇南关起义","钦州起义","惠州起义"],a:"A",x:"1911年4月黄兴率革命志士在广州起义，失败后七十二烈士葬于黄花岗，史称黄花岗起义。",p:["辛亥革命"]},

{id:"c4q96",ch:4,t:"s",real:true,src:"2024年4月真题",q:"1915年9月，在上海创办《青年杂志》（后改名为《新青年》）的是",o:["鲁迅","陈独秀","蔡元培","胡适"],a:"B",x:"1915年9月陈独秀在上海创办《青年杂志》，后改名《新青年》，成为新文化运动兴起的标志。",p:["新文化运动"]},
{id:"c3q100",ch:3,t:"s",real:true,src:"2024年4月真题",q:"1915年12月爆发的反对袁世凯复辟帝制的斗争是",o:["第一次护法运动","第二次护法运动","护国运动","「二次革命」"],a:"C",x:"1915年12月反对袁世凯称帝的斗争是护国运动，此前的反袁斗争是二次革命。",p:["护国运动"]},

{id:"c5q99",ch:5,t:"j",real:true,src:"2024年4月真题",fs:6,q:"毛泽东在《星星之火，可以燎原》一文中阐述的主要思想及其意义。",
kw:["星星之火","红色区域","农民斗争的最高形式","乡村为中心","农村包围城市","武装夺取政权"],
ref:"（1）1930年1月，毛泽东在《星星之火，可以燎原》中指出，红军、游击队和红色区域的建立和发展，是半殖民地中国在无产阶级领导之下的农民斗争的最高形式，是半殖民地农民斗争发展的必然结果，是促进全国革命高潮的最重要因素。（2）这一思想实际上批评了共产国际和中共党内某些人坚持的城市中心论，提出了以乡村为中心的思想，初步形成了农村包围城市、武装夺取政权的理论。（3）农村包围城市、武装夺取政权的理论，是对1927年后共产党领导的红军和根据地斗争经验的科学概括，是在同把马克思主义教条化、把共产国际决议和苏联经验神圣化的错误倾向作斗争的基础上逐步形成的。",p:["农村包围城市"]},
{id:"c7q94",ch:7,t:"j",real:true,src:"2024年4月真题",fs:6,q:"解放战争时期国民党统治区政治、经济危机日益加深的主要原因。",
kw:["劫收","胜利财","休养生息","内战政策","第二条战线"],
ref:"（1）抗战胜利后，国民党把接收变成劫收，大发胜利财，从而使更多民众的期望破灭。（2）国民党统治集团违背全国人民迫切要求休养生息、和平建国的意愿，实行反人民的内战政策。（3）为支持反人民的内战，国民党政府多方面加剧对人民的疯狂掠夺，将全国各阶层人民置于饥饿和死亡线上，迫使人民团结起来同国民党政府作斗争。（4）中国共产党制定和实行了推翻国民党黑暗统治的正确政策和策略，既领导了解放区军民在第一条战线的斗争，又领导了国统区人民在第二条战线的斗争。",p:["第二条战线"]},
{id:"c9q93",ch:9,t:"j",real:true,src:"2024年4月真题",fs:6,q:"毛泽东在探索中国社会主义建设道路过程中提出的文化建设方针。",
kw:["双百","百花齐放","百家争鸣","马克思主义的指导地位","古为今用","洋为中用"],
ref:"（1）在讨论报告的过程中，毛泽东提出了双百方针这一社会主义文化建设的新方针。（2）1956年4月28日，毛泽东在中共中央政治局扩大会议上指出，艺术问题上的百花齐放、学术问题上的百家争鸣，应该成为我们的方针。（3）在社会主义文化建设方面，毛泽东提出要坚持马克思主义的指导地位，实行百花齐放、百家争鸣的方针，对古今中外的优秀文化实行古为今用、洋为中用、百花齐放、推陈出新的方针。",p:["双百方针"]},
{id:"c10q93",ch:10,t:"j",real:true,src:"2024年4月真题",fs:6,q:"中共十三大制定的社会主义现代化建设三步走的战略部署。",
kw:["温饱","小康水平","中等发达国家水平","基本实现现代化","三步走"],
ref:"（1）第一步，实现国民生产总值比1980年翻一番，解决人民的温饱问题，这个任务已经基本实现。（2）第二步，到20世纪末，使国民生产总值再增长一倍，人民生活达到小康水平。（3）第三步，到21世纪中叶，人均国民生产总值达到中等发达国家水平，人民生活比较富裕，基本实现现代化。（4）三步走发展战略及相关政策的制定，进一步解决了中国现代化建设的目标、步骤等关系全局的重大问题，对中国未来几十年的发展具有深远影响。",p:["三步走"]},
{id:"c2q96",ch:2,t:"l",real:true,src:"2024年4月真题",fs:10,q:"如何评价太平天国定都天京后先后颁布的两个社会改革方案？",
kw:["天朝田亩制度","平均分配土地","资政新篇","资本主义色彩","雇佣劳动制"],
ref:"（1）《天朝田亩制度》颁布于1853年冬，是最能体现太平天国社会理想和这次农民战争特点的纲领性文件。（2）它是一个以解决土地问题为中心的比较完整的社会改革方案，代表了农民要求平均分配土地的强烈愿望，反映了农民反对封建土地所有制的普遍要求。（3）同以往农民起义提出的均贫富、等贵贱等口号相比，《天朝田亩制度》内容更完备，更触及封建社会矛盾的核心，思想内涵更为深刻。（4）太平天国后期，洪仁玕提出《资政新篇》，作为统筹全局的建议，是中国近代史上第一个具有资本主义色彩的方案。（5）《资政新篇》主张加强中央集权、制定法律制度，发展近代工矿、交通、邮政、金融等事业，奖励科技发明和机器制造，提倡资本主义雇佣劳动制，设新闻官、兴办学校医院，并主张同世界各国交往通商。（6）其缺点是没有提出涉及农民土地问题的具体方案，因而未能得到农民群众的广泛支持。",p:["太平天国"]},
{id:"c6q101",ch:6,t:"l",real:true,src:"2024年4月真题",fs:10,q:"中国人民抗日战争胜利的历史意义是什么？",
kw:["殖民奴役","国家主权和领土完整","民族耻辱","大国地位","中华民族的觉醒","伟大复兴"],
ref:"（1）中国人民抗日战争的胜利，彻底粉碎了日本军国主义殖民奴役中国的图谋，迫使日本归还甲午战争以后从中国窃取的东北、台湾、澎湖列岛等神圣领土，捍卫了国家主权和领土完整，彻底洗刷了近代以来抗击外来侵略屡战屡败的民族耻辱。（2）中国人民抗日战争的伟大胜利，重新确立了中国在世界上的大国地位。中国人民为世界反法西斯战争作出的重大贡献，使中国的国际地位显著提高。（3）中国人民抗日战争的胜利，促进了中华民族的觉醒，开辟了中华民族伟大复兴的光明前景。（4）抗日战争是近代以来中国反抗外敌入侵第一次取得完全胜利的民族解放战争，为争取世界和平的伟大事业作出了重要贡献。（5）抗日战争的胜利，为中国共产党领导人民取得新民主主义革命的胜利、建立新中国奠定了重要基础。",p:["抗战胜利"]},
{id:"c11q93",ch:11,t:"l",real:true,src:"2024年4月真题",fs:10,q:"中共十九大如何论述进入中国特色社会主义新时代后我国社会主要矛盾的变化？",
kw:["新时代","社会主要矛盾","美好生活需要","不平衡不充分","社会主义初级阶段","基本路线"],
ref:"（1）2017年10月，中共十九大在北京举行。大会指出，经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。（2）大会指出，中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。（3）我国社会主要矛盾的变化是关系全局的历史性变化，对党和国家工作提出了许多新要求。（4）大会强调，这一变化没有改变对我国社会主义所处历史阶段的判断，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。（5）全党要牢牢把握社会主义初级阶段这个基本国情，牢牢立足社会主义初级阶段这个最大实际，牢牢坚持党的基本路线这个党和国家的生命线、人民的幸福线。",p:["社会主要矛盾"]},

{id:"c2q99",ch:2,t:"j",real:true,src:"2023年4月真题",fs:6,q:"太平天国农民战争爆发的原因。",
kw:["政治压迫","战争赔款","鸦片贩卖","自然灾害","拜上帝教"],
ref:"太平天国农民战争爆发的根本原因，是封建专制政权及地主阶级对农民的政治压迫和经济剥削。清政府将鸦片战争所消耗的军费、战争赔款都摊派转嫁给农民，加重了农民负担。外国商品的输入和鸦片贩卖的激增，加速了中国社会经济的萎缩和人民生活的贫困。全国自然灾害频发，大量灾民流离失所。此外，洪秀全创立拜上帝教，为起义作了思想准备。",p:["太平天国"]},
{id:"c6q104",ch:6,t:"j",real:true,src:"2023年4月真题",fs:6,q:"抗日战争进入相持阶段后，国民党内外政策的变化。",
kw:["政治诱降","五届五中全会","防共委员会","溶共","消极抗战"],
ref:"抗日战争进入相持阶段后，日本对国民党采取政治诱降为主、军事打击为辅的方针，国民党内外政策随之发生重大变化。1939年1月，国民党五届五中全会决定成立防共委员会，确定了防共、限共、溶共、反共的方针。国民党对抗战在全局上逐渐趋向消极，保存实力，同时限制、打击共产党及其领导的八路军、新四军，制造反共磨擦事件。蒋介石将抗战到底的含义解释为恢复到卢沟桥事变以前的状态，这标志着国民党由片面抗战逐步转变为消极抗战。",p:["正面战场"]},
{id:"c9q96",ch:9,t:"j",real:true,src:"2023年4月真题",fs:6,q:"从「一五」时期开始到1976年，新中国经济建设的重大成就及其意义。",
kw:["工业体系","长春第一汽车制造厂","武汉长江大桥","青藏","经济独立"],
ref:"从一五时期开始到1976年，新中国经济建设取得重大成就。国家基本建立了独立的、比较完整的工业体系和国民经济体系，建成一批门类比较齐全的基础工业项目，鞍山、包头、武汉三大钢铁基地建设取得重大进展，长春第一汽车制造厂、沈阳机床厂等建成投产，在工业建设上实现多项零的突破。农业产品产量大幅度提升。交通方面，1957年武汉长江大桥通车，铁路贯穿中国南北，青藏、康藏、新藏公路建成通车，沟通了西藏和内地的联系。这些成就从根本上解决了工业化中从无到有的问题，使中国在政治独立之后赢得了经济独立，为国民经济进一步发展和社会主义现代化建设奠定了牢固的物质技术基础。",p:["建设成就"]},
{id:"c11q96",ch:11,t:"j",real:true,src:"2023年4月真题",fs:6,q:"中共十八大阐明的中国特色社会主义的总依据、总布局和总任务。",
kw:["社会主义初级阶段","五位一体","生态文明","中华民族伟大复兴","最大国情"],
ref:"中共十八大报告指出，建设中国特色社会主义，总依据是社会主义初级阶段，总布局是经济、政治、文化、社会、生态文明建设五位一体，总任务是实现社会主义现代化和中华民族伟大复兴。这一论断为中国特色社会主义的全面进步与继续发展指明了奋斗方向，明确了努力目标，规划了整体布局，规定了基本任务。我国仍是世界上最大的发展中国家，推进任何领域的改革发展都要牢牢把握社会主义初级阶段这个最大国情和最大实际，做到既不超越阶段又不落后现实，既尽力而为又量力而行。",p:["十八大"]},
{id:"c1q105",ch:1,t:"l",real:true,src:"2023年4月真题",fs:10,q:"18世纪西方殖民主义扩张对中国的威胁。",
kw:["工业革命","商品倾销市场","转移国内矛盾","英国政府","半殖民地半封建社会"],
ref:"18世纪，随着资本主义制度在西方主要国家的先后确立和工业革命的进行，西方殖民主义者加紧对一些国家和地区进行军事、政治、经济和文化等方面的侵略，使其沦为列强所垄断的商品倾销市场、廉价劳动力与廉价原料的供应地和自由投资市场。西方列强为开辟新的市场和转移国内矛盾，不断发动新的侵略战争，并将目标瞄向中国。此后，英国政府为摆脱第一次资本主义经济危机，图谋用武力打开中国国门。西方殖民主义的扩张使古老的中国遇到了空前挑战，最终产生了西方列强侵略中国的后果，使中国社会逐步变为半殖民地半封建社会，中国人民陷入深重苦难。",p:["侵略中国"]},
{id:"c8q96",ch:8,t:"l",real:true,src:"2023年4月真题",fs:10,q:"新中国成立初期的土地改革运动及其意义。",
kw:["土地改革法","封建土地所有制","农业生产力","基层政权","少数民族"],
ref:"根据《中华人民共和国土地改革法》，从1950年冬到1953年春，新解放区农村开展了轰轰烈烈的土地改革运动。除一些少数民族地区外，土地改革基本完成，全国3亿多无地少地的农民无偿得到了7亿亩土地和大量生产资料。土地改革在全国范围的基本完成，彻底摧毁了封建制度的经济基础，消灭了封建土地所有制，使深受剥削压迫的中国农民得到解放，摆脱了宗法的人身束缚，极大解放了农业生产力。与此同时，依靠土改中形成的有觉悟有组织的骨干力量，建立了新中国农村的基层政权，为整个中国社会走向进步与稳定奠定了深厚基础。这是中国人民反封建斗争的重大胜利。",p:["土地改革"]},

{id:"c2q102",ch:2,t:"j",real:true,src:"2023年10月真题",fs:6,q:"戊戌维新运动失败的主要原因。",
kw:["维新派自身的局限","依靠没有实权的光绪皇帝","守旧势力强大","社会基础薄弱","国际环境不利"],
ref:"一、维新派自身的局限。维新派受时代和阶级的局限，没有成熟的革命理论指导，缺乏严密的组织与坚强的领导核心；对封建势力的顽固性和反动性估计不足，采取改良方式，依靠没有实权的光绪皇帝进行自上而下的改革，缺乏实际权力基础。二、守旧势力强大。以慈禧太后为首的清朝保守派统治集团掌握强大的政治、军事力量，坚决反对任何触动其既得利益的政治变革，当变法危及其根本权力时迅速发动政变，镇压了维新运动。三、社会基础薄弱。中国民族资本主义经济尚处萌芽阶段，资产阶级力量弱小，缺乏广泛的群众基础和社会支持，得不到广大民众特别是农民阶级的响应。四、国际环境不利。列强不断侵犯中国主权，列强之间矛盾重重，维新派无法获得外国有力支持。",p:["戊戌维新","失败原因"]},
{id:"c3q108",ch:3,t:"j",real:true,src:"2023年10月真题",fs:6,q:"清末「新政」实行的原因。",
kw:["内忧外患","义和团运动","学习西方先进的制度和技术","日本明治维新","民主革命浪潮"],
ref:"一、内忧外患的压力。甲午战争后，清朝面临空前严重的民族危机，内部各种社会矛盾激化，义和团运动等事件进一步暴露清政府的腐败无能和统治危机。二、受西方影响寻求自救。清政府意识到只有学习西方先进的制度和技术才能挽救危局，希望通过有限度的改革维护清朝统治，并借鉴日本明治维新的经验，推行新政。三、应对民主革命浪潮。为了对抗日益高涨的资产阶级民主革命运动，如孙中山领导的同盟会等革命党人的活动，清政府被迫实施新政，以缓和社会矛盾、消弭革命。",p:["辛亥革命"]},
{id:"c4q100",ch:4,t:"j",real:true,src:"2023年10月真题",fs:6,q:"中国早期马克思主义思想运动的历史特点。",
kw:["五四新文化运动","与爱国主义紧密结合","马克思主义中国化","李大钊","中国共产党的诞生"],
ref:"一、传播于五四新文化运动时期。俄国十月革命胜利后，马克思主义在中国开始广泛传播，并逐步与中国工人运动相结合。二、与爱国主义紧密结合。早期马克思主义者把救亡图存的民族诉求同国际共产主义理想结合起来，主张通过革命手段实现中国的现代化。三、马克思主义中国化初现端倪。李大钊、陈独秀等先驱尝试把马克思主义基本原理同中国具体国情相结合，探索适合中国国情的革命道路。四、为建党奠定思想基础。早期马克思主义思想的传播促进了中国共产党的诞生，形成了初步的马克思主义政党。",p:["马克思主义传播"]},
{id:"c5q105",ch:5,t:"j",real:true,src:"2023年10月真题",fs:6,q:"中华苏维埃第一次全国代表大会的召开及其主要内容。",
kw:["江西瑞金叶坪","选举毛泽东为主席","工农民主专政","没收地主土地分配给贫苦农民","中央执行委员会"],
ref:"一、召开时间与地点。1931年11月7日至20日，中华苏维埃第一次全国代表大会在江西瑞金叶坪举行。二、宣告政权成立。大会宣告中华苏维埃共和国临时中央政府成立，选举毛泽东为主席。三、通过法律文件。大会通过《中华苏维埃共和国宪法大纲》等重要法律文件，确立工农民主专政的政权性质。四、制定土地政策。规定没收地主土地分配给贫苦农民，体现了彻底的土地革命纲领。五、建立组织机构。成立中华苏维埃共和国中央执行委员会和人民委员会，构建苏区行政体系。这次大会标志着中国共产党领导的工农民主专政新型国家政权的建立，是党独立领导中国革命的重要里程碑。",p:["中华苏维埃"]},
{id:"c6q108",ch:6,t:"j",real:true,src:"2023年10月真题",fs:6,q:"中国人民抗日战争在世界反法西斯战争中的地位。",
kw:["东方主战场","牵制了日本大部分陆军","延缓了日本北进苏联","战略策应作用","开罗会议","精神象征与道义支持"],
ref:"一、东方主战场。中国自1931年九一八事变起开始局部抗战，1937年进入全面抗战，是世界反法西斯战争的东方主战场；中国长期独立对抗日本主要军事力量，牵制了日本大部分陆军和部分海军，减轻了盟国在其他战场的压力。二、持久消耗战略。中国持久而艰苦的抵抗极大消耗了日本的战争资源和兵力，延缓了日本北进苏联、南下太平洋的战略步伐，对整个战局产生深远影响。三、战略策应作用。中国抗战同欧洲战场、太平洋战场形成战略互动，对盟军行动起到积极策应和支持作用。四、国际贡献与合作。中国积极参加开罗会议等国际会议，推动建立联合国，对战后国际秩序重建作出重大贡献。五、精神象征与道义支持。中国抗战的英勇不屈为世界反法西斯斗争提供了重要的精神支持和道义鼓舞。",p:["世界反法西斯战争"]},
{id:"c7q97",ch:7,t:"l",real:true,src:"2023年10月真题",fs:10,q:"统一战线是新民主主义革命胜利的基本经验之一，其主要内容是什么？",
kw:["建立两个联盟","工人阶级同民族资产阶级的联盟","坚持独立自主原则","抗日民族统一战线","广泛动员社会各阶层爱国力量"],
ref:"一、建立两个联盟。一是工人阶级同农民、城市小资产阶级和其他劳动人民的联盟，这是基本的、主要的联盟；二是工人阶级同民族资产阶级的联盟，这个联盟具有一定的不稳定性。二、正确处理两个联盟的关系。土地革命战争时期，通过打土豪、分田地等政策巩固工农联盟；抗日战争时期，建立抗日民族统一战线，团结一切可以团结的力量共同抗击日本帝国主义；解放战争时期，扩大统一战线范围，联合民主党派和无党派人士，推翻国民党反动统治。三、坚持独立自主原则。中国共产党在统一战线中始终坚持领导权，保持自身的政治独立性，确保统一战线服务于新民主主义革命的根本任务。四、灵活制定统战策略。根据不同历史阶段的任务和形势，采取不同的合作形式和斗争方式，适时进行必要的妥协和斗争。五、广泛动员社会各阶层爱国力量。包括工人、农民、城市小资产阶级、民族资产阶级、开明绅士、知识分子以及海外华侨等，共同致力于国家独立、民族解放和社会进步。",p:["革命胜利经验"]},
{id:"c8q97",ch:8,t:"l",real:true,src:"2023年10月真题",fs:10,q:"中国共产党在过渡时期的总路线和总任务及其特点是什么？",
kw:["一化三改","逐步实现国家的社会主义工业化","目标明确","先农村后城市","和平赎买"],
ref:"过渡时期的总路线和总任务于1953年提出，内容概括为「一化三改」。一、总路线。要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、手工业和资本主义工商业的社会主义改造。二、总任务。通过发展生产力，把我国建设成为一个先进的社会主义国家，同时变革生产关系，确立社会主义经济基础。三、目标明确。工业化与社会主义改造并举，以工业化为核心，推动社会主义制度的建立。四、步骤有序。遵循先农村后城市、先集体化后工业化、先私营工商业后个体农业和手工业的顺序推进。五、和平过渡。采用和平赎买等方式，把私人资本主义经济转变为社会主义公有制经济，体现了中国特色社会主义改造的道路。",p:["过渡时期总路线"]},
{id:"c10q99",ch:10,t:"l",real:true,src:"2023年10月真题",fs:10,q:"为什么说中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折？",
kw:["思想路线的拨乱反正","两个凡是","以阶级斗争为纲","改革开放政策","和平与发展","和平共处五项原则"],
ref:"一、思想路线的拨乱反正。全会重新确立马克思主义的思想路线，坚决批判「两个凡是」的错误方针，确定了解放思想、实事求是的思想路线。二、政治路线的转变。全会停止使用「以阶级斗争为纲」的口号，作出把全党工作重点转移到社会主义现代化建设上来的战略决策。三、经济体制的重大改革。全会决定实行改革开放政策，开始从高度集中的计划经济体制向充满活力的社会主义市场经济体制转变的历史进程。四、法制建设的恢复和发展。全会提出必须加强社会主义法制，健全社会主义法制体系，保障公民权利。五、对外政策的新调整。全会提出和平与发展是当代世界的两大主题，主张按照和平共处五项原则发展同各国的友好合作关系。十一届三中全会开启了改革开放新时代，引领中国走上中国特色社会主义道路，对现代化建设和中华民族伟大复兴具有划时代意义。",p:["十一届三中全会"]},

{id:"c6q109",ch:6,t:"l",real:true,src:"2024年10月真题",fs:10,q:"毛泽东在《论持久战》中关于「抗日战争是持久战」「最后胜利属于中国」的论述。",
kw:["敌强我弱","敌小我大","敌退步我进步","敌寡助我多助","持久战","最后胜利"],
ref:"①中日战争不是任何别的战争，乃是半殖民地半封建的中国和帝国主义的日本之间在二十世纪三十年代进行的一个决死的战争。②中日双方存在着互相矛盾的四个特点：敌强我弱、敌小我大、敌退步我进步、敌寡助我多助。③一方面，日本是强国，中国是弱国，强国弱国的对比决定了抗日战争只能是持久战；另一方面，日本是小国，发动的是退步的、野蛮的侵略战争，在国际上失道寡助，而中国是大国，进行的是进步的、正义的反侵略战争，在国际上得道多助。④中国已经有了代表中华民族和中国人民根本利益的、政治上成熟的共产党及其领导的人民军队和抗日根据地，因此最后胜利又将是属于中国的。",p:["《论持久战》"]},
{id:"c9q102",ch:9,t:"l",real:true,src:"2024年10月真题",fs:10,q:"改革开放前中国社会主义建设取得的主要成就。",
kw:["工业体系","国民经济体系","基本生活需要","文化","国际地位","外交方针"],
ref:"①基本建立了独立的、比较完整的工业体系和国民经济体系，从根本上解决了工业化中「从无到有」的问题，使中国在赢得政治上的独立后也赢得了经济上的独立，为以后的发展奠定了牢固的物质技术基础。②人民的基本生活需要得到保障，生活水平逐步提高，文化、教育、医疗、科技事业得到长足发展，劳动者的健康水平和人均预期寿命明显提高。③国际地位得到提高，国际环境得到改善。我国坚持独立自主的和平外交方针，维护了世界和平，促进了人类进步事业的发展；1971年恢复在联合国的合法席位，1972年中美关系开始走向正常化、中日实现邦交正常化，为国内和平建设创造了良好的外部环境。",p:["建设成就"]},

{id:"c1q115",ch:1,t:"j",real:true,src:"2019年4月真题",fs:6,q:"中国封建社会的基本特点。",
kw:["封建土地所有制","小农经济","封建君主专制","儒家思想","封建宗法等级制度","发展缓慢"],
ref:"（1）经济上，封建土地所有制占主导地位，小农经济是基本生产结构，地主占有大部分土地，农民租种土地并受剥削压迫。（2）政治上，实行高度中央集权的封建君主专制制度，皇权至上的官僚体系层层控制。（3）文化上，以儒家思想为核心，宣扬三纲五常的封建伦理道德，禁锢人们思想。（4）社会结构上，族权和政权相结合的封建宗法等级制度占统治地位，等级森严。这些特点相互结合，使中国封建社会长期延续、发展缓慢。",p:["社会性质"]},
{id:"c3q112",ch:3,t:"j",real:true,src:"2019年4月真题",fs:6,q:"辛亥革命失败后孙中山为捍卫资产阶级民主革命成果所进行的斗争。",
kw:["善后大借款","二次革命","护国运动","临时约法","护法运动","民主共和"],
ref:"（1）反对袁世凯刺杀宋教仁和善后大借款，1913年发动二次革命，讨伐袁世凯。（2）反对袁世凯复辟称帝，1915年发表讨袁宣言，发动护国运动，迫使袁世凯取消帝制。（3）反对北洋军阀破坏《中华民国临时约法》、拒绝恢复国会，先后发动第一次、第二次护法运动。这些斗争虽未成功，但维护了民主共和的旗帜。护法运动失败后，孙中山认识到依靠军阀势力无法实现民主共和，转而寻求新的革命道路。",p:["二次革命","护国运动","护法运动"]},
{id:"c4q104",ch:4,t:"j",real:true,src:"2019年4月真题",fs:6,q:"中共三大的主要内容及意义。",
kw:["革命统一战线","个人名义加入国民党","独立性","第一次国共合作","国民革命"],

{id:"c5q110",ch:5,t:"j",real:true,src:"2019年4月真题",fs:6,q:"1931年召开的中华苏维埃第一次全国代表大会的主要内容。",
kw:["瑞金","宪法大纲","土地法令","中央执行委员会","临时中央政府","毛泽东"],
ref:"（1）1931年11月，中华苏维埃第一次全国代表大会在江西瑞金召开。（2）大会通过《中华苏维埃共和国宪法大纲》以及土地法令、劳动法、婚姻法等法律文件。（3）大会选举产生中华苏维埃共和国中央执行委员会，宣告中华苏维埃共和国临时中央政府成立。（4）毛泽东当选为中央执行委员会主席。大会的召开标志着农村革命根据地政权建设的重大进展。",p:["中华苏维埃"]},
{id:"c8q102",ch:8,t:"j",real:true,src:"2019年4月真题",fs:6,q:"新民主主义社会的五种经济成分及其特点。",
kw:["国营经济","合作社经济","个体经济","私人资本主义经济","国家资本主义经济","过渡性"],
ref:"（1）社会主义性质的国营经济，主要来自没收官僚资本，掌握国家经济命脉。（2）半社会主义性质的合作社经济，是劳动人民自愿联合的经济组织形式。（3）农民和手工业者的个体经济，在国民经济中占很大比重。（4）私人资本主义经济，即民族资本主义工商业。（5）国家资本主义经济，是国家与私人资本合作的经济形式。其特点是既有社会主义因素又有资本主义因素，本身具有过渡性，社会主义因素居于领导地位。",p:["社会主义制度确立"]},
{id:"c2q103",ch:2,t:"l",real:true,src:"2019年4月真题",fs:10,q:"戊戌维新运动的历史意义。",
kw:["爱国救亡运动","君主立宪制","思想启蒙运动","民主主义思想","社会风气"],
ref:"（1）戊戌维新运动是一次爱国救亡运动。在民族危亡的紧急关头，维新派掀起变法图存、维护民族独立和发展资本主义的救亡运动，反映了时代要求。（2）它是一场资产阶级性质的政治改革运动。维新派主张用君主立宪制取代君主专制制度，改革政府机构，一定程度上冲击了封建制度。（3）它是一场思想启蒙运动。维新派大力传播西方社会政治学说，批判封建君权和封建纲常伦理，有利于民主主义思想在中国的传播。（4）它在改革社会风气方面也有不可低估的意义，主张剪辫易服、废止缠足、兴办新式学堂，推动了社会习俗的革新。维新派还创办报刊、学会和学堂，促进了近代文化教育事业的发展。",p:["戊戌维新"]},
{id:"c7q99",ch:7,t:"l",real:true,src:"2019年4月真题",fs:10,q:"全国解放战争时期，各民主党派与中国共产党团结合作的主要表现。",
kw:["重庆谈判","国民大会","爱国民主运动","第二条战线","建立新中国"],
ref:"（1）重庆谈判和政协会议期间，各民主党派作为第三方面，同共产党一起为争取和平民主而共同奋斗，推动政协通过有利于人民的决议。（2）全面内战爆发后，民主党派中的大多数同共产党保持一致，拒绝参加国民党一手包办的「国民大会」，反对国民党炮制的「宪法」。（3）民主党派的许多成员积极参加和支持中共领导的爱国民主运动，在第二条战线上开展反内战、反饥饿、反迫害斗争，有的为此流血牺牲。（4）在人民解放战争节节胜利的形势下，各民主党派公开宣言，同共产党一道，为推翻国民党的反动统治和建立新中国而共同奋斗。（5）民主党派在同共产党合作中经受了考验，逐步接受新民主主义的主张，为中国共产党领导的多党合作和政治协商制度的形成奠定了基础。",p:["第三条道路"]},
{id:"c11q103",ch:11,t:"l",real:true,src:"2019年4月真题",fs:10,q:"中共十八大后党和国家事业的历史性成就和历史性变革给我们的启示。",
kw:["理论创新成果","行动指南","党中央和全党的核心","党的全面领导","全面从严治党","中国梦"],
ref:"（1）必须始终坚持用党的理论创新成果武装头脑、指导实践。习近平新时代中国特色社会主义思想是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，必须长期坚持。（2）必须始终维护党中央和全党的核心。维护习近平总书记的核心地位，对党、国家和全国各族人民至关重要，是战胜一切风险挑战的根本保证。（3）必须始终坚持和加强党的全面领导。党政军民学、东西南北中，党是领导一切的，只有坚持党的全面领导、推进全面从严治党，才能更好实现中华民族伟大复兴的中国梦。（4）必须坚持以人民为中心，依靠人民创造历史伟业，不断实现人民对美好生活的向往。",p:["十八大"]},

{id:"c2q105",ch:2,t:"j",real:true,src:"2019年10月真题",fs:6,q:"太平天国定都天京后先后颁布的两个社会改革方案及其特点。",
kw:["天朝田亩制度","平均分配土地","封建土地所有制","资政新篇","资本主义色彩","阶级基础"],
ref:"（1）《天朝田亩制度》是太平天国定都天京后颁布的纲领性文件，是一个以解决土地问题为中心的比较完整的社会改革方案。（2）它提出凡天下田天下人同耕的原则，代表了农民要求平均分配土地的强烈愿望，反映了农民反对封建土地所有制的普遍要求。（3）《资政新篇》是太平天国后期颁布的改革与建设方案，带有鲜明的资本主义色彩，主张发展近代工商业。（4）但它通篇未涉及农民问题和土地问题，这一致命弱点决定了它缺乏实施的阶级基础和社会条件，难以推行。",p:["太平天国"]},
{id:"c3q115",ch:3,t:"j",real:true,src:"2019年10月真题",fs:6,q:"辛亥革命时期中国资产阶级革命派的阶级基础和骨干力量。",
kw:["孙中山","民族资产阶级","小资产阶级知识分子","兴中会","中国同盟会"],
ref:"（1）中国资产阶级民主革命是由以孙中山为首的资产阶级革命派首先发动的。（2）其阶级基础是中国民族资产阶级。19世纪末20世纪初，民族资本主义有所发展，民族资产阶级力量壮大，要求推翻封建专制统治、发展资本主义。（3）其骨干力量是一批资产阶级、小资产阶级知识分子。他们接受西方资产阶级思想，组织革命团体，创办报刊，宣传革命主张。（4）1894年兴中会成立，1905年中国同盟会成立，标志着革命派组织上的统一，为辛亥革命准备了条件。",p:["辛亥革命"]},
{id:"c5q113",ch:5,t:"j",real:true,src:"2019年10月真题",fs:6,q:"井冈山农村革命根据地创建的历史意义。",
kw:["工农武装割据","深入农村","正确方向","武装斗争","土地革命","根据地建设"],
ref:"（1）它点燃了工农武装割据的星星之火，为共产党领导的其他各地的起义武装树立了榜样。（2）它从实践上开辟了一条在敌我力量十分悬殊的情况下，深入农村保存和发展革命力量的正确道路。（3）这条道路代表了1927年革命失败后中国革命发展的正确方向。（4）井冈山的斗争把武装斗争、土地革命和根据地建设结合起来，为农村包围城市、武装夺取政权理论的形成奠定了基础。",p:["井冈山根据地"]},
{id:"c6q116",ch:6,t:"j",real:true,src:"2019年10月真题",fs:6,q:"抗日战争胜利后的国际格局。",
kw:["帝国主义势力受到削弱","人民民主力量","美苏两极","全球战略计划","扶蒋反共"],
ref:"（1）帝国主义势力受到削弱，人民民主力量明显增长。德、意、日法西斯被打败，英、法力量衰落，社会主义苏联和各国人民民主力量发展壮大。（2）逐步打破了以维持欧洲大国均势为中心的传统的国际政治格局，形成了美苏两极的政治格局。（3）战后不久，美国拟订了一个准备称霸世界的所谓全球战略计划，推行遏制苏联、控制中间地带的外交政策。（4）这一格局对中国政局产生深刻影响，美国扶蒋反共，苏联对中国革命持消极态度，中国人民面临复杂的国际环境。",p:["抗战胜利"]},
{id:"c1q116",ch:1,t:"l",real:true,src:"2019年10月真题",fs:10,q:"近代中国半殖民地半封建社会的特点。",
kw:["财政和经济命脉","封建势力","土地所有制","资本主义有所发展","发展极不平衡","两大历史任务"],
ref:"（1）资本—帝国主义不但逐步操纵了中国的财政和经济命脉，而且逐步控制了中国的政治，日益成为支配中国的决定性力量。（2）中国的封建势力同外国侵略势力相勾结，成为外国压迫、奴役中国人民的社会基础和统治支柱。（3）中国自然经济的基础虽然遭到破坏，但是封建剥削制度的根基即封建地主的土地所有制依然在广大地区内保持着，成为中国走向现代化和民主化的严重障碍。（4）中国资本主义有所发展，并在政治、文化生活中起了一定的作用，但没有成为中国社会经济的主体。（5）中国各地区经济、政治和文化发展极不平衡，长期处于不统一状态。（6）广大人民毫无政治权利，生活极端贫困化。这些特点决定了近代中国社会的主要矛盾和两大历史任务。",p:["社会性质"]},
{id:"c4q105",ch:4,t:"l",real:true,src:"2019年10月真题",fs:10,q:"俄国十月革命对中国革命的影响。",
kw:["先进分子转向社会主义","经济落后的国家","反对帝国主义","新的方法","五四运动","中国共产党"],
ref:"（1）十月革命的胜利推动中国先进分子转向社会主义。它昭示资本主义并非唯一出路，给正在苦闷中探索的中国人以新的希望，李大钊等开始宣传马克思主义。（2）它表明经济落后的国家可以在社会主义思想指引下实现解放，启发中国人民重新考虑自己的道路。（3）苏维埃俄国号召反对帝国主义，宣布废除沙皇政府同中国签订的不平等条约，推动社会主义思想在中国的传播。（4）它昭示中国先进分子以新的方法开展革命，即依靠群众、组织政党、暴力革命，从此中国革命有了新的方向，为五四运动和中国共产党成立准备了思想条件，中国革命的面貌从此焕然一新。",p:["马克思主义传播"]},
{id:"c7q100",ch:7,t:"l",real:true,src:"2019年10月真题",fs:10,q:"中华人民共和国成立的历史意义。",
kw:["自立于世界民族之林","真正属于人民的共和国","民族独立和人民解放","由新民主主义向社会主义的过渡","新纪元","执政党"],
ref:"（1）中华人民共和国的成立，标志着中华民族以崭新姿态自立于世界民族之林。帝国主义、封建主义、官僚资本主义的统治被推翻，中国人民从此站起来了，成为国家的主人。（2）它建立了真正属于人民的共和国，结束了中国长期受侵略、受压迫的历史，实现了民族独立和人民解放。（3）国家基本统一，人民可以集中力量从事经济文化建设，为恢复和发展国民经济创造了条件。（4）它为实现由新民主主义向社会主义的过渡创造了政治前提，开辟了中国历史的新纪元。（5）中国共产党成为全国范围内的执政党，担负起领导全国各族人民建设新中国的重任。",p:["新中国诞生"]},

{id:"c2q106",ch:2,t:"j",real:true,src:"2020年8月真题",fs:6,q:"19世纪末，维新派与守旧派论战的主要问题及意义。",
kw:["要不要变法","君主立宪","废八股","第一次正面交锋","思想解放"],
ref:"（1）论战主要围绕三个问题展开：要不要变法；要不要兴民权、设议院，实行君主立宪；要不要废八股、改科举和兴学堂。（2）维新派与守旧派的论战，实质上是资产阶级思想与封建主义思想在中国的第一次正面交锋。它传播了西方资产阶级的政治学说和民权、平等观念，开阔了人们的眼界，为维新变法运动作了思想准备，推动了中国近代思想解放。",p:["戊戌维新"]},
{id:"c3q118",ch:3,t:"j",real:true,src:"2020年8月真题",fs:6,q:"兴中会的成立及其誓词。",
kw:["檀香山","第一个资产阶级革命组织","驱除鞑虏","创立合众政府","资产阶级政权"],
ref:"1894年，孙中山在檀香山组织兴中会，这是中国第一个资产阶级革命组织。1895年春，孙中山在香港成立兴中会总部，以「驱除鞑虏，恢复中国，创立合众政府」为誓词，决心推翻清政府，建立资产阶级政权。兴中会的成立标志着中国资产阶级民主革命活动的开始，它把反清斗争同建立共和制度结合起来，为后来的革命团体和政党的建立奠定了基础。",p:["革命组织"]},
{id:"c5q116",ch:5,t:"j",real:true,src:"2020年8月真题",fs:6,q:"大革命失败后国民党政府实行军事独裁统治的主要表现。",
kw:["庞大的军队","特务系统","保甲制度","文化专制主义","一党专政"],
ref:"大革命失败后，国民党政府实行军事独裁统治，主要表现有：（1）建立庞大的军队，以武力镇压人民的反抗和革命力量；（2）建立密布全国的特务系统，推行白色恐怖，迫害共产党人和进步人士；（3）大力推行保甲制度，严密控制城乡基层社会；（4）厉行文化专制主义，查禁进步书刊，迫害进步文化工作者。这些措施使国民党政权成为代表大地主大资产阶级利益的一党专政政权。",p:["国民党统治"]},
{id:"c6q120",ch:6,t:"j",real:true,src:"2020年8月真题",fs:6,q:"中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键。",
kw:["中流砥柱","全面抗战路线","敌后战场","救亡图存","民族先锋"],
ref:"中国共产党在全民族抗战中发挥了中流砥柱作用，这是中国人民抗日战争取得胜利的关键。（1）中国共产党自成立之日起就把实现中华民族伟大复兴作为自己的历史使命，在抗战中倡导并坚持全面抗战路线。（2）制定正确的战略策略，开辟广大敌后战场，成为坚持抗战的中坚力量。（3）中国共产党人以自己的政治主张、坚定意志和模范行动，支撑起全民族救亡图存的希望，引领着夺取战争胜利的正确方向，成为夺取抗战胜利的民族先锋。",p:["中共中流砥柱"]},
{id:"c7q103",ch:7,t:"j",real:true,src:"2020年8月真题",fs:6,q:"中国各民主党派形成时的社会基础及其性质。",
kw:["民族资产阶级","城市小资产阶级","知识分子","阶级联盟","中间路线"],
ref:"（1）社会基础：中国各民主党派形成时的社会基础，主要是民族资产阶级、城市小资产阶级以及同这些阶级相联系的知识分子和其他爱国分子。（2）性质：这些阶级、阶层的人们在反帝爱国和争取民主的共同要求基础上联合起来，因而民主党派是阶级联盟性质的政党，而不是单一阶级的政党。（3）它们一成立就同共产党建立了不同程度的合作关系，其政治主张大多带有中间路线的色彩，在反对国民党独裁统治、争取民主的斗争中发挥了重要作用。",p:["第三条道路"]},
{id:"c1q119",ch:1,t:"l",real:true,src:"2020年8月真题",fs:10,q:"中国半殖民地半封建社会的主要矛盾及其相互关系。",
kw:["帝国主义与中华民族的矛盾","封建主义与人民大众的矛盾","最主要的矛盾","亡国灭种","公开站在一条战线上"],
ref:"（1）在半殖民地半封建的中国，帝国主义与中华民族的矛盾、封建主义与人民大众的矛盾是两对主要矛盾，而帝国主义与中华民族的矛盾是各种矛盾中最主要的矛盾。（2）两对主要矛盾的关系是相互交织、彼此转化的：当外国列强向中国发动侵略战争时，为避免亡国灭种的危险，中国内部各阶级除汉奸、卖国贼外能够暂时团结对敌，阶级矛盾降到次要地位，民族矛盾上升为主要地位；当外国侵略者同中国封建政权相勾结，共同镇压中国革命，尤其是封建地主阶级对人民的压迫特别残酷时，中国人民往往用战争形式反对封建政权，阶级矛盾就上升为主要矛盾；当国内战争发展到直接威胁帝国主义在华利益以及封建地主阶级统治时，外国列强往往直接出兵镇压中国人民、援助中国反动派，这时帝国主义和国内封建主义完全公开站在一条战线上。",p:["主要矛盾"]},
{id:"c4q106",ch:4,t:"l",real:true,src:"2020年8月真题",fs:10,q:"中国共产党成立的历史意义。",
kw:["坚强的领导核心","科学的指导思想","马克思列宁主义","世界无产阶级社会主义革命","焕然一新","主心骨"],
ref:"（1）它标志着中国革命终于有了一个坚强的领导核心。中国共产党不仅代表着中国工人阶级的利益，而且代表着中国人民和中华民族的利益，使中国革命有了可信赖的组织者和领导者，使中国工人阶级有了自己的司令部。（2）中国革命从此有了一个科学的指导思想。中国共产党以马克思列宁主义基本原理观察和分析中国的问题，为中国人民指明了斗争的目标、革命的前途和走向胜利的道路。（3）沟通了中国革命与世界革命的联系。它把中华民族的解放运动同世界无产阶级社会主义革命运动相联结并成为其中的一部分，使中国革命有了新的前途。总之，自从有了中国共产党，中国革命的面目就焕然一新，中国人民谋求民族独立、人民解放和国家富强、人民幸福的斗争有了主心骨。",p:["中国共产党诞生"]},
{id:"c8q103",ch:8,t:"l",real:true,src:"2020年8月真题",fs:10,q:"中国共产党提出的过渡时期总路线反映了历史的必然。",
kw:["一化三改","国家工业化","资本主义经济力量弱小","农业合作化","国际环境","完全正确"],
ref:"中国共产党提出的过渡时期总路线简称「一化三改」，反映了历史的必然。（1）社会主义性质的国营经济力量相对比较强大，它是实现国家工业化的主要基础。国家的社会主义工业化，是国家独立和富强的当然要求和必要条件。（2）资本主义经济力量弱小、发展困难，不可能成为中国工业起飞的基础。（3）对个体农业进行社会主义改造，是保证工业发展、实现国家工业化的必要条件，必须通过农业合作化增产粮食和其他农产品，以满足人民生活和工业发展的需要。（4）当时的国际环境也促使中国选择社会主义。新中国成立后长期受到西方资本主义国家经济上、外交上和军事上的封锁遏制，只有社会主义的苏联能够援助中国。历史证明，这一选择十分必要、完全正确。",p:["过渡时期总路线"]},
{id:"c1q120",ch:1,t:"s",real:true,src:"2020年10月真题",q:"1840年鸦片战争前，中国封建社会的主要矛盾是",o:["地主阶级和农民阶级的矛盾","工人阶级和资产阶级的矛盾","地主阶级和资产阶级的矛盾","资产阶级和农民阶级的矛盾"],a:"A",x:"在封建社会中，地主阶级占有大量土地并残酷剥削农民，地主阶级与农民阶级的矛盾是社会主要矛盾。",p:["主要矛盾"]},

{id:"c4q108",ch:4,t:"j",real:true,src:"2020年10月真题",fs:6,q:"1926年至1927年北伐战争的直接打击目标和战略方针。",
kw:["北洋军阀","进军两湖","吴佩孚","孙传芳","张作霖"],
ref:"（1）直接目标：打倒帝国主义支持的北洋军阀。（2）战略方针：进军两湖，消灭吴佩孚；引兵东向，消灭孙传芳；北上解决张作霖。（3）北伐军采取集中兵力、各个歼敌的方针，首先在两湖战场取得决定性胜利，随后挥师东南、北上中原，不到半年时间就从珠江流域打到长江流域，沉重打击了北洋军阀的统治，为革命的进一步发展创造了有利条件。",p:["北伐战争"]},
{id:"c5q119",ch:5,t:"j",real:true,src:"2020年10月真题",fs:6,q:"八一南昌起义的历史意义。",
kw:["第一枪","独立领导革命战争","人民军队","武装夺取政权","土地革命战争"],
ref:"（1）南昌起义打响了武装反抗国民党反动统治的第一枪，体现了中国共产党人为中国人民的根本利益和中华民族的解放事业而前赴后继的革命精神。（2）南昌起义成为中国共产党独立领导革命战争、创建人民军队和武装夺取政权的伟大开端。（3）南昌起义揭开了土地革命战争的序幕，为中国革命培养了一批骨干力量，在中国革命史上具有重大的历史意义。",p:["南昌起义"]},
{id:"c6q122",ch:6,t:"j",real:true,src:"2020年10月真题",fs:6,q:"抗日民族统一战线中的中间势力及争取中间势力的主要条件。",
kw:["民族资产阶级","开明绅士","地方实力派","充足的力量","尊重他们的利益"],
ref:"（1）中间势力主要是指民族资产阶级、开明绅士和地方实力派。（2）争取中间势力需要一定条件：一是共产党要有充足的力量；二是尊重他们的利益；三是要同顽固派作坚决的斗争，并能一步一步地取得胜利。（3）顽固势力是指大地主大资产阶级的抗日派，即以蒋介石集团为代表的国民党亲英美派，他们既主张抗日，又限共、溶共、反共，因此必须坚持有理有利有节的斗争。",p:["抗日民族统一战线"]},
{id:"c3q119",ch:3,t:"l",real:true,src:"2020年10月真题",fs:10,q:"孙中山三民主义学说的内容及其意义。",
kw:["驱除鞑虏","创立民国","平均地权","资产阶级民主共和国","资产阶级民主革命纲领"],
ref:"（1）民族主义：包括「驱除鞑虏，恢复中华」两项内容。一是以革命手段推翻清朝政府，改变它一贯推行的民族歧视和民族压迫政策；二是建立中华民族独立的国家。（2）民权主义：其内容是「创立民国」，即推翻封建君主专制制度，建立资产阶级民主共和国，这是孙中山所说的政治革命。（3）民生主义：当时指的是「平均地权」，即核定全国土地的地价，现有地价仍属原主，革命后的增价归国家为国民共享，这是孙中山所说的社会革命。（4）意义：三民主义学说初步描绘出中国还不曾有过的资产阶级共和国方案，是一个比较完整而明确的资产阶级民主革命纲领，对推动革命的发展产生了重大而积极的影响。",p:["三民主义"]},
{id:"c9q116",ch:9,t:"l",real:true,src:"2020年10月真题",fs:10,q:"毛泽东关于社会主义建设阶段和现代化建设战略目标与步骤的思想。",
kw:["不发达的社会主义","比较发达的社会主义","现代农业","两步走","独立的比较完整的工业体系"],
ref:"（1）关于社会主义建设阶段，毛泽东指出社会主义可能分为两个阶段：第一个阶段是不发达的社会主义，第二个阶段是比较发达的社会主义，后一阶段可能比前一阶段需要更长的时间。（2）关于社会主义现代化建设的战略目标，毛泽东强调必须大力推进中国的现代化事业，把中国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的强国。（3）关于发展步骤，应当采取「两步走」发展战略：第一步，建立一个独立的比较完整的工业体系和国民经济体系；第二步，全面实现农业、工业、国防和科学技术的现代化，使中国的经济走在世界前列。这些思想为后来党制定现代化建设战略提供了重要启示。",p:["探索曲折"]},

{id:"c2q113",ch:2,t:"j",real:true,src:"2021年4月真题",fs:6,q:"资产阶级维新派宣传维新变法的主要活动。",
kw:["向皇帝上书","著书立说","介绍外国的变法","办学会","办报纸","设学堂"],
ref:"（1）向皇帝上书。康有为多次上书光绪皇帝，请求变法图强。（2）著书立说。康有为撰写《新学伪经考》《孔子改制考》，梁启超撰写《变法通议》，谭嗣同撰写《仁学》，系统宣传维新主张。（3）介绍外国的变法。维新派介绍俄国彼得大帝改革、日本明治维新等，为变法提供借鉴。（4）办学会、办报纸、设学堂。创办强学会、南学会等团体，开办《时务报》《国闻报》，设立时务学堂，培养维新人才。",p:["戊戌维新"]},
{id:"c5q121",ch:5,t:"j",real:true,src:"2021年4月真题",fs:6,q:"1927年9月毛泽东领导的湘赣边界秋收起义的特点。",
kw:["左派国民党","工农革命军","工农武装参加"],
ref:"（1）它放弃了「左派国民党」运动的旗号，公开打出了「工农革命军」的旗帜，表明起义开始以中国共产党独立领导的革命武装的面貌出现。（2）它不仅是军队的行动，而且有数量众多的工农武装参加。起义部队与工农群众相结合，体现了武装斗争与农民运动的结合。（3）起义受挫后，毛泽东率部向井冈山进军，创建农村革命根据地，开辟了农村包围城市、武装夺取政权的道路。",p:["秋收起义"]},
{id:"c6q125",ch:6,t:"j",real:true,src:"2021年4月真题",fs:6,q:"抗日民族统一战线中的顽固势力以及中国共产党与其斗争的政策和原则。",
kw:["大地主大资产阶级","限共","两面政策","又联合又斗争"],
ref:"（1）顽固势力是指大地主大资产阶级的抗日派，即以蒋介石集团为代表的国民党亲英美派。他们采取两面政策，既主张团结抗日，又限共、溶共、反共并摧残进步势力。（2）共产党必须以革命的两面政策对付他们，即贯彻又联合又斗争的政策，斗争不忘团结，团结不忘斗争，二者不可偏废，而以团结为主。（3）同顽固派作斗争时，应坚持有理、有利、有节的原则，做到有理即自卫，有利即胜利，有节即休战。",p:["抗日民族统一战线"]},
{id:"c8q107",ch:8,t:"j",real:true,src:"2021年4月真题",fs:6,q:"20世纪五十年代，我国对资本主义工商业实行和平赎买政策的特点。",
kw:["有偿地而不是无偿地","工作安排","选举权","政治安排"],
ref:"（1）有偿地而不是无偿地，逐步地而不是突然地改变资产阶级的所有制。国家通过支付定息等方式，对资本家进行赎买。（2）在改造他们的同时，给予他们以必要的工作安排，使资本家有工作可做，生活有保障。（3）不剥夺资产阶级的选举权，并且对于他们中间积极拥护社会主义改造、并在这个改造事业中有所贡献的代表人物给予恰当的政治安排。（4）在改造过程中，把对企业的改造与对人的改造结合起来，引导资本家逐步转变为自食其力的劳动者。",p:["资本主义工商业改造"]},
{id:"c7q104",ch:7,t:"l",real:true,src:"2021年4月真题",fs:10,q:"中国新民主主义革命胜利的主要原因。",
kw:["中国共产党的领导","毛泽东思想","人民群众","国际无产阶级","人民军队"],
ref:"（1）有了中国工人阶级的先锋队——中国共产党的领导。党以马克思列宁主义基本原理与中国实际相结合的毛泽东思想作为一切工作的指针，制定出符合中国国情和人民利益的纲领、路线、方针和政策；它最有远见，最富于牺牲精神，最坚定，从而赢得了中国人民的衷心拥护。（2）人民群众和各界人士的广泛参加和大力支持。工人、农民、城市小资产阶级群众是民主革命的主要力量；随着斗争的发展，民族资产阶级也逐步向共产党靠拢，形成广泛的人民民主统一战线。（3）国际无产阶级和人民群众的支持。中国革命得到苏联等国家和世界进步力量的同情与援助。（4）建立了强大的人民军队，坚持武装斗争，走农村包围城市、武装夺取政权的道路。",p:["革命胜利经验"]},
{id:"c11q115",ch:11,t:"l",real:true,src:"2021年4月真题",fs:10,q:"论述习近平关于实现中华民族伟大复兴中国梦的提出。",
kw:["复兴之路","国家富强","民族振兴","人民幸福","中国道路","中国精神","中国力量"],
ref:"（1）中共十八大结束不久，习近平在参观《复兴之路》展览时明确提出，实现中华民族伟大复兴就是中华民族近代以来最伟大的梦想，实现全面建成小康社会目标是实现中华民族伟大复兴中国梦的关键一步。现在，我们比历史上任何时期都更接近中华民族伟大复兴的目标，比历史上任何时期都更有信心、有能力实现这个目标。（2）2013年3月，习近平在十二届全国人大一次会议上进一步强调，实现中华民族伟大复兴的中国梦，就是要实现国家富强、民族振兴、人民幸福。（3）实现中国梦必须走中国道路，即中国特色社会主义道路；必须弘扬中国精神，即以爱国主义为核心的民族精神和以改革创新为核心的时代精神；必须凝聚中国力量，即中国各族人民大团结的力量。",p:["中国梦"]},

{id:"c4q112",ch:4,t:"j",real:true,src:"2021年10月真题",fs:6,q:"近代中国工人阶级的产生。",
kw:["外国资本主义在华企业","洋务运动","民族资本主义企业","破产农民","三重压迫"],
ref:"（1）鸦片战争后，外国资本主义在华企业中产生了中国最早的一批产业工人。（2）洋务运动创办的军事工业和民用企业中，产生了第二批产业工人。（3）民族资本主义企业中，产生了第三批产业工人。中国工人阶级的来源主要是破产农民和手工业者，他们深受帝国主义、封建势力和资产阶级的三重压迫与剥削，革命性最强。（4）中国工人阶级人数虽少，但集中程度高，主要集中在沿海沿江的大城市，具有组织性和纪律性，是中国新民主主义革命的主要力量。",p:["工人运动"]},
{id:"c4q113",ch:4,t:"j",real:true,src:"2021年10月真题",fs:6,q:"新文化运动兴起的标志及其主要阵地。",
kw:["青年杂志","新青年","北京大学","陈独秀"],
ref:"（1）标志：1915年9月，陈独秀在上海创办《青年杂志》（后改名为《新青年》），并在其中发表文章，主张思想启蒙、反对封建旧文化，标志着新文化运动的兴起。（2）主要阵地：《新青年》杂志成为新文化运动的主要舆论阵地，宣传民主与科学，反对旧道德、旧文学。北京大学因蔡元培实行兼容并包的办学方针，成为新文化运动的重要活动中心。（3）主要代表人物有陈独秀、李大钊、胡适、鲁迅等。",p:["新文化运动"]},
{id:"c5q124",ch:5,t:"j",real:true,src:"2021年10月真题",fs:6,q:"20世纪二三十年代在中国政治舞台上影响较大的中间党派。",
kw:["第三党","邓演达","中国民主同盟","第三条道路"],
ref:"（1）中国国民党临时行动委员会，又称第三党，1930年由邓演达等人在上海创建，主张平民革命、建立平民政权。（2）中国民主同盟，1941年在重庆成立，原称中国民主政团同盟，主张团结、民主、抗日，反对国民党一党专政。（3）中国民主建国会、中国民主促进会、九三学社、中国致公党等，也在抗日战争后期和解放战争时期先后成立，主张和平民主，反对内战独裁。（4）这些中间党派主张走第三条道路，但在国民党当局的压迫下，最终转向新民主主义革命，接受中国共产党的领导。",p:["中间党派"]},
{id:"c9q122",ch:9,t:"j",real:true,src:"2021年10月真题",fs:6,q:"毛泽东《论十大关系》的发表及其围绕的基本方针。",
kw:["调动一切积极因素","重工业和轻工业","中央和地方","苏联经验"],
ref:"（1）1956年4月，毛泽东在中央政治局扩大会议上作了《论十大关系》的报告。（2）报告围绕的基本方针是：调动一切积极因素，为社会主义事业服务。（3）报告论述了重工业和轻工业、农业的关系，沿海工业和内地工业的关系，经济建设和国防建设的关系，国家、生产单位和生产者个人的关系，中央和地方的关系等十个方面。（4）报告提出要以苏联经验为鉴戒，独立自主地探索适合中国国情的社会主义建设道路，是中国共产党探索社会主义建设道路的开端。",p:["《论十大关系》"]},
{id:"c11q118",ch:11,t:"j",real:true,src:"2021年10月真题",fs:6,q:"中共十九大关于我国社会主要矛盾和基本国情的判断。",
kw:["美好生活需要","不平衡不充分","社会主义初级阶段","最大发展中国家"],
ref:"（1）中共十九大指出，中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。（2）同时强调，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。（3）全党要牢牢把握社会主义初级阶段这个基本国情，牢牢立足社会主义初级阶段这个最大实际，坚持党的基本路线不动摇。（4）解决新时代社会主要矛盾，必须坚持以人民为中心的发展思想，贯彻新发展理念，推动人的全面发展和社会全面进步。",p:["社会主要矛盾"]},
{id:"c2q114",ch:2,t:"l",real:true,src:"2021年10月真题",fs:10,q:"论述洋务运动兴起及其指导思想和主要目的。",
kw:["内忧外患","中学为体","自强","求富","维护清朝封建统治"],
ref:"（1）兴起背景：19世纪60年代，清政府面临内忧外患。外部，第二次鸦片战争失败，列强侵略加剧；内部，太平天国等农民起义严重动摇清朝统治。（2）兴起：以奕䜣、曾国藩、李鸿章、左宗棠、张之洞等为代表的洋务派，主张学习西方，兴办洋务事业。（3）指导思想：以「中学为体，西学为用」为宗旨，前期以「自强」为主，创办军事工业、建立新式海军；后期以「求富」为主，兴办民用工业、发展交通和通讯。（4）主要目的：维护清朝封建统治，抵御外国侵略，镇压人民反抗，同时通过引进西方技术增强国力。（5）评价：洋务运动开启了中国近代化进程，但没有触动封建统治的根基，甲午战争的失败宣告洋务运动的破产。",p:["洋务运动"]},
{id:"c6q126",ch:6,t:"l",real:true,src:"2021年10月真题",fs:10,q:"论述日本侵略者在中国占领区建立的殖民政权。",
kw:["伪满洲国","汪精卫","以战养战","奴化教育","南京大屠杀"],
ref:"（1）在东北，1931年九一八事变后，日本扶植溥仪建立伪满洲国，实行政权傀儡化，由日本关东军实际控制。（2）在华北、华中、华南占领区，日本扶植汉奸政权，1940年成立以汪精卫为首的伪国民政府，作为其殖民统治的工具。（3）实行军事管制和高压统治，设立宪兵、特务和警察机构，推行保甲连坐，疯狂镇压抗日力量。（4）进行经济掠夺，推行「以战养战」政策，强占工矿和农业资源，把占领区经济纳入日本战争经济体系。（5）推行奴化教育和文化同化，强制学习日语，篡改历史，企图泯灭中国人民的民族意识。（6）制造南京大屠杀等暴行，实行残酷的屠杀和掠夺，充分暴露其殖民统治的野蛮本质。",p:["日本暴行"]},
{id:"c8q108",ch:8,t:"l",real:true,src:"2021年10月真题",fs:10,q:"论述我国对农业社会主义改造的基本原则和方针。",
kw:["自愿互利","典型示范","循序渐进","和平改造","贫农"],
ref:"（1）自愿互利原则。农民参加合作社必须出于自愿，合作社要让农民感到有利可图，确保农民的利益不受损害。（2）典型示范，逐步推广。先在条件成熟的地区试办初级农业生产合作社，取得经验后再向全国推广。（3）循序渐进，逐步过渡。农业社会主义改造分互助组、初级社、高级社三个阶段，逐步引导农民走向集体化。（4）和平改造，稳步前进。充分考虑农民的承受能力，避免激进措施，保证农村社会稳定。（5）依靠贫农、下中农，团结中农，限制和逐步消灭富农经济，把对农业的改造与发展生产结合起来。（6）国家给予必要的援助和扶持，在资金、技术、物资等方面支持合作社发展生产，使农民在合作化中得到实惠。",p:["农业改造"]},

{id:"c2q117",ch:2,t:"j",real:true,src:"2022年4月真题",fs:6,q:"简述洋务派创办的新式学堂。",
kw:["翻译学堂","工艺学堂","军事学堂","京师同文馆","福建船政学堂"],
ref:"洋务派创办的新式学堂大致分为三类。第一类是翻译学堂，以1862年设立的京师同文馆为代表，培养英、法、俄等外语翻译人才，以适应对外交涉的需要。第二类是工艺学堂，注重近代科技教育，培养电报、铁路、矿冶、机械制造等方面的技术人才，如江南机器制造总局附设的学堂。第三类是军事学堂，如福建船政学堂、天津水师学堂、北洋武备学堂等，专门培养新式海军和陆军军官。这些学堂的设立是中国近代教育史上的重大变革，标志着中国教育开始由传统向现代转变，培养了一批近代化人才，促进了西学在中国的传播，推动了社会进步。",p:["洋务运动"]},
{id:"c3q128",ch:3,t:"j",real:true,src:"2022年4月真题",fs:6,q:"简述辛亥革命失败后孙中山为捍卫革命成果所进行的斗争。",
kw:["二次革命","护国运动","护法运动","国民党一大","新三民主义"],
ref:"辛亥革命失败后，孙中山为捍卫革命成果进行了不懈斗争。1913年，因宋教仁被刺，孙中山领导南方各省发动讨袁的二次革命，但很快失败。1915年底袁世凯复辟帝制，孙中山号召全国反袁，护国运动兴起，迫使袁世凯取消帝制。1917年，孙中山南下广州组织护法军政府，反对段祺瑞拒绝恢复《临时约法》和国会，护法运动因受军阀排挤而失败。1924年，孙中山召开国民党一大，确立联俄、联共、扶助农工三大政策，重新解释三民主义，形成新三民主义，为国民革命统一战线奠定基础。这些斗争虽屡遭挫折，孙中山却始终坚守民主共和的理想。",p:["二次革命","护国运动","护法运动"]},
{id:"c5q127",ch:5,t:"j",real:true,src:"2022年4月真题",fs:6,q:"简述三湾改编的主要内容及意义。",
kw:["三湾村","支部建在连上","士兵委员会","党指挥枪","新型人民军队"],
ref:"1927年秋收起义受挫后，毛泽东在江西永新三湾村对起义部队进行改编。主要内容是：第一，将党的支部建在连上，班排设小组，营团以上设党委，实现党对军队的绝对领导；第二，建立士兵委员会，实行官兵平等，加强部队内部的民主建设；第三，精简机关，充实连队，增强基层部队的战斗力；第四，对愿意留队的人员进行审查登记，纯洁部队组织。三湾改编确立了党指挥枪的原则，是创建新型人民军队的重要开端，加强了军队的纪律性和战斗力，推动了军队政治工作的发展，为后来人民军队建设积累了宝贵经验。",p:["三湾改编"]},
{id:"c6q129",ch:6,t:"j",real:true,src:"2022年4月真题",fs:6,q:"简述抗日游击战争的战略地位及其作用。",
kw:["正规战争","敌后","抗日民主政权","抗日民族统一战线","持久抗战"],
ref:"抗日游击战争在抗日战争中具有重要的战略地位，它不仅是正规战争的有效补充，更是持久抗战中消耗敌人、保卫根据地、扩大人民武装、积蓄战略力量、配合正面战场作战的重要手段。其作用主要是：第一，深入敌后广泛开展游击活动，破坏敌人交通线和补给基地，牵制和分散大量日军兵力；第二，在敌占区建立抗日民主政权，组织群众抗日，稳固后方，为长期抗战提供依托；第三，连接主力部队与地方武装，巩固和扩大抗日民族统一战线；第四，锻炼和培养了大批军事指挥员和政治干部，积累了丰富的战争经验，为夺取抗战最后胜利打下基础。",p:["敌后战场"]},
{id:"c8q112",ch:8,t:"j",real:true,src:"2022年4月真题",fs:6,q:"简述新中国建立初期土地改革基本完成的历史意义。",
kw:["封建土地所有制","耕者有其田","农村生产力","工农联盟","人民民主专政"],
ref:"新中国建立初期，土地改革的基本完成具有重大历史意义。第一，废除了封建土地所有制，实现耕者有其田，农民成为土地的主人，生产积极性空前提高。第二，解放了农村生产力，促进了农业生产的迅速发展，为国民经济的恢复和发展创造了条件。第三，消灭了地主阶级，削弱了农村中的封建势力，巩固了新生的人民民主专政。第四，巩固了工农联盟，稳定了农村社会秩序，为社会主义改造和工业化建设准备了重要条件。",p:["土地改革"]},
{id:"c1q130",ch:1,t:"l",real:true,src:"2022年4月真题",fs:10,q:"论述近代中国半殖民地半封建社会的特点。",
kw:["国家主权","自然经济","官僚买办资本主义","两大主要矛盾","半殖民地半封建社会"],
ref:"近代中国半殖民地半封建社会，是鸦片战争后至新中国成立前中国社会的性质，其主要特点如下。第一，政治上，国家主权遭到严重破坏但未完全丧失，名义上仍保持独立，实际上领土完整、司法权、关税自主权等主权部分或全部丧失，逐渐沦为列强间接统治和支配的国家。第二，经济上，封建自然经济逐步解体，外国资本主义入侵使中国被迫卷入世界市场，成为列强的原料产地和商品倾销市场，同时产生了官僚买办资本主义和民族资本主义。第三，社会结构上，封建地主阶级与新兴资产阶级并存，农民和工人阶级日益壮大，逐渐成为反帝反封建革命的主要力量，城乡贫富差距加剧，社会矛盾尖锐。第四，文化上，西方思想文化大量涌入，与传统儒家文化碰撞交融，形成新旧文化交织的局面，促进了思想启蒙。第五，社会矛盾复杂，帝国主义与中华民族的矛盾、封建主义与人民大众的矛盾是两大主要矛盾，二者交织推动了中国社会变革和民族民主革命运动的兴起。",p:["社会性质"]},
{id:"c7q110",ch:7,t:"l",real:true,src:"2022年4月真题",fs:10,q:"论述毛泽东《论人民民主专政》一文关于建立人民民主专政的新中国的主张。",
kw:["人民民主专政","工人阶级","工农联盟","统一战线","人民代表大会制度"],
ref:"1949年6月30日，毛泽东发表《论人民民主专政》，系统阐明了建立新中国的政治主张。第一，关于政权性质，即将成立的中华人民共和国实行人民民主专政，它以工人阶级为领导、以工农联盟为基础，包括城市小资产阶级和民族资产阶级在内的广大人民共同参与，对反动派实行专政，既不同于资产阶级共和国，也与苏联的无产阶级专政有所区别。第二，关于阶级基础，工人阶级是领导力量，农民阶级是最主要的同盟军，同时团结城市小资产阶级和爱国的民族资产阶级，形成广泛的统一战线。第三，关于历史任务，人民民主专政要保障人民革命的胜利成果，镇压反革命，保护人民权利，组织和动员人民进行社会主义建设和改造，逐步过渡到社会主义社会。第四，关于外交政策，主张独立自主，反对帝国主义侵略，支持被压迫民族争取解放的斗争。第五，关于政治制度，这一论述奠定了人民代表大会制度以及中国共产党领导的多党合作和政治协商制度的基础。",p:["人民民主专政"]},
{id:"c11q119",ch:11,t:"l",real:true,src:"2022年4月真题",fs:10,q:"论述中共十九大提出的习近平新时代中国特色社会主义思想的核心内容。",
kw:["八个明确","五位一体","四个全面","人类命运共同体","中国共产党领导"],
ref:"中共十九大确立了习近平新时代中国特色社会主义思想，其核心内容集中体现为「八个明确」。第一，明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴，在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。第二，明确新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，必须坚持以人民为中心的发展思想。第三，明确中国特色社会主义事业总体布局是五位一体、战略布局是四个全面，强调坚定道路自信、理论自信、制度自信、文化自信。第四，明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。第五，明确全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。第六，明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队。第七，明确中国特色大国外交要推动构建新型国际关系，推动构建人类命运共同体。第八，明确中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，党是最高政治领导力量，提出新时代党的建设总要求。",p:["习近平思想"]},

{id:"c2q118",ch:2,t:"j",real:true,src:"2022年10月真题",fs:6,q:"简述洋务运动兴办军用工业和民用企业的目的。",
kw:["镇压太平天国","海防","交通运输","军用工业"],
ref:"洋务派举办洋务事业是从近代军用工业着手的，其目的首先是为了镇压太平天国起义；同时，也是为了加强海防、边防，抵御外国侵略，维护清朝统治。从19世纪70年代开始，洋务派在继续办军事工业的同时，开始举办民用企业，主要目的是为了解决办军事工业对煤铁等原料的需求和交通运输的需要，并试图以民用企业的利润弥补军用工业的亏空。民用企业的举办也在客观上促进了近代民用工业的发展。",p:["洋务运动"]},
{id:"c4q121",ch:4,t:"j",real:true,src:"2022年10月真题",fs:6,q:"简述中共四大的中心议题和主要贡献。",
kw:["领导权","工农联盟","工农运动","党的组织"],
ref:"1925年1月，中国共产党第四次全国代表大会在上海举行。大会的中心议题是讨论党如何领导即将到来的革命高潮。大会的主要贡献在于：提出了无产阶级在民主革命中的领导权问题，指出无产阶级应当取得革命运动的领导地位；提出了工农联盟问题，认为农民是工人阶级的天然同盟者；制定了开展工人运动、农民运动等工农运动的计划；决定在全国建立和加强党的组织，以适应革命形势发展的要求。这些主张回答了革命领导权和同盟军等基本问题，为迎接大革命高潮作了思想和组织准备。",p:["国民革命"]},
{id:"c5q129",ch:5,t:"j",real:true,src:"2022年10月真题",fs:6,q:"简述1927年毛泽东领导的湘赣边界秋收起义的特点。",
kw:["工农革命军","工农武装","井冈山","农村包围城市"],
ref:"1927年9月，毛泽东领导湘赣边界秋收起义，其主要特点是：第一，放弃了「左派国民党」运动的旗号，公开打出了「工农革命军」的旗帜，表明中国共产党独立领导革命战争的决心。第二，不仅是军队的行动，而且有数量众多的工农武装参加，具有广泛的群众基础。第三，起义受挫后改变原定攻打长沙的计划，向敌人统治力量薄弱的农村进军，开始了创建井冈山革命根据地的斗争，成为农村包围城市道路的起点。",p:["秋收起义"]},
{id:"c10q135",ch:10,t:"j",real:true,src:"2022年10月真题",fs:6,q:"简述邓小平在南方谈话中提出的判断改革开放是非的主要标准。",
kw:["三个有利于","生产力","综合国力","生活水平"],
ref:"邓小平在南方谈话中明确提出，判断改革开放是非的标准，主要看是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平，这就是「三个有利于」标准。这一标准把是否促进生产力发展、是否增强国家综合实力、是否改善人民生活作为衡量改革和各项工作得失的根本尺度，为坚持改革开放、加快经济发展提供了判断依据，推动了思想解放和社会主义市场经济体制的建立。",p:["南方谈话"]},
{id:"c1q131",ch:1,t:"l",real:true,src:"2022年10月真题",fs:10,q:"论述近代中国工人阶级的产生及其特点。",
kw:["产业工人","三重压迫","相对集中","工农联盟","破产农民"],
ref:"近代中国工人阶级随着外资企业、洋务企业和民族资本主义企业的兴办而逐步产生。鸦片战争后，外国资本在广州、上海等地经营近代工商业，产生了中国最早的一批产业工人；19世纪60年代后，洋务企业中又产生一批产业工人；70年代后，民族资本主义企业的发展使产业工人队伍进一步扩大。近代中国工人阶级具有三个显著特点。第一，深受帝国主义、封建势力和资产阶级的三重压迫与剥削，劳动条件恶劣、工资低微，因而革命性最强。第二，人数虽少，但相对集中，主要集中于沿海沿江的大城市和大型企业中，便于形成革命力量。第三，主要由破产农民和家庭手工业者转化而来，同农民有着天然联系，便于结成工农联盟。",p:["社会性质"]},
{id:"c9q127",ch:9,t:"l",real:true,src:"2022年10月真题",fs:10,q:"论述中共八大的基本任务及其对国内主要矛盾和主要任务的分析。",
kw:["基本任务","主要矛盾","先进的工业国","社会生产力","主要任务"],
ref:"1956年9月，中共八大召开。大会的基本任务是：总结党的第七次全国代表大会以来的经验，团结全党，团结国内外一切可能团结的力量，为建设一个伟大的社会主义中国而奋斗。大会对国内主要矛盾和主要任务作出了正确分析：社会主义改造基本完成后，国内的主要矛盾已经是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，已经是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。这一矛盾的实质，是先进的社会主义制度同落后的社会生产力之间的矛盾。党和全国人民当前的主要任务，是集中力量解决这一矛盾，把我国尽快地从落后的农业国变为先进的工业国。八大的分析为社会主义事业指明了方向。",p:["中共八大"]},

{id:"c2q119",ch:2,t:"j",real:true,src:"2016年4月真题",fs:6,q:"太平天国定都天京后，先后颁布的两个重要纲领及其特点。",
kw:["天朝田亩制度","资政新篇","平均分配土地","资本主义色彩"],
ref:"1853年冬颁布《天朝田亩制度》，这是以解决农民土地问题为中心的比较完整的社会改革方案，代表了农民要求平均分配土地的愿望，最能体现太平天国社会理想。太平天国后期，洪仁玕提出《资政新篇》，作为统筹全局的建议，这是一个带有鲜明资本主义色彩的改革与建设方案，但通篇未涉及农民土地问题。前者从根本上否定了封建土地所有制，但具有空想性质，实际上并未能实行；后者是近代中国最早提出的发展资本主义的纲领，由于缺乏社会基础，也未能付诸实施。",p:["太平天国"]},
{id:"c4q122",ch:4,t:"j",real:true,src:"2016年4月真题",fs:6,q:"五四运动的历史特点和历史意义。",
kw:["彻底的反帝反封建","群众性的革命运动","马克思主义在中国的广泛传播","新民主主义革命的开端"],
ref:"第一，五四运动是中国近代史上一次彻底的反帝反封建的革命运动，把中国人民反帝反封建的斗争提升到一个新的水平线上。第二，五四运动广泛地动员和组织了群众，是一场真正的群众性的革命运动。第三，五四运动促进了马克思主义在中国的广泛传播，促进了马克思主义同中国工人运动的结合，为中国共产党的成立作了思想和干部上的准备。第四，五四运动是中国新民主主义革命的开端，从此中国革命进入了新的历史阶段。",p:["五四运动"]},
{id:"c5q131",ch:5,t:"j",real:true,src:"2016年4月真题",fs:6,q:"遵义会议集中解决的主要问题及其意义。",
kw:["军事问题和组织问题","生死攸关的转折点","政治上走向成熟","挽救了中国革命"],
ref:"遵义会议集中全力解决了当时具有决定意义的军事问题和组织问题。会议批评了博古、李德在第五次反「围剿」中的错误，肯定了毛泽东的正确主张，改组了中央领导机构，开始确立了以毛泽东为代表的新的中央的领导。遵义会议在极其危急的情况下挽救了中国共产党、挽救了中国工农红军、挽救了中国革命，成为中国共产党历史上一个生死攸关的转折点，标志着中国共产党在政治上走向成熟。",p:["遵义会议"]},
{id:"c10q137",ch:10,t:"j",real:true,src:"2016年4月真题",fs:6,q:"1979年3月，邓小平提出的四项基本原则及坚持这些原则的重要性。",
kw:["四项基本原则","根本前提","立国之本","人民民主专政"],
ref:"1979年3月，邓小平在理论工作务虚会上提出，必须坚持社会主义道路，坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、毛泽东思想。这四项基本原则是实现四个现代化的根本前提，如果动摇了其中的任何一项，那就动摇了整个社会主义现代化建设事业。四项基本原则回答了我国走什么道路、实行什么国体、由谁领导、以什么思想为指导等根本问题，是立国之本，必须始终不渝地坚持下去。",p:["四项基本原则"]},
{id:"c7q116",ch:7,t:"l",real:true,src:"2016年4月真题",fs:10,q:"中国新民主主义革命取得胜利的主要原因。",
kw:["中国工人阶级先锋队","毛泽东思想","民族资产阶级","国际无产阶级","根本保证"],
ref:"第一，有了中国工人阶级先锋队即中国共产党的领导。党以马克思列宁主义基本原理与中国实际相结合的毛泽东思想作为一切工作的指针，制定出符合中国国情和人民利益的纲领、路线、方针和政策；它有远见，最富于牺牲精神，最坚定，从而赢得了中国人民的衷心拥护。第二，人民群众和各界人士的广泛参加和大力支持。工人、农民、城市小资产阶级群众是民主革命的主要力量，随着斗争的发展，民族资产阶级也逐步向共产党靠拢。第三，国际无产阶级和人民群众的支持，中国人民的革命事业得到世界进步力量的同情和援助，这是取得胜利的重要国际条件。总之，中国共产党的领导是中国革命取得胜利的根本保证。",p:["革命胜利经验"]},
{id:"c9q128",ch:9,t:"l",real:true,src:"2016年4月真题",fs:10,q:"毛泽东等老一代革命家探索中国社会主义民主政治建设道路的理论贡献。",
kw:["政治局面","人民内部矛盾","长期共存","爱国统一战线","社会主义法制"],
ref:"第一，我们的目标是造成一个又有集中又有民主，又有纪律又有自由，又有统一意志、又有个人心情舒畅、生动活泼的政治局面。第二，把正确处理人民内部矛盾作为国家政治生活的主题，坚持人民民主，团结一切可以团结的力量。第三，处理好中国共产党同各民主党派的关系，坚持长期共存、互相监督的方针，巩固和扩大爱国统一战线。第四，切实保障人民当家作主的各项权利，尤其是人民参与国家和社会事务管理的权利。第五，社会主义法制要保护劳动人民利益，保护社会主义经济基础，保护社会生产力。这些探索成果为新时期社会主义民主政治建设提供了重要的思想基础。",p:["人民内部矛盾"]},

{id:"c2q123",ch:2,t:"j",real:true,src:"2016年10月真题",fs:6,q:"洋务运动的指导思想和洋务派举办的洋务事业。",
kw:["中学为体","江南制造总局","北洋水师","派遣留学生"],
ref:"指导思想：冯桂芬对兴办洋务事业的指导思想最先作出比较完整的表述，提出以中国之伦常名教为原本，辅以诸国富强之术，这一思想后来被概括为「中学为体，西学为用」。洋务事业：第一，兴办近代企业，最早兴办的是军用工业，江南制造总局是洋务派办的第一个规模较大的近代军事工业。第二，建立新式海陆军，到19世纪90年代分别建成福建水师、广东水师、南洋水师和北洋水师，其中北洋水师是清政府海军的主力。第三，创办新式学堂，派遣留学生，培养了一批近代人才。",p:["洋务运动"]},
{id:"c4q125",ch:4,t:"j",real:true,src:"2016年10月真题",fs:6,q:"1926年至1927年，北伐战争直接打击的目标和战略方针。",
kw:["北洋军阀","集中兵力","吴佩孚","孙传芳","张作霖"],
ref:"北伐的直接目标是打倒帝国主义支持的北洋军阀。北伐军在以加伦为首的苏联军事顾问的建议下，制定了集中兵力、各个歼灭的战略方针：首先以主力进军两湖，消灭吴佩孚；然后引兵东向，消灭孙传芳；最后北上解决张作霖。北伐战争在不到半年的时间里，从珠江流域推进到长江流域，沉重打击了帝国主义和北洋军阀的统治，推动了工农运动的高涨。",p:["北伐战争"]},
{id:"c6q137",ch:6,t:"j",real:true,src:"2016年10月真题",fs:6,q:"中国人民抗日战争胜利的主要原因。",
kw:["伟大民族精神","中流砥柱","全民族抗战","国际条件","第一次完全胜利"],
ref:"第一，以爱国主义为核心的伟大民族精神是中国人民抗日战争胜利的决定因素。第二，中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键。第三，全民族抗战是中国人民抗日战争胜利的重要法宝，全国各族人民团结一致、共赴国难。第四，世界所有爱好和平和正义的国家和人民、国际组织以及各种反法西斯力量的同情和支持，是中国人民抗日战争取得胜利的国际条件。中国人民抗日战争的胜利，是近代以来中国抗击外敌入侵的第一次完全胜利，为中华民族由衰败走向复兴奠定了基础。",p:["抗战胜利"]},
{id:"c8q125",ch:8,t:"j",real:true,src:"2016年10月真题",fs:6,q:"新中国建立初期中国共产党面临的主要问题和考验。",
kw:["巩固新生的人民政权","恢复和发展国民经济","国家主权和安全","执政的考验"],
ref:"第一，能不能保卫住人民胜利的成果，巩固新生的人民政权。第二，能不能战胜严重的经济困难，迅速恢复和发展国民经济。第三，能不能巩固民族独立，维护国家主权和安全。第四，能不能经受住执政的考验，继续保持谦虚、谨慎、不骄、不躁的作风和艰苦奋斗的作风。中国共产党以清醒的头脑面对这些考验，领导全国人民为巩固政权、恢复经济而斗争，并取得了重大胜利。",p:["国民经济恢复"]},
{id:"c9q131",ch:9,t:"j",real:true,src:"2016年10月真题",fs:6,q:"毛泽东提出的社会主义现代化建设的战略目标和步骤。",
kw:["现代农业","两步走","工业体系和国民经济体系","走在世界前列"],
ref:"社会主义现代化建设的战略目标，是要把中国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的强国。实现这一目标，采取「两步走」的发展战略：第一步，建成一个独立的比较完整的工业体系和国民经济体系；第二步，全面实现农业、工业、国防和科学技术的现代化，使中国的经济走在世界前列。这一战略目标和步骤，为新中国经济建设指明了长远方向。",p:["建设成就"]},
{id:"c1q134",ch:1,t:"l",real:true,src:"2016年10月真题",fs:10,q:"近代中国社会的主要矛盾及其相互关系。",
kw:["帝国主义与中华民族的矛盾","封建主义与人民大众的矛盾","民族矛盾上升到主要地位","阶级矛盾就上升为主要矛盾","中外反动势力的勾结"],
ref:"在半殖民地半封建的中国，帝国主义与中华民族的矛盾、封建主义与人民大众的矛盾是两对主要矛盾，而帝国主义与中华民族的矛盾是各种矛盾中最主要的矛盾。两对主要矛盾之间的关系是相互交织、相互转化的。第一，当外国列强向中国发动侵略战争时，为避免亡国灭种的危险，中国内部各阶级除汉奸、卖国贼外能够暂时团结起来共同对敌，阶级矛盾降到次要地位，而民族矛盾上升到主要地位，鸦片战争、第二次鸦片战争、中法战争等都是这种情况。第二，当外国侵略者同中国封建政权相勾结，共同镇压中国革命，尤其是封建地主对人民的压迫特别残酷时，中国人民往往用战争的形式反对封建政权，这时阶级矛盾就上升为主要矛盾，如太平天国农民起义和辛亥革命。第三，当国内战争发展到直接威胁帝国主义在华利益以及中国封建地主阶级统治时，外国列强甚至直接出兵，镇压中国人民，援助中国反动派，这时帝国主义和国内封建主义完全公开站在一条战线上，如太平天国农民起义后期中外反动势力的勾结。",p:["主要矛盾"]},
{id:"c5q133",ch:5,t:"l",real:true,src:"2016年10月真题",fs:10,q:"中国工农红军长征胜利的历史意义。",
kw:["转危为安的关键","大本营放在了西北","革命的火种","长征精神","生死相依"],
ref:"第一，它粉碎了国民党「围剿」红军、消灭革命力量的企图，是中国革命转危为安的关键。第二，通过长征，把中国革命的大本营放在了西北，为迎接中国人民抗日救亡的新高潮准备了条件。第三，长征保存并锤炼了中国革命的骨干力量，这是党和红军极为宝贵的精华。第四，长征播撒了革命的火种，向沿途人民群众宣布，只有在中国共产党的领导下，中国各族人民才能翻身得解放。第五，长征铸就了伟大的长征精神。长征精神就是把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利的精神；就是为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神；就是坚持独立自主、实事求是，一切从实际出发的精神；就是顾全大局、严守纪律、紧密团结的精神；就是紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗的精神。",p:["长征","长征精神"]},
{id:"c7q118",ch:7,t:"l",real:true,src:"2016年10月真题",fs:10,q:"中国新民主主义革命胜利的基本经验。",
kw:["广泛统一战线","两个联盟","武装斗争","惩前毖后"],
ref:"第一，建立广泛统一战线。统一战线存在着两个联盟：一个是劳动者联盟，主要是工人、农民和城市小资产阶级的联盟，这是基本的、主要的；一个是劳动者与非劳动者的联盟，主要是劳动者与民族资产阶级的联盟。必须坚决依靠第一个联盟，争取建立和扩大第二个联盟，巩固和扩大统一战线的关键是坚持工人阶级及其政党的领导权。第二，坚持革命的武装斗争。中国革命只能以长期的武装斗争作为主要形式，中国的武装斗争实质上是工人阶级领导的农民战争。第三，加强共产党自身建设，着重从思想上建党，党内斗争中实行「惩前毖后，治病救人」的方针，通过批评与自我批评进行马克思主义思想教育的整风形式。人民民主专政的新中国的创建，标志着近代以来中国面临的争取民族独立、人民解放这个历史任务的基本完成。",p:["革命胜利经验"]},

{id:"c10q144",ch:10,t:"s",real:true,src:"2017年4月真题",q:"1999年12月，中国在推进国家统一大业方面迈出的重要一步是",o:["海峡两岸达成「九二共识」","海峡两岸举行「汪辜会谈」","恢复对香港行使主权","恢复对澳门行使主权"],a:"D",x:"1999年12月20日中国对澳门恢复行使主权，澳门特别行政区成立，标志着祖国统一大业又向前迈出重要一步。",p:["祖国统一"]},
{id:"c10q145",ch:10,t:"s",real:true,src:"2017年4月真题",q:"2005年3月，第十届全国人民代表大会第三次会议通过的法律是",o:["《香港特别行政区基本法》","《国家安全法》","《澳门特别行政区基本法》","《反分裂国家法》"],a:"D",x:"2005年3月十届全国人大三次会议通过《反分裂国家法》，以立法形式表达维护国家领土主权完整的坚强决心。",p:["祖国统一"]},
{id:"c1q136",ch:1,t:"j",real:true,src:"2017年4月真题",fs:6,q:"近代中国社会的主要矛盾及其影响。",
kw:["帝国主义与中华民族的矛盾","封建主义与人民大众的矛盾","最主要的矛盾","决定性作用","民族民主革命","两大历史任务","反帝反封建"],
ref:"（1）在半殖民地半封建的中国，帝国主义与中华民族的矛盾、封建主义与人民大众的矛盾是两对主要矛盾，其中帝国主义与中华民族的矛盾是最主要的矛盾。（2）两对矛盾相互交织，贯穿整个半殖民地半封建社会始终，对中国社会的发展变化起决定性作用。（3）近代中国的民族民主革命就是在这些矛盾及其激化的基础上发生和发展起来的，中国人民近百年不屈不挠的斗争就是为了解决主要矛盾、推动社会前进。（4）近代中国面临争取民族独立和人民解放、实现国家富强和人民幸福两大历史任务，中国人民肩负反帝反封建的双重任务。",p:["主要矛盾"]},
{id:"c3q140",ch:3,t:"j",real:true,src:"2017年4月真题",fs:6,q:"资产阶级革命派与改良派论战的焦点及革命派在这一问题上的主张。",
kw:["革命手段推翻清政府","卖国媚外","救世救人","破坏与建设","帝国主义干涉","民主革命思想"],
ref:"（1）1905年至1907年，资产阶级革命派与改良派展开论战，要不要以革命手段推翻清政府是论战的焦点。（2）革命派控诉清政府卖国媚外的罪行，强调救国必先推翻清王朝，认为革命虽不免流血，但可以救世救人，是治疗社会的捷径。（3）革命派指出革命就是为了建设，破坏与建设是革命的两个方面，驳斥了改良派所谓革命招致内乱的谬论。（4）革命派还驳斥了改良派关于革命会引起帝国主义干涉的说法，宣传了革命的必要性和合理性，促进了民主革命思想的传播。",p:["革命论战"]},
{id:"c5q136",ch:5,t:"j",real:true,src:"2017年4月真题",fs:6,q:"毛泽东领导的湘赣边界秋收起义的特点。",
kw:["工农革命军的旗帜","工农武装参加","安源工人","引兵井冈山","农村包围城市","中国革命新道路"],
ref:"（1）1927年9月，毛泽东领导湘赣边界秋收起义，放弃了左派国民党的运动旗号，公开打出工农革命军的旗帜，鲜明地表明了革命的独立性质。（2）起义不仅是军队的行动，而且有数量众多的工农武装参加，吸收了安源工人和湘赣边界农民参加，具有广泛的群众基础。（3）起义受挫后，毛泽东决定向敌人力量薄弱的农村进军，引兵井冈山，开辟了农村包围城市、武装夺取政权的道路，成为中国革命新道路的开端。",p:["秋收起义"]},
{id:"c6q139",ch:6,t:"j",real:true,src:"2017年4月真题",fs:6,q:"中国共产党在全民族抗战中的中流砥柱作用。",
kw:["中流砥柱作用","全面抗战路线","敌后战场","救亡图存","抗日民族统一战线","民族先锋"],
ref:"（1）中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键，中国共产党自成立之日起就把实现中华民族伟大复兴作为自己的历史使命。（2）抗日战争中，中国共产党坚持全面抗战路线，制定正确的战略策略，开辟广大敌后战场，成为坚持抗战的中坚力量。（3）中国共产党人以自己的政治主张、坚定意志和模范行动，支撑起全民族救亡图存的希望，引领着夺取战争胜利的正确方向。（4）中国共产党坚持抗日民族统一战线，维护国共合作，反对妥协投降，成为夺取抗战胜利的民族先锋。",p:["中共中流砥柱"]},
{id:"c8q129",ch:8,t:"j",real:true,src:"2017年4月真题",fs:6,q:"中国共产党在过渡时期总路线的内容及其特点。",
kw:["社会主义工业化","农业","手工业","资本主义工商业","一化三改","同时并举","发展生产力"],
ref:"（1）1953年中共中央正式提出党在过渡时期的总路线，明确规定要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、对手工业和对资本主义工商业的社会主义改造。（2）这条总路线简称一化三改，是社会主义建设同社会主义改造同时并举的总路线。（3）一化反映生产力方面的要求，三改反映对生产关系的改造，二者相互促进，体现了发展生产力和变革生产关系的有机统一。（4）其实质是使生产资料的社会主义公有制成为国家和社会唯一的经济基础。",p:["过渡时期总路线"]},
{id:"c2q124",ch:2,t:"l",real:true,src:"2017年4月真题",fs:10,q:"太平天国农民战争的历史意义。",
kw:["统治根基","旧式农民战争的最高峰","天朝田亩制度","资政新篇","精神支柱","外国侵略势力","亚洲的民族解放运动"],
ref:"（1）太平天国起义沉重打击了封建统治阶级，强烈撼动了清政府的统治根基。起义坚持十四年之久，势力扩展到十八个省，规模大、时间长、影响深，加速了清王朝的衰败过程。（2）它是中国旧式农民战争的最高峰，具有不同于以往农民战争的新特点。太平天国建立了自己的政权，颁布《天朝田亩制度》，比较完整地表达了农民对土地的渴望；《资政新篇》是中国近代史上第一个具有资本主义色彩的方案。（3）太平天国对孔子和儒家经典予以严厉批判，在一定程度上削弱了封建统治的精神支柱。（4）起义有力打击了外国侵略势力，太平天国将领拒绝不平等条约、严禁鸦片贸易，与外国侵略军进行了英勇斗争。（5）起义鼓舞和推动了当时亚洲的民族解放运动，冲击了西方殖民主义在亚洲的统治。",p:["太平天国"]},
{id:"c4q127",ch:4,t:"l",real:true,src:"2017年4月真题",fs:10,q:"五四运动的历史特点及意义。",
kw:["彻底的反帝反封建","群众性革命运动","先锋作用","独立的政治力量","马克思主义","新民主主义革命的开端","无产阶级"],
ref:"（1）五四运动是中国近代史上一次彻底的反帝反封建的革命运动，把中国人民反帝反封建的斗争提升到新的水平。（2）五四运动广泛地动员和组织了群众，是一场真正的群众性革命运动。青年学生起了先锋作用，工人阶级第一次作为独立的政治力量登上政治舞台，在运动后期发挥主力军作用。（3）五四运动促进了马克思主义在中国的广泛传播，促进了马克思主义同中国工人运动的结合，为中国共产党成立作了思想和干部上的准备。（4）五四运动是中国新民主主义革命的开端。五四运动后，无产阶级代替资产阶级成为中国革命的领导者，中国革命进入新民主主义革命时期。",p:["五四运动"]},
{id:"c7q120",ch:7,t:"l",real:true,src:"2017年4月真题",fs:10,q:"全国解放战争时期，各民主党派与中国共产党团结合作的主要表现。",
kw:["第三方面","国民大会","第二条战线","流血牺牲","战略反攻","多党合作和政治协商制度"],
ref:"（1）重庆谈判和政协会议期间，各民主党派作为第三方面，同共产党一起反对国民党反动派的内战、独裁政策，为和平民主而共同努力。（2）国民党当局撕毁政协协议、发动全面内战后，民主党派中的大多数同共产党保持一致，拒绝参加国民党一手包办的国民大会，反对国民党炮制的宪法。（3）民主党派的许多成员积极参加和支持中国共产党领导的爱国民主运动，在第二条战线上开展反内战、反饥饿、反迫害斗争，有的为此流血牺牲，如李公朴、闻一多、杜斌丞。（4）在人民解放战争转入战略反攻并取得节节胜利的形势下，1948年初各民主党派公开宣言，站在人民革命一边，同共产党一道为推翻国民党反动统治、建立新中国而共同奋斗。（5）民主党派在同共产党合作中经受考验，逐步接受新民主主义主张，为中国共产党领导的多党合作和政治协商制度的形成奠定了基础。",p:["第三条道路"]},
{id:"c1q137",ch:1,t:"s",real:true,src:"2017年10月真题",q:"中国半殖民地半封建社会最主要的矛盾是",o:["地主阶级与农民阶级的矛盾","资产阶级与工人阶级的矛盾","帝国主义与中华民族的矛盾","封建主义与人民大众的矛盾"],a:"C",x:"近代中国有帝国主义与中华民族、封建主义与人民大众两对主要矛盾，其中帝国主义与中华民族的矛盾是最主要的矛盾。",p:["主要矛盾"]},

{id:"c4q128",ch:4,t:"s",real:true,src:"2017年10月真题",q:"1922年1月，中国共产党领导的第一次工人运动高潮的起点是",o:["香港海员大罢工","安源路矿工人罢工","京汉铁路工人罢工","省港工人罢工"],a:"A",x:"1922年1月香港海员为要求增加工资举行罢工，是中国工人阶级第一次直接同帝国主义势力进行的有组织较量。",p:["工人运动"]},

{id:"c2q127",ch:2,t:"j",real:true,src:"2017年10月真题",fs:6,q:"《资政新篇》中关于政治和经济方面的主要内容。",
kw:["禁朋党之弊","中央集权","暗柜","近代工矿","奖励科技发明","准富者请人雇工","资本主义色彩"],
ref:"（1）《资政新篇》是太平天国后期洪仁玕提出的改革方案，在政治方面主张禁朋党之弊，加强中央集权，制定法律和制度。（2）它主张设立暗柜，用以监督官员、改革弊政，反对结党营私和用人惟亲。（3）经济方面主张发展近代工矿、交通、邮政、金融等事业，吸取外国科学技术，奖励科技发明和机器制造。（4）它还提出准富者请人雇工，即提倡资本主义的雇佣劳动制，带有鲜明的资本主义色彩。（5）但方案未涉及农民土地问题，缺乏实施的阶级基础和社会条件，未能付诸实行。",p:["太平天国"]},
{id:"c3q143",ch:3,t:"j",real:true,src:"2017年10月真题",fs:6,q:"1912年建立的中华民国临时政府的性质。",
kw:["资产阶级共和国性质","革命派控制着这个政权","临时参议院","保护人权","发展资本主义","民族资产阶级"],
ref:"（1）1912年建立的南京临时政府是资产阶级共和国性质的革命政权。（2）从人员构成看，资产阶级革命派控制着这个政权，孙中山作为临时大总统拥有统治全国和统率海陆军之权，陆军、外交等重要部的总长和各部次长多由革命党人担任，同盟会会员在临时参议院中占多数。（3）从政策措施看，临时政府颁布扫除封建弊端、保护人权、鼓励发展资本主义、禁止刑讯和买卖人口、改革文化教育等法令，集中体现了民族资产阶级的愿望和利益，也在一定程度上符合中国人民的利益。",p:["辛亥革命"]},
{id:"c5q138",ch:5,t:"j",real:true,src:"2017年10月真题",fs:6,q:"井冈山革命根据地创建的历史意义。",
kw:["工农武装割据","深入农村","正确方向","武装斗争","土地革命","根据地建设"],
ref:"（1）1927年10月毛泽东率秋收起义部队到达井冈山，创建了第一个农村革命根据地，点燃了工农武装割据的星星之火，为各地起义武装树立了榜样。（2）它从实践上开辟了一条在敌我力量十分悬殊的情况下，共产党深入农村保存和发展革命力量的正确道路。（3）这条道路代表了1927年革命失败后中国革命发展的正确方向。（4）井冈山的斗争把武装斗争、土地革命和根据地建设结合起来，为农村包围城市、武装夺取政权理论的形成奠定了基础。",p:["井冈山根据地"]},
{id:"c6q142",ch:6,t:"j",real:true,src:"2017年10月真题",fs:6,q:"一二·九运动及其历史意义。",
kw:["华北自治运动","停止内战一致对外","吞并华北","抗日救亡运动新高潮","抗日民族统一战线","与工农相结合"],
ref:"（1）1935年12月9日，在中共北平临时工作委员会领导下，北平学生举行抗日游行，喊出反对华北自治运动、打倒日本帝国主义、停止内战一致对外等口号，遭到国民党军警镇压。（2）一二九运动打击了日本帝国主义侵略中国并吞并华北的计划，促进了中华民族的觉醒。（3）它标志着中国人民抗日救亡运动新高潮的到来，为抗日民族统一战线的形成准备了群众基础。（4）运动中的先进青年走上与工农相结合的道路，成为抗日战争的重要力量。",p:["局部抗战"]},
{id:"c8q131",ch:8,t:"j",real:true,src:"2017年10月真题",fs:6,q:"《中国人民政治协商会议共同纲领》规定的新中国的经济工作方针。",
kw:["公私兼顾","劳资两利","城乡互助","内外交流","国营经济","分工合作","各得其所"],
ref:"（1）《共同纲领》规定新中国经济工作的基本方针，是以公私兼顾、劳资两利、城乡互助、内外交流的政策，达到发展生产、繁荣经济之目的。（2）国家应调剂国营经济、个体经济、私人资本主义经济等，使各种社会经济成分在国营经济领导之下分工合作、各得其所。（3）这一方针既照顾到各方面利益，又保证国营经济的领导地位，促进了国民经济的恢复和发展。（4）其实质是在新民主主义条件下，调动各种经济成分的积极性，为向社会主义过渡创造条件。",p:["《共同纲领》"]},
{id:"c1q138",ch:1,t:"l",real:true,src:"2017年10月真题",fs:10,q:"19世纪末帝国主义列强瓜分中国的图谋未能实现的主要原因。",
kw:["矛盾和相互制约","以华制华","义和团","不畏强暴","瓜分中国的图谋","瓦德西"],
ref:"（1）帝国主义列强之间矛盾和相互制约，是瓜分中国图谋未能实现的重要原因。瓜分中国、变中国为殖民地是列强的共同图谋，但彼此之间又有许多矛盾和冲突，甚至可能爆发战争，因此列强经过协商暂缓瓜分，保全清政府作为统治中国的工具，实行以华制华。（2）中国人民不屈不挠的反侵略斗争，是最根本的原因。在义和团反帝爱国运动期间，中国人民不畏强暴、敢于同敌人血战到底，沉重打击了侵略者，使其不敢为所欲为地瓜分中国。（3）这一点连侵略者自己也不得不承认，八国联军统帅瓦德西即认为瓜分一事事实上不可行。（4）中国人民的英勇斗争粉碎了列强瓜分中国的图谋，使中国避免了沦为完全殖民地的命运，也促使资产阶级革命运动兴起。",p:["反侵略斗争"]},
{id:"c4q129",ch:4,t:"l",real:true,src:"2017年10月真题",fs:10,q:"俄国十月革命对中国革命的影响。",
kw:["资产阶级民主主义转向社会主义","经济落后的国家","反对帝国主义","新的平等姿态","新的方法开展革命","五四运动","中国共产党"],
ref:"（1）十月革命的胜利推动中国先进分子从资产阶级民主主义转向社会主义。它昭示资本主义并非唯一出路，给正在苦闷中探索的中国人以新的希望，李大钊等开始宣传马克思主义。（2）它给予中国先进分子一个启示，经济落后的国家也可以用社会主义思想指引自己走向解放之路。（3）十月革命后，苏维埃俄国号召反对帝国主义，以新的平等姿态对待中国，宣布废除不平等条约，推动了社会主义思想在中国的传播。（4）十月革命中工人和士兵广泛发动并由此赢得胜利的事实，昭示中国先进分子以新的方法开展革命，即依靠群众、组织政党、暴力革命。（5）十月革命促进了马克思主义同中国工人运动的结合，为五四运动和中国共产党成立准备了思想条件，中国革命的面貌从此焕然一新。",p:["马克思主义传播"]},
{id:"c8q132",ch:8,t:"l",real:true,src:"2017年10月真题",fs:10,q:"新中国成立初期争取财政经济状况根本好转的三个条件及国民经济迅速恢复的主要原因。",
kw:["七届三中全会","土地改革的完成","工商业","经费","恢复和发展生产","集中和统一","抵制了资产阶级的腐蚀"],
ref:"（1）1950年6月中共七届三中全会召开，毛泽东作《为争取国家财政经济状况的基本好转而斗争》的报告，提出用三年左右时间创造三个条件。（2）三个条件是：土地改革的完成；现有工商业的合理调整；国家机构所需经费的大量节减。（3）到1952年底国民经济全面恢复，其主要原因在于：中共中央和人民政府紧紧抓住恢复和发展生产作为一切工作的中心，正确处理革命和建设的关系。（4）从当时国情出发，对国家财经实行集中和统一的管理，统一全国财政经济工作，稳定物价、统一财经。（5）刚刚执政的中国共产党加强自身建设，保持和发扬党的优良传统和作风，及时有力地抵制了资产阶级的腐蚀，从而保证了恢复任务的完成。",p:["国民经济恢复"]},

{id:"c2q130",ch:2,t:"j",real:true,src:"2018年4月真题",fs:6,q:"洋务运动的历史作用。",
kw:["早期工业和民族资本主义的发展","中国近代教育的开端","传播了新知识","社会风气和价值观念的变化"],
ref:"第一，在客观上促进了中国早期工业和民族资本主义的发展。洋务派以「求强」「求富」为目标，发展军事工业和若干民用企业，使资本主义经济成分在社会经济中明显增长。第二，成为中国近代教育的开端。洋务派开办新式学堂，派出最早的官派留学生，开启了中国近代教育。第三，传播了新知识，打开了人们的眼界。洋务派翻译西学书籍，介绍西方近代科学文化知识，给中国带来新学新识。第四，引起了社会风气和价值观念的变化。随着洋务运动兴起和资本主义生产方式出现，传统价值观念受到冲击，社会风气有所改变，有利于资本主义发展。洋务运动虽以维护清朝统治为目的，却在客观上开启了中国近代化的第一步。",p:["洋务运动"]},
{id:"c4q133",ch:4,t:"j",real:true,src:"2018年4月真题",fs:6,q:"中国早期马克思主义信仰者的三种类型及其代表人物。",
kw:["新文化运动的精神领袖","五四运动中的左翼骨干","中国同盟会会员"],
ref:"第一，五四运动前新文化运动的精神领袖，代表人物是李大钊、陈独秀。第二，五四运动中的左翼骨干，代表人物是毛泽东、蔡和森、周恩来等。第三，一部分原中国同盟会会员、辛亥革命时期的活动家，代表人物是董必武、林伯渠、吴玉章等。这三类人殊途同归，先后走上马克思主义道路，成为中国共产党早期组织的骨干。他们从不同的起点出发，共同推进了马克思主义在中国的传播。",p:["马克思主义传播"]},
{id:"c5q141",ch:5,t:"j",real:true,src:"2018年4月真题",fs:6,q:"20世纪20年代后期和30年代前期，中共党内屡次出现「左」倾错误的主要原因。",
kw:["浓厚的近乎拼命的冲动","马克思主义理论准备不足","共产国际的干预"],
ref:"第一，八七会议后党内一直存在浓厚的近乎拼命的冲动，始终没有从指导思想上得到认真清理。第二，全党的马克思主义理论准备不足，理论素养不高，实践经验缺乏，加之王明等人搬出马克思主义词句吓唬人，容易使一些干部受到蒙骗。第三，共产国际的干预以及对王明的全力支持，使许多人失去识别和抵制错误的能力。此外，党内缺乏健全的民主生活，也是「左」倾错误反复出现的重要原因。",p:["左倾错误"]},
{id:"c7q127",ch:7,t:"j",real:true,src:"2018年4月真题",fs:6,q:"新民主主义革命的总路线和三大经济纲领。",
kw:["无产阶级领导","人民大众","三大经济纲领","没收封建阶级的土地","保护民族工商业"],
ref:"第一，1948年4月毛泽东在《在晋绥干部会议上的讲话》中完整提出新民主主义革命的总路线，即无产阶级领导的、人民大众的、反对帝国主义、封建主义和官僚资本主义的革命。第二，1947年12月毛泽东在《目前形势和我们的任务》中提出三大经济纲领。其一，没收封建阶级的土地归农民所有；其二，没收蒋介石、宋子文、孔祥熙、陈立夫为首的垄断资本归新民主主义的国家所有；其三，保护民族工商业。",p:["革命胜利经验"]},
{id:"c9q143",ch:9,t:"j",real:true,src:"2018年4月真题",fs:6,q:"毛泽东提出的关于社会主义的发展阶段和现代化建设的战略目标。",
kw:["不发达的社会主义","比较发达的社会主义","现代农业","两步走"],
ref:"第一，关于社会主义发展阶段。毛泽东提出，社会主义可以分为两个阶段，第一个阶段是不发达的社会主义，第二个阶段是比较发达的社会主义，后一个阶段可能比前一个阶段需要更长的时间。第二，关于现代化建设的战略目标。要把中国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的社会主义强国。第三，关于发展步骤。采取「两步走」的发展战略，第一步建成独立的比较完整的工业体系和国民经济体系，第二步全面实现农业、工业、国防和科学技术的现代化，使中国经济走在世界前列。毛泽东关于社会主义发展阶段和现代化建设战略目标的论述，为后来党制定现代化发展战略提供了重要的思想基础。",p:["建设成就"]},
{id:"c3q145",ch:3,t:"l",real:true,src:"2018年4月真题",fs:10,q:"1905年至1907年资产阶级革命派与改良派的论战及其意义。",
kw:["要不要以革命手段推翻清政府","要不要推翻帝制","要不要社会革命","划清了革命与改良的界限","奠定了思想基础"],
ref:"1905年至1907年，以孙中山为代表的资产阶级革命派同以康有为、梁启超为代表的改良派展开论战。第一，论战的主要内容有三方面。其一，要不要以革命手段推翻清政府，这是论战的焦点。其二，要不要推翻帝制，实行共和。其三，要不要社会革命。第二，论战的意义。一方面，论战划清了革命与改良的界限，使人们清楚地认识到实行民主革命的必要性，从而参加到革命的行列中来。另一方面，论战使资产阶级民主思想和三民主义思想得到更加广泛的传播，为推翻清朝统治的革命斗争奠定了思想基础。论战以革命派的胜利而告结束，有力地推动了民主革命思想的传播和革命形势的发展。",p:["革命论战"]},
{id:"c6q144",ch:6,t:"l",real:true,src:"2018年4月真题",fs:10,q:"毛泽东在《论持久战》一文中对中日双方互相矛盾的四个特点的分析。",
kw:["敌强我弱","敌小我大","敌退步我进步","敌寡助我多助","最后胜利是中国的"],
ref:"毛泽东指出，中日双方存在着互相矛盾的四个特点，即敌强我弱、敌小我大、敌退步我进步、敌寡助我多助。第一，日本是强国，中国是弱国，这就决定了抗日战争只能是持久战，而不能速胜。第二，日本是小国，发动的是退步的、野蛮的侵略战争，在国际上失道寡助；中国是大国，进行的是进步的、正义的反侵略战争，在国际上得道多助。第三，中国已经有了代表中华民族和中国人民根本利益的共产党及其领导的人民军队和抗日根据地，能够进行持久抗战。因此，战争的最后胜利是中国的。这一分析科学地预见了抗日战争的进程和结局，极大地坚定了全国人民抗战必胜的信心。",p:["《论持久战》"]},
{id:"c8q134",ch:8,t:"l",real:true,src:"2018年4月真题",fs:10,q:"我国对个体农业进行社会主义改造的基本原则和方针。",
kw:["先合作化","后机械化","自愿和互利","典型示范","增产","社会改造同技术改造相结合"],
ref:"第一，在中国的条件下，可以走先合作化、后机械化的道路。土地改革基本完成后，及时把「组织起来」作为农村工作的一件大事来抓。第二，充分利用和发挥土改后农民的生产积极性，通过互助组、初级农业生产合作社、高级农业生产合作社等由低到高的组织形式，实行积极发展、稳步前进、逐步过渡的方针。第三，农业互助合作的发展坚持自愿和互利的原则，采取典型示范、逐步推广的方法，发展一批，巩固一批。第四，始终把是否增产作为衡量合作社是否办好的标准。第五，把社会改造同技术改造相结合，在实现农业合作化后，国家努力用先进技术和装备发展农业经济。",p:["农业改造"]},
{id:"c1q144",ch:1,t:"s",real:true,src:"2018年10月真题",q:"鸦片战争前中国封建社会的主要矛盾是",o:["地主阶级和农民阶级的矛盾","帝国主义和中华民族的矛盾","资产阶级和工人阶级的矛盾","封建主义和资本主义的矛盾"],a:"A",x:"鸦片战争前中国是独立的封建国家，地主阶级与农民阶级的矛盾是社会的主要矛盾。",p:["主要矛盾"]},
{id:"c1q145",ch:1,t:"s",real:true,src:"2018年10月真题",q:"西方列强对中国的侵略，首先和主要的是",o:["政治控制","军事侵略","经济掠夺","文化渗透"],a:"B",x:"资本—帝国主义列强侵略中国，首先和主要的是军事侵略，迫使清政府签订不平等条约。",p:["侵略中国"]},

{id:"c1q146",ch:1,t:"j",real:true,src:"2018年10月真题",fs:6,q:"旧民主主义革命时期中国人民反侵略战争失败的原因。",
kw:["社会制度的腐败","经济技术的落后","防民甚于防寇","最根本的原因"],
ref:"第一，从1840年到1919年，中国人民对外来侵略进行了英勇斗争，但都失败了。其原因一是社会制度的腐败，二是经济技术的落后，而前者是最根本的原因。第二，社会制度的腐败。腐朽的清王朝统治者为了自身私利，不惜出卖国家和民族利益，总是把防止人民反抗放在首位，宣扬「防民甚于防寇」，压制和破坏人民群众与爱国官兵的反侵略斗争。第三，经济技术的落后。西方资本主义强国经过工业革命，经济和技术飞速发展，而中国经济技术落后的局面没有改变，工业技术落后，武器装备、军队素质和综合实力都远远落后于列强，必然导致被动挨打。",p:["反侵略失败原因"]},
{id:"c3q148",ch:3,t:"j",real:true,src:"2018年10月真题",fs:6,q:"以孙中山为首的资产阶级革命派反对北洋军阀统治的主要斗争。",
kw:["二次革命","中华革命党","护国运动","第一次护法运动","第二次护法运动"],
ref:"第一，发动「二次革命」，即赣宁之役。1913年7月李烈钧在江西湖口通电讨袁，黄兴在南京宣布讨袁。第二，组织中华革命党，继续聚集革命力量。第三，发动护国运动。为反对袁世凯称帝，1915年12月25日蔡锷宣布云南独立，护国运动爆发。第四，发动第一次护法运动。1917年孙中山率领部分国会议员南下广州，反对北洋军阀的专制统治。第五，发动第二次护法运动。1920年孙中山重返广州，恢复军政府，继续领导护法斗争。",p:["二次革命","护国运动","护法运动"]},
{id:"c5q143",ch:5,t:"j",real:true,src:"2018年10月真题",fs:6,q:"中共八七会议的主要内容。",
kw:["右倾投降主义错误","土地革命和武装斗争","中央临时政治局","政权是由枪杆子中取得的"],
ref:"第一，清算了大革命后期陈独秀右倾投降主义错误，确定了土地革命和武装斗争的总方针。第二，选出了以瞿秋白为书记的中央临时政治局。第三，毛泽东在会上阐述了农民问题和武装斗争对中国革命的重要性，强调「政权是由枪杆子中取得的」。八七会议在革命危急关头为全党指明了斗争方向，是由大革命失败到土地革命战争兴起的历史性转折。",p:["八七会议"]},
{id:"c6q148",ch:6,t:"j",real:true,src:"2018年10月真题",fs:6,q:"中国人民抗日战争在世界反法西斯战争中的地位。",
kw:["东方主战场","北进","南进","重要后方基地","巨大牺牲"],
ref:"第一，中国人民抗日战争是世界反法西斯战争的东方主战场。中国抗战开始最早，持续时间最长，牵制和抗击了日本主要兵力，对日本侵略者的彻底覆灭起了决定性作用。第二，中国人民的持久抗战遏制了日本的「北进」计划，牵制了日本的「南进」步伐，大大减轻了其他战场的压力，为盟军完成战略转折和实施战略反攻创造了有利条件。第三，中国作为亚太地区盟军对日作战的重要后方基地，为盟国提供了大量战略物资和军事情报，中国军队出国作战还给予盟军实际支援。中国为战胜法西斯、维护世界和平付出了巨大牺牲，作出了伟大贡献。",p:["世界反法西斯战争"]},
{id:"c8q137",ch:8,t:"j",real:true,src:"2018年10月真题",fs:6,q:"新中国1949年至1952年采取的向社会主义过渡的实际步骤。",
kw:["没收官僚资本","国家资本主义轨道","互助合作"],
ref:"第一，没收官僚资本，确立社会主义性质的国营经济的领导地位。新中国成立后，通过没收官僚资本建立国营经济，使其在国民经济中居于主导地位，为向社会主义过渡奠定了物质基础。第二，开始将资本主义纳入国家资本主义轨道。对私营工商业采取加工订货、经销代销等形式，逐步把它引向国家资本主义。第三，引导个体农民在土地改革后逐步走上互助合作的道路。通过组织互助组、农业生产合作社，把农民个体经济引向集体经济。",p:["社会主义改造"]},
{id:"c7q129",ch:7,t:"l",real:true,src:"2018年10月真题",fs:10,q:"中国新民主主义革命取得胜利的主要原因。",
kw:["中国工人阶级的先锋队","毛泽东思想","人民群众和各界人士的广泛参加","国际无产阶级"],
ref:"第一，有了中国工人阶级的先锋队即中国共产党的领导。党以马克思列宁主义基本原理与中国实际相结合的毛泽东思想作为一切工作的指针，制定出符合中国国情和人民利益的纲领、路线、方针和政策。党有远见，最富于牺牲精神，最坚定，从而赢得了人民的拥护。第二，人民群众和各界人士的广泛参加和大力支持。工人、农民、城市小资产阶级是民主革命的主要力量，随着斗争的发展，民族资产阶级也逐步向共产党靠拢。第三，国际无产阶级和人民群众的支持。为了中国人民的解放事业，一些国际友人还直接参加了中国的革命斗争，有的长眠在中国的土地上。第四，建立了广泛的革命统一战线，实行正确的政策和策略，团结了一切可以团结的力量。",p:["革命胜利经验"]},
{id:"c10q154",ch:10,t:"l",real:true,src:"2018年10月真题",fs:10,q:"中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折。",
kw:["马克思主义的思想路线","以阶级斗争为纲","现代化建设","改革开放","民主集中制","伟大转折"],
ref:"第一，重新确立了马克思主义的思想路线。全会冲破长期「左」的错误的严重束缚，彻底否定「两个凡是」的错误方针，高度评价关于真理标准问题的讨论，断然否定「以阶级斗争为纲」的指导思想，恢复马克思主义实事求是的思想路线。第二，全会全面分析当前的主要矛盾和主要任务，作出把工作重点转移到社会主义现代化建设上来和实行改革开放的战略决策。第三，全会恢复党的民主集中制的优良传统，审查解决历史上遗留的一批重大问题和一些重要领导人的功过是非问题。第四，为了适应社会主义现代化建设的需要，全会决定在党的生活和国家政治生活中加强民主，明确党的思想路线，加强党的领导机构，成立中央纪律检查委员会。第五，十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折。全会结束了粉碎「四人帮」后在徘徊中前进的局面，开始全面拨乱反正，形成了以邓小平为核心的党的中央领导集体，揭开了社会主义改革开放的序幕。以这次全会为起点，中国进入了改革开放和社会主义现代化建设新时期。",p:["十一届三中全会"]},

{id:"c2q137",ch:2,t:"s",real:true,src:"2025年4月真题",q:"太平天国农民运动失败的根本原因是",o:["对外国资本主义列强缺乏理性认识","没有科学理论的指导","缺乏先进阶级的领导","无法长期保持领导集团的团结"],a:"C",x:"农民阶级不是新的生产力和生产关系的代表，缺乏先进阶级的领导，无法克服自身局限性。",p:["失败原因"]},
{id:"c2q138",ch:2,t:"j",real:true,src:"2025年4月真题",fs:6,q:"资产阶级维新派自身弱点和局限的主要表现。",
kw:["不敢否定封建主义","对帝国主义抱有幻想","惧怕人民群众"],
ref:"第一，不敢否定封建主义。维新派在政治上不敢根本否定封建君主制度，只是幻想依靠光绪皇帝实现自上而下的改良；在思想上虽提倡西学，却仍打着孔子的旗号，没有彻底批判封建主义。第二，对帝国主义抱有幻想。维新派认为列强希望中国富强，幻想依靠英、日等国支持变法，对帝国主义侵略缺乏清醒认识。第三，惧怕人民群众。维新派的活动基本局限于官僚士大夫和知识分子圈子，不敢发动和依靠人民群众，使变法缺乏广泛的社会基础。",p:["戊戌维新"]},
{id:"c3q149",ch:3,t:"l",real:true,src:"2025年4月真题",fs:10,q:"中华民国临时政府的成立、性质及局限性。",
kw:["1912年1月1日","孙中山在南京宣誓就职","资产阶级共和国性质","承认清政府与列强所订的一切不平等条约","没有提出可以满足农民土地要求的政策"],
ref:"第一，成立。1912年1月1日，孙中山在南京宣誓就职，宣告中华民国临时政府正式成立，改国号为中华民国，改用公历，以1912年为民国元年。第二，性质。南京临时政府是一个资产阶级共和国性质的革命政权，其成员以资产阶级革命派为主体，颁布了一系列有利于发展资本主义和民主政治的法令，结束了清王朝的统治，具有开创性意义。第三，局限性。一是试图用承认清政府与列强所订的一切不平等条约和所欠的一切外债，来换取列强承认中华民国；二是没有提出可以满足农民土地要求的政策和措施，反而以保护私有财产为借口，维护封建土地制度以及官僚、地主所占有的土地和财产。",p:["辛亥革命"]},
{id:"c4q135",ch:4,t:"s",real:true,src:"2025年4月真题",q:"1919年，发表《马克思主义》（一称《科学的社会主义》）一文，对马克思主义基本内容作了比较确切阐述的是",o:["毛泽东","李达","蔡和森","杨匏安"],a:"D",x:"1919年杨匏安发表《马克思主义》，比较确切地阐述了马克思主义的基本内容，对传播马克思主义起了重要作用。",p:["马克思主义传播"]},
{id:"c4q136",ch:4,t:"s",real:true,src:"2025年4月真题",q:"1923年，北京政府调动军警镇压京汉铁路总同盟罢工制造的惨案是",o:["二七惨案","济南惨案","下关惨案","校场口惨案"],a:"A",x:"1923年2月，京汉铁路工人大罢工遭北京政府军警镇压，制造了震惊全国的二七惨案。",p:["工人运动"]},
{id:"c4q137",ch:4,t:"s",real:true,src:"2025年4月真题",q:"1925年8月，广州国民政府将所辖各部队统一改编为",o:["国民军","东征军","北伐军","国民革命军"],a:"D",x:"1925年8月，广州国民政府将所辖各部队统一改编为国民革命军，为北伐战争准备了武装力量。",p:["国民革命"]},
{id:"c4q138",ch:4,t:"j",real:true,src:"2025年4月真题",fs:6,q:"新文化运动的历史意义。",
kw:["资产阶级民主主义新文化与封建主义旧文化的斗争","大力宣传了民主和科学","为马克思主义在中国的传播创造了有利条件"],
ref:"第一，它是资产阶级民主主义新文化与封建主义旧文化的斗争，沉重打击了封建专制主义，动摇了封建思想的统治地位。第二，它大力宣传了民主和科学，启发了人们的民主主义觉悟，开启了思想解放的潮流。第三，它为马克思主义在中国的传播创造了有利条件。新文化运动中的先进分子在批判封建思想的过程中逐渐接受马克思主义，为中国共产党的成立准备了思想条件。",p:["新文化运动"]},
{id:"c5q144",ch:5,t:"s",real:true,src:"2025年4月真题",q:"大革命失败后，中共中央召开的确定土地革命和武装斗争方针的紧急会议是",o:["古田会议","遵义会议","八七会议","洛川会议"],a:"C",x:"1927年8月7日，中共中央在汉口召开八七会议，确定了土地革命和武装斗争的总方针。",p:["八七会议"]},
{id:"c5q145",ch:5,t:"s",real:true,src:"2025年4月真题",q:"中共中央政治局在遵义会议后成立了全权负责红军军事行动的新三人团，其成员是",o:["毛泽东、朱德、周恩来","毛泽东、周恩来、王稼祥","毛泽东、朱德、王稼祥","毛泽东、张闻天、周恩来"],a:"B",x:"遵义会议后成立由毛泽东、周恩来、王稼祥组成的新三人团，全权负责红军的军事行动。",p:["遵义会议"]},
{id:"c5q146",ch:5,t:"s",real:true,src:"2025年4月真题",q:"1930年1月，毛泽东提出中国革命「以乡村为中心」思想，初步形成农村包围城市、武装夺取政权理论的著作是",o:["《井冈山的斗争》","《星星之火，可以燎原》","《中国的红色政权为什么能够存在？》","《反对本本主义》"],a:"B",x:"1930年1月毛泽东写下《星星之火，可以燎原》，提出以乡村为中心，初步形成农村包围城市、武装夺取政权的理论。",p:["农村包围城市"]},
{id:"c5q147",ch:5,t:"j",real:true,src:"2025年4月真题",fs:6,q:"1927年建立的国民党政权在全国实行独裁统治的主要表现。",
kw:["庞大的军队","全国性的特务系统","保甲制度","文化专制主义"],
ref:"1927年国民党政权建立后，为维护大地主大资产阶级的统治，在全国实行独裁统治，其主要表现是：第一，建立了庞大的军队，广大人民群众被置于国民党武装的严密控制和监视之下。第二，建立了全国性的特务系统，镇压人民和消灭异己力量。第三，大力推行保甲制度，以严密控制基层社会。第四，厉行文化专制主义，剥夺人民的言论和出版自由，镇压进步文化运动。",p:["国民党统治"]},
{id:"c6q149",ch:6,t:"s",real:true,src:"2025年4月真题",q:"1936年5月，在共产党人积极参与下，宋庆龄等爱国民主人士发起成立的团体是",o:["保卫中国同盟","全国各界救国联合会","中国民权保障同盟","国民参政会"],a:"B",x:"1936年5月，宋庆龄等爱国民主人士在上海发起成立全国各界救国联合会，推动抗日救亡运动发展。",p:["抗日民族统一战线"]},
{id:"c6q150",ch:6,t:"s",real:true,src:"2025年4月真题",q:"1937年8月，中国共产党在洛川会议上通过的重要文件是",o:["《为抗日救国告全国同胞书》","《停战议和一致抗日通电》","《抗日救国十大纲领》","《关于若干历史问题的决议》"],a:"C",x:"1937年8月洛川会议通过《抗日救国十大纲领》，制定了全面抗战路线。",p:["全面抗战路线"]},
{id:"c6q151",ch:6,t:"s",real:true,src:"2025年4月真题",q:"日本侵略者制造震惊中外的「南京大屠杀」的时间是",o:["1931年9月","1932年1月","1937年7月","1937年12月"],a:"D",x:"1937年12月，日军攻占南京后进行了长达六周的大屠杀，制造了震惊中外的南京大屠杀惨案。",p:["日本暴行"]},
{id:"c6q152",ch:6,t:"s",real:true,src:"2025年4月真题",q:"1940年5月，在枣宜会战中以身殉国的国民党爱国将领是",o:["张自忠","赵登禹","戴安澜","佟麟阁"],a:"A",x:"1940年5月，国民党军第三十三集团军总司令张自忠在枣宜会战中壮烈殉国。",p:["正面战场"]},
{id:"c6q153",ch:6,t:"s",real:true,src:"2025年4月真题",q:"1945年出席联合国制宪会议的中国代表团中，解放区的代表是",o:["叶剑英","董必武","林伯渠","王若飞"],a:"B",x:"1945年，董必武作为解放区代表参加中国代表团，出席在美国旧金山举行的联合国制宪会议。",p:["世界反法西斯战争"]},
{id:"c7q130",ch:7,t:"l",real:true,src:"2025年4月真题",fs:10,q:"抗日战争胜利后中国国内的三种建国方案。",
kw:["大地主大资产阶级专政","资产阶级共和国","工人阶级领导的以工农联盟为基础的人民共和国"],
ref:"抗日战争胜利后，中国面临着两种命运、两个前途的决战，各阶级、各派别纷纷提出自己的建国主张，主要有三种方案。第一，由国民党统治集团代表的方案，主张实行大地主大资产阶级专政，使中国社会继续走半殖民地半封建的道路。第二，由某些中间派别或中间人士代表的方案，主张建立资产阶级共和国，使中国社会走上独立发展资本主义的道路。第三，由中国共产党代表的方案，主张建立工人阶级领导的以工农联盟为基础的人民共和国，走经过新民主主义逐步到达社会主义和共产主义的道路。三种方案中，中国共产党的方案代表了中国最广大人民的根本利益，最终得到了人民的拥护。",p:["第三条道路"]},
{id:"c8q138",ch:8,t:"s",real:true,src:"2025年4月真题",q:"中华人民共和国的成立，标志着中国进入",o:["旧民主主义向新民主主义的过渡时期","社会主义社会","新民主主义到社会主义的过渡时期","共产主义社会"],a:"C",x:"中华人民共和国成立后，中国进入新民主主义到社会主义的过渡时期，开始由新民主主义向社会主义转变。",p:["社会主义制度确立"]},
{id:"c8q139",ch:8,t:"j",real:true,src:"2025年4月真题",fs:6,q:"1952年我国开展的「五反」运动的内容。",
kw:["反行贿","反偷税漏税","反盗窃国家资财","反偷工减料","反盗窃国家经济情报"],
ref:"针对不法资本家的严重「五毒」行为，1952年我国在工商业者中开展了「五反」运动。其内容是：反行贿、反偷税漏税、反盗窃国家资财、反偷工减料、反盗窃国家经济情报。通过这场运动，打击了不法资本家的违法行为，巩固了国营经济的领导地位，为资本主义工商业的社会主义改造创造了条件，也使广大工商业者受到教育，有利于把私营企业逐步纳入国家资本主义轨道。",p:["三反五反"]},
{id:"c9q148",ch:9,t:"s",real:true,src:"2025年4月真题",q:"我国在1957年6月开展的政治运动是",o:["肃反运动","反右派运动","人民公社化运动","社会主义教育运动"],a:"B",x:"1957年6月，中共中央发动全国规模的反右派运动，但运动被严重扩大化，留下了深刻教训。",p:["反右派"]},
{id:"c9q149",ch:9,t:"s",real:true,src:"2025年4月真题",q:"「文化大革命」的导火线是",o:["《评新编历史剧〈海瑞罢官〉》的发表","「五一六通知」的发表","「十六条」的发表","《炮打司令部——我的一张大字报》的发表"],a:"A",x:"1965年11月，姚文元发表《评新编历史剧〈海瑞罢官〉》，成为文化大革命的导火线。",p:["文化大革命"]},
{id:"c10q155",ch:10,t:"s",real:true,src:"2025年4月真题",q:"1984年通过《中共中央关于经济体制改革的决定》的重要会议是",o:["中共十一届三中全会","中共十一届六中全会","中共十二届三中全会","中共十二届六中全会"],a:"C",x:"1984年10月，中共十二届三中全会通过《中共中央关于经济体制改革的决定》，全面推进城市经济体制改革。",p:["经济体制改革"]},
{id:"c10q156",ch:10,t:"s",real:true,src:"2025年4月真题",q:"中国正式加入世界贸易组织的时间是",o:["1988年","1990年","1997年","2001年"],a:"D",x:"2001年12月，中国正式加入世界贸易组织，标志着我国对外开放进入新阶段。",p:["对外开放"]},
{id:"c10q157",ch:10,t:"s",real:true,src:"2025年4月真题",q:"明确提出我国在21世纪头二十年实现全面建设小康社会奋斗目标的会议是",o:["中共十六大","中共十七大","中共十八大","中共十九大"],a:"A",x:"2002年中共十六大明确提出，21世纪头二十年要全面建设惠及十几亿人口的更高水平的小康社会。",p:["十六大"]},
{id:"c10q158",ch:10,t:"j",real:true,src:"2025年4月真题",fs:6,q:"1979年邓小平提出的坚持四项基本原则及其重要性。",
kw:["坚持社会主义道路","坚持人民民主专政","坚持共产党的领导","坚持马克思列宁主义、毛泽东思想","实现四个现代化的根本前提"],
ref:"邓小平在1979年3月党的理论工作务虚会上明确提出四项基本原则，为新时期各项工作指明了根本方向。四项基本原则是：坚持社会主义道路，坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、毛泽东思想。其重要性在于：这是实现四个现代化的根本前提。如果动摇了其中的任何一项，那就动摇了整个社会主义现代化建设事业。四项基本原则是立国之本，是改革开放和现代化建设健康发展的根本保证。",p:["四项基本原则"]},
{id:"c11q127",ch:11,t:"l",real:true,src:"2025年4月真题",fs:10,q:"中国共产党百年奋斗的历史意义和历史经验。",
kw:["从根本上改变了中国人民的前途命运","开辟了实现中华民族伟大复兴的正确道路","展示了马克思主义的强大生命力","深刻影响了世界历史进程","坚持党的领导","坚持人民至上","坚持自我革命"],
ref:"历史意义：第一，从根本上改变了中国人民的前途命运，中国人民彻底摆脱了被欺负、被压迫、被奴役的命运。第二，开辟了实现中华民族伟大复兴的正确道路，中国仅用几十年时间就走完发达国家几百年走过的工业化历程。第三，展示了马克思主义的强大生命力，马克思主义的科学性和真理性在中国得到充分检验。第四，深刻影响了世界历史进程，党推动构建人类命运共同体，为世界和平与发展作出贡献。第五，锻造了走在时代前列的中国共产党，形成了以伟大建党精神为源头的精神谱系。历史经验：坚持党的领导，坚持人民至上，坚持理论创新，坚持独立自主，坚持中国道路，坚持胸怀天下，坚持开拓创新，坚持敢于斗争，坚持统一战线，坚持自我革命。",p:["六中全会"]},
{id:"c1q152",ch:1,t:"s",real:true,src:"2015年4月真题",q:"19世纪末，在帝国主义列强瓜分中国的狂潮中提出「门户开放」政策的国家是",o:["美国","日本","俄国","德国"],a:"A",x:"中日甲午战争后列强瓜分中国达到高潮，美国于1899年提出「门户开放」政策，要求各国在华机会均等。",p:["侵略中国"]},
{id:"c1q153",ch:1,t:"s",real:true,src:"2015年4月真题",q:"旧民主主义革命时期中国反侵略斗争失败的根本原因是",o:["经济技术落后","社会制度腐败","思想文化保守","军事指挥失误"],a:"B",x:"1840年至1919年中国反侵略斗争屡遭失败，根本原因是社会制度的腐败，经济技术的落后是另一重要原因。",p:["反侵略失败原因"]},
{id:"c1q154",ch:1,t:"j",real:true,src:"2015年4月真题",fs:6,q:"近代中国工人阶级的特殊优点是什么？",
kw:["三重压迫","革命性最强","相对集中","大城市和大企业","破产农民","工农联盟"],
ref:"（1）受压迫最深，革命性最强。中国工人阶级深受帝国主义、封建势力和资产阶级的三重压迫与剥削，劳动时间长、工资低、待遇差，因而革命性最强。（2）人数虽少但相对集中。中国工人阶级主要集中在大城市和大企业，便于团结和组织，形成强大的革命力量。（3）同农民有天然联系。中国工人阶级主要由破产农民和家庭手工业者转化而来，与农民有着天然的联系，便于结成工农联盟。",p:["社会性质"]},

{id:"c2q142",ch:2,t:"j",real:true,src:"2015年4月真题",fs:6,q:"资产阶级维新派自身弱点和局限的主要表现是什么？",
kw:["不敢否定封建主义","托古改制","对帝国主义抱有幻想","脱离人民群众","缺乏广泛的社会基础"],
ref:"（1）不敢否定封建主义。维新派在政治上不敢根本否定封建君主制度，在经济上不敢触动封建土地所有制，在思想上打着孔子的旗号托古改制。（2）对帝国主义抱有幻想。维新派幻想依靠帝国主义国家的支持来实现变法图强，未能认清列强侵略中国的本质。（3）脱离人民群众。维新派惧怕人民群众，把变法运动局限于官僚士大夫和开明地主阶层，缺乏广泛的社会基础，最终在封建顽固势力的镇压下失败。",p:["戊戌维新"]},

kw:["国共合作","革命统一战线","先锋模范作用","工农群众","苏联","战略战术"],
ref:"（1）国共合作的实现和革命统一战线的建立是根本原因。共产党员和共青团员在北伐军中发挥了先锋模范作用，提高了部队的战斗力。（2）北伐军得到广大工农群众的大力支持。沿途群众积极参军参战、支援前线，为战争胜利提供了重要保障。（3）苏联政府给予多方面援助。苏联军事顾问帮助北伐军制定了正确的战略战术，并提供了武器装备和物资支持。",p:["北伐战争"]},

{id:"c6q156",ch:6,t:"j",real:true,src:"2015年4月真题",fs:6,q:"中国人民抗日战争胜利的基本经验是什么？",
kw:["大团结","力量源泉","爱国主义","民族精神","热爱和平","不惧怕战争"],
ref:"（1）全国人民的大团结是抗战胜利的力量源泉。在抗日民族统一战线旗帜下，各民族、各阶层、各党派团结一致，战胜了一切艰难困苦。（2）以爱国主义为核心的伟大民族精神是团结奋进的精神动力。中华儿女在抗战中表现出不畏强暴、血战到底的英雄气概，凝聚起强大的民族力量。（3）中国人民热爱和平、反对侵略战争，同时又不惧怕战争。中国人民以正义战争反对非正义的侵略战争，最终取得了抗日战争的伟大胜利。",p:["抗战胜利"]},

{id:"c9q150",ch:9,t:"l",real:true,src:"2015年4月真题",fs:10,q:"毛泽东关于正确区分社会主义社会两类不同性质矛盾学说的主要内容及其意义。",
kw:["敌我矛盾","人民内部矛盾","专政","团结—批评—团结","科学社会主义","调动一切积极因素"],
ref:"（1）两类矛盾的性质不同。1957年毛泽东在《关于正确处理人民内部矛盾的问题》中指出，社会主义社会存在着敌我矛盾和人民内部矛盾两类性质根本不同的矛盾，前者是分清敌我的问题，后者是分清是非的问题。（2）解决两类矛盾的方法不同。敌我矛盾需要用强制的、专政的方法去解决；人民内部矛盾只能用民主的、说服教育的方法去解决，实行「团结—批评—团结」的方法。（3）学说的理论意义。这一学说创造性地阐述了社会主义社会的矛盾学说，指出人民内部矛盾是社会主义国家政治生活的主题，是对科学社会主义理论的重要发展。（4）学说的实践意义。它为中国共产党正确处理社会主义社会的各种矛盾提供了理论指导，对于调动一切积极因素建设社会主义、维护社会安定团结具有长远的指导意义。",p:["人民内部矛盾"]},

{id:"c10q161",ch:10,t:"j",real:true,src:"2015年4月真题",fs:6,q:"1978年关于真理标准问题大讨论的历史意义是什么？",
kw:["两个凡是","思想解放运动","实践是检验真理的唯一标准","拨乱反正","实事求是","十一届三中全会"],
ref:"（1）冲破了「两个凡是」的思想束缚。这场讨论是一场马克思主义的思想解放运动，重新确立了实践是检验真理的唯一标准这一基本原理，成为拨乱反正和改革开放的思想先导。（2）为历史性转折作了思想理论准备。讨论推动中国共产党重新确立实事求是的思想路线，纠正长期以来的「左」倾错误，为中共十一届三中全会实现伟大历史转折奠定了思想理论基础，也为改革开放的启动扫清了思想障碍。",p:["真理标准讨论"]},

{id:"c2q143",ch:2,t:"j",real:true,src:"2014年10月真题",fs:6,q:"洋务运动失败的主要原因是什么？",
kw:["封建性","依赖性","腐朽性","封建衙门式","与虎谋皮"],
ref:"第一，洋务运动具有封建性。洋务派只注重西法练兵和兴办企业，而不去改变落后的封建制度，企图在维护封建生产关系的前提下实现自强求富，这就决定了它难以成功。第二，洋务运动对西方列强具有依赖性。洋务派企图仰仗西方列强来达到求强求富的目的，在技术、资金和管理上处处依赖外国，无异于与虎谋皮。第三，洋务企业的管理具有腐朽性。洋务派对企业采取封建衙门式的管理方法，机构臃肿、用人唯亲、效率低下，难以适应近代企业的经营需要。",p:["洋务运动","失败原因"]},
{id:"c3q153",ch:3,t:"j",real:true,src:"2014年10月真题",fs:6,q:"孙中山三民主义学说的主要内容是什么？",
kw:["民族主义","民权主义","民生主义","驱除鞑虏","平均地权"],
ref:"民族主义，指「驱除鞑虏，恢复中华」，主要是以革命手段推翻清王朝的统治，实现民族独立。民权主义，指「创立民国」，即推翻封建君主专制制度，建立资产阶级民主共和国，这是三民主义的核心。民生主义，指「平均地权」，其基本方案是核定地价、按价征税、涨价归公、按价收买，目的在于防止土地垄断、解决民生问题。三民主义是孙中山领导辛亥革命的指导思想，反映了资产阶级革命派的政治要求。",p:["三民主义"]},
{id:"c4q147",ch:4,t:"j",real:true,src:"2014年10月真题",fs:6,q:"新文化运动的历史意义是什么？",
kw:["民主主义","封建专制主义","民主和科学","思想的解放","马克思主义"],
ref:"第一，新文化运动是资产阶级民主主义新文化同封建主义旧文化的斗争，是辛亥革命在思想文化领域的延续，沉重打击了封建专制主义，动摇了封建思想的统治地位。第二，新文化运动大力宣传民主和科学，启发人们的民主主义觉悟，推动了人们思想的解放，尤其使青年一代从封建礼教的束缚中解放出来。第三，新文化运动为马克思主义在中国的传播创造了有利条件，为中国先进分子探索救国救民道路提供了新的思想武器，成为中国思想文化领域的一场伟大变革。",p:["新文化运动"]},
{id:"c5q152",ch:5,t:"j",real:true,src:"2014年10月真题",fs:6,q:"毛泽东领导的湘赣边界秋收起义的特点是什么？",
kw:["工农革命军","工农武装","井冈山","农村包围城市"],
ref:"湘赣边界秋收起义的特点在于：第一，放弃了「左派国民党」运动的旗号，公开打出了「工农革命军」的旗帜，表明中国共产党独立领导革命武装的决心。第二，起义不仅是军队的行动，而且有数量众多的工农武装参加，体现了工农武装割据的特点。第三，起义部队在受挫后转向农村，向井冈山进军，开辟了农村包围城市、武装夺取政权的新道路。",p:["秋收起义"]},
{id:"c7q139",ch:7,t:"j",real:true,src:"2014年10月真题",fs:6,q:"中国革命统一战线中的两个联盟及其关系是什么？",
kw:["劳动者的联盟","非劳动者的联盟","基本的","辅助的","民族资产阶级"],
ref:"中国革命统一战线中存在着两个联盟：一个是劳动者的联盟，主要是工人、农民和城市小资产阶级的联盟，这是基本的、主要的联盟；另一个是劳动者与非劳动者的联盟，主要是劳动者与民族资产阶级的联盟，有时还包括与一部分大资产阶级的暂时的联盟，这是辅助的、同时又是重要的联盟。两个联盟中，第一个联盟是统一战线的基础，是依靠力量；第二个联盟可以争取和团结中间势力，孤立顽固势力。只有巩固和发展两个联盟，才能团结一切可以团结的力量，夺取革命的胜利。",p:["革命胜利经验"]},
{id:"c9q151",ch:9,t:"l",real:true,src:"2014年10月真题",fs:10,q:"中共八大如何分析我国社会主义改造完成后国内的主要矛盾和主要任务？",
kw:["主要矛盾","先进的工业国","落后的农业国","经济文化","主要任务"],
ref:"社会主义改造基本完成后，国内的主要矛盾已经发生变化。中共八大指出，我国国内的主要矛盾，已经是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，已经是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。党和全国人民的主要任务，就是集中力量来解决这个矛盾，把我国尽快地从落后的农业国变为先进的工业国。这一判断的实质是，在社会主义制度已经建立的情况下，全党全国的工作重心应当转移到经济建设上来，集中力量发展社会生产力。八大还坚持既反保守又反冒进、在综合平衡中稳步前进的经济建设方针，强调加强党的建设、发展人民民主和党内民主。这些正确决策为社会主义建设指明了方向，是中国共产党探索中国社会主义建设道路的重要成果。",p:["中共八大"]},

{id:"c3q158",ch:3,t:"j",real:true,src:"2013年4月真题",fs:6,q:"资产阶级革命派与改良派论战的主要问题是什么？",
kw:["推翻清王朝","实行共和","社会革命","平均地权","民主革命思想"],
ref:"1905年至1907年，革命派以《民报》、改良派以《新民丛报》为主要阵地展开论战，主要围绕三个问题：（1）要不要以革命手段推翻清王朝。这是论战的焦点。改良派认为革命会引起内乱和列强干涉，主张只可改良立宪；革命派强调救国必先推翻清王朝，革命与建设是革命的两个方面。（2）要不要推翻帝制，实行共和。改良派认为民智未开，不能实行共和；革命派认为可以革命开民智，建立民主共和制度。（3）要不要社会革命。改良派维护封建土地制度，反对平均地权；革命派主张平均地权，实行社会革命。论战划清了革命与改良的界限，传播了民主革命思想，促进了革命形势的发展。",p:["革命论战"]},
{id:"c4q151",ch:4,t:"j",real:true,src:"2013年4月真题",fs:6,q:"中国国民党一大对三民主义的新阐释是什么？",
kw:["民族自求解放","各民族一律平等","民权为一般平民所共有","平均地权","节制资本","第一次国共合作"],
ref:"1924年1月，中国国民党第一次全国代表大会在广州召开，大会通过的宣言对三民主义作出了新的阐释，实际确立了联俄、联共、扶助农工三大政策。（1）民族主义：对外反对帝国主义，主张中华民族自求解放；对内反对民族压迫，主张中国境内各民族一律平等。（2）民权主义：民权为一般平民所共有，凡真正反对帝国主义和封建军阀之个人及团体，均得享有一切自由及权利，不为少数人所得而私。（3）民生主义：平均地权，节制资本，反对土地权为少数人操纵，反对私人资本垄断国计民生。新三民主义同中国共产党在民主革命阶段的纲领基本一致，成为第一次国共合作的政治基础。",p:["新三民主义"]},
{id:"c6q159",ch:6,t:"j",real:true,src:"2013年4月真题",fs:6,q:"中国人民抗日战争胜利的主要原因是什么？",
kw:["以爱国主义为核心的伟大民族精神","中流砥柱","全面抗战路线","敌后战场","全民族抗战","世界反法西斯力量"],
ref:"中国人民抗日战争胜利的主要原因有：（1）以爱国主义为核心的伟大民族精神，是中国人民团结奋进、战胜困难的精神动力。（2）中国共产党在全民族抗战中发挥了中流砥柱作用，提出全面抗战路线，开辟敌后战场，成为抗战的中坚力量。（3）抗日战争是全民族战争，全国各族人民、各民主党派、抗日团体、社会各阶层爱国人士和海外侨胞广泛参加，形成全民族抗战的统一战线。（4）中国人民的抗战得到世界反法西斯力量的同情和支持，苏联、美国等国的援助和配合作战加速了日本法西斯的覆灭。",p:["抗战胜利"]},
{id:"c8q149",ch:8,t:"j",real:true,src:"2013年4月真题",fs:6,q:"《中国人民政治协商会议共同纲领》规定的新中国经济工作方针是什么？",
kw:["公私兼顾","劳资两利","城乡互助","内外交流","发展生产","繁荣经济"],
ref:"1949年9月通过的《中国人民政治协商会议共同纲领》规定，中华人民共和国经济建设的根本方针，是以公私兼顾、劳资两利、城乡互助、内外交流的政策，达到发展生产、繁荣经济之目的。（1）公私兼顾，即兼顾国家、集体和私人利益，国营经济、合作社经济、个体经济、私人资本主义经济、国家资本主义经济五种经济成分并存。（2）劳资两利，即兼顾工人阶级和民族资产阶级的利益，调整劳资关系，发展生产。（3）城乡互助、内外交流，即沟通城乡物资交流，发展对外贸易。这一方针有利于恢复和发展国民经济，巩固新生人民政权。",p:["《共同纲领》"]},
{id:"c8q150",ch:8,t:"j",real:true,src:"2013年4月真题",fs:6,q:"我国社会主义改造基本完成的意义是什么？",
kw:["社会主义基本经济制度","剥削制度被消灭","社会主义初级阶段","根本政治前提","制度基础","历史性巨变"],
ref:"1956年底，我国对农业、手工业和资本主义工商业的社会主义改造基本完成，具有重要意义：（1）社会主义基本经济制度在中国确立，全民所有制和集体所有制成为国民经济的主体，社会主义公有制经济占绝对优势。（2）剥削制度被消灭，剥削阶级作为阶级被消灭，社会主要矛盾发生变化。（3）中国实现了从新民主主义社会到社会主义社会的过渡，进入社会主义初级阶段，为当代中国一切发展进步奠定了根本政治前提和制度基础。（4）极大地解放和发展了生产力，为社会主义工业化奠定了初步基础，是20世纪中国又一次历史性巨变。",p:["社会主义制度确立"]},
{id:"c1q159",ch:1,t:"l",real:true,src:"2013年4月真题",fs:10,q:"近代以来中华民族面临的两大历史任务及其相互关系是什么？",
kw:["求得民族独立和人民解放","实现国家繁荣富强和人民共同富裕","扫清障碍","创造必要前提","最终目的","必然要求","解放和发展生产力"],
ref:"近代中国社会的半殖民地半封建性质和帝国主义与中华民族、封建主义与人民大众的矛盾，决定了近代以来中华民族始终面临两大历史任务。（1）两大历史任务：一是求得民族独立和人民解放；二是实现国家繁荣富强和人民共同富裕。（2）相互关系：二者既相互区别又相互联系。其一，前一任务为后一任务扫清障碍、创造必要前提。不推翻帝国主义和封建主义的统治，不改变半殖民地半封建社会制度，国家就不可能走向繁荣富强，人民也不可能共同富裕。其二，后一任务是前一任务的最终目的和必然要求。求得民族独立和人民解放，归根到底是为了解放和发展生产力，实现国家富强和人民幸福。其三，两大任务不能相互替代，也不能颠倒次序。近代以来无数仁人志士的探索表明，只有先完成民族独立和人民解放，才能为实现国家繁荣富强和人民共同富裕开辟道路。中国共产党领导的新民主主义革命和社会主义建设，正是两大历史任务相继推进的实践。",p:["历史任务"]},
{id:"c10q168",ch:10,t:"l",real:true,src:"2013年4月真题",fs:10,q:"为什么说中共十一届三中全会是新中国成立以来伟大的历史性转折？",
kw:["实事求是","两个凡是","社会主义现代化建设","改革开放","组织路线","伟大转折"],
ref:"1978年12月，中共十一届三中全会在北京召开。全会冲破了长期左倾错误的严重束缚，作出了一系列具有深远意义的决策，因而成为新中国成立以来党的历史上伟大的历史性转折。（1）重新确立了解放思想、实事求是的思想路线，否定两个凡是的错误方针，肯定实践是检验真理的唯一标准，为拨乱反正和改革开放提供了思想前提。（2）重新确立了马克思主义的政治路线，果断停止以阶级斗争为纲，作出把党和国家工作重点转移到社会主义现代化建设上来、实行改革开放的战略决策。（3）重新确立了马克思主义的组织路线，形成以邓小平为核心的中央领导集体，平反冤假错案，健全党内民主和社会主义民主法制。（4）全会标志着中国共产党重新确立了正确的思想路线、政治路线和组织路线，开启了改革开放和社会主义现代化建设新时期，是新中国成立以来具有深远意义的伟大转折。",p:["十一届三中全会"]},
