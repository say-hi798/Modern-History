 ]},
 {h:"6.11 全章题目要点速记",pts:[
  {t:"1931年九一八到1945年9月2日，中国从局部抗战走向全民族抗战并取得胜利。",lv:"★",keys:["1931年九一八事变，局部抗战开始。","1937年七七事变，全国性抗战爆发。","1938年10月武汉会战后，抗战进入战略相持阶段。","1945年9月2日日本签署投降书，抗战胜利结束。"],err:"误把1937年七七当作抗战起点；14年抗战从1931年算起。",hook:"九一八起，七七全面，九二胜利。"},
  {t:"两次淞沪、两次大捷易混：一·二八与八一三，平型关与台儿庄。",lv:"◆",keys:["1932年一·二八事变，十九路军奋起抵抗，史称淞沪抗战。","1937年八一三事变，淞沪会战爆发。","1937年9月平型关大捷，是全国抗战开始后中国军队第一次大胜利。","1938年3月台儿庄大捷，是正面战场第一次重大胜利。"],err:"误把台儿庄当作全国抗战第一次大胜利；第一次是平型关。",hook:"平型关敌后首胜，台儿庄正面首胜。"},
  {t:"抗日民族统一战线经八一宣言、瓦窑堡会议、西安事变到1937年9月正式形成。",lv:"◇",keys:["1935年八一宣言呼吁停止内战、一致抗日。","1935年12月瓦窑堡会议确定建立抗日民族统一战线的方针。","1936年12月西安事变和平解决，统一战线初步形成。","1937年9月国共合作宣言和蒋介石谈话发表，统一战线正式形成。"],err:"误把「初步形成」当作「正式形成」；正式形成在1937年9月。",hook:"方针1935年12月，初步1936年12月，正式1937年9月。"}
 ]}
]},
{ch:7,no:"第七章",title:"为创建新中国而奋斗",period:"中编 · 1919—1949",secs:[
 {h:"7.1 抗战胜利后的形势与重庆谈判",pts:[
  {t:"抗战胜利后中国面临三种建国方案，实质是两种命运、两个前途的抉择。",lv:"★",keys:["国民党主张大地主大资产阶级专政，继续独裁统治。","中间派主张资产阶级共和国方案，走第三条道路。","共产党主张人民民主专政，建立新民主主义国家。"],err:"误以为中间派方案可行；实际第三条道路在中国行不通。",hook:"对比记忆：独裁、共和、人民民主三案并立。"},
  {t:"1945年8月25日，中共中央发表《对目前时局的宣言》，提出「和平、民主、团结」口号。",lv:"◇",keys:["时间为1945年8月25日，抗战胜利之初。","「和平、民主、团结」是抗战胜利后的三大口号。"],err:"易把三大口号与「向北发展，向南防御」混淆；后者是1945年9月的战略方针。",hook:"口诀：和平、民主、团结，三词一宣言。"},
  {t:"1945年8月，毛泽东赴重庆谈判，10月签订《双十协定》。",lv:"★",keys:["1945年8月28日，毛泽东偕周恩来、王若飞飞抵重庆。","10月10日签署《政府与中共代表会谈纪要》，即《双十协定》。","协定确认和平建国方针，但军队和解放区政权问题未达成协议。"],err:"误以为《双十协定》解决了政权与军队问题；实际未达成协议。",hook:"对比记忆：协定签了，焦点没谈拢。"}
 ]},
 {h:"7.2 政治协商会议与国民党的内战准备",pts:[
  {t:"1946年1月，政治协商会议在重庆召开，通过五项有利于和平民主的协议。",lv:"★",keys:["1946年1月10日，政治协商会议在重庆开幕。","通过《和平建国纲领》等五项协议，确认和平建国方针。","协议有利于人民民主，但很快被国民党撕毁。"],err:"误以为政协协议有法律约束力；国民党很快撕毁。",hook:"例子：五项协议只是纸上的和平，终被撕毁。"},
  {t:"国民党制造沧白堂事件、校场口惨案，破坏政协协议的贯彻实施。",lv:"◆",keys:["1946年1月，特务捣毁陪都各界协进会演讲会场，制造沧白堂事件。","1946年2月10日，国民党制造校场口惨案。"],err:"易把校场口惨案记成政协开幕当天；实际在政协闭幕后。",hook:"口诀：先沧白堂、后校场口，都是破坏政协。"},
  {t:"1946年6月26日，国民党军围攻中原解放区，全面内战爆发。",lv:"★",keys:["围攻中原解放区是全面内战爆发的标志。","国民党政府勾结美国，出卖国家主权，激起全国人民反对。"],err:"易把内战爆发时间记成1947年；实为1946年6月。",hook:"对比：1946年6月内战爆发，1947年6月转入进攻。"},
  {t:"1946年11月，国民党召开一党包办的「国民大会」，通过《中华民国宪法》。",lv:"▲",keys:["中国共产党和各民主党派抵制这次「国民大会」。","1947年10月27日，国民党宣布中国民主同盟为「非法团体」，民盟总部被迫解散。"],err:"误以为这次国民大会有各党派参加；实为一党包办。",hook:"对比：一党包办开国大，民盟被宣布非法。"}
 ]},
 {h:"7.3 全面内战的爆发与人民解放军的战略进攻",pts:[
  {t:"全面内战爆发后，毛泽东提出「一切反动派都是纸老虎」的论断。",lv:"▲",keys:["1946年8月，毛泽东同美国记者安娜·路易斯·斯特朗谈话时提出。","1946年11月4日，国民党政府与美国签订《中美友好通商航海条约》。"],err:"易把「纸老虎」论断记在抗战时期；实为1946年全面内战爆发后。",hook:"例子：斯特朗提问，毛泽东答「纸老虎」。"},
  {t:"1946年6月至1947年6月，人民解放军粉碎国民党军的全面进攻和重点进攻。",lv:"★",keys:["1947年3月，国民党军重点进攻陕甘宁和山东解放区。","中共中央主动撤离延安，转战陕北。"],err:"误以为撤离延安是失败；实为主动转移、保存力量。",hook:"口诀：全面进攻、重点进攻，两轮都被粉碎。"},
  {t:"1947年6月30日，刘邓大军强渡黄河、跃进大别山，揭开战略进攻序幕。",lv:"★",keys:["刘伯承、邓小平率晋冀鲁豫野战军主力强渡黄河。","千里跃进大别山，揭开人民解放军战略进攻的序幕。"],err:"易把跃进大别山当作战略决战；它只是战略进攻的序幕。",hook:"对比：1947年跃进是序幕，1948年三大战役是决战。"},
  {t:"1948年12月30日，毛泽东发表《将革命进行到底》新年献词。",lv:"◇",keys:["发表于1948年12月30日，正值三大战役胜利之际。","号召全党全国人民将革命进行到底。"],err:"易误记为1949年；实为1948年底的新年献词。",hook:"口诀：1948年底喊「到底」，1949年过江。"}
 ]},
 {h:"7.4 第二条战线与国统区人民民主运动",pts:[
  {t:"1945年底至1946年底，国民党镇压学生运动，制造一二·一惨案。",lv:"◆",keys:["1945年12月1日，昆明学生反内战运动遭镇压，酿成一二·一惨案。","1946年12月底，北平学生抗议美军暴行，掀起全国「抗暴运动」。"],err:"易把一二·一惨案记成五二〇惨案；前者在昆明、1945年。",hook:"对比：一二·一在昆明，五二〇在南京。"},
  {t:"1947年五二〇运动，标志国统区人民民主运动形成第二条战线。",lv:"★",keys:["1947年5月20日，南京、上海学生举行「反饥饿、反内战、反迫害」运动。","运动遭国民党镇压，酿成五二〇惨案。","以学生运动为先导，形成配合人民解放战争的第二条战线。"],err:"误以为第二条战线是军事战线；实为国统区的人民民主运动。",hook:"对比：第一条战线是军事，第二条战线是学生运动。"},
  {t:"1947年2月28日，台湾人民发动二二八起义，反抗国民党统治。",lv:"▲",keys:["起义发生在1947年2月28日，是台湾人民的反抗斗争。","第二条战线使国民党政府陷于全民包围，加速其统治崩溃。"],err:"易把二二八起义与台盟成立混淆；后者是1947年11月的民主党派。",hook:"例子：二二八起义，全民包围，加速崩溃。"}
 ]},
 {h:"7.5 土地改革与《中国土地法大纲》",pts:[
  {t:"1946年5月4日，中共中央发出五四指示，将减租减息改为没收地主土地。",lv:"★",keys:["文件全称《关于清算、减租及土地问题的指示》。","政策由减租减息转变为没收地主土地分配给农民。"],err:"易把五四指示与《中国土地法大纲》混淆；前者是1946年的政策转变。",hook:"口诀：五四指示改政策，土地大纲废制度。"},
  {t:"1947年10月公布《中国土地法大纲》，废除封建剥削制度，实行耕者有其田。",lv:"★",keys:["规定废除封建性及半封建性剥削的土地制度。","是解放战争时期中国共产党领导土地改革的总纲领。"],err:"易误记为1946年；大纲公布于1947年10月。",hook:"对比：1946年五四指示，1947年土地法大纲。"},
  {t:"土地改革消灭封建剥削制度，激发农民革命和生产积极性。",lv:"◇",keys:["翻身农民踊跃参军支前，为解放战争提供人力物力支援。","农民在政治上、经济上获得解放。"],err:"误以为土改只解决经济问题；它还奠定了解放战争的群众基础。",hook:"例子：分到土地，参军支前，支援前线。"},
  {t:"1947年12月，毛泽东在《目前形势和我们的任务》中提出三大经济纲领。",lv:"▲",keys:["没收封建阶级的土地归农民所有。","没收官僚资本归新民主主义国家所有。","第三项：保护民族工商业。"],err:"易漏掉「保护民族工商业」，只记没收的两项。",hook:"口诀：分土地、收官僚、保民族。"}
 ]},
 {h:"7.6 三大战役与渡江战役",pts:[
  {t:"1948年9月至11月，辽沈战役解放东北全境，歼敌47万余人。",lv:"★",keys:["东北野战军采取「关门打狗」方针，首先攻克锦州。","攻克锦州后封闭国民党军于东北，实现关门打狗。"],err:"易把「关门打狗」记成淮海战役方针；实为辽沈战役。",hook:"口诀：辽沈先打锦州，关门打狗。"},
  {t:"1948年11月至1949年1月，淮海战役以徐州为中心，歼敌55万余人。",lv:"★",keys:["由邓小平、刘伯承、陈毅、粟裕、谭震林组成总前委统一指挥。","以徐州为中心，歼敌55万余人。"],err:"易把两役歼敌数混淆：淮海55万、辽沈47万。",hook:"口诀：淮海55万，五名成员组总前委。"},
  {t:"1948年11月至1949年1月，平津战役基本解放华北全境。",lv:"▲",keys:["由东北野战军与华北军区部队共同发起。","傅作义率部接受和平改编，北平和平解放。"],err:"易以为北平是武力攻克；实为和平解放。",hook:"例子：傅作义接受改编，北平和平解放。"},
  {t:"三大战役共歼敌154万余人，国民党主要军事力量基本被摧毁。",lv:"◆",keys:["三大战役历时四个月零十九天。","国民党赖以维持统治的主要军事力量基本被摧毁。"],err:"易把三大战役歼敌数记成100万；实为154万余人。",hook:"口诀：三战合计154万，主力基本被消灭。"},
  {t:"1949年4月21日发起渡江战役，4月23日占领南京。",lv:"★",keys:["1949年4月北平和谈，国民党拒绝在《国内和平协定》上签字。","毛泽东、朱德发布《向全国进军的命令》。","4月23日占领南京，宣告国民党反动统治的覆灭。"],err:"易把渡江与占领南京混为同日；21日发起、23日占南京。",hook:"口诀：4月21日过江，4月23日占南京。"}
 ]},
 {h:"7.7 七届二中全会与「两个务必」",pts:[
  {t:"1949年3月，中共七届二中全会在河北西柏坡召开，工作重心转向城市。",lv:"★",keys:["确定党的工作重心由乡村转移到城市。","以恢复和发展生产为城市工作的中心任务。"],err:"易误记会议地点为延安；实为河北西柏坡。",hook:"口诀：西柏坡开会，乡村转城市。"},
  {t:"毛泽东提出「两个务必」，要求保持谦虚谨慎、艰苦奋斗的作风。",lv:"★",keys:["务必保持谦虚、谨慎、不骄、不躁的作风。","务必保持艰苦奋斗的作风。"],err:"易只记「艰苦奋斗」，漏掉「谦虚谨慎、不骄不躁」。",hook:"口诀：两个务必，谦虚谨慎加艰苦奋斗。"},
  {t:"七届二中全会规定胜利后的基本政策，提出由农业国变为工业国。",lv:"◇",keys:["规定了革命胜利后党在政治、经济、外交等方面的基本政策。","中国要由农业国转变为工业国，由新民主主义社会转变为社会主义社会。"],err:"易把两个转变记成一步到位；实为两步转变。",hook:"口诀：农业国变工业国，新民主主义变社会主义。"},
  {t:"1949年6月30日，毛泽东发表《论人民民主专政》，阐述新中国政权性质。",lv:"★",keys:["新中国实行工人阶级领导的、以工农联盟为基础的人民民主专政。","系统阐述了人民民主专政的理论。"],err:"易把发表时间记在政协会议后；实为1949年6月30日。",hook:"对比：6月30日讲理论，9月定《共同纲领》。"}
 ]},
 {h:"7.8 《共同纲领》与中华人民共和国的成立",pts:[
  {t:"1949年9月21日，政协第一届全体会议在北平召开，代行全国人大职权。",lv:"★",keys:["会议于1949年9月21日在北平开幕。","通过《中国人民政治协商会议共同纲领》。","在新中国成立初期代行全国人民代表大会职权。"],err:"易误记为1949年10月；实际9月21日开幕。",hook:"口诀：九月开政协，十月开国大典。"},
  {t:"《共同纲领》是新中国的施政纲领，起着临时宪法的作用。",lv:"★",keys:["规定中华人民共和国为新民主主义即人民民主主义的国家。","实行工人阶级领导、以工农联盟为基础的人民民主专政。","规定国家政权机关实行民主集中制。"],err:"易把《共同纲领》当成正式宪法；它只起临时宪法作用。",hook:"对比：《共同纲领》临时宪法，1954年宪法正式宪法。"},
  {t:"1949年10月1日开国大典，中华人民共和国中央人民政府成立。",lv:"◆",keys:["定都北平并改名北京，采用公元纪年。","以《义勇军进行曲》为代国歌，五星红旗为国旗。","标志着新民主主义革命取得基本胜利，中国历史进入新纪元。"],err:"易把代国歌记成正式国歌；当时确定的是「代国歌」。",hook:"例子：定都北京、公元纪年、五星红旗、代国歌。"}
 ]},
 {h:"7.9 新民主主义革命胜利的历史意义与基本经验",pts:[
  {t:"新民主主义革命的胜利，结束了帝国主义、封建主义和官僚资本主义的统治。",lv:"★",keys:["是马克思列宁主义、毛泽东思想的胜利。","统一战线、武装斗争、党的建设是战胜敌人的三大法宝。"],err:"易把三大法宝记成四项；实为统一战线、武装斗争、党的建设。",hook:"口诀：三大法宝，统一战线、武装斗争、党的建设。"},
  {t:"新民主主义革命的胜利，改变了世界政治力量的对比。",lv:"◇",keys:["增强了世界和平进步力量。","是继俄国十月革命和世界反法西斯战争胜利之后最重大的事件之一。"],err:"易把十月革命与反法西斯战争胜利的先后次序记反。",hook:"对比：十月革命、反法西斯胜利、中国革命胜利。"},
  {t:"中国革命的基本经验是坚持党的领导、武装斗争和统一战线。",lv:"★",keys:["坚持中国共产党的领导。","坚持人民军队的武装斗争。","坚持革命的统一战线。"],err:"易把基本经验与三大法宝混同；二者表述角度不同。",hook:"口诀：党的领导加武装斗争、统一战线。"}
 ]},
 {h:"7.10 全章题目要点速记",pts:[
  {t:"抗战胜利后，中共争取和平民主，国民党破坏政协协议，内战一触即发。",lv:"★",keys:["1945年9月，中共中央确定「向北发展，向南防御」，抢占东北战略要地。","1945年9至10月，刘伯承、邓小平指挥上党战役，粉碎国民党军进攻。","重庆谈判焦点是解放区政权和人民军队问题，国共未能达成协议。","1946年1月10日，国共签订《停战协定》，同日政协在重庆开幕。","政协通过《和平建国纲领》等五项协议；国民党制造沧白堂事件、下关惨案破坏。"],err:"易把停战协定与政协开幕当成两件不同日期的事；二者同为1月10日。",hook:"对比：1月10日两件事，停战协定与政协开幕。"},
  {t:"全面内战爆发后，人民解放军以自卫战争粉碎国民党军进攻。",lv:"▲",keys:["1946年6月底，李先念等率中原军区部队突围，揭开解放战争序幕。","中国共产党以自卫战争粉碎进攻，集中优势兵力、各个歼灭敌人。","1947年3月，国民党重点进攻陕北、山东；西北野战军三战三捷稳定陕北。","1947年5月，孟良崮战役全歼整编第七十四师，粉碎对山东的重点进攻。","1947年5月20日五二〇惨案，国统区第二条战线逐渐形成。"],err:"易把中原突围与全面内战爆发混为一事；突围在1946年6月底。",hook:"口诀：突围、自卫、三捷、孟良崮、五二〇。"},
  {t:"1947年人民解放军转入战略进攻，国统区陷入严重经济危机。",lv:"★",keys:["1947年6月底，刘邓大军千里跃进大别山，揭开战略进攻序幕。","陈谢兵团挺进豫西、陈粟大军挺进豫皖苏，与刘邓成「品字形」。","1947年10月10日，《中国人民解放军总部宣言》提出「打倒蒋介石，解放全中国」。","1947年11月，台湾民主自治同盟在香港成立，是解放战争时期的民主党派。","国统区经济危机突出表现为财政赤字、恶性通货膨胀、物价飞涨、法币贬值。"],err:"易把12月会议与总部宣言混淆；口号由1947年10月10日宣言提出。",hook:"口诀：三路大军品字形，十月宣言喊打倒。"},
  {t:"解放区土地改革深入开展，1948年完整提出土地改革总路线。",lv:"◆",keys:["1947年，中共中央公布《中国土地法大纲》，按乡村全部人口平均分配土地。","1948年，毛泽东完整提出土改总路线：依靠贫农，团结中农，消灭封建剥削制度。","解放区土改使农民政治经济翻身，踊跃参军支前，奠定群众基础。","1948年4月，毛泽东在《在晋绥干部会议上的讲话》完整提出新民主主义革命总路线。","1948年4月30日，中共中央发布「五一口号」，号召召开新政协、成立民主联合政府。"],err:"易把土改总路线与新民主主义革命总路线混同；前者仅指土地改革。",hook:"对比：1947年大纲分地，1948年总路线定型。"},
  {t:"1948年秋至1949年，战略决战、渡江战役与七届二中全会接续展开。",lv:"★",keys:["1948年9月，华东野战军攻克济南，切断国民党军南北联系。","辽沈战役歼敌47万，解放东北全境；三大战役共歼敌154万，基本消灭国民党军主力。","1949年4月21日，二野、三野在西起湖口、东至江阴发起渡江战役。","七届二中全会提出「两个务必」，背景是党即将成为掌握全国政权的执政党。"],err:"易漏记济南战役的作用；它切断了国民党军南北联系。",hook:"口诀：济南开局、三大战役、过江、两个务必。"},
  {t:"1949年筹建新中国，人民民主专政理论与《共同纲领》相继确立。",lv:"▲",keys:["人民民主专政的基础是工人阶级、农民阶级和城市小资产阶级的联盟，主要是工农联盟。","1949年9月，政协第一届全体会议通过《共同纲领》，起临时宪法作用。","《共同纲领》规定政权机关实行民主集中制的人民代表大会制度。","政协是人民民主统一战线的组织形式，新中国成立初期代行全国人大职权。","1949年10月1日，开国大典在北京天安门广场举行。"],err:"易把《论人民民主专政》与《共同纲领》的作用混同；前者是理论阐述，后者是施政纲领。",hook:"对比：讲理论、定纲领、开国大典。"}
 ]}
]},
{ch:8,no:"第八章",title:"社会主义基本制度的全面确立",period:"下编 · 1949—至今",secs:[
 {h:"8.1 新中国的成立与《共同纲领》",pts:[
  {t:"1949年10月1日，中华人民共和国成立，标志新民主主义社会在全国建立。",lv:"★",keys:["开国大典在北京天安门广场举行，毛泽东宣告中央人民政府成立。","标志着新民主主义社会在全国范围的建立。"],err:"易把新中国成立记为社会主义制度确立；实为新民主主义社会的开始。",hook:"对比：1949年建国，1956年社会主义制度确立。"},
  {t:"1949年9月，政协第一届全体会议通过《共同纲领》，起临时宪法作用。",lv:"★",keys:["1949年9月21日，政协第一届全体会议在北京召开。","《共同纲领》规定国体、政体等基本制度，起临时宪法作用。","国体为工人阶级领导、以工农联盟为基础的人民民主专政。"],err:"易把会议地点记成重庆；旧政协在重庆，新政协在北京。",hook:"对比：旧政协重庆（1946），新政协北京（1949）。"},
  {t:"《共同纲领》规定政体为人民代表大会制度，政权机关实行民主集中制。",lv:"◆",keys:["会议选举毛泽东为中央人民政府主席。","定都北平并改名北京，采用公元纪年，以《义勇军进行曲》为代国歌。","1949年10月1日举行开国大典。"],err:"易把政体记成总统制；实为人民代表大会制度。",hook:"口诀：国体人民民主专政，政体人民代表大会。"}
 ]},
 {h:"8.2 新中国成立的历史意义与新民主主义社会",pts:[
  {t:"新中国的成立标志新民主主义革命基本胜利，中国人民从此站起来了。",lv:"★",keys:["实现了民族独立和人民解放。","结束了帝国主义、封建主义和官僚资本主义在中国的统治。"],err:"易把「站起来」与社会主义制度确立混淆；站起来指1949年。",hook:"例子：1949年天安门城楼上一句「站起来了」。"},
  {t:"新民主主义社会是过渡性质的社会，属于社会主义体系。",lv:"◇",keys:["是中国从新民主主义向社会主义转变的中间环节。","属于社会主义体系，方向是社会主义。"],err:"易把新民主主义社会当成独立社会形态；它是过渡性质的社会。",hook:"对比：新民主主义社会是过渡桥，不是终点站。"},
  {t:"新民主主义社会经济存在五种成分，社会主义性质的国营经济居领导地位。",lv:"★",keys:["五种成分是国营、合作社、个体、私人资本主义、国家资本主义经济。","国营经济掌握国家的经济命脉。"],err:"易漏记「国家资本主义经济」这一成分。",hook:"口诀：国、合、个、私、国家资本主义。"},
  {t:"土改完成后，主要矛盾变为工人阶级与资产阶级、社会主义与资本主义道路的矛盾。",lv:"★",keys:["新中国成立初期的主要任务是完成民主革命遗留任务、恢复国民经济。","同时巩固人民民主专政。"],err:"易把主要矛盾的转变提前到建国之初；土改完成后才转变。",hook:"对比：建国初完成遗留任务，土改后两个矛盾。"}
 ]},
 {h:"8.3 土地改革",pts:[
  {t:"1950年6月颁布《中华人民共和国土地改革法》，新解放区土改全面展开。",lv:"★",keys:["新解放区土改从1950年冬开始，到1952年底基本完成。","全国约3亿多无地少地农民无偿获得约7亿亩土地。"],err:"易把土改法记成1947年《中国土地法大纲》；后者是解放战争时期。",hook:"对比：1947年大纲管老区，1950年土改法管新解放区。"},
  {t:"土地改革的基本目的是废除封建土地所有制，实行农民的土地所有制。",lv:"▲",keys:["废除地主阶级封建剥削的土地所有制。","把土地变为农民所有制，解放农村生产力。"],err:"易把目的记成土地国有化；实为农民土地所有制。",hook:"口诀：废封建、行农民所有制。"},
  {t:"土改完成消灭封建剥削制度，巩固工农联盟和人民民主专政。",lv:"◆",keys:["为农业社会主义改造创造了条件。","地主阶级作为阶级被消灭。"],err:"易只记经济意义，漏掉巩固工农联盟的政治意义。",hook:"例子：分地、工农联盟巩固、农业改造有基础。"}
 ]},
 {h:"8.4 抗美援朝",pts:[
  {t:"1950年10月，中共中央作出抗美援朝、保家卫国的战略决策。",lv:"★",keys:["1950年6月朝鲜战争爆发，美国武装干涉并把战火烧到东北边境。","志愿军在司令员兼政治委员彭德怀率领下，于10月19日跨过鸭绿江。"],err:"易把志愿军司令员记成他人；实为彭德怀。",hook:"口诀：彭德怀率志愿军，10月19日过江。"},
  {t:"1953年7月朝鲜停战协定签订，抗美援朝战争取得伟大胜利。",lv:"★",keys:["1953年7月27日，《朝鲜停战协定》在板门店签订。","1952年10月上甘岭战役胜利，创造依托坑道坚守防御的范例。"],err:"易把停战协定记成和平条约；它只是停战协定。",hook:"对比：1950年过江，1953年停战，历时三年。"},
  {t:"抗美援朝打破美军不可战胜的神话，极大提高新中国的国际地位。",lv:"◆",keys:["为国家经济建设和社会改革赢得相对稳定的和平环境。","打出了国威和军威，创造了以弱胜强的范例。"],err:"易只记军事胜利，忽略国际地位提高和和平环境。",hook:"例子：以弱胜强、国威军威、和平环境。"}
 ]},
 {h:"8.5 「三反」「五反」运动",pts:[
  {t:"1951年底至1952年，党政机关开展反贪污、反浪费、反官僚主义的「三反」运动。",lv:"★",keys:["运动对象是党政机关工作人员。","刘青山、张子善因贪污国家资财被依法判处死刑。"],err:"易把「三反」对象记成私营工商业者；三反在党政机关开展。",hook:"口诀：三反，反贪污、反浪费、反官僚主义。"},
  {t:"「五反」在私营工商业者中开展，针对五类违法经营行为。",lv:"★",keys:["「三反」揭露的问题，推动在私营工商业者中开展「五反」。","内容是反行贿、反偷税漏税、反盗骗国家财产。","还包括反偷工减料、反盗窃国家经济情报。"],err:"易把「五反」当成「三反」的重复；对象是私营工商业者。",hook:"口诀：五反，行贿、偷税、盗骗、偷工、情报。"},
  {t:"「三反」「五反」打击不法资本家，教育挽救干部，巩固人民民主专政。",lv:"◆",keys:["巩固了国营经济的领导地位。","教育和挽救了一批干部，加强了执政党建设。"],err:"易把两场运动的作用混同；三反重在干部，五反重在不法资本家。",hook:"对比：三反治干部，五反治不法资本家。"}
 ]},
 {h:"8.6 过渡时期总路线与「一化三改」",pts:[
  {t:"1953年，中共中央提出过渡时期总路线，逐步实现「一化三改」。",lv:"★",keys:["到1952年底，国民经济恢复任务胜利完成。","「一化」是逐步实现国家的社会主义工业化。","「三改」是逐步实现对农业、手工业和资本主义工商业的社会主义改造。"],err:"易把「三改」记成两个行业；实为农业、手工业、资本主义工商业。",hook:"口诀：一化三改，工业化加三大改造。"},
  {t:"过渡时期总路线的实质是改变生产资料私有制，建立社会主义经济基础。",lv:"★",keys:["总路线要求在一个相当长的时期内逐步完成。","反映了中国由新民主主义向社会主义过渡的历史必然性。"],err:"易把总路线只理解为工业化，忽略三大改造。",hook:"对比：一化是工业化，三改是改造私有制。"},
  {t:"过渡时期总路线于1954年载入宪法，被称为照耀各项工作的灯塔。",lv:"◇",keys:["1954年载入《中华人民共和国宪法》。","被称为照耀各项工作的灯塔。"],err:"易误记为1953年入宪；1953年提出、1954年载入。",hook:"对比：1953年提出，1954年入宪。"}
 ]},
 {h:"8.7 第一个五年计划与社会主义工业化",pts:[
  {t:"第一个五年计划从1953年开始实施，到1957年底超额完成。",lv:"★",keys:["基本任务是集中主要力量发展重工业。","为国家工业化奠定初步基础。"],err:"易把一五重点记成轻工业；实为优先发展重工业。",hook:"口诀：一五重工，156项为骨干。"},
  {t:"「一五」期间以「156项」重点工程为中心展开工业建设。",lv:"▲",keys:["1956年长春第一汽车制造厂建成投产，生产「解放」牌载重汽车。","1957年武汉长江大桥建成通车。","鞍钢的大型轧钢厂、无缝钢管厂建成投产。","建立起飞机制造、汽车制造、新式机床制造等部门。"],err:"易把长春一汽记成1957年投产；实为1956年。",hook:"例子：一汽、武汉长江大桥、鞍钢三大标志。"}
 ]},
 {h:"8.8 对农业、手工业的社会主义改造",pts:[
  {t:"农业社会主义改造坚持自愿互利、典型示范、国家帮助的原则。",lv:"★",keys:["经历互助组、初级社到高级社的发展过程。","1955年夏季以后掀起高潮，进入以高级社为中心的阶段。","1955年毛泽东发表《关于农业合作化问题》，推动高潮到来。"],err:"易把合作化步骤记乱；顺序是互助组、初级社、高级社。",hook:"口诀：互、初、高，三步走。"},
  {t:"到1956年底，全国96.3%的农户加入农业生产合作社，农业改造基本完成。",lv:"★",keys:["农业改造把农民个体所有制改造为社会主义集体所有制。","改造的目标是实现共同富裕。"],err:"易把完成时间记成1957年；农业改造在1956年底基本完成。",hook:"例子：96.3%的农户入社，转向集体所有制。"},
  {t:"手工业改造采取积极领导、稳步前进的方针，经过三种组织形式。",lv:"▲",keys:["由供销小组、供销合作社到生产合作社。","到1956年底，91.7%的手工业者加入合作社，改造基本完成。"],err:"易把手工业步骤与农业混淆；顺序为供销小组、供销社、生产合作社。",hook:"口诀：手工业，小组、供销社、生产社。"},
  {t:"农业和手工业合作化完成，为社会主义经济制度的建立奠定基础。",lv:"◇",keys:["农业合作化促进了农业生产的发展。","手工业合作化促进了手工业的发展。"],err:"易只记改造完成，忽略其对生产发展的促进作用。",hook:"例子：合作化、生产发展、制度基础。"}
 ]},
 {h:"8.9 对资本主义工商业的社会主义改造",pts:[
  {t:"对资本主义工商业采取和平赎买政策，是中国共产党的一大创举。",lv:"★",keys:["通过国家资本主义的途径逐步实现改造。","减少了改造的阻力，团结了民族资产阶级。"],err:"易把赎买理解为无偿没收；赎买是有偿地把生产资料收归国有。",hook:"对比：官僚资本没收，民族资本赎买。"},
  {t:"国家资本主义初级形式是加工订货、统购包销、经销代销，高级形式是公私合营。",lv:"★",keys:["初级形式包括加工订货、统购包销、经销代销。","高级形式是公私合营。","公私合营由个别企业公私合营发展到全行业公私合营。"],err:"易把公私合营当成初级形式；它是高级形式。",hook:"口诀：初级加工订货，高级公私合营。"},
  {t:"1956年全行业公私合营掀起高潮，资本主义工商业改造基本完成。",lv:"◆",keys:["国家实行定息制度，按年息五厘付给资本家定息。","定息至1966年停止支付。","个别企业公私合营阶段，利润按「四马分肥」分配，即分给国家、企业、职工和资方。"],err:"易把定息年息记错；实为年息五厘。",hook:"例子：五厘定息，一直付到1966年。"}
 ]},
 {h:"8.10 1954年宪法与社会主义基本制度的确立",pts:[
  {t:"1954年9月，第一届全国人大第一次会议通过《中华人民共和国宪法》。",lv:"★",keys:["这是我国第一部社会主义类型的宪法。","以《共同纲领》为基础，又是它的发展。","确立了人民代表大会制度这一根本政治制度。"],err:"易把1954年宪法记成临时宪法；《共同纲领》才起临时宪法作用。",hook:"对比：《共同纲领》临时，1954年宪法第一部社会主义类型。"},
  {t:"会议选举毛泽东为中华人民共和国主席，刘少奇为人大常委会委员长。",lv:"◇",keys:["任命周恩来为国务院总理。","会议于1954年9月在北京召开。"],err:"易把刘少奇的职务记成国务院总理；他是人大委员长。",hook:"口诀：毛主席、刘委员长、周总理。"},
  {t:"到1956年底社会主义改造基本完成，社会主义基本制度在中国全面确立。",lv:"★",keys:["是中国历史上最深刻最伟大的社会变革。","为当代中国一切发展进步奠定根本政治前提和制度基础。","消灭了延续几千年的剥削制度，剥削阶级基本被消灭。"],err:"易把制度确立时间记成1949年；实为1956年底。",hook:"对比：1949年建国，1956年制度确立。"}
 ]},
 {h:"8.11 全章题目要点速记",pts:[
  {t:"新中国成立初期，党和政府完成民主革命遗留任务，统一财经、恢复经济。",lv:"★",keys:["1950年6月七届三中全会确定中心任务：争取国家财政经济状况基本好转。","毛泽东作《为争取国家财政经济状况的基本好转而斗争》的书面报告。","没收官僚资本建立国营经济；实行「另起炉灶」「打扫干净屋子再请客」「一边倒」。","陈云领导「银元之战」「米棉之战」，稳定物价、统一全国财经工作。","工矿企业民主改革废除封建把头制度，确立工人的主人翁地位。"],err:"易把没收官僚资本误认为没收民族资本；前者建立国营经济。",hook:"口诀：财经好转、没收官僚、三大外交、银元米棉。"},
  {t:"新解放区土地改革与镇压反革命运动，巩固了新生的人民政权。",lv:"▲",keys:["1950年土改法废除地主阶级封建剥削的土地所有制，实行农民的土地所有制。","到1953年春，新解放区土改基本完成，3亿多农民分到土地，地主阶级被消灭。","土改总路线是依靠贫农、雇农，团结中农，中立富农。","1950年10月开展镇压反革命运动。","1951年5月签订十七条协议，10月解放军进驻拉萨，西藏和平解放。"],err:"易把十七条协议与西藏和平解放混为一事；签约在5月，进驻拉萨在10月。",hook:"对比：土改分地、镇反巩固、西藏和平解放。"},
  {t:"抗美援朝战争打出国威军威，为国内建设赢得和平环境。",lv:"◇",keys:["1952年10月上甘岭战役胜利，创造依托坑道坚守防御的范例。","1953年7月27日，《朝鲜停战协定》在板门店签订。","抗美援朝是正义战争，创造了以弱胜强的范例。","支援了朝鲜人民、保卫了国家安全，赢得相对稳定的和平环境。"],err:"易把上甘岭战役记在1953年；实为1952年10月。",hook:"口诀：上甘岭坚守、板门店停战、以弱胜强。"},
  {t:"「三反」运动严惩贪污，教育干部、纯洁队伍、加强执政党建设。",lv:"◆",keys:["刘青山、张子善因贪污国家资财被依法判处死刑。","运动教育了广大干部，纯洁了干部队伍，加强了执政党建设。"],err:"易把刘青山、张子善案记在「五反」中；它属「三反」运动。",hook:"例子：两名高级干部因贪污被处死刑。"},
  {t:"「一五」计划与三大改造，奠定社会主义工业化和公有制的基础。",lv:"★",keys:["一五计划1953至1957年实施，优先发展重工业，鞍钢等重点工程建成投产。","过渡时期总路线的实质是改变生产资料私有制，建立社会主义经济基础。","1955年毛泽东《关于农业合作化问题》推动高潮；农业改造实现集体所有制。","个别企业公私合营按「四马分肥」；赎买是有偿收归国有，如付定息。","1956年改造基本完成，公有制占绝对优势，剥削阶级基本消灭。"],err:"易把「四马分肥」的时间记成全行业公私合营阶段；实为个别企业公私合营阶段。",hook:"口诀：一五重工、一化三改、四马分肥、五厘定息。"},
  {t:"新中国外交与民族区域自治：和平共处五项原则与万隆会议求同存异。",lv:"▲",keys:["1953年12月，周恩来接见印度代表团时首次提出和平共处五项原则。","1954年6月，周恩来访问印度、缅甸，同两国总理共同倡导五项原则。","1955年4月，周恩来在万隆会议提出「求同存异」方针。","1947年5月，内蒙古自治区成立，是我国最早的省级民族自治区。"],err:"易把首次提出记成万隆会议；五项原则首提于1953年12月。",hook:"对比：1953首提、1954共倡、1955求同存异。"}
 ]}
]},
{ch:9,no:"第九章",title:"社会主义建设在探索中曲折发展",period:"下编 · 1949—至今",secs:[
 {h:"9.1 《论十大关系》",pts:[
  {t:"1956年4月毛泽东发表《论十大关系》讲话，以苏联经验教训为鉴戒。",lv:"★",keys:["1956年4月，毛泽东在中央政治局扩大会议上发表讲话。","讲话以苏联的经验教训为鉴戒，初步总结我国社会主义建设经验。","《论十大关系》的发表，标志党探索中国自己社会主义建设道路的开始。"],err:"误以为该讲话标志社会主义改造完成；改造基本完成在1956年底。",hook:"口诀「十大关系开新路，探索走自己的路」。"},
  {t:"《论十大关系》论述十大关系，提出调动一切积极因素的基本方针。",lv:"▲",keys:["基本方针是调动一切积极因素，为社会主义事业服务。","论述重工业和轻工业、农业，沿海和内地工业，经济建设和国防建设等关系。"],err:"误把基本方针记成「多快好省」；那是1958年总路线的内容。",hook:"对比「十大关系讲协调，总路线讲速度」。"}
 ]},
 {h:"9.2 中共八大",pts:[
  {t:"1956年9月中共八大召开，正确分析主要矛盾，提出集中力量发展社会生产力。",lv:"★",keys:["1956年9月15日至27日，中共八大在北京召开。","八大指出工人阶级同资产阶级的矛盾已不是我国社会的主要矛盾。","主要矛盾是先进工业国要求同落后农业国现实、人民经济文化需要同现状不能满足之间的矛盾。","主要任务是集中力量发展生产力，尽快从落后农业国变为先进工业国。","坚持既反保守又反冒进、在综合平衡中稳步前进的经济建设方针。"],err:"误以为八大仍以阶级斗争为主要矛盾；八大已转向经济建设。",hook:"口诀「八大矛盾看生产，综合平衡稳步前」。"},
  {t:"八大着重提出执政党建设问题，强调民主集中制和集体领导、反对个人崇拜。",lv:"◆",keys:["八大强调坚持民主集中制和集体领导制度，反对个人崇拜。","八大选举毛泽东为中央委员会主席，邓小平为中央委员会总书记。","八大路线正确，为社会主义事业发展和党的建设指明方向。","许多正确意见没有能够在实践中坚持下去。"],err:"误以为八大路线本身有误；路线正确，是后来未能坚持。",hook:"对比「路线正确，可惜未坚持」。"}
 ]},
 {h:"9.3 《关于正确处理人民内部矛盾的问题》",pts:[
  {t:"1957年2月毛泽东作《关于正确处理人民内部矛盾的问题》讲话，阐明两类矛盾学说。",lv:"★",keys:["1957年2月，毛泽东在最高国务会议上发表这一讲话。","必须区分敌我矛盾和人民内部矛盾两类不同性质的矛盾。","敌我矛盾用专政方法解决，人民内部矛盾用民主、说服教育的方法解决。","解决人民内部矛盾实行「团结—批评—团结」的方针。","正确处理人民内部矛盾是国家政治生活的主题。"],err:"误以为两类矛盾用同一方法解决；专政与民主方法必须分开。",hook:"口诀「敌我专政，人民民主，团结批评团结」。"},
  {t:"讲话重申「百花齐放、百家争鸣」方针，指出社会主义社会基本矛盾仍然存在。",lv:"▲",keys:["「百花齐放、百家争鸣」是发展科学文化事业的方针。","社会主义社会基本矛盾仍是生产关系和生产力、上层建筑和经济基础之间的矛盾。"],err:"误把「双百」方针当作政治斗争方针；它是科学文化工作方针。",hook:"口诀「双百方针兴科学文化」。"}
 ]},
 {h:"9.4 整风运动与反右派斗争",pts:[
  {t:"1957年4月中央发出整风指示，以反对官僚主义、宗派主义和主观主义为主要内容。",lv:"★",keys:["整风运动以反对官僚主义、宗派主义、主观主义为主要内容。","采取开门整风的形式，发动广大群众和党外人士提出批评建议。"],err:"误以为整风只在党内封闭进行；实际是开门整风、广纳意见。",hook:"口诀「反三风：官僚、宗派、主观」。"},
  {t:"1957年6月开始的反对资产阶级右派的斗争是必要的，但被严重扩大化。",lv:"◆",keys:["整风中极少数资产阶级右派分子乘机向党和社会主义制度发动进攻。","把一批知识分子、爱国人士和党内干部错划为「右派分子」，造成不幸后果。"],err:"误以为反右派斗争完全不必要；斗争必要，错误在严重扩大化。",hook:"对比「斗争必要，扩大化错误」。"}
 ]},
 {h:"9.5 「大跃进」运动",pts:[
  {t:"1958年5月八大二次会议通过社会主义建设总路线，反映愿望但忽视客观经济规律。",lv:"★",keys:["总路线是「鼓足干劲、力争上游、多快好省地建设社会主义」。","总路线反映人民迫切要求改变我国经济文化落后状况的普遍愿望。","但总路线忽视了客观经济规律。"],err:"误以为总路线完全错误；愿望可取，错在忽视客观经济规律。",hook:"口诀「鼓足干劲争上游，多快好省建社会主义」。"},
  {t:"「大跃进」从1958年开始，片面追求高速度，不断大幅度提高计划指标。",lv:"★",keys:["工业以钢为纲，1958年8月北戴河会议提出钢产量翻番达1070万吨的指标。","农业大放「高产卫星」，虚报产量，浮夸风严重泛滥。","大跃进以全民大炼钢铁为中心，造成人力物力严重浪费。","造成国民经济主要比例关系严重失调，社会主义建设遭受严重挫折。"],err:"误记1070万吨为实际产量；那是脱离实际的高指标。",hook:"例子「1070万吨钢，靠土法炼钢吹出来」。"}
 ]},
 {h:"9.6 人民公社化运动",pts:[
  {t:"1958年8月北戴河会议作出在农村普遍建立人民公社的决议。",lv:"★",keys:["1958年8月北戴河会议通过《关于在农村建立人民公社问题的决议》。","人民公社的基本特点是「一大二公」，实行政社合一。","「一大二公」即规模大、公有化程度高，政权组织与经济组织合为一体。","大搞「一平二调」，刮起「共产风」，实行平均主义分配。"],err:"误记公社分配原则为按劳分配；实际搞平均主义、刮「共产风」。",hook:"口诀「一大二公政社合一，一平二调刮共产风」。"},
  {t:"人民公社化运动脱离农村生产力水平，挫伤农民积极性，是探索中的严重失误。",lv:"◆",keys:["人民公社化严重脱离当时农村生产力的发展水平。","严重挫伤了广大农民的生产积极性。","「大跃进」和人民公社化运动是党探索自己建设道路中的一次严重失误。","调整时期人民公社实行三级所有、队为基础，核算单位下放到生产队。"],err:"误以为公社化是生产力发展的结果；它超越了生产力水平。",hook:"对比「生产关系跑在了生产力前面」。"}
 ]},
 {h:"9.7 国民经济的调整",pts:[
  {t:"1961年1月八届九中全会决定对国民经济实行「调整、巩固、充实、提高」八字方针。",lv:"★",keys:["八字方针的中心是调整，主要是调整国民经济各部门的比例关系。","大力加强农业，压缩基本建设规模。","1960年冬中央已决定实行八字方针，1961年1月八届九中全会正式通过。"],err:"误记八字方针中心为巩固；中心是调整。",hook:"口诀「调整巩固充实提高，中心落在调整上」。"},
  {t:"1962年1月七千人大会初步总结「大跃进」以来的经验教训。",lv:"▲",keys:["1962年1月，中共中央召开扩大的中央工作会议，即七千人大会。","大会发扬民主，开展批评和自我批评。","强调恢复和坚持民主集中制，统一了全党认识。","到1965年，国民经济调整任务基本完成，国民经济得到恢复和发展。"],err:"误记七千人大会在1959年；实际是1962年1月。",hook:"例子「七千人开会，大家讲真话」。"},
  {t:"1964年底至1965年初三届全国人大一次会议，周恩来提出「四个现代化」目标。",lv:"◆",keys:["周恩来在政府工作报告中提出实现「四个现代化」的宏伟目标。","目标是把我国建成具有现代工业、现代农业、现代国防和现代科学技术的社会主义强国。","1959年4月，第二届全国人大一次会议选举刘少奇为中华人民共和国主席。"],err:"误记为二届全国人大提出四化；实际是1964年底三届全国人大一次会议。",hook:"口诀「工业、农业、国防、科技，四个现代化」。"}
 ]},
 {h:"9.8 「文化大革命」的严重失误",pts:[
  {t:"「文化大革命」从1966年5月发动到1976年10月粉碎「四人帮」结束，历时十年。",lv:"★",keys:["1966年5月中央政治局扩大会议通过《五一六通知》，标志文革全面发动。","1966年8月八届十一中全会通过《关于无产阶级文化大革命的决定》，即《十六条》。","1967年1月上海「一月革命」夺权后全国掀起夺权高潮，武斗不止。","1969年4月中共九大全面肯定文革，使错误理论和实践合法化。","1967年2月谭震林、陈毅、叶剑英等批评文革错误，被诬为「二月逆流」。"],err:"误记文革以《十六条》发动；全面发动标志是《五一六通知》。",hook:"口诀「五一六发动，十六条展开，九大合法化」。"},
  {t:"1971年九一三事件，林彪反革命集团阴谋发动武装政变被粉碎。",lv:"◆",keys:["1971年9月，林彪集团阴谋发动武装政变被粉碎。","林彪等人叛逃，在蒙古温都尔汗机毁身亡。","1970年8月九届二中全会上，林彪集团抢班夺权的阴谋被毛泽东识破。"],err:"误记九一三事件在1970年；实际是1971年9月。",hook:"例子「温都尔汗坠机，林彪集团覆灭」。"},
  {t:"1976年10月中央政治局粉碎江青反革命集团，「文化大革命」结束。",lv:"★",keys:["1976年10月，中央政治局执行党和人民的意志，粉碎「四人帮」。","1976年4月天安门广场悼念周恩来、反对「四人帮」的群众运动即「四五运动」。","1975年邓小平主持中央日常工作，对各条战线全面整顿，形势明显好转。","文革不是任何意义上的革命和社会进步，使党和国家遭到新中国成立以来最严重挫折。"],err:"误把文革当作革命或社会进步；它是全局性的严重错误。",hook:"口诀「四五悼周，七五整顿，十月除四害」。"}
 ]},
 {h:"9.9 社会主义建设的主要成就",pts:[
  {t:"「文化大革命」等严重挫折中，我国社会主义建设仍取得一批重要科技成就。",lv:"★",keys:["1964年10月，我国自行研制的第一颗原子弹爆炸成功。","1967年6月，我国第一颗氢弹爆炸成功。","1970年4月，我国第一颗人造地球卫星「东方红一号」发射成功。","1965年，我国在世界上首次人工合成结晶牛胰岛素。","1973年，袁隆平成功培育出籼型杂交水稻，为解决粮食问题作出重大贡献。"],err:"误记原子弹与氢弹同年爆炸；原子弹1964年，氢弹1967年。",hook:"口诀「六四原子弹，六七氢弹，七〇卫星东方红」。"},
  {t:"20世纪60年代大庆油田建成投产，我国实现石油基本自给，甩掉「贫油国」帽子。",lv:"◆",keys:["1960年大庆油田开始大规模开发，结束了中国石油依赖进口的历史。","三线建设建成攀枝花钢铁基地、成昆铁路等一批项目，改善了工业布局。","1968年南京长江大桥建成通车，是探索时期的重要建设成就。"],err:"误记大庆油田1964年才开发；1960年已开始大规模开发。",hook:"对比「贫油国变自给国，靠的是大庆」。"},
  {t:"1971年10月第26届联大恢复中华人民共和国在联合国的一切合法权利。",lv:"★",keys:["这是中国外交的重大胜利。","1972年2月尼克松访华，中美发表《上海公报》，中美关系开始走向正常化。","1972年9月日本首相田中角荣访华，中日两国实现邦交正常化。","1979年1月1日，中美两国正式建立外交关系。","1964年，中国与法国正式建立外交关系，实现同西方大国建交的重要突破。"],err:"误记中美建交在1972年；1972年只是开始正常化，建交在1979年。",hook:"口诀「七一入联，七二尼克松，七九中美建交」。"}
 ]},
 {h:"9.10 探索中积累的经验教训",pts:[
  {t:"探索的经验教训首先是必须把马克思主义基本原理同中国具体实际相结合，走自己的路。",lv:"★",keys:["必须把马克思主义基本原理同中国具体实际相结合，走自己的路。","必须始终坚持以经济建设为中心，把发展社会生产力作为根本任务。","防止「以阶级斗争为纲」的错误。","必须一切从实际出发，实事求是，按客观经济规律办事。","反对急于求成和盲目冒进。"],err:"误以为教训只涉及经济；还包括思想路线和政治路线。",hook:"口诀「结合国情走己路，经济建设为中心」。"},
  {t:"必须坚持民主集中制和集体领导，反对个人崇拜，健全社会主义民主和法制。",lv:"▲",keys:["必须坚持党的民主集中制和集体领导制度。","反对个人崇拜，健全社会主义民主和法制。","变革生产关系必须适应生产力发展水平，不能急于求成。","文革教训表明必须发展社会主义民主、健全社会主义法制。"],err:"误把个人崇拜看作小事；它是导致文革的重要教训。",hook:"对比「集体领导是正路，个人崇拜是歧途」。"},
  {t:"探索中形成的正确理论政策和「两弹一星」精神等，是党和人民的宝贵财富。",lv:"◇",keys:["探索中形成的关于社会主义建设的正确理论和政策思想是宝贵精神财富。","社会主义建设中铸就的「两弹一星」精神、大庆精神等是宝贵精神财富。","总体评价是取得巨大成就，但也经历了严重曲折。"],err:"误以为探索时期只有曲折没有成就；成就是主要的。",hook:"口诀「成就巨大，曲折严重，精神宝贵」。"}
 ]},
 {h:"9.11 全章题目要点速记",pts:[
  {t:"1956年是探索的良好开端：《论十大关系》发表、中共八大召开。",lv:"★",keys:["1956年4月毛泽东作《论十大关系》报告，论述十个方面的关系。","基本方针是调动一切积极因素为社会主义事业服务。","《论十大关系》初步总结经验，是探索中国自己建设道路的良好开端。","1956年9月八大选举毛泽东为中央委员会主席、邓小平为总书记。","八大指出工人阶级同资产阶级的矛盾已不是我国社会主要矛盾。"],err:"误把八大与《论十大关系》混为一事；前者9月，后者4月。",hook:"口诀「四月十大关系，九月八大定方向」。"},
  {t:"1956年陈云提出「三个主体、三个补充」，1957年整风反右与两类矛盾学说相继展开。",lv:"◆",keys:["1956年陈云在八大提出「三个主体、三个补充」，允许一定范围的市场调节。","毛泽东指出敌我矛盾用专政方法，人民内部矛盾用民主的、说服教育的方法解决。","社会主义社会基本矛盾仍是生产关系和生产力、上层建筑和经济基础之间的矛盾。","1957年6月全国规模的反右派斗争是必要的，但被严重扩大化。","1959年庐山会议后期错误批判彭德怀，使「左」倾错误进一步扩大。"],err:"误以为社会主义社会没有矛盾；基本矛盾仍然存在。",hook:"口诀「专政对敌，民主对民，三主体三补充」。"},
  {t:"1958年大跃进和人民公社化运动，以高指标、瞎指挥、浮夸风和「共产风」为特征。",lv:"★",keys:["「左」倾错误表现为高指标、瞎指挥、浮夸风和「共产风」，分配上搞平均主义。","大跃进以全民大炼钢铁为中心，片面追求钢产量高指标。","1958年8月北戴河会议通过《关于在农村建立人民公社问题的决议》。","人民公社「一大二公」、政社合一，即规模大、公有化程度高，政权与经济组织合一。","1958年11月毛泽东主持第一次郑州会议，开始纠正已觉察到的「左」的错误。"],err:"误记公社分配为按劳分配；实际搞平均主义、刮「共产风」。",hook:"口诀「高指标、瞎指挥、浮夸风、共产风」。"},
  {t:"三年困难之后实行八字方针调整，人民公社改为三级所有、队为基础。",lv:"▲",keys:["1959年至1961年，因大跃进和自然灾害等，国民经济发生严重困难。","1960年冬中央决定八字方针，1961年1月八届九中全会正式通过。","调整时期人民公社实行三级所有、队为基础，核算单位下放到生产队。","1959年4月二届全国人大一次会议选举刘少奇为中华人民共和国主席。","1960年大庆油田大规模开发实现石油基本自给；工业学大庆、农业学大寨。"],err:"误记八字方针由全会首次提出；1960年冬中央已决定。",hook:"口诀「调整巩固充实提高，队为基础下生产队」。"},
  {t:"文革十年曲折：二月抗争、九一三事件、四五运动与1975年全面整顿。",lv:"◆",keys:["1967年2月谭震林、陈毅、叶剑英等批评文革错误，被诬为「二月逆流」。","1970年8月九届二中全会上，林彪集团抢班夺权的阴谋被毛泽东识破。","1975年邓小平主持中央日常工作，全面整顿使形势明显好转。","1976年4月天安门广场悼念周恩来、反对「四人帮」的运动即「四五运动」。","文革教训表明必须发展社会主义民主、健全法制，坚持民主集中制和集体领导。"],err:"误以为二月逆流是反革命事件；实为老一辈革命家的正义抗争。",hook:"口诀「二月抗争、九一三、四五、七五整顿」。"},
  {t:"探索时期成就与曲折并存：外交突破、建设成就与总体评价。",lv:"★",keys:["1971年10月第26届联大恢复中华人民共和国在联合国的一切合法权利。","1964年底周恩来在三届全国人大一次会议提出实现「四个现代化」。","1972年中日邦交正常化、尼克松访华发表《上海公报》，1979年中美正式建交。","1964年中法建交，1965年首次人工合成结晶牛胰岛素，1968年南京长江大桥通车。","1973年袁隆平培育出籼型杂交水稻；焦裕禄任河南兰考县委书记，身患肝癌仍带领群众治理内涝、风沙、盐碱三害，被誉为「县委书记的榜样」。"],err:"误把全面建成小康社会计入本时期；本期成就巨大也有严重曲折。",hook:"口诀「入联、四化、建交、大桥、杂交稻」。"}
 ]}
]},
{ch:10,no:"第十章",title:"中国特色社会主义的开创与接续发展",period:"下编 · 1949—至今",secs:[
 {h:"10.1 历史性伟大转折：真理标准问题大讨论",pts:[
  {t:"1978年5月《实践是检验真理的唯一标准》发表，引发全国真理标准问题大讨论。",lv:"★",keys:["1978年5月11日，《光明日报》发表《实践是检验真理的唯一标准》一文。","讨论冲破了「两个凡是」的束缚，重新确立实践是检验真理的唯一标准。","这是一场深刻的思想解放运动，为十一届三中全会奠定思想基础。","邓小平支持和推动讨论，指出实事求是是毛泽东思想的出发点、根本点。"],err:"误以为讨论是针对学术问题；实质是党的思想路线问题。",hook:"口诀「实践标准破两个凡是，思想解放开新局」。"},
  {t:"1978年12月邓小平《解放思想，实事求是，团结一致向前看》成为三中全会主题报告。",lv:"◆",keys:["1978年12月，邓小平在中央工作会议闭幕会上发表这一重要讲话。","讲话实际上成为中共十一届三中全会的主题报告。","「两个凡是」即1977年2月提出的凡是毛主席决策都坚决维护、指示都遵循。"],err:"误记「两个凡是」1978年提出；实际1977年2月已提出。",hook:"对比「两个凡是守旧，实事求是开新」。"}
 ]},
 {h:"10.2 中共十一届三中全会：伟大的历史转折",pts:[
  {t:"1978年12月十一届三中全会把工作中心转移到经济建设、作出实行改革开放的决策。",lv:"★",keys:["1978年12月18日至22日，中共十一届三中全会在北京召开。","全会批判「两个凡是」的错误方针，高度评价真理标准问题讨论。","全会停止使用「以阶级斗争为纲」的口号，工作中心转移到经济建设。","这是新中国成立以来党的历史上具有深远意义的伟大转折。"],err:"误记三中全会召开于1978年10月；实际是12月18日至22日。",hook:"口诀「三中全会转中心，改革开放启新程」。"},
  {t:"三中全会提出健全社会主义民主、加强社会主义法制，审查解决重大冤假错案。",lv:"◆",keys:["全会提出健全社会主义民主、加强社会主义法制的任务。","审查和解决了党的历史上一批重大冤假错案。","全会开启了改革开放和社会主义现代化建设的新时期。"],err:"误以为平反冤假错案是后来才做；三中全会已着手审查解决。",hook:"口诀「民主法制同健全，冤假错案要平反」。"}
 ]},
 {h:"10.3 农村改革与家庭联产承包责任制",pts:[
  {t:"改革首先从农村开始，家庭联产承包责任制在安徽、四川等地率先实行。",lv:"★",keys:["改革首先从农村开始，安徽、四川等省率先实行包产到户、包干到户。","1978年底安徽凤阳县小岗村农民率先包产到户，拉开农村改革序幕。","责任制坚持土地等基本生产资料集体所有，经营权、使用权交给农民。","实行多劳多得，调动农民积极性，解放和发展农村生产力。"],err:"误以为责任制改变土地集体所有；它只放活经营权、使用权。",hook:"口诀「土地集体不动，经营权交给农民」。"},
  {t:"到1983年初，家庭联产承包责任制在全国农村普遍推广。",lv:"◇",keys:["到1983年初，实行包产到户、包干到户的生产队达到93%以上。","1982年至1986年，中央连续五年发出一号文件，肯定并推广责任制。","十一届三中全会后农村实行政社分开，废除人民公社，建立乡（镇）政权。"],err:"误记中央一号文件只发一年；1982至1986年连续发了五年。",hook:"例子「小岗村按手印，几年推广到全国」。"}
 ]},
 {h:"10.4 经济特区与对外开放格局",pts:[
  {t:"1980年中央决定在深圳、珠海、汕头、厦门设立经济特区，实行特殊政策。",lv:"★",keys:["1979年7月中央决定在广东、福建实行特殊政策和灵活措施，试办出口特区。","1980年正式决定在深圳、珠海、汕头、厦门设立经济特区。","特区发挥对外开放窗口和经济体制改革试验场的作用，成为对外开放排头兵。"],err:"误记特区1980年设在海南；海南1988年建省并成为最大特区。",hook:"口诀「深圳珠海汕头厦门，四个特区先开门」。"},
  {t:"我国形成经济特区、沿海开放城市、沿海经济开放区和内地的对外开放格局。",lv:"★",keys:["1984年进一步开放大连、天津、上海、广州等14个沿海港口城市。","1985年开辟长江三角洲、珠江三角洲、闽南三角地区等沿海经济开放区。","1988年4月七届全国人大批准设立海南省，海南成为我国最大的经济特区。","对外开放格局是多层次、有重点、点面结合的。"],err:"误把重庆算进14个沿海开放城市；重庆是内陆城市。",hook:"口诀「特区、沿海城、开放区、内地，层层推进」。"},
  {t:"1990年4月中央决定开发开放上海浦东，浦东成为90年代改革开放的重点。",lv:"◇",keys:["1990年4月，中共中央、国务院作出开发开放上海浦东的决策。","浦东成为20世纪90年代改革开放的重点。"],err:"误把环渤海列入1985年开放区；当时只设三个三角地区。",hook:"例子「90年代看浦东，开发开放新标杆」。"}
 ]},
 {h:"10.5 改革开放的全面展开与社会主义初级阶段理论",pts:[
  {t:"1982年十二大提出「建设有中国特色的社会主义」科学命题。",lv:"★",keys:["1982年9月中共十二大召开，邓小平在开幕词中提出这一科学命题。","1984年10月十二届三中全会通过《关于经济体制改革的决定》。","决定提出社会主义经济是公有制基础上的有计划的商品经济。","经济体制改革重点由农村转向城市，中心环节是增强企业活力。"],err:"误记十二大提出初级阶段理论；那是1987年十三大。",hook:"口诀「十二大中国特色，十三大初级阶段」。"},
  {t:"1987年十三大阐述社会主义初级阶段理论，提出「一个中心、两个基本点」基本路线。",lv:"★",keys:["十三大明确指出我国正处于并将长期处于社会主义初级阶段。","基本路线以经济建设为中心，坚持四项基本原则，坚持改革开放。","四项基本原则是立国之本：社会主义道路、人民民主专政、党的领导、马列主义毛泽东思想。"],err:"误把四项基本原则当作改革开放内容；它是立国之本。",hook:"口诀「一个中心抓经济，两个基本点立国开放」。"},
  {t:"社会主义初级阶段理论是制定路线方针政策的根本依据，基本路线要管一百年。",lv:"◆",keys:["社会主义初级阶段理论是党制定和执行正确路线方针政策的根本依据。","必须坚持基本路线一百年不动摇。","1981年十一届六中全会首次提出社会主义制度还处于初级的阶段。","1986年十二届六中全会重申，1987年十三大系统阐述初级阶段理论。"],err:"误以为初级阶段理论一次成型；1981年提出，1987年才系统化。",hook:"对比「一次提出，逐步系统化」。"}
 ]},
 {h:"10.6 「三步走」发展战略与邓小平南方谈话",pts:[
  {t:"十三大提出「三步走」发展战略，到21世纪中叶基本实现现代化。",lv:"★",keys:["第一步到1990年实现国民生产总值比1980年翻一番，解决温饱问题。","第二步到20世纪末使国民生产总值再增长一倍，人民生活达到小康水平。","第三步到21世纪中叶人均国民生产总值达到中等发达国家水平，基本实现现代化。"],err:"误把「三步走」当南方谈话内容；它由中共十三大提出。",hook:"口诀「九〇温饱，二〇小康，中叶现代化」。"},
  {t:"1992年初邓小平发表南方谈话，指出计划和市场都是经济手段，强调发展才是硬道理。",lv:"★",keys:["1992年初，邓小平先后视察武昌、深圳、珠海、上海等地并发表重要谈话。","计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。","计划和市场都是经济手段，强调「发展才是硬道理」。"],err:"误把南方谈话记在1992年10月；实际在1992年初。",hook:"口诀「计划市场都是手段，发展才是硬道理」。"},
  {t:"南方谈话提出「三个有利于」标准，把改革开放和现代化建设推进到新阶段。",lv:"◆",keys:["标准是是否有利于发展生产力、增强综合国力、提高人民生活水平。","南方谈话科学总结十一届三中全会以来的基本实践和基本经验。","谈话把改革开放和现代化建设推进到新的阶段。","要求抓住时机加快发展。"],err:"误把「三个有利于」记成四条；标准只有三条。",hook:"口诀「生产力、综合国力、生活水平，三条标准」。"}
 ]},
 {h:"10.7 社会主义市场经济体制的确立",pts:[
  {t:"1992年10月十四大明确提出，我国经济体制改革的目标是建立社会主义市场经济体制。",lv:"★",keys:["1992年10月，中共十四大明确提出这一改革目标。","1993年11月十四届三中全会通过《关于建立社会主义市场经济体制若干问题的决定》。","决定勾画了社会主义市场经济体制的基本框架。"],err:"误记市场经济目标由十三大提出；实际是1992年十四大。",hook:"口诀「九二十四大，市场经济定目标」。"},
  {t:"社会主义市场经济使市场在资源配置中起基础性作用，同时加强和改善宏观调控。",lv:"◇",keys:["以公有制为主体、多种所有制经济共同发展，是社会主义初级阶段的基本经济制度。","市场在资源配置中发挥基础性作用。","注重加强和改善国家对经济的宏观调控。"],err:"误以为市场经济不要宏观调控；市场基础作用与宏观调控并行。",hook:"对比「市场起基础作用，政府搞宏观调控」。"},
  {t:"1997年9月十五大将邓小平理论确立为党的指导思想并写入党章。",lv:"★",keys:["十五大把邓小平理论确立为党的指导思想并写入党章。","十五大提出公有制实现形式可以而且应当多样化，股份制是资本组织形式。","邓小平理论围绕「什么是社会主义、怎样建设社会主义」根本问题展开。"],err:"误记邓小平理论写入党章在十四大；实际是1997年十五大。",hook:"口诀「九七十五大，邓论写入党章」。"}
 ]},
 {h:"10.8 「一国两制」与香港、澳门回归",pts:[
  {t:"邓小平提出「一国两制」科学构想，国家主体实行社会主义，港澳台保持资本主义。",lv:"★",keys:["「一国两制」即在中华人民共和国内，国家主体实行社会主义制度。","香港、澳门、台湾保持原有的资本主义制度长期不变。","以「一个中国」为根本前提，国家主权和领土完整不容分割。","构想最初为解决台湾问题提出，后来首先运用于香港、澳门。"],err:"误以为「一国两制」首先用于台湾；它首先运用于香港、澳门。",hook:"口诀「一个中国是前提，主体社会主义不变」。"},
  {t:"中英、中葡联合声明分别确认中国于1997年、1999年对香港、澳门恢复行使主权。",lv:"★",keys:["1984年12月中英签署《关于香港问题的联合声明》，确认1997年7月1日恢复行使主权。","1987年4月中葡签署《关于澳门问题的联合声明》，确认1999年12月20日恢复行使主权。","1997年7月1日香港回归，中华人民共和国香港特别行政区成立。","1999年12月20日澳门回归，中华人民共和国澳门特别行政区成立。"],err:"误记澳门回归在1997年；香港1997年，澳门1999年12月20日。",hook:"口诀「九七香港，九九澳门，一国两制成功」。"},
  {t:"港澳回归洗雪百年国耻，是祖国和平统一大业进程中的重要里程碑。",lv:"◇",keys:["香港、澳门的回归，标志着中国人民洗雪了百年国耻。","这是祖国和平统一大业进程中的重要里程碑。","为世界解决历史遗留问题提供了新范例，证明「一国两制」是正确方针。"],err:"误以为回归后港澳实行社会主义；原有资本主义制度长期不变。",hook:"对比「主权回归，制度不变」。"}
 ]},
 {h:"10.9 加入世界贸易组织",pts:[
  {t:"2001年12月11日中国正式加入世界贸易组织，对外开放进入新阶段。",lv:"★",keys:["2001年12月11日，中国正式加入世界贸易组织，英文缩写WTO。","2001年11月，世贸组织第四届部长级会议在卡塔尔多哈通过中国加入议定书。","加入世贸组织是顺应经济全球化趋势作出的重大战略决策。","标志着我国对外开放进入新的阶段。"],err:"误记中国2001年11月正式加入；12月11日才正式生效。",hook:"口诀「多哈通过议定书，十二月十一入世」。"},
  {t:"加入世贸组织使我国在更大范围、更广领域、更高层次参与国际经济技术合作与竞争。",lv:"▲",keys:["加入世贸组织为经济发展注入新活力，也带来新的挑战。","推动我国加快经济结构调整和体制机制改革。","我国认真履行承诺，逐步降低关税、开放市场。","为我国赢得良好国际环境，同时面临更激烈的国际竞争。"],err:"误以为入世只有红利没有挑战；机遇与挑战并存。",hook:"对比「入世是机遇，更是压力」。"}
 ]},
 {h:"10.10 「三个代表」重要思想、科学发展观与全面建设小康社会",pts:[
  {t:"2000年2月江泽民提出「三个代表」重要思想，2002年十六大写入党章。",lv:"★",keys:["2000年2月，江泽民在广东考察时提出「三个代表」重要思想。","内容是始终代表先进生产力的发展要求、先进文化的前进方向、最广大人民的根本利益。","2002年11月中共十六大把它确立为党必须长期坚持的指导思想并写入党章。"],err:"误记「三个代表」在十六大才提出；2000年2月已提出。",hook:"口诀「生产力、文化、人民利益，三个代表」。"},
  {t:"十六大提出全面建设小康社会，2003年十六届三中全会提出科学发展观。",lv:"★",keys:["十六大提出在本世纪头二十年全面建设惠及十几亿人口的更高水平小康社会。","2003年10月十六届三中全会提出科学发展观，坚持以人为本、全面协调可持续。","2007年10月中共十七大把科学发展观写入党章。","十七大提出了全面建设小康社会奋斗目标的新要求。"],err:"误记科学发展观由十七大首次提出；十六届三中全会已提出。",hook:"口诀「十六大建小康，三中全会立科学发展观」。"},
  {t:"2004年十六届四中全会提出构建社会主义和谐社会，2006年十六届六中全会作出决定。",lv:"◇",keys:["2004年9月十六届四中全会提出构建社会主义和谐社会的战略任务。","2006年十六届六中全会作出构建社会主义和谐社会的相关决定。","科学发展观第一要义是发展，核心是以人为本，基本要求全面协调可持续。","根本方法是统筹兼顾。"],err:"误记科学发展观核心是发展；第一要义是发展，核心是以人为本。",hook:"口诀「第一要义发展，核心以人为本」。"}
 ]},
 {h:"10.11 全章题目要点速记",pts:[
  {t:"真理标准讨论与1981年历史决议，为新时期思想路线作出科学总结。",lv:"★",keys:["1977年2月提出「两个凡是」，即凡是毛主席决策都坚决维护、指示都遵循。","真理标准讨论实质是党的思想路线问题，重新确立解放思想、实事求是。","1981年6月十一届六中全会通过《关于建国以来党的若干历史问题的决议》。","决议科学评价了毛泽东的历史地位，首次提出社会主义制度还处于初级的阶段。","社会主义初级阶段理论是制定路线方针政策的根本依据，基本路线要管一百年。"],err:"误以为真理标准讨论只是理论争鸣；它关乎党的思想路线。",hook:"口诀「实践标准正思想，历史决议评伟人」。"},
  {t:"改革从农村起步，1984年转向城市，中心环节是增强企业活力。",lv:"★",keys:["1978年底安徽凤阳县小岗村农民率先包产到户，拉开农村改革序幕。","十一届三中全会后农村实行政社分开，废除人民公社，建立乡（镇）政权。","1984年10月十二届三中全会通过《关于经济体制改革的决定》，城市改革全面展开。","城市改革的中心环节是增强企业活力，扩大企业经营自主权。","1990年4月中央决定开发开放上海浦东，浦东成为90年代改革开放的重点。"],err:"误记城市改革起步早于农村；改革首先从农村开始。",hook:"口诀「农村包产到户，城市增强企业活力」。"},
  {t:"对外开放层层推进：14个沿海港口城市、三个开放区和西部大开发。",lv:"◆",keys:["14个沿海港口城市含大连、天津、青岛、宁波，重庆是内陆城市不在其中。","1985年开辟长江三角洲、珠江三角洲和闽南三角地区，不包括环渤海。","1991年11月中国正式加入亚太经合组织，参与亚太区域经济合作。","2001年6月中国、俄罗斯等六国在上海宣布成立上海合作组织。","2000年1月西部大开发战略正式启动实施，促进区域协调发展。"],err:"误把环渤海和重庆列入开放格局；二者均不在相应名单中。",hook:"口诀「十四城、三开放区、西部开发」。"},
  {t:"「一国两制」由构想变为实践：港澳回归，两岸坚持一个中国原则。",lv:"★",keys:["「一国两制」以「一个中国」为前提，主体社会主义、港澳台资本主义长期不变。","1984年中英、1987年中葡签署联合声明，确认1997年和1999年恢复行使主权。","1992年11月海协会与海基会达成「九二共识」；1995年江泽民提出八项主张。","2005年3月十届全国人大三次会议通过《反分裂国家法》，维护国家主权和领土完整。","港澳回归洗雪百年屈辱，为世界解决历史遗留问题提供新范例。"],err:"误记九二共识发生在1995年；它达成于1992年11月。",hook:"口诀「九二共识，九五主张，〇五反分裂」。"},
  {t:"依法治国、精神文明建设与理论创新共同推进，四项基本原则是立国之本。",lv:"▲",keys:["1986年9月十二届六中全会通过《关于社会主义精神文明建设指导方针的决议》。","1997年9月十五大首次把依法治国确立为党领导人民治理国家的基本方略。","1999年九届全国人大二次会议把依法治国写入宪法。","十五大提出公有制实现形式可以而且应当多样化，股份制是资本组织形式。","四项基本原则是社会主义道路、人民民主专政、党的领导、马列主义毛泽东思想。"],err:"误记依法治国入宪在1997年；1999年才写入宪法。",hook:"口诀「九七定方略，九九入宪法」。"},
  {t:"从南方谈话到加入世贸，中国经济在应对亚洲金融危机中走向世界。",lv:"★",keys:["1992年南方谈话强调「发展才是硬道理」，要求抓住时机加快发展。","1998年亚洲金融危机期间，中国政府承诺并保持人民币不贬值。","2001年11月多哈会议通过中国加入议定书，12月11日正式加入WTO并赢得良好国际环境。","「三个有利于」标准是发展生产力、增强综合国力、提高人民生活水平。","邓小平理论围绕「什么是社会主义、怎样建设社会主义」根本问题展开。"],err:"误把入世时间记成2001年11月；正式加入是12月11日。",hook:"口诀「危机不贬值，入世开新局」。"}
 ]}
]},
{ch:11,no:"第十一章",title:"中国特色社会主义进入新时代",period:"下编 · 1949—至今",secs:[
 {h:"11.1 中共十八大与中国梦",pts:[
  {t:"2012年11月十八大召开，科学发展观写入党章，提出全面建成小康社会目标。",lv:"★",keys:["2012年11月，中共十八大将科学发展观确立为党必须长期坚持的指导思想并写入党章。","大会选举习近平为中共中央总书记。","提出全面建成小康社会和全面深化改革开放的奋斗目标。","提出「两个一百年」奋斗目标：建党百年全面建成小康社会，建国百年建成现代化国家。"],err:"误记科学发展观由十八大首次提出；2003年十六届三中全会已提出。",hook:"口诀「十八大写科学发展观，两个一百年定目标」。"},
  {t:"2012年11月29日习近平提出「中国梦」，本质是国家富强、民族振兴、人民幸福。",lv:"★",keys:["习近平参观《复兴之路》展览时首次提出实现中华民族伟大复兴的「中国梦」。","中国梦的本质内涵是国家富强、民族振兴、人民幸福。","实现中国梦必须走中国道路、弘扬中国精神、凝聚中国力量。","中国精神是以爱国主义为核心的民族精神和以改革创新为核心的时代精神。","中国道路即中国特色社会主义道路，中国力量即全国各族人民大团结的力量。"],err:"误把中国梦本质记成经济发展；本质是国家富强、民族振兴、人民幸福。",hook:"口诀「国家富强、民族振兴、人民幸福」。"},
  {t:"2013年习近平提出共建「丝绸之路经济带」和「21世纪海上丝绸之路」的倡议。",lv:"◇",keys:["2013年提出共建「丝绸之路经济带」和「21世纪海上丝绸之路」的重大倡议，即「一带一路」。","「一带一路」倡导的丝路精神是和平合作、开放包容、互学互鉴、互利共赢。"],err:"误记「一带一路」只有陆上通道；它含经济带与海上丝绸之路两条。",hook:"口诀「一带陆路，一路海路」。"}
 ]},
 {h:"11.2 「五位一体」总体布局",pts:[
  {t:"十八大提出「五位一体」总体布局，统筹推进经济、政治、文化、社会、生态文明建设。",lv:"★",keys:["2012年中共十八大提出「五位一体」总体布局。","内容包括经济建设、政治建设、文化建设、社会建设、生态文明建设。","「五位一体」总体布局不包括党的建设。"],err:"误把党的建设列入五位一体；党的建设由全面从严治党覆盖。",hook:"口诀「经济政治文化社会生态，五位一体」。"},
  {t:"把生态文明建设纳入总体布局，体现尊重自然、顺应自然、保护自然的理念。",lv:"◆",keys:["生态文明建设融入经济建设、政治建设、文化建设、社会建设各方面和全过程。","推动物质文明、政治文明、精神文明、社会文明、生态文明全面发展。","促进现代化建设各方面相协调。"],err:"误以为生态文明独立于其他建设；它融入各方面和全过程。",hook:"对比「不是第五项单干，而是融入全过程」。"}
 ]},
 {h:"11.3 「四个全面」战略布局",pts:[
  {t:"2014年12月习近平提出「四个全面」战略布局，小康是目标，其余三项是举措。",lv:"★",keys:["2014年12月，习近平在江苏调研时首次提出「四个全面」战略布局。","内容是全面建成小康社会、全面深化改革、全面依法治国、全面从严治党。","全面建成小康社会是战略目标，后三项是三大战略举措。","「四个全面」战略布局不包括全面发展经济。"],err:"误把「全面发展经济」当作四个全面之一；四项内容固定。",hook:"口诀「小康是目标，改革法治治党三举措」。"},
  {t:"十八届三中全会提出全面深化改革总目标，十八届四中全会提出全面依法治国总目标。",lv:"▲",keys:["2013年11月十八届三中全会通过《关于全面深化改革若干重大问题的决定》。","全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。","2014年10月十八届四中全会通过《关于全面推进依法治国若干重大问题的决定》。","全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。"],err:"误混两个总目标；改革总目标讲制度与治理，法治总目标讲法治体系。",hook:"对比「改革改制度，法治建体系」。"},
  {t:"十八届六中全会确立「以习近平同志为核心的党中央」，全面从严治党深入推进。",lv:"◆",keys:["2016年10月，中共十八届六中全会正式提出「以习近平同志为核心的党中央」。","经济体制改革的核心问题是处理好政府和市场的关系。","全面深化改革以促进社会公平正义、增进人民福祉为出发点和落脚点。","全面依法治国新十六字方针是科学立法、严格执法、公正司法、全民守法。","中国特色社会主义法治道路的核心要义是坚持党的领导。"],err:"误记六中全会2015年召开；实际是2016年10月。",hook:"口诀「科学立法、严格执法、公正司法、全民守法」。"}
 ]},
 {h:"11.4 中共十九大：中国特色社会主义进入新时代",pts:[
  {t:"2017年10月十九大宣布中国特色社会主义进入新时代，这是新的历史方位。",lv:"★",keys:["2017年10月，中共十九大召开，主题是不忘初心、牢记使命。","经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。","十八大以来的五年，党和国家事业取得历史性成就、发生历史性变革。"],err:"误以为进入新时代就是初级阶段结束；基本国情仍未变。",hook:"口诀「十九大新时代，历史方位新判断」。"},
  {t:"十九大指出主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。",lv:"★",keys:["社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。","新时代坚持和发展中国特色社会主义的总任务是实现社会主义现代化和中华民族伟大复兴。","大会把习近平新时代中国特色社会主义思想确立为指导思想并写入党章。","我国仍处于并将长期处于社会主义初级阶段的基本国情没有变。"],err:"误把主要矛盾记成物质文化需要；新表述已改为美好生活需要。",hook:"口诀「美好生活需要，不平衡不充分发展」。"}
 ]},
 {h:"11.5 习近平新时代中国特色社会主义思想",pts:[

{id:"c1q22",ch:1,t:"s",q:"1894年11月，第一个喊出「振兴中华」口号的人是",o:["康有为","孙中山","梁启超","严复"],a:"B",x:"1894年11月孙中山在檀香山创立兴中会，第一次喊出「振兴中华」的口号。",p:["民族意识觉醒"]},
{id:"c1q23",ch:1,t:"j",fs:6,q:"简述《南京条约》的主要内容及其影响。",
 kw:["香港岛","赔款","通商口岸","协定关税","第一个不平等条约","半殖民地"],
 ref:"主要内容：①割让香港岛给英国；②赔款2100万银元；③开放广州、厦门、福州、宁波、上海五处为通商口岸；④协定关税，英商进出口货物缴纳的税款须经两国商定。\n影响：《南京条约》是中国近代史上第一个不平等条约，中国开始丧失领土、关税等主权，开始沦为半殖民地半封建社会。",p:["不平等条约"]},

/* ================= 第二章 ================= */
{id:"c2q1",ch:2,t:"s",real:true,src:"2015年4月真题",q:"太平天国农民起义爆发于",o:["1851年","1853年","1856年","1864年"],a:"A",x:"1851年1月，洪秀全在广西桂平县金田村发动起义，建号太平天国。",p:["太平天国"]},
{id:"c2q2",ch:2,t:"s",real:true,src:"2016年4月真题",q:"19世纪60年代，洋务派最早兴办的洋务事业是",o:["民用工业","军用工业","新式学堂","新式海军"],a:"B",x:"洋务运动前期以「自强」为口号，最先兴办的是军用工业，如安庆内军械所、江南制造总局。",p:["洋务运动"]},
{id:"c2q3",ch:2,t:"s",real:true,src:"2016年4月真题",q:"谭嗣同宣传变法维新思想的著作是",o:["《新学伪经考》","《孔子改制考》","《仁学》","《变法通议》"],a:"C",x:"谭嗣同撰写《仁学》，猛烈抨击封建纲常礼教，宣传变法维新。",p:["戊戌维新"]},
{id:"c2q4",ch:2,t:"s",real:true,src:"2021年4月真题",q:"太平天国后期带有资本主义色彩的方案是",o:["《天朝田亩制度》","《资政新篇》","《原道救世歌》","《天演论》"],a:"B",x:"《资政新篇》是洪仁玕提出的带有资本主义色彩的改革方案，但未能付诸实施。",p:["太平天国"]},
{id:"c2q5",ch:2,t:"s",real:true,src:"2022年10月真题",q:"最能体现太平天国社会理想的纲领性文件是",o:["《资政新篇》","《原道醒世训》","《天朝田亩制度》","《十款天条》"],a:"C",x:"《天朝田亩制度》以「凡天下田，天下人同耕」为核心，是农民阶级最完整的土地纲领，但具有绝对平均主义的空想色彩。",p:["太平天国"]},
{id:"c2q6",ch:2,t:"s",q:"1853年，太平天国定都于",o:["武昌","南京","北京","广州"],a:"B",x:"1853年3月，太平军攻克南京，改名天京并定都于此。",p:["太平天国"]},
{id:"c2q7",ch:2,t:"s",q:"太平天国由盛转衰的转折点是",o:["金田起义","天京事变","安庆失陷","天京陷落"],a:"B",x:"1856年天京事变（杨韦事变）严重削弱了太平天国的力量，成为其由盛转衰的转折点。",p:["太平天国"]},
{id:"c2q8",ch:2,t:"s",q:"洋务运动前期和后期的口号分别是",o:["「自强」「求富」","「求富」「自强」","「变法」「维新」","「救国」「图存」"],a:"A",x:"洋务运动前期以「自强」为口号兴办军用工业，后期以「求富」为口号兴办民用工业。",p:["洋务运动"]},
{id:"c2q9",ch:2,t:"s",q:"甲午战争中北洋海军全军覆没，标志着",o:["戊戌变法的失败","洋务运动的失败","义和团运动的失败","辛亥革命的发生"],a:"B",x:"1895年甲午战争中北洋海军全军覆没，标志着以「自强」「求富」为目标的洋务运动的失败。",p:["洋务运动"]},
{id:"c2q10",ch:2,t:"s",q:"戊戌维新运动（百日维新）发生于",o:["1888年","1895年","1898年","1901年"],a:"C",x:"1898年6月11日至9月21日，光绪帝颁布变法诏令推行新政，史称「百日维新」。",p:["戊戌维新"]},
{id:"c2q11",ch:2,t:"j",fs:6,q:"简述太平天国农民战争失败的根本原因和教训。",
 kw:["阶级局限性","先进阶级","革命纲领","教训"],
 ref:"根本原因：农民阶级不是新生产力和生产关系的代表，具有无法克服的阶级局限性，缺乏先进阶级（无产阶级）的领导，因而不能提出科学的革命纲领，无法战胜中外反动势力的联合绞杀。\n教训：单纯的农民战争不可能完成反帝反封建的任务，中国革命的胜利必须有先进阶级和先进政党的领导。",p:["太平天国","失败原因"]},
{id:"c2q12",ch:2,t:"l",real:true,src:"2024年10月真题",fs:10,q:"试述太平天国农民战争的历史意义。",
 kw:["封建统治阶级","清政府","最高峰","儒家","外国侵略势力","亚洲"],
 ref:"①沉重打击了封建统治阶级，强烈撼动了清政府的统治根基；②是中国旧式农民战争的最高峰，具有不同于以往农民战争的新特点；③批判孔子及儒家经典，一定程度上削弱了封建统治的精神支柱；④有力打击了外国侵略势力，捍卫了民族尊严；⑤鼓舞和推动了亚洲各国人民的民族解放运动。",p:["太平天国","历史意义"]},

{id:"c2q13",ch:2,t:"s",q:"太平天国运动中，组建湘军并长期与太平军作战的清朝官员是",o:["曾国藩","李鸿章","左宗棠","胡林翼"],a:"A",x:"曾国藩组建湘军，是镇压太平天国农民战争的主要军事力量。",p:["太平天国"]},
{id:"c2q14",ch:2,t:"s",q:"洋务运动中，中央主持洋务运动的代表人物是",o:["曾国藩","李鸿章","奕䜣","张之洞"],a:"C",x:"洋务派在中央以奕䜣为代表，地方以曾国藩、李鸿章、左宗棠、张之洞为代表。",p:["洋务运动"]},
{id:"c2q15",ch:2,t:"s",q:"洋务运动时期，张之洞在湖北创办的著名民用企业是",o:["江南制造总局","福州船政局","汉阳铁厂","轮船招商局"],a:"C",x:"张之洞创办的汉阳铁厂是洋务运动后期规模最大的民用企业之一。",p:["洋务运动"]},
{id:"c2q16",ch:2,t:"s",q:"洋务运动时期创办的中国第一所新式学堂是",o:["京师大学堂","京师同文馆","万木草堂","南洋公学"],a:"B",x:"1862年创办的京师同文馆是中国第一所新式学堂，主要培养翻译和外交人才。",p:["洋务运动"]},
{id:"c2q17",ch:2,t:"s",q:"1895年，康有为、梁启超联合在京应试举人上书光绪帝，史称",o:["公车上书","百日维新","戊戌政变","保国会活动"],a:"A",x:"1895年4月康有为联合各省举人发起「公车上书」，拉开了维新运动的序幕。",p:["戊戌维新"]},
{id:"c2q18",ch:2,t:"s",q:"1898年9月戊戌政变后，被慈禧太后下令杀害的「戊戌六君子」不包括",o:["谭嗣同","康广仁","康有为","杨深秀"],a:"C",x:"戊戌六君子是谭嗣同、康广仁、林旭、杨深秀、杨锐、刘光第，康有为在政变前已逃往国外。",p:["戊戌维新"]},
{id:"c2q19",ch:2,t:"s",q:"戊戌维新运动是一场",o:["农民阶级领导的革命运动","资产阶级性质的政治改良运动","无产阶级领导的新民主主义革命","地主阶级的自救运动"],a:"B",x:"戊戌维新运动是资产阶级维新派发动的自上而下的政治改良运动，终因封建顽固势力镇压而失败。",p:["戊戌维新"]},
{id:"c2q20",ch:2,t:"j",fs:6,q:"简述洋务运动的历史作用及其失败原因。",
 kw:["近代企业","民族资本主义","新式学堂","中学为体","西学为用","甲午战争"],
 ref:"历史作用：①引进西方先进的科学技术，创办了一批近代企业，客观上促进了中国早期工业和民族资本主义的产生和发展；②开办新式学堂、派遣留学生，培养了一批近代人才；③为中国近代化开辟了道路。\n失败原因：洋务运动的指导思想是「中学为体，西学为用」，企图在不触动封建制度的前提下学习西方技术，不可能使中国真正富强；甲午战争的惨败标志着洋务运动的失败。",p:["洋务运动"]},

/* ================= 第三章 ================= */
{id:"c3q1",ch:3,t:"s",real:true,src:"2015年4月真题",q:"1904—1905年，在中国东北地区进行战争的两个帝国主义国家是",o:["美国和俄国","英国和美国","英国和日本","俄国和日本"],a:"D",x:"1904—1905年日俄两国为争夺中国东北在中国领土上进行的帝国主义战争，清政府竟宣布「局外中立」。",p:["侵略中国"]},
{id:"c3q2",ch:3,t:"s",q:"1894年，孙中山在檀香山创立的第一个资产阶级革命团体是",o:["中国同盟会","兴中会","华兴会","光复会"],a:"B",x:"1894年11月孙中山在檀香山创立兴中会，是中国第一个资产阶级革命团体。",p:["革命组织"]},
{id:"c3q3",ch:3,t:"s",q:"中国第一个全国性的资产阶级革命政党是",o:["兴中会","华兴会","光复会","中国同盟会"],a:"D",x:"1905年8月，孙中山联合各革命团体在东京成立中国同盟会，是第一个全国性的资产阶级革命政党。",p:["革命组织"]},
{id:"c3q4",ch:3,t:"s",q:"三民主义中，主张「创立民国」、推翻君主专制制度的是",o:["民族主义","民权主义","民生主义","社会主义"],a:"B",x:"民权主义即政治革命，核心是推翻君主专制制度、建立资产阶级民主共和国。",p:["三民主义"]},
{id:"c3q5",ch:3,t:"s",q:"武昌起义爆发于",o:["1911年10月10日","1912年1月1日","1911年4月27日","1913年7月"],a:"A",x:"1911年10月10日武昌起义爆发，成为辛亥革命的起点，各省纷纷响应。",p:["辛亥革命"]},
{id:"c3q6",ch:3,t:"s",q:"中华民国临时政府成立的时间和地点是",o:["1912年1月1日，南京","1912年1月1日，北京","1912年3月，南京","1911年10月，武昌"],a:"A",x:"1912年1月1日，孙中山在南京就任临时大总统，中华民国临时政府成立。",p:["辛亥革命"]},
{id:"c3q7",ch:3,t:"s",q:"《中华民国临时约法》的历史地位是",o:["中国历史上第一部宪法","中国历史上第一部具有资产阶级共和国宪法性质的法典","中国历史上第一部社会主义宪法","中国历史上第一部封建法典"],a:"B",x:"1912年3月颁布的《中华民国临时约法》，是中国历史上第一部具有资产阶级共和国宪法性质的法典。",p:["辛亥革命"]},
{id:"c3q8",ch:3,t:"s",q:"辛亥革命失败的根本原因是",o:["袁世凯的窃夺","帝国主义的干涉","中国资产阶级的软弱性和妥协性","北洋军阀的破坏"],a:"C",x:"中国民族资产阶级的软弱性和妥协性是辛亥革命失败的根本原因。",p:["辛亥革命"]},
{id:"c3q9",ch:3,t:"s",q:"1915年12月，为反对袁世凯复辟帝制而掀起的运动是",o:["二次革命","护国运动","护法运动","新文化运动"],a:"B",x:"1915年袁世凯宣布接受帝制，蔡锷等发起护国运动，袁世凯被迫取消帝制。",p:["护国运动"]},
{id:"c3q10",ch:3,t:"s",q:"标志着旧民主主义革命终结的历史事件是",o:["辛亥革命的失败","二次革命的失败","护法运动的失败","五四运动的爆发"],a:"C",x:"1922年孙中山第二次护法运动的失败，标志着旧民主主义革命的终结。",p:["护法运动"]},
{id:"c3q11",ch:3,t:"j",real:true,src:"2022年10月真题",fs:6,q:"简述辛亥革命的历史局限性。",
 kw:["反帝反封建","纲领","民众","革命政党","软弱"],
 ref:"①没有提出彻底的反帝反封建的革命纲领；②没有充分发动和依靠广大的民众（特别是农民）；③没有建立坚强有力的革命政党（同盟会组织松散，缺乏统一稳定的领导核心）。这些局限反映了中国资产阶级的软弱性和妥协性。",p:["辛亥革命","失败原因"]},
{id:"c3q12",ch:3,t:"j",real:true,src:"2024年10月真题",fs:6,q:"辛亥革命时期，资产阶级革命派的骨干力量是什么？",
 kw:["资产阶级","小资产阶级","知识分子","新式学堂","留学生"],
 ref:"一批资产阶级、小资产阶级的知识分子。他们随着清政府兴办新式学堂、派遣留学生而逐渐形成，在接触西方资产阶级思想文化后，逐步走向清政府的对立面，成为资产阶级革命派的骨干力量。",p:["辛亥革命"]},
{id:"c3q13",ch:3,t:"l",real:true,src:"2016年4月真题",fs:10,q:"试述孙中山三民主义学说的主要内容及历史意义。",
 kw:["民族主义","民权主义","民生主义","平均地权","革命纲领"],
 ref:"民族主义：驱除鞑虏，恢复中华，推翻清王朝，变「次殖民地」的中国为独立中国。\n民权主义：创立民国，推翻封建君主专制制度，建立资产阶级民主共和国（政治革命）。\n民生主义：平均地权，核定地价、涨价归公，防止贫富悬殊（社会革命）。\n历史意义：三民主义是比较完整而明确的资产阶级民主革命纲领，反映了人民要求民族独立和民主权利的共同愿望，推动了革命思想的传播和革命运动的发展。",p:["三民主义"]},
{id:"c3q14",ch:3,t:"l",real:true,src:"2021年4月真题",fs:10,q:"试述革命派与改良派论战的主要内容及其意义。",
 kw:["革命手段","推翻清王朝","帝制","共和","社会革命","民主革命思想"],
 ref:"主要内容：①要不要以革命手段推翻清王朝的统治（论战焦点）；②要不要推翻帝制、实行共和；③要不要进行社会革命。\n意义：划清了革命与改良的界限，使民主革命思想得到广泛传播，为推翻清王朝、建立共和国的斗争奠定了思想基础。",p:["革命论战"]},

{id:"c3q15",ch:3,t:"s",q:"中国同盟会创办的机关报是",o:["《民报》","《新民丛报》","《时务报》","《新青年》"],a:"A",x:"1905年同盟会在东京创办机关报《民报》，作为宣传民主革命思想的主要阵地。",p:["三民主义"]},
{id:"c3q16",ch:3,t:"s",q:"1911年4月，革命党人在广州发动的起义是",o:["武昌起义","黄花岗起义","萍浏醴起义","镇南关起义"],a:"B",x:"1911年4月27日黄兴领导黄花岗起义，起义失败后烈士遗骸葬于黄花岗，史称「黄花岗七十二烈士」。",p:["辛亥革命"]},
{id:"c3q17",ch:3,t:"s",q:"1911年，直接为武昌起义的爆发创造条件的事件是四川的",o:["保路运动","抵制日货运动","收回路权运动","拒俄运动"],a:"A",x:"1911年四川保路运动迅速发展，清政府调湖北新军入川镇压，武昌防务空虚，为武昌起义创造了条件。",p:["辛亥革命"]},
{id:"c3q18",ch:3,t:"s",q:"清朝末代皇帝溥仪宣布退位的时间是",o:["1911年10月10日","1912年1月1日","1912年2月12日","1912年3月10日"],a:"C",x:"1912年2月12日清帝溥仪宣布退位，统治中国两千多年的封建君主专制制度就此结束。",p:["辛亥革命"]},
{id:"c3q19",ch:3,t:"s",q:"1913年，孙中山为反对袁世凯的独裁统治而发动的斗争是",o:["二次革命","护国运动","护法运动","国民革命"],a:"A",x:"1913年7月孙中山发动「二次革命」讨袁，不久失败，孙中山被迫流亡日本。",p:["二次革命"]},
{id:"c3q20",ch:3,t:"s",q:"1917年，孙中山发起护法运动，其斗争的主要对象是",o:["袁世凯","段祺瑞","张勋","冯国璋"],a:"B",x:"1917年段祺瑞拒绝恢复《临时约法》和国会，孙中山发动护法运动，史称「护法运动」。",p:["护法运动"]},
{id:"c3q21",ch:3,t:"s",q:"1912年成立的南京临时政府是一个",o:["资产阶级共和国性质的革命政权","地主阶级政权","无产阶级政权","军阀政权"],a:"A",x:"南京临时政府是资产阶级共和国性质的革命政权，孙中山任临时大总统。",p:["辛亥革命"]},
{id:"c3q22",ch:3,t:"j",fs:6,q:"简述辛亥革命的历史意义。",
 kw:["君主专制","共和政府","民主共和","民族资本主义","思想解放"],
 ref:"①推翻了清王朝的反动统治，结束了统治中国两千多年的封建君主专制制度；②建立了中国历史上第一个资产阶级共和政府，使民主共和观念深入人心；③推动了民族资本主义的发展和社会的进步；④促使了思想解放和社会风俗的积极变化；⑤沉重打击了帝国主义在华势力，也在一定程度上推动了亚洲各国人民的民族解放运动。",p:["辛亥革命"]},

{id:"c4q1",ch:4,t:"s",real:true,src:"2015年4月真题",q:"1918年，鲁迅发表的中国第一篇白话小说是",o:["《阿Q正传》","《狂人日记》","《药》","《祝福》"],a:"B",x:"1918年5月鲁迅发表《狂人日记》，是中国现代文学史上第一篇白话小说。",p:["新文化运动"]},
{id:"c4q2",ch:4,t:"s",real:true,src:"2016年4月真题",q:"在中国率先举起马克思主义旗帜的人物是",o:["陈独秀","李大钊","胡适","鲁迅"],a:"B",x:"1918年李大钊发表《法俄革命之比较观》《庶民的胜利》等文章，率先在中国举起马克思主义旗帜。",p:["马克思主义传播"]},
{id:"c4q3",ch:4,t:"s",real:true,src:"2016年4月真题",q:"第一次国共合作的政治基础是",o:["三民主义","新三民主义","民主主义","马克思主义"],a:"B",x:"国民党一大确立的联俄、联共、扶助农工三大政策，与新三民主义成为第一次国共合作的政治基础。",p:["国共合作"]},
{id:"c4q4",ch:4,t:"s",real:true,src:"2021年4月真题",q:"中国工人运动第一次高潮的起点是",o:["京汉铁路工人罢工","香港海员罢工","安源路矿工人罢工","省港大罢工"],a:"B",x:"1922年1月香港海员罢工是中国工人运动第一次高潮的起点。",p:["工人运动"]},

{id:"c4q6",ch:4,t:"s",q:"新文化运动的基本口号是",o:["自强与求富","民主与科学","师夷长技","救亡与图存"],a:"B",x:"新文化运动以民主和科学为基本口号，向封建礼教发起猛烈冲击。",p:["新文化运动"]},
{id:"c4q7",ch:4,t:"s",q:"五四运动的直接导火线是",o:["俄国十月革命的胜利","巴黎和会上中国外交的失败","北洋政府的黑暗统治","新文化运动的推动"],a:"B",x:"1919年巴黎和会上中国外交的失败（山东权益转交日本）是五四运动爆发的直接导火线。",p:["五四运动"]},

{id:"c4q9",ch:4,t:"s",q:"中国共产党第一次全国代表大会召开于",o:["1920年，北京","1921年7月，上海","1922年7月，上海","1923年6月，广州"],a:"B",x:"1921年7月23日中共一大在上海召开，宣告了中国共产党的成立。",p:["中国共产党诞生"]},
{id:"c4q10",ch:4,t:"s",q:"决定共产党员以个人身份加入国民党、建立革命统一战线的会议是",o:["中共一大","中共二大","中共三大","中共四大"],a:"C",x:"1923年6月中共三大决定全体共产党员以个人名义加入国民党，实现国共合作。",p:["国共合作"]},
{id:"c4q11",ch:4,t:"j",real:true,src:"2021年4月真题",fs:6,q:"简述中共二大提出的民主革命纲领。",
 kw:["军阀","国内和平","帝国主义","完全独立","民主共和国"],
 ref:"①消除内乱，打倒军阀，建设国内和平；②推翻国际帝国主义的压迫，达到中华民族完全独立；③统一中国为真正的民主共和国。",p:["中共二大"]},
{id:"c4q12",ch:4,t:"j",real:true,src:"2024年4月真题",fs:6,q:"第一次国共合作正式形成的标志是什么？",
 kw:["1924","国民党第一次全国代表大会","联俄","联共","扶助农工","统一战线"],
 ref:"1924年1月，中国国民党第一次全国代表大会在广州召开。大会确立了联俄、联共、扶助农工三大政策，重新解释了三民主义（新三民主义），标志着以国共合作为基础的革命统一战线正式形成。",p:["国共合作"]},
{id:"c4q13",ch:4,t:"l",real:true,src:"2023年4月真题",fs:10,q:"试述中共一大制定的党的纲领和主要任务。",
 kw:["无产阶级革命军队","无产阶级专政","纲领","工人运动","陈独秀","中央局"],
 ref:"中共一大通过了党的第一个纲领和第一个决议：①确定党的名称为「中国共产党」；②纲领规定以无产阶级革命军队推翻资产阶级，消灭阶级和私有制，实现无产阶级专政，废除资本私有制；③规定了党员的条件和党的组织纪律；④确定党的中心任务是开展工人运动；⑤选举产生了以陈独秀为书记的中央局。",p:["中共一大"]},

{id:"c4q14",ch:4,t:"s",q:"五四运动前新文化运动的两个主要阵地是",o:["《新青年》和北京大学","《民报》和东京","《时务报》和上海","《每周评论》和广州"],a:"A",x:"新文化运动以《新青年》杂志和北京大学为主要阵地，向封建礼教发起猛烈冲击。",p:["新文化运动"]},
{id:"c4q15",ch:4,t:"s",q:"1919年，李大钊发表的系统介绍马克思主义的著名文章是",o:["《法俄革命之比较观》","《庶民的胜利》","《我的马克思主义观》","《布尔什维主义的胜利》"],a:"C",x:"1919年9月李大钊发表《我的马克思主义观》，比较系统地介绍了马克思主义学说。",p:["马克思主义传播"]},
{id:"c4q16",ch:4,t:"s",q:"五四运动中，运动中心由北京转移到上海，是在",o:["5月4日","5月19日","6月3日以后","6月28日"],a:"C",x:"1919年6月3日以后，上海工人举行大罢工，工人阶级以独立姿态登上政治舞台，运动中心由北京转移到上海。",p:["五四运动"]},
{id:"c4q17",ch:4,t:"s",q:"1923年2月，京汉铁路工人大罢工遭到军阀吴佩孚血腥镇压，史称",o:["「二七」惨案","「五卅」惨案","「四一二」政变","「七一五」政变"],a:"A",x:"1923年2月7日京汉铁路工人大罢工遭吴佩孚镇压，发生「二七」惨案，中国工人运动第一次高潮转入低潮。",p:["工人运动"]},
{id:"c4q18",ch:4,t:"s",q:"1924年，国共合作创办的黄埔军校中担任政治部主任的是",o:["孙中山","蒋介石","廖仲恺","周恩来"],a:"D",x:"1924年5月黄埔军校建立，蒋介石任校长，周恩来任政治部主任，为革命培养了大批军事政治人才。",p:["国民革命"]},
{id:"c4q19",ch:4,t:"s",q:"1926年开始的北伐战争的主要对象不包括",o:["吴佩孚","孙传芳","张作霖","冯玉祥"],a:"D",x:"北伐战争的主要对象是吴佩孚、孙传芳、张作霖三个军阀集团。",p:["北伐战争"]},
{id:"c4q20",ch:4,t:"s",q:"1927年4月12日，在上海发动反革命政变、大肆屠杀共产党人的是",o:["汪精卫","蒋介石","李宗仁","白崇禧"],a:"B",x:"1927年4月12日蒋介石在上海发动「四一二」反革命政变，大批共产党人和革命群众惨遭杀害。",p:["国民革命"]},
{id:"c4q21",ch:4,t:"j",fs:6,q:"简述五四运动的历史特点和意义。",
 kw:["反帝反封建","群众运动","工人阶级","马克思主义","新民主主义革命"],
 ref:"特点：①五四运动具有彻底反帝反封建的革命性；②是一次真正的群众运动，青年学生起了先锋作用，工人阶级登上了政治舞台；③促进了马克思主义在中国的传播及其与中国工人运动的结合。\n意义：五四运动是中国新民主主义革命的开端，为中国共产党的成立作了思想上和干部上的准备。",p:["五四运动"]},

{id:"c5q1",ch:5,t:"s",real:true,src:"2016年4月真题",q:"中国共产党独立领导革命战争、创建人民军队的开端是",o:["南昌起义","秋收起义","广州起义","百色起义"],a:"A",x:"1927年8月1日南昌起义打响了武装反抗国民党反动派的第一枪，是党独立领导革命战争、创建人民军队的开端。",p:["南昌起义"]},
{id:"c5q2",ch:5,t:"s",real:true,src:"2021年4月真题",q:"1936年10月，红军三大主力胜利会师的地点是",o:["陕北吴起镇","甘肃会宁","陕北延安","贵州遵义"],a:"B",x:"1936年10月红军第一、二、四方面军在甘肃会宁会师，标志着长征的胜利结束。",p:["长征"]},

{id:"c5q5",ch:5,t:"s",q:"三湾改编确立了党对军队绝对领导的根本原则，其核心内容是",o:["废除雇佣制","支部建在连上","官兵平等","实行民主制度"],a:"B",x:"1927年9月三湾改编将党的支部建在连上，确立了党对军队的绝对领导。",p:["三湾改编"]},
{id:"c5q6",ch:5,t:"s",q:"中国共产党创建的第一个农村革命根据地是",o:["中央革命根据地","鄂豫皖根据地","井冈山革命根据地","湘鄂西根据地"],a:"C",x:"1927年10月毛泽东率部创建井冈山革命根据地，是第一个农村革命根据地。",p:["农村根据地"]},
{id:"c5q7",ch:5,t:"s",q:"古田会议确立的建党建军原则是",o:["工农武装割据","农村包围城市","思想建党、政治建军","党指挥枪"],a:"C",x:"1929年12月古田会议确立了思想建党、政治建军的原则。",p:["古田会议"]},
{id:"c5q8",ch:5,t:"s",q:"遵义会议在党的历史上的地位是",o:["标志着长征的开始","党的历史上一个生死攸关的转折点","确立了武装斗争的方针","揭开了战略反攻的序幕"],a:"B",x:"1935年1月遵义会议事实上确立了以毛泽东为核心的党中央的正确领导，是党的历史上一个生死攸关的转折点。",p:["遵义会议"]},
{id:"c5q9",ch:5,t:"s",q:"红军长征开始于",o:["1933年10月","1934年10月","1935年1月","1935年10月"],a:"B",x:"1934年10月中央红军主力开始长征，1935年10月到达陕北吴起镇，1936年10月三大主力会师。",p:["长征"]},
{id:"c5q10",ch:5,t:"s",q:"1931年11月，中华苏维埃共和国临时中央政府成立的地点是",o:["瑞金","延安","井冈山","遵义"],a:"A",x:"1931年11月中华苏维埃第一次全国代表大会在江西瑞金召开，成立中华苏维埃共和国临时中央政府。",p:["中华苏维埃"]},
{id:"c5q11",ch:5,t:"j",fs:6,q:"简述遵义会议的历史意义。",
 kw:["1935","生死攸关","转折点","毛泽东","左倾","军事问题"],
 ref:"1935年1月，中共中央政治局在遵义召开扩大会议，集中解决了当时最紧迫的军事问题和组织问题，事实上确立了以毛泽东为核心的党中央的正确领导，结束了「左」倾教条主义在中央的统治。遵义会议在极其危急的关头挽救了党和红军，是党的历史上一个生死攸关的转折点。",p:["遵义会议"]},
{id:"c5q12",ch:5,t:"l",real:true,src:"2015年4月真题",fs:10,q:"试述红军长征胜利的伟大历史意义。",
 kw:["围剿","转危为安","大本营","骨干力量","长征精神"],
 ref:"①粉碎了国民党反动派「围剿」红军、扼杀中国革命的企图，使中国革命转危为安；②红军长征把中国革命的大本营放到了西北，为迎接抗日救亡运动的新高潮准备了条件；③保存并锤炼了中国革命的骨干力量；④长征沿途播撒了革命的火种；⑤铸就了伟大的长征精神，成为激励党和人民继续前进的精神动力。",p:["长征","历史意义"]},

{id:"c5q13",ch:5,t:"s",q:"1928年12月，通电「服从国民政府，改易旗帜」，使国民党在形式上统一全国的事件是",o:["东北易帜","宁汉合流","中原大战","蒋桂战争"],a:"A",x:"1928年12月29日张学良通电东北易帜，标志着国民党在形式上统一了全国。",p:["国民党统治"]},
{id:"c5q14",ch:5,t:"s",q:"1927年12月，张太雷、叶挺等领导的武装起义是",o:["南昌起义","秋收起义","广州起义","百色起义"],a:"C",x:"1927年12月11日广州起义爆发，起义军曾一度占领广州大部分地区。",p:["武装起义"]},

{id:"c5q20",ch:5,t:"j",fs:6,q:"简述中国革命为什么必须走农村包围城市、武装夺取政权的道路。",

{id:"c8q1",ch:8,t:"s",real:true,src:"2015年4月真题",q:"1950年6月，中共七届三中全会确定当时的中心任务是",o:["进行土地改革","开展抗美援朝","恢复国民经济","争取国家财政经济状况的基本好转"],a:"D",x:"1950年6月七届三中全会确定当时全党和全国人民的中心任务是要在三年左右争取国家财政经济状况的基本好转。",p:["国民经济恢复"]},

{id:"c8q6",ch:8,t:"s",q:"新中国成立初期，在党政机关工作人员中开展的「三反」运动是指",o:["反贪污、反浪费、反官僚主义","反行贿、反偷税漏税、反盗骗国家财产","反贪污、反行贿、反偷工减料","反浪费、反偷工减料、反盗窃国家经济情报"],a:"A",x:"「三反」运动在党政机关开展，内容是反贪污、反浪费、反官僚主义。",p:["三反五反"]},

{id:"c8q9",ch:8,t:"s",q:"第一个五年计划（1953—1957年）建设的重点是",o:["优先发展重工业","优先发展轻工业","优先发展农业","优先发展交通运输业"],a:"A",x:"「一五」计划集中主要力量优先发展重工业，建立国家工业化的初步基础。",p:["一五计划"]},
{id:"c8q10",ch:8,t:"s",q:"标志着社会主义基本制度在中国全面确立的事件是",o:["中华人民共和国的成立","第一个五年计划的完成","1956年社会主义改造基本完成","1954年宪法的颁布"],a:"C",x:"1956年社会主义改造基本完成，标志着社会主义基本制度在中国全面确立，中国进入社会主义初级阶段。",p:["社会主义制度确立"]},
{id:"c8q11",ch:8,t:"j",real:true,src:"2023年4月真题",fs:6,q:"简述《共同纲领》的作用、核心内容及其意义。",
 kw:["临时宪法","国体","政体","执政地位"],
 ref:"作用：在当时起着临时宪法的作用。\n核心内容：关于新中国国体和政体的规定，即中华人民共和国为新民主主义即人民民主主义的国家，实行工人阶级领导的、以工农联盟为基础的、团结各民主阶级和国内各民族的人民民主专政；国家政权属于人民。\n意义：从法律上正式确立了中国共产党在全国的执政地位。",p:["《共同纲领》"]},
{id:"c8q12",ch:8,t:"l",fs:10,q:"试述党在过渡时期总路线的内容和意义。",
 kw:["社会主义改造","社会主义工业化","农业","手工业","资本主义工商业","1953"],
 ref:"内容：1953年，党正式提出过渡时期总路线。从中华人民共和国成立到社会主义改造基本完成，这是一个过渡时期。党在过渡时期的总路线和总任务，是要在一个相当长的时期内，逐步实现国家的社会主义工业化（「一化」），并逐步实现国家对农业、手工业和资本主义工商业的社会主义改造（「三改」）。\n意义：总路线反映了历史的必然性，是「一化」和「三改」同时并举，在发展生产力的同时变革生产关系；到1956年三大改造基本完成，社会主义基本制度在中国全面确立，实现了中国历史上最深刻最伟大的社会变革。",p:["过渡时期总路线"]},

{id:"c8q13",ch:8,t:"s",q:"1953年7月《朝鲜停战协定》签订，其历史意义在于",o:["抗美援朝战争胜利结束","朝鲜半岛实现统一","美国放弃干涉朝鲜事务","中朝签订友好同盟条约"],a:"A",x:"1953年7月27日《朝鲜停战协定》签订，历时两年九个月的抗美援朝战争胜利结束。",p:["抗美援朝"]},
{id:"c8q14",ch:8,t:"s",q:"1951年，中央人民政府与西藏地方政府签订的协议，标志着西藏实现",o:["和平解放","民主改革","民族区域自治","对外开放"],a:"A",x:"1951年5月《关于和平解放西藏办法的协议》（《十七条协议》）签订，西藏和平解放，祖国大陆实现统一。",p:["西藏解放"]},
{id:"c8q15",ch:8,t:"s",q:"1954年9月，第一届全国人民代表大会第一次会议通过的《中华人民共和国宪法》是",o:["第一部社会主义类型的宪法","第一部资产阶级宪法","临时宪法","过渡时期宪法"],a:"A",x:"1954年宪法是我国第一部社会主义类型的宪法，以根本大法的形式确认了人民民主专政的国体和人民代表大会制度的政体。",p:["1954宪法"]},
{id:"c8q16",ch:8,t:"s",q:"我国对资本主义工商业进行社会主义改造所采取的政策是",o:["和平赎买","没收","强制没收","自愿入股"],a:"A",x:"对资本主义工商业采取和平赎买的政策，通过国家资本主义形式逐步实现所有制的变革，是社会主义改造的独创性经验。",p:["资本主义工商业改造"]},
{id:"c8q17",ch:8,t:"s",q:"我国农业社会主义改造（农业合作化）遵循的原则是",o:["自愿互利、典型示范、国家帮助","强迫命令、行政推动","先集体化后机械化","平均分配"],a:"A",x:"农业合作化坚持自愿互利、典型示范、国家帮助的原则，采取互助组、初级社、高级社的过渡形式。",p:["农业改造"]},
{id:"c8q18",ch:8,t:"s",q:"新中国成立初期，对国民党政府留下的官僚资本采取的政策是",o:["没收","和平赎买","公私合营","租赁经营"],a:"A",x:"新中国成立后立即没收官僚资本，在此基础上建立社会主义性质的国营经济，掌握了国家经济命脉。",p:["国民经济恢复"]},
{id:"c8q19",ch:8,t:"s",q:"新中国成立初期实行的外交三大方针是",o:["另起炉灶、打扫干净屋子再请客、一边倒","不结盟、不称霸、不干涉内政","和平共处、求同存异、独立自主","互通有无、平等互利、友好合作"],a:"A",x:"三大外交方针即「另起炉灶」「打扫干净屋子再请客」「一边倒」，为新中国外交奠定了基本格局。",p:["外交方针"]},
{id:"c8q20",ch:8,t:"l",fs:10,q:"试述我国对资本主义工商业进行社会主义改造的政策、途径和意义。",
 kw:["利用","限制","改造","和平赎买","公私合营","定息"],
 ref:"政策：对资本主义工商业实行利用、限制、改造的政策，通过和平赎买的办法实现所有制的变革，这是我国社会主义改造的独创性经验。\n途径：采取由低级到高级的国家资本主义过渡形式，即从委托加工、计划订货、统购包销、委托经销代销等初级形式，发展到个别企业的公私合营，再发展到全行业公私合营；对资本家实行「四马分肥」和定息制度，付给一定经济报酬。\n意义：1956年底对资本主义工商业的改造基本完成，实现了马克思主义经典作家关于和平赎买的设想，避免了激烈的社会震荡，促进了生产力的发展，标志着社会主义基本制度在中国全面确立。",p:["资本主义工商业改造"]},

/* ================= 第九章 ================= */
{id:"c9q1",ch:9,t:"s",real:true,src:"2016年4月真题",q:"《论十大关系》围绕的基本方针是",o:["统筹兼顾、适当安排","调动一切积极因素为社会主义事业服务","以农业为基础、工业为主导","自力更生为主、争取外援为辅"],a:"B",x:"1956年毛泽东发表《论十大关系》，确定的基本方针是调动一切积极因素为社会主义事业服务。",p:["《论十大关系》"]},
{id:"c9q2",ch:9,t:"s",real:true,src:"2021年4月真题",q:"在中共八大上提出「三个主体、三个补充」思想的领导人是",o:["毛泽东","刘少奇","周恩来","陈云"],a:"D",x:"陈云在八大上提出「三个主体、三个补充」的构想，在坚持计划经济前提下允许市场调节。",p:["中共八大"]},
{id:"c9q3",ch:9,t:"s",real:true,src:"2021年4月真题",q:"1966—1976年发生的全局性、长时间的「左」倾严重错误是",o:["「大跃进」运动","人民公社化运动","「文化大革命」","「批林批孔」运动"],a:"C",x:"「文化大革命」（1966—1976年）使党、国家和人民遭到新中国成立以来最严重的挫折和损失。",p:["文化大革命"]},
{id:"c9q4",ch:9,t:"s",q:"中共八大指出，社会主义改造完成后国内的主要矛盾是",o:["工人阶级和资产阶级的矛盾","人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","敌我矛盾"],a:"B",x:"八大正确分析了国内主要矛盾，指出已不再是无产阶级同资产阶级的矛盾，而是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。",p:["中共八大"]},
{id:"c9q5",ch:9,t:"s",q:"1957年，毛泽东发表《关于正确处理人民内部矛盾的问题》，提出要",o:["正确处理人民内部矛盾","以阶级斗争为纲","抓革命促生产","调整巩固充实提高"],a:"A",x:"该著作系统阐述了社会主义社会基本矛盾理论，提出正确处理人民内部矛盾是国家政治生活的主题。",p:["人民内部矛盾"]},

{id:"c9q9",ch:9,t:"s",q:"1962年初，为初步总结「大跃进」以来的经验教训而召开的重要会议是",o:["七千人大会","中共八大","庐山会议","八届十中全会"],a:"A",x:"1962年1—2月中央召开七千人大会（扩大的中央工作会议），初步总结了「大跃进」以来的经验教训。",p:["探索曲折"]},
{id:"c9q10",ch:9,t:"s",q:"下列各项中，不属于社会主义建设探索时期取得成就的是",o:["建立独立完整的工业体系和国民经济体系","「两弹一星」取得成功","恢复在联合国的合法席位","全面建成小康社会"],a:"D",x:"全面建成小康社会是党的十八大以来新时代取得的成就。前三项均为1956—1976年社会主义建设探索时期取得的成就。",p:["建设成就"]},
{id:"c9q11",ch:9,t:"j",fs:6,q:"简述中共八大的主要内容和历史意义。",
 kw:["主要矛盾","经济文化","任务","工业化","陈云"],
 ref:"①正确分析了社会主义改造完成后国内主要矛盾的变化，指出主要矛盾是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾；②确定党和全国人民的主要任务是集中力量发展社会生产力，实现国家工业化；③陈云提出「三个主体、三个补充」的构想。\n意义：八大路线是正确的，为社会主义建设指明了方向，是探索中国自己的社会主义建设道路的良好开端。",p:["中共八大"]},
{id:"c9q12",ch:9,t:"l",fs:10,q:"试述1956—1976年社会主义建设在探索中取得的主要成就。",
 kw:["工业体系","国民经济体系","两弹一星","石油","联合国"],
 ref:"①建立了独立的、比较完整的工业体系和国民经济体系，从根本上解决了工业化「从无到有」的问题；②科技方面取得重大突破，「两弹一星」的成功增强了国防实力；③大庆油田开发，摘掉了「贫油国」的帽子，石油工业迅猛发展；④外交方面，恢复在联合国的合法席位，实现中美关系正常化、中日邦交正常化；⑤这些成就为改革开放和社会主义现代化建设奠定了物质技术基础。",p:["建设成就"]},

{id:"c9q13",ch:9,t:"s",q:"1956年，毛泽东提出的繁荣社会主义科学文化的方针是",o:["百花齐放、百家争鸣","古为今用、洋为中用","推陈出新、百花齐放","文艺为人民服务"],a:"A",x:"1956年4月毛泽东提出「百花齐放、百家争鸣」方针，促进了科学文化事业的繁荣发展。",p:["双百方针"]},
{id:"c9q14",ch:9,t:"s",q:"1964年底，周恩来在三届全国人大一次会议上提出的宏伟目标是",o:["实现工业、农业、国防和科学技术现代化","实现「三步走」发展战略","建立社会主义市场经济体制","全面建成小康社会"],a:"A",x:"1964年底周恩来在政府工作报告中正式提出，要在不太长的历史时期内把我国建设成为一个具有现代工业、现代农业、现代国防和现代科学技术的社会主义强国。",p:["建设成就"]},
{id:"c9q15",ch:9,t:"s",q:"20世纪60年代，为摘掉中国「贫油国」帽子作出重大贡献的是",o:["大庆油田的开发和建设","宝钢的投产","成昆铁路的建成","葛洲坝工程开工"],a:"A",x:"1960年大庆油田开始大规模开发，结束了中国石油依赖进口的历史，涌现出「铁人」王进喜等劳动模范。",p:["建设成就"]},
{id:"c9q16",ch:9,t:"s",q:"1972年9月，访华并推动中日两国实现邦交正常化的日本首相是",o:["田中角荣","大平正芳","中曾根康弘","三木武夫"],a:"A",x:"1972年9月日本首相田中角荣访华，中日两国发表联合声明，实现邦交正常化。",p:["外交成就"]},
{id:"c9q17",ch:9,t:"s",q:"中美两国正式建立外交关系是在",o:["1972年","1975年","1979年","1982年"],a:"C",x:"1972年尼克松访华发表《上海公报》，1979年1月1日中美两国正式建交。",p:["外交成就"]},
{id:"c9q18",ch:9,t:"s",q:"20世纪60年代，带病坚持治理内涝、风沙、盐碱「三害」，被誉为「县委书记的榜样」的是",o:["焦裕禄","孔繁森","王进喜","雷锋"],a:"A",x:"焦裕禄在担任河南兰考县委书记期间，身患肝癌仍坚持工作，被人民群众誉为「县委书记的榜样」。",p:["建设成就"]},
{id:"c9q19",ch:9,t:"s",q:"「文化大革命」留下的深刻教训不包括",o:["必须反对个人崇拜","必须坚持民主集中制","必须健全社会主义民主和法制","必须坚持以阶级斗争为纲"],a:"D",x:"「文化大革命」恰恰说明不能把阶级斗争扩大化、绝对化，必须坚持以经济建设为中心。",p:["文化大革命"]},
{id:"c9q20",ch:9,t:"j",fs:6,q:"简述「文化大革命」的历史教训。",
 kw:["阶级斗争","个人崇拜","民主集中制","法制","实事求是"],
 ref:"①必须正确认识和处理社会主义社会中的阶级斗争问题，不能把阶级斗争扩大化、绝对化，坚持以经济建设为中心；②必须反对个人崇拜，坚持民主集中制和集体领导制度；③必须发展社会主义民主，健全社会主义法制；④必须加强党的自身建设，坚持实事求是的思想路线；⑤必须科学评价历史人物，正确处理党内矛盾和人民内部矛盾。",p:["文化大革命"]},

/* ================= 第十章 ================= */
{id:"c10q1",ch:10,t:"s",real:true,src:"2015年4月真题",q:"1988年，我国建立的第三个经济特区是",o:["深圳","珠海","厦门","海南"],a:"D",x:"1980年设立深圳、珠海、汕头、厦门四个经济特区，1988年海南建省并成为经济特区。",p:["经济特区"]},
{id:"c10q2",ch:10,t:"s",real:true,src:"2015年4月真题",q:"中国恢复对澳门行使主权的时间是",o:["1997年7月1日","1999年7月1日","1999年12月20日","1997年12月20日"],a:"C",x:"1999年12月20日中国政府对澳门恢复行使主权，设立澳门特别行政区。",p:["祖国统一"]},
{id:"c10q3",ch:10,t:"s",real:true,src:"2016年4月真题",q:"我国对外开放进入新阶段的标志是",o:["加入亚太经合组织","加入世界贸易组织","设立经济特区","开发开放浦东"],a:"B",x:"2001年12月中国正式加入世界贸易组织（WTO），标志着对外开放进入新阶段。",p:["对外开放"]},
{id:"c10q4",ch:10,t:"s",q:"1978年关于真理标准问题大讨论的核心观点是",o:["两个凡是","实践是检验真理的唯一标准","以阶级斗争为纲","发展是硬道理"],a:"B",x:"真理标准问题大讨论冲破了「两个凡是」的束缚，为十一届三中全会实现伟大转折作了思想准备。",p:["真理标准讨论"]},
{id:"c10q5",ch:10,t:"s",q:"中共十一届三中全会召开的时间和地位是",o:["1976年10月，拨乱反正","1978年12月，党的历史上具有深远意义的伟大转折","1982年9月，开创现代化建设新局面","1978年5月，思想解放"],a:"B",x:"1978年12月十一届三中全会果断停止「以阶级斗争为纲」，作出把党和国家工作重心转移到经济建设上来、实行改革开放的历史性决策，是党的历史上具有深远意义的伟大转折。",p:["十一届三中全会"]},
{id:"c10q6",ch:10,t:"s",q:"我国农村改革率先突破，实行家庭联产承包责任制最早开始于",o:["江苏华西村","安徽凤阳县小岗村","广东深圳","河南小岗村"],a:"B",x:"1978年底安徽凤阳小岗村农民率先实行包产到户，拉开了农村改革的序幕。",p:["农村改革"]},
{id:"c10q7",ch:10,t:"s",q:"1980年，我国设立的经济特区不包括",o:["深圳","珠海","汕头","海南"],a:"D",x:"1980年设立深圳、珠海、汕头、厦门四个经济特区，海南经济特区设立于1988年。",p:["经济特区"]},
{id:"c10q8",ch:10,t:"s",q:"1992年，中共十四大确立的经济体制改革目标是",o:["建立计划经济体制","建立社会主义市场经济体制","建立有计划的商品经济","实行单一的公有制"],a:"B",x:"1992年10月十四大明确提出我国经济体制改革的目标是建立社会主义市场经济体制。",p:["十四大"]},
{id:"c10q9",ch:10,t:"s",q:"中国对香港恢复行使主权的时间是",o:["1997年7月1日","1999年12月20日","1997年12月20日","1999年7月1日"],a:"A",x:"1997年7月1日中国政府对香港恢复行使主权，设立香港特别行政区，提出「一国两制」方针。",p:["祖国统一"]},
{id:"c10q10",ch:10,t:"s",q:"系统提出社会主义初级阶段理论和「三步走」发展战略的会议是",o:["中共十二大","中共十三大","中共十四大","中共十五大"],a:"B",x:"1987年中共十三大系统阐述了社会主义初级阶段理论，提出「三步走」发展战略和党在初级阶段的基本路线。",p:["十三大"]},
{id:"c10q11",ch:10,t:"j",fs:6,q:"简述中共十一届三中全会的主要内容及其历史意义。",
 kw:["1978","解放思想","工作重心","经济建设","改革开放","转折"],
 ref:"1978年12月，中共十一届三中全会在北京召开。主要内容：①冲破「两个凡是」的束缚，重新确立解放思想、实事求是的思想路线；②果断停止使用「以阶级斗争为纲」的口号，把党和国家工作重心转移到经济建设上来；③作出实行改革开放的历史性决策；④审查和解决了一批重大冤假错案。\n历史意义：实现了新中国成立以来党的历史上具有深远意义的伟大转折，开启了改革开放和社会主义现代化建设的新时期。",p:["十一届三中全会"]},
{id:"c10q12",ch:10,t:"l",fs:10,q:"试述邓小平南方谈话的主要内容和意义。",
 kw:["解放生产力","计划","市场","发展才是硬道理","改革","步伐"],
 ref:"主要内容：①社会主义的本质是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕；②计划和市场都是经济手段，不是社会主义与资本主义的本质区别，要加快改革步伐，建立社会主义市场经济体制；③「发展才是硬道理」，抓住时机发展自己；④坚持党的基本路线一百年不动摇；⑤两手抓，两手都要硬。\n意义：科学总结了党的十一届三中全会以来的基本实践和基本经验，回答了长期束缚人们思想的许多重大认识问题，把改革开放和现代化建设推进到新阶段。",p:["南方谈话"]},

{id:"c10q13",ch:10,t:"s",q:"1979年3月，邓小平在理论工作务虚会上提出，实现四个现代化必须坚持四项基本原则，其中核心是",o:["坚持共产党的领导","坚持社会主义道路","坚持人民民主专政","坚持马列主义毛泽东思想"],a:"A",x:"四项基本原则是立国之本，其中坚持共产党的领导是核心，是实现四个现代化的根本保证。",p:["四项基本原则"]},
{id:"c10q14",ch:10,t:"s",q:"1982年9月，邓小平在中共十二大开幕词中首次提出的命题是",o:["建设有中国特色的社会主义","社会主义初级阶段理论","建立社会主义市场经济体制","「一国两制」构想"],a:"A",x:"十二大提出「建设有中国特色的社会主义」的重大命题，成为指引改革开放和现代化建设的旗帜。",p:["十二大"]},
{id:"c10q15",ch:10,t:"s",q:"「一国两制」科学构想，最初是针对哪一问题提出的",o:["台湾问题","香港问题","澳门问题","钓鱼岛问题"],a:"A",x:"「一国两制」构想最早是为解决台湾问题而提出，后首先成功运用于解决香港、澳门问题。",p:["一国两制"]},
{id:"c10q16",ch:10,t:"s",q:"1990年，中共中央、国务院作出开发开放决策的地区是",o:["上海浦东","天津滨海","深圳前海","广州南沙"],a:"A",x:"1990年4月中央决定开发开放上海浦东，成为20世纪90年代中国改革开放的重点。",p:["对外开放"]},
{id:"c10q17",ch:10,t:"s",q:"1997年9月，中共十五大确立的党的指导思想是",o:["邓小平理论","「三个代表」重要思想","科学发展观","习近平新时代中国特色社会主义思想"],a:"A",x:"十五大把邓小平理论确立为党的指导思想并写入党章。",p:["十五大"]},
{id:"c10q18",ch:10,t:"s",q:"2002年11月，中共十六大确立的党的指导思想是",o:["邓小平理论","「三个代表」重要思想","科学发展观","习近平新时代中国特色社会主义思想"],a:"B",x:"十六大把「三个代表」重要思想确立为党的指导思想并写入党章。",p:["十六大"]},
{id:"c10q19",ch:10,t:"s",q:"2007年10月，中共十七大全面阐述并写入党章的重大战略思想是",o:["科学发展观","构建社会主义和谐社会","创新驱动发展战略","乡村振兴战略"],a:"A",x:"十七大全面阐述了科学发展观的科学内涵、精神实质和根本要求，并将其写入党章。",p:["十七大"]},
{id:"c10q20",ch:10,t:"j",fs:6,q:"简述「一国两制」方针的基本内容和历史实践。",
 kw:["社会主义制度","资本主义制度","长期不变","1997","1999"],
 ref:"基本内容：在祖国统一的前提下，国家的主体坚持社会主义制度，同时在台湾、香港、澳门保持原有的资本主义制度和生活方式长期不变。\n历史实践：1997年7月1日中国对香港恢复行使主权，1999年12月20日对澳门恢复行使主权，香港、澳门回归祖国并保持繁荣稳定，充分证明「一国两制」是解决祖国统一问题的正确方针。",p:["一国两制"]},

/* ================= 第十一章 ================= */
{id:"c11q1",ch:11,t:"s",real:true,src:"2022年10月真题",q:"中共十九大指出，我国社会主要矛盾已经转化为",o:["人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","无产阶级与资产阶级的矛盾"],a:"A",x:"十九大报告指出，我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。",p:["社会主要矛盾"]},
{id:"c11q2",ch:11,t:"s",q:"中华民族伟大复兴的中国梦的基本内涵是",o:["国家富强、民族振兴、人民幸福","独立自主、和平发展、合作共赢","实现工业化、城镇化、现代化","共同富裕、公平正义、自由平等"],a:"A",x:"中国梦的基本内涵是国家富强、民族振兴、人民幸福。",p:["中国梦"]},
{id:"c11q3",ch:11,t:"s",q:"中国特色社会主义事业「五位一体」总体布局不包括",o:["经济建设","政治建设","社会建设","党的建设"],a:"D",x:"「五位一体」是经济建设、政治建设、文化建设、社会建设、生态文明建设。",p:["五位一体"]},
{id:"c11q4",ch:11,t:"s",q:"「四个全面」战略布局不包括",o:["全面建成小康社会","全面深化改革","全面依法治国","全面发展经济"],a:"D",x:"「四个全面」即全面建成小康社会、全面深化改革、全面依法治国、全面从严治党。",p:["四个全面"]},
{id:"c11q5",ch:11,t:"s",q:"中共十八大召开的时间是",o:["2012年","2013年","2017年","2015年"],a:"A",x:"2012年11月中共十八大召开，中国特色社会主义进入新时代的历史起点。",p:["十八大"]},
{id:"c11q6",ch:11,t:"s",q:"把习近平新时代中国特色社会主义思想确立为党的行动指南并写入党章，是在",o:["中共十八大","中共十九大","中共十九届四中全会","中共二十大"],a:"B",x:"2017年中共十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并写入党章。",p:["十九大"]},
{id:"c11q7",ch:11,t:"s",q:"十九大提出的「两步走」战略安排中，到2035年的目标是",o:["全面建成小康社会","基本实现社会主义现代化","建成富强民主文明和谐美丽的社会主义现代化强国","实现共同富裕"],a:"B",x:"「两步走」：到2035年基本实现社会主义现代化；到本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。",p:["两步走"]},
{id:"c11q8",ch:11,t:"s",q:"中国特色社会主义进入新时代，这是中共哪次大会作出的重大政治论断",o:["十八大","十九大","二十届一中全会","二十大"],a:"B",x:"2017年中共十九大宣告中国特色社会主义进入新时代。",p:["新时代"]},
{id:"c11q9",ch:11,t:"s",q:"2021年7月1日，庆祝中国共产党成立100周年大会上宣告",o:["实现中华民族伟大复兴","全面建成小康社会，实现第一个百年奋斗目标","基本实现社会主义现代化","建成社会主义现代化强国"],a:"B",x:"2021年7月1日，习近平庄严宣告：我们实现了第一个百年奋斗目标，在中华大地上全面建成了小康社会。",p:["全面小康"]},
{id:"c11q10",ch:11,t:"s",q:"中共二十大提出，新时代新征程中国共产党的中心任务是以中国式现代化",o:["全面推进中华民族伟大复兴","全面实现社会主义现代化","全面建成社会主义现代化强国","全面实现共同富裕"],a:"A",x:"二十大报告指出：从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。",p:["中国式现代化"]},
{id:"c11q11",ch:11,t:"j",fs:6,q:"简述「五位一体」总体布局和「四个全面」战略布局的内容。",
 kw:["经济","政治","文化","社会","生态文明","全面"],
 ref:"「五位一体」总体布局：经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体。\n「四个全面」战略布局：全面建成小康社会、全面深化改革、全面依法治国、全面从严治党。\n二者共同构成新时代坚持和发展中国特色社会主义的总体布局和战略布局，为实现中华民族伟大复兴提供了行动指南。",p:["五位一体","四个全面"]},
{id:"c11q12",ch:11,t:"l",fs:10,q:"试述中国特色社会主义进入新时代的主要依据和伟大意义。",
 kw:["十八大","十九大","主要矛盾","新时代","中华民族伟大复兴","习近平新时代中国特色社会主义思想"],
 ref:"主要依据：①党的十八大以来，党和国家事业取得历史性成就、发生历史性变革；②我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾；③十九大作出中国特色社会主义进入新时代的重大政治论断。\n伟大意义：①意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃；②意味着科学社会主义在21世纪的中国焕发出强大生机活力；③意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径；④习近平新时代中国特色社会主义思想成为党的行动指南，为实现中华民族伟大复兴提供了根本遵循。",p:["新时代"]},
{id:"c11q13",ch:11,t:"s",q:"党的十八届五中全会提出的新发展理念是",o:["创新、协调、绿色、开放、共享","改革、发展、稳定、和谐、共赢","富强、民主、文明、和谐、美丽","自由、平等、公正、法治、爱国"],a:"A",x:"新发展理念即创新、协调、绿色、开放、共享五大发展理念，是关系我国发展全局的一场深刻变革。",p:["新发展理念"]},
{id:"c11q14",ch:11,t:"s",q:"2013年，习近平提出共建「一带一路」倡议，指的是",o:["丝绸之路经济带和21世纪海上丝绸之路","长江经济带和京津冀协同发展","西部大开发和东北振兴","粤港澳大湾区和长三角一体化"],a:"A",x:"「一带一路」即「丝绸之路经济带」和「21世纪海上丝绸之路」，是推动构建人类命运共同体的重要实践平台。",p:["一带一路"]},
{id:"c11q15",ch:11,t:"s",q:"2012年12月，开启全面从严治党新征程的重要举措是",o:["中央八项规定","「三严三实」专题教育","「不忘初心、牢记使命」主题教育","设立国家监察委员会"],a:"A",x:"2012年12月中共中央政治局审议通过中央八项规定，从作风建设抓起，开启全面从严治党新征程。",p:["全面从严治党"]},
{id:"c11q16",ch:11,t:"s",q:"2013年11月，中共十八届三中全会提出全面深化改革的总目标是",o:["完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化","全面建成社会主义现代化强国","实现中华民族伟大复兴","建立社会主义市场经济体制"],a:"A",x:"十八届三中全会把完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化作为全面深化改革的总目标。",p:["全面深化改革"]},
{id:"c11q17",ch:11,t:"s",q:"2019年10月，中共十九届四中全会研究的主题是",o:["坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化","制定「十四五」规划和二〇三五年远景目标","全面建设社会主义现代化国家","新时代坚持和发展中国特色社会主义"],a:"A",x:"十九届四中全会专题研究坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化问题并作出重要决定。",p:["制度建设"]},
{id:"c11q18",ch:11,t:"s",q:"习近平提出建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界，这一外交理念被称为",o:["构建人类命运共同体","结伴而不结盟","新型国际关系","全球发展倡议"],a:"A",x:"构建人类命运共同体是习近平外交思想的重要内容，已多次写入联合国相关决议。",p:["大国外交"]},
{id:"c11q19",ch:11,t:"s",q:"中共十九大提出的新时代坚持和发展中国特色社会主义的基本方略是",o:["「十四个坚持」","「八个明确」","「五位一体」总体布局","「四个全面」战略布局"],a:"A",x:"十九大提出「八个明确」「十四个坚持」，其中「十四个坚持」构成新时代坚持和发展中国特色社会主义的基本方略。",p:["十九大"]},
{id:"c11q20",ch:11,t:"j",fs:6,q:"简述「两个一百年」奋斗目标的内容。",
 kw:["2021","全面建成小康社会","2049","现代化强国","中华民族伟大复兴"],
 ref:"「两个一百年」奋斗目标：第一个百年奋斗目标，即到中国共产党成立一百年（2021年）时全面建成小康社会；第二个百年奋斗目标，即到新中国成立一百年（2049年）时，把我国建成富强民主文明和谐美丽的社会主义现代化强国，实现中华民族伟大复兴。现在第一个百年奋斗目标已经如期实现，全党正团结带领人民为实现第二个百年奋斗目标而奋斗。",p:["两个一百年"]},
