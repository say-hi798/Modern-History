{id:"c5q77",ch:5,t:"s",q:"1935年9月，红军攻克的通往陕甘革命根据地的最后一个天险是",o:["娄山关","腊子口","泸定桥","大渡河"],a:"B",x:"1935年9月红军攻克天险腊子口，打通了通往陕甘革命根据地的道路。",p:["长征"]},
{id:"c5q78",ch:5,t:"s",q:"下列不属于伟大长征精神内涵的是",o:["同人民群众生死相依、患难与共","顾全大局、严守纪律、紧密团结","贪图安逸、追求享乐","不怕任何艰难险阻、不惜付出一切牺牲"],a:"C",x:"伟大长征精神包括坚定理想信念、不怕牺牲、独立自主、顾全大局、严守纪律、患难与共等。",p:["长征精神"]},
{id:"c5q79",ch:5,t:"s",q:"1936年7月，红二、六军团与红四方面军会师后，合编为",o:["红一方面军","红十五军团","红五军团","红二方面军"],a:"D",x:"1936年7月红二、六军团与红四方面军在甘孜会师，合编为红二方面军。",p:["长征"]},
{id:"c5q80",ch:5,t:"s",q:"中央红军长征走过的总里程约为",o:["二万五千里","一万里","三万里","四万里"],a:"A",x:"中央红军长征历时一年，行程约二万五千里，纵横十余省，创造了人间奇迹。",p:["长征"]},
{id:"c5q81",ch:5,t:"s",q:"1934年10月，中央红军开始长征，其出发地区是",o:["鄂豫皖根据地","中央革命根据地","湘鄂西根据地","陕甘根据地"],a:"B",x:"1934年10月中央红军八万余人从中央革命根据地出发长征。",p:["长征"]},
{id:"c5q82",ch:5,t:"s",q:"长征中，毛泽东指挥红军声东击西、打乱敌人追剿计划的战役是",o:["强渡大渡河","飞夺泸定桥","四渡赤水","爬雪山"],a:"C",x:"遵义会议后毛泽东指挥红军四渡赤水，打乱了敌人的追剿计划。",p:["长征"]},
{id:"c5q83",ch:5,t:"s",q:"土地革命战争时期，红军的三大任务是",o:["打仗、训练、生产","侦察、行军、作战","建军、建党、建政","打仗消灭敌人、打土豪筹款子、做群众工作"],a:"D",x:"红军是战斗队又是工作队、生产队，担负打仗、筹款、做群众工作的任务。",p:["农村包围城市"]},
{id:"c5q84",ch:5,t:"s",q:"1930年，蒋介石与阎锡山、冯玉祥、李宗仁等军阀集团之间进行的战争是",o:["中原大战","蒋桂战争","直奉战争","护国战争"],a:"A",x:"1930年5月爆发的中原大战以蒋介石获胜告终，巩固了其统治地位。",p:["国民党统治"]},
{id:"c5q85",ch:5,t:"s",q:"1928年春，毛泽东在井冈山为红军制定的「三大纪律」是",o:["服从命令、严守纪律、勇敢作战","行动听指挥、不拿工人农民一点东西、打土豪要归公","一切行动听指挥、不拿群众一针一线、一切缴获要归公","勇敢战斗、不怕牺牲、多做贡献"],a:"B",x:"1928年春毛泽东在遂川宣布三大纪律：行动听指挥、不拿工人农民一点东西、打土豪要归公。",p:["井冈山根据地"]},
{id:"c5q86",ch:5,t:"j",fs:6,q:"简述南昌起义的历史意义。",kw:["第一枪","武装反抗","人民军队","开端","土地革命战争"],ref:"南昌起义的历史意义：打响了武装反抗国民党反动派的第一枪，体现了中国共产党人前赴后继的革命精神；成为中国共产党独立领导革命战争、创建人民军队和武装夺取政权的伟大开端；揭开了土地革命战争的序幕。",p:["南昌起义"]},
{id:"c5q87",ch:5,t:"j",fs:6,q:"简述秋收起义的特点及历史意义。",kw:["工农革命军","旗帜","文家市","农村","井冈山"],ref:"秋收起义的特点：公开打出了「工农革命军」的旗帜，不再沿用国民革命军的番号；它不但是军事行动，而且是群众性的武装起义。历史意义：起义受挫后，毛泽东在文家市主持召开前委会议，决定放弃攻打长沙，向敌人统治力量薄弱的农村进军，随后到达井冈山，创建了第一个农村革命根据地，开辟了农村包围城市的正确道路。",p:["秋收起义"]},
{id:"c5q88",ch:5,t:"j",fs:6,q:"简述三湾改编的主要内容。",kw:["支部建在连上","党代表","民主制度","绝对领导"],ref:"三湾改编的主要内容：将党的支部建在连上，班排设党小组，营以上各级设党代表，从组织上确立了党对军队的绝对领导；在军队内部实行民主制度，连以上建立士兵委员会，废除雇佣制，实现官兵平等；对部队进行整编，缩师为团。",p:["三湾改编"]},
{id:"c5q89",ch:5,t:"j",fs:6,q:"简述遵义会议集中解决的主要问题。",kw:["军事问题","组织问题","毛泽东","左倾","转折点"],ref:"1935年1月，中共中央政治局在遵义召开扩大会议，集中解决了当时最紧迫的军事问题和组织问题，批评了博古、李德在第五次反「围剿」和长征初期军事指挥上的错误，结束了「左」倾教条主义在中央的统治，事实上确立了以毛泽东为核心的党中央的正确领导。遵义会议是党的历史上一个生死攸关的转折点。",p:["遵义会议"]},
{id:"c5q90",ch:5,t:"j",fs:6,q:"简述伟大长征精神的基本内涵。",kw:["理想","信念","不怕任何艰难险阻","独立自主","顾全大局","严守纪律","人民群众"],ref:"伟大长征精神，就是把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利的精神；就是为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神；就是坚持独立自主、实事求是，一切从实际出发的精神；就是顾全大局、严守纪律、紧密团结的精神；就是紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗的精神。",p:["长征精神"]},
{id:"c5q91",ch:5,t:"j",fs:6,q:"简述王明「左」倾教条主义的主要错误及危害。",kw:["教条主义","共产国际","第五次反围剿","被迫长征","宗派主义"],ref:"王明「左」倾教条主义的主要错误：在革命道路问题上坚持城市中心论，照搬共产国际指示和苏联经验；在组织上实行宗派主义、惩办主义；在军事上，第五次反「围剿」中先是冒险进攻，后又消极防御。其危害是造成中央苏区第五次反「围剿」失败，中央红军被迫长征，使党在白区的组织几乎损失殆尽，给中国革命造成严重危害。",p:["左倾错误"]},
{id:"c5q92",ch:5,t:"l",fs:10,q:"试述农村包围城市、武装夺取政权道路理论的基本内容及其重大意义。",kw:["农村包围城市","武装夺取政权","工农武装割据","武装斗争","土地革命","根据地"],ref:"农村包围城市、武装夺取政权道路理论的基本内容是「工农武装割据」思想，即在中国共产党的领导下，以武装斗争为主要形式，以土地革命为中心内容，以农村革命根据地为战略阵地，三者密切结合。这一理论揭示了中国革命发展的客观规律，指明了中国革命胜利的正确道路。它的重大意义在于：它是毛泽东为代表的中国共产党人把马克思主义基本原理同中国革命具体实际相结合的产物，是对马克思主义革命学说的创造性发展，为中国革命的胜利指明了方向，成为引导中国革命走向胜利的正确道路。",p:["农村包围城市"]},
{id:"c5q93",ch:5,t:"l",fs:10,q:"试述中国共产党开辟中国革命新道路的历史过程。",kw:["南昌起义","八七会议","秋收起义","三湾改编","井冈山","农村包围城市"],ref:"大革命失败后，中国共产党开始独立领导革命战争。1927年8月1日南昌起义打响了武装反抗国民党反动派的第一枪；8月7日八七会议确定了土地革命和武装反抗国民党反动派的总方针；1927年9月秋收起义受挫后，毛泽东率部进行三湾改编，确立了党对军队的绝对领导，并于10月到达井冈山，创建了第一个农村革命根据地；1928年4月朱德、毛泽东在井冈山会师，红军不断壮大。中国共产党在实践中逐步开辟了农村包围城市、武装夺取政权的革命道路。",p:["农村包围城市"]},
{id:"c5q94",ch:5,t:"l",fs:10,q:"试述「左」倾错误给中国革命造成的危害及历史教训。",kw:["第五次反围剿","被迫长征","白区","实事求是","教条主义"],ref:"土地革命战争时期，「左」倾错误特别是王明「左」倾教条主义给中国革命造成严重危害：使党在白区的组织几乎损失殆尽；造成中央苏区第五次反「围剿」失败，中央红军被迫长征；使革命根据地和红军力量遭受重大损失。历史教训：必须坚持实事求是，把马克思主义基本原理与中国革命实际相结合，反对教条主义；必须坚持民主集中制，反对宗派主义和个人专断。",p:["左倾错误"]},
{id:"c5q95",ch:5,t:"l",fs:10,q:"试述伟大长征精神的科学内涵及其现实意义。",kw:["理想","信念","不怕任何艰难险阻","独立自主","顾全大局","严守纪律","艰苦奋斗","精神动力"],ref:"伟大长征精神，就是把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利的精神；就是为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神；就是坚持独立自主、实事求是，一切从实际出发的精神；就是顾全大局、严守纪律、紧密团结的精神；就是紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗的精神。长征精神是中国共产党人和人民军队革命风范的生动反映，是中华民族自强不息的民族品格的集中展示。今天，长征精神仍然是激励我们进行社会主义现代化建设、实现中华民族伟大复兴的强大精神动力。",p:["长征精神"]},

/* ================= 第六章 ================= */
{id:"c6q37",ch:6,t:"s",q:"九一八事变中，日军制造事端、借以发动进攻的具体地点是",o:["沈阳城郊柳条湖","北平卢沟桥","长春南岭","锦州火车站"],a:"A",x:"1931年9月18日夜，日本关东军自行炸毁沈阳北郊柳条湖附近南满铁路一段路轨，反诬中国军队所为，随即炮轰东北军驻地北大营，制造九一八事变。",p:["九一八事变"]},
{id:"c6q38",ch:6,t:"s",q:"1932年1月28日，日军进攻上海，奋起抵抗的军队是",o:["十九路军","东北军","西北军","晋绥军"],a:"A",x:"1932年1月28日，日军发动一·二八事变进攻上海，驻沪十九路军在蔡廷锴、蒋光鼐率领下奋起抵抗。",p:["局部抗战"]},
{id:"c6q39",ch:6,t:"s",q:"日本在东北建立的伪「满洲国」的傀儡元首是",o:["溥仪","汪精卫","陈公博","张作霖"],a:"A",x:"1932年3月，日本扶植清废帝溥仪任伪「满洲国」执政，后改称皇帝，充当日本侵略者的傀儡。",p:["局部抗战"]},
{id:"c6q40",ch:6,t:"s",q:"1936年2月，东北各抗日武装在中国共产党领导下统一改编为",o:["东北抗日联军","东北抗日义勇军","察哈尔抗日同盟军","抗日救国军"],a:"A",x:"1936年2月，东北各抗日武装统一改编为东北抗日联军，在极端艰苦的条件下坚持抗日游击战争。",p:["局部抗战"]},
{id:"c6q41",ch:6,t:"s",q:"东北抗日联军的主要领导人、1940年2月壮烈殉国的是",o:["杨靖宇","马占山","赵登禹","吉鸿昌"],a:"A",x:"杨靖宇是东北抗日联军的主要领导人，率部在白山黑水间坚持抗战，1940年2月壮烈殉国。",p:["局部抗战"]},
{id:"c6q42",ch:6,t:"s",q:"华北事变中，日本扶植汉奸殷汝耕成立的傀儡政权是",o:["冀东防共自治政府","伪「满洲国」","伪「中华民国维新政府」","伪「蒙疆联合自治政府」"],a:"A",x:"1935年11月，日本策动「华北五省自治运动」，扶植汉奸殷汝耕成立「冀东防共自治政府」。",p:["华北事变"]},
{id:"c6q43",ch:6,t:"s",q:"1935年，日本强迫国民党政府签订的《何梅协定》，使中国在下列哪两省的主权大部丧失",o:["河北、察哈尔","辽宁、吉林","山东、河南","山西、绥远"],a:"A",x:"《何梅协定》迫使国民党中央军和宪兵撤出河北，中国在河北、察哈尔两省的主权大部丧失，华北危机加深。",p:["华北事变"]},
{id:"c6q44",ch:6,t:"s",q:"一二九运动后，北平学生在党的领导下成立、深入工农开展抗日宣传的组织是",o:["中华民族解放先锋队","中国青年党","中华革命党","民主青年同盟"],a:"A",x:"1936年2月，北平学生在中共领导下成立中华民族解放先锋队，深入工农开展抗日救亡宣传。",p:["局部抗战"]},
{id:"c6q45",ch:6,t:"s",q:"中共中央确定建立抗日民族统一战线策略方针的瓦窑堡会议，召开于",o:["1935年12月","1934年1月","1936年12月","1937年8月"],a:"A",x:"1935年12月，中共中央在陕北瓦窑堡召开政治局会议，确定了建立抗日民族统一战线的策略方针。",p:["抗日民族统一战线"]},
{id:"c6q46",ch:6,t:"s",q:"1935年8月1日，中共驻共产国际代表团以中华苏维埃共和国中央政府和中共中央名义发表的文件是",o:["《为抗日救国告全体同胞书》（《八一宣言》）","《抗日救国十大纲领》","《对目前时局的宣言》","《论反对日本帝国主义的策略》"],a:"A",x:"《八一宣言》即《为抗日救国告全体同胞书》，呼吁全国各党派停止内战、一致抗日。",p:["抗日民族统一战线"]},
{id:"c6q47",ch:6,t:"s",q:"瓦窑堡会议后，毛泽东在党的活动分子会议上作的报告是",o:["《论反对日本帝国主义的策略》","《新民主主义论》","《论联合政府》","《战争和战略问题》"],a:"A",x:"瓦窑堡会议后，毛泽东作《论反对日本帝国主义的策略》报告，系统阐明党的抗日民族统一战线策略。",p:["抗日民族统一战线"]},
{id:"c6q48",ch:6,t:"s",q:"西安事变发生后，中共中央派赴西安参与调停、促成事变和平解决的主要代表是",o:["周恩来","朱德","刘少奇","任弼时"],a:"A",x:"西安事变爆发后，中共中央派周恩来等赴西安，推动事变和平解决，促成国共两党重新合作。",p:["西安事变"]},
{id:"c6q49",ch:6,t:"s",q:"西安事变的和平解决，标志着",o:["十年内战基本结束，抗日民族统一战线初步形成","抗日民族统一战线正式形成","全面抗战的开始","抗日战争进入相持阶段"],a:"A",x:"西安事变和平解决成为时局转换的枢纽，十年内战基本结束，抗日民族统一战线初步形成。",p:["西安事变"]},
{id:"c6q50",ch:6,t:"s",q:"1937年7月7日，日本帝国主义制造卢沟桥事变（七七事变），其发动全面侵华战争的借口是",o:["一名士兵失踪","一名军官被杀","抢占铁路路权","驻军军饷被扣"],a:"A",x:"1937年7月7日夜，日军以一名士兵在演习中失踪为借口，要求进入宛平城搜查遭拒后炮轰宛平城，制造七七事变。",p:["七七事变"]},
{id:"c6q51",ch:6,t:"s",q:"1937年8月13日，日军大举进攻上海、淞沪会战爆发的标志性事件是",o:["八一三事变","九一八事变","一二八事变","七七事变"],a:"A",x:"1937年8月13日，日军进攻上海，八一三事变爆发，淞沪会战由此开始。",p:["正面战场"]},
{id:"c6q52",ch:6,t:"s",q:"全民族抗战开始后，南方八省红军和游击队改编为国民革命军新编第四军（新四军），其军长是",o:["叶挺","陈毅","项英","张云逸"],a:"A",x:"1937年10月，南方八省红军游击队改编为新四军，叶挺任军长，项英任副军长。",p:["抗日民族统一战线"]},
{id:"c6q53",ch:6,t:"s",q:"1937年9月22日，国民党中央通讯社公开发表、标志抗日民族统一战线正式形成的重要文件是",o:["《中共中央为公布国共合作宣言》","《双十协定》","《八一宣言》","《和平建国纲领》"],a:"A",x:"1937年9月22日国民党中央通讯社发表《中共中央为公布国共合作宣言》，次日蒋介石发表谈话承认中共合法地位，抗日民族统一战线正式形成。",p:["抗日民族统一战线"]},
{id:"c6q54",ch:6,t:"s",q:"1938年3月，指挥中国军队取得台儿庄大捷的第五战区司令长官是",o:["李宗仁","冯玉祥","白崇禧","张自忠"],a:"A",x:"1938年3月，第五战区司令长官李宗仁指挥中国军队在台儿庄歼灭日军一万余人，取得正面战场一次重大胜利。",p:["正面战场"]},
{id:"c6q55",ch:6,t:"s",q:"淞沪会战的重要历史意义在于",o:["粉碎了日军「三个月灭亡中国」的狂妄计划","打破了日军不可战胜的神话","标志着抗日战争进入相持阶段","取得了全民族抗战以来的首次大捷"],a:"A",x:"淞沪会战历时三个月，中国军队英勇抗击，粉碎了日军速战速决、「三个月灭亡中国」的狂妄计划。",p:["正面战场"]},
{id:"c6q56",ch:6,t:"s",q:"1937年10月，在忻口会战中壮烈殉国的国民党第九军军长是",o:["郝梦龄","佟麟阁","赵登禹","张自忠"],a:"A",x:"1937年10月忻口会战中，国民党第九军军长郝梦龄亲临前线指挥，壮烈殉国。",p:["正面战场"]},
{id:"c6q57",ch:6,t:"s",q:"1940年5月，在枣宜会战中壮烈殉国的国民党第三十三集团军总司令是",o:["张自忠","李宗仁","孙连仲","卫立煌"],a:"A",x:"1940年5月枣宜会战中，国民党第三十三集团军总司令张自忠率部英勇作战，壮烈殉国。",p:["正面战场"]},
{id:"c6q58",ch:6,t:"s",q:"1941年12月至1942年1月，国民党正面战场取得大捷、成为太平洋战争爆发后盟军首次胜利的会战是",o:["第三次长沙会战","豫湘桂战役","武汉会战","徐州会战"],a:"A",x:"1941年12月至1942年1月，中国军队取得第三次长沙会战大捷，是太平洋战争爆发后盟军方面取得的首次胜利。",p:["正面战场"]},
{id:"c6q59",ch:6,t:"s",q:"1937年8月，中共中央洛川会议确定红军的战略方针和作战原则是",o:["独立自主的山地游击战争","以运动战为主","以阵地战为主","全面战略进攻"],a:"A",x:"洛川会议确定红军实行独立自主的山地游击战的战略方针，配合正面战场作战。",p:["全面抗战路线"]},
{id:"c6q60",ch:6,t:"s",q:"抗日战争中，国民党片面抗战路线的实质是",o:["单纯依靠政府和军队抗战，不发动和依靠人民群众","只打防御战不打进攻战","放弃正面战场","与日本妥协投降"],a:"A",x:"国民党片面抗战路线坚持单纯依靠政府和军队抗战，不敢放手发动和武装广大人民群众。",p:["全面抗战路线"]},
{id:"c6q61",ch:6,t:"s",q:"全民族抗战开始后，中国共产党开辟的第一个敌后抗日根据地是",o:["晋察冀抗日根据地","晋冀鲁豫抗日根据地","陕甘宁抗日根据地","山东抗日根据地"],a:"A",x:"1937年11月太原失守后，聂荣臻率部创建晋察冀抗日根据地，这是敌后第一个抗日根据地。",p:["敌后战场"]},
{id:"c6q62",ch:6,t:"s",q:"1940年8月至12月，百团大战打击日军的主要目标是",o:["破坏日军交通线、摧毁敌据点","夺取日军占领的大城市","全歼日军一个师团","攻占日军机场"],a:"A",x:"百团大战以破袭日军交通线、摧毁敌伪据点为主要目标，是八路军在华北发动的规模最大的进攻战役。",p:["敌后战场"]},
{id:"c6q63",ch:6,t:"s",q:"抗日战争进入相持阶段后，中国共产党在陕甘宁边区开展大生产运动，提出的口号是",o:["自己动手，丰衣足食","增产节约，支援前线","以粮为纲，全面发展","精兵简政，厉行节约"],a:"A",x:"1941年后，中共领导陕甘宁边区开展大生产运动，提出「自己动手，丰衣足食」的口号，克服了严重的经济困难。",p:["敌后战场"]},
{id:"c6q64",ch:6,t:"s",q:"延安整风运动实行「惩前毖后，治病救人」的方针，其基本方法是",o:["批评和自我批评","坦白从宽","残酷斗争","整人过关"],a:"A",x:"延安整风运动采取「惩前毖后，治病救人」的方针，运用批评和自我批评的方法，反对主观主义、宗派主义和党八股。",p:["延安整风"]},
{id:"c6q65",ch:6,t:"s",q:"1942年5月，毛泽东在延安文艺座谈会上发表讲话，提出的文艺工作方向是",o:["为人民大众、首先为工农兵服务","为国民党政府服务","为个人名利服务","为复古传统服务"],a:"A",x:"毛泽东《在延安文艺座谈会上的讲话》明确文艺为人民大众、首先为工农兵服务的方向。",p:["敌后战场"]},
{id:"c6q66",ch:6,t:"s",q:"1945年4月至6月，中国共产党第七次全国代表大会召开的地点是",o:["延安","西安","重庆","北平"],a:"A",x:"1945年4月至6月，中共七大在延安召开，确立毛泽东思想为党的指导思想并写入党章。",p:["中共七大"]},
{id:"c6q67",ch:6,t:"s",q:"中共七大确定的政治路线是",o:["放手发动群众，壮大人民力量，在党的领导下，打败日本侵略者，解放全国人民，建立一个新民主主义的中国","以乡村为中心，武装夺取政权","争取和平民主，反对独裁内战","向北发展，向南防御"],a:"A",x:"中共七大确定了「放手发动群众，壮大人民力量，在党的领导下，打败日本侵略者，解放全国人民，建立一个新民主主义的中国」的政治路线。",p:["中共七大"]},
{id:"c6q68",ch:6,t:"s",q:"1938年9月至11月，中共扩大的六届六中全会上首次明确提出「马克思主义中国化」命题的是",o:["毛泽东","王明","张闻天","博古"],a:"A",x:"1938年中共六届六中全会上，毛泽东提出「马克思主义中国化」的命题，强调把马克思主义基本原理与中国革命实际相结合。",p:["全面抗战路线"]},
{id:"c6q69",ch:6,t:"s",q:"皖南事变后，中共中央于1941年1月发布命令重建新四军军部，代军长是",o:["陈毅","叶挺","粟裕","谭震林"],a:"A",x:"皖南事变后，中共中央重建新四军军部，任命陈毅为代军长，刘少奇为政治委员，坚持华中敌后抗战。",p:["抗日民族统一战线"]},
{id:"c6q70",ch:6,t:"s",q:"日本侵略者在中国沦陷区实行「以战养战」方针，其含义是",o:["利用占领区的人力物力财力支持其侵略战争","扶植傀儡政权分化抗日力量","推行奴化教育麻痹中国人民","实行烧光杀光抢光政策"],a:"A",x:"「以战养战」即日本侵略者利用占领区的资源、人力来支撑其侵略战争，是其在沦陷区的重要殖民统治方针。",p:["日本暴行"]},
{id:"c6q71",ch:6,t:"s",q:"1940年3月，在日本帝国主义扶植下成立于南京的汉奸政权是",o:["汪精卫伪国民政府","伪「满洲国」","冀东防共自治政府","伪「中华民国维新政府」"],a:"A",x:"1940年3月，汪精卫在南京成立伪国民政府，充当日本帝国主义统治中国的工具。",p:["日本暴行"]},
{id:"c6q72",ch:6,t:"s",q:"1942年，为配合盟军作战、保卫滇缅公路而开赴缅甸作战的中国军队是",o:["中国远征军","中国青年军","中国驻印军","国民革命军第十八集团军"],a:"A",x:"1942年，中国远征军入缅作战，在滇缅战场英勇抗击日军，为世界反法西斯战争作出重要贡献。",p:["世界反法西斯战争"]},
{id:"c6q73",ch:6,t:"s",q:"1943年11月，中美英三国首脑举行、并发表《开罗宣言》的会议是",o:["开罗会议","德黑兰会议","雅尔塔会议","波茨坦会议"],a:"A",x:"1943年11月开罗会议发表《开罗宣言》，规定日本窃取的中国领土（如东北、台湾、澎湖列岛）必须归还中国。",p:["世界反法西斯战争"]},
{id:"c6q74",ch:6,t:"s",q:"1945年7月，中美英三国发表、促令日本无条件投降的文件是",o:["《波茨坦公告》","《开罗宣言》","《雅尔塔协定》","《联合国家宣言》"],a:"A",x:"1945年7月26日，中美英三国发表《波茨坦公告》，敦促日本无条件投降，苏联后来也加入。",p:["抗战胜利"]},
{id:"c6q75",ch:6,t:"s",q:"1945年8月8日对日宣战、并出兵中国东北的国家是",o:["苏联","美国","英国","法国"],a:"A",x:"1945年8月8日苏联对日宣战并出兵中国东北，8月9日毛泽东发表《对日寇的最后一战》，抗日战争进入战略反攻阶段。",p:["抗战胜利"]},
{id:"c6q76",ch:6,t:"s",q:"1945年9月2日，日本在投降书上签字，标志着",o:["中国抗日战争胜利结束","抗日民族统一战线正式形成","中国人民局部抗战开始","第二次世界大战爆发"],a:"A",x:"1945年9月2日，日本正式签署投降书，中国抗日战争胜利结束，世界反法西斯战争也胜利结束。",p:["抗战胜利"]},
{id:"c6q77",ch:6,t:"s",q:"1945年10月25日，中国战区台湾省受降典礼举行，台湾重归中国版图，这一天后来被定为",o:["台湾光复节","抗日战争胜利纪念日","国庆节","七七事变纪念日"],a:"A",x:"1945年10月25日，中国战区台湾省受降典礼在台北举行，台湾重归中国版图，这一天后定为「台湾光复节」。",p:["抗战胜利"]},
{id:"c6q78",ch:6,t:"s",q:"中国战场在世界反法西斯战争中的地位是",o:["东方主战场","次要战场","后方基地","中立战场"],a:"A",x:"中国战场是世界反法西斯战争的东方主战场，牵制了日本陆军主力，为世界反法西斯战争作出重大贡献。",p:["抗战胜利"]},
{id:"c6q79",ch:6,t:"s",q:"全国人大常委会以立法形式确定的中国人民抗日战争胜利纪念日是",o:["9月3日","8月15日","9月2日","7月7日"],a:"A",x:"9月3日是中国人民抗日战争胜利纪念日，以纪念1945年9月2日日本签署投降书、抗战胜利。",p:["抗战胜利"]},
{id:"c6q80",ch:6,t:"s",q:"中国人民抗日战争胜利的决定性因素和重要法宝是",o:["抗日民族统一战线的建立与巩固","国际物资援助","国民党军队的正面作战","美国投掷原子弹"],a:"A",x:"以国共合作为基础的抗日民族统一战线的建立、巩固和发展，是中国人民抗日战争胜利的重要法宝。",p:["中共中流砥柱"]},
{id:"c6q81",ch:6,t:"s",q:"抗日战争时期，中国共产党在抗日根据地实行的土地政策是",o:["减租减息","没收地主土地分给农民","土地国有化","平均地权"],a:"A",x:"抗战时期，为团结各阶层一致抗日，中共在根据地实行减租减息政策，兼顾农民和地主利益。",p:["敌后战场"]},
{id:"c6q82",ch:6,t:"s",q:"1942年5月，在反「扫荡」作战中壮烈牺牲的八路军副参谋长是",o:["左权","彭雪枫","关向应","罗炳辉"],a:"A",x:"1942年5月，八路军副参谋长左权在山西辽县（今左权县）反「扫荡」作战中壮烈牺牲。",p:["敌后战场"]},
{id:"c6q83",ch:6,t:"s",q:"九一八事变后，中共中央随即发表、号召全国人民奋起抗日的宣言是",o:["《中国共产党为日本帝国主义强暴占领东三省事件宣言》","《八一宣言》","《为抗日救国告全体同胞书》","《抗日救国十大纲领》"],a:"A",x:"九一八事变后第三天，中共中央发表《中国共产党为日本帝国主义强暴占领东三省事件宣言》，号召民众奋起抗日。",p:["九一八事变"]},
{id:"c6q84",ch:6,t:"s",q:"1938年7月，为团结各党派共同抗日，国民党政府决定成立的咨询机关是",o:["国民参政会","国民大会","政协会议","国是会议"],a:"A",x:"1938年7月国民参政会成立，作为各党派团结抗日的咨询机关，中共参政员出席参加。",p:["抗日民族统一战线"]},
{id:"c6q85",ch:6,t:"s",q:"1944年，日军为打通大陆交通线而发动、国民党正面战场遭遇大溃败的战役是",o:["豫湘桂战役","豫东战役","湘西会战","桂南会战"],a:"A",x:"1944年日军发动豫湘桂战役，国民党军队大溃败，丢失大片国土，暴露了其统治的腐败无能。",p:["正面战场"]},
{id:"c6q86",ch:6,t:"s",q:"下列口号中，不属于一二九运动提出的是",o:["和平、民主、团结","反对华北自治","打倒日本帝国主义","停止内战，一致对外"],a:"A",x:"「和平、民主、团结」是1945年抗战胜利后中共中央提出的口号，不属于一二九运动；一二九运动提出「反对华北自治」「打倒日本帝国主义」「停止内战，一致对外」等口号。",p:["局部抗战"]},
{id:"c6q87",ch:6,t:"s",q:"抗日战争时期，中国共产党在抗日民主政权建设中实行的「三三制」原则是指",o:["共产党员、非党左派进步分子、中间分子各占三分之一","共产党员占三分之二，其余占三分之一","三个党派轮流执政","党政军各占三分之一"],a:"A",x:"「三三制」即政权人员中共产党员、非党左派进步分子、中间分子（含开明绅士等）大体各占三分之一。",p:["敌后战场"]},
{id:"c6q88",ch:6,t:"s",q:"1937年9月，指挥八路军第一一五师取得平型关大捷的将领是",o:["林彪","彭德怀","朱德","刘伯承"],a:"A",x:"1937年9月，林彪指挥八路军第一一五师取得平型关大捷，打破了「日军不可战胜」的神话。",p:["敌后战场"]},
{id:"c6q89",ch:6,t:"s",q:"东北抗日联军主要创建人之一、1942年2月壮烈牺牲的著名将领是",o:["赵尚志","赵一曼","马本斋","周保中"],a:"A",x:"赵尚志是东北抗日联军主要创建人之一，1942年2月在战斗中受伤被俘，英勇就义。",p:["局部抗战"]},
{id:"c6q90",ch:6,t:"s",q:"1939年7月，针对国民党顽固派制造反共摩擦，中国共产党提出的三大政治口号是",o:["坚持抗战、反对投降；坚持团结、反对分裂；坚持进步、反对倒退","坚持抗战、反对内战；坚持团结、反对分裂；坚持进步、反对倒退","坚持抗战、反对投降；坚持合作、反对摩擦；坚持进步、反对倒退","坚持持久战、反对速决战；坚持团结、反对分裂；坚持进步、反对倒退"],a:"A",x:"1939年7月，中共提出「坚持抗战、反对投降；坚持团结、反对分裂；坚持进步、反对倒退」三大政治口号。",p:["抗日民族统一战线"]},
{id:"c6q91",ch:6,t:"j",fs:6,q:"简述九一八事变后，中国人民局部抗战的主要表现。",
 kw:["东北抗日义勇军","东北抗日联军","局部抗战"],
 ref:"九一八事变后，中国人民的局部抗战逐步展开：①东北人民和部分爱国军队组织东北抗日义勇军，开展抗日武装斗争；②中国共产党领导东北人民建立抗日武装，1936年2月统一改编为东北抗日联军，坚持艰苦的抗日游击战争；③国民党爱国将领也在全国抗日救亡运动的推动下奋起抵抗，如十九路军进行一·二八淞沪抗战、冯玉祥等组织察哈尔抗日同盟军等。这些斗争共同构成中国人民的局部抗战。",p:["局部抗战"]},
{id:"c6q92",ch:6,t:"j",fs:6,q:"简述西安事变及其和平解决的历史意义。",
 kw:["张学良","杨虎城","十年内战","初步形成"],
 ref:"1936年12月12日，国民党爱国将领张学良、杨虎城在西安扣留蒋介石，发动西安事变，逼蒋抗日。中国共产党从民族大义出发，主张和平解决，派周恩来等赴西安调停。西安事变的和平解决，成为时局转换的枢纽，标志着十年内战的基本结束和抗日民族统一战线的初步形成。",p:["西安事变"]},
{id:"c6q93",ch:6,t:"j",fs:6,q:"简述抗日民族统一战线正式形成的标志。",
 kw:["国共合作宣言","蒋介石","合法地位"],
 ref:"1937年9月22日，国民党中央通讯社发表《中共中央为公布国共合作宣言》；9月23日，蒋介石发表谈话，实际上承认了中国共产党的合法地位。国共合作宣言的发表和蒋介石承认中共合法地位，标志着以国共两党合作为基础的抗日民族统一战线正式形成。",p:["抗日民族统一战线"]},
{id:"c6q94",ch:6,t:"j",fs:6,q:"简述抗日战争战略防御阶段国民党正面战场的抗战情况。",
 kw:["淞沪会战","台儿庄","武汉会战"],
 ref:"战略防御阶段（1937年7月至1938年10月），国民党正面战场是比较积极的战场：①先后进行了淞沪会战、太原会战、徐州会战、武汉会战等大规模战役；②1938年3月取得台儿庄大捷；③淞沪会战粉碎了日军「三个月灭亡中国」的狂妄计划；④1938年10月广州、武汉失守，抗日战争进入战略相持阶段。",p:["正面战场"]},
{id:"c6q95",ch:6,t:"j",fs:6,q:"简述中共七大的主要内容和历史意义。",
 kw:["毛泽东思想","政治路线","团结"],
 ref:"1945年4月至6月，中共七大在延安召开。主要内容：①确定党的政治路线，即放手发动群众，壮大人民力量，在党的领导下，打败日本侵略者，解放全国人民，建立一个新民主主义的中国；②把毛泽东思想确立为党的指导思想并写入党章。历史意义：使全党在马克思列宁主义、毛泽东思想的基础上达到了空前的团结，为夺取抗日战争的最后胜利和新民主主义革命在全国的胜利奠定了基础。",p:["中共七大"]},
{id:"c6q96",ch:6,t:"j",fs:6,q:"简述中国人民抗日战争在世界反法西斯战争中的地位与作用。",
 kw:["东方主战场","牵制","贡献"],
 ref:"中国抗日战争是世界反法西斯战争的重要组成部分，中国战场是世界反法西斯战争的东方主战场：①中国战场牵制了日本陆军的主力，使其无法集中兵力于太平洋战场，有力地支援了盟军作战；②中国战场开辟时间最早、持续时间最长，中国人民的持久抗战为世界反法西斯战争的胜利作出了重大贡献；③中国积极参与国际反法西斯联合行动，成为联合国创始会员国之一，国际地位明显提高。",p:["抗战胜利"]},
{id:"c6q97",ch:6,t:"l",fs:10,q:"试述抗日民族统一战线形成的过程。",
 kw:["八一宣言","瓦窑堡","西安事变","国共合作宣言"],
 ref:"抗日民族统一战线的形成经历了一个过程：①九一八事变后，中国共产党率先举起抗日旗帜，号召全民族抗战；②1935年8月1日，中共发表《八一宣言》，呼吁停止内战、一致抗日；③1935年12月，瓦窑堡会议确定建立抗日民族统一战线的策略方针；④1936年12月，西安事变和平解决，十年内战基本结束，抗日民族统一战线初步形成；⑤1937年七七事变爆发后，国共两党迅速实现第二次合作，红军改编为八路军、新四军；⑥1937年9月22日，国民党中央通讯社发表《中共中央为公布国共合作宣言》，9月23日蒋介石发表谈话承认中共合法地位，抗日民族统一战线正式形成。",p:["抗日民族统一战线"]},
{id:"c6q98",ch:6,t:"l",fs:10,q:"试述毛泽东《论持久战》的主要内容和历史意义。",
 kw:["亡国论","速胜论","三个阶段","持久战"],
 ref:"1938年5月，毛泽东发表《论持久战》。主要内容：①批驳了「亡国论」和「速胜论」两种错误论调；②指出抗日战争是持久战，最后胜利属于中国；③科学预见抗日战争将经过战略防御、战略相持、战略反攻三个阶段，其中战略相持阶段是关键；④提出兵民是胜利之本，动员和依靠人民群众进行全面抗战。历史意义：《论持久战》科学地论证了抗日战争的发展规律，指明了争取抗战胜利的正确道路，坚定了中国人民抗战必胜的信心。",p:["《论持久战》"]},
{id:"c6q99",ch:6,t:"l",fs:10,q:"试述中国人民抗日战争胜利的原因。",
 kw:["抗日民族统一战线","全面抗战","中流砥柱","国际"],
 ref:"中国人民抗日战争胜利的原因主要有：①以国共合作为基础的抗日民族统一战线的建立、巩固和发展，是抗战胜利的重要法宝；②中国共产党坚持全面抗战路线，开辟敌后战场，成为抗日战争的中流砥柱；③国民党正面战场的广大爱国将士英勇作战，作出了重要贡献；④中国人民和世界反法西斯力量相互支援，国际反法西斯战争的胜利为抗战胜利创造了有利条件。",p:["抗战胜利"]},
{id:"c6q100",ch:6,t:"l",fs:10,q:"试述中国抗日战争胜利的伟大历史意义。",
 kw:["第一次","完全胜利","伟大复兴","东方主战场"],
 ref:"中国人民抗日战争胜利的伟大历史意义：①抗日战争是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放战争，粉碎了日本帝国主义殖民奴役中国的图谋；②促进了中华民族的觉醒，成为中华民族走向伟大复兴的历史转折点；③中国战场是世界反法西斯战争的东方主战场，中国人民的抗战为世界反法西斯战争胜利作出了重大贡献；④抗战胜利重新确立了中国在世界上的大国地位，中国成为联合国创始会员国和安理会常任理事国之一。",p:["抗战胜利"]},

/* ================= 第七章 ================= */
{id:"c7q28",ch:7,t:"s",q:"重庆谈判期间，国共双方斗争的焦点是",o:["解放区政权和人民军队问题","是否承认三民主义","国民大会代表名额","中共是否放弃武装"],a:"A",x:"重庆谈判中，斗争的焦点集中在解放区政权和人民军队问题上，两党未能达成协议。",p:["重庆谈判"]},
{id:"c7q29",ch:7,t:"s",q:"1945年9月，为应对国民党军进攻、争取东北，中共中央确定的战略方针是",o:["向北发展，向南防御","向南发展，向北防御","向东发展，向西防御","以城市为中心"],a:"A",x:"1945年9月19日，中共中央确定「向北发展，向南防御」的战略方针，抢占东北这一战略要地。",p:["重庆谈判"]},
{id:"c7q30",ch:7,t:"s",q:"1946年1月10日，国共双方正式签订的文件是",o:["《停战协定》","《双十协定》","《和平建国纲领》","《国共合作宣言》"],a:"A",x:"1946年1月10日，国共双方签订《停战协定》（停战令），规定双方军队停止一切战斗行动。",p:["重庆谈判"]},
{id:"c7q31",ch:7,t:"s",q:"1946年1月，政治协商会议（旧政协）通过、有利于人民民主的纲领性文件是",o:["《和平建国纲领》","《中华民国宪法》","《共同纲领》","《中国土地法大纲》"],a:"A",x:"旧政协通过了《和平建国纲领》等五项协议，确认和平建国方针，有利于人民民主，但很快被国民党撕毁。",p:["重庆谈判"]},
{id:"c7q32",ch:7,t:"s",q:"抗战胜利后，国民党坚持的建国方针是",o:["维持大地主大资产阶级专政，坚持独裁内战","建立新民主主义国家","实行多党制议会民主","建立资产阶级共和国"],a:"A",x:"抗战胜利后，国民党统治集团坚持大地主大资产阶级专政，准备发动内战，坚持独裁统治。",p:["全面内战"]},
{id:"c7q33",ch:7,t:"s",q:"1945年9月至10月，晋冀鲁豫野战军在山西进行的、粉碎国民党军进攻解放区的战役是",o:["上党战役","邯郸战役","定陶战役","鲁南战役"],a:"A",x:"1945年9月至10月，刘伯承、邓小平指挥晋冀鲁豫野战军进行上党战役，粉碎了国民党军对解放区的进攻。",p:["全面内战"]},
{id:"c7q34",ch:7,t:"s",q:"1946年1月，国民党特务捣毁政协会议陪都各界协进会演讲会场，制造的事件是",o:["沧白堂事件","校场口惨案","下关惨案","五二零惨案"],a:"A",x:"1946年1月，国民党特务捣毁政协会议陪都各界协进会演讲会场，制造沧白堂事件。",p:["第二条战线"]},
{id:"c7q35",ch:7,t:"s",q:"1946年6月底，率部胜利进行中原突围、揭开解放战争序幕的将领是",o:["李先念","刘伯承","陈毅","粟裕"],a:"A",x:"1946年6月底，李先念等率中原军区部队突围，胜利完成战略转移，中原突围揭开了解放战争的序幕。",p:["全面内战"]},
{id:"c7q36",ch:7,t:"s",q:"全面内战爆发初期，中国共产党制定的军事方针是",o:["以自卫战争粉碎国民党军的军事进攻","主动放弃所有城市","与国民党谈判停战","集中兵力与敌决战"],a:"A",x:"全面内战爆发后，中共提出以自卫战争粉碎国民党军事进攻的方针，坚持集中优势兵力、各个歼灭敌人。",p:["全面内战"]},
{id:"c7q37",ch:7,t:"s",q:"1946年8月，毛泽东在同美国记者谈话中提出的著名论断是",o:["一切反动派都是纸老虎","枪杆子里面出政权","兵民是胜利之本","政策和策略是党的生命"],a:"A",x:"1946年8月，毛泽东同美国记者安娜·路易斯·斯特朗谈话，提出「一切反动派都是纸老虎」的著名论断。",p:["全面内战"]},
{id:"c7q38",ch:7,t:"s",q:"1946年11月，国民党违反政协决议单方面召开、并制定《中华民国宪法》的会议是",o:["国民大会","国民参政会","政协会议","国是会议"],a:"A",x:"1946年11月，国民党单方面召开国民大会（制宪国大），通过《中华民国宪法》，中共与民主党派均拒绝参加。",p:["第二条战线"]},
{id:"c7q39",ch:7,t:"s",q:"到1947年2月，人民解放军经过八个月作战，基本粉碎了国民党军队的",o:["全面进攻","重点进攻","战略进攻","战略决战"],a:"A",x:"至1947年2月，人民解放军基本粉碎了国民党军的全面进攻，国民党被迫改为对陕北和山东的重点进攻。",p:["全面内战"]},
{id:"c7q40",ch:7,t:"s",q:"1947年3月，中共中央为诱敌深入、以运动战歼敌，主动撤离延安后转战",o:["陕北","晋察冀","山东","中原"],a:"A",x:"1947年3月国民党军重点进攻陕北，中共中央主动撤离延安，转战陕北，指挥全国解放战争。",p:["全面内战"]},
{id:"c7q41",ch:7,t:"s",q:"1947年5月，华东野战军在孟良崮战役中全歼的国民党精锐部队是",o:["整编第七十四师","新编第五军","整编第十一师","第五军"],a:"A",x:"1947年5月，华东野战军在孟良崮战役中全歼国民党王牌军整编第七十四师，粉碎其对山东的重点进攻。",p:["全面内战"]},
{id:"c7q42",ch:7,t:"s",q:"1947年3月至5月，西北野战军在青化砭、羊马河、蟠龙取得三战三捷，其指挥员是",o:["彭德怀","贺龙","王震","刘伯承"],a:"A",x:"西北野战军在彭德怀等指挥下，取得青化砭、羊马河、蟠龙三战三捷，稳定了陕北战局。",p:["全面内战"]},
{id:"c7q43",ch:7,t:"s",q:"1947年3月，国民党集中兵力重点进攻的方向是",o:["陕北和山东","东北和华北","中原和华东","晋冀鲁豫"],a:"A",x:"1947年3月，国民党集中兵力重点进攻陕甘宁边区（陕北）和山东解放区。",p:["全面内战"]},
{id:"c7q44",ch:7,t:"s",q:"1945年12月1日，昆明国民党当局镇压学生反内战运动，制造了",o:["一二一惨案","五二零惨案","下关惨案","校场口惨案"],a:"A",x:"1945年12月1日，昆明学生举行反内战运动，遭国民党当局镇压，酿成「一二·一」惨案。",p:["第二条战线"]},
{id:"c7q45",ch:7,t:"s",q:"1946年6月，上海人民团体代表赴南京请愿，在下关车站遭国民党特务殴打，制造了",o:["下关惨案","校场口惨案","沧白堂事件","五二零惨案"],a:"A",x:"1946年6月23日，上海人民团体联合会请愿团在南京下关车站遭特务殴打，马叙伦等受伤，史称下关惨案。",p:["第二条战线"]},
{id:"c7q46",ch:7,t:"s",q:"1946年12月底，北平学生抗议美军士兵强奸中国女大学生暴行、进而席卷全国的运动史称",o:["抗暴运动","五四运动","一二九运动","五二零运动"],a:"A",x:"1946年12月底，北平学生举行抗议美军暴行的示威游行，运动迅速扩展到全国，史称抗暴运动。",p:["第二条战线"]},
{id:"c7q47",ch:7,t:"s",q:"1947年2月28日，台湾人民反抗国民党反动统治的武装起义是",o:["二二八起义","二七惨案","五卅运动","一二一运动"],a:"A",x:"1947年2月28日，台湾人民发动二二八起义，反抗国民党的反动统治，起义虽遭镇压但意义深远。",p:["第二条战线"]},
{id:"c7q48",ch:7,t:"s",q:"解放战争时期，国统区经济危机最突出的表现是",o:["恶性通货膨胀、物价飞涨","工厂大量倒闭","工人大量失业","农村经济破产"],a:"A",x:"国统区经济危机的突出表现是财政赤字巨大、恶性通货膨胀、物价飞涨，法币急剧贬值。",p:["第二条战线"]},
{id:"c7q49",ch:7,t:"s",q:"解放战争时期，国统区第二条战线的主体是",o:["以学生运动为先导的人民民主运动","工人武装起义","国民党军队起义","农民暴动"],a:"A",x:"国统区以学生运动为先导、各阶层广泛参加的人民民主运动，形成了反对国民党统治的第二条战线。",p:["第二条战线"]},
{id:"c7q50",ch:7,t:"s",q:"第二条战线的重要作用在于",o:["使国民党反动派陷入全民包围之中","直接推翻了国民党统治","为解放战争提供了主要兵源","建立了人民政权"],a:"A",x:"第二条战线与军事战线相配合，使国民党反动派陷于全民包围之中，加速了其统治的崩溃。",p:["第二条战线"]},
{id:"c7q51",ch:7,t:"s",q:"1946年5月4日，中共中央发出《关于清算、减租及土地问题的指示》，这一文件通常被称为",o:["《五四指示》","《五一指示》","《土地法大纲》","《减租减息条例》"],a:"A",x:"1946年5月4日中共中央发出《关于清算、减租及土地问题的指示》（即《五四指示》），将减租减息政策改变为没收地主土地分配给农民。",p:["土地改革"]},
{id:"c7q52",ch:7,t:"s",q:"1947年7月至9月，中国共产党召开全国土地会议、制定《中国土地法大纲》的地点是",o:["西柏坡","延安","杨家岭","洛川"],a:"A",x:"1947年7月至9月，中共中央工作委员会在西柏坡召开全国土地会议，制定了《中国土地法大纲》。",p:["土地改革"]},
{id:"c7q53",ch:7,t:"s",q:"中国共产党在新民主主义革命时期土地改革的总路线和总政策是",o:["依靠贫农，团结中农，有步骤地、有分别地消灭封建剥削制度，发展农业生产","减租减息，发展生产","没收一切土地归国有","平均地权，节制资本"],a:"A",x:"1948年毛泽东完整提出土地改革总路线：依靠贫农，团结中农，有步骤地、有分别地消灭封建剥削制度，发展农业生产。",p:["土地改革"]},
{id:"c7q54",ch:7,t:"s",q:"解放区土地改革的意义在于",o:["为解放战争的胜利奠定了群众基础","使解放区人口迅速增加","实现了国家工业化","消灭了资本主义剥削"],a:"A",x:"土地改革使亿万农民在政治上、经济上获得解放，翻身农民踊跃参军支前，为解放战争胜利奠定了深厚的群众基础。",p:["土地改革"]},
{id:"c7q55",ch:7,t:"s",q:"1947年颁布的《中国土地法大纲》规定的土地分配办法是",o:["按乡村全部人口平均分配土地","按劳分配土地","只分给贫雇农土地","保留地主大量土地"],a:"A",x:"《中国土地法大纲》规定废除封建性及半封建性剥削的土地制度，按乡村全部人口平均分配土地，实行耕者有其田。",p:["土地改革"]},
{id:"c7q56",ch:7,t:"s",q:"1947年6月起，人民解放军三路大军挺进中原，其中陈赓、谢富治兵团和陈毅、粟裕大军分别挺进",o:["豫西和豫皖苏","陕北和山东","东北和华北","江南和华南"],a:"A",x:"1947年6月至9月，刘邓大军挺进大别山，陈谢兵团挺进豫西，陈粟大军挺进豫皖苏，三路大军成品字形展开，揭开战略进攻序幕。",p:["战略进攻"]},
{id:"c7q57",ch:7,t:"s",q:"1948年9月，华东野战军攻克济南、为战略决战创造条件的战役是",o:["济南战役","开封战役","洛阳战役","郑州战役"],a:"A",x:"1948年9月济南战役的胜利，切断了国民党军南北联系，为战略决战创造了条件。",p:["三大战役"]},
{id:"c7q58",ch:7,t:"s",q:"1948年9月至11月的辽沈战役，共歼灭国民党军",o:["47万余人","55万余人","52万余人","154万余人"],a:"A",x:"辽沈战役歼敌47万余人，解放东北全境，使人民解放军在数量上第一次超过国民党军队。",p:["三大战役"]},
{id:"c7q59",ch:7,t:"s",q:"1948年11月至1949年1月的淮海战役，其中心地区是",o:["徐州","锦州","天津","长春"],a:"A",x:"淮海战役在以徐州为中心的广大地区进行，是三大战役中歼敌数量最多（55万余人）的战役。",p:["三大战役"]},
{id:"c7q60",ch:7,t:"s",q:"淮海战役期间，中共中央决定成立的总前委书记是",o:["邓小平","刘伯承","陈毅","粟裕"],a:"A",x:"淮海战役总前委由刘伯承、陈毅、邓小平、粟裕、谭震林组成，邓小平任书记。",p:["三大战役"]},
{id:"c7q61",ch:7,t:"s",q:"平津战役从1948年11月进行至1949年1月，北平和平解放的时间是",o:["1949年1月31日","1949年1月21日","1949年2月15日","1949年3月1日"],a:"A",x:"1949年1月31日，北平和平解放，平津战役结束，三大战役至此胜利完成。",p:["三大战役"]},
{id:"c7q62",ch:7,t:"s",q:"辽沈、淮海、平津三大战役共歼灭国民党军",o:["154万余人","100万余人","200万余人","47万余人"],a:"A",x:"三大战役历时四个月零十九天，共歼灭国民党军154万余人，基本上消灭了国民党军队的主力。",p:["三大战役"]},
{id:"c7q63",ch:7,t:"s",q:"1949年4月，发起渡江战役的人民解放军部队主要是",o:["第二、第三野战军","第一、第四野战军","华北野战军","中原野战军"],a:"A",x:"1949年4月21日，人民解放军第二、第三野战军在西起湖口、东至江阴的千里战线上发起渡江战役。",p:["渡江战役"]},
{id:"c7q64",ch:7,t:"s",q:"渡江战役后，1949年5月27日人民解放军解放的全国最大城市是",o:["上海","南京","武汉","广州"],a:"A",x:"1949年5月27日，人民解放军解放上海，对稳定全国经济大局具有重大意义。",p:["渡江战役"]},
{id:"c7q65",ch:7,t:"s",q:"中共七届二中全会召开的时间是",o:["1949年3月","1948年9月","1949年6月","1949年9月"],a:"A",x:"1949年3月，中共七届二中全会在河北平山西柏坡召开，为夺取全国胜利和建设新中国作了准备。",p:["七届二中全会"]},
{id:"c7q66",ch:7,t:"s",q:"中共七届二中全会提出，党的工作重心由乡村转移到",o:["城市","工厂","农村基层","大后方"],a:"A",x:"七届二中全会指出党的工作重心由乡村转移到城市，开始由城市领导乡村的时期。",p:["七届二中全会"]},
{id:"c7q67",ch:7,t:"s",q:"1948年4月30日，中共中央发布、号召召开新政治协商会议成立民主联合政府的口号是",o:["五一口号","五四口号","八一宣言","七一宣言"],a:"A",x:"1948年4月30日中共中央发布「五一口号」，号召各民主党派、人民团体召开新政协、成立民主联合政府，得到各民主党派热烈响应。",p:["新政协"]},
{id:"c7q68",ch:7,t:"s",q:"毛泽东在《论人民民主专政》中指出，人民民主专政的基础（主要力量）是",o:["工人阶级、农民阶级和城市小资产阶级的联盟","民族资产阶级","开明绅士","知识分子"],a:"A",x:"《论人民民主专政》指出，人民民主专政的基础是工人阶级、农民阶级和城市小资产阶级的联盟，主要是工人和农民的联盟。",p:["人民民主专政"]},
{id:"c7q69",ch:7,t:"s",q:"1949年9月，中国人民政治协商会议第一届全体会议通过的《共同纲领》的历史地位是",o:["起临时宪法作用","正式宪法","党的纲领性文件","行政条例"],a:"A",x:"《共同纲领》确定了新中国国家政权性质和基本政策，起了临时宪法的作用，是全国人民共同遵守的大宪章。",p:["新政协"]},
{id:"c7q70",ch:7,t:"s",q:"《共同纲领》规定，中华人民共和国的国家性质（国体）是",o:["新民主主义即人民民主主义的国家","社会主义国家","资本主义国家","君主立宪国家"],a:"A",x:"《共同纲领》规定中华人民共和国为新民主主义即人民民主主义的国家，实行工人阶级领导的、以工农联盟为基础的、团结各民主阶级的人民民主专政。",p:["新政协"]},
{id:"c7q71",ch:7,t:"s",q:"1949年9月，中国人民政治协商会议第一届全体会议选举的中央人民政府主席是",o:["毛泽东","周恩来","朱德","刘少奇"],a:"A",x:"政协一届全体会议选举毛泽东为中央人民政府主席，朱德、刘少奇、宋庆龄等为副主席。",p:["新中国诞生"]},
{id:"c7q72",ch:7,t:"s",q:"1949年10月1日，中华人民共和国开国大典隆重举行的地点是",o:["北京天安门广场","南京总统府","上海外滩","延安杨家岭"],a:"A",x:"1949年10月1日，开国大典在北京天安门广场举行，毛泽东庄严宣告中华人民共和国中央人民政府成立。",p:["新中国诞生"]},
{id:"c7q73",ch:7,t:"s",q:"中华人民共和国成立的历史意义在于，它标志着",o:["中国新民主主义革命的基本胜利和民族独立、人民解放的基本实现","社会主义制度在中国建立","我国进入社会主义初级阶段","土地革命在全国完成"],a:"A",x:"新中国成立标志着中国新民主主义革命的基本胜利，实现了民族独立和人民解放，中国人民从此站起来了。",p:["革命胜利经验"]},
{id:"c7q74",ch:7,t:"s",q:"中国人民政治协商会议是",o:["中国人民民主统一战线的组织形式","中国最高权力机关","中国行政机关","中国司法机关"],a:"A",x:"人民政协是中国人民民主统一战线的组织形式，在新中国成立初期代行全国人民代表大会职权。",p:["新政协"]},
{id:"c7q75",ch:7,t:"s",q:"1949年1月22日，李济深、沈钧儒等民主党派负责人发表《对时局的意见》，其核心内容是",o:["拥护中国共产党的领导","主张走中间路线","要求恢复国共和谈","反对土地改革"],a:"A",x:"1949年1月，各民主党派和无党派人士发表《对时局的意见》，明确表示拥护中国共产党的领导，标志着各民主党派自觉接受中共领导。",p:["第三条道路"]},
{id:"c7q76",ch:7,t:"s",q:"中国共产党领导中国新民主主义革命的三大法宝是",o:["统一战线、武装斗争、党的建设","实事求是、群众路线、独立自主","党的领导、人民军队、土地革命","农村、农民、武装"],a:"A",x:"统一战线、武装斗争、党的建设是中国共产党在中国革命中战胜敌人的三大法宝。",p:["革命胜利经验"]},
{id:"c7q77",ch:7,t:"s",q:"中华人民共和国成立后，中国进入的社会形态是",o:["新民主主义社会","社会主义社会","资本主义社会","半殖民地半封建社会"],a:"A",x:"新中国成立后，中国进入新民主主义社会，并在此基础上逐步向社会主义社会过渡。",p:["新中国诞生"]},
{id:"c7q78",ch:7,t:"s",q:"1949年9月，中国人民政治协商会议第一届全体会议确定新中国的国旗是",o:["五星红旗","青天白日旗","十八星旗","五色旗"],a:"A",x:"政协一届全体会议确定五星红旗为中华人民共和国国旗，并以《义勇军进行曲》为代国歌。",p:["新政协"]},
{id:"c7q79",ch:7,t:"s",q:"《共同纲领》规定，中华人民共和国的政权机关实行",o:["民主集中制的人民代表大会制度","三权分立制度","议会制","君主立宪制"],a:"A",x:"《共同纲领》规定国家政权机关实行民主集中制的人民代表大会制度，各级人民代表大会由人民普选产生。",p:["新政协"]},
{id:"c7q80",ch:7,t:"s",q:"毛泽东在七届二中全会上提出「两个务必」的历史背景是",o:["党即将成为掌握全国政权的执政党","抗日战争即将胜利","大革命即将失败","长征即将开始"],a:"A",x:"在革命即将取得全国胜利、党即将成为执政党的背景下，毛泽东告诫全党务必保持谦虚谨慎、不骄不躁和艰苦奋斗的作风。",p:["七届二中全会"]},
{id:"c7q81",ch:7,t:"s",q:"1949年3月25日，中共中央机关由西柏坡迁往",o:["北平","南京","上海","西安"],a:"A",x:"1949年3月，中共中央由西柏坡迁往北平，毛泽东喻为「进京赶考」，迎接新中国的诞生。",p:["七届二中全会"]},
{id:"c7q82",ch:7,t:"j",fs:6,q:"简述重庆谈判的经过和意义。",
 kw:["双十协定","和平建国","军队"],
 ref:"1945年8月28日，毛泽东借周恩来、王若飞赴重庆与国民党谈判。经过43天谈判，10月10日双方签署《政府与中共代表会谈纪要》（即《双十协定》），确认和平建国的基本方针，同意召开政治协商会议，但在解放区政权和人民军队问题上未能达成协议。重庆谈判表明了中国共产党争取和平民主的诚意，使人民认清了国民党的真面目。",p:["重庆谈判"]},
{id:"c7q83",ch:7,t:"j",fs:6,q:"简述解放战争时期国统区第二条战线形成的原因和作用。",
 kw:["学生运动","人民民主运动","配合"],
 ref:"国民党坚持独裁内战，经济危机加剧，人民无法照旧生活下去，这是第二条战线形成的根本原因。国统区以学生运动为先导，包括工人运动、农民斗争及各阶层反内战反饥饿反迫害的斗争，形成人民民主运动。第二条战线与人民解放军军事战线相配合，使国民党反动派陷于全民包围之中，加速了国民党统治的崩溃。",p:["第二条战线"]},
{id:"c7q84",ch:7,t:"j",fs:6,q:"简述《中国土地法大纲》的主要内容。",
 kw:["废除","封建","平均分配","耕者有其田"],
 ref:"1947年9月《中国土地法大纲》规定：①废除封建性及半封建性剥削的土地制度，实行耕者有其田的土地制度；②乡村中一切地主的土地及公地，由乡村农会接收，连同乡村中其他一切土地，按乡村全部人口统一平均分配；③土地改革中必须依靠贫农，团结中农。该大纲推动了解放区土地改革运动深入开展。",p:["土地改革"]},
{id:"c7q85",ch:7,t:"j",fs:6,q:"简述三大战役的经过及其意义。",
 kw:["辽沈","淮海","平津","154"],
 ref:"1948年9月至1949年1月，人民解放军先后发动辽沈、淮海、平津三大战役：①辽沈战役（1948年9月至11月）解放东北全境；②淮海战役（1948年11月至1949年1月）以徐州为中心歼敌55万余人；③平津战役（1948年11月至1949年1月）和平解放北平。三大战役共歼灭国民党军154万余人，基本上消灭了国民党军队的主力，为解放全中国奠定了基础。",p:["三大战役"]},
{id:"c7q86",ch:7,t:"j",fs:6,q:"简述中国人民政治协商会议第一届全体会议的召开及主要成果。",
 kw:["共同纲领","临时宪法","国旗"],
 ref:"1949年9月21日，中国人民政治协商会议第一届全体会议在北平召开。会议通过了《中国人民政治协商会议共同纲领》（即《共同纲领》），它起了临时宪法的作用；选举毛泽东为中央人民政府主席；确定五星红旗为国旗，以《义勇军进行曲》为代国歌，决定北平改名北京并定为首都。会议完成了筹建新中国的历史使命。",p:["新政协"]},
{id:"c7q87",ch:7,t:"l",fs:10,q:"试述抗战胜利后中国共产党为争取和平民主而进行的斗争。",
 kw:["重庆谈判","双十协定","政治协商会议","停战协定"],
 ref:"抗战胜利后，中国共产党为争取和平民主进行了不懈斗争：①1945年8月28日毛泽东赴重庆谈判，10月10日国共签署《双十协定》，确认和平建国基本方针；②1946年1月10日国共签订《停战协定》，同日在重庆召开政治协商会议，通过《和平建国纲领》等有利于人民的决议；③但国民党坚持独裁内战，先后制造沧白堂事件、校场口惨案，并于1946年6月发动全面内战，共产党领导人民以自卫战争粉碎其进攻。这些斗争表明中共争取和平民主的诚意，教育了人民，为解放战争胜利准备了条件。",p:["重庆谈判"]},
{id:"c7q88",ch:7,t:"l",fs:10,q:"试述人民解放军由战略防御转入战略进攻并取得三大战役胜利的经过。",
 kw:["大别山","战略进攻","三大战役","154"],
 ref:"1947年6月底，刘伯承、邓小平率晋冀鲁豫野战军主力千里跃进大别山，揭开了人民解放军战略进攻的序幕；随后陈赓、谢富治兵团挺进豫西，陈毅、粟裕大军挺进豫皖苏，三路大军形成品字形阵势，将战争引向国民党统治区。1948年9月至1949年1月，人民解放军相继发动辽沈、淮海、平津三大战役，共歼灭国民党军154万余人，基本上消灭了国民党军队的主力，使人民解放军在数量上超过国民党军队，为渡江作战、解放全中国奠定了坚实基础。",p:["三大战役"]},
{id:"c7q89",ch:7,t:"l",fs:10,q:"试述解放区土地改革的开展及其意义。",
 kw:["五四指示","中国土地法大纲","耕者有其田","群众基础"],
 ref:"1946年5月4日，中共中央发出《五四指示》，将减租减息政策改变为没收地主土地分配给农民的政策。1947年9月，《中国土地法大纲》颁布，规定废除封建性及半封建性剥削的土地制度，实行耕者有其田，按乡村全部人口平均分配土地。此后土地改革运动在解放区全面展开。土地改革使亿万农民在政治上、经济上获得解放，翻身农民踊跃参军参战、支援前线，为人民解放战争的胜利奠定了深厚的群众基础。",p:["土地改革"]},
{id:"c7q90",ch:7,t:"l",fs:10,q:"试述中华人民共和国的成立及其伟大历史意义。",
 kw:["共同纲领","1949年10月1日","民族独立","人民解放"],
 ref:"1949年9月21日，中国人民政治协商会议第一届全体会议在北平召开，通过起临时宪法作用的《共同纲领》，选举了中央人民政府，完成了筹建新中国的任务。1949年10月1日，开国大典在北京天安门广场举行，毛泽东庄严宣告中华人民共和国中央人民政府成立。中华人民共和国的成立，标志着中国新民主主义革命的基本胜利，结束了帝国主义、封建主义和官僚资本主义在中国的统治，实现了民族独立和人民解放，中国人民从此站起来了，中国历史进入新纪元。",p:["新中国诞生"]},

{id:"c8q34",ch:8,t:"s",q:"新中国成立初期，为废除封建主义婚姻制度，中央人民政府颁布的法律是",o:["《中华人民共和国婚姻法》","《中华人民共和国土地改革法》","《惩治反革命条例》","《中华人民共和国宪法》"],a:"A",x:"1950年5月颁布《婚姻法》，废除包办强迫、男尊女卑的封建婚姻制度。",p:["《共同纲领》"]},
{id:"c8q35",ch:8,t:"s",q:"新解放区的土地改革运动开始于",o:["1949年冬","1950年冬","1951年冬","1952年冬"],a:"B",x:"1950年6月颁布《土地改革法》，新解放区土改随即展开。",p:["土地改革"]},
{id:"c8q36",ch:8,t:"s",q:"除部分少数民族地区外，全国新解放区的土地改革基本完成是在",o:["1951年","1952年","1953年春","1954年"],a:"C",x:"到1953年春，土地改革在全国基本完成，三亿多农民分到土地。",p:["土地改革"]},
{id:"c8q37",ch:8,t:"s",q:"土地改革基本完成后，在中国农村被消灭的剥削阶级是",o:["地主阶级","富农阶级","中农","贫农"],a:"A",x:"土地改革废除了地主阶级封建剥削的土地所有制，地主阶级作为一个阶级被消灭。",p:["土地改革"]},
{id:"c8q38",ch:8,t:"s",q:"新中国成立初期，在工矿企业中开展的民主改革，废除的是",o:["封建把头制度","工资等级制度","劳动保险制度","工会组织"],a:"A",x:"工矿企业民主改革废除了封建把头制度，确立工人主人翁地位，巩固了人民政权。",p:["《共同纲领》"]},
{id:"c8q39",ch:8,t:"s",q:"中国人民志愿军入朝作战，担任司令员兼政治委员的是",o:["林彪","彭德怀","刘伯承","陈毅"],a:"B",x:"1950年10月中国人民志愿军在彭德怀司令员兼政治委员率领下入朝作战。",p:["抗美援朝"]},
{id:"c8q40",ch:8,t:"s",q:"抗美援朝战争中，中国人民志愿军取得的著名战役胜利是",o:["平型关大捷","台儿庄战役","上甘岭战役","孟良崮战役"],a:"C",x:"1952年10月志愿军取得上甘岭战役胜利，创造了依托坑道坚守防御的范例。",p:["抗美援朝"]},
{id:"c8q41",ch:8,t:"s",q:"朝鲜内战爆发、美国随即出兵武装干涉的时间是",o:["1950年6月","1950年10月","1951年1月","1951年6月"],a:"A",x:"1950年6月朝鲜内战爆发，美国出兵干涉并把战火烧到中朝边境，威胁中国安全。",p:["抗美援朝"]},
{id:"c8q42",ch:8,t:"s",q:"《朝鲜停战协定》的签订地点是",o:["汉城","平壤","板门店","开城"],a:"C",x:"1953年7月27日《朝鲜停战协定》在板门店签订，抗美援朝战争胜利结束。",p:["抗美援朝"]},
{id:"c8q43",ch:8,t:"s",q:"「三反」运动中被揭发并依法严惩的贪污腐败典型是",o:["刘青山、张子善","高岗、饶漱石","陈希同、王宝森","胡长清、成克杰"],a:"A",x:"刘青山、张子善因贪污国家资财被依法判处死刑，教育了广大干部。",p:["三反五反"]},
{id:"c8q44",ch:8,t:"s",q:"在私营工商业者中开展的「五反」运动发生在",o:["1951年","1952年","1953年","1954年"],a:"B",x:"1952年在私营工商业者中开展「五反」运动，打击不法资本家的违法行为。",p:["三反五反"]},
{id:"c8q45",ch:8,t:"s",q:"「三反」运动对于干部队伍建设的意义在于",o:["教育了广大干部，纯洁了干部队伍","确立了社会主义制度","完成了土地改革","实现了国家工业化"],a:"A",x:"「三反」运动教育了广大干部，纯洁了干部队伍，加强了执政党建设。",p:["三反五反"]},
{id:"c8q46",ch:8,t:"s",q:"党在过渡时期总路线的实质是",o:["逐步改变生产资料的私有制","实现国家的完全统一","巩固人民民主专政","完成土地改革"],a:"A",x:"过渡时期总路线的实质是逐步改变生产资料的私有制，建立社会主义经济基础。",p:["过渡时期总路线"]},
{id:"c8q47",ch:8,t:"s",q:"过渡时期总路线中的「三改」不包括",o:["对农业的社会主义改造","对手工业的社会主义改造","对资本主义工商业的社会主义改造","对交通运输业的社会主义改造"],a:"D",x:"「三改」指对农业、手工业和资本主义工商业的社会主义改造，不含交通运输业。",p:["过渡时期总路线"]},
{id:"c8q48",ch:8,t:"s",q:"党在过渡时期总路线所指的「过渡时期」是",o:["从五四运动到新中国成立","从中华人民共和国成立到社会主义改造基本完成","从新中国成立到改革开放","从三大改造完成到改革开放"],a:"B",x:"过渡时期指从中华人民共和国成立到社会主义改造基本完成，即1949年至1956年。",p:["过渡时期总路线"]},
{id:"c8q49",ch:8,t:"s",q:"第一个五年计划期间，建成的我国第一座长江大桥是",o:["南京长江大桥","武汉长江大桥","九江长江大桥","芜湖长江大桥"],a:"B",x:"1957年武汉长江大桥建成通车，是「一五」计划期间的重要建设成就。",p:["一五计划"]},
{id:"c8q50",ch:8,t:"s",q:"1956年建成投产、结束中国不能生产汽车历史的工厂是",o:["长春第一汽车制造厂","上海汽车制造厂","沈阳机床厂","洛阳拖拉机厂"],a:"A",x:"1956年长春第一汽车制造厂建成投产，试制成功「解放」牌载重汽车。",p:["一五计划"]},
{id:"c8q51",ch:8,t:"s",q:"第一个五年计划提前超额完成是在",o:["1955年底","1956年底","1957年底","1958年底"],a:"C",x:"到1957年底，「一五」计划各项指标大都超额完成，奠定了工业化的初步基础。",p:["一五计划"]},
{id:"c8q52",ch:8,t:"s",q:"我国第一个五年计划实施的时间是",o:["1949—1952年","1950—1954年","1953—1957年","1956—1960年"],a:"C",x:"第一个五年计划于1953年开始实施，到1957年底超额完成。",p:["一五计划"]},
{id:"c8q53",ch:8,t:"s",q:"第一个五年计划期间，钢铁工业的重点建设基地是",o:["鞍山钢铁公司","宝山钢铁公司","武汉钢铁公司","攀枝花钢铁公司"],a:"A",x:"「一五」期间鞍山钢铁公司大型轧钢厂、无缝钢管厂等建成投产。",p:["一五计划"]},
{id:"c8q54",ch:8,t:"s",q:"第一个五年计划期间，苏联帮助我国建设的重点工程有",o:["100项","120项","156项","200项"],a:"C",x:"「一五」计划期间苏联援建的156项重点工程，为工业化奠定了基础。",p:["一五计划"]},
{id:"c8q55",ch:8,t:"s",q:"农业合作化中，具有半社会主义性质的农业生产组织形式是",o:["互助组","初级农业生产合作社","高级农业生产合作社","人民公社"],a:"B",x:"初级农业生产合作社实行土地入股、统一经营，具有半社会主义性质。",p:["农业改造"]},
{id:"c8q56",ch:8,t:"s",q:"1955年，毛泽东发表的推动农业合作化高潮的报告是",o:["《关于农业合作化问题》","《论十大关系》","《关于正确处理人民内部矛盾的问题》","《论人民民主专政》"],a:"A",x:"1955年毛泽东发表《关于农业合作化问题》，推动了农业合作化高潮的到来。",p:["农业改造"]},
{id:"c8q57",ch:8,t:"s",q:"我国农业社会主义改造基本完成是在",o:["1955年底","1956年底","1957年底","1958年底"],a:"B",x:"到1956年底农业合作化基本完成，农民个体所有制转变为集体所有制。",p:["农业改造"]},
{id:"c8q58",ch:8,t:"s",q:"手工业社会主义改造中，具有完全社会主义性质的组织形式是",o:["手工业供销小组","手工业供销合作社","手工业生产合作社","个体手工业者协会"],a:"C",x:"手工业生产合作社是完全社会主义性质的集体经济组织，是手工业改造的高级形式。",p:["手工业改造"]},
{id:"c8q59",ch:8,t:"s",q:"农业社会主义改造把农民的个体所有制改造为",o:["全民所有制","集体所有制","国家资本主义所有制","混合所有制"],a:"B",x:"农业合作化把农民的个体所有制改造为社会主义集体所有制，实现共同富裕。",p:["农业改造"]},
{id:"c8q60",ch:8,t:"s",q:"个别企业公私合营阶段，企业利润实行分配的办法是",o:["四马分肥","定息制度","按劳分配","平均分配"],a:"A",x:"个别企业公私合营时利润按「四马分肥」分配，分给国家、企业、职工和资方。",p:["资本主义工商业改造"]},
{id:"c8q61",ch:8,t:"s",q:"全行业公私合营后，国家按核定私股数额按期发给固定股息，这种办法是",o:["四马分肥","定息制度","赎买债券","工资制度"],a:"B",x:"全行业公私合营后国家对私股实行定息制度，按核定数额按期付给固定股息。",p:["资本主义工商业改造"]},
{id:"c8q62",ch:8,t:"s",q:"对资本主义工商业进行社会主义改造的初级形式不包括",o:["加工订货","统购包销","经销代销","公私合营"],a:"D",x:"公私合营是改造的高级形式，加工订货、统购包销、经销代销等属初级形式。",p:["资本主义工商业改造"]},
{id:"c8q63",ch:8,t:"s",q:"我国对资本主义工商业的社会主义改造基本完成是在",o:["1954年底","1955年底","1956年底","1957年底"],a:"C",x:"到1956年底，对资本主义工商业的社会主义改造基本完成，实行全行业公私合营。",p:["资本主义工商业改造"]},
{id:"c8q64",ch:8,t:"s",q:"对资本主义工商业实行和平赎买政策，其「赎买」的含义是",o:["国家有偿地把资本家的生产资料收归国有","无偿没收资本家的企业","分期付给资本家高于企业的价款","由资本家自行处置企业"],a:"A",x:"和平赎买即国家付出一定代价（如定息）有偿地把资本家的生产资料收归国有。",p:["资本主义工商业改造"]},
{id:"c8q65",ch:8,t:"s",q:"全国出现全行业公私合营高潮是在",o:["1954年","1955年","1956年","1957年"],a:"C",x:"1956年初北京率先实现全行业公私合营，随即在全国掀起高潮。",p:["资本主义工商业改造"]},
{id:"c8q66",ch:8,t:"s",q:"全行业公私合营后，国家付给资本家的定息年息为",o:["二厘","三厘","五厘","八厘"],a:"C",x:"全行业公私合营后国家实行定息制度，按私股数额付给年息五厘的固定股息。",p:["资本主义工商业改造"]},
{id:"c8q67",ch:8,t:"s",q:"1956年社会主义改造基本完成，标志着我国进入了",o:["新民主主义社会","社会主义初级阶段","社会主义高级阶段","共产主义社会"],a:"B",x:"1956年三大改造完成，社会主义基本制度确立，我国进入社会主义初级阶段。",p:["社会主义制度确立"]},
{id:"c8q68",ch:8,t:"s",q:"社会主义改造的完成，在中国消灭了",o:["地主阶级","资产阶级","延续几千年的剥削制度","小农经济"],a:"C",x:"三大改造完成消灭了剥削制度，剥削阶级作为阶级也基本被消灭。",p:["社会主义制度确立"]},
{id:"c8q69",ch:8,t:"s",q:"社会主义改造完成后，我国国民经济中占绝对优势地位的是",o:["个体经济","资本主义经济","社会主义公有制经济","外资经济"],a:"C",x:"改造完成后全民所有制和集体所有制在国民经济中占绝对优势，确立了社会主义经济基础。",p:["社会主义制度确立"]},
{id:"c8q70",ch:8,t:"s",q:"1954年《中华人民共和国宪法》规定的国家根本政治制度（政体）是",o:["人民代表大会制度","民族区域自治制度","中国共产党领导的多党合作和政治协商制度","基层群众自治制度"],a:"A",x:"1954年宪法以根本大法形式确认人民代表大会制度为国家的根本政治制度。",p:["1954宪法"]},
{id:"c8q71",ch:8,t:"s",q:"新中国成立初期，国民经济恢复任务完成、工农业生产达到历史最高水平是在",o:["1950年底","1951年底","1952年底","1953年底"],a:"C",x:"到1952年底国民经济得到全面恢复，工农业生产达到或超过历史最高水平。",p:["国民经济恢复"]},
{id:"c8q72",ch:8,t:"s",q:"1950年6月，毛泽东在中共七届三中全会上作的报告是",o:["《为争取国家财政经济状况的基本好转而斗争》","《论十大关系》","《关于正确处理人民内部矛盾的问题》","《目前形势和我们的任务》"],a:"A",x:"七届三中全会上毛泽东作书面报告，确定争取国家财政经济状况基本好转的中心任务。",p:["国民经济恢复"]},
{id:"c8q73",ch:8,t:"s",q:"1953年12月，周恩来在接见印度代表团时首次提出的原则是",o:["和平共处五项原则","求同存异方针","一边倒方针","另起炉灶方针"],a:"A",x:"1953年12月周恩来首次提出和平共处五项原则，成为处理国际关系的准则。",p:["外交方针"]},
{id:"c8q74",ch:8,t:"s",q:"1954年6月，周恩来访问印度和缅甸，同两国共同倡导的是",o:["和平共处五项原则","互利互惠原则","门户开放原则","睦邻友好原则"],a:"A",x:"1954年6月周恩来访问印、缅，同两国总理共同倡导和平共处五项原则。",p:["外交方针"]},
{id:"c8q75",ch:8,t:"s",q:"1955年4月，周恩来在万隆会议上提出的方针是",o:["求同存异","一边倒","另起炉灶","打扫干净屋子再请客"],a:"A",x:"1955年4月万隆会议上周恩来提出「求同存异」方针，推动会议圆满成功。",p:["外交方针"]},
{id:"c8q76",ch:8,t:"s",q:"我国建立的第一个省级民族自治区是",o:["新疆维吾尔自治区","广西壮族自治区","内蒙古自治区","西藏自治区"],a:"C",x:"1947年5月内蒙古自治区成立，是新中国成立前已建立的第一个省级民族自治区。",p:["《共同纲领》"]},
{id:"c8q77",ch:8,t:"s",q:"《十七条协议》的全称是",o:["《中央人民政府和西藏地方政府关于和平解放西藏办法的协议》","《中央人民政府与西藏地方政府关于实行民主改革的协议》","《中印关于西藏问题的协定》","《西藏自治区筹备成立协定》"],a:"A",x:"《十七条协议》即中央人民政府和西藏地方政府关于和平解放西藏办法的协议。",p:["西藏解放"]},
{id:"c8q78",ch:8,t:"s",q:"新中国成立初期，领导稳定物价、统一全国财经工作的是",o:["周恩来","陈云","李富春","薄一波"],a:"B",x:"陈云任中央财政经济委员会主任，领导「银元之战」「米棉之战」稳定了物价。",p:["国民经济恢复"]},
{id:"c8q79",ch:8,t:"s",q:"1950年土地改革的总路线中，依靠的对象是",o:["贫农、雇农","富农","地主","民族资产阶级"],a:"A",x:"土改总路线依靠贫农、雇农，团结中农，中立富农，有步骤地消灭封建剥削制度。",p:["土地改革"]},
{id:"c8q80",ch:8,t:"s",q:"中国人民政治协商会议第一届全体会议召开的时间是",o:["1949年6月","1949年9月","1949年10月","1950年1月"],a:"B",x:"1949年9月政协一届全体会议召开，制定《共同纲领》，选举中央人民政府委员会。",p:["《共同纲领》"]},
{id:"c8q81",ch:8,t:"s",q:"1950年10月，中共中央为巩固新生人民政权开展的运动是",o:["镇压反革命运动","三反运动","五反运动","整党运动"],a:"A",x:"1950年10月中共中央发出指示，在全国开展镇压反革命运动，巩固人民政权。",p:["国民经济恢复"]},
{id:"c8q82",ch:8,t:"j",fs:6,q:"简述土地改革的历史意义。",kw:["封建剥削","农民土地所有制","地主阶级","生产力","政权"],ref:"①彻底废除了封建地主土地所有制，实行农民土地所有制，消灭了地主阶级的封建剥削制度；②极大地解放和发展了农村生产力，调动了农民的生产积极性；③巩固了工农联盟和人民民主专政的国家政权；④为农业的社会主义改造和国家工业化创造了条件。",p:["土地改革"]},
{id:"c8q83",ch:8,t:"j",fs:6,q:"简述「三反」「五反」运动的内容和意义。",kw:["贪污","浪费","官僚主义","行贿","偷税漏税","私营工商业者"],ref:"①「三反」运动在党政机关工作人员中开展，内容是反贪污、反浪费、反官僚主义，教育了广大干部，纯洁了干部队伍；②「五反」运动在私营工商业者中开展，内容是反行贿、反偷税漏税、反盗骗国家财产、反偷工减料、反盗窃国家经济情报，打击了不法资本家的违法行为；③两场运动巩固了工人阶级的领导地位，为资本主义工商业的社会主义改造创造了条件。",p:["三反五反"]},
{id:"c8q84",ch:8,t:"j",fs:6,q:"简述第一个五年计划的主要任务和成就。",kw:["重工业","工业体系","武汉长江大桥","长春第一汽车制造厂","1957"],ref:"①「一五」计划集中主要力量优先发展重工业，建立国家工业化的初步基础；②到1957年底计划超额完成，建成投产了武汉长江大桥、长春第一汽车制造厂等重点项目；③我国开始改变工业落后的面貌，初步建立了独立的、比较完整的工业体系。",p:["一五计划"]},
{id:"c8q85",ch:8,t:"j",fs:6,q:"简述农业社会主义改造的过渡形式和方针原则。",kw:["互助组","初级农业生产合作社","高级农业生产合作社","自愿互利"],ref:"①农业合作化采取由低级到高级的过渡形式，即互助组（具有社会主义萌芽性质）、初级农业生产合作社（半社会主义性质）、高级农业生产合作社（完全社会主义性质）；②坚持自愿互利、典型示范、国家帮助的原则；③到1956年底农业合作化基本完成，把农民的个体所有制改造为社会主义集体所有制。",p:["农业改造"]},
{id:"c8q86",ch:8,t:"j",fs:6,q:"简述手工业社会主义改造的主要形式。",kw:["手工业供销小组","供销合作社","生产合作社"],ref:"①手工业改造采取由低级到高级的过渡形式：手工业供销小组具有社会主义萌芽性质，手工业供销合作社具有半社会主义性质，手工业生产合作社是完全社会主义性质的集体经济组织；②到1956年底，手工业的社会主义改造基本完成。",p:["手工业改造"]},
{id:"c8q87",ch:8,t:"l",fs:10,q:"试述抗美援朝战争的原因、经过和意义。",kw:["1950年10月","彭德怀","1953年7月","和平环境"],ref:"①原因：1950年6月朝鲜内战爆发，美国出兵干涉并把战火烧到鸭绿江边，严重威胁中国安全；②经过：1950年10月，中国人民志愿军在彭德怀司令员兼政治委员率领下入朝作战，经过两年九个月的艰苦作战，1953年7月27日《朝鲜停战协定》在板门店签订，抗美援朝战争胜利结束；③意义：打出了新中国的国威和人民军队的军威，提高了新中国的国际威望，保卫了国家安全，为新中国的经济建设和社会改革赢得了一个相对稳定的和平环境。",p:["抗美援朝"]},
{id:"c8q88",ch:8,t:"l",fs:10,q:"试述我国对农业进行社会主义改造的历史必然性和主要经验。",kw:["个体经济","集体化","互助组","高级社","1956"],ref:"①历史必然性：土地改革后的农业仍是个体经济，分散落后、生产力水平低，难以满足国家工业化对粮食和原料的需求，也容易产生两极分化，必须引导农民走合作化、集体化的道路；②主要经验：坚持自愿互利、典型示范、国家帮助的原则，采取互助组、初级社、高级社由低级到高级的过渡形式，把农民的个体所有制改造为社会主义集体所有制；③到1956年底农业合作化基本完成。",p:["农业改造"]},
{id:"c8q89",ch:8,t:"l",fs:10,q:"试述新中国确立社会主义基本制度的重大意义。",kw:["最深刻最伟大的社会变革","公有制","剥削制度","初级阶段"],ref:"①1956年社会主义改造基本完成，标志着社会主义基本制度在中国全面确立，实现了中国历史上最深刻最伟大的社会变革；②社会主义公有制经济在国民经济中占绝对优势，确立了社会主义经济基础；③剥削制度和剥削阶级作为阶级已经基本被消灭；④我国进入社会主义初级阶段，为新中国的一切进步和发展奠定了根本政治前提和制度基础。",p:["社会主义制度确立"]},
{id:"c8q90",ch:8,t:"l",fs:10,q:"试述《共同纲领》的主要内容及其在新中国成立初期的实施。",kw:["国体","政体","民主集中制","土地改革"],ref:"①《共同纲领》规定国体为人民民主专政，即工人阶级领导的、以工农联盟为基础的、团结各民主阶级和国内各民族的人民民主专政；②规定政体为人民代表大会制度，各级政权机关一律实行民主集中制；③《共同纲领》在宪法颁布前起着临时宪法的作用；④新中国成立初期《共同纲领》得到全面实施：完成土地改革、恢复国民经济、进行抗美援朝、开展「三反」「五反」运动等，巩固了新生的人民政权。",p:["《共同纲领》"]},

{id:"c9q81",ch:9,t:"j",fs:6,q:"简述《论十大关系》的基本内容和意义。",kw:["1956","十个方面","积极因素","良好开端"],ref:"①1956年4月，毛泽东在中央政治局扩大会议上作《论十大关系》的报告，初步总结了我国社会主义建设的经验，提出了探索适合中国国情的社会主义建设道路的任务；②报告论述了重工业和轻工业、农业等十个方面的关系，确定的基本方针是调动一切积极因素为社会主义事业服务；③《论十大关系》是探索中国自己的社会主义建设道路的良好开端。",p:["《论十大关系》"]},
{id:"c9q82",ch:9,t:"j",fs:6,q:"简述《关于正确处理人民内部矛盾的问题》的主要内容。",kw:["两类不同性质的矛盾","敌我矛盾","人民内部矛盾","主题","基本矛盾"],ref:"①毛泽东指出社会主义社会存在着敌我矛盾和人民内部矛盾两类不同性质的矛盾，敌我矛盾用专政的方法解决，人民内部矛盾用民主的、说服教育的方法解决；②正确处理人民内部矛盾是国家政治生活的主题；③毛泽东还阐述了社会主义社会的基本矛盾仍然是生产关系和生产力、上层建筑和经济基础之间的矛盾。",p:["人民内部矛盾"]},
{id:"c9q83",ch:9,t:"j",fs:6,q:"简述「大跃进」和人民公社化运动的发动及其后果。",kw:["1958","总路线","人民公社","高指标","浮夸风"],ref:"①1958年5月，中共八大二次会议通过了社会主义建设总路线，会后发动了「大跃进」运动；②1958年8月，北戴河会议作出《关于在农村建立人民公社问题的决议》，人民公社化运动迅速掀起高潮；③运动中以高指标、瞎指挥、浮夸风和「共产风」为主要标志的「左」倾错误严重泛滥，破坏了国民经济。",p:["大跃进"]},
{id:"c9q84",ch:9,t:"j",fs:6,q:"简述「文化大革命」发动的原因及全面发动的标志。",kw:["阶级斗争","左","五一六通知","十六条"],ref:"①「文化大革命」的发动，是毛泽东对国内阶级斗争形势作出了错误估计，认为党和国家面临资本主义复辟的危险，加上林彪、江青等人的利用，使「左」倾错误发展到极端；②1966年5月中央政治局扩大会议通过《五一六通知》，标志着「文化大革命」的发动；③1966年8月中共八届十一中全会通过《关于无产阶级文化大革命的决定》（即「十六条」），「文化大革命」全面发动。",p:["文化大革命"]},
{id:"c9q85",ch:9,t:"j",fs:6,q:"简述「两弹一星」研制成功的历程及其意义。",kw:["原子弹","氢弹","东方红一号","国防实力"],ref:"①1964年10月我国第一颗原子弹爆炸成功；②1967年6月第一颗氢弹爆炸成功；③1970年4月第一颗人造地球卫星「东方红一号」发射成功，这些合称「两弹一星」；④「两弹一星」的成功打破了帝国主义的核垄断和核讹诈，增强了国防实力，提高了中国的国际地位。",p:["两弹一星"]},
{id:"c9q86",ch:9,t:"j",fs:6,q:"简述1957年整风运动的内容。",kw:["1957","官僚主义","宗派主义","主观主义","批评与自我批评"],ref:"①1957年4月，中共中央发出《关于整风运动的指示》，在全党开展整风运动；②整风运动的内容是反对官僚主义、宗派主义和主观主义；③整风运动采取批评与自我批评的方法，目的是加强党的建设，改进工作作风。",p:["整风运动"]},
{id:"c9q87",ch:9,t:"l",fs:10,q:"试述中共八大关于国内主要矛盾的分析及其意义。",kw:["工业国","农业国","经济文化","主要任务","良好开端"],ref:"①八大指出，社会主义改造基本完成后，国内主要矛盾是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾；②确定党和全国人民的主要任务是集中力量发展社会生产力，实现国家工业化，逐步满足人民日益增长的物质和文化需要；③八大的路线是正确的，为社会主义事业的发展和党的建设指明了方向，是探索中国自己的社会主义建设道路的良好开端。",p:["中共八大"]},
{id:"c9q88",ch:9,t:"l",fs:10,q:"试述20世纪60年代国民经济调整的背景、方针和成效。",kw:["八字方针","1961","调整","巩固","充实","提高","1965"],ref:"①背景：「大跃进」和人民公社化运动导致国民经济比例严重失调，1959—1961年国民经济发生严重困难；②方针：1961年1月中共八届九中全会正式决定对国民经济实行「调整、巩固、充实、提高」的八字方针，随即全面展开调整；③成效：经过调整，国民经济得到恢复和发展，到1965年调整任务基本完成，国民经济主要比例关系趋于协调。",p:["探索曲折"]},
{id:"c9q89",ch:9,t:"l",fs:10,q:"试述1956—1976年社会主义建设在探索中取得的经验教训。",kw:["实事求是","国情","急于求成","民主集中制","马克思主义"],ref:"①必须坚持实事求是的思想路线，把马克思主义基本原理同中国具体实际相结合，走自己的路；②必须从中国的国情出发，正确认识我国还处于社会主义初级阶段，不能急于求成、超越阶段；③必须正确认识和处理社会主义社会的阶级斗争问题，坚持以经济建设为中心，大力发展社会生产力；④必须坚持民主集中制和集体领导制度，反对个人崇拜，发展社会主义民主，健全社会主义法制；⑤这些经验教训是党和人民付出沉重代价换来的，为改革开放新时期提供了宝贵借鉴。",p:["经验教训"]},
{id:"c9q90",ch:9,t:"l",fs:10,q:"试述20世纪70年代初我国外交战线取得的重大胜利及其影响。",kw:["联合国","1971","尼克松","上海公报","田中角荣"],ref:"①1971年10月，第26届联合国大会通过决议，恢复中华人民共和国在联合国的一切合法权利，这是我国外交战线的重大胜利；②1972年2月，美国总统尼克松访华，中美双方发表《上海公报》，两国关系开始走向正常化，1979年正式建交；③1972年9月，日本首相田中角荣访华，中日实现邦交正常化；④这些成就打破了西方国家对中国的孤立封锁，提高了中国的国际地位，为后来的改革开放创造了有利的国际环境。",p:["外交成就"]},

{id:"c10q81",ch:10,t:"j",fs:6,q:"简述真理标准问题大讨论的主要内容和历史意义。",
kw:["实践是检验真理的唯一标准","解放思想","两个凡是","十一届三中全会","思想基础"],
ref:"1978年5月《光明日报》发表《实践是检验真理的唯一标准》一文，引发全国范围的大讨论。主要内容：①批判「两个凡是」的错误方针；②确立实践是检验真理的唯一标准；③重新确立解放思想、实事求是的思想路线。历史意义：冲破了「两个凡是」的束缚，促进了全国性的思想解放运动，为中共十一届三中全会实现伟大历史转折奠定了思想基础。",p:["真理标准讨论"]},
{id:"c10q82",ch:10,t:"j",fs:6,q:"简述家庭联产承包责任制的主要内容和意义。",
kw:["包产到户","包干到户","经营自主权","小岗村","农村改革"],
ref:"主要内容：以包产到户、包干到户为主要形式，在坚持土地集体所有制的前提下，把土地承包给农户经营，农户获得生产经营自主权，实行统分结合的双层经营体制。历史意义：①调动了农民生产积极性，解放和发展了农村生产力；②1978年底安徽凤阳小岗村率先实行包产到户，拉开了农村改革的序幕；③为城市经济体制改革提供了经验，推动整个改革开放进程。",p:["农村改革"]},
{id:"c10q83",ch:10,t:"j",fs:6,q:"简述我国设立经济特区的主要特点和意义。",
kw:["深圳","珠海","汕头","厦门","窗口","试验田"],
ref:"1980年我国设立深圳、珠海、汕头、厦门四个经济特区，1988年设立海南经济特区。主要特点：在对外经济活动中实行特殊政策和灵活措施，以引进外资、先进技术和管理经验为主，实行市场经济机制。历史意义：①经济特区成为我国利用外资、引进技术、学习先进管理经验的窗口；②是经济体制改革和对外开放的试验田；③推动了全国改革开放和现代化建设。",p:["经济特区"]},
{id:"c10q84",ch:10,t:"j",fs:6,q:"简述党在社会主义初级阶段基本路线的内容。",
kw:["一个中心","两个基本点","以经济建设为中心","四项基本原则","改革开放","富强民主文明"],
ref:"党在社会主义初级阶段的基本路线是：领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强、民主、文明的社会主义现代化国家而奋斗。概括起来就是「一个中心、两个基本点」。",p:["基本路线"]},
{id:"c10q85",ch:10,t:"j",fs:6,q:"简述邓小平南方谈话的主要历史背景和意义。",
kw:["1992","武昌","深圳","珠海","上海","基本路线"],
ref:"1992年1月至2月，邓小平先后视察武昌、深圳、珠海、上海等地，发表重要谈话。背景：当时国际国内出现一些对改革开放的疑虑和困惑，姓「社」姓「资」的争论束缚着人们的思想。意义：①科学回答了「什么是社会主义、怎样建设社会主义」等重大认识问题；②强调坚持党的基本路线一百年不动摇；③为中共十四大确立社会主义市场经济体制的改革目标奠定了思想基础，把改革开放和现代化建设推进到新阶段。",p:["南方谈话"]},
{id:"c10q86",ch:10,t:"j",fs:6,q:"简述中国加入世界贸易组织的重大意义。",
kw:["2001","对外开放","新阶段","世界经济","机遇","挑战"],
ref:"2001年12月11日，中国正式加入世界贸易组织。重大意义：①标志着我国对外开放进入新阶段；②为我国经济社会发展赢得良好国际环境，促进社会主义市场经济体制完善；③推动我国更广泛深入地参与经济全球化，分享世界经济发展的机遇；④同时我国也面临更加激烈的国际竞争和挑战，必须趋利避害，提高对外开放水平。",p:["对外开放"]},
{id:"c10q87",ch:10,t:"l",fs:10,q:"试述为什么说改革开放是决定当代中国命运的关键一招。",
kw:["十一届三中全会","改革开放","中国特色社会主义","解放和发展","关键一招","强国之路"],
ref:"1978年12月中共十一届三中全会作出实行改革开放的历史性决策。改革开放是党在新的历史条件下领导人民进行的新的伟大革命。①改革开放极大地解放和发展了社会生产力，使中国经济实力、科技实力、综合国力显著增强，人民生活水平大幅提高；②改革开放开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系；③改革开放使中华民族迎来了从站起来、富起来到强起来的伟大飞跃。实践证明，改革开放是决定当代中国命运的关键一招，是党和人民事业大踏步赶上时代的重要法宝；改革开放是强国之路，是实现中华民族伟大复兴的必由之路。",p:["改革开放"]},
{id:"c10q88",ch:10,t:"l",fs:10,q:"试述社会主义市场经济体制的确立过程和重大意义。",
kw:["十四大","改革目标","市场经济","有计划的商品经济","资源配置","十四届三中全会"],
ref:"确立过程：①1984年中共十二届三中全会提出社会主义经济是公有制基础上的有计划的商品经济，突破了把计划经济同商品经济对立起来的传统观念；②1992年邓小平南方谈话指出计划和市场都是经济手段，不是社会主义与资本主义的本质区别；③1992年中共十四大明确提出我国经济体制改革目标是建立社会主义市场经济体制；④1993年十四届三中全会通过《关于建立社会主义市场经济体制若干问题的决定》，勾画了社会主义市场经济体制的基本框架。重大意义：社会主义市场经济体制使市场在资源配置中发挥重要作用，同时发挥社会主义制度的优越性，极大促进了生产力发展，推动我国改革开放和现代化建设取得举世瞩目的成就。",p:["社会主义市场经济"]},
{id:"c10q89",ch:10,t:"l",fs:10,q:"试述「一国两制」构想的提出与香港、澳门回归祖国的重大意义。",
kw:["台湾问题","一个中国","社会主义制度","1997","1999","洗雪","繁荣稳定"],
ref:"「一国两制」构想最早是为解决台湾问题而提出，后首先运用于解决香港、澳门问题。基本内涵：在一个中国的前提下，国家主体坚持社会主义制度，香港、澳门、台湾保持原有的资本主义制度和生活方式长期不变。经过中英、中葡谈判，1984年签署《中英联合声明》，1987年签署《中葡联合声明》。1997年7月1日香港回归祖国，1999年12月20日澳门回归祖国，设立特别行政区，实行「港人治港」、「澳人治澳」、高度自治。重大意义：①香港、澳门回归洗雪了中华民族百年屈辱，是「一国两制」构想的成功实践；②为世界提供了解决历史遗留问题的新范例；③香港、澳门回归后保持繁荣稳定，证明「一国两制」是解决祖国统一问题的正确方针，对最终解决台湾问题具有示范意义。",p:["一国两制"]},
{id:"c10q90",ch:10,t:"l",fs:10,q:"试述社会主义初级阶段理论的形成及其意义。",
kw:["1981","初级","十三大","基本路线","基本国情","一百年不动摇"],
ref:"形成过程：①1981年中共十一届六中全会《关于建国以来党的若干历史问题的决议》首次提出「我们的社会主义制度还是处于初级的阶段」；②1986年中共十二届六中全会重申我国还处于社会主义初级阶段的科学论断；③1987年中共十三大系统阐述了社会主义初级阶段理论，并据此制定党在社会主义初级阶段的基本路线。主要意义：①科学回答了我国处于什么样的发展阶段这一基本国情问题；②是党制定和执行正确路线方针政策的根本依据；③强调社会主义初级阶段是一个相当长的历史阶段，必须坚持基本路线一百年不动摇，防止超越阶段，为改革开放和现代化建设提供了理论指导。",p:["社会主义初级阶段"]},

/* ===== 选择题选项乱序 =====
   以题目 id 为种子确定性打乱：同一题每次打开顺序一致，
   历史练习/错题记录里的字母仍对应同一选项。
   含「以上……」类汇总选项的题保持原序，避免语义错乱。 */
(function shuffleChoices(){
  const seedOf = id => { let h = 2166136261; for (let i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  QS.forEach(q => {
    if (q.t !== "s" || !Array.isArray(q.o) || q.o.length !== 4) return;
    if (q.o.some(o => /^(以上|上述|全选)|都正确|均正确|全部正确/.test(o))) return;
    const n = q.o.length, idx = [...Array(n).keys()];
    let s = seedOf(q.id) || 1;
    const rnd = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    const oldPos = q.a.charCodeAt(0) - 65;
    q.o = idx.map(i => q.o[i]);
    q.a = String.fromCharCode(65 + idx.indexOf(oldPos));
  });
})();

/* ---------- 工具 ---------- */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function norm(s){ return (s||"").toLowerCase().replace(/[\s，。、；：""''（）()【】《》「」,.?!；：—\-—]/g,""); }
function gradeSubj(text, q){
  const t = norm(text); let hits = 0; const hitKws=[];
  for(const kw of q.kw){ if(t.includes(norm(kw))){ hits++; hitKws.push(kw);} }
  const ratio = q.kw.length ? hits/q.kw.length : 0;
  return { score: Math.round(q.fs*ratio*2)/2, hits, total:q.kw.length, hitKws };
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function clearWrong(qid){

function addRecord(rec){
  const r = store.get("cjh_records", []);
  r.unshift(Object.assign({date:new Date().toLocaleString("zh-CN")}, rec));

}
function scorePct(s,t){ return t? Math.round(s/t*100):0; }

  const [tag,cls] = tagMap[q.t];
  return `<div class="q-head">
    <div><span class="q-tag ${cls}">${tag}</span>
    ${q.real?`<span class="badge real" style="margin-left:6px">真题 · ${q.src.replace("真题","")}</span>`:""}</div>
    ${extra||""}
  </div>
  <div class="q-title"><span class="idx">${idx}.</span>${q.q}</div>
  <div class="q-pts">${q.p.map(p=>`<span class="point">${p}</span>`).join("")}</div>`;
}

function singleCard(q, idx, chosen){
  const letters=["A","B","C","D"];
  const isAnswered = chosen!==undefined;
  const clsOf = L => isAnswered ? (L===q.a ? " right" : (L===chosen ? " wrong" : " dim")) : "";
  const badge = isAnswered ? `<span class="badge" style="background:${chosen===q.a?"#e9f4ec;color:var(--green)":"#fbe9e5;color:var(--red2)"}">${chosen===q.a?"回答正确":"回答错误"}</span>` : "";
  return `<div class="q-card" data-qid="${q.id}">
    ${qHead(q, idx, badge)}
    ${q.o.map((o,i)=>{
      const L=letters[i];
      const mark = isAnswered && L===chosen ? (L===q.a?"（正确）":"（错误）") : "";
      return `<button class="opt${clsOf(L)}" data-qid="${q.id}" data-v="${L}"><span class="k">${L}.</span>${o}${mark}</button>`;
    }).join("")}
    <div class="explain ${isAnswered?'show':''}"><b style="color:var(--gold)">答案：${q.a}　解析：</b>${q.x}</div>
  </div>`;
}

function subjCard(q, idx, done, showFull){
  const g = done ? (typeof done==="object"? {score:done.score, hits:null}:null) : null;
  return `<div class="q-card" data-qid="${q.id}">
    ${qHead(q, idx)}
    <textarea id="ta_${q.id}" placeholder="请输入你的答案要点…" ${done?`disabled`:`style="min-height:120px"`}>${done&&typeof done==="object"?esc(done.txt):""}</textarea>
    ${done&&typeof done==="object"?`
      <div class="score-line">自动批改得分：<b>${done.score} / ${q.fs}</b>（参考答案要点关键词命中 ${done.hits??"-"} 项）</div>
      <div class="refans show">
        <h4>参考答案</h4><div style="white-space:pre-line">${esc(q.ref)}</div>
      </div>
    `:`
      <button class="btn grade-btn" data-qid="${q.id}" style="margin-top:10px; font-size:14px; padding:7px 18px">提交批改</button>
      <div class="notice" style="margin-top:8px">批改方式：按参考答案要点关键词匹配自动评分（满分 ${q.fs} 分），供估分参考，请结合参考答案自查。</div>
    `}
  </div>`;
}

/* ================= 真题专区 ================= */
function realState(){ return store.get("cjh_real", {}); }
function vReal(){
  const qs = realQ();
  return `<h2 style="color:var(--red); margin:20px 0 6px; font-size:22px">历年真题专区</h2>
  <p class="sub" style="margin-bottom:12px">收录 ${qs.length} 道历年真题（客观题+主观题），题干与答案均以历年官方试卷及「答案及评分参考」为准。</p>
  <div id="realList"></div>`;
}
function renderReal(){
  const ps = realState();
  $("#realList").innerHTML = QS.filter(q=>q.real).map((q,i)=>{
    if(q.t==="s") return singleCard(q, i+1, ps[q.id], false);
    return subjCard(q, i+1, ps[q.id], false);
  }).join("");
  $$("#realList .opt").forEach(el=>el.addEventListener("click",()=>{
    const qid=el.dataset.qid, ans=el.dataset.v;
    const ps=realState(); ps[qid]=ans; store.set("cjh_real", ps);
    if(ans!==QS.find(x=>x.id===qid).a) addWrong(qid,{txt:ans, wrong:true});
    renderReal();
  }));
  $$("#realList .grade-btn").forEach(el=>el.addEventListener("click",()=>{
    const qid=el.dataset.qid, txt=$("#ta_"+qid).value;
    if(!txt.trim()){ el.textContent="请先输入答案"; return; }
    const q=QS.find(x=>x.id===qid), g=gradeSubj(txt,q);
    const ps=realState(); ps[qid]={score:g.score, txt}; store.set("cjh_real", ps);
    if(g.score<q.fs/2) addWrong(qid,{txt, score:g.score, fs:q.fs});
    renderReal();
  }));
}
function bindReal(){ renderReal(); }

/* ================= 错题本 ================= */
function vWrong(){
  const w = wrongBook();
  const ids = Object.keys(w);
  if(!ids.length) return `<div class="card"><h2>错题本</h2><p>目前还没有错题记录。做错的客观题以及主观题得分低于一半的题目会自动收录到这里。</p></div>`;
  let list = "";
  ids.forEach(qid=>{
    const q = QS.find(x=>x.id===qid); if(!q) return;
    const rec = w[qid];
    if(q.t==="s"){
      list += `<div class="q-card">
        ${qHead(q, "", `<button class="btn ghost" style="font-size:12px; padding:4px 12px" data-clear="${qid}">已掌握，移除</button>`)}
        <div class="notice">你的作答：<b>${rec.txt||"未选择"}</b>（正确答案：<b>${q.a}</b>）　${q.q}</div>
        <div class="explain show"><b style="color:var(--gold)">解析：</b>${q.x}</div>
        <div style="margin-top:10px">${q.o.map((o,i)=>`<span class="opt right" style="pointer-events:none"><span class="k">${"ABCD"[i]}.</span>${o}</span>`).join("")}</div>
      </div>`;
    } else {
      const fs = q.fs, score = rec.score!==undefined?rec.score:0;
      list += `<div class="q-card">
        ${qHead(q, "", `<button class="btn ghost" style="font-size:12px; padding:4px 12px" data-clear="${qid}">已掌握，移除</button>`)}
        <div class="score-line">上次得分：<b>${score}/${fs}</b>（低于一半计入错题本）</div>
        <div class="notice">你的作答：<span style="white-space:pre-line">${esc(rec.txt||"")}</span></div>
        <div class="refans show"><h4>参考答案</h4><div style="white-space:pre-line">${esc(q.ref)}</div></div>
      </div>`;
    }
  });
  return `<div class="card" style="display:flex; justify-content:space-between; align-items:center">
    <h2 style="margin:0">错题本（${ids.length} 道）</h2>
    <button class="btn ghost" style="font-size:13px" id="clearAll">清空错题本</button>
  </div>${list}`;
}
function bindWrong(){
  $$("[data-clear]").forEach(b=>b.addEventListener("click",()=>{ clearWrong(b.dataset.clear); render(); }));
  const ca=$("#clearAll"); if(ca) ca.addEventListener("click",()=>{ if(confirm("确定清空全部错题？")){ store.set("cjh_wrong",{}); render(); } });
}

/* ================= 练习记录 ================= */
function vRecords(){
  const recs = store.get("cjh_records", []);
  if(!recs.length) return `<div class="card"><h2>练习记录</h2><p>暂无记录。完成章节练习或模拟考试后，记录会自动保存。</p></div>`;
  return `<div class="card">
    <h2>练习记录（最近 ${recs.length} 条）</h2>
    <div style="overflow-x:auto"><table class="rec">
      <tr><th>时间</th><th>模式</th><th>得分</th><th>总分</th><th>正确率</th><th>结果</th></tr>
      ${recs.map(r=>`<tr>
        <td>${r.date}</td><td>${r.mode}</td>
        <td><b>${r.score}</b></td><td>${r.total}</td>
        <td>${scorePct(r.score,r.total)}%</td>
        <td style="color:${r.pass?"var(--green)":"var(--red2)"}; font-weight:700">${r.pass?"合格":"未合格"}</td>
      </tr>`).join("")}
    </table></div>
    <div style="margin-top:10px"><button class="btn ghost" style="font-size:13px" id="clrRecs">清空记录</button></div>
  </div>`;
}

/* ================= 模拟考试 ================= */
function startExam(){
  const paper = {
    singles: shuffle(singles()).slice(0,25),
    shorts: shuffle(shorts()).slice(0,5),
    essays: shuffle(essays()).slice(0,3)
  };
  state.examPaper = paper;
  state.examAnswers = {};
  state.examDeadline = Date.now() + 150*60*1000;
  state.view = "exam";
  render();
  if(state.examTimer) clearInterval(state.examTimer);
  state.examTimer = setInterval(()=>{
    const remain = state.examDeadline - Date.now();
    if(remain<=0){ clearInterval(state.examTimer); state.examTimer=null; alert("考试时间到，系统自动交卷！"); submitExam(); return; }
    const tm = $("#timer"); if(!tm) return;
    const h=Math.floor(remain/3600000), m=Math.floor(remain%3600000/60000), s=Math.floor(remain%60000/1000);
    tm.textContent = `剩余时间 ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }, 1000);
}
function vExam(){
  const p = state.examPaper;
  if(!p) return `<div class="card"><h2>模拟考试</h2>
    <p>按真实考试要求随机组卷：<b>25道单选（50分）</b> + <b>5道简答（30分）</b> + <b>3道论述选2（20分）</b>，时长150分钟，交卷后自动批改。</p>
    <p class="sub" style="margin:8px 0">主观题按参考答案关键词自动估分；论述题作答超过2题时，只按答题顺序前2题计分（与真实考试规则一致）。</p>
    <button class="btn green" style="margin-top:12px" onclick="startExam()">开始模拟考试</button></div>`;
  let html = `<div class="timer" id="timer">剩余时间 --:--:--</div>
  <div style="display:flex; justify-content:space-between; align-items:center; margin:14px 0">
    <div style="display:flex; gap:6px; flex-wrap:wrap">
      <span class="badge gray">单选 ${p.singles.length}</span><span class="badge gray">简答 ${p.shorts.length}</span><span class="badge gray">论述 ${p.essays.length}（选2）</span>
    </div>
    <button class="btn" onclick="submitExam()">交卷</button>
  </div>`;
  let i=0;
  p.singles.forEach(q=>{ i++; html += singleCard(q, i, state.examAnswers[q.id], false); });
  p.shorts.forEach(q=>{ i++; html += `<div class="q-card">${qHead(q,i)}<textarea id="ta_${q.id}" placeholder="请输入你的答案要点…" style="min-height:110px"></textarea></div>`; });
  p.essays.forEach(q=>{ i++; html += `<div class="q-card">${qHead(q,i)}<textarea id="ta_${q.id}" placeholder="论述题，请分层作答…" style="min-height:130px"></textarea></div>`; });
  return html;
}
function bindExam(){
  $$("#timer").length;
  $$("#examList") && 0;
  // 单选交互：点击即记录
  if(state.examPaper){
    $$("#app .opt").forEach(el=>el.addEventListener("click",()=>{
      const qid=el.dataset.qid, ans=el.dataset.v;
      state.examAnswers[qid]=ans;
      const ps = state.examPaper;
      // 高亮
      $$("#app .opt[data-qid='"+qid+"']").forEach(o=>{
        o.classList.remove("right","wrong","dim");
        if(o.dataset.v===ans){ o.classList.add(o.dataset.v===ps.singles.find(x=>x.id===qid).a?"right":"wrong"); }
      });
    }));
  }
}
function submitExam(){
  const p = state.examPaper; if(!p) return;
  if(!confirm("确定交卷？交卷后自动批改。")) return;
  if(state.examTimer){ clearInterval(state.examTimer); state.examTimer=null; }

  let score=0, detail=[];
  // 单选
  p.singles.forEach(q=>{
    const ans = state.examAnswers[q.id];
    const ok = ans===q.a;
    if(ok) score+=2; else if(ans) addWrong(q.id,{txt:ans, wrong:true});
    detail.push({q, ans, ok});
  });
  // 简答
  p.shorts.forEach(q=>{
    const txt = ($("#ta_"+q.id)||{}).value || "";
    if(txt.trim()){
      const g = gradeSubj(txt,q);
      score+=g.score; detail.push({q, ans:txt, ok:g.score>=q.fs/2, g});
      if(g.score<q.fs/2) addWrong(q.id,{txt, score:g.score, fs:q.fs});
    } else {
      detail.push({q, ans:"", ok:false, g:null});
    }
  });
  // 论述：作答超过2题时，只按答题顺序前2题计分
  let essayCount=0;
  p.essays.forEach(q=>{
    const txt = ($("#ta_"+q.id)||{}).value || "";
    if(txt.trim() && essayCount<2){
      essayCount++;
      const g = gradeSubj(txt,q);
      score+=g.score; detail.push({q, ans:txt, ok:g.score>=q.fs/2, g});
      if(g.score<q.fs/2) addWrong(q.id,{txt, score:g.score, fs:q.fs});
    } else if(txt.trim()){
      detail.push({q, ans:txt, ok:false, g:null, overLimit:true});
    } else {
      detail.push({q, ans:"", ok:false, g:null});
    }
  });

  const pass = score>=60;
  addRecord({mode:"模拟考试", score, total:100, pass});
  state.examPaper=null;

  let d="";
  detail.forEach(it=>{
    if(it.q.t==="s"){
      d+=`<div class="q-card"><div class="q-title"><span class="idx">${it.q.q}</span></div>
      <div class="notice">你的答案：<b>${it.ans||"未作答"}</b> 正确答案：<b>${it.q.a}</b>　${it.ok?"<b style='color:var(--green)'>✓ 得2分</b>":"<b style='color:var(--red2)'>✗ 0分</b>"}</div>
      <div class="explain show"><b>解析：</b>${it.q.x}</div></div>`;
    } else {
      const over = it.overLimit ? "（作答超过2题，按规则不计分）" : "";
      d+=`<div class="q-card"><div class="q-title"><span class="idx">${it.q.q}</span></div>
      <div class="score-line">自动批改得分：<b>${it.g?it.g.score:"0"}/${it.q.fs}</b>${over}　命中关键词 ${it.g?it.g.hits:"0"}/${it.q.kw.length}</div>
      <div class="notice">你的作答：<span style="white-space:pre-line">${it.ans?esc(it.ans):"（未作答）"}</span></div>
      <div class="refans show"><h4>参考答案</h4><div style="white-space:pre-line">${esc(it.q.ref)}</div></div></div>`;
    }
  });

  app.innerHTML = `<div class="card result-big">
    <h2>考试成绩单</h2>
    <div class="score ${pass?"pass":"fail"}">${score}<span style="font-size:24px"> / 100</span></div>
    <div style="font-size:18px; margin:10px 0">${pass?"<b style='color:var(--green)'>恭喜！成绩合格</b>":"<b style='color:var(--red2)'>未合格，再接再厉</b>"}</div>
    <p class="sub">合格线 60 分 · 单选 ${detail.filter(x=>x.q.t==="s"&&x.ok).length}/25 正确 · 主观题详见下方逐题批改</p>
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px">
      <button class="btn green" onclick="state.view='exam';render()">再做一套</button>
      <button class="btn ghost" onclick="state.view='records';render()">查看记录</button>
      <button class="btn ghost" onclick="state.view='wrong';render()">错题本</button>
    </div>
  </div>${d}`;
}

/* 启动 */
render();
</script>
</body>
</html>
