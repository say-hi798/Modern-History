{id:"c7q5",ch:7,t:"s",q:"下列战役中，不属于人民解放军战略决战「三大战役」的是",o:["辽沈战役","淮海战役","平津战役","渡江战役"],a:"D",x:"三大战役是辽沈、淮海、平津战役；渡江战役发生于三大战役之后，解放了南京。",p:["三大战役"]},
{id:"c7q6",ch:7,t:"s",q:"中共七届二中全会召开的地点是",o:["延安","西柏坡","北平","瑞金"],a:"B",x:"1949年3月中共七届二中全会在河北平山县西柏坡召开。",p:["七届二中全会"]},
{id:"c7q7",ch:7,t:"s",q:"中共七届二中全会提出的「两个务必」是指",o:["务必保持谦虚谨慎、不骄不躁的作风和艰苦奋斗的作风","务必坚持群众路线和实事求是","务必坚持党的领导和大团结","务必保持革命热情和拼命精神"],a:"A",x:"毛泽东在七届二中全会上告诫全党务必保持谦虚谨慎、不骄不躁的作风，务必保持艰苦奋斗的作风。",p:["七届二中全会"]},
{id:"c7q8",ch:7,t:"s",q:"1949年6月，毛泽东发表的重要文章是",o:["《新民主主义论》","《论人民民主专政》","《论联合政府》","《论十大关系》"],a:"B",x:"1949年6月毛泽东发表《论人民民主专政》，为新中国的建立奠定了理论和政策基础。",p:["人民民主专政"]},
{id:"c7q9",ch:7,t:"s",q:"中国人民政治协商会议第一届全体会议召开的时间、地点是",o:["1949年9月，北平","1949年3月，西柏坡","1949年10月，北平","1948年9月，哈尔滨"],a:"A",x:"1949年9月中国人民政治协商会议第一届全体会议在北平召开，通过了起临时宪法作用的《共同纲领》。",p:["新政协"]},
{id:"c7q10",ch:7,t:"s",q:"抗战胜利后，为争取和平民主，中共中央领导人毛泽东赴重庆谈判的时间是",o:["1945年8月","1945年10月","1946年1月","1946年6月"],a:"A",x:"1945年8月28日毛泽东借周恩来、王若飞赴重庆，与国民党谈判，表明了中共争取和平民主的诚意。",p:["重庆谈判"]},
{id:"c7q11",ch:7,t:"j",fs:6,q:"简述中共七届二中全会的主要内容。",
 kw:["工作重心","城市","两个务必","总任务"],
 ref:"①指出党的工作重心由乡村转移到城市；②分析了中国由农业国转变为工业国、由新民主主义社会转变为社会主义社会的总任务；③告诫全党务必保持谦虚谨慎、不骄不躁的作风，务必保持艰苦奋斗的作风（「两个务必」）；④确定了党在全国胜利后的一系列基本政策。",p:["七届二中全会"]},
{id:"c7q12",ch:7,t:"l",fs:10,q:"试述中国新民主主义革命胜利的基本经验。",
 kw:["中国共产党","领导","武装斗争","统一战线","人民群众","马克思列宁主义"],
 ref:"①加强和改进党的建设，中国共产党的领导是革命胜利的根本保证；②坚持武装斗争，走农村包围城市、武装夺取政权的道路；③建立广泛的革命统一战线，团结一切可以团结的力量；④紧紧依靠人民群众，获得群众的拥护和支持；⑤把马克思列宁主义基本原理与中国实际相结合。",p:["革命胜利经验"]},

{id:"c7q13",ch:7,t:"s",q:"1947年5月，国统区学生「反饥饿、反内战、反迫害」游行遭镇压，史称",o:["五二零惨案","「一二·一」惨案","「二七」惨案","「五卅」惨案"],a:"A",x:"1947年5月20日国民党当局镇压学生游行，制造五二零惨案，国统区的第二条战线逐渐形成。",p:["第二条战线"]},
{id:"c7q14",ch:7,t:"s",q:"1946年5月，中共中央发布的《五四指示》，决定将抗战时期的减租减息政策改变为",o:["没收地主土地分配给农民","土地国有化","土地集体化","平均地权"],a:"A",x:"《五四指示》规定采取适当方法使地主占有之土地转移到农民手中，实现耕者有其田。",p:["土地改革"]},
{id:"c7q15",ch:7,t:"s",q:"1949年4月23日，人民解放军解放的城市是",o:["北平","南京","上海","广州"],a:"B",x:"1949年4月21日渡江战役开始，4月23日解放南京，宣告国民党反动统治的覆灭。",p:["渡江战役"]},
{id:"c7q16",ch:7,t:"s",q:"1949年10月1日，在开国大典上宣告中华人民共和国中央人民政府成立的人是",o:["毛泽东","周恩来","刘少奇","朱德"],a:"A",x:"1949年10月1日毛泽东在天安门城楼庄严宣告中华人民共和国中央人民政府成立。",p:["新中国诞生"]},
{id:"c7q17",ch:7,t:"s",q:"平津战役中，率部接受和平改编、促成北平和平解放的国民党将领是",o:["傅作义","卫立煌","杜聿明","陈诚"],a:"A",x:"1949年1月31日北平和平解放，国民党华北「剿总」总司令傅作义率部接受和平改编。",p:["三大战役"]},
{id:"c7q18",ch:7,t:"s",q:"1947年6月，揭开人民解放军战略进攻序幕的军事行动是",o:["刘邓大军挺进大别山","孟良崮战役","辽沈战役","陈谢大军挺进豫西"],a:"A",x:"1947年6月底刘伯承、邓小平率晋冀鲁豫野战军主力千里跃进大别山，揭开战略进攻的序幕。",p:["战略进攻"]},
{id:"c7q19",ch:7,t:"s",q:"抗战胜利后，一度鼓吹走介于国共之间的「中间路线」（第三条道路）的主要政治力量是",o:["中国民主同盟等中间党派","国民党","中国共产党","青年党"],a:"A",x:"以民盟为代表的中间党派曾主张走「中间路线」，但在国民党迫害下此路不通，民盟被迫解散后逐步转向革命。",p:["第三条道路"]},
{id:"c7q20",ch:7,t:"j",fs:6,q:"简述三大战役胜利的历史意义。",
 kw:["三大战役","歼灭","主力","军事力量","解放"],
 ref:"辽沈、淮海、平津三大战役（1948年9月至1949年1月）共歼灭国民党军主力154万余人，基本上消灭了国民党赖以维持其反动统治的主要军事力量，东北、华北、华东等广大地区基本解放，为解放全中国奠定了基础。",p:["三大战役"]},

/* ================= 第八章 ================= */
{id:"c8q1",ch:8,t:"s",real:true,src:"2015年4月真题",q:"1950年6月，中共七届三中全会确定当时的中心任务是",o:["进行土地改革","开展抗美援朝","恢复国民经济","争取国家财政经济状况的基本好转"],a:"D",x:"1950年6月七届三中全会确定当时全党和全国人民的中心任务是要在三年左右争取国家财政经济状况的基本好转。",p:["国民经济恢复"]},
{id:"c8q2",ch:8,t:"s",real:true,src:"2016年4月真题",q:"农业合作化运动中，具有完全社会主义性质的组织形式是",o:["互助组","初级农业生产合作社","高级农业生产合作社","人民公社"],a:"C",x:"农业社会主义改造经历了互助组、初级社、高级社三个阶段，高级社具有完全的社会主义集体所有制性质。",p:["社会主义改造"]},
{id:"c8q3",ch:8,t:"s",q:"《中国人民政治协商会议共同纲领》的历史作用是",o:["正式宪法","临时宪法","过渡时期宪法","组织法"],a:"B",x:"《共同纲领》在宪法颁布前起到临时宪法的作用，规定了新中国的国体和政体。",p:["《共同纲领》"]},
{id:"c8q4",ch:8,t:"s",q:"中国人民志愿军入朝作战，抗美援朝开始于",o:["1950年6月","1950年10月","1951年1月","1953年7月"],a:"B",x:"1950年10月中国人民志愿军入朝作战，抗美援朝、保家卫国。",p:["抗美援朝"]},
{id:"c8q5",ch:8,t:"s",q:"1950年颁布的《中华人民共和国土地改革法》规定实行",o:["农民土地所有制","地主土地所有制","集体土地所有制","国家土地所有制"],a:"A",x:"土地改革废除了地主阶级封建剥削的土地所有制，实行农民的土地所有制。",p:["土地改革"]},
{id:"c8q6",ch:8,t:"s",q:"新中国成立初期，在党政机关工作人员中开展的「三反」运动是指",o:["反贪污、反浪费、反官僚主义","反行贿、反偷税漏税、反盗骗国家财产","反贪污、反行贿、反偷工减料","反浪费、反偷工减料、反盗窃国家经济情报"],a:"A",x:"「三反」运动在党政机关开展，内容是反贪污、反浪费、反官僚主义。",p:["三反五反"]},
{id:"c8q7",ch:8,t:"s",q:"新中国成立初期，在私营工商业者中开展的「五反」运动不包括",o:["反行贿","反偷税漏税","反盗骗国家财产","反贪污"],a:"D",x:"「五反」是反行贿、反偷税漏税、反盗骗国家财产、反偷工减料、反盗窃国家经济情报，在私营工商业者中开展。",p:["三反五反"]},
{id:"c8q8",ch:8,t:"s",q:"党在过渡时期总路线的主体是",o:["实现对农业的社会主义改造","实现对资本主义工商业的社会主义改造","逐步实现国家的社会主义工业化","实现对个体手工业的社会主义改造"],a:"C",x:"过渡时期总路线即「一化三改」，主体是逐步实现国家的社会主义工业化，两翼是三大改造。",p:["过渡时期总路线"]},
{id:"c8q9",ch:8,t:"s",q:"第一个五年计划（1953—1957年）建设的重点是",o:["优先发展重工业","优先发展轻工业","优先发展农业","优先发展交通运输业"],a:"A",x:"「一五」计划集中主要力量优先发展重工业，建立国家工业化的初步基础。",p:["一五计划"]},
{id:"c8q10",ch:8,t:"s",q:"标志着社会主义基本制度在中国全面确立的事件是",o:["中华人民共和国的成立","第一个五年计划的完成","1956年社会主义改造基本完成","1954年宪法的颁布"],a:"C",x:"1956年社会主义改造基本完成，标志着社会主义基本制度在中国全面确立，中国进入社会主义初级阶段。",p:["社会主义制度确立"]},
{id:"c8q11",ch:8,t:"j",real:true,src:"2023年4月真题",fs:6,q:"简述《共同纲领》的作用、核心内容及其意义。",
 kw:["临时宪法","国体","政体","执政地位"],
 ref:"作用：在当时起着临时宪法的作用。\n核心内容：关于新中国国体和政体的规定，即中华人民共和国为新民主主义即人民民主主义的国家，实行工人阶级领导的、以工农联盟为基础的、团结各民主阶级和国内各民族的人民民主专政；国家政权属于人民。\n意义：从法律上正式确立了中国共产党在全国的执政地位。",p:["《共同纲领》"]},
{id:"c8q12",ch:8,t:"l",fs:10,q:"试述党在过渡时期总路线的内容和意义。",
 kw:["社会主义改造","社会主义工业化","农业","手工业","资本主义工商业","1953"],
 ref:"内容：1953年，党正式提出过渡时期总路线。从中华人民共和国成立到社会主义改造基本完成，这是一个过渡时期。党在过渡时期的总路线和总任务，是要在一个相当长的时期内，逐步实现国家的社会主义工业化（「一化」），并逐步实现国家对农业、手工业和资本主义工商业的社会主义改造（「三改」）。\n意义：总路线反映了历史的必然性，是「一化」和「三改」同时并举，在发展生产力的同时变革生产关系；到1956年三大改造基本完成，社会主义基本制度在中国全面确立，实现了中国历史上最深刻最伟大的社会变革。",p:["过渡时期总路线"]},

{id:"c8q13",ch:8,t:"s",q:"1953年7月《朝鲜停战协定》签订，其历史意义在于",o:["抗美援朝战争胜利结束","朝鲜半岛实现统一","美国放弃干涉朝鲜事务","中朝签订友好同盟条约"],a:"A",x:"1953年7月27日《朝鲜停战协定》签订，历时两年九个月的抗美援朝战争胜利结束。",p:["抗美援朝"]},
{id:"c8q14",ch:8,t:"s",q:"1951年，中央人民政府与西藏地方政府签订的协议，标志着西藏实现",o:["和平解放","民主改革","民族区域自治","对外开放"],a:"A",x:"1951年5月《关于和平解放西藏办法的协议》（《十七条协议》）签订，西藏和平解放，祖国大陆实现统一。",p:["西藏解放"]},
{id:"c8q15",ch:8,t:"s",q:"1954年9月，第一届全国人民代表大会第一次会议通过的《中华人民共和国宪法》是",o:["第一部社会主义类型的宪法","第一部资产阶级宪法","临时宪法","过渡时期宪法"],a:"A",x:"1954年宪法是我国第一部社会主义类型的宪法，以根本大法的形式确认了人民民主专政的国体和人民代表大会制度的政体。",p:["1954宪法"]},
{id:"c8q16",ch:8,t:"s",q:"我国对资本主义工商业进行社会主义改造所采取的政策是",o:["和平赎买","没收","强制没收","自愿入股"],a:"A",x:"对资本主义工商业采取和平赎买的政策，通过国家资本主义形式逐步实现所有制的变革，是社会主义改造的独创性经验。",p:["资本主义工商业改造"]},
{id:"c8q17",ch:8,t:"s",q:"我国农业社会主义改造（农业合作化）遵循的原则是",o:["自愿互利、典型示范、国家帮助","强迫命令、行政推动","先集体化后机械化","平均分配"],a:"A",x:"农业合作化坚持自愿互利、典型示范、国家帮助的原则，采取互助组、初级社、高级社的过渡形式。",p:["农业改造"]},
{id:"c8q18",ch:8,t:"s",q:"新中国成立初期，对国民党政府留下的官僚资本采取的政策是",o:["没收","和平赎买","公私合营","租赁经营"],a:"A",x:"新中国成立后立即没收官僚资本，在此基础上建立社会主义性质的国营经济，掌握了国家经济命脉。",p:["国民经济恢复"]},
{id:"c8q19",ch:8,t:"s",q:"新中国成立初期实行的外交三大方针是",o:["另起炉灶、打扫干净屋子再请客、一边倒","不结盟、不称霸、不干涉内政","和平共处、求同存异、独立自主","互通有无、平等互利、友好合作"],a:"A",x:"三大外交方针即「另起炉灶」「打扫干净屋子再请客」「一边倒」，为新中国外交奠定了基本格局。",p:["外交方针"]},
{id:"c8q20",ch:8,t:"l",fs:10,q:"试述我国对资本主义工商业进行社会主义改造的政策、途径和意义。",
 kw:["利用","限制","改造","和平赎买","公私合营","定息"],
 ref:"政策：对资本主义工商业实行利用、限制、改造的政策，通过和平赎买的办法实现所有制的变革，这是我国社会主义改造的独创性经验。\n途径：采取由低级到高级的国家资本主义过渡形式，即从委托加工、计划订货、统购包销、委托经销代销等初级形式，发展到个别企业的公私合营，再发展到全行业公私合营；对资本家实行「四马分肥」和定息制度，付给一定经济报酬。\n意义：1956年底对资本主义工商业的改造基本完成，实现了马克思主义经典作家关于和平赎买的设想，避免了激烈的社会震荡，促进了生产力的发展，标志着社会主义基本制度在中国全面确立。",p:["资本主义工商业改造"]},

/* ================= 第九章 ================= */
{id:"c9q1",ch:9,t:"s",real:true,src:"2016年4月真题",q:"《论十大关系》围绕的基本方针是",o:["统筹兼顾、适当安排","调动一切积极因素为社会主义事业服务","以农业为基础、工业为主导","自力更生为主、争取外援为辅"],a:"B",x:"1956年毛泽东发表《论十大关系》，确定的基本方针是调动一切积极因素为社会主义事业服务。",p:["《论十大关系》"]},
{id:"c9q2",ch:9,t:"s",real:true,src:"2021年4月真题",q:"在中共八大上提出「三个主体、三个补充」思想的领导人是",o:["毛泽东","刘少奇","周恩来","陈云"],a:"D",x:"陈云在八大上提出「三个主体、三个补充」的构想，在坚持计划经济前提下允许市场调节。",p:["中共八大"]},
{id:"c9q3",ch:9,t:"s",real:true,src:"2021年4月真题",q:"1966—1976年发生的全局性、长时间的「左」倾严重错误是",o:["「大跃进」运动","人民公社化运动","「文化大革命」","「批林批孔」运动"],a:"C",x:"「文化大革命」（1966—1976年）使党、国家和人民遭到新中国成立以来最严重的挫折和损失。",p:["文化大革命"]},
{id:"c9q4",ch:9,t:"s",q:"中共八大指出，社会主义改造完成后国内的主要矛盾是",o:["工人阶级和资产阶级的矛盾","人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","敌我矛盾"],a:"B",x:"八大正确分析了国内主要矛盾，指出已不再是无产阶级同资产阶级的矛盾，而是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。",p:["中共八大"]},
{id:"c9q5",ch:9,t:"s",q:"1957年，毛泽东发表《关于正确处理人民内部矛盾的问题》，提出要",o:["正确处理人民内部矛盾","以阶级斗争为纲","抓革命促生产","调整巩固充实提高"],a:"A",x:"该著作系统阐述了社会主义社会基本矛盾理论，提出正确处理人民内部矛盾是国家政治生活的主题。",p:["人民内部矛盾"]},
{id:"c9q6",ch:9,t:"s",q:"1958年发动「大跃进」和人民公社化运动，其特点不包括",o:["高指标","瞎指挥","浮夸风","按劳分配"],a:"D",x:"「大跃进」和人民公社化运动中出现了高指标、瞎指挥、浮夸风和「共产风」等「左」倾错误。",p:["大跃进"]},
{id:"c9q7",ch:9,t:"s",q:"1964年，中国取得的重大科技成就是",o:["第一颗原子弹爆炸成功","第一颗氢弹爆炸成功","第一颗人造地球卫星发射成功","首次载人航天飞行成功"],a:"A",x:"1964年10月中国第一颗原子弹爆炸成功；1967年氢弹爆炸成功；1970年「东方红一号」卫星发射成功。",p:["两弹一星"]},
{id:"c9q8",ch:9,t:"s",q:"1971年，中国在外交上取得的重大胜利是",o:["中美建交","恢复在联合国的合法席位","中日邦交正常化","加入世界贸易组织"],a:"B",x:"1971年10月第26届联合国大会通过决议，恢复中华人民共和国在联合国的一切合法权利。",p:["外交成就"]},
{id:"c9q9",ch:9,t:"s",q:"1962年初，为初步总结「大跃进」以来的经验教训而召开的重要会议是",o:["七千人大会","中共八大","庐山会议","八届十中全会"],a:"A",x:"1962年1—2月中央召开七千人大会（扩大的中央工作会议），初步总结了「大跃进」以来的经验教训。",p:["探索曲折"]},
{id:"c9q10",ch:9,t:"s",q:"下列各项中，不属于社会主义建设探索时期取得成就的是",o:["建立独立完整的工业体系和国民经济体系","「两弹一星」取得成功","恢复在联合国的合法席位","全面建成小康社会"],a:"D",x:"全面建成小康社会是党的十八大以来新时代取得的成就。前三项均为1956—1976年社会主义建设探索时期取得的成就。",p:["建设成就"]},
{id:"c9q11",ch:9,t:"j",fs:6,q:"简述中共八大的主要内容和历史意义。",
 kw:["主要矛盾","经济文化","任务","工业化","陈云"],
 ref:"①正确分析了社会主义改造完成后国内主要矛盾的变化，指出主要矛盾是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾；②确定党和全国人民的主要任务是集中力量发展社会生产力，实现国家工业化；③陈云提出「三个主体、三个补充」的构想。\n意义：八大路线是正确的，为社会主义建设指明了方向，是探索中国自己的社会主义建设道路的良好开端。",p:["中共八大"]},
{id:"c9q12",ch:9,t:"l",fs:10,q:"试述1956—1976年社会主义建设在探索中取得的主要成就。",
 kw:["工业体系","国民经济体系","两弹一星","石油","联合国"],
 ref:"①建立了独立的、比较完整的工业体系和国民经济体系，从根本上解决了工业化「从无到有」的问题；②科技方面取得重大突破，「两弹一星」的成功增强了国防实力；③大庆油田开发，摘掉了「贫油国」的帽子，石油工业迅猛发展；④外交方面，恢复在联合国的合法席位，实现中美关系正常化、中日邦交正常化；⑤这些成就为改革开放和社会主义现代化建设奠定了物质技术基础。",p:["建设成就"]},

{id:"c9q13",ch:9,t:"s",q:"1956年，毛泽东提出的繁荣社会主义科学文化的方针是",o:["百花齐放、百家争鸣","古为今用、洋为中用","推陈出新、百花齐放","文艺为人民服务"],a:"A",x:"1956年4月毛泽东提出「百花齐放、百家争鸣」方针，促进了科学文化事业的繁荣发展。",p:["双百方针"]},
{id:"c9q14",ch:9,t:"s",q:"1964年底，周恩来在三届全国人大一次会议上提出的宏伟目标是",o:["实现工业、农业、国防和科学技术现代化","实现「三步走」发展战略","建立社会主义市场经济体制","全面建成小康社会"],a:"A",x:"1964年底周恩来在政府工作报告中正式提出，要在不太长的历史时期内把我国建设成为一个具有现代工业、现代农业、现代国防和现代科学技术的社会主义强国。",p:["建设成就"]},
{id:"c9q15",ch:9,t:"s",q:"20世纪60年代，为摘掉中国「贫油国」帽子作出重大贡献的是",o:["大庆油田的开发和建设","宝钢的投产","成昆铁路的建成","葛洲坝工程开工"],a:"A",x:"1960年大庆油田开始大规模开发，结束了中国石油依赖进口的历史，涌现出「铁人」王进喜等劳动模范。",p:["建设成就"]},
{id:"c9q16",ch:9,t:"s",q:"1972年9月，访华并推动中日两国实现邦交正常化的日本首相是",o:["田中角荣","大平正芳","中曾根康弘","三木武夫"],a:"A",x:"1972年9月日本首相田中角荣访华，中日两国发表联合声明，实现邦交正常化。",p:["外交成就"]},
{id:"c9q17",ch:9,t:"s",q:"中美两国正式建立外交关系是在",o:["1972年","1975年","1979年","1982年"],a:"C",x:"1972年尼克松访华发表《上海公报》，1979年1月1日中美两国正式建交。",p:["外交成就"]},
{id:"c9q18",ch:9,t:"s",q:"20世纪60年代，带病坚持治理内涝、风沙、盐碱「三害」，被誉为「县委书记的榜样」的是",o:["焦裕禄","孔繁森","王进喜","雷锋"],a:"A",x:"焦裕禄在担任河南兰考县委书记期间，身患肝癌仍坚持工作，被人民群众誉为「县委书记的榜样」。",p:["建设成就"]},
{id:"c9q19",ch:9,t:"s",q:"「文化大革命」留下的深刻教训不包括",o:["必须反对个人崇拜","必须坚持民主集中制","必须健全社会主义民主和法制","必须坚持以阶级斗争为纲"],a:"D",x:"「文化大革命」恰恰说明不能把阶级斗争扩大化、绝对化，必须坚持以经济建设为中心。",p:["文化大革命"]},
{id:"c9q20",ch:9,t:"j",fs:6,q:"简述「文化大革命」的历史教训。",
 kw:["阶级斗争","个人崇拜","民主集中制","法制","实事求是"],
 ref:"①必须正确认识和处理社会主义社会中的阶级斗争问题，不能把阶级斗争扩大化、绝对化，坚持以经济建设为中心；②必须反对个人崇拜，坚持民主集中制和集体领导制度；③必须发展社会主义民主，健全社会主义法制；④必须加强党的自身建设，坚持实事求是的思想路线；⑤必须科学评价历史人物，正确处理党内矛盾和人民内部矛盾。",p:["文化大革命"]},

{id:"c10q1",ch:10,t:"s",real:true,src:"2015年4月真题",q:"1988年，我国建立的第三个经济特区是",o:["深圳","珠海","厦门","海南"],a:"D",x:"1980年设立深圳、珠海、汕头、厦门四个经济特区，1988年海南建省并成为经济特区。",p:["经济特区"]},

{id:"c10q3",ch:10,t:"s",real:true,src:"2016年4月真题",q:"我国对外开放进入新阶段的标志是",o:["加入亚太经合组织","加入世界贸易组织","设立经济特区","开发开放浦东"],a:"B",x:"2001年12月中国正式加入世界贸易组织（WTO），标志着对外开放进入新阶段。",p:["对外开放"]},
{id:"c10q4",ch:10,t:"s",q:"1978年关于真理标准问题大讨论的核心观点是",o:["两个凡是","实践是检验真理的唯一标准","以阶级斗争为纲","发展是硬道理"],a:"B",x:"真理标准问题大讨论冲破了「两个凡是」的束缚，为十一届三中全会实现伟大转折作了思想准备。",p:["真理标准讨论"]},
{id:"c10q5",ch:10,t:"s",q:"中共十一届三中全会召开的时间和地位是",o:["1976年10月，拨乱反正","1978年12月，党的历史上具有深远意义的伟大转折","1982年9月，开创现代化建设新局面","1978年5月，思想解放"],a:"B",x:"1978年12月十一届三中全会果断停止「以阶级斗争为纲」，作出把党和国家工作重心转移到经济建设上来、实行改革开放的历史性决策，是党的历史上具有深远意义的伟大转折。",p:["十一届三中全会"]},
{id:"c10q6",ch:10,t:"s",q:"我国农村改革率先突破，实行家庭联产承包责任制最早开始于",o:["江苏华西村","安徽凤阳县小岗村","广东深圳","河南小岗村"],a:"B",x:"1978年底安徽凤阳小岗村农民率先实行包产到户，拉开了农村改革的序幕。",p:["农村改革"]},
{id:"c10q7",ch:10,t:"s",q:"1980年，我国设立的经济特区不包括",o:["深圳","珠海","汕头","海南"],a:"D",x:"1980年设立深圳、珠海、汕头、厦门四个经济特区，海南经济特区设立于1988年。",p:["经济特区"]},
{id:"c10q8",ch:10,t:"s",q:"1992年，中共十四大确立的经济体制改革目标是",o:["建立计划经济体制","建立社会主义市场经济体制","建立有计划的商品经济","实行单一的公有制"],a:"B",x:"1992年10月十四大明确提出我国经济体制改革的目标是建立社会主义市场经济体制。",p:["十四大"]},
{id:"c10q9",ch:10,t:"s",q:"中国对香港恢复行使主权的时间是",o:["1997年7月1日","1999年12月20日","1997年12月20日","1999年7月1日"],a:"A",x:"1997年7月1日中国政府对香港恢复行使主权，设立香港特别行政区，提出「一国两制」方针。",p:["祖国统一"]},
{id:"c10q10",ch:10,t:"s",q:"系统提出社会主义初级阶段理论和「三步走」发展战略的会议是",o:["中共十二大","中共十三大","中共十四大","中共十五大"],a:"B",x:"1987年中共十三大系统阐述了社会主义初级阶段理论，提出「三步走」发展战略和党在初级阶段的基本路线。",p:["十三大"]},
{id:"c10q11",ch:10,t:"j",fs:6,q:"简述中共十一届三中全会的主要内容及其历史意义。",
 kw:["1978","解放思想","工作重心","经济建设","改革开放","转折"],
 ref:"1978年12月，中共十一届三中全会在北京召开。主要内容：①冲破「两个凡是」的束缚，重新确立解放思想、实事求是的思想路线；②果断停止使用「以阶级斗争为纲」的口号，把党和国家工作重心转移到经济建设上来；③作出实行改革开放的历史性决策；④审查和解决了一批重大冤假错案。\n历史意义：实现了新中国成立以来党的历史上具有深远意义的伟大转折，开启了改革开放和社会主义现代化建设的新时期。",p:["十一届三中全会"]},
{id:"c10q12",ch:10,t:"l",fs:10,q:"试述邓小平南方谈话的主要内容和意义。",
 kw:["解放生产力","计划","市场","发展才是硬道理","改革","步伐"],
 ref:"主要内容：①社会主义的本质是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕；②计划和市场都是经济手段，不是社会主义与资本主义的本质区别，要加快改革步伐，建立社会主义市场经济体制；③「发展才是硬道理」，抓住时机发展自己；④坚持党的基本路线一百年不动摇；⑤两手抓，两手都要硬。\n意义：科学总结了党的十一届三中全会以来的基本实践和基本经验，回答了长期束缚人们思想的许多重大认识问题，把改革开放和现代化建设推进到新阶段。",p:["南方谈话"]},

{id:"c10q13",ch:10,t:"s",q:"1979年3月，邓小平在理论工作务虚会上提出，实现四个现代化必须坚持四项基本原则，其中核心是",o:["坚持共产党的领导","坚持社会主义道路","坚持人民民主专政","坚持马列主义毛泽东思想"],a:"A",x:"四项基本原则是立国之本，其中坚持共产党的领导是核心，是实现四个现代化的根本保证。",p:["四项基本原则"]},
{id:"c10q14",ch:10,t:"s",q:"1982年9月，邓小平在中共十二大开幕词中首次提出的命题是",o:["建设有中国特色的社会主义","社会主义初级阶段理论","建立社会主义市场经济体制","「一国两制」构想"],a:"A",x:"十二大提出「建设有中国特色的社会主义」的重大命题，成为指引改革开放和现代化建设的旗帜。",p:["十二大"]},
{id:"c10q15",ch:10,t:"s",q:"「一国两制」科学构想，最初是针对哪一问题提出的",o:["台湾问题","香港问题","澳门问题","钓鱼岛问题"],a:"A",x:"「一国两制」构想最早是为解决台湾问题而提出，后首先成功运用于解决香港、澳门问题。",p:["一国两制"]},
{id:"c10q16",ch:10,t:"s",q:"1990年，中共中央、国务院作出开发开放决策的地区是",o:["上海浦东","天津滨海","深圳前海","广州南沙"],a:"A",x:"1990年4月中央决定开发开放上海浦东，成为20世纪90年代中国改革开放的重点。",p:["对外开放"]},
{id:"c10q17",ch:10,t:"s",q:"1997年9月，中共十五大确立的党的指导思想是",o:["邓小平理论","「三个代表」重要思想","科学发展观","习近平新时代中国特色社会主义思想"],a:"A",x:"十五大把邓小平理论确立为党的指导思想并写入党章。",p:["十五大"]},
{id:"c10q18",ch:10,t:"s",q:"2002年11月，中共十六大确立的党的指导思想是",o:["邓小平理论","「三个代表」重要思想","科学发展观","习近平新时代中国特色社会主义思想"],a:"B",x:"十六大把「三个代表」重要思想确立为党的指导思想并写入党章。",p:["十六大"]},
{id:"c10q19",ch:10,t:"s",q:"2007年10月，中共十七大全面阐述并写入党章的重大战略思想是",o:["科学发展观","构建社会主义和谐社会","创新驱动发展战略","乡村振兴战略"],a:"A",x:"十七大全面阐述了科学发展观的科学内涵、精神实质和根本要求，并将其写入党章。",p:["十七大"]},
{id:"c10q20",ch:10,t:"j",fs:6,q:"简述「一国两制」方针的基本内容和历史实践。",
 kw:["社会主义制度","资本主义制度","长期不变","1997","1999"],
 ref:"基本内容：在祖国统一的前提下，国家的主体坚持社会主义制度，同时在台湾、香港、澳门保持原有的资本主义制度和生活方式长期不变。\n历史实践：1997年7月1日中国对香港恢复行使主权，1999年12月20日对澳门恢复行使主权，香港、澳门回归祖国并保持繁荣稳定，充分证明「一国两制」是解决祖国统一问题的正确方针。",p:["一国两制"]},

/* ================= 第十一章 ================= */
{id:"c11q1",ch:11,t:"s",real:true,src:"2022年10月真题",q:"中共十九大指出，我国社会主要矛盾已经转化为",o:["人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","无产阶级与资产阶级的矛盾"],a:"A",x:"十九大报告指出，我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。",p:["社会主要矛盾"]},
{id:"c11q2",ch:11,t:"s",q:"中华民族伟大复兴的中国梦的基本内涵是",o:["国家富强、民族振兴、人民幸福","独立自主、和平发展、合作共赢","实现工业化、城镇化、现代化","共同富裕、公平正义、自由平等"],a:"A",x:"中国梦的基本内涵是国家富强、民族振兴、人民幸福。",p:["中国梦"]},

{id:"c11q9",ch:11,t:"s",q:"2021年7月1日，庆祝中国共产党成立100周年大会上宣告",o:["实现中华民族伟大复兴","全面建成小康社会，实现第一个百年奋斗目标","基本实现社会主义现代化","建成社会主义现代化强国"],a:"B",x:"2021年7月1日，习近平庄严宣告：我们实现了第一个百年奋斗目标，在中华大地上全面建成了小康社会。",p:["全面小康"]},
{id:"c11q10",ch:11,t:"s",q:"中共二十大提出，新时代新征程中国共产党的中心任务是以中国式现代化",o:["全面推进中华民族伟大复兴","全面实现社会主义现代化","全面建成社会主义现代化强国","全面实现共同富裕"],a:"A",x:"二十大报告指出：从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。",p:["中国式现代化"]},
{id:"c11q11",ch:11,t:"j",fs:6,q:"简述「五位一体」总体布局和「四个全面」战略布局的内容。",
 kw:["经济","政治","文化","社会","生态文明","全面"],
 ref:"「五位一体」总体布局：经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体。\n「四个全面」战略布局：全面建成小康社会、全面深化改革、全面依法治国、全面从严治党。\n二者共同构成新时代坚持和发展中国特色社会主义的总体布局和战略布局，为实现中华民族伟大复兴提供了行动指南。",p:["五位一体","四个全面"]},
{id:"c11q12",ch:11,t:"l",fs:10,q:"试述中国特色社会主义进入新时代的主要依据和伟大意义。",
 kw:["十八大","十九大","主要矛盾","新时代","中华民族伟大复兴","习近平新时代中国特色社会主义思想"],
 ref:"主要依据：①党的十八大以来，党和国家事业取得历史性成就、发生历史性变革；②我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾；③十九大作出中国特色社会主义进入新时代的重大政治论断。\n伟大意义：①意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃；②意味着科学社会主义在21世纪的中国焕发出强大生机活力；③意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径；④习近平新时代中国特色社会主义思想成为党的行动指南，为实现中华民族伟大复兴提供了根本遵循。",p:["新时代"]},
{id:"c11q13",ch:11,t:"s",q:"党的十八届五中全会提出的新发展理念是",o:["创新、协调、绿色、开放、共享","改革、发展、稳定、和谐、共赢","富强、民主、文明、和谐、美丽","自由、平等、公正、法治、爱国"],a:"A",x:"新发展理念即创新、协调、绿色、开放、共享五大发展理念，是关系我国发展全局的一场深刻变革。",p:["新发展理念"]},
{id:"c11q14",ch:11,t:"s",q:"2013年，习近平提出共建「一带一路」倡议，指的是",o:["丝绸之路经济带和21世纪海上丝绸之路","长江经济带和京津冀协同发展","西部大开发和东北振兴","粤港澳大湾区和长三角一体化"],a:"A",x:"「一带一路」即「丝绸之路经济带」和「21世纪海上丝绸之路」，是推动构建人类命运共同体的重要实践平台。",p:["一带一路"]},
{id:"c11q15",ch:11,t:"s",q:"2012年12月，开启全面从严治党新征程的重要举措是",o:["中央八项规定","「三严三实」专题教育","「不忘初心、牢记使命」主题教育","设立国家监察委员会"],a:"A",x:"2012年12月中共中央政治局审议通过中央八项规定，从作风建设抓起，开启全面从严治党新征程。",p:["全面从严治党"]},
{id:"c11q16",ch:11,t:"s",q:"2013年11月，中共十八届三中全会提出全面深化改革的总目标是",o:["完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化","全面建成社会主义现代化强国","实现中华民族伟大复兴","建立社会主义市场经济体制"],a:"A",x:"十八届三中全会把完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化作为全面深化改革的总目标。",p:["全面深化改革"]},
{id:"c11q17",ch:11,t:"s",q:"2019年10月，中共十九届四中全会研究的主题是",o:["坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化","制定「十四五」规划和二〇三五年远景目标","全面建设社会主义现代化国家","新时代坚持和发展中国特色社会主义"],a:"A",x:"十九届四中全会专题研究坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化问题并作出重要决定。",p:["制度建设"]},
{id:"c11q18",ch:11,t:"s",q:"习近平提出建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界，这一外交理念被称为",o:["构建人类命运共同体","结伴而不结盟","新型国际关系","全球发展倡议"],a:"A",x:"构建人类命运共同体是习近平外交思想的重要内容，已多次写入联合国相关决议。",p:["大国外交"]},
{id:"c11q19",ch:11,t:"s",q:"中共十九大提出的新时代坚持和发展中国特色社会主义的基本方略是",o:["「十四个坚持」","「八个明确」","「五位一体」总体布局","「四个全面」战略布局"],a:"A",x:"十九大提出「八个明确」「十四个坚持」，其中「十四个坚持」构成新时代坚持和发展中国特色社会主义的基本方略。",p:["十九大"]},
{id:"c11q20",ch:11,t:"j",fs:6,q:"简述「两个一百年」奋斗目标的内容。",
 kw:["2021","全面建成小康社会","2049","现代化强国","中华民族伟大复兴"],
 ref:"「两个一百年」奋斗目标：第一个百年奋斗目标，即到中国共产党成立一百年（2021年）时全面建成小康社会；第二个百年奋斗目标，即到新中国成立一百年（2049年）时，把我国建成富强民主文明和谐美丽的社会主义现代化强国，实现中华民族伟大复兴。现在第一个百年奋斗目标已经如期实现，全党正团结带领人民为实现第二个百年奋斗目标而奋斗。",p:["两个一百年"]},

{id:"c1q80",ch:1,t:"s",q:"资本—帝国主义对中国的侵略始终没有能够灭亡中国，一个重要原因是",o:["中国人民的英勇反抗","中国经济实力强大","列强相互妥协退让","清政府顽强抵抗"],a:"A",x:"中国人民的英勇反抗是帝国主义始终不能灭亡中国的根本原因（重要原因）。",p:["反侵略斗争"]},
{id:"c1q81",ch:1,t:"s",q:"近代中国反侵略战争失败的重要原因之一是",o:["经济技术的落后","社会制度的先进","武器装备的先进","战略战术的得当"],a:"A",x:"经济技术落后是反侵略战争失败的重要原因，社会制度腐败是根本原因。",p:["反侵略失败原因"]},
{id:"c1q82",ch:1,t:"s",q:"近代中国反侵略战争失败的根本原因——社会制度腐败，其主要表现是",o:["统治者腐败无能、压制民众反抗、军事上妥协退让","军事指挥得当","人民支持抗战","武器装备精良"],a:"A",x:"社会制度腐败表现为统治者腐败无能、压制民众反抗、军事上妥协退让。",p:["反侵略失败原因"]},
{id:"c1q83",ch:1,t:"s",q:"关于近代中国反侵略战争失败的原因，下列说法正确的是",o:["社会制度腐败是根本原因，经济技术落后是重要原因","经济技术落后是根本原因，社会制度腐败是重要原因","主要是武器弹药不足所致","主要是军队数量不足所致"],a:"A",x:"反侵略战争失败，社会制度腐败是根本原因，经济技术落后是重要原因。",p:["反侵略失败原因"]},
{id:"c1q84",ch:1,t:"s",q:"近代中国「开眼看世界」的第一批人是",o:["林则徐、魏源等","康有为、梁启超","孙中山、黄兴","曾国藩、李鸿章"],a:"A",x:"鸦片战争后，林则徐、魏源等开始睁眼看世界，是开眼看世界的第一批人。",p:["民族意识觉醒"]},
{id:"c1q85",ch:1,t:"s",q:"《海国图志》的作者是",o:["魏源","林则徐","严复","龚自珍"],a:"A",x:"《海国图志》是魏源1843年编纂完成，提出「师夷长技以制夷」的主张。",p:["民族意识觉醒"]},
{id:"c1q86",ch:1,t:"s",q:"严复翻译《天演论》的用意在于",o:["以「物竞天择」的进化论警醒国人、宣传变法图强","介绍西方科学技术","宣扬封建伦理纲常","反对向西方学习"],a:"A",x:"严复翻译《天演论》，以「物竞天择」的进化论警醒国人，宣传变法图强。",p:["民族意识觉醒"]},
{id:"c1q87",ch:1,t:"s",q:"1895年，严复发表《救亡决论》，响亮喊出的口号是",o:["救亡","振兴中华","师夷长技以制夷","自强求富"],a:"A",x:"严复在《救亡决论》中第一次响亮地喊出「救亡」的口号，推动民族意识觉醒。",p:["民族意识觉醒"]},
{id:"c1q88",ch:1,t:"s",q:"甲午战争后，中国人民的民族意识普遍觉醒，其集中表现是",o:["救亡图存成为时代主旋律","学习西方科技成为共识","发展民族工业成为潮流","改革封建礼教成为运动"],a:"A",x:"甲午战争惨败后，救亡图存成为时代主旋律，民族意识普遍觉醒。",p:["民族意识觉醒"]},
{id:"c1q89",ch:1,t:"s",q:"1894年，孙中山在《上李鸿章书》中提出的富强主张是",o:["人尽其才，地尽其利，物尽其用，货畅其流","师夷长技以制夷","中学为体，西学为用","自强求富，求才育才"],a:"A",x:"孙中山《上李鸿章书》提出「人尽其才，地尽其利，物尽其用，货畅其流」富强主张。",p:["民族意识觉醒"]},
{id:"c1q90",ch:1,t:"s",q:"主张与外国进行「商战」、著有《盛世危言》的早期维新思想家是",o:["郑观应","马建忠","王韬","薛福成"],a:"A",x:"郑观应著《盛世危言》，主张与外国进行「商战」，是早期维新思想代表。",p:["民族意识觉醒"]},
{id:"c1q91",ch:1,t:"j",fs:6,q:"简述中国封建社会的基本特点。",
 kw:["自然经济","高度中央集权","儒家思想","宗法等级"],
 ref:"中国封建社会的基本特点：在经济上，自给自足的自然经济占主导地位，地主土地所有制居于支配地位；在政治上，实行高度中央集权的封建君主专制制度；在文化上，儒家思想占统治地位，并与佛、道思想相互渗透；在社会结构上，形成族权和政权相结合的封建宗法等级制度，其核心是宗族家长制。",p:["社会性质"]},
{id:"c1q92",ch:1,t:"j",fs:6,q:"简述资本—帝国主义列强对近代中国侵略的主要方式。",
 kw:["军事侵略","政治控制","经济掠夺","文化渗透"],
 ref:"资本—帝国主义列强对近代中国的侵略方式是多样的：军事侵略，发动侵略战争，屠杀人民，抢掠财富，侵占领土，勒索赔款；政治控制，控制中国内政外交，把持中国海关，镇压中国人民反抗；经济掠夺，向中国倾销商品、掠夺原料，进行资本输出，控制中国财政经济命脉；文化渗透，进行宗教渗透、创办学校、传播殖民思想，奴化中国人民。",p:["侵略中国"]},
{id:"c1q93",ch:1,t:"j",fs:6,q:"简述《马关条约》的主要内容。",
 kw:["割让台湾","2亿两白银","沙市","开设工厂"],
 ref:"《马关条约》的主要内容：割让台湾全岛及所有附属各岛屿和澎湖列岛给日本；赔偿日本军费2亿两白银；开放沙市、重庆、苏州、杭州为通商口岸；允许日本在中国通商口岸开设工厂。",p:["不平等条约"]},
{id:"c1q94",ch:1,t:"j",fs:6,q:"简述《辛丑条约》的主要内容。",
 kw:["4.5亿两白银","东交民巷","使馆区","大沽炮台"],
 ref:"《辛丑条约》的主要内容：清政府赔款4.5亿两白银，分39年还清，本息合计约9.8亿两；划定北京东交民巷为使馆区，各国可以驻兵，中国人不得居住；拆毁大沽炮台及北京至大沽沿途的炮台，外国军队可驻扎在北京至山海关铁路沿线要地；惩办义和团运动中参加反帝斗争的官员，永远禁止中国人民成立或参加反帝性质的组织。",p:["不平等条约"]},
{id:"c1q95",ch:1,t:"j",fs:6,q:"简述近代中国半殖民地半封建社会的基本特点。",
 kw:["决定性力量","封建地主土地所有制","民族资本主义","极不平衡","世界所少见"],
 ref:"近代中国半殖民地半封建社会的基本特点：资本—帝国主义侵略势力成为支配中国的决定性力量；中国封建势力与帝国主义相勾结，成为帝国主义统治中国的支柱；自然经济的基础遭到破坏，但封建地主土地所有制依然保持；民族资本主义有所发展，但始终没有成为中国社会经济的主要形式；中国经济政治发展极不平衡；中国人民贫困和不自由的程度，是世界所少见的。",p:["社会性质"]},
{id:"c1q96",ch:1,t:"j",fs:6,q:"简述近代中国反侵略战争失败的原因。",
 kw:["社会制度腐败","根本原因","经济技术落后","重要原因"],
 ref:"近代中国反侵略战争屡遭失败：社会制度腐败是根本原因，清王朝统治者腐败无能，压制民众，妥协退让，才使中国屡战屡败；经济技术落后是重要原因，中国的武器装备、军事技术等远逊于侵略者；社会制度腐败导致经济技术落后，经济技术落后又加剧了反侵略斗争的失败。",p:["反侵略失败原因"]},
{id:"c1q97",ch:1,t:"l",fs:10,q:"试述资本—帝国主义对中国的侵略及其严重后果。",
 kw:["军事侵略","政治控制","经济掠夺","文化渗透","半殖民地"],
 ref:"资本—帝国主义对中国的侵略是全面的：军事侵略，先后发动第一次鸦片战争、第二次鸦片战争、中法战争、甲午战争、八国联军侵华战争等，屠杀中国人民，抢掠财富，侵占领土，勒索巨额赔款；政治控制，控制清政府内政外交，把持中国海关，镇压中国人民反抗，扶植反动势力；经济掠夺，通过商品倾销、原料掠夺、资本输出，控制中国财政经济命脉，阻碍中国民族经济发展；文化渗透，通过宗教渗透、创办学校、传播殖民思想，奴化中国人民。\n资本—帝国主义的侵略，使中国主权遭到严重破坏，中国逐步沦为半殖民地半封建社会，给中国人民带来深重灾难，也使中国丧失了走向独立富强的发展机遇。近代以来中国人民的反侵略斗争证明，只有坚决反抗侵略，才能维护国家主权和民族独立。",p:["侵略中国"]},
{id:"c1q98",ch:1,t:"l",fs:10,q:"试述近代中国社会的主要矛盾及其相互关系。",
 kw:["帝国主义和中华民族","封建主义和人民大众","最主要的矛盾","交织"],
 ref:"近代中国社会的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，其中帝国主义和中华民族的矛盾是最主要的矛盾。\n两对矛盾的相互关系：两对主要矛盾相互交织，帝国主义勾结封建势力共同压榨中国人民，封建势力是帝国主义统治中国的工具和支柱；不同时期两对矛盾的表现不同，某一时期帝国主义和中华民族的矛盾突出，某一时期封建主义和人民大众的矛盾突出；近代中国社会的发展和演变，正是在这两对主要矛盾交互作用下进行的。",p:["主要矛盾"]},
{id:"c1q99",ch:1,t:"l",fs:10,q:"试述近代中国社会性质、主要矛盾与两大历史任务之间的关系。",
 kw:["半殖民地半封建","主要矛盾","社会性质","两大历史任务"],
 ref:"社会性质：鸦片战争后，中国逐步沦为半殖民地半封建社会，这是近代中国最基本的国情。主要矛盾：半殖民地半封建的社会性质，决定了近代中国社会的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，其中帝国主义和中华民族的矛盾是最主要的矛盾。两大历史任务：近代中国社会的主要矛盾，决定了近代中国的两大历史任务，即求得民族独立和人民解放，实现国家繁荣富强和人民共同富裕。三者关系：社会性质决定主要矛盾，主要矛盾决定历史任务；只有认清社会性质，才能认清主要矛盾和主要任务，才能找到解决中国问题的出路。",p:["社会性质","主要矛盾","历史任务"]},
{id:"c1q100",ch:1,t:"l",fs:10,q:"试述近代中国人民的反侵略斗争及其历史意义。",
 kw:["三元里","爱国官兵","义和团","瓜分","反侵略"],
 ref:"近代中国人民进行了英勇的反侵略斗争：人民群众的反侵略斗争，如1841年三元里人民的抗英斗争，是近代中国人民第一次大规模的反侵略武装斗争；甲午战争后台湾军民进行了反割台斗争；义和团运动提出「扶清灭洋」口号，沉重打击了帝国主义瓜分中国的野心。爱国官兵的反侵略斗争，如关天培在虎门、陈化成在吴淞、左宝贵在平壤、邓世昌在黄海、聂士成在天津等战役中英勇抗敌、壮烈牺牲。\n反侵略斗争的历史意义：沉重打击了资本—帝国主义的侵华野心，粉碎了列强瓜分中国的图谋；教育了中国人民，促进了中华民族的觉醒，是帝国主义始终不能灭亡中国的根本原因（重要原因）；表现了中国人民不畏强暴、反抗侵略的爱国精神，为后来的民族解放斗争树立了榜样。",p:["反侵略斗争"]},

/* ================= 第二章 ================= */
{id:"c2q35",ch:2,t:"s",q:"太平天国农民运动的发动者和最高领导人是",o:["洪秀全","杨秀清","冯云山","石达开"],a:"A",x:"1851年洪秀全在金田村发动起义建号太平天国，是太平天国运动的最高领导人。",p:["太平天国"]},
{id:"c2q36",ch:2,t:"s",q:"1851年，洪秀全发动金田起义的地点是",o:["广西桂平县金田村","广东花县","湖南长沙","湖北武昌"],a:"A",x:"1851年1月洪秀全在广西桂平县金田村发动起义，建号太平天国。",p:["太平天国"]},
{id:"c2q37",ch:2,t:"s",q:"下列不属于洪秀全早期撰写的宣传农民革命思想著作的是",o:["《原道救世歌》","《原道醒世训》","《原道觉世训》","《资政新篇》"],a:"D",x:"洪秀全撰有《原道救世歌》等三篇，《资政新篇》是洪仁玕提出的改革方案。",p:["太平天国"]},
{id:"c2q38",ch:2,t:"s",q:"太平天国农民战争最终失败的时间是",o:["1856年","1861年","1864年","1895年"],a:"C",x:"1864年7月天京被湘军攻陷，太平天国农民战争最终失败。",p:["太平天国"]},
{id:"c2q39",ch:2,t:"s",q:"太平天国军事上达到全盛时期是在",o:["1853年","1854年","1856年上半年","1860年"],a:"C",x:"定都天京后太平军进行北伐西征，至1856年上半年军事上达到全盛。",p:["太平天国"]},
{id:"c2q40",ch:2,t:"s",q:"1856年天京事变中，被韦昌辉杀害的太平天国东王是",o:["杨秀清","韦昌辉","石达开","秦日纲"],a:"A",x:"1856年天京事变爆发，东王杨秀清及其部下惨遭杀害，太平天国由盛转衰。",p:["太平天国"]},
{id:"c2q41",ch:2,t:"s",q:"天京事变后，支撑太平天国后期军事局面的主要将领是",o:["石达开和陈玉成","陈玉成和李秀成","洪仁玕和陈玉成","李秀成和石达开"],a:"B",x:"天京事变后太平天国后期主要依靠陈玉成、李秀成支撑军事局面。",p:["太平天国"]},
{id:"c2q42",ch:2,t:"s",q:"《天朝田亩制度》的核心内容是",o:["废除封建地主土地所有制","发展资本主义工商业","兴办新式学堂","建立资产阶级共和国"],a:"A",x:"《天朝田亩制度》以解决农民土地问题为核心，主张废除封建地主土地所有制。",p:["太平天国"]},
{id:"c2q43",ch:2,t:"s",q:"《天朝田亩制度》规定的土地分配办法是",o:["按人口平均分配土地","按劳动力分配土地","按阶级地位分配土地","按纳税多少分配土地"],a:"A",x:"《天朝田亩制度》规定「凡天下田，天下人同耕」，按人口平均分配土地。",p:["太平天国"]},
{id:"c2q44",ch:2,t:"s",q:"《资政新篇》的提出者是",o:["洪秀全","洪仁玕","陈玉成","李秀成"],a:"B",x:"1859年洪仁玕提出《资政新篇》，是带有资本主义色彩的改革方案。",p:["太平天国"]},
{id:"c2q45",ch:2,t:"s",q:"《资政新篇》在经济方面主张",o:["发展近代工矿、交通、邮政、金融等事业","按人口平均分配土地","兴办洋务军用工业","实行君主立宪制度"],a:"A",x:"《资政新篇》主张学习西方，发展近代工矿交通邮政金融等资本主义事业。",p:["太平天国"]},
{id:"c2q46",ch:2,t:"s",q:"《天朝田亩制度》设计的理想社会蓝图是",o:["有田同耕、有饭同食的理想社会","资产阶级民主共和国","君主立宪国家","军阀割据的王国"],a:"A",x:"《天朝田亩制度》设计了「有田同耕，有饭同食」的绝对平均主义理想社会。",p:["太平天国"]},
{id:"c2q47",ch:2,t:"s",q:"太平天国后期，为屏障天京而进行的重大战役是",o:["安庆保卫战","天京保卫战","镇南关战役","三河大捷"],a:"A",x:"1861年安庆保卫战失败，安庆失陷，天京失去屏障，太平天国更加困难。",p:["太平天国"]},
{id:"c2q48",ch:2,t:"s",q:"太平天国金田起义爆发于",o:["广东","广西","湖南","江西"],a:"B",x:"1851年1月洪秀全在广西桂平县金田村发动起义，建号太平天国。",p:["太平天国"]},
{id:"c2q49",ch:2,t:"s",q:"太平天国起义之初实行的一切财物归公、按需分配的制度是",o:["圣库制度","乡官制度","保甲制度","科举制度"],a:"A",x:"太平天国实行圣库制度，一切财物归公，体现了平均主义的社会理想。",p:["太平天国"]},
{id:"c2q50",ch:2,t:"s",q:"洋务运动兴起于",o:["19世纪40年代","19世纪60年代","19世纪80年代","19世纪90年代"],a:"B",x:"洋务运动兴起于19世纪60年代，是洋务派发动的自救运动。",p:["洋务运动"]},
{id:"c2q51",ch:2,t:"s",q:"洋务运动兴起的直接目的是",o:["挽救清政府的统治危机","发展民族资本主义","抵御外国资本主义侵略","实现君主立宪"],a:"A",x:"洋务运动是在内忧外患背景下为挽救清政府统治危机而兴起的自救运动。",p:["洋务运动"]},
{id:"c2q52",ch:2,t:"s",q:"1861年，曾国藩创办的近代军事工业是",o:["安庆内军械所","江南制造总局","福州船政局","天津机器局"],a:"A",x:"1861年曾国藩创办安庆内军械所，是洋务派兴办最早的近代军事工业。",p:["洋务运动"]},
{id:"c2q53",ch:2,t:"s",q:"洋务运动时期，左宗棠创办的近代军事工业是",o:["福州船政局","江南制造总局","天津机器局","湖北枪炮厂"],a:"A",x:"1866年左宗棠创办福州船政局，是当时规模较大的造船工厂。",p:["洋务运动"]},
{id:"c2q54",ch:2,t:"s",q:"洋务运动后期，李鸿章创办的著名民用企业是",o:["轮船招商局","开平矿务局","汉阳铁厂","湖北织布局"],a:"A",x:"19世纪70年代李鸿章创办轮船招商局，是洋务派兴办的第一个民用企业。",p:["洋务运动"]},
{id:"c2q55",ch:2,t:"s",q:"洋务运动时期，民用企业普遍采取的经营方式是",o:["官督商办","完全官办","完全商办","中外合办"],a:"A",x:"洋务派兴办的民用企业多采取官督商办方式，由商人出资、官府管理。",p:["洋务运动"]},
{id:"c2q56",ch:2,t:"s",q:"1888年，清政府正式建成的近代海军是",o:["北洋海军","南洋水师","福建水师","广东水师"],a:"A",x:"1888年清政府正式建立北洋海军，是洋务运动中实力最强的近代海军。",p:["洋务运动"]},
{id:"c2q57",ch:2,t:"s",q:"1895年甲午战争中，北洋海军全军覆没的地点是",o:["威海卫","旅顺","大连","大东沟"],a:"A",x:"1895年2月北洋海军在威海卫全军覆没，标志着洋务运动的破产。",p:["洋务运动"]},
{id:"c2q58",ch:2,t:"s",q:"洋务运动时期，为培养海军人才创办的新式学堂是",o:["天津水师学堂","京师同文馆","南洋公学","万木草堂"],a:"A",x:"洋务运动时期创办天津水师学堂等，专门培养海军与造船人才。",p:["洋务运动"]},
{id:"c2q59",ch:2,t:"s",q:"洋务运动的性质是",o:["封建地主阶级的自救运动","资产阶级的政治改良运动","农民阶级的反封建运动","无产阶级领导的革命运动"],a:"A",x:"洋务运动是洋务派在不触动封建制度前提下学习西方技术的自救运动。",p:["洋务运动"]},
{id:"c2q60",ch:2,t:"s",q:"洋务运动失败的根本原因是",o:["封建制度的束缚","外国资本主义的压制","缺乏先进技术","经费严重不足"],a:"A",x:"洋务运动失败的根本原因是封建制度的束缚，不改变封建制度无法自强。",p:["洋务运动"]},
{id:"c2q61",ch:2,t:"s",q:"洋务运动的兴办在客观上产生的重要影响是",o:["促进了中国早期工业和民族资本主义的产生","实现了国家的富强","推翻了封建制度","结束了外国对华侵略"],a:"A",x:"洋务运动客观上促进了中国早期工业和民族资本主义的产生与发展。",p:["洋务运动"]},
{id:"c2q62",ch:2,t:"s",q:"洋务运动时期，清政府派遣的第一批留学生前往的国家是",o:["美国","英国","日本","德国"],a:"A",x:"1872年起清政府派遣幼童赴美留学，是中国近代官派留学生的开端。",p:["洋务运动"]},
{id:"c2q63",ch:2,t:"s",q:"「中学为体，西学为用」中，所谓「体」指的是",o:["封建制度及其纲常名教","西方近代先进技术","资产阶级民主制度","西方政治学说"],a:"A",x:"「体」指中国的封建制度和纲常名教，即在不触动封建制度的前提下学西方。",p:["洋务运动"]},
{id:"c2q64",ch:2,t:"s",q:"长期担任直隶总督兼北洋大臣、主持洋务运动的地方代表是",o:["李鸿章","曾国藩","左宗棠","张之洞"],a:"A",x:"李鸿章长期任直隶总督兼北洋大臣，兴办了江南制造总局、轮船招商局等。",p:["洋务运动"]},
{id:"c2q65",ch:2,t:"s",q:"甲午战争后，清政府被迫与日本签订的不平等条约是",o:["《马关条约》","《南京条约》","《北京条约》","《辛丑条约》"],a:"A",x:"1895年清政府签订《马关条约》，割地赔款，洋务运动随之破产。",p:["洋务运动"]},
{id:"c2q66",ch:2,t:"s",q:"洋务运动后期，以「求富」为口号主要兴办的是",o:["民用工业","军用工业","新式海军","新式学堂"],a:"A",x:"洋务运动后期以「求富」为口号兴办民用工业，如轮船招商局等。",p:["洋务运动"]},
{id:"c2q67",ch:2,t:"s",q:"康有为宣传维新变法思想的著作是",o:["《新学伪经考》和《孔子改制考》","《仁学》和《变法通议》","《天演论》和《劝学篇》","《校邠庐抗议》和《盛世危言》"],a:"A",x:"康有为著《新学伪经考》《孔子改制考》，借经学宣传变法维新思想。",p:["戊戌维新"]},
{id:"c2q68",ch:2,t:"s",q:"1895年，康有为、梁启超在北京创办的宣传变法的报刊是",o:["《万国公报》（后改名《中外纪闻》）","《时务报》","《国闻报》","《湘学报》"],a:"A",x:"1895年康有为在北京创办《万国公报》，后改名《中外纪闻》宣传变法。",p:["戊戌维新"]},
{id:"c2q69",ch:2,t:"s",q:"1895年，康有为等在北京成立的维新派政治团体是",o:["强学会","保国会","兴中会","同盟会"],a:"A",x:"1895年康有为在北京成立强学会，是维新派的重要政治团体。",p:["戊戌维新"]},
{id:"c2q70",ch:2,t:"s",q:"百日维新期间，光绪帝在文化教育方面采取的主要措施是",o:["废除八股、改试策论、兴办学堂","废除科举制度","推行义务教育","停办新式学堂"],a:"A",x:"百日维新期间废除八股取士、改试策论，兴办新式学堂、设立京师大学堂。",p:["戊戌维新"]},
{id:"c2q71",ch:2,t:"s",q:"戊戌政变后，慈禧太后将光绪帝囚禁于",o:["中南海瀛台","颐和园","乾清宫","热河行宫"],a:"A",x:"戊戌政变后光绪帝被囚禁于中南海瀛台，慈禧太后重新临朝训政。",p:["戊戌维新"]},
{id:"c2q72",ch:2,t:"s",q:"戊戌政变后写下「我自横刀向天笑，去留肝胆两昆仑」诗句、英勇就义的是",o:["谭嗣同","康广仁","林旭","刘光第"],a:"A",x:"谭嗣同就义前吟出此诗，他是戊戌六君子中影响最大的人物。",p:["戊戌维新"]},
{id:"c2q73",ch:2,t:"s",q:"标志着戊戌维新运动失败的历史事件是",o:["戊戌政变","公车上书","强学会被查封","《时务报》被停刊"],a:"A",x:"1898年9月慈禧太后发动戊戌政变，维新运动被镇压，戊戌维新失败。",p:["戊戌维新"]},
{id:"c2q74",ch:2,t:"s",q:"戊戌维新运动失败的根本原因是",o:["维新派自身力量弱小和资产阶级的软弱性","封建顽固势力过于强大","帝国主义列强的干涉","民众不支持变法"],a:"A",x:"维新派力量弱小，只依靠没有实权的皇帝，反映出资产阶级的软弱性。",p:["戊戌维新"]},
{id:"c2q75",ch:2,t:"s",q:"戊戌维新时期，翻译《天演论》、宣传「物竞天择，适者生存」的思想家是",o:["严复","康有为","梁启超","谭嗣同"],a:"A",x:"严复翻译赫胥黎《天演论》，宣传进化论，为维新运动提供了思想武器。",p:["戊戌维新"]},
{id:"c2q76",ch:2,t:"s",q:"百日维新期间，光绪帝下令设立的近代中国最高学府是",o:["京师大学堂","京师同文馆","北洋西学学堂","清华学堂"],a:"A",x:"1898年光绪帝批准设立京师大学堂，是戊戌变法的成果之一。",p:["戊戌维新"]},
{id:"c2q77",ch:2,t:"s",q:"1895年公车上书的历史意义在于",o:["拉开了维新变法运动的序幕","推翻了清政府的统治","建立了资产阶级共和国","结束了封建专制制度"],a:"A",x:"公车上书冲破了清廷「士人不得干政」的禁令，拉开维新运动序幕。",p:["戊戌维新"]},
{id:"c2q78",ch:2,t:"s",q:"戊戌维新运动所依靠的核心力量是",o:["没有实权的皇帝光绪帝","广大人民群众","外国列强","地方军阀"],a:"A",x:"维新派寄希望于没有实权的光绪帝，缺乏群众基础，是其失败的重要原因。",p:["戊戌维新"]},
{id:"c2q79",ch:2,t:"s",q:"洋务运动和戊戌维新运动失败的一个共同原因是",o:["都没有触动封建制度的根基","都缺乏先进阶级的领导","都遭到农民起义的打击","都缺少外国的支持"],a:"A",x:"洋务运动固守封建制度只学技术，维新运动不敢触动封建制度根基。",p:["戊戌维新"]},
{id:"c2q80",ch:2,t:"s",q:"太平天国、洋务运动、戊戌维新相继失败给我们的历史启示是",o:["农民阶级、地主阶级、资产阶级维新派都不能领导中国革命取得胜利","中国必须走资本主义道路","必须坚持闭关锁国政策","封建制度可以自我完善"],a:"A",x:"三大运动失败证明，农民阶级、地主阶级和维新派由于自身局限都不能领导中国革命胜利。",p:["戊戌维新"]},
{id:"c2q81",ch:2,t:"s",q:"戊戌维新运动最突出的历史贡献是",o:["起到了思想启蒙的作用","推翻了清王朝","建立了资产阶级共和国","促进了民族资本主义的迅速发展"],a:"A",x:"戊戌维新运动虽然失败，但宣传了资产阶级新思想，起到思想启蒙作用。",p:["戊戌维新"]},
{id:"c2q82",ch:2,t:"s",q:"太平天国、洋务运动、戊戌维新运动发生的共同时代背景是",o:["中国逐渐沦为半殖民地半封建社会","资本主义在中国高度发展","无产阶级力量已经壮大","中国建立了民主共和制度"],a:"A",x:"三大运动都发生在中国逐步沦为半殖民地半封建社会的背景下。",p:["戊戌维新"]},
{id:"c2q83",ch:2,t:"s",q:"太平天国后期，由外国侵略者组建、帮助清政府镇压太平军的武装是",o:["洋枪队","八国联军","英法联军","义勇军"],a:"A",x:"太平天国后期外国侵略者组织洋枪队等武装，与清政府联合绞杀太平军。",p:["太平天国"]},
{id:"c2q84",ch:2,t:"s",q:"太平天国运动最终失败于中外反动势力的联合绞杀，其中镇压太平天国的主要清军是",o:["湘军和淮军","八旗军","绿营兵","北洋军"],a:"A",x:"曾国藩的湘军和李鸿章的淮军是镇压太平天国农民战争的主要军事力量。",p:["太平天国"]},
{id:"c2q85",ch:2,t:"s",q:"洋务派创办军事工业的主要目的是",o:["镇压农民起义、加强国防力量","发展民族资本主义","传播西方文化","实现君主立宪"],a:"A",x:"洋务派兴办军事工业，既为镇压农民起义，也为加强国防力量。",p:["洋务运动"]},
{id:"c2q86",ch:2,t:"s",q:"1895年公车上书的直接起因是",o:["《马关条约》签订的消息传到北京","光绪帝颁布变法诏令","《辛丑条约》的签订","八国联军入侵北京"],a:"A",x:"1895年《马关条约》签订的消息传到北京，康有为联合举人上书请求变法。",p:["戊戌维新"]},
{id:"c2q87",ch:2,t:"j",fs:6,q:"简述《天朝田亩制度》的主要内容及其评价。",
kw:["土地问题","按人口平均分配","绝对平均主义"],
ref:"《天朝田亩制度》以解决农民土地问题为中心，规定「凡天下田，天下人同耕」，按人口平均分配土地，并设计了「有田同耕，有饭同食，有衣同穿，有钱同使」的理想社会蓝图。它集中反映了农民阶级要求废除封建土地所有制的强烈愿望，是太平天国最具代表性的纲领性文件；但它主张绝对平均主义，具有空想性，未能付诸实施。",p:["太平天国"]},
{id:"c2q88",ch:2,t:"j",fs:6,q:"简述《资政新篇》的主要内容及其意义。",
kw:["洪仁玕","学习西方","资本主义","未能付诸实施"],
ref:"《资政新篇》是洪仁玕于1859年提出的改革方案，主张学习西方资本主义，政治上加强中央集权，经济上发展近代工矿、交通、邮政、金融等事业，文化上兴办学校、提倡科学技术。它是中国近代史上第一个比较系统的资本主义改革方案，具有进步意义，但未能付诸实施。",p:["太平天国"]},
{id:"c2q89",ch:2,t:"j",fs:6,q:"简述天京事变及其影响。",
kw:["杨秀清","韦昌辉","石达开","由盛转衰"],
ref:"1856年9月，太平天国领导集团发生内讧。东王杨秀清逼封万岁，洪秀全密令韦昌辉、秦日纲等回京，韦昌辉滥杀杨秀清及其部下，随后石达开起兵讨伐韦昌辉，天京事变方告平息。天京事变使太平天国领导核心分裂、力量严重削弱，成为太平天国由盛转衰的转折点。",p:["太平天国"]},
{id:"c2q90",ch:2,t:"j",fs:6,q:"简述百日维新（戊戌新政）的主要内容。",
kw:["政治","经济","文教","军事"],
ref:"1898年6月11日光绪帝颁布「明定国是」诏书，宣布变法。新政内容包括：政治方面，准许臣民上书言事、裁撤闲散衙门；经济方面，设立农工商局、提倡兴办实业；文教方面，废除八股、改试策论、兴办学堂、设立京师大学堂；军事方面，裁汰绿营、训练新式军队。这些措施触犯了守旧势力的利益，9月21日慈禧太后发动政变，变法失败。",p:["戊戌维新"]},
{id:"c2q91",ch:2,t:"j",fs:6,q:"简述公车上书及戊戌维新运动的兴起。",
kw:["马关条约","上书","强学会","序幕"],
ref:"1895年《马关条约》签订的消息传到北京，康有为联合各省应试举人上书光绪帝，反对签订和约、请求变法图强，史称「公车上书」，由此拉开了维新运动的序幕。此后康有为等在北京创办《万国公报》、成立强学会，各地学会和报刊纷纷兴起，维新思潮广泛传播，推动了戊戌维新运动的兴起。",p:["戊戌维新"]},
{id:"c2q92",ch:2,t:"l",fs:10,q:"试述《天朝田亩制度》与《资政新篇》的异同。",
kw:["天朝田亩制度","资政新篇","土地问题","资本主义","空想性"],
ref:"相同点：二者都是太平天国提出的纲领性文件，都反映了太平天国领导人改造社会的愿望。不同点：①《天朝田亩制度》以解决土地问题为核心，主张废除封建土地所有制、按人口平均分配土地，体现了农民阶级绝对平均主义的理想，具有空想性；②《资政新篇》主张学习西方、发展资本主义，是带有资本主义色彩的改革方案，反映了时代发展的新方向；③《天朝田亩制度》代表农民阶级的利益，《资政新篇》则更接近资产阶级的改革主张。二者的空想性和时代局限决定了它们都未能付诸实施。",p:["太平天国"]},
{id:"c2q93",ch:2,t:"l",fs:10,q:"试述洋务运动的兴起、主要内容和历史作用。",
kw:["19世纪60年代","自强","求富","军用工业","民用工业","早期工业"],
ref:"洋务运动兴起于19世纪60年代，是在内忧外患的背景下，洋务派为挽救清政府统治危机而发起的自救运动。主要内容：①以「自强」为口号兴办军用工业，如安庆内军械所、江南制造总局、福州船政局；②以「求富」为口号兴办民用工业，如轮船招商局、开平矿务局、汉阳铁厂；③筹建新式海军，1888年正式建成北洋海军；④创办新式学堂、派遣留学生。历史作用：客观上促进了中国早期工业和民族资本主义的产生发展，为近代化积累了一定的物质和人才条件；但由于以「中学为体，西学为用」为指导，没有触动封建制度，最终以甲午战争失败而破产。",p:["洋务运动"]},
{id:"c2q94",ch:2,t:"l",fs:10,q:"试述戊戌维新运动失败的原因和教训。",
kw:["软弱","皇帝","顽固势力","改良主义"],
ref:"失败原因：①维新派自身力量弱小，只依靠没有实权的皇帝光绪帝，没有发动和依靠广大人民群众；②资产阶级维新派具有软弱性和妥协性，不敢触动封建制度的根基；③封建顽固势力十分强大，以慈禧太后为首的守旧派发动政变，镇压了变法。教训：戊戌维新的失败表明，资产阶级改良主义道路在中国行不通，不推翻封建专制制度，单靠自上而下的改良无法实现国家的独立富强，中国资产阶级无法领导民主革命走向胜利。",p:["戊戌维新"]},
{id:"c2q95",ch:2,t:"l",fs:10,q:"试述太平天国农民战争、洋务运动、戊戌维新运动失败的共同原因和历史启示。",
kw:["阶级局限性","封建制度","不彻底性","先进阶级"],
ref:"共同原因：太平天国失败的根本原因是农民阶级的阶级局限性，缺乏先进阶级的领导；洋务运动失败的根本原因是封建制度的束缚，只学习西方技术而不触动封建制度；戊戌维新运动失败的根本原因是资产阶级维新派的软弱性，仅依靠没有实权的皇帝、不敢触动封建制度根基。三个运动都具有不彻底性，都没有提出并坚持彻底的反帝反封建纲领，最终被中外反动势力或封建顽固势力镇压。历史启示：农民阶级、地主阶级洋务派和资产阶级维新派都不能领导中国革命取得胜利，中国近代民族民主革命的胜利必须有先进阶级及其政党的领导。",p:["戊戌维新"]},

{id:"c3q35",ch:3,t:"s",q:"同盟会成立后发动的第一次武装起义是",o:["萍浏醴起义","黄花岗起义","武昌起义","镇南关起义"],a:"A",x:"1906年同盟会发动萍浏醴起义，是同盟会成立后发动的第一次武装起义。",p:["革命组织"]},
{id:"c3q36",ch:3,t:"s",q:"1907年，孙中山亲自领导、一度攻占炮台的广西起义是",o:["镇南关起义","惠州起义","河口起义","浙皖起义"],a:"A",x:"1907年12月孙中山领导镇南关起义，起义军一度攻占镇南关炮台。",p:["革命组织"]},
{id:"c3q37",ch:3,t:"s",q:"1908年，同盟会在云南发动的起义是",o:["河口起义","镇南关起义","钦廉防城起义","浙皖起义"],a:"A",x:"1908年同盟会发动云南河口起义，是孙中山领导的西南起义之一。",p:["革命组织"]},
{id:"c3q38",ch:3,t:"s",q:"1907年，光复会成员徐锡麟、秋瑾筹划发动、事败牺牲的起义是",o:["浙皖起义","广州起义","惠州起义","河口起义"],a:"A",x:"1907年徐锡麟在安庆、秋瑾在绍兴密谋起义，事败被杀，史称浙皖起义。",p:["革命组织"]},
{id:"c3q39",ch:3,t:"s",q:"三民主义中，民族主义的内容是",o:["驱除鞑虏，恢复中华","创立民国","平均地权","建立责任内阁"],a:"A",x:"民族主义即「驱除鞑虏，恢复中华」，推翻清政府，实现民族独立。",p:["三民主义"]},
{id:"c3q40",ch:3,t:"s",q:"三民主义中，民生主义的核心是",o:["平均地权","核定地价","节制资本","耕者有其田"],a:"A",x:"民生主义的核心是平均地权，主张核定地价、涨价归公。",p:["三民主义"]},
{id:"c3q41",ch:3,t:"s",q:"孙中山把同盟会纲领概括为民族主义、民权主义、民生主义，是在",o:["《民报》发刊词中","《三民主义》演讲中","《建国方略》中","《中国问题的真解决》中"],a:"A",x:"1905年孙中山在《民报》发刊词中将同盟会纲领概括为三大主义。",p:["三民主义"]},

{id:"c3q43",ch:3,t:"s",q:"三民主义的历史地位是",o:["比较完整而明确的资产阶级民主革命纲领","无产阶级的革命纲领","地主阶级的改良纲领","农民阶级的反封建纲领"],a:"A",x:"三民主义是比较完整而明确的资产阶级民主革命纲领，推动了革命运动发展。",p:["三民主义"]},

{id:"c3q46",ch:3,t:"s",q:"1905—1907年革命派与改良派论战的阵地分别是",o:["《民报》与《新民丛报》","《时务报》与《国闻报》","《新青年》与《每周评论》","《湘学报》与《时务报》"],a:"A",x:"革命派以《民报》、改良派以《新民丛报》为阵地进行论战。",p:["革命论战"]},
{id:"c3q47",ch:3,t:"s",q:"革命派与改良派论战的历史意义在于",o:["使民主革命思想得到广泛传播","推翻了清王朝","建立了共和国","完成了反帝反封建任务"],a:"A",x:"论战划清了革命与改良的界限，使民主革命思想得到广泛传播。",p:["革命论战"]},
{id:"c3q48",ch:3,t:"s",q:"在论战中，改良派反对以革命手段推翻清政府，主张",o:["实行君主立宪","建立民主共和","平均地权","彻底反帝"],a:"A",x:"改良派主张保留清政府、实行君主立宪，与革命派的主张根本对立。",p:["革命论战"]},
{id:"c3q49",ch:3,t:"s",q:"邹容宣传民主革命思想的著作是",o:["《革命军》","《警世钟》","《猛回头》","《驳康有为论革命书》"],a:"A",x:"邹容撰写《革命军》，热情歌颂革命，宣传民主共和思想。",p:["革命论战"]},
{id:"c3q50",ch:3,t:"s",q:"陈天华宣传革命思想的著作是",o:["《警世钟》和《猛回头》","《革命军》","《驳康有为论革命书》","《中国问题的真解决》"],a:"A",x:"陈天华著《警世钟》《猛回头》，以通俗文字宣传反帝反封建思想。",p:["革命论战"]},
{id:"c3q51",ch:3,t:"s",q:"1904年，孙中山发表的号召推翻清王朝统治的著作是",o:["《中国问题的真解决》","《建国方略》","《实业计划》","《民权初步》"],a:"A",x:"1904年孙中山发表《中国问题的真解决》，指出必须用革命推翻清政府。",p:["革命论战"]},
{id:"c3q52",ch:3,t:"s",q:"武昌起义前夕，在湖北新军中发展革命力量的革命团体是",o:["文学社和共进会","兴中会和华兴会","光复会和同盟会","科学补习所和日知会"],a:"A",x:"武昌起义前文学社和共进会在新军中发展力量，为起义准备了条件。",p:["辛亥革命"]},
{id:"c3q53",ch:3,t:"s",q:"武昌起义后，湖北军政府推举的都督是",o:["黎元洪","孙中山","黄兴","宋教仁"],a:"A",x:"武昌起义后成立湖北军政府，推举原清军协统黎元洪为都督。",p:["辛亥革命"]},

{id:"c3q56",ch:3,t:"s",q:"武昌起义后，清政府被迫重新起用的内阁总理大臣是",o:["袁世凯","奕䜣","载沣","张之洞"],a:"A",x:"武昌起义后清政府被迫起用袁世凯为内阁总理大臣，由其处理军政事务。",p:["辛亥革命"]},
{id:"c3q57",ch:3,t:"s",q:"《中华民国临时约法》规定，中华民国的主权属于",o:["国民全体","大总统","国会","各省都督"],a:"A",x:"《临时约法》规定中华民国的主权属于国民全体，确立民主共和原则。",p:["辛亥革命"]},
{id:"c3q58",ch:3,t:"s",q:"《中华民国临时约法》颁布的时间是",o:["1912年3月","1912年1月","1911年10月","1913年3月"],a:"A",x:"1912年3月临时参议院通过《中华民国临时约法》，随后正式公布。",p:["辛亥革命"]},
{id:"c3q59",ch:3,t:"s",q:"《中华民国临时约法》规定实行的政体是",o:["责任内阁制","总统制","君主立宪制","委员会制"],a:"A",x:"为限制袁世凯专权，《临时约法》规定实行责任内阁制。",p:["辛亥革命"]},

{id:"c3q61",ch:3,t:"s",q:"武昌起义后，孙中山于1911年12月自海外回国抵达的城市是",o:["上海","广州","南京","北京"],a:"A",x:"1911年12月25日孙中山从海外回到上海，随后被推举为临时大总统。",p:["辛亥革命"]},

{id:"c3q63",ch:3,t:"s",q:"辛亥革命最主要的历史功绩是",o:["推翻了清王朝，结束了封建君主专制制度","使中国实现了独立富强","完成了反帝反封建任务","建立了社会主义制度"],a:"A",x:"辛亥革命推翻了清王朝，结束了统治中国两千多年的封建君主专制制度。",p:["辛亥革命"]},
{id:"c3q64",ch:3,t:"s",q:"辛亥革命没有改变中国半殖民地半封建社会的性质，这说明",o:["资产阶级共和国方案在中国行不通","中国必须走封建老路","帝国主义支持中国独立","无产阶级已经发展成熟"],a:"A",x:"辛亥革命的失败证明，资产阶级共和国方案在中国行不通。",p:["辛亥革命"]},
{id:"c3q65",ch:3,t:"s",q:"辛亥革命对近代中国社会产生的深远影响是",o:["使民主共和观念深入人心","彻底消除了封建思想","实现了男女完全平等","确立了社会主义制度"],a:"A",x:"辛亥革命使民主共和观念深入人心，是一次深刻的思想解放运动。",p:["辛亥革命"]},

{id:"c3q69",ch:3,t:"s",q:"1915年12月，袁世凯宣布接受帝制，改国号为",o:["中华帝国","大清帝国","中华民国","共和国"],a:"A",x:"1915年12月袁世凯接受帝制，改国号为中华帝国，年号洪宪。",p:["护国运动"]},
{id:"c3q70",ch:3,t:"s",q:"护国运动的主要发起人是",o:["蔡锷","孙中山","黄兴","李烈钧"],a:"A",x:"1915年底蔡锷等在云南宣布独立，组织护国军讨袁，发起护国运动。",p:["护国运动"]},
{id:"c3q71",ch:3,t:"s",q:"护国运动中，首先宣布独立的省份是",o:["云南","广西","广东","贵州"],a:"A",x:"1915年12月25日蔡锷、唐继尧等宣布云南独立，护国运动爆发。",p:["护国运动"]},
{id:"c3q72",ch:3,t:"s",q:"袁世凯复辟帝制的结果是",o:["在全国人民反对下被迫取消帝制","成功复辟","得到列强全力支持","建立君主立宪制"],a:"A",x:"护国运动兴起后袁世凯被迫于1916年3月取消帝制，不久死去。",p:["护国运动"]},
{id:"c3q73",ch:3,t:"s",q:"1917年，张勋拥清废帝溥仪复辟，最终被粉碎的经过是",o:["段祺瑞出兵讨伐，复辟失败","复辟得到全国支持","复辟取得成功","外国干涉导致失败"],a:"A",x:"1917年7月张勋复辟，段祺瑞组织讨逆军进京，复辟仅十二天即失败。",p:["护法运动"]},
{id:"c3q74",ch:3,t:"s",q:"护法运动的口号是",o:["拥护《临时约法》，恢复国会","打倒帝国主义","平均地权","建立革命根据地"],a:"A",x:"1917年孙中山举起拥护《临时约法》、恢复国会的旗帜发动护法运动。",p:["护法运动"]},
{id:"c3q75",ch:3,t:"s",q:"第一次护法运动失败的主要原因是",o:["西南军阀的排挤和破坏","帝国主义出兵干涉","袁世凯的镇压","革命党人内讧"],a:"A",x:"1918年孙中山受西南军阀排挤辞职离粤，第一次护法运动失败。",p:["护法运动"]},
{id:"c3q76",ch:3,t:"s",q:"1922年第二次护法运动失败后，孙中山深刻认识到",o:["依靠军阀的革命道路走不通","革命已经取得成功","应当继续依靠军阀","应当放弃革命斗争"],a:"A",x:"1922年陈炯明叛乱导致第二次护法运动失败，孙中山认识到依靠军阀行不通。",p:["护法运动"]},
{id:"c3q77",ch:3,t:"s",q:"辛亥革命后，中国政治最突出的局面是",o:["军阀割据和混战","国家统一富强","民主共和巩固","帝国主义退出中国"],a:"A",x:"辛亥革命后北洋军阀分裂割据、混战不已，中国陷入军阀统治的黑暗时期。",p:["护法运动"]},
{id:"c3q78",ch:3,t:"s",q:"袁世凯死后，北洋军阀分裂为三大派系，即",o:["直系、皖系、奉系","粤系、桂系、滇系","湘系、鄂系、豫系","川系、黔系、滇系"],a:"A",x:"袁世凯死后北洋军阀分裂为皖系、直系、奉系三大派系，割据混战。",p:["护法运动"]},
{id:"c3q79",ch:3,t:"s",q:"第一次世界大战期间，中国民族资本主义获得进一步发展的主要原因是",o:["列强暂时放松了对中国的侵略","清政府的大力扶持","辛亥革命的彻底胜利","外国资本大量涌入"],a:"A",x:"一战期间列强忙于战争、放松对华侵略，中国民族资本主义获得进一步发展。",p:["辛亥革命"]},
{id:"c3q80",ch:3,t:"s",q:"二次革命、护国运动、护法运动的相继失败说明",o:["旧民主主义革命的道路在中国走不通","革命已经胜利","帝国主义支持孙中山","封建势力已经瓦解"],a:"A",x:"辛亥革命后一系列斗争的失败说明，资产阶级领导的旧民主主义革命道路行不通。",p:["护法运动"]},
{id:"c3q81",ch:3,t:"s",q:"资产阶级革命派从事革命活动的主要方式是",o:["组织武装起义和宣传民主革命思想","单纯上书请愿","依靠农民起义","投靠外国列强"],a:"A",x:"革命派以组织武装起义、宣传民主革命思想为主要活动方式。",p:["革命组织"]},
{id:"c3q82",ch:3,t:"s",q:"1894年孙中山上书李鸿章遭到冷遇后，转而",o:["走上革命道路","继续改良","投靠清政府","出国经商"],a:"A",x:"1894年孙中山上书李鸿章遭冷遇，遂赴檀香山创立兴中会，走上革命道路。",p:["革命组织"]},
{id:"c3q83",ch:3,t:"s",q:"中国同盟会成立的历史意义在于",o:["使全国性资产阶级民主革命有了统一的领导核心","立即推翻了清政府","结束了军阀混战","完成了革命任务"],a:"A",x:"同盟会的成立使全国性资产阶级民主革命有了统一的领导核心。",p:["革命组织"]},
{id:"c3q84",ch:3,t:"s",q:"武昌起义后各省宣布独立时，担任都督的许多是",o:["旧官僚和立宪派","无产阶级革命者","农民领袖","外国顾问"],a:"A",x:"各省独立多由旧官僚、立宪派把持政权，反映了革命的妥协性。",p:["辛亥革命"]},
{id:"c3q85",ch:3,t:"s",q:"中国同盟会的性质是",o:["资产阶级革命政党","无产阶级政党","地主阶级政党","农民群众组织"],a:"A",x:"同盟会是中国第一个全国性的资产阶级革命政党。",p:["革命组织"]},
{id:"c3q86",ch:3,t:"j",fs:6,q:"简述兴中会的创立及其意义。",
kw:["1894年","檀香山","革命团体","兴中会"],
ref:"1894年11月，孙中山在檀香山创立兴中会，提出「驱除鞑虏，恢复中国，创立合众政府」的誓词。兴中会是中国第一个资产阶级革命团体，它的成立标志着孙中山革命活动的开始，也标志着资产阶级民主革命运动的兴起。",p:["革命组织"]},
{id:"c3q87",ch:3,t:"j",fs:6,q:"简述同盟会的政治纲领及其革命性。",
kw:["驱除鞑虏","恢复中华","创立民国","平均地权","三民主义"],
ref:"同盟会的政治纲领是「驱除鞑虏，恢复中华，创立民国，平均地权」，后被孙中山概括为民族、民权、民生三大主义即三民主义。这一纲领反映了中国人民要求民族独立和民主权利的共同愿望，是比较完整而明确的资产阶级民主革命纲领，推动了中国民主革命运动的发展。",p:["革命组织"]},
{id:"c3q88",ch:3,t:"j",fs:6,q:"简述《中华民国临时约法》的主要内容及其意义。",
kw:["主权属于国民全体","责任内阁制","宪法性质"],
ref:"1912年3月，临时参议院制定并通过《中华民国临时约法》，随后由临时大总统孙中山公布。主要内容：规定中华民国的主权属于国民全体，国民一律平等，享有人身、财产等自由权利；确立三权分立的政治体制，实行责任内阁制。意义：它是中国历史上第一部具有资产阶级共和国宪法性质的法典，以法律形式肯定了民主共和制度，具有进步意义。",p:["辛亥革命"]},
{id:"c3q89",ch:3,t:"j",fs:6,q:"简述武昌起义的历史条件。",
kw:["民族危机","革命团体","保路运动","新军"],
ref:"武昌起义的历史条件：①民族危机加深，清政府腐败无能，革命形势日益成熟；②湖北的革命团体文学社、共进会在新军中长期开展革命宣传和组织工作，积蓄了革命力量；③四川保路运动蓬勃发展，清政府调湖北新军入川镇压，武昌防务空虚；④全国革命党人多次起义积累了经验，革命时机成熟。在上述条件下，1911年10月10日武昌起义爆发。",p:["辛亥革命"]},
{id:"c3q90",ch:3,t:"j",fs:6,q:"简述护国运动的过程及其意义。",
kw:["帝制","云南","取消帝制","民主共和"],
ref:"1915年12月袁世凯宣布接受帝制，改国号为中华帝国。12月25日，蔡锷、唐继尧等宣布云南独立，组织护国军讨袁，护国运动爆发。各省纷纷响应，袁世凯被迫于1916年3月取消帝制，不久在众叛亲离中死去。护国运动粉碎了袁世凯复辟帝制的阴谋，捍卫了民主共和制度。",p:["护国运动"]},
{id:"c3q91",ch:3,t:"j",fs:6,q:"简述二次革命爆发的背景和结果。",
kw:["宋教仁","刺杀","国民党","流亡日本"],
ref:"1912年同盟会改组为国民党，宋教仁积极争取国会多数席位、准备组织责任内阁，威胁到袁世凯的独裁统治。1913年3月，袁世凯派人刺杀宋教仁，随后以武力镇压革命力量，孙中山、黄兴号召南方各省讨袁，二次革命爆发。由于力量悬殊，二次革命很快失败，孙中山被迫流亡日本，继续坚持斗争。",p:["二次革命"]},
{id:"c3q92",ch:3,t:"l",fs:10,q:"试述辛亥革命失败的原因及其历史教训。",
kw:["帝国主义","封建势力","软弱性","妥协性","资产阶级共和国"],
ref:"辛亥革命失败的原因：客观原因方面，帝国主义和封建势力的联合破坏，袁世凯在帝国主义支持下窃取了革命的胜利果实；主观原因方面，中国资产阶级的软弱性和妥协性，没有提出彻底的反帝反封建的革命纲领，没有充分发动和依靠广大民众特别是农民，没有建立坚强有力的革命政党。历史教训：辛亥革命的失败证明，资产阶级共和国方案在中国行不通，资产阶级不可能领导中国民主革命取得胜利，中国民主革命的胜利必须有新的领导阶级和革命政党的领导。",p:["辛亥革命"]},
{id:"c3q93",ch:3,t:"l",fs:10,q:"试述袁世凯窃取辛亥革命胜利果实的过程。",
kw:["帝国主义","清帝退位","临时大总统","北京"],
ref:"武昌起义后，帝国主义列强支持袁世凯，清政府被迫起用袁世凯为内阁总理大臣。袁世凯以武力胁迫革命派议和，又借革命声势逼迫清帝退位，1912年2月12日清帝溥仪宣布退位。孙中山为促成共和，在清帝退位、袁世凯声明拥护共和的条件下辞职，3月袁世凯在北京就任中华民国临时大总统，随后临时政府迁往北京，辛亥革命的胜利果实最终被袁世凯窃取。",p:["辛亥革命"]},
{id:"c3q94",ch:3,t:"l",fs:10,q:"试述辛亥革命后孙中山为维护民主共和制度而进行的斗争及其结果。",
kw:["二次革命","护国运动","护法运动","失败"],
ref:"辛亥革命后，为维护民主共和制度，孙中山进行了不懈斗争：①1913年为反对袁世凯的独裁统治发动二次革命，因力量悬殊而失败，孙中山被迫流亡日本；②1915—1916年支持并推动护国运动，护国军讨袁，袁世凯被迫取消帝制，护国运动取得胜利；③1917年为反对段祺瑞拒绝恢复《临时约法》和国会发动护法运动，但受西南军阀排挤而失败；④1920—1922年再次举起护法旗帜，因陈炯明叛乱而失败。这些斗争的相继失败说明，依靠军阀和单纯军事斗争难以维护共和制度，旧民主主义革命道路在中国行不通。",p:["护法运动"]},
{id:"c3q95",ch:3,t:"l",fs:10,q:"试述武昌起义的经过及其历史意义。",
kw:["新军","黎元洪","推翻了清王朝","民主共和","武昌"],
ref:"1911年10月10日晚，武昌城内新军中的革命士兵发动起义，迅速占领武昌，随后光复汉口、汉阳，成立湖北军政府，推举黎元洪为都督。武昌起义得到各省响应，到1911年底已有十几个省宣布独立，清王朝统治土崩瓦解。武昌起义的历史意义：它打响了辛亥革命的第一枪，推动了全国革命高潮的到来，最终推翻了清王朝，结束了统治中国两千多年的封建君主专制制度，使民主共和观念深入人心，为中国的进步打开了闸门。",p:["辛亥革命"]},

/* ================= 第四章 ================= */
{id:"c4q31",ch:4,t:"s",q:"1915年9月，在上海创办《青年杂志》（后改名《新青年》）的是",o:["陈独秀","李大钊","胡适","鲁迅"],a:"A",x:"1915年9月陈独秀在上海创办《青年杂志》，标志着新文化运动的兴起。",p:["新文化运动"]},
{id:"c4q32",ch:4,t:"s",q:"新文化运动提倡的「德先生」和「赛先生」分别指",o:["自由与平等","民主与科学","新道德与新文学","自强与求富"],a:"B",x:"「德先生」「赛先生」即英文民主与科学的音译，是新文化运动的基本口号。",p:["新文化运动"]},
{id:"c4q33",ch:4,t:"s",q:"1917年，在《新青年》上发表《文学改良刍议》、提倡白话文的是",o:["陈独秀","鲁迅","胡适","钱玄同"],a:"C",x:"1917年1月胡适发表《文学改良刍议》，倡导白话文，是文学革命的发端。",p:["新文化运动"]},
{id:"c4q34",ch:4,t:"s",q:"新文化运动前期，其斗争锋芒主要指向",o:["以孔子为代表的儒家传统道德","帝国主义侵略势力","北洋军阀统治","买办资产阶级"],a:"A",x:"新文化运动把斗争锋芒指向以孔子为代表的儒家传统道德，提出「打倒孔家店」。",p:["新文化运动"]},
{id:"c4q35",ch:4,t:"s",q:"五四运动以前的新文化运动，就其性质而言是",o:["无产阶级社会主义革命运动","农民阶级的反封建运动","地主阶级的自救运动","资产阶级民主主义性质的思想启蒙运动"],a:"D",x:"五四前的新文化运动是资产阶级民主主义性质的思想启蒙运动，尚未脱离旧民主主义革命范畴。",p:["新文化运动"]},
{id:"c4q36",ch:4,t:"s",q:"下列不属于新文化运动前期主要内容的是",o:["提倡民主与科学","提倡君主立宪","提倡新道德","提倡新文学"],a:"B",x:"新文化运动前期提倡民主与科学、新道德、新文学，并不提倡君主立宪。",p:["新文化运动"]},
{id:"c4q37",ch:4,t:"s",q:"1917年，出任北京大学校长并实行「兼容并包、思想自由」办学方针的是",o:["陈独秀","李大钊","蔡元培","胡适"],a:"C",x:"1917年蔡元培任北大校长，兼容并包、思想自由，使北大成为新文化运动中心。",p:["新文化运动"]},
{id:"c4q38",ch:4,t:"s",q:"五四运动以后，新文化运动的发展方向是",o:["传播马克思主义","提倡白话文","宣传民主与科学","开展平民教育"],a:"A",x:"五四运动后马克思主义广泛传播并成为新文化运动的主流，新文化运动进入新阶段。",p:["新文化运动"]},
{id:"c4q39",ch:4,t:"s",q:"1919年巴黎和会上，列强决定把德国在山东的权益转让给",o:["英国","法国","美国","日本"],a:"D",x:"巴黎和会拒绝中国收回山东主权的要求，把德国在山东的权益转让给日本。",p:["五四运动"]},
{id:"c4q40",ch:4,t:"s",q:"五四运动中，最先奋起反抗、起了先锋作用的是",o:["工人阶级","青年学生","民族资产阶级","农民阶级"],a:"B",x:"五四运动中青年学生最先奋起反抗，起了先锋作用，工人阶级后来成为主力。",p:["五四运动"]},
{id:"c4q41",ch:4,t:"s",q:"五四运动后期，运动中心由北京转移到上海后，运动的主力是",o:["青年学生","城市市民","工人阶级","民族资产阶级"],a:"C",x:"1919年6月3日后上海工人大罢工，工人阶级以独立姿态登上政治舞台成为主力。",p:["五四运动"]},
{id:"c4q42",ch:4,t:"s",q:"下列不属于五四运动直接斗争成果的是",o:["收回山东主权","罢免曹汝霖等卖国贼职务","释放被捕学生","拒绝在和约上签字"],a:"A",x:"五四运动迫使北洋政府罢免卖国贼、释放被捕学生并拒签和约，但山东主权并未收回。",p:["五四运动"]},
{id:"c4q43",ch:4,t:"s",q:"五四运动中，北洋政府被迫罢免的三个卖国贼是",o:["曹锟、吴佩孚、张作霖","段祺瑞、徐世昌、黎元洪","冯国璋、王占元、张勋","曹汝霖、章宗祥、陆宗舆"],a:"D",x:"在全国人民斗争下，北洋政府被迫罢免曹汝霖、章宗祥、陆宗舆三个卖国贼职务。",p:["五四运动"]},
{id:"c4q44",ch:4,t:"s",q:"标志着中国旧民主主义革命终结、新民主主义革命开端的历史事件是",o:["辛亥革命","五四运动","中国共产党成立","国民革命"],a:"B",x:"五四运动是中国旧民主主义革命的终结和新民主主义革命的开端，具有划时代意义。",p:["五四运动"]},
{id:"c4q45",ch:4,t:"s",q:"五四运动促进了马克思主义在中国的传播，并使其开始同",o:["学生运动相结合","农民运动相结合","中国工人运动相结合","资产阶级改良运动相结合"],a:"C",x:"五四运动促进马克思主义与中国工人运动相结合，为中国共产党成立准备了条件。",p:["五四运动"]},
{id:"c4q46",ch:4,t:"s",q:"1918年，李大钊发表欢呼十月革命胜利、指出「试看将来的环球，必是赤旗的世界」的文章是",o:["《布尔什维主义的胜利》","《庶民的胜利》","《法俄革命之比较观》","《我的马克思主义观》"],a:"A",x:"1918年李大钊发表《布尔什维主义的胜利》，热情欢呼俄国十月革命的胜利。",p:["马克思主义传播"]},
{id:"c4q47",ch:4,t:"s",q:"1919年，主编《新青年》「马克思主义研究专号」、推动马克思主义传播的是",o:["陈独秀","胡适","瞿秋白","李大钊"],a:"D",x:"1919年李大钊主编《新青年》马克思主义研究专号，系统宣传马克思主义学说。",p:["马克思主义传播"]},
{id:"c4q48",ch:4,t:"s",q:"中共一大召开时，全国共有共产党员",o:["100多名","50多名","200多名","500多名"],a:"B",x:"中共一大召开时，全国党员仅50多名，分布在各地共产党早期组织中。",p:["中国共产党诞生"]},
{id:"c4q49",ch:4,t:"s",q:"1920年秋冬，在长沙建立共产党早期组织的是",o:["陈独秀","李大钊","毛泽东","董必武"],a:"C",x:"1920年秋冬，毛泽东、何叔衡等人在长沙建立共产党早期组织。",p:["马克思主义传播"]},
{id:"c4q50",ch:4,t:"s",q:"1920年10月，在北京建立共产党早期组织的是",o:["李大钊","陈独秀","邓中夏","张国焘"],a:"A",x:"1920年10月，李大钊等人在北京建立共产党早期组织。",p:["马克思主义传播"]},
{id:"c4q51",ch:4,t:"s",q:"中共一大确定党的中心工作是",o:["发动农民运动","开展武装斗争","建立革命根据地","领导和组织工人运动"],a:"D",x:"中共一大确定党的中心任务是领导和组织工人运动，此后成立了中国劳动组合书记部。",p:["中共一大"]},
{id:"c4q52",ch:4,t:"s",q:"中共一大最后一天会议转移到浙江嘉兴南湖游船上举行，其直接原因是",o:["为躲避北洋军阀追捕","会场遭到法国巡捕搜查","便于代表游览参观","应上海租界当局要求"],a:"B",x:"中共一大开会期间会场遭法租界巡捕搜查，最后一天转移到嘉兴南湖游船继续举行。",p:["中共一大"]},
{id:"c4q53",ch:4,t:"s",q:"中共一大确定党的名称是",o:["社会党","中国社会党","中国共产党","工人党"],a:"C",x:"中共一大确定党的名称为中国共产党，并通过了党的第一个纲领和第一个决议。",p:["中共一大"]},
{id:"c4q54",ch:4,t:"s",q:"中共二大召开的时间和地点是",o:["1922年7月，上海","1921年7月，上海","1922年1月，广州","1923年6月，广州"],a:"A",x:"1922年7月，中共二大在上海召开，提出了反帝反封建的民主革命纲领。",p:["中共二大"]},
{id:"c4q55",ch:4,t:"s",q:"中共二大提出的党的最高纲领是",o:["打倒军阀","推翻帝国主义压迫","统一中国为民主共和国","实现社会主义、共产主义"],a:"D",x:"中共二大最高纲领是实现社会主义、共产主义，最低纲领即民主革命纲领。",p:["中共二大"]},
{id:"c4q56",ch:4,t:"s",q:"中共二大民主革命纲领中提出的国家建设目标是",o:["建立中华民国","实行联邦制","建立联合政府","统一中国为真正的民主共和国"],a:"D",x:"中共二大纲领提出统一中国为真正的民主共和国，与党的最高纲领相区别。",p:["中共二大"]},
{id:"c4q57",ch:4,t:"s",q:"上海共产党早期组织创办的向工人宣传马克思主义的刊物是",o:["《新青年》","《每周评论》","《劳动界》","《湘江评论》"],a:"C",x:"上海共产党早期组织创办《劳动界》等刊物，向工人群众宣传马克思主义。",p:["马克思主义传播"]},
{id:"c4q58",ch:4,t:"s",q:"中国工人运动第一次高潮的时间是",o:["1922年1月至1923年2月","1921年7月至1922年1月","1923年2月至1924年1月","1924年1月至1925年5月"],a:"A",x:"1922年1月至1923年2月形成中国工人运动第一次高潮。",p:["工人运动"]},
{id:"c4q59",ch:4,t:"s",q:"1922年9月，在毛泽东、李立三、刘少奇领导下取得胜利的罢工是",o:["香港海员罢工","京汉铁路工人大罢工","上海工人大罢工","安源路矿工人大罢工"],a:"D",x:"1922年9月安源路矿工人大罢工取得胜利，是党领导工人运动的成功范例。",p:["工人运动"]},
{id:"c4q60",ch:4,t:"s",q:"1923年2月，京汉铁路总工会成立的地点是",o:["武汉","郑州","北京","长辛店"],a:"B",x:"1923年2月京汉铁路总工会在郑州成立，随即遭到军阀吴佩孚的破坏。",p:["工人运动"]},
{id:"c4q61",ch:4,t:"s",q:"中国工人运动第一次高潮的顶点（最高潮）是",o:["香港海员罢工","安源路矿工人罢工","京汉铁路工人大罢工","开滦五矿工人罢工"],a:"C",x:"1923年2月京汉铁路工人大罢工把第一次工人运动高潮推向顶点。",p:["工人运动"]},
{id:"c4q62",ch:4,t:"s",q:"京汉铁路工人大罢工的时间是",o:["1923年2月","1922年1月","1922年9月","1925年5月"],a:"A",x:"1923年2月京汉铁路工人大罢工把第一次工人运动高潮推向顶点，旋遭镇压。",p:["工人运动"]},
{id:"c4q63",ch:4,t:"s",q:"1924年1月，在广州主持召开国民党第一次全国代表大会的是",o:["蒋介石","廖仲恺","宋庆龄","孙中山"],a:"D",x:"1924年1月孙中山在广州主持召开国民党一大，实现了第一次国共合作。",p:["国共合作"]},
{id:"c4q64",ch:4,t:"s",q:"1924年1月，国民党一大确立的三大政策是",o:["民族、民权、民生","联俄、联共、扶助农工","联美、联英、扶助农工","驱除鞑虏、恢复中华"],a:"B",x:"国民党一大确立联俄、联共、扶助农工三大政策，重新解释了三民主义。",p:["国共合作"]},
{id:"c4q65",ch:4,t:"s",q:"新三民主义中，民族主义的新内容是",o:["驱除鞑虏，恢复中华","建立五族共和","对外反对帝国主义，对内各民族一律平等","实行民族同化"],a:"C",x:"新三民主义的民族主义提出对外反对帝国主义、对内各民族一律平等的主张。",p:["新三民主义"]},
{id:"c4q66",ch:4,t:"s",q:"新三民主义中，民权主义的新内容是",o:["主张民权为一般平民所共有，实行普遍平等的民权","建立资产阶级共和国","实行五权分立","主权属于皇室"],a:"A",x:"新三民主义的民权主义主张民权为一般平民所共有，实行普遍平等的民权。",p:["新三民主义"]},
{id:"c4q67",ch:4,t:"s",q:"新三民主义中，民生主义的新内容是",o:["平均地权、核定地价","节制私人资本","发展国家资本主义","平均地权、节制资本，并主张耕者有其田"],a:"D",x:"新三民主义的民生主义提出平均地权、节制资本，并主张耕者有其田。",p:["新三民主义"]},
{id:"c4q68",ch:4,t:"s",q:"新三民主义之所以成为第一次国共合作的政治基础，是因为它与中国共产党的民主革命纲领",o:["完全相同","在若干基本原则方面基本一致","毫无联系","根本对立"],a:"B",x:"新三民主义与中共民主革命纲领的若干基本原则基本一致，故成为国共合作的政治基础。",p:["国共合作"]},
{id:"c4q69",ch:4,t:"s",q:"黄埔军校与以往军校最显著的不同在于",o:["只重军事技术训练","只重文化知识教育","实行政治教育与军事训练并重","以培养北洋军阀军官为目标"],a:"C",x:"黄埔军校把政治教育提到与军事训练同等重要的地位，是国共合作的产物。",p:["国民革命"]},
{id:"c4q70",ch:4,t:"s",q:"1925年，黄埔学生军扩编为国民革命军第一军后，担任军长的是",o:["蒋介石","周恩来","廖仲恺","何应钦"],a:"A",x:"1925年黄埔学生军扩编为国民革命军第一军，蒋介石任军长，周恩来任政治部主任。",p:["国民革命"]},
{id:"c4q71",ch:4,t:"s",q:"五卅运动爆发的直接导火线是",o:["英国巡捕枪杀游行群众","日本领事馆拒绝中国政府要求","上海租界当局逮捕学生","上海日商纱厂资本家枪杀工人顾正红"],a:"D",x:"1925年5月上海日商纱厂资本家枪杀工人顾正红，成为五卅运动的直接导火线。",p:["国民革命"]},
{id:"c4q72",ch:4,t:"s",q:"1925年5月30日，英国巡捕在上海南京路枪杀游行群众，制造的惨案是",o:["「二七」惨案","「五卅」惨案","「沙基」惨案","「四一二」政变"],a:"B",x:"1925年5月30日英国巡捕枪杀游行群众，制造「五卅」惨案，引发反帝爱国运动高潮。",p:["国民革命"]},
{id:"c4q73",ch:4,t:"s",q:"为声援五卅运动，1925年6月爆发的坚持16个月之久的世界工运史上时间最长的罢工是",o:["香港海员罢工","安源路矿工人罢工","省港大罢工","京汉铁路工人大罢工"],a:"C",x:"1925年6月省港大罢工坚持16个月之久，是世界工人运动史上时间最长的一次罢工。",p:["国民革命"]},
{id:"c4q74",ch:4,t:"s",q:"1926年3月，蒋介石制造的打击共产党和国民党左派的事件是",o:["中山舰事件","整理党务案","四一二政变","七一五政变"],a:"A",x:"1926年3月蒋介石制造中山舰事件，是国民党右派阴谋叛变革命的重要信号。",p:["国民革命"]},
{id:"c4q75",ch:4,t:"s",q:"1926年5月，蒋介石提出、旨在限制共产党和篡夺国民党党权的议案是",o:["中山舰事件","清党运动","训政纲领","整理党务案"],a:"D",x:"1926年5月蒋介石提出整理党务案，进一步限制和排挤共产党。",p:["国民革命"]},
{id:"c4q76",ch:4,t:"s",q:"北伐战争正式开始的时间是",o:["1925年5月","1926年7月","1927年4月","1924年1月"],a:"B",x:"1926年7月国民革命军在广州誓师北伐，北伐战争正式开始。",p:["北伐战争"]},
{id:"c4q77",ch:4,t:"s",q:"北伐战争中，以英勇善战而闻名、被誉为「铁军」的是",o:["国民革命军第一军","国民革命军第六军","叶挺独立团所在的第四军","国民革命军第七军"],a:"C",x:"北伐战争中叶挺独立团英勇善战，所在第四军被誉为「铁军」。",p:["北伐战争"]},
{id:"c4q78",ch:4,t:"s",q:"1927年1月，汉口、九江人民收回的租界是",o:["英租界","法租界","日租界","美租界"],a:"A",x:"1927年初汉口、九江工人市民收回英租界，是中国人民反帝斗争的重大胜利。",p:["北伐战争"]},
{id:"c4q79",ch:4,t:"s",q:"1927年7月15日，在武汉发动反革命政变、导致第一次国共合作全面破裂的是",o:["蒋介石","冯玉祥","张作霖","汪精卫"],a:"D",x:"1927年7月15日汪精卫在武汉发动「七一五」反革命政变，国共合作全面破裂。",p:["国民革命"]},
{id:"c4q80",ch:4,t:"s",q:"国民革命失败的主观原因是",o:["帝国主义和封建势力力量过于强大","陈独秀右倾机会主义错误，放弃了无产阶级对革命的领导权","国民党右派叛变革命","工农运动发展不平衡"],a:"B",x:"主观上是陈独秀右倾机会主义错误、放弃领导权，加上党处于幼年缺乏经验。",p:["国民革命"]},
{id:"c4q81",ch:4,t:"s",q:"下列关于国民革命历史意义的表述，正确的是",o:["彻底完成了反帝反封建的革命任务","建立了工农民主专政的政权","基本上推翻了北洋军阀的统治","实现了国家的完全统一"],a:"C",x:"国民革命基本上推翻了北洋军阀的统治，但并未完成反帝反封建的任务。",p:["国民革命"]},
{id:"c4q82",ch:4,t:"s",q:"五四运动以前的新文化运动存在局限性，其主要表现是",o:["没有马克思主义指导，未能同群众运动相结合","过于强调武装斗争","完全否定外国文化","主张全盘西化"],a:"A",x:"五四前的新文化运动没有马克思主义指导，未能同群众运动相结合，方法上存在绝对化偏向。",p:["新文化运动"]},
{id:"c4q83",ch:4,t:"s",q:"五四运动后期，上海人民举行的「三罢」斗争是指",o:["工人罢工、农民抗税、商人罢市","学生罢课、职员罢业、军人哗变","工人罢工、学生罢课、军队抗命","工人罢工、学生罢课、商人罢市"],a:"D",x:"五四运动后期上海出现工人罢工、学生罢课、商人罢市的「三罢」斗争。",p:["五四运动"]},
{id:"c4q84",ch:4,t:"s",q:"五四运动后，毛泽东在长沙创办的宣传新思想的著名刊物是",o:["《新青年》","《湘江评论》","《每周评论》","《劳动界》"],a:"B",x:"1919年毛泽东在长沙创办《湘江评论》，宣传反帝反封建的新思想。",p:["马克思主义传播"]},
{id:"c4q85",ch:4,t:"s",q:"「二七」惨案后，中国工人运动的状况是",o:["继续蓬勃发展","迅速转向农村","第一次高潮转入低潮","立即爆发更大罢工"],a:"C",x:"「二七」惨案后，京汉铁路罢工被镇压，中国工人运动第一次高潮转入低潮。",p:["工人运动"]},
{id:"c4q86",ch:4,t:"j",fs:6,q:"简述五四运动前新文化运动的主要内容。",kw:["民主与科学","新道德","新文学","白话文"],ref:"新文化运动的主要内容是：提倡民主与科学，反对专制和迷信盲从；提倡新道德，反对旧道德，抨击以孔子为代表的儒家传统道德；提倡新文学，反对旧文学，主张以白话文代替文言文。胡适发表《文学改良刍议》提倡白话文，陈独秀发表《文学革命论》倡导文学革命。",p:["新文化运动"]},
{id:"c4q87",ch:4,t:"j",fs:6,q:"简述五四运动取得初步胜利的表现。",kw:["释放","曹汝霖","章宗祥","陆宗舆","拒绝","和约"],ref:"在广大人民的坚决斗争下，五四运动取得了初步胜利，北洋政府被迫释放被捕学生，罢免了曹汝霖、章宗祥、陆宗舆三个卖国贼的职务，中国代表拒绝在巴黎和约上签字。",p:["五四运动"]},
{id:"c4q88",ch:4,t:"j",fs:6,q:"简述中国共产党成立的历史特点。",kw:["十月革命","马克思列宁主义","工人运动","社会改良主义"],ref:"中国共产党是在特殊的社会历史条件下成立的：它成立于俄国十月革命胜利、第二国际修正主义破产之后，所接受的马克思主义是完整的科学世界观和社会革命论；它是在半殖民地半封建中国的工人运动基础上产生的，中国工人阶级身受三重压迫，革命最坚决最彻底；中国共产党一开始就是一个以马克思列宁主义为指导思想的党，没有受到社会改良主义的影响。",p:["中国共产党诞生"]},
{id:"c4q89",ch:4,t:"j",fs:6,q:"简述第一次国共合作建立的意义。",kw:["革命统一战线","黄埔军校","工农运动","北伐"],ref:"1924年国民党一大召开，以国共合作为基础的革命统一战线正式建立，推动了国民革命的发展，创办了黄埔军校，培养了大批军事政治人才；推动了工农运动的恢复和发展，掀起五卅运动、省港大罢工等反帝爱国运动的高潮；为北伐战争准备了条件，1926年开始的北伐战争基本上推翻了北洋军阀的统治。",p:["国共合作"]},
{id:"c4q90",ch:4,t:"j",fs:6,q:"简述新三民主义的主要内容。",kw:["民族主义","民权主义","民生主义","平均地权","节制资本","耕者有其田"],ref:"新三民主义在民族主义方面，提出对外反对帝国主义、对内各民族一律平等的主张；在民权主义方面，主张民权为一般平民所共有，实行普遍平等的民权；在民生主义方面，提出平均地权和节制资本两大原则，并主张耕者有其田。",p:["新三民主义"]},
{id:"c4q91",ch:4,t:"j",fs:6,q:"简述国民革命失败的原因。",kw:["帝国主义","封建势力","汪精卫","蒋介石","陈独秀","右倾"],ref:"国民革命失败的原因，客观上由于帝国主义和封建势力的联合力量大大超过革命力量，加上国民党右派蒋介石、汪精卫先后叛变革命；主观上由于陈独秀右倾机会主义错误，放弃了无产阶级对革命的领导权，加上中国共产党还处于幼年时期，缺乏革命经验。",p:["国民革命"]},
{id:"c4q92",ch:4,t:"l",fs:10,q:"试述五四运动的历史意义及其与中国共产党的创建的关系。",kw:["彻底反帝反封建","群众运动","工人阶级","马克思主义","新民主主义革命","干部"],ref:"五四运动是一次彻底反帝反封建的革命运动，也是一次真正的群众运动，青年学生起了先锋作用，中国工人阶级开始以独立的姿态登上政治舞台，促进了马克思主义在中国的传播及其与中国工人运动的结合。五四运动是中国新民主主义革命的开端。五四运动中，中国工人阶级登上政治舞台，马克思主义进一步传播，为中国共产党的成立作了思想上和干部上的准备。",p:["五四运动"]},
{id:"c4q93",ch:4,t:"l",fs:10,q:"试述中共二大民主革命纲领的内容及其意义。",kw:["打倒军阀","帝国主义","完全独立","民主共和国","反帝反封建"],ref:"1922年中共二大制定了民主革命纲领，即最低纲领：消除内乱，打倒军阀，建设国内和平；推翻国际帝国主义的压迫，达到中华民族完全独立；统一中国为真正的民主共和国。中共二大第一次提出了彻底的反帝反封建的民主革命纲领，为中国人民指明了革命斗争的正确方向。",p:["中共二大"]},
{id:"c4q94",ch:4,t:"l",fs:10,q:"试述第一次国共合作的政治基础及其历史意义。",kw:["新三民主义","联俄","联共","扶助农工","基本一致","北伐战争"],ref:"第一次国共合作的政治基础是新三民主义。1924年国民党一大确立了联俄、联共、扶助农工三大政策，重新解释三民主义，使旧三民主义发展为新三民主义。新三民主义与中国共产党民主革命纲领的若干基本原则基本一致，因而成为国共合作的政治基础。国共合作的实现推动了国民革命的发展，掀起了工农运动的高潮，为北伐战争的胜利进军准备了条件，但1927年蒋介石、汪精卫相继叛变革命，第一次国共合作破裂。",p:["国共合作"]},
{id:"c4q95",ch:4,t:"l",fs:10,q:"试述国民革命的历史意义和失败教训。",kw:["北洋军阀","帝国主义","陈独秀","右倾机会主义","领导权","革命武装"],ref:"国民革命的历史意义：基本推翻了北洋军阀的统治，沉重打击了帝国主义和封建势力，扩大了中国共产党在人民群众中的政治影响，党还开始掌握了一部分革命武装。国民革命失败的教训是：由于陈独秀右倾机会主义错误，放弃了无产阶级在革命中的领导权，加上党处于幼年时期缺乏经验，没有巩固革命统一战线，导致革命失败。这说明，中国共产党必须坚持无产阶级领导权，掌握革命武装，才能取得革命的胜利。",p:["国民革命"]},

/* ================= 第五章 ================= */
{id:"c5q28",ch:5,t:"s",q:"1927年4月18日，蒋介石在南京建立的政权是",o:["南京国民政府","武汉国民政府","北洋政府","伪国民政府"],a:"A",x:"1927年4月18日蒋介石在南京建立国民政府，与武汉国民政府对峙。",p:["国民党统治"]},
{id:"c5q29",ch:5,t:"s",q:"1928年10月，国民党中央常务委员会通过、标志着国民党一党专政统治确立的文件是",o:["《中华民国临时约法》","《训政纲领》","《五权宪法》","《国民政府组织法》"],a:"B",x:"1928年10月《训政纲领》的通过，标志着国民党一党专政统治的确立。",p:["国民党统治"]},
{id:"c5q30",ch:5,t:"s",q:"国民党在全国统治确立后，中国的社会性质仍然是",o:["殖民地社会","资本主义社会","半殖民地半封建社会","封建社会"],a:"C",x:"国民党统治建立后，中国社会仍然是半殖民地半封建社会，主要矛盾没有改变。",p:["国民党统治"]},
{id:"c5q31",ch:5,t:"s",q:"1925年成立、以「求中华民族之解放」为宗旨的中间党派是",o:["中国国民党临时行动委员会","中国国家社会党","中国民主同盟","中国青年党"],a:"D",x:"1925年12月中国青年党成立，主张国家主义，反对共产主义。",p:["中间党派"]},
{id:"c5q32",ch:5,t:"s",q:"中间党派不满意国民党的独裁统治，也不赞成共产主义，其基本主张是",o:["改良主义","暴力革命","武装割据","君主立宪"],a:"A",x:"中间党派的基本主张是改良主义，希望通过和平改良建立资产阶级共和国。",p:["中间党派"]},
{id:"c5q33",ch:5,t:"s",q:"以蒋介石、宋子文、孔祥熙和陈果夫、陈立夫为代表的官僚资本，是",o:["民族工商业发展形成的","依靠国家政权聚敛财富形成的","外资企业转化来的","土地改革积累起来的"],a:"B",x:"官僚资本依靠国家政权，通过发行公债、增加捐税、垄断金融等手段聚敛财富。",p:["国民党统治"]},
{id:"c5q34",ch:5,t:"s",q:"国民党统治时期，民族资本主义工业的状况是",o:["迅速发展","摆脱外国资本控制","陷于发展困境，日益萎缩","与官僚资本合流"],a:"C",x:"在帝国主义和官僚资本双重压迫下，民族资本主义工业发展艰难，陷于困境。",p:["国民党统治"]},
{id:"c5q35",ch:5,t:"s",q:"1927年9月，南京国民政府与武汉国民政府合并，史称",o:["东北易帜","中原大战","训政开始","宁汉合流"],a:"D",x:"1927年9月宁汉合流，国民党各派暂时统一于南京国民政府。",p:["国民党统治"]},
{id:"c5q36",ch:5,t:"s",q:"南昌起义的主要领导人是",o:["周恩来、贺龙、叶挺、朱德、刘伯承","毛泽东、朱德、彭德怀","张太雷、叶挺、叶剑英","陈毅、聂荣臻、罗荣桓"],a:"A",x:"南昌起义由周恩来、贺龙、叶挺、朱德、刘伯承等领导，打响了武装反抗第一枪。",p:["南昌起义"]},
{id:"c5q37",ch:5,t:"s",q:"1928年4月，朱德、陈毅率南昌起义余部与毛泽东领导的工农革命军会师的地点是",o:["瑞金","井冈山","延安","遵义"],a:"B",x:"1928年4月朱德、陈毅率南昌起义余部与毛泽东在井冈山会师。",p:["南昌起义"]},
{id:"c5q38",ch:5,t:"s",q:"八七会议召开的时间和地点是",o:["1927年8月1日，南昌","1927年9月9日，长沙","1927年8月7日，汉口","1927年12月11日，广州"],a:"C",x:"1927年8月7日，中共中央在汉口秘密召开紧急会议，即八七会议。",p:["八七会议"]},
{id:"c5q39",ch:5,t:"s",q:"八七会议上，毛泽东提出的著名论断是",o:["「枪杆子里面出政权」","「农村包围城市」","「打土豪，分田地」","「须知政权是由枪杆子中取得的」"],a:"D",x:"八七会议上毛泽东强调「须知政权是由枪杆子中取得的」，重视武装斗争。",p:["八七会议"]},
{id:"c5q40",ch:5,t:"s",q:"毛泽东领导湘赣边界秋收起义的时间是",o:["1927年9月9日","1927年8月1日","1927年12月11日","1928年4月"],a:"A",x:"1927年9月9日，毛泽东领导的湘赣边界秋收起义爆发。",p:["秋收起义"]},
{id:"c5q41",ch:5,t:"s",q:"秋收起义与南昌起义相比，公开打出的旗帜是",o:["国民革命军的旗帜","工农革命军的旗帜","红军的旗帜","北伐军的旗帜"],a:"B",x:"秋收起义公开打出「工农革命军」的旗帜，不再沿用国民革命军番号。",p:["秋收起义"]},
{id:"c5q42",ch:5,t:"s",q:"秋收起义受挫后，毛泽东在文家市主持召开前委会议，决定起义部队",o:["继续攻打中心城市长沙","北上与南昌起义部队会合","转向敌人统治力量薄弱的农村","撤回广东休整"],a:"C",x:"文家市前委会议决定放弃攻打长沙，转向敌人统治力量薄弱的农村进军。",p:["秋收起义"]},
{id:"c5q43",ch:5,t:"s",q:"1927年12月广州起义的主要领导人是",o:["周恩来、贺龙","毛泽东","彭湃","张太雷、叶挺、叶剑英"],a:"D",x:"1927年12月广州起义由张太雷、叶挺、叶剑英等领导。",p:["广州起义"]},
{id:"c5q44",ch:5,t:"s",q:"毛泽东率秋收起义部队在江西永新县三湾村进行改编的时间是",o:["1927年9月","1927年8月","1927年10月","1928年4月"],a:"A",x:"1927年9月29日毛泽东率秋收起义部队到达三湾村，进行三湾改编。",p:["三湾改编"]},
{id:"c5q45",ch:5,t:"s",q:"三湾改编中，将党的支部建在连上，其根本目的是",o:["提高部队战斗力","确立党对军队的绝对领导","加强军事训练","改善官兵关系"],a:"B",x:"三湾改编确立党对军队绝对领导的原则，保证党的路线方针在军队中贯彻执行。",p:["三湾改编"]},
{id:"c5q46",ch:5,t:"s",q:"三湾改编中，废除旧军队的雇佣制，在军队内部实行的是",o:["军饷制","等级制","官兵平等、民主管理","军衔制"],a:"C",x:"三湾改编在军队内部实行民主制度，废除雇佣制，实现官兵平等。",p:["三湾改编"]},
{id:"c5q47",ch:5,t:"s",q:"井冈山革命根据地地处",o:["江西、福建两省边界","湖南、湖北两省边界","广东、江西两省边界","湖南、江西两省边界"],a:"D",x:"井冈山革命根据地位于湖南、江西两省交界的罗霄山脉中段。",p:["井冈山根据地"]},
{id:"c5q48",ch:5,t:"s",q:"1928年4月，朱德、毛泽东井冈山会师后，两军合编为",o:["中国工农红军第四军","中国工农红军第一军","中国工农红军第二军","中国工农红军第五军"],a:"A",x:"1928年4月朱毛会师后合编为中国工农红军第四军，朱德任军长，毛泽东任党代表。",p:["井冈山根据地"]},
{id:"c5q49",ch:5,t:"s",q:"毛泽东总结井冈山红军作战经验提出的游击战争「十六字诀」是",o:["诱敌深入，集中兵力，各个击破","敌进我退，敌驻我扰，敌疲我打，敌退我追","避敌主力，打其虚弱","围点打援，声东击西"],a:"B",x:"十六字诀即敌进我退，敌驻我扰，敌疲我打，敌退我追，是红军游击战争原则。",p:["井冈山根据地"]},
{id:"c5q50",ch:5,t:"s",q:"1929年1月，毛泽东、朱德率红四军主力进军赣南、闽西，开辟的革命根据地是",o:["鄂豫皖根据地","湘鄂西根据地","中央革命根据地","陕甘根据地"],a:"C",x:"1929年后红四军主力开辟赣南、闽西根据地，后发展为中央革命根据地。",p:["农村根据地"]},
{id:"c5q51",ch:5,t:"s",q:"古田会议召开的时间是",o:["1928年4月","1927年9月","1931年11月","1929年12月"],a:"D",x:"1929年12月，红四军党的第九次代表大会在福建上杭古田召开。",p:["古田会议"]},
{id:"c5q52",ch:5,t:"s",q:"1928年10月，毛泽东撰写、系统阐述「工农武装割据」思想的著作是",o:["《中国的红色政权为什么能够存在》","《星星之火，可以燎原》","《井冈山的斗争》","《反对本本主义》"],a:"A",x:"1928年10月毛泽东撰写《中国的红色政权为什么能够存在》，提出「工农武装割据」思想。",p:["农村包围城市"]},
{id:"c5q53",ch:5,t:"s",q:"「工农武装割据」思想中，作为中心内容的是",o:["武装斗争","土地革命","根据地建设","党的建设"],a:"B",x:"工农武装割据思想以土地革命为中心内容，以武装斗争为主要形式，以根据地为战略阵地。",p:["农村包围城市"]},
{id:"c5q54",ch:5,t:"s",q:"1930年5月，毛泽东撰写、强调「没有调查，没有发言权」的著作是",o:["《星星之火，可以燎原》","《井冈山的斗争》","《反对本本主义》","《矛盾论》"],a:"C",x:"1930年5月毛泽东撰写《反对本本主义》，强调调查研究，反对教条主义。",p:["农村包围城市"]},
{id:"c5q55",ch:5,t:"s",q:"土地革命战争时期，中国共产党开辟的革命道路是",o:["城市中心暴动","议会斗争","和平过渡","农村包围城市、武装夺取政权"],a:"D",x:"大革命失败后，党在实践中逐步开辟了农村包围城市、武装夺取政权的道路。",p:["农村包围城市"]},
{id:"c5q56",ch:5,t:"s",q:"农村包围城市革命道路的核心，是把党的工作重心放在",o:["农村","城市","军队","学校"],a:"A",x:"农村包围城市道路的核心是把党的工作重心放在农村，在农村积蓄发展革命力量。",p:["农村包围城市"]},
{id:"c5q57",ch:5,t:"s",q:"中国红色政权能够存在和发展的根本原因是",o:["中国幅员辽阔，物产丰富","中国是帝国主义间接统治的半殖民地国家，经济政治发展极不平衡","中国人口众多，群众基础好","中国军队装备精良"],a:"B",x:"半殖民地半封建中国经济政治发展极不平衡，军阀割据混战，是红色政权存在的客观条件。",p:["农村包围城市"]},
{id:"c5q58",ch:5,t:"s",q:"红色政权能够存在和发展的主观条件是",o:["北洋军阀力量弱小","国民党统治完全巩固","全国革命形势继续发展，有相当力量的正式红军，共产党组织有力量和政策的正确","帝国主义放松对中国的侵略"],a:"C",x:"全国革命形势继续发展、相当力量的正式红军的存在和共产党的正确领导，是主观条件。",p:["农村包围城市"]},
{id:"c5q59",ch:5,t:"s",q:"土地革命战争时期，中国共产党领导建立的面积最大的革命根据地是",o:["鄂豫皖根据地","湘鄂西根据地","川陕根据地","中央革命根据地"],a:"D",x:"中央革命根据地（中央苏区）是土地革命战争时期面积最大、人口最多的根据地。",p:["农村根据地"]},
{id:"c5q60",ch:5,t:"s",q:"1929年4月，毛泽东在兴国主持制定的土地法是",o:["《兴国土地法》","《井冈山土地法》","《中国土地法大纲》","《五四指示》"],a:"A",x:"1929年4月《兴国土地法》将「没收一切土地」改为「没收一切公共土地及地主阶级的土地」。",p:["土地革命"]},
{id:"c5q61",ch:5,t:"s",q:"土地革命时期，中国共产党制定的土地革命路线中，依靠的对象是",o:["中农","贫农、雇农","富农","地主"],a:"B",x:"土地革命路线规定依靠贫农、雇农，联合中农，限制富农，消灭地主阶级。",p:["土地革命"]},

{id:"c5q63",ch:5,t:"s",q:"1931年11月，中华苏维埃第一次全国代表大会通过的宪法文件是",o:["《中华民国临时约法》","《共同纲领》","《训政纲领》","《中华苏维埃共和国宪法大纲》"],a:"D",x:"1931年11月中华苏维埃一大通过《中华苏维埃共和国宪法大纲》等文件。",p:["中华苏维埃"]},

{id:"c5q65",ch:5,t:"s",q:"王明「左」倾教条主义的主要特征是",o:["经验主义","教条主义","宗派主义","投降主义"],a:"B",x:"王明「左」倾教条主义照搬共产国际指示和苏联经验，具有浓厚的教条主义特征。",p:["左倾错误"]},
{id:"c5q66",ch:5,t:"s",q:"王明「左」倾错误在中央苏区推行的过「左」土地政策是",o:["保护富农经济","联合中农","地主不分田，富农分坏田","没收一切土地"],a:"C",x:"王明「左」倾错误推行地主不分田、富农分坏田等政策，扩大了打击面。",p:["左倾错误"]},
{id:"c5q67",ch:5,t:"s",q:"第五次反「围剿」中，博古、李德采取的错误军事方针是",o:["积极防御，诱敌深入","游击战为主","运动战为主","先是冒险进攻，后又消极防御"],a:"D",x:"博古、李德在第五次反「围剿」中先冒险进攻、后消极防御，使红军损失惨重。",p:["左倾错误"]},

{id:"c5q71",ch:5,t:"s",q:"遵义会议后，代替博古在中共中央负总责的是",o:["张闻天","周恩来","王稼祥","朱德"],a:"A",x:"遵义会议后，张闻天代替博古在中共中央负总责。",p:["遵义会议"]},
{id:"c5q72",ch:5,t:"s",q:"遵义会议之所以是中国共产党从幼年走向成熟的标志，是因为它",o:["第一次独立自主地运用马克思主义基本原理解决自己的路线、方针和政策问题","确定了联俄联共政策","制定了民主革命纲领","建立了抗日民族统一战线"],a:"A",x:"遵义会议是党第一次独立自主地运用马克思主义基本原理解决自身重大问题，标志党走向成熟。",p:["遵义会议"]},
